services:
  - type: web
    name: aiteam-backend
    env: docker
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    region: oregon
    envVars:
      - key: GLM_API_KEY
        sync: false
      - key: GLM_MODEL
        value: glm-4-flash
      - key: GLM_CODING_MODEL
        value: glm-5
      - key: CORS_ORIGINS
        value: https://aiteam-frontend.onrender.com
      - key: PYTHONUNBUFFERED
        value: "1"
    disk:
      name: aiteam-data
      mountPath: /app/data
      sizeGB: 1
    healthCheckPath: /health

  - type: web
    name: aiteam-frontend
    env: static
    plan: free
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: frontend/dist
    region: oregon
    routes:
      - type: rewrite
        source: /api/*
        destination: https://aiteam-backend.onrender.com/api/:splat
      - type: rewrite
        source: /ws
        destination: https://aiteam-backend.onrender.com/ws
      - type: rewrite
        source: /*
        destination: /index.html
