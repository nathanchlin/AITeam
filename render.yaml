services:
  - type: web
    name: aiteam-backend
    env: docker
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    region: oregon
    envVars:
      - key: GLM_API_KEY
        sync: false
      - key: GLM_MODEL
        value: glm-4-flash
      - key: GLM_CODING_MODEL
        value: glm-5.1
      - key: CORS_ORIGINS
        value: https://aiteam.vercel.app
      - key: PYTHONUNBUFFERED
        value: "1"
    disk:
      name: aiteam-data
      mountPath: /app/data
      sizeGB: 1
    healthCheckPath: /health
