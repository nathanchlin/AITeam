<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>双玩家坦克大战</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #2c3e50;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            font-family: Arial, sans-serif;
        }
        
        #gameCanvas {
            background-color: #34495e;
            border: 2px solid #ecf0f1;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.5);
        }
        
        .controls {
            margin-top: 20px;
            color: #ecf0f1;
            text-align: center;
        }
        
        .player-controls {
            display: inline-block;
            margin: 0 20px;
            padding: 10px;
            background-color: rgba(52, 73, 94, 0.7);
            border-radius: 5px;
        }
        
        h2 {
            margin-top: 0;
            color: #3498db;
        }
    </style>
</head>
<body>
    <canvas id="gameCanvas" width="800" height="600"></canvas>
    
    <div class="controls">
        <div class="player-controls">
            <h2>玩家1 (蓝色)</h2>
            <p>移动: W A S D</p>
            <p>射击: 空格键</p>
        </div>
        
        <div class="player-controls">
            <h2>玩家2 (红色)</h2>
            <p>移动: 方向键</p>
            <p>射击: 回车键</p>
        </div>
    </div>

    <script>
        // 游戏常量
        const CANVAS_WIDTH = 800;
        const CANVAS_HEIGHT = 600;
        const TANK_SIZE = 30;
        const BULLET_SIZE = 5;
        const BULLET_SPEED = 8;
        const TANK_SPEED = 3;
        const OBSTACLE_SIZE = 40;
        const EXPLOSION_SIZE = 50;
        const EXPLOSION_DURATION = 30;
        
        // 游戏状态
        const game = {
            canvas: null,
            ctx: null,
            running: true,
            keys: {},
            obstacles: [],
            explosions: []
        };
        
        // 坦克类
        class Tank {
            constructor(x, y, color, controls) {
                this.x = x;
                this.y = y;
                this.width = TANK_SIZE;
                this.height = TANK_SIZE;
                this.color = color;
                this.angle = 0;
                this.controls = controls;
                this.bullets = [];
                this.lastShot = 0;
                this.shotCooldown = 300; // 毫秒
                this.speed = TANK_SPEED;
                this.health = 100;
            }
            
            update() {
                // 移动控制
                if (game.keys[this.controls.up]) {
                    this.x += Math.cos(this.angle) * this.speed;
                    this.y += Math.sin(this.angle) * this.speed;
                }
                if (game.keys[this.controls.down]) {
                    this.x -= Math.cos(this.angle) * this.speed;
                    this.y -= Math.sin(this.angle) * this.speed;
                }
                if (game.keys[this.controls.left]) {
                    this.angle -= 0.05;
                }
                if (game.keys[this.controls.right]) {
                    this.angle += 0.05;
                }
                
                // 射击控制
                if (game.keys[this.controls.shoot] && Date.now() - this.lastShot > this.shotCooldown) {
                    this.shoot();
                    this.lastShot = Date.now();
                }
                
                // 边界检查
                this.x = Math.max(this.width/2, Math.min(CANVAS_WIDTH - this.width/2, this.x));
                this.y = Math.max(this.height/2, Math.min(CANVAS_HEIGHT - this.height/2, this.y));
                
                // 更新子弹
                this.bullets = this.bullets.filter(bullet => {
                    bullet.update();
                    return bullet.active && this.isBulletInBounds(bullet);
                });
            }
            
            shoot() {
                const bullet = new Bullet(
                    this.x + Math.cos(this.angle) * this.width/2,
                    this.y + Math.sin(this.angle) * this.height/2,
                    this.angle,
                    this.color
                );
                this.bullets.push(bullet);
            }
            
            isBulletInBounds(bullet) {
                return bullet.x >= 0 && bullet.x <= CANVAS_WIDTH &&
                       bullet.y >= 0 && bullet.y <= CANVAS_HEIGHT;
            }
            
            draw() {
                game.ctx.save();
                game.ctx.translate(this.x, this.y);
                game.ctx.rotate(this.angle);
                
                // 绘制坦克主体
                game.ctx.fillStyle = this.color;
                game.ctx.fillRect(-this.width/2, -this.height/2, this.width, this.height);
                
                // 绘制坦克炮管
                game.ctx.fillStyle = this.color;
                game.ctx.fillRect(0, -this.width/8, this.width/1.5, this.width/4);
                
                // 绘制坦克中心
                game.ctx.fillStyle = '#2c3e50';
                game.ctx.beginPath();
                game.ctx.arc(0, 0, this.width/4, 0, Math.PI * 2);
                game.ctx.fill();
                
                game.ctx.restore();
                
                // 绘制子弹
                this.bullets.forEach(bullet => bullet.draw());
                
                // 绘制生命值条
                this.drawHealthBar();
            }
            
            drawHealthBar() {
                const barWidth = 40;
                const barHeight = 6;
                const barX = this.x - barWidth/2;
                const barY = this.y - this.height/2 - 10;
                
                // 背景
                game.ctx.fillStyle = '#e74c3c';
                game.ctx.fillRect(barX, barY, barWidth, barHeight);
                
                // 当前生命值
                game.ctx.fillStyle = '#2ecc71';
                game.ctx.fillRect(barX, barY, barWidth * (this.health / 100), barHeight);
                
                // 边框
                game.ctx.strokeStyle = '#ecf0f1';
                game.ctx.strokeRect(barX, barY, barWidth, barHeight);
            }
            
            takeDamage(amount) {
                this.health -= amount;
                if (this.health <= 0) {
                    this.health = 0;
                    this.explode();
                }
            }
            
            explode() {
                game.explosions.push(new Explosion(this.x, this.y));
            }
        }
        
        // 子弹类
        class Bullet {
            constructor(x, y, angle, color) {
                this.x = x;
                this.y = y;
                this.angle = angle;
                this.color = color;
                this.radius = BULLET_SIZE;
                this.speed = BULLET_SPEED;
                this.active = true;
            }
            
            update() {
                this.x += Math.cos(this.angle) * this.speed;
                this.y += Math.sin(this.angle) * this.speed;
                
                // 检查是否击中障碍物
                for (const obstacle of game.obstacles) {
                    if (this.checkCollision(obstacle)) {
                        this.active = false;
                        game.explosions.push(new Explosion(this.x, this.y));
                        return;
                    }
                }
                
                // 检查是否击中坦克
                const tanks = [player1, player2];
                for (const tank of tanks) {
                    if (tank !== this.owner && this.checkTankCollision(tank)) {
                        this.active = false;
                        tank.takeDamage(20);
                        game.explosions.push(new Explosion(this.x, this.y));
                        return;
                    }
                }
            }
            
            checkCollision(obstacle) {
                return this.x > obstacle.x - obstacle.width/2 &&
                       this.x < obstacle.x + obstacle.width/2 &&
                       this.y > obstacle.y - obstacle.height/2 &&
                       this.y < obstacle.y + obstacle.height/2;
            }
            
            checkTankCollision(tank) {
                const distance = Math.sqrt(
                    Math.pow(this.x - tank.x, 2) + 
                    Math.pow(this.y - tank.y, 2)
                );
                return distance < tank.width/2;
            }
            
            draw() {
                game.ctx.fillStyle = this.color;
                game.ctx.beginPath();
                game.ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                game.ctx.fill();
            }
        }
        
        // 障碍物类
        class Obstacle {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                this.width = OBSTACLE_SIZE;
                this.height = OBSTACLE_SIZE;
                this.color = '#7f8c8d';
            }
            
            draw() {
                game.ctx.fillStyle = this.color;
                game.ctx.fillRect(
                    this.x - this.width/2, 
                    this.y - this.height/2, 
                    this.width, 
                    this.height
                );
                
                // 添加纹理
                game.ctx.strokeStyle = '#95a5a6';
                game.ctx.lineWidth = 2;
                game.ctx.strokeRect(
                    this.x - this.width/2, 
                    this.y - this.height/2, 
                    this.width, 
                    this.height
                );
            }
        }
        
        // 爆炸效果类
        class Explosion {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                this.radius = 0;
                this.maxRadius = EXPLOSION_SIZE;
                this.duration = EXPLOSION_DURATION;
                this.frame = 0;
            }
            
            update() {
                this.frame++;
                this.radius = (this.frame / this.duration) * this.maxRadius;
                return this.frame < this.duration;
            }
            
            draw() {
                const alpha = 1 - (this.frame / this.duration);
                
                // 外圈
                game.ctx.fillStyle = `rgba(231, 76, 60, ${alpha})`;
                game.ctx.beginPath();
                game.ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                game.ctx.fill();
                
                // 内圈
                game.ctx.fillStyle = `rgba(241, 196, 15, ${alpha * 0.8})`;
                game.ctx.beginPath();
                game.ctx.arc(this.x, this.y, this.radius * 0.6, 0, Math.PI * 2);
                game.ctx.fill();
                
                // 中心点
                game.ctx.fillStyle = `rgba(255, 255, 255, ${alpha * 0.6})`;
                game.ctx.beginPath();
                game.ctx.arc(this.x, this.y, this.radius * 0.2, 0, Math.PI * 2);
                game.ctx.fill();
            }
        }
        
        // 创建玩家
        const player1 = new Tank(150, 300, '#3498db', {
            up: 'KeyW',
            down: 'KeyS',
            left: 'KeyA',
            right: 'KeyD',
            shoot: 'Space'
        });
        
        const player2 = new Tank(650, 300, '#e74c3c', {
            up: 'ArrowUp',
            down: 'ArrowDown',
            left: 'ArrowLeft',
            right: 'ArrowRight',
            shoot: 'Enter'
        });
        
        // 创建障碍物
        function createObstacles() {
            // 添加一些随机障碍物
            for (let i = 0; i < 8; i++) {
                const x = Math.random() * (CANVAS_WIDTH - OBSTACLE_SIZE) + OBSTACLE_SIZE/2;
                const y = Math.random() * (CANVAS_HEIGHT - OBSTACLE_SIZE) + OBSTACLE_SIZE/2;
                
                // 确保障碍物不会生成在坦克附近
                const tooCloseToPlayer1 = Math.sqrt(Math.pow(x - player1.x, 2) + Math.pow(y - player1.y, 2)) < 100;
                const tooCloseToPlayer2 = Math.sqrt(Math.pow(x - player2.x, 2) + Math.pow(y - player2.y, 2)) < 100;
                
                if (!tooCloseToPlayer1 && !tooCloseToPlayer2) {
                    game.obstacles.push(new Obstacle(x, y));
                }
            }
            
            // 添加一些固定障碍物
            game.obstacles.push(new Obstacle(CANVAS_WIDTH/2, CANVAS_HEIGHT/2));
            game.obstacles.push(new Obstacle(CANVAS_WIDTH/4, CANVAS_HEIGHT/4));
            game.obstacles.push(new Obstacle(CANVAS_WIDTH * 3/4, CANVAS_HEIGHT * 3/4));
        }
        
        // 游戏初始化
        function init() {
            game.canvas = document.getElementById('gameCanvas');
            game.ctx = game.canvas.getContext('2d');
            
            // 创建障碍物
            createObstacles();
            
            // 设置键盘事件监听
            window.addEventListener('keydown', (e) => {
                game.keys[e.code] = true;
                e.preventDefault();
            });
            
            window.addEventListener('keyup', (e) => {
                game.keys[e.code] = false;
                e.preventDefault();
            });
            
            // 开始游戏循环
            gameLoop();
        }
        
        // 游戏主循环
        function gameLoop() {
            if (!game.running) return;
            
            // 清除画布
            game.ctx.fillStyle = '#34495e';
            game.ctx.fillRect(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);
            
            // 绘制网格背景
            drawGrid();
            
            // 更新和绘制障碍物
            game.obstacles.forEach(obstacle => obstacle.draw());
            
            // 更新和绘制玩家
            player1.update();
            player2.update();
            
            player1.draw();
            player2.draw();
            
            // 更新和绘制爆炸效果
            game.explosions = game.explosions.filter(explosion => {
                const active = explosion.update();
                if (active) explosion.draw();
                return active;
            });
            
            // 检查游戏结束
            if (player1.health <= 0 || player2.health <= 0) {
                endGame();
            }
            
            requestAnimationFrame(gameLoop);
        }
        
        // 绘制网格背景
        function drawGrid() {
            game.ctx.strokeStyle = 'rgba(255, 255, 255, 0.1)';
            game.ctx.lineWidth = 1;
            
            // 垂直线
            for (let x = 0; x <= CANVAS_WIDTH; x += 40) {
                game.ctx.beginPath();
                game.ctx.moveTo(x, 0);
                game.ctx.lineTo(x, CANVAS_HEIGHT);
                game.ctx.stroke();
            }
            
            // 水平线
            for (let y = 0; y <= CANVAS_HEIGHT; y += 40) {
                game.ctx.beginPath();
                game.ctx.moveTo(0, y);
                game.ctx.lineTo(CANVAS_WIDTH, y);
                game.ctx.stroke();
            }
        }
        
        // 游戏结束
        function endGame() {
            game.running = false;
            
            // 确定获胜者
            const winner = player1.health > 0 ? "玩家1 (蓝色)" : "玩家2 (红色)";
            
            // 绘制游戏结束画面
            game.ctx.fillStyle = 'rgba(0, 0, 0, 0.7)';
            game.ctx.fillRect(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);
            
            game.ctx.fillStyle = '#ecf0f1';
            game.ctx.font = 'bold 48px Arial';
            game.ctx.textAlign = 'center';
            game.ctx.fillText('游戏结束', CANVAS_WIDTH/2, CANVAS_HEIGHT/2 - 50);
            
            game.ctx.font = '36px Arial';
            game.ctx.fillText(`${winner} 获胜!`, CANVAS_WIDTH/2, CANVAS_HEIGHT/2 + 20);
            
            game.ctx.font = '24px Arial';
            game.ctx.fillText('刷新页面重新开始', CANVAS_WIDTH/2, CANVAS_HEIGHT/2 + 80);
        }
        
        // 页面加载完成后初始化游戏
        window.onload = init;
    </script>
</body>
</html>
