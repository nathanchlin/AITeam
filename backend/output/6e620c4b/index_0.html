<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>坦克大战</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #2c3e50;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: Arial, sans-serif;
        }
        
        .game-container {
            position: relative;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.5);
        }
        
        canvas {
            background-color: #1a1a1a;
            border: 2px solid #34495e;
        }
        
        .game-info {
            position: absolute;
            top: 10px;
            left: 10px;
            color: white;
            font-size: 14px;
            background-color: rgba(0, 0, 0, 0.7);
            padding: 10px;
            border-radius: 5px;
        }
        
        .player-info {
            margin-bottom: 5px;
        }
        
        .player1 {
            color: #3498db;
        }
        
        .player2 {
            color: #e74c3c;
        }
    </style>
</head>
<body>
    <div class="game-container">
        <canvas id="gameCanvas" width="800" height="600"></canvas>
        <div class="game-info">
            <div class="player-info player1">玩家1: WASD移动, 空格射击</div>
            <div class="player-info player2">玩家2: 方向键移动, 回车射击</div>
        </div>
    </div>

    <script>
        // 获取Canvas和上下文
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        
        // 游戏状态
        const game = {
            width: canvas.width,
            height: canvas.height,
            running: true,
            keys: {},
            obstacles: [],
            explosions: []
        };
        
        // 坦克类
        class Tank {
            constructor(x, y, color, controls) {
                this.x = x;
                this.y = y;
                this.width = 30;
                this.height = 30;
                this.color = color;
                this.speed = 3;
                this.direction = 0; // 0: 上, 1: 右, 2: 下, 3: 左
                this.controls = controls;
                this.bullets = [];
                this.lastShot = 0;
                this.shotCooldown = 500; // 射击冷却时间（毫秒）
                this.alive = true;
            }
            
            update() {
                if (!this.alive) return;
                
                // 移动坦克
                if (game.keys[this.controls.up]) {
                    this.move(0);
                }
                if (game.keys[this.controls.down]) {
                    this.move(2);
                }
                if (game.keys[this.controls.left]) {
                    this.move(3);
                }
                if (game.keys[this.controls.right]) {
                    this.move(1);
                }
                
                // 射击
                if (game.keys[this.controls.shoot]) {
                    this.shoot();
                }
                
                // 更新子弹
                this.bullets = this.bullets.filter(bullet => {
                    bullet.update();
                    return bullet.active;
                });
            }
            
            move(newDirection) {
                // 保存旧位置
                const oldX = this.x;
                const oldY = this.y;
                
                // 设置新方向
                this.direction = newDirection;
                
                // 根据方向移动
                switch (this.direction) {
                    case 0: // 上
                        this.y -= this.speed;
                        break;
                    case 1: // 右
                        this.x += this.speed;
                        break;
                    case 2: // 下
                        this.y += this.speed;
                        break;
                    case 3: // 左
                        this.x -= this.speed;
                        break;
                }
                
                // 边界检查
                this.x = Math.max(0, Math.min(game.width - this.width, this.x));
                this.y = Math.max(0, Math.min(game.height - this.height, this.y));
                
                // 障碍物碰撞检测
                for (const obstacle of game.obstacles) {
                    if (this.checkCollision(obstacle)) {
                        this.x = oldX;
                        this.y = oldY;
                        break;
                    }
                }
                
                // 与其他坦克碰撞检测
                const otherTank = this === player1 ? player2 : player1;
                if (otherTank && otherTank.alive && this.checkCollision(otherTank)) {
                    this.x = oldX;
                    this.y = oldY;
                }
            }
            
            shoot() {
                const now = Date.now();
                if (now - this.lastShot > this.shotCooldown) {
                    let bulletX = this.x + this.width / 2;
                    let bulletY = this.y + this.height / 2;
                    
                    // 根据坦克方向调整子弹初始位置
                    switch (this.direction) {
                        case 0: // 上
                            bulletY -= this.height / 2;
                            break;
                        case 1: // 右
                            bulletX += this.width / 2;
                            break;
                        case 2: // 下
                            bulletY += this.height / 2;
                            break;
                        case 3: // 左
                            bulletX -= this.width / 2;
                            break;
                    }
                    
                    this.bullets.push(new Bullet(
                        bulletX,
                        bulletY,
                        this.direction,
                        this.color,
                        this
                    ));
                    
                    this.lastShot = now;
                }
            }
            
            checkCollision(other) {
                return this.x < other.x + other.width &&
                       this.x + this.width > other.x &&
                       this.y < other.y + other.height &&
                       this.y + this.height > other.y;
            }
            
            draw() {
                if (!this.alive) return;
                
                ctx.save();
                ctx.translate(this.x + this.width / 2, this.y + this.height / 2);
                ctx.rotate(this.direction * Math.PI / 2);
                
                // 绘制坦克主体
                ctx.fillStyle = this.color;
                ctx.fillRect(-this.width / 2, -this.height / 2, this.width, this.height);
                
                // 绘制坦克炮管
                ctx.fillStyle = '#555';
                ctx.fillRect(-3, -this.height / 2 - 10, 6, 15);
                
                ctx.restore();
                
                // 绘制子弹
                this.bullets.forEach(bullet => bullet.draw());
            }
            
            hit() {
                this.alive = false;
                game.explosions.push(new Explosion(this.x + this.width / 2, this.y + this.height / 2));
            }
        }
        
        // 子弹类
        class Bullet {
            constructor(x, y, direction, color, owner) {
                this.x = x;
                this.y = y;
                this.width = 6;
                this.height = 6;
                this.direction = direction;
                this.speed = 8;
                this.color = color;
                this.owner = owner;
                this.active = true;
            }
            
            update() {
                switch (this.direction) {
                    case 0: // 上
                        this.y -= this.speed;
                        break;
                    case 1: // 右
                        this.x += this.speed;
                        break;
                    case 2: // 下
                        this.y += this.speed;
                        break;
                    case 3: // 左
                        this.x -= this.speed;
                        break;
                }
                
                // 检查是否超出边界
                if (this.x < 0 || this.x > game.width || this.y < 0 || this.y > game.height) {
                    this.active = false;
                    return;
                }
                
                // 检查与障碍物的碰撞
                for (const obstacle of game.obstacles) {
                    if (this.checkCollision(obstacle)) {
                        this.active = false;
                        game.explosions.push(new Explosion(this.x, this.y));
                        return;
                    }
                }
                
                // 检查与其他坦克的碰撞
                const otherTank = this.owner === player1 ? player2 : player1;
                if (otherTank && otherTank.alive && this.checkCollision(otherTank)) {
                    this.active = false;
                    otherTank.hit();
                    game.explosions.push(new Explosion(this.x, this.y));
                }
            }
            
            checkCollision(other) {
                return this.x < other.x + other.width &&
                       this.x + this.width > other.x &&
                       this.y < other.y + other.height &&
                       this.y + this.height > other.y;
            }
            
            draw() {
                ctx.fillStyle = this.color;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.width / 2, 0, Math.PI * 2);
                ctx.fill();
            }
        }
        
        // 爆炸效果类
        class Explosion {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                this.radius = 5;
                this.maxRadius = 30;
                this.active = true;
            }
            
            update() {
                this.radius += 2;
                if (this.radius >= this.maxRadius) {
                    this.active = false;
                }
            }
            
            draw() {
                const alpha = 1 - (this.radius / this.maxRadius);
                ctx.fillStyle = `rgba(255, 100, 0, ${alpha})`;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fill();
                
                ctx.fillStyle = `rgba(255, 200, 0, ${alpha * 0.7})`;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius * 0.7, 0, Math.PI * 2);
                ctx.fill();
            }
        }
        
        // 障碍物类
        class Obstacle {
            constructor(x, y, width, height) {
                this.x = x;
                this.y = y;
                this.width = width;
                this.height = height;
            }
            
            draw() {
                ctx.fillStyle = '#555';
                ctx.fillRect(this.x, this.y, this.width, this.height);
                
                // 添加一些纹理
                ctx.fillStyle = '#666';
                for (let i = 0; i < this.width; i += 10) {
                    for (let j = 0; j < this.height; j += 10) {
                        if ((i + j) % 20 === 0) {
                            ctx.fillRect(this.x + i, this.y + j, 5, 5);
                        }
                    }
                }
            }
        }
        
        // 创建玩家
        const player1 = new Tank(100, 300, '#3498db', {
            up: 'KeyW',
            down: 'KeyS',
            left: 'KeyA',
            right: 'KeyD',
            shoot: 'Space'
        });
        
        const player2 = new Tank(650, 300, '#e74c3c', {
            up: 'ArrowUp',
            down: 'ArrowDown',
            left: 'ArrowLeft',
            right: 'ArrowRight',
            shoot: 'Enter'
        });
        
        // 创建障碍物
        function createObstacles() {
            // 边界墙
            game.obstacles.push(new Obstacle(0, 0, game.width, 20)); // 上
            game.obstacles.push(new Obstacle(0, game.height - 20, game.width, 20)); // 下
            game.obstacles.push(new Obstacle(0, 0, 20, game.height)); // 左
            game.obstacles.push(new Obstacle(game.width - 20, 0, 20, game.height)); // 右
            
            // 内部障碍物
            game.obstacles.push(new Obstacle(200, 150, 20, 150));
            game.obstacles.push(new Obstacle(400, 100, 150, 20));
            game.obstacles.push(new Obstacle(600, 200, 20, 200));
            game.obstacles.push(new Obstacle(300, 400, 200, 20));
            game.obstacles.push(new Obstacle(100, 450, 20, 100));
            game.obstacles.push(new Obstacle(500, 300, 100, 20));
        }
        
        // 初始化游戏
        function init() {
            createObstacles();
            
            // 键盘事件监听
            window.addEventListener('keydown', (e) => {
                game.keys[e.code] = true;
                e.preventDefault();
            });
            
            window.addEventListener('keyup', (e) => {
                game.keys[e.code] = false;
                e.preventDefault();
            });
            
            // 开始游戏循环
            gameLoop();
        }
        
        // 游戏主循环
        function gameLoop() {
            if (!game.running) return;
            
            // 清空画布
            ctx.clearRect(0, 0, game.width, game.height);
            
            // 绘制背景网格
            drawGrid();
            
            // 绘制障碍物
            game.obstacles.forEach(obstacle => obstacle.draw());
            
            // 更新和绘制玩家
            player1.update();
            player1.draw();
            
            player2.update();
            player2.draw();
            
            // 更新和绘制爆炸效果
            game.explosions = game.explosions.filter(explosion => {
                explosion.update();
                explosion.draw();
                return explosion.active;
            });
            
            // 检查游戏结束条件
            if (!player1.alive || !player2.alive) {
                endGame();
            }
            
            requestAnimationFrame(gameLoop);
        }
        
        // 绘制背景网格
        function drawGrid() {
            ctx.strokeStyle = '#222';
            ctx.lineWidth = 0.5;
            
            // 垂直线
            for (let x = 0; x <= game.width; x += 20) {
                ctx.beginPath();
                ctx.moveTo(x, 0);
                ctx.lineTo(x, game.height);
                ctx.stroke();
            }
            
            // 水平线
            for (let y = 0; y <= game.height; y += 20) {
                ctx.beginPath();
                ctx.moveTo(0, y);
                ctx.lineTo(game.width, y);
                ctx.stroke();
            }
        }
        
        // 游戏结束
        function endGame() {
            game.running = false;
            
            // 显示游戏结束信息
            ctx.fillStyle = 'rgba(0, 0, 0, 0.7)';
            ctx.fillRect(0, 0, game.width, game.height);
            
            ctx.fillStyle = 'white';
            ctx.font = '48px Arial';
            ctx.textAlign = 'center';
            ctx.fillText('游戏结束', game.width / 2, game.height / 2 - 50);
            
            ctx.font = '24px Arial';
            if (!player1.alive && !player2.alive) {
                ctx.fillText('平局！', game.width / 2, game.height / 2);
            } else if (!player1.alive) {
                ctx.fillText('玩家2获胜！', game.width / 2, game.height / 2);
            } else {
                ctx.fillText('玩家1获胜！', game.width / 2, game.height / 2);
            }
            
            ctx.font = '18px Arial';
            ctx.fillText('刷新页面重新开始', game.width / 2, game.height / 2 + 50);
        }
        
        // 启动游戏
        window.onload = init;
    </script>
</body>
</html>
