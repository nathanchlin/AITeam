<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>坦克大战</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: Arial, sans-serif;
        }
        
        #gameContainer {
            position: relative;
            background-color: #000;
            border: 2px solid #555;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.5);
        }
        
        #gameCanvas {
            display: block;
            background-color: #111;
        }
        
        #gameInfo {
            position: absolute;
            top: 10px;
            left: 10px;
            color: #fff;
            font-size: 14px;
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.8);
        }
        
        #gameControls {
            position: absolute;
            bottom: 10px;
            left: 10px;
            color: #fff;
            font-size: 12px;
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.8);
        }
        
        #gameMessage {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #fff;
            font-size: 24px;
            font-weight: bold;
            text-align: center;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.8);
            display: none;
        }
    </style>
</head>
<body>
    <div id="gameContainer">
        <canvas id="gameCanvas" width="800" height="600"></canvas>
        <div id="gameInfo">
            <div>玩家1 生命: <span id="player1Lives">3</span> | 玩家2 生命: <span id="player2Lives">3</span></div>
            <div>帧率: <span id="fps">0</span> FPS</div>
        </div>
        <div id="gameControls">
            <div>玩家1: WASD移动, 空格射击 | 玩家2: 方向键移动, 回车射击</div>
            <div>按R键重新开始游戏</div>
        </div>
        <div id="gameMessage"></div>
    </div>

    <script>
        // 游戏常量
        const CANVAS_WIDTH = 800;
        const CANVAS_HEIGHT = 600;
        const TANK_SIZE = 30;
        const BULLET_SIZE = 5;
        const BULLET_SPEED = 5;
        const TANK_SPEED = 3;
        const OBSTACLE_SIZE = 40;
        const EXPLOSION_DURATION = 20;
        const MAX_FPS = 60;
        const FRAME_TIME = 1000 / MAX_FPS;
        
        // 游戏状态
        let gameRunning = true;
        let lastFrameTime = 0;
        let frameCount = 0;
        let fps = 0;
        let lastFpsUpdate = 0;
        
        // 获取Canvas和上下文
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        
        // 键盘状态
        const keys = {};
        
        // 游戏对象
        let player1, player2;
        let bullets = [];
        let obstacles = [];
        let explosions = [];
        
        // 坦克类
        class Tank {
            constructor(x, y, color, controls) {
                this.x = x;
                this.y = y;
                this.color = color;
                this.controls = controls;
                this.width = TANK_SIZE;
                this.height = TANK_SIZE;
                this.angle = 0;
                this.speed = TANK_SPEED;
                this.lives = 3;
                this.lastShot = 0;
                this.shotCooldown = 500; // 毫秒
            }
            
            update() {
                // 移动逻辑
                if (keys[this.controls.up]) {
                    this.x += Math.cos(this.angle) * this.speed;
                    this.y += Math.sin(this.angle) * this.speed;
                }
                if (keys[this.controls.down]) {
                    this.x -= Math.cos(this.angle) * this.speed;
                    this.y -= Math.sin(this.angle) * this.speed;
                }
                if (keys[this.controls.left]) {
                    this.angle -= 0.05;
                }
                if (keys[this.controls.right]) {
                    this.angle += 0.05;
                }
                
                // 射击逻辑
                if (keys[this.controls.shoot]) {
                    this.shoot();
                }
                
                // 边界检查
                this.x = Math.max(this.width/2, Math.min(CANVAS_WIDTH - this.width/2, this.x));
                this.y = Math.max(this.height/2, Math.min(CANVAS_HEIGHT - this.height/2, this.y));
            }
            
            shoot() {
                const now = Date.now();
                if (now - this.lastShot > this.shotCooldown) {
                    const bulletX = this.x + Math.cos(this.angle) * this.width/2;
                    const bulletY = this.y + Math.sin(this.angle) * this.height/2;
                    bullets.push(new Bullet(bulletX, bulletY, this.angle, this));
                    this.lastShot = now;
                }
            }
            
            draw() {
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.rotate(this.angle);
                
                // 绘制坦克主体
                ctx.fillStyle = this.color;
                ctx.fillRect(-this.width/2, -this.height/2, this.width, this.height);
                
                // 绘制坦克炮管
                ctx.fillStyle = this.color;
                ctx.fillRect(this.width/2 - 5, -3, this.width/2, 6);
                
                // 绘制坦克细节
                ctx.fillStyle = '#000';
                ctx.fillRect(-this.width/4, -this.height/4, this.width/2, this.height/2);
                
                ctx.restore();
            }
            
            hit() {
                this.lives--;
                updateLivesDisplay();
                
                if (this.lives <= 0) {
                    this.explode();
                    if (this === player1) {
                        showMessage("玩家2 获胜!");
                        gameRunning = false;
                    } else {
                        showMessage("玩家1 获胜!");
                        gameRunning = false;
                    }
                }
            }
            
            explode() {
                explosions.push(new Explosion(this.x, this.y));
            }
        }
        
        // 子弹类
        class Bullet {
            constructor(x, y, angle, owner) {
                this.x = x;
                this.y = y;
                this.angle = angle;
                this.owner = owner;
                this.speed = BULLET_SPEED;
                this.width = BULLET_SIZE;
                this.height = BULLET_SIZE;
                this.active = true;
            }
            
            update() {
                this.x += Math.cos(this.angle) * this.speed;
                this.y += Math.sin(this.angle) * this.speed;
                
                // 检查是否超出边界
                if (this.x < 0 || this.x > CANVAS_WIDTH || 
                    this.y < 0 || this.y > CANVAS_HEIGHT) {
                    this.active = false;
                }
                
                // 检查与障碍物的碰撞
                for (const obstacle of obstacles) {
                    if (this.checkCollision(obstacle)) {
                        this.active = false;
                        explosions.push(new Explosion(this.x, this.y));
                        break;
                    }
                }
                
                // 检查与坦克的碰撞
                const otherTank = this.owner === player1 ? player2 : player1;
                if (this.checkTankCollision(otherTank)) {
                    this.active = false;
                    otherTank.hit();
                }
            }
            
            checkCollision(obstacle) {
                return this.x > obstacle.x - obstacle.width/2 &&
                       this.x < obstacle.x + obstacle.width/2 &&
                       this.y > obstacle.y - obstacle.height/2 &&
                       this.y < obstacle.y + obstacle.height/2;
            }
            
            checkTankCollision(tank) {
                const distance = Math.sqrt(Math.pow(this.x - tank.x, 2) + Math.pow(this.y - tank.y, 2));
                return distance < tank.width/2;
            }
            
            draw() {
                ctx.fillStyle = '#FF0';
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.width/2, 0, Math.PI * 2);
                ctx.fill();
            }
        }
        
        // 障碍物类
        class Obstacle {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                this.width = OBSTACLE_SIZE;
                this.height = OBSTACLE_SIZE;
                this.color = '#555';
            }
            
            draw() {
                ctx.fillStyle = this.color;
                ctx.fillRect(
                    this.x - this.width/2, 
                    this.y - this.height/2, 
                    this.width, 
                    this.height
                );
                
                // 添加纹理
                ctx.fillStyle = '#666';
                ctx.fillRect(
                    this.x - this.width/2 + 5, 
                    this.y - this.height/2 + 5, 
                    this.width - 10, 
                    this.height - 10
                );
            }
        }
        
        // 爆炸效果类
        class Explosion {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                this.radius = 5;
                this.maxRadius = 30;
                this.frame = 0;
                this.maxFrames = EXPLOSION_DURATION;
            }
            
            update() {
                this.frame++;
                this.radius = (this.frame / this.maxFrames) * this.maxRadius;
                return this.frame >= this.maxFrames;
            }
            
            draw() {
                const alpha = 1 - (this.frame / this.maxFrames);
                ctx.fillStyle = `rgba(255, 100, 0, ${alpha})`;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fill();
                
                ctx.fillStyle = `rgba(255, 200, 0, ${alpha * 0.7})`;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius * 0.6, 0, Math.PI * 2);
                ctx.fill();
            }
        }
        
        // 初始化游戏
        function initGame() {
            // 创建玩家
            player1 = new Tank(100, 300, '#0F0', {
                up: 'w',
                down: 's',
                left: 'a',
                right: 'd',
                shoot: ' '
            });
            
            player2 = new Tank(700, 300, '#F00', {
                up: 'ArrowUp',
                down: 'ArrowDown',
                left: 'ArrowLeft',
                right: 'ArrowRight',
                shoot: 'Enter'
            });
            
            // 创建障碍物
            obstacles = [];
            // 添加随机障碍物
            for (let i = 0; i < 10; i++) {
                let x, y;
                do {
                    x = Math.random() * (CANVAS_WIDTH - OBSTACLE_SIZE) + OBSTACLE_SIZE/2;
                    y = Math.random() * (CANVAS_HEIGHT - OBSTACLE_SIZE) + OBSTACLE_SIZE/2;
                } while (
                    (Math.abs(x - player1.x) < OBSTACLE_SIZE * 2 && Math.abs(y - player1.y) < OBSTACLE_SIZE * 2) ||
                    (Math.abs(x - player2.x) < OBSTACLE_SIZE * 2 && Math.abs(y - player2.y) < OBSTACLE_SIZE * 2)
                );
                obstacles.push(new Obstacle(x, y));
            }
            
            // 清空其他游戏对象
            bullets = [];
            explosions = [];
            
            // 重置游戏状态
            gameRunning = true;
            updateLivesDisplay();
            hideMessage();
        }
        
        // 更新生命值显示
        function updateLivesDisplay() {
            document.getElementById('player1Lives').textContent = player1.lives;
            document.getElementById('player2Lives').textContent = player2.lives;
        }
        
        // 显示消息
        function showMessage(text) {
            const messageElement = document.getElementById('gameMessage');
            messageElement.textContent = text;
            messageElement.style.display = 'block';
        }
        
        // 隐藏消息
        function hideMessage() {
            document.getElementById('gameMessage').style.display = 'none';
        }
        
        // 游戏主循环
        function gameLoop(timestamp) {
            // 计算帧率
            frameCount++;
            if (timestamp - lastFpsUpdate >= 1000) {
                fps = frameCount;
                frameCount = 0;
                lastFpsUpdate = timestamp;
                document.getElementById('fps').textContent = fps;
            }
            
            // 控制帧率
            if (timestamp - lastFrameTime < FRAME_TIME) {
                requestAnimationFrame(gameLoop);
                return;
            }
            
            lastFrameTime = timestamp;
            
            // 清空画布
            ctx.fillStyle = '#222';
            ctx.fillRect(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);
            
            // 绘制网格背景
            ctx.strokeStyle = '#333';
            ctx.lineWidth = 1;
            for (let x = 0; x < CANVAS_WIDTH; x += 40) {
                ctx.beginPath();
                ctx.moveTo(x, 0);
                ctx.lineTo(x, CANVAS_HEIGHT);
                ctx.stroke();
            }
            for (let y = 0; y < CANVAS_HEIGHT; y += 40) {
                ctx.beginPath();
                ctx.moveTo(0, y);
                ctx.lineTo(CANVAS_WIDTH, y);
                ctx.stroke();
            }
            
            if (gameRunning) {
                // 更新游戏对象
                player1.update();
                player2.update();
                
                // 更新子弹
                bullets = bullets.filter(bullet => {
                    bullet.update();
                    return bullet.active;
                });
                
                // 更新爆炸效果
                explosions = explosions.filter(explosion => !explosion.update());
            }
            
            // 绘制游戏对象
            obstacles.forEach(obstacle => obstacle.draw());
            player1.draw();
            player2.draw();
            bullets.forEach(bullet => bullet.draw());
            explosions.forEach(explosion => explosion.draw());
            
            // 继续游戏循环
            requestAnimationFrame(gameLoop);
        }
        
        // 键盘事件处理
        window.addEventListener('keydown', (e) => {
            keys[e.key] = true;
            
            // 重新开始游戏
            if (e.key === 'r' || e.key === 'R') {
                initGame();
            }
            
            // 防止方向键滚动页面
            if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', ' '].includes(e.key)) {
                e.preventDefault();
            }
        });
        
        window.addEventListener('keyup', (e) => {
            keys[e.key] = false;
        });
        
        // 初始化并开始游戏
        window.onload = () => {
            initGame();
            requestAnimationFrame(gameLoop);
        };
    </script>
</body>
</html>
