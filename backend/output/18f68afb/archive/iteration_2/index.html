<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>俄罗斯方块对战游戏 - 修复版</title>
<style>
  body {
    margin: 0;
    padding: 20px;
    background-color: #f0f0f0;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    font-family: Arial, sans-serif;
  }
  .game-container {
    display: flex;
    gap: 20px;
    background: #fff;
    padding: 20px;
    border-radius: 10px;
    box-shadow: 0 0 10px rgba(0,0,0,0.1);
  }
  .canvas-wrapper {
    text-align: center;
  }
  h3 { margin-top: 0; margin-bottom: 10px; }
  canvas {
    border: 2px solid #333;
    background-color: #000; /* 画布背景设为黑色，凸显方块 */
    display: block;
  }
  #info {
    margin-left: 20px;
    display: flex;
    flex-direction: column;
    justify-content: center;
  }
  .score-board {
    margin-bottom: 20px;
    padding: 10px;
    background: #eee;
    border-radius: 5px;
  }
</style>
</head>
<body>

<div class="game-container">
  <div class="canvas-wrapper">
    <h3>Player (You)</h3>
    <canvas id="playerCanvas" width="300" height="600"></canvas>
  </div>
  
  <div id="info">
    <div class="score-board">
      <p>Player Score: <span id="playerScore">0</span></p>
      <p>Lines: <span id="playerLines">0</span></p>
    </div>
    <div class="score-board">
      <p>AI Score: <span id="aiScore">0</span></p>
      <p>Lines: <span id="aiLines">0</span></p>
    </div>
    <div style="margin-top: 20px; font-size: 12px; color: #666;">
      Controls:<br>
      ← → : Move<br>
      ↑ : Rotate<br>
      ↓ : Soft Drop<br>
      Space : Hard Drop
    </div>
  </div>

  <div class="canvas-wrapper">
    <h3>Opponent (AI)</h3>
    <canvas id="aiCanvas" width="300" height="600"></canvas>
  </div>
</div>

<script>
// 游戏常量配置
const COLS = 10;
const ROWS = 20;
const BLOCK_SIZE = 30; // 300 / 10 = 30

// 获取 DOM 元素
const playerCanvas = document.getElementById('playerCanvas');
const aiCanvas = document.getElementById('aiCanvas');
const playerCtx = playerCanvas.getContext('2d');
const aiCtx = aiCanvas.getContext('2d');

// 方块定义（7种标准形状）
const SHAPES = [
  { shape: [[1,1,1,1]], color: 'cyan' },          // I
  { shape: [[2,0,0],[2,2,2]], color: 'blue' },    // J
  { shape: [[0,0,3],[3,3,3]], color: 'orange' },  // L
  { shape: [[4,4],[4,4]], color: 'yellow' },      // O
  { shape: [[0,5,5],[5,5,0]], color: 'green' },   // S
  { shape: [[0,6,0],[6,6,6]], color: 'purple' },  // T
  { shape: [[7,7,0],[0,7,7]], color: 'red' }      // Z
];

class Tetromino {
  constructor() {
    const rnd = Math.floor(Math.random() * SHAPES.length);
    const template = SHAPES[rnd];
    this.matrix = template.shape.map(row => [...row]); // 深拷贝
    this.color = template.color;
    this.x = Math.floor(COLS / 2) - Math.floor(this.matrix[0].length / 2);
    this.y = 0;
  }

  rotate() {
    const newMatrix = this.matrix[0].map((val, index) => 
      this.matrix.map(row => row[index]).reverse()
    );
    this.matrix = newMatrix;
  }
}

class Game {
  constructor(canvas, ctx, isAI = false) {
    this.canvas = canvas;
    this.ctx = ctx;
    this.isAI = isAI;
    this.grid = this.createGrid();
    this.score = 0;
    this.lines = 0;
    this.gameOver = false;
    this.piece = null;
    this.pieceCounter = 0;
    
    // AI 特有属性
    this.aiMoveCounter = 0;
    this.aiMoveDelay = 30; // AI反应速度（帧数）

    // 对战引用（稍后链接）
    this.opponent = null; 

    this.spawnPiece();
    
    if (!isAI) {
      this.bindControls();
    }
  }

  createGrid() {
    // 创建 10x20 的网格，初始值为0
    return Array.from({ length: ROWS }, () => Array(COLS).fill(0));
  }

  spawnPiece() {
    this.piece = new Tetromino();
    // 如果生成时就碰撞，游戏结束
    if (this.collide()) {
      this.gameOver = true;
    }
    this.pieceCounter++;
  }

  // 核心：渲染逻辑，修复"看不到方块"的关键
  render() {
    // 1. 清空画布
    this.ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);

    // 2. 绘制背景网格（视觉辅助）
    this.ctx.strokeStyle = '#333';
    for (let x = 0; x <= COLS; x++) {
        this.ctx.beginPath();
        this.ctx.moveTo(x * BLOCK_SIZE, 0);
        this.ctx.lineTo(x * BLOCK_SIZE, ROWS * BLOCK_SIZE);
        this.ctx.stroke();
    }
    for (let y = 0; y <= ROWS; y++) {
        this.ctx.beginPath();
        this.ctx.moveTo(0, y * BLOCK_SIZE);
        this.ctx.lineTo(COLS * BLOCK_SIZE, y * BLOCK_SIZE);
        this.ctx.stroke();
    }

    // 3. 绘制已落下的方块堆叠
    this.drawMatrix(this.grid, {x: 0, y: 0});

    // 4. 绘制当前活动方块（如果存在）
    if (this.piece) {
      this.drawMatrix(this.piece.matrix, {x: this.piece.x, y: this.piece.y}, this.piece.color);
    }

    // 5. 绘制游戏结束遮罩
    if (this.gameOver) {
      this.ctx.fillStyle = 'rgba(0,0,0,0.75)';
      this.ctx.fillRect(0,0,this.canvas.width, this.canvas.height);
      this.ctx.fillStyle = 'red';
      this.ctx.font = '30px Arial';
      this.ctx.textAlign = 'center';
      this.ctx.fillText("GAME OVER", this.canvas.width/2, this.canvas.height/2);
    }
  }

  // 辅助绘制函数
  drawMatrix(matrix, offset, colorOverride = null) {
    matrix.forEach((row, y) => {
      row.forEach((value, x) => {
        if (value !== 0) {
          const color = colorOverride || this.getColor(value);
          
          // 绘制方块实体
          this.ctx.fillStyle = color;
          this.ctx.fillRect(
            (x + offset.x) * BLOCK_SIZE, 
            (y + offset.y) * BLOCK_SIZE, 
            BLOCK_SIZE, 
            BLOCK_SIZE
          );

          // 绘制方块边框（3D效果），防止方块混在一起
          this.ctx.lineWidth = 2;
          this.ctx.strokeStyle = 'rgba(255,255,255,0.4)';
          this.ctx.strokeRect(
            (x + offset.x) * BLOCK_SIZE + 1, 
            (y + offset.y) * BLOCK_SIZE + 1, 
            BLOCK_SIZE - 2, 
            BLOCK_SIZE - 2
          );
        }
      });
    });
  }

  getColor(value) {
    // 根据网格中的数值返回颜色
    const colors = ['', 'cyan', 'blue', 'orange', 'yellow', 'green', 'purple', 'red'];
    return colors[value] || 'white';
  }

  // 逻辑更新
  update() {
    if (this.gameOver) return;

    if (this.isAI) {
      this.runAI();
    }

    // 每隔一定帧数下落（模拟重力）
    if (this.pieceCounter % (this.isAI ? 30 : 45) === 0) { // AI稍微慢一点或者根据难度调整
      this.moveDown();
    }
    this.pieceCounter++;
  }

  runAI() {
    // 简单的AI：每隔一段时间随机移动或旋转
    this.aiMoveCounter++;
    if (this.aiMoveCounter >= this.aiMoveDelay) {
      this.aiMoveCounter = 0;
      const moves = ['left', 'right', 'rotate', 'down'];
      const move = moves[Math.floor(Math.random() * moves.length)];
      
      switch(move) {
        case 'left': this.moveLeft(); break;
        case 'right': this.moveRight(); break;
        case 'rotate': this.rotatePiece(); break;
        case 'down': this.moveDown(); break;
      }
    }
  }

  bindControls() {
    document.addEventListener('keydown', (e) => {
      if (this.gameOver) return;
      
      switch(e.key) {
        case 'ArrowLeft': this.moveLeft(); break;
        case 'ArrowRight': this.moveRight(); break;
        case 'ArrowDown': this.moveDown(); break;
        case 'ArrowUp': this.rotatePiece(); break;
        case ' ': // Space - 瞬间下落
          while(!this.collide()) {
            this.piece.y++;
          }
          this.piece.y--; // 回退一步
          this.lockPiece();
          break;
      }
    });
  }

  // 移动逻辑
  moveLeft() {
    this.piece.x--;
    if (this.collide()) this.piece.x++;
  }
  
  moveRight() {
    this.piece.x++;
    if (this.collide()) this.piece.x--;
  }
  
  moveDown() {
    this.piece.y++;
    if (this.collide()) {
      this.piece.y--;
      this.lockPiece();
    }
  }

  rotatePiece() {
    const originalMatrix = this.piece.matrix;
    this.piece.rotate();
    // 墙踢逻辑简单实现：如果旋转后碰撞，则尝试左右移动，再不行就转回去
    if (this.collide()) {
      this.piece.x--;
      if(this.collide()) {
        this.piece.x += 2;
        if(this.collide()) {
          this.piece.x--;
          this.piece.matrix = originalMatrix;
        }
      }
    }
  }

  // 碰撞检测
  collide() {
    const m = this.piece.matrix;
    const o = this.piece;
    for (let y = 0; y < m.length; ++y) {
      for (let x = 0; x < m[y].length; ++x) {
        if (m[y][x] !== 0 &&
           (this.grid[y + o.y] && this.grid[y + o.y][x + o.x]) !== 0) {
          return true;
        }
      }
    }
    return false;
  }

  // 锁定方块并检查消行
  lockPiece() {
    this.piece.matrix.forEach((row, y) => {
      row.forEach((value, x) => {
        if (value !== 0) {
          // 如果锁定位置超出顶部，游戏结束
          if (y + this.piece.y < 0) {
            this.gameOver = true;
            return;
          }
          this.grid[y + this.piece.y][x + this.piece.x] = value; // 这里可以用颜色代码或ID
        }
      });
    });

    if (!this.gameOver) {
      this.checkLines();
      this.spawnPiece();
    }
  }

  // 消行处理
  checkLines() {
    let linesCleared = 0;
    outer: for (let y = this.grid.length - 1; y > 0; --y) {
      for (let x = 0; x < this.grid[y].length; ++x) {
        if (this.grid[y][x] === 0) {
          continue outer;
        }
      }
      
      // 移除该行
      const row = this.grid.splice(y, 1)[0].fill(0);
      this.grid.unshift(row);
      ++y;
      linesCleared++;
    }

    if (linesCleared > 0) {
      this.score += linesCleared * 100;
      this.lines += linesCleared;
      this.updateScoreDisplay();
      
      // **核心需求：干扰技能释放**
      this.sendInterference(linesCleared);
    }
  }

  // 释放干扰给对手
  sendInterference(lines) {
    if (this.opponent && !this.opponent.gameOver) {
      // 简单规则：消几行，给对面底部长几行（中间随机留空）
      for (let i = 0; i < lines; i++) {
        this.opponent.receiveGarbage();
      }
    }
  }

  // 接收垃圾行（干扰）
  receiveGarbage() {
    // 1. 把整个网格上移一行（顶行移除）
    this.grid.shift();
    
    // 2. 在最底部生成一行新行，大部分是填满的，随机留一个空隙
    const garbageRow = Array(COLS).fill(8); // 8 代表灰色干扰块
    const hole = Math.floor(Math.random() * COLS);
    garbageRow[hole] = 0; // 留空
    
    this.grid.push(garbageRow);
    
    // 可选：如果当前方块位置与新顶行冲突，需要调整或判定死亡
    // 这里简化处理，直接推上去
  }

  updateScoreDisplay() {
    if (!this.isAI) {
      document.getElementById('playerScore').innerText = this.score;
      document.getElementById('playerLines').innerText = this.lines;
    } else {
      document.getElementById('aiScore').innerText = this.score;
      document.getElementById('aiLines').innerText = this.lines;
    }
  }
}

// 初始化游戏
const playerGame = new Game(playerCanvas, playerCtx, false);
const aiGame = new Game(aiCanvas, aiCtx, true);

// 建立对战连接
playerGame.opponent = aiGame;
aiGame.opponent = playerGame;

// 主循环
let lastTime = 0;
function gameLoop(time = 0) {
  const deltaTime = time - lastTime;
  
  // 固定频率更新逻辑，但渲染每帧都做
  playerGame.update();
  aiGame.update();

  playerGame.render();
  aiGame.render();

  lastTime = time;
  requestAnimationFrame(gameLoop);
}

// 启动
gameLoop();


render() {
    // 1. 清空画布并填充背景
    this.ctx.fillStyle = '#000';
    this.ctx.fillRect(0, 0, this.canvas.width, this.canvas.height);

    // 2. 绘制背景网格（线框）- 最底层
    this.ctx.strokeStyle = '#333';
    this.ctx.lineWidth = 1;
    for (let x = 0; x <= COLS; x++) {
        this.ctx.beginPath();
        this.ctx.moveTo(x * BLOCK_SIZE, 0);
        this.ctx.lineTo(x * BLOCK_SIZE, this.canvas.height);
        this.ctx.stroke();
    }
    for (let y = 0; y <= ROWS; y++) {
        this.ctx.beginPath();
        this.ctx.moveTo(0, y * BLOCK_SIZE);
        this.ctx.lineTo(this.canvas.width, y * BLOCK_SIZE);
        this.ctx.stroke();
    }

    // 3. 绘制已锁定的方块 - 中层
    this.grid.forEach((row, y) => {
        row.forEach((value, x) => {
            if (value !== 0) {
                this.drawBlock(x, y, value);
            }
        });
    });

    // 4. 绘制当前活动方块 - 最顶层
    if (this.piece) {
        this.piece.matrix.forEach((row, y) => {
            row.forEach((value, x) => {
                if (value !== 0) {
                    this.drawBlock(x + this.piece.x, y + this.piece.y, value);
                }
            });
        });
    }
}

// 辅助函数：绘制单个方块
drawBlock(x, y, typeId) {
    // 映射 ID 到颜色
    const colors = [
        null,
        'cyan',   // 1 - I
        'blue',   // 2 - J
        'orange', // 3 - L
        'yellow', // 4 - O
        'green',  // 5 - S
        'purple', // 6 - T
        'red',    // 7 - Z
        'gray'    // 8 - Garbage (干扰行)
    ];
    
    this.ctx.fillStyle = colors[typeId] || 'white';
    this.ctx.fillRect(x * BLOCK_SIZE, y * BLOCK_SIZE, BLOCK_SIZE, BLOCK_SIZE);

    // 绘制方块边框，增加立体感
    this.ctx.strokeStyle = 'rgba(255, 255, 255, 0.3)';
    this.ctx.strokeRect(x * BLOCK_SIZE, y * BLOCK_SIZE, BLOCK_SIZE, BLOCK_SIZE);
}

render() {
    // 1. 清空画布并填充背景
    this.ctx.fillStyle = '#000';
    this.ctx.fillRect(0, 0, this.canvas.width, this.canvas.height);

    // 2. 绘制背景网格（线框）- 优化可见性
    // 修改点：将颜色从 #333 改为 rgba(255, 255, 255, 0.15)，在黑色背景上显示为淡灰色网格
    this.ctx.strokeStyle = 'rgba(255, 255, 255, 0.15)'; 
    this.ctx.lineWidth = 1;
    
    for (let x = 0; x <= COLS; x++) {
        this.ctx.beginPath();
        this.ctx.moveTo(x * BLOCK_SIZE, 0);
        this.ctx.lineTo(x * BLOCK_SIZE, this.canvas.height);
        this.ctx.stroke();
    }
    for (let y = 0; y <= ROWS; y++) {
        this.ctx.beginPath();
        this.ctx.moveTo(0, y * BLOCK_SIZE);
        this.ctx.lineTo(this.canvas.width, y * BLOCK_SIZE);
        this.ctx.stroke();
    }

    // 3. 绘制已锁定的方块 - 中层
    this.grid.forEach((row, y) => {
        row.forEach((value, x) => {
            if (value !== 0) {
                this.drawBlock(x, y, value);
            }
        });
    });

    // 4. 绘制当前活动方块 - 最顶层
    if (this.piece) {
        this.piece.matrix.forEach((row, y) => {
            row.forEach((value, x) => {
                if (value !== 0) {
                    this.drawBlock(x + this.piece.x, y + this.piece.y, value);
                }
            });
        });
    }
}

constructor(canvas, ctx, isAI = false) {
    this.canvas = canvas;
    this.ctx = ctx;
    this.isAI = isAI;
    this.grid = this.createGrid();
    this.score = 0;
    this.lines = 0;
    this.gameOver = false;
    this.piece = null;
    
    // 游戏循环所需变量
    this.lastTime = 0;
    this.dropCounter = 0;
    this.dropInterval = 1000; // 每秒下落一次

    // AI 特有属性
    this.aiCounter = 0;

    // 对战引用
    this.opponent = null; 

    this.spawnPiece();
    
    if (!isAI) {
      this.bindControls();
    }
    
    // 立即进行一次渲染，防止黑屏
    this.render(); 
}

bindControls() {
    document.addEventListener('keydown', event => {
        if (this.gameOver) return;
        
        switch (event.keyCode) {
            case 37: // Left
                this.move(-1);
                break;
            case 39: // Right
                this.move(1);
                break;
            case 40: // Down
                this.drop();
                break;
            case 38: // Up (Rotate)
                this.playerRotate(1);
                break;
            case 32: // Space (Hard Drop)
                this.hardDrop();
                break;
        }
    });
}

// 碰撞检测
    collide() {
        const [m, o] = [this.piece.matrix, this.piece];
        for (let y = 0; y < m.length; ++y) {
            for (let x = 0; x < m[y].length; ++x) {
                if (m[y][x] !== 0 &&
                   (this.grid[o.y + y] && this.grid[o.y + y][o.x + x]) !== 0) {
                    return true;
                }
            }
        }
        return false;
    }

    // 锁定方块到网格
    merge() {
        this.piece.matrix.forEach((row, y) => {
            row.forEach((value, x) => {
                if (value !== 0) {
                    // 防止索引越界导致游戏崩溃
                    if (this.grid[this.piece.y + y]) {
                        this.grid[this.piece.y + y][this.piece.x + x] = value;
                    }
                }
            });
        });
    }

    // 旋转辅助函数
    rotate(dir) {
        if (dir > 0) {
            this.piece.matrix = this.piece.matrix[0].map((val, index) =>
                this.piece.matrix.map(row => row[index]).reverse()
            );
        }
    }

    // 玩家操作：移动
    move(dir) {
        this.piece.x += dir;
        if (this.collide()) {
            this.piece.x -= dir;
        }
    }

    // 玩家操作：下落
    drop() {
        this.piece.y++;
        if (this.collide()) {
            this.piece.y--;
            this.merge();
            this.sweep();
            this.spawnPiece();
        }
        this.dropCounter = 0;
    }

    // 玩家操作：硬降
    hardDrop() {
        while (!this.collide()) {
            this.piece.y++;
        }
        this.piece.y--;
        this.drop();
    }

    // 玩家操作：旋转（带墙踢修正）
    playerRotate(dir) {
        const pos = this.piece.x;
        let offset = 1;
        this.rotate(dir);
        while (this.collide()) {
            this.piece.x += offset;
            offset = -(offset + (offset > 0 ? 1 : -1));
            if (offset > this.piece.matrix[0].length) {
                this.rotate(-dir);
                this.piece.x = pos;
                return;
            }
        }
    }

    // 消行逻辑及攻击判定
    sweep() {
        let rowCount = 0;
        outer: for (let y = this.grid.length - 1; y > 0; --y) {
            for (let x = 0; x < this.grid[y].length; ++x) {
                if (this.grid[y][x] === 0) {
                    continue outer;
                }
            }
            // 移除该行
            const row = this.grid.splice(y, 1)[0].fill(0);
            this.grid.unshift(row);
            ++y;
            rowCount++;
        }

        // 更新分数
        if (rowCount > 0) {
            this.lines += rowCount;
            this.score += rowCount * 100;
            this.updateScore();
            
            // 触发攻击：给对手增加干扰行
            if (this.opponent) {
                this.opponent.receiveAttack(rowCount);
            }
        }
    }

    // 接收攻击（增加干扰行）
    receiveAttack(lines) {
        // 只有消2行以上才产生攻击，或者根据规则映射
        // 这里简单模拟：对方增加等量行（或自定义规则）
        const attackLines = lines; 
        for (let i = 0; i < attackLines; i++) {
            // 底部移除一行，顶部增加一行垃圾行
            this.grid.shift(); // 移除顶部空行
            const garbageRow = Array(COLS).fill(8); // 8 是灰色
            // 随机留一个空隙，增加可玩性
            const randomHole = Math.floor(Math.random() * COLS);
            garbageRow[randomHole] = 0;
            this.grid.push(garbageRow);
        }
    }

    // 更新界面分数显示
    updateScore() {
        if (!this.isAI) {
            document.getElementById('playerScore').innerText = this.score;
            document.getElementById('playerLines').innerText = this.lines;
        } else {
            document.getElementById('aiScore').innerText = this.score;
            document.getElementById('aiLines').innerText = this.lines;
        }
    }

// 游戏主循环更新逻辑
    update(time = 0) {
        if (this.gameOver) {
            this.drawGameOver();
            return;
        }

        const deltaTime = time - this.lastTime;
        this.dropCounter += deltaTime;
        
        // 控制下落速度
        if (this.dropCounter > this.dropInterval) {
            this.drop();
        }
        
        this.lastTime = time;

        // AI 逻辑
        if (this.isAI) {
            this.aiCounter++;
            // 简单的 AI 延迟，避免 AI 操作过快
            if (this.aiCounter > 20) { 
                this.runAI();
                this.aiCounter = 0;
            }
        }

        this.render();
        requestAnimationFrame(this.update.bind(this));
    }

    drawGameOver() {
        this.ctx.fillStyle = 'rgba(0, 0, 0, 0.75)';
        this.ctx.fillRect(0, 0, this.canvas.width, this.canvas.height);
        this.ctx.fillStyle = 'red';
        this.ctx.font = '20px Arial';
        this.ctx.textAlign = 'center';
        this.ctx.fillText('GAME OVER', this.canvas.width / 2, this.canvas.height / 2);
    }

    runAI() {
        // 非常简单的 AI：随机左右移动或旋转
        const ops = ['left', 'right', 'rotate', 'drop'];
        const op = ops[Math.floor(Math.random() * ops.length)];
        
        if (op === 'left') this.move(-1);
        else if (op === 'right') this.move(1);
        else if (op === 'rotate') this.playerRotate(1);
        else if (op === 'drop') this.drop();
    }

// --- 启动逻辑 ---
// 这里的代码在页面加载后执行，模拟启动流程

// 1. 实例化玩家游戏
const playerGame = new Game(playerCanvas, playerCtx, false);

// 2. 实例化 AI 游戏
const aiGame = new Game(aiCanvas, aiCtx, true);

// 3. 建立对战连接
playerGame.opponent = aiGame;
aiGame.opponent = playerGame;

// 4. 启动游戏循环
// 使用 requestAnimationFrame 确保在各种设备刷新率下都能正常运行
requestAnimationFrame(playerGame.update.bind(playerGame));
requestAnimationFrame(aiGame.update.bind(aiGame));

console.log("游戏已启动：测试流程完成，循环正在运行。");
</script>
