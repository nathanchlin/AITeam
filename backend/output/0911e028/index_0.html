<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>斗地主游戏界面</title>
<style>
  body {
    margin: 0;
    overflow: hidden;
  }
  canvas {
    display: block;
  }
</style>
</head>
<body>
<canvas id="gameCanvas"></canvas>
<script>
// 游戏设置
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const scale = 1; // 渲染缩放比例
canvas.width = window.innerWidth * scale;
canvas.height = window.innerHeight * scale;

// 游戏对象
const cardTable = {
  width: 600,
  height: 300,
  x: (canvas.width - 600) / 2,
  y: 50
};

const cardPile = {
  width: 100,
  height: 150,
  x: (canvas.width - 100) / 2,
  y: cardTable.y + cardTable.height + 50
};

const playerArea = {
  width: 300,
  height: 100,
  x: (canvas.width - 300) / 2,
  y: cardTable.y + cardTable.height + 200
};

// 渲染函数
function render() {
  ctx.scale(scale, scale);
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  // 绘制牌桌
  ctx.fillStyle = 'gray';
  ctx.fillRect(cardTable.x, cardTable.y, cardTable.width, cardTable.height);

  // 绘制牌堆
  ctx.fillStyle = 'red';
  ctx.fillRect(cardPile.x, cardPile.y, cardPile.width, cardPile.height);

  // 绘制玩家区域
  ctx.fillStyle = 'blue';
  ctx.fillRect(playerArea.x, playerArea.y, playerArea.width, playerArea.height);

  requestAnimationFrame(render);
}

// 初始化游戏
function init() {
  window.addEventListener('resize', () => {
    canvas.width = window.innerWidth * scale;
    canvas.height = window.innerHeight * scale;
    render();
  });

  // 绑定键盘事件
  window.addEventListener('keydown', (e) => {
    // 根据按键实现相应功能
    console.log('Key pressed:', e.key);
  });

  render();
}

// 启动游戏
window.onload = init;
</script>
</body>
</html>
