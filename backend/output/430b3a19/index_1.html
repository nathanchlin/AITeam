<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jump Game</title>
<style>
  body { margin: 0; overflow: hidden; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="gameCanvas"></canvas>
<script>
  const canvas = document.getElementById('gameCanvas');
  const ctx = canvas.getContext('2d');

  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;

  const player = {
    x: 50,
    y: canvas.height - 100,
    width: 50,
    height: 50,
    gravity: 0.5,
    jumpHeight: -15,
    velocityY: 0
  };

  const ground = {
    x: 0,
    y: canvas.height - 50,
    width: canvas.width,
    height: 50
  };

  const obstacles = [];

  function drawPlayer() {
    ctx.fillStyle = 'blue';
    ctx.fillRect(player.x, player.y, player.width, player.height);
  }

  function drawGround() {
    ctx.fillStyle = 'green';
    ctx.fillRect(ground.x, ground.y, ground.width, ground.height);
  }

  function drawObstacles() {
    obstacles.forEach(obstacle => {
      ctx.fillStyle = 'red';
      ctx.fillRect(obstacle.x, obstacle.y, obstacle.width, obstacle.height);
    });
  }

  function update() {
    player.velocityY += player.gravity;
    player.y += player.velocityY;

    if (player.y + player.height >= ground.y) {
      player.y = ground.y - player.height;
      player.velocityY = 0;
    }

    if (player.velocityY < 0) {
      // Draw a shadow under the player
      ctx.fillStyle = 'rgba(0, 0, 0, 0.5)';
      ctx.fillRect(player.x, player.y + player.height, player.width, 20);
    }

    // Add a new obstacle every 500 frames
    if (obstacles.length === 0 || obstacles[obstacles.length - 1].x < canvas.width) {
      const obstacleWidth = Math.floor(Math.random() * 50) + 50;
      const obstacleHeight = Math.floor(Math.random() * 50) + 50;
      obstacles.push({
        x: canvas.width,
        y: ground.y - obstacleHeight,
        width: obstacleWidth,
        height: obstacleHeight
      });
    }

    // Move obstacles to the left
    obstacles.forEach(obstacle => {
      obstacle.x -= 2;
    });

    // Remove obstacles that are off the screen
    obstacles = obstacles.filter(obstacle => obstacle.x > 0);
  }

  function render() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    drawGround();
    drawPlayer();
    drawObstacles();
  }

  function gameLoop() {
    update();
    render();
    requestAnimationFrame(gameLoop);
  }

  window.onload = function() {
    gameLoop();
  };

  document.addEventListener('keydown', function(event) {
    if (event.code === 'Space') {
      player.velocityY = player.jumpHeight;
    }
  });
</script>
</body>
</html>
