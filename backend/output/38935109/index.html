<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>背包战争 - Backpack War</title>
<style>
  * {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
  }
  body {
    margin: 0;
    overflow: hidden;
    background: linear-gradient(135deg, #0f0c29, #302b63, #24243e); 
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    min-height: 100vh;
  }
  
  #gameContainer {
    position: relative;
    width: 100vw;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
  }
  
  #gameCanvas {
    display: block;
    background: #1a1a2e;
    border: 4px solid #00d4ff;
    border-radius: 12px;
    box-shadow: 0 0 50px rgba(0, 212, 255, 0.3);
    touch-action: none;
  }
  
  #gameTitle {
    position: absolute;
    top: 15px;
    left: 50%;
    transform: translateX(-50%);
    color: #fff;
    font-size: clamp(20px, 4vw, 32px);
    font-weight: bold;
    text-shadow: 0 0 10px rgba(0, 212, 255, 0.8), 3px 3px 0px #000;
    letter-spacing: 3px;
    z-index: 100;
    white-space: nowrap;
    background: linear-gradient(90deg, #fff, #00d4ff, #fff);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-size: 200% auto;
    animation: shine 3s linear infinite;
  }

  @keyframes shine {
    to { background-position: 200% center; }
  }
  
  /* 顶部状态栏 */
  #topBar {
    position: absolute;
    top: 60px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    gap: 20px;
    z-index: 100;
  }
  
  .stat-badge {
    background: rgba(0, 0, 0, 0.6);
    border: 2px solid rgba(0, 212, 255, 0.5);
    border-radius: 20px;
    padding: 8px 16px;
    color: #fff;
    font-size: 14px;
    display: flex;
    align-items: center;
    gap: 8px;
    backdrop-filter: blur(10px);
    transition: all 0.3s ease;
  }
  
  .stat-badge.highlight {
    animation: badgePulse 0.5s ease;
    border-color: #ffd700;
    box-shadow: 0 0 20px rgba(255, 215, 0, 0.5);
  }
  
  @keyframes badgePulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.1); }
  }
  
  .stat-badge .icon {
    font-size: 18px;
  }
  
  .stat-badge .value {
    font-weight: bold;
    color: #00d4ff;
    transition: all 0.3s ease;
  }
  
  .stat-badge .value.changed {
    color: #4ade80;
    transform: scale(1.2);
  }
  
  /* 通知系统 - 增强版 */
  #notification {
    position: fixed;
    top: 120px;
    left: 50%;
    transform: translateX(-50%) translateY(-20px);
    background: linear-gradient(135deg, rgba(0, 212, 255, 0.95), rgba(79, 172, 254, 0.95));
    color: #000;
    padding: 14px 35px;
    border-radius: 30px;
    font-weight: bold;
    font-size: 15px;
    box-shadow: 0 8px 30px rgba(0, 0, 0, 0.5), 0 0 20px rgba(0, 212, 255, 0.3);
    opacity: 0;
    pointer-events: none;
    transition: all 0.4s cubic-bezier(0.68, -0.55, 0.265, 1.55);
    z-index: 500;
  }
  #notification.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }
  
  #notification.success {
    background: linear-gradient(135deg, rgba(74, 222, 128, 0.95), rgba(34, 197, 94, 0.95));
  }
  
  #notification.warning {
    background: linear-gradient(135deg, rgba(251, 191, 36, 0.95), rgba(245, 158, 11, 0.95));
  }
  
  #notification.error {
    background: linear-gradient(135deg, rgba(248, 113, 113, 0.95), rgba(239, 68, 68, 0.95));
  }

  /* 教程遮罩层 - 简化版 */
  #tutorialOverlay {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0, 0, 0, 0.9);
    display: flex;
    justify-content: center;
    align-items: center;
    z-index: 1000;
    backdrop-filter: blur(8px);
  }
  
  .tutorial-card {
    background: linear-gradient(180deg, #2a2a4a 0%, #1a1a2e 100%);
    border: 3px solid #00d4ff;
    border-radius: 20px;
    padding: 35px;
    max-width: 480px;
    width: 90%;
    max-height: 85vh;
    overflow-y: auto;
    box-shadow: 0 0 60px rgba(0, 212, 255, 0.4), inset 0 0 40px rgba(0, 0, 0, 0.5);
    animation: cardPop 0.4s ease-out;
  }
  
  @keyframes cardPop {
    from { transform: scale(0.8); opacity: 0; }
    to { transform: scale(1); opacity: 1; }
  }
  
  .tutorial-header {
    text-align: center;
    margin-bottom: 25px;
  }
  
  .tutorial-header h2 {
    margin: 0 0 15px 0;
    color: #00d4ff;
    font-size: 26px;
    text-shadow: 0 0 15px rgba(0, 212, 255, 0.5);
  }
  
  .tutorial-step-indicator {
    display: flex;
    justify-content: center;
    gap: 10px;
    margin-bottom: 15px;
  }
  
  .step-dot {
    width: 14px;
    height: 14px;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.2);
    transition: all 0.3s ease;
  }
  
  .step-dot.active {
    background: #00d4ff;
    box-shadow: 0 0 15px #00d4ff;
    transform: scale(1.2);
  }
  
  .step-dot.completed {
    background: #4ade80;
    box-shadow: 0 0 10px rgba(74, 222, 128, 0.5);
  }
  
  .tutorial-content {
    color: #fff;
    line-height: 1.9;
    font-size: 15px;
  }
  
  .tutorial-visual {
    background: rgba(0, 0, 0, 0.5);
    border-radius: 15px;
    padding: 25px;
    margin: 20px 0;
    text-align: center;
    border: 1px solid rgba(0, 212, 255, 0.2);
  }
  
  .tutorial-visual .demo-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 10px;
    max-width: 260px;
    margin: 0 auto 15px;
  }
  
  .demo-slot {
    aspect-ratio: 1;
    background: rgba(255, 255, 255, 0.08);
    border: 2px dashed rgba(255, 255, 255, 0.25);
    border-radius: 10px;
    display: flex;
    justify-content: center;
    align-items: center;
    font-size: 26px;
    transition: all 0.3s ease;
  }
  
  .demo-slot.has-item {
    background: rgba(0, 212, 255, 0.15);
    border: 2px solid rgba(0, 212, 255, 0.5);
    border-style: solid;
  }
  
  .demo-slot.highlight {
    animation: pulse 1s infinite;
    border-color: #ffd700;
  }
  
  @keyframes pulse {
    0%, 100% { box-shadow: 0 0 0 0 rgba(255, 215, 0, 0.5); }
    50% { box-shadow: 0 0 0 12px rgba(255, 215, 0, 0); }
  }
  
  .tutorial-tip {
    background: linear-gradient(90deg, rgba(0, 212, 255, 0.15), rgba(79, 172, 254, 0.15));
    border-left: 4px solid #00d4ff;
    padding: 14px 18px;
    margin: 20px 0;
    border-radius: 0 10px 10px 0;
    font-size: 14px;
    color: #7dd3fc;
  }
  
  .tutorial-footer {
    display: flex;
    justify-content: space-between;
    margin-top: 30px;
    gap: 15px;
  }
  
  .tutorial-btn {
    flex: 1;
    padding: 14px 24px;
    border: none;
    border-radius: 12px;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
    transition: all 0.3s ease;
  }
  
  .tutorial-btn.skip {
    background: transparent;
    color: rgba(255, 255, 255, 0.6);
    border: 2px solid rgba(255, 255, 255, 0.2);
    flex: 0.5;
  }
  
  .tutorial-btn.skip:hover {
    color: #fff;
    border-color: rgba(255, 255, 255, 0.5);
    background: rgba(255, 255, 255, 0.1);
  }
  
  .tutorial-btn.secondary {
    background: rgba(255, 255, 255, 0.1);
    color: #fff;
    border: 2px solid rgba(255, 255, 255, 0.3);
  }
  
  .tutorial-btn.secondary:hover {
    background: rgba(255, 255, 255, 0.2);
  }
  
  .tutorial-btn.primary {
    background: linear-gradient(135deg, #00d4ff, #4facfe);
    color: #000;
    box-shadow: 0 4px 15px rgba(0, 212, 255, 0.3);
  }
  
  .tutorial-btn.primary:hover {
    transform: translateY(-3px);
    box-shadow: 0 8px 25px rgba(0, 212, 255, 0.5);
  }
  
  .key-hint {
    display: inline-block;
    background: rgba(255, 255, 255, 0.2);
    padding: 3px 10px;
    border-radius: 6px;
    font-family: monospace;
    font-size: 12px;
    margin: 0 3px;
    border: 1px solid rgba(255, 255, 255, 0.3);
  }
  
  /* 底部控制栏 */
  #bottomControls {
    position: absolute;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    gap: 15px;
    z-index: 100;
  }
  
  .control-btn {
    background: rgba(0, 0, 0, 0.6);
    border: 2px solid rgba(0, 212, 255, 0.5);
    border-radius: 12px;
    padding: 12px 20px;
    color: #fff;
    font-size: 14px;
    cursor: pointer;
    transition: all 0.3s ease;
    display: flex;
    align-items: center;
    gap: 8px;
    backdrop-filter: blur(10px);
  }
  
  .control-btn:hover {
    background: rgba(0, 212, 255, 0.3);
    border-color: #00d4ff;
    transform: translateY(-2px);
  }
  
  .control-btn.highlight {
    animation: btnHighlight 1s infinite;
    border-color: #ffd700;
  }
  
  @keyframes btnHighlight {
    0%, 100% { box-shadow: 0 0 0 0 rgba(255, 215, 0, 0.5); }
    50% { box-shadow: 0 0 20px 5px rgba(255, 215, 0, 0.3); }
  }
  
  .control-btn .icon {
    font-size: 18px;
  }
  
  /* 背包面板 */
  #inventoryPanel {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%) scale(0.9);
    background: linear-gradient(180deg, rgba(30, 30, 50, 0.98), rgba(10, 10, 30, 0.99));
    border: 3px solid #00d4ff;
    border-radius: 20px;
    padding: 25px;
    z-index: 200;
    display: none;
    box-shadow: 0 0 80px rgba(0, 212, 255, 0.4);
    min-width: 420px;
  }
  
  #inventoryPanel.visible {
    display: block;
    animation: panelPop 0.35s cubic-bezier(0.68, -0.55, 0.265, 1.55);
  }
  
  @keyframes panelPop {
    from { transform: translate(-50%, -50%) scale(0.7); opacity: 0; }
    to { transform: translate(-50%, -50%) scale(1); opacity: 1; }
  }
  
  .panel-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 20px;
    padding-bottom: 15px;
    border-bottom: 2px solid rgba(0, 212, 255, 0.3);
  }
  
  .panel-title {
    color: #00d4ff;
    font-size: 22px;
    font-weight: bold;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  
  .close-btn {
    background: rgba(255, 100, 100, 0.3);
    border: none;
    color: #fff;
    width: 36px;
    height: 36px;
    border-radius: 50%;
    cursor: pointer;
    font-size: 20px;
    transition: all 0.3s ease;
  }
  
  .close-btn:hover {
    background: rgba(255, 100, 100, 0.6);
    transform: rotate(90deg);
  }
  
  /* 背包网格 - 优化视觉设计 */
  .backpack-grid {
    display: grid;
    grid-template-columns: repeat(4, 70px);
    gap: 10px;
    justify-content: center;
    margin-bottom: 20px;
    padding: 15px;
    background: rgba(0, 0, 0, 0.4);
    border-radius: 15px;
    border: 1px solid rgba(255, 255, 255, 0.1);
  }
  
  .grid-slot {
    width: 70px;
    height: 70px;
    background: linear-gradient(145deg, rgba(40, 40, 60, 0.8), rgba(20, 20, 40, 0.9));
    border: 2px dashed rgba(255, 255, 255, 0.15);
    border-radius: 12px;
    display: flex;
    justify-content: center;
    align-items: center;
    cursor: pointer;
    transition: all 0.25s ease;
    position: relative;
    overflow: hidden;
  }
  
  .grid-slot::before {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    background: radial-gradient(circle at center, rgba(255,255,255,0.05) 0%, transparent 70%);
    opacity: 0;
    transition: opacity 0.3s ease;
  }
  
  .grid-slot:hover::before {
    opacity: 1;
  }
  
  .grid-slot:hover {
    transform: translateY(-3px);
    border-color: rgba(0, 212, 255, 0.6);
    box-shadow: 0 8px 25px rgba(0, 0, 0, 0.4), 0 0 15px rgba(0, 212, 255, 0.2);
  }
  
  .grid-slot.empty-hint {
    background: linear-gradient(145deg, rgba(30, 30, 50, 0.5), rgba(15, 15, 35, 0.6));
  }
  
  .grid-slot.empty-hint::after {
    content: '+';
    font-size: 28px;
    color: rgba(255, 255, 255, 0.12);
    font-weight: bold;
    transition: all 0.3s ease;
  }
  
  .grid-slot.empty-hint:hover::after {
    color: rgba(0, 212, 255, 0.5);
    transform: scale(1.2);
  }
  
  .grid-slot.has-item {
    border-style: solid;
    border-width: 2px;
  }
  
  /* 物品类型背景色 */
  .grid-slot.has-item[data-type="weapon"] {
    background: linear-gradient(145deg, rgba(180, 60, 60, 0.4), rgba(120, 30, 30, 0.5));
    border-color: rgba(255, 100, 100, 0.6);
  }
  
  .grid-slot.has-item[data-type="armor"] {
    background: linear-gradient(145deg, rgba(60, 100, 180, 0.4), rgba(30, 60, 120, 0.5));
    border-color: rgba(100, 150, 255, 0.6);
  }
  
  .grid-slot.has-item[data-type="potion"] {
    background: linear-gradient(145deg, rgba(60, 180, 80, 0.4), rgba(30, 120, 40, 0.5));
    border-color: rgba(100, 255, 130, 0.6);
  }
  
  .grid-slot.has-item[data-type="accessory"] {
    background: linear-gradient(145deg, rgba(150, 60, 180, 0.4), rgba(100, 30, 130, 0.5));
    border-color: rgba(200, 130, 255, 0.6);
  }
  
  /* 稀有度边框发光效果 */
  .grid-slot.has-item[data-rarity="common"] {
    box-shadow: inset 0 0 15px rgba(158, 158, 158, 0.3), 0 2px 10px rgba(0, 0, 0, 0.3);
  }
  
  .grid-slot.has-item[data-rarity="rare"] {
    box-shadow: inset 0 0 20px rgba(33, 150, 243, 0.4), 0 0 20px rgba(33, 150, 243, 0.3);
    border-color: #2196f3;
  }
  
  .grid-slot.has-item[data-rarity="epic"] {
    box-shadow: inset 0 0 25px rgba(156, 39, 176, 0.5), 0 0 25px rgba(156, 39, 176, 0.4);
    border-color: #9c27b0;
    animation: epicGlow 2s ease-in-out infinite;
  }
  
  @keyframes epicGlow {
    0%, 100% { box-shadow: inset 0 0 25px rgba(156, 39, 176, 0.5), 0 0 25px rgba(156, 39, 176, 0.4); }
    50% { box-shadow: inset 0 0 30px rgba(156, 39, 176, 0.7), 0 0 35px rgba(156, 39, 176, 0.6); }
  }
  
  .grid-slot.has-item[data-rarity="legendary"] {
    box-shadow: inset 0 0 30px rgba(255, 152, 0, 0.6), 0 0 30px rgba(255, 152, 0, 0.5);
    border-color: #ff9800;
    animation: legendaryGlow 1.5s ease-in-out infinite, legendaryShine 3s linear infinite;
  }
  
  @keyframes legendaryGlow {
    0%, 100% { box-shadow: inset 0 0 30px rgba(255, 152, 0, 0.6), 0 0 30px rgba(255, 152, 0, 0.5); }
    50% { box-shadow: inset 0 0 40px rgba(255, 200, 0, 0.8), 0 0 45px rgba(255, 200, 0, 0.7); }
  }
  
  @keyframes legendaryShine {
    0% { filter: brightness(1); }
    25% { filter: brightness(1.2); }
    50% { filter: brightness(1); }
    75% { filter: brightness(1.3); }
    100% { filter: brightness(1); }
  }
  
  .grid-slot.selected {
    border-color: #ffd700 !important;
    box-shadow: 0 0 20px rgba(255, 215, 0, 0.6), inset 0 0 15px rgba(255, 215, 0, 0.3) !important;
    transform: translateY(-3px) scale(1.05);
  }
  
  .grid-slot.can-merge {
    animation: mergeHint 0.8s ease-in-out infinite;
  }
  
  @keyframes mergeHint {
    0%, 100% { 
      box-shadow: inset 0 0 20px rgba(255, 215, 0, 0.4), 0 0 15px rgba(255, 215, 0, 0.3);
    }
    50% { 
      box-shadow: inset 0 0 30px rgba(255, 215, 0, 0.7), 0 0 25px rgba(255, 215, 0, 0.5);
    }
  }
  
  .grid-slot.just-added {
    animation: itemAdded 0.6s ease;
  }
  
  @keyframes itemAdded {
    0% { transform: scale(0) rotate(-180deg); }
    50% { transform: scale(1.2) rotate(10deg); }
    100% { transform: scale(1) rotate(0deg); }
  }
  
  .grid-slot .item-icon {
    font-size: 36px;
    filter: drop-shadow(0 3px 6px rgba(0,0,0,0.6));
    transition: transform 0.3s ease;
    z-index: 2;
  }
  
  .grid-slot:hover .item-icon {
    transform: scale(1.1);
  }
  
  .grid-slot .item-rarity {
    position: absolute;
    top: 4px;
    right: 4px;
    width: 10px;
    height: 10px;
    border-radius: 50%;
    border: 2px solid rgba(255, 255, 255, 0.3);
    z-index: 3;
  }
  
  .grid-slot .item-level {
    position: absolute;
    bottom: 3px;
    right: 3px;
    font-size: 10px;
    font-weight: bold;
    color: #fff;
    background: rgba(0, 0, 0, 0.7);
    padding: 1px 4px;
    border-radius: 4px;
    z-index: 3;
  }
  
  .rarity-common { background: radial-gradient(circle, #bdbdbd, #757575); }
  .rarity-rare { background: radial-gradient(circle, #64b5f6, #1976d2); }
  .rarity-epic { background: radial-gradient(circle, #ce93d8, #7b1fa2); }
  .rarity-legendary { 
    background: radial-gradient(circle, #ffca28, #ff8f00); 
    box-shadow: 0 0 10px #ff9800;
    animation: rarityPulse 1s infinite;
  }
  
  @keyframes rarityPulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.2); }
  }
  
  /* 物品商店区域 - 优化设计 */
  .shop-area {
    background: linear-gradient(180deg, rgba(255, 193, 7, 0.1), rgba(255, 152, 0, 0.05));
    border: 2px solid rgba(255, 193, 7, 0.3);
    border-radius: 15px;
    padding: 15px;
    margin-bottom: 15px;
    position: relative;
    transition: all 0.3s ease;
  }
  
  .shop-area.highlight {
    border-color: #ffd700;
    box-shadow: 0 0 30px rgba(255, 215, 0, 0.3);
    animation: shopHighlight 1.5s infinite;
  }
  
  @keyframes shopHighlight {
    0%, 100% { box-shadow: 0 0 30px rgba(255, 215, 0, 0.3); }
    50% { box-shadow: 0 0 50px rgba(255, 215, 0, 0.5); }
  }
  
  .shop-title {
    color: #ffc107;
    font-size: 15px;
    margin-bottom: 12px;
    display: flex;
    align-items: center;
    gap: 8px;
    font-weight: bold;
    text-shadow: 0 0 10px rgba(255, 193, 7, 0.3);
  }
  
  .shop-title .gold-icon {
    animation: coinSpin 2s linear infinite;
  }
  
  @keyframes coinSpin {
    0%, 100% { transform: rotateY(0deg); }
    50% { transform: rotateY(180deg); }
  }
  
  .shop-items {
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
    justify-content: center;
  }
  
  .shop-item {
    background: linear-gradient(145deg, rgba(40, 40, 60, 0.9), rgba(25, 25, 45, 0.95));
    border: 2px solid rgba(255, 255, 255, 0.2);
    border-radius: 12px;
    padding: 10px;
    cursor: pointer;
    transition: all 0.3s ease;
    text-align: center;
    min-width: 65px;
    position: relative;
    overflow: hidden;
  }
  
  .shop-item::before {
    content: '';
    position: absolute;
    top: 0;
    left: -100%;
    width: 100%;
    height: 100%;
    background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.1), transparent);
    transition: left 0.5s ease;
  }
  
  .shop-item:hover::before {
    left: 100%;
  }
  
  .shop-item:hover {
    transform: translateY(-5px);
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4), 0 0 20px rgba(255, 193, 7, 0.3);
    border-color: #ffc107;
  }
  
  .shop-item .item-icon {
    font-size: 28px;
    display: block;
    margin-bottom: 6px;
    filter: drop-shadow(0 2px 4px rgba(0,0,0,0.5));
    transition: transform 0.3s ease;
  }
  
  .shop-item:hover .item-icon {
    transform: scale(1.15) rotate(5deg);
  }
  
  .shop-item .item-cost {
    font-size: 12px;
    color: #ffd700;
    font-weight: bold;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 3px;
  }
  
  .shop-item .item-name {
    font-size: 10px;
    color: rgba(255, 255, 255, 0.7);
    margin-top: 4px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  
  .shop-item .buy-hint {
    position: absolute;

function resizeCanvas() {
  const ratio = 16 / 9;
  let w = window.innerWidth * 0.9;
  let h = window.innerHeight * 0.7;
  
  if (w / h > ratio) {
    canvas.height = h;
    canvas.width = h * ratio;
  } else {
    canvas.width = w;
    canvas.height = w / ratio;
  }
}

// ============ 教程系统（简化版）============
function renderTutorial() {
  const step = tutorialSteps[tutorialStep];
  
  document.getElementById('tutorialTitle').textContent = step.title;
  document.getElementById('tutorialContent').innerHTML = step.content;
  
  // 步骤指示器
  const indicator = document.getElementById('stepIndicator');
  indicator.innerHTML = tutorialSteps.map((_, i) => 
    `<div class="step-dot ${i < tutorialStep ? 'completed' : (i === tutorialStep ? 'active' : '')}"></div>`
  ).join('');
  
  // 按钮状态
  document.getElementById('tutorialPrev').style.display = tutorialStep === 0 ? 'none' : 'block';
  document.getElementById('tutorialSkip').style.display = tutorialStep === tutorialSteps.length - 1 ? 'none' : 'block';
  document.getElementById('tutorialNext').textContent = 
    tutorialStep === tutorialSteps.length - 1 ? '开始游戏！' : '下一步';
}

function nextTutorialStep() {
  if (tutorialStep < tutorialSteps.length - 1) {
    tutorialStep++;
    renderTutorial();
  } else {
    closeTutorial();
  }
}

function prevTutorialStep() {
  if (tutorialStep > 0) {
    tutorialStep--;
    renderTutorial();
  }
}

function skipTutorial() {
  closeTutorial();
}

function startTutorial() {
  tutorialStep = 0;
  renderTutorial();
  tutorialOverlay.style.display = 'flex';
}

function closeTutorial() {
  tutorialOverlay.style.display = 'none';

// ============ 粒子效果系统 ============
function createParticles(x, y, emoji, count = 8) {
  for (let i = 0; i < count; i++) {
    const particle = document.createElement('div');
    particle.className = 'particle';
    particle.textContent = emoji;
    particle.style.left = x + 'px';
    particle.style.top = y + 'px';
    particle.style.fontSize = (16 + Math.random() * 12) + 'px';
    
    const angle = (Math.PI * 2 / count) * i + Math.random() * 0.5;
    const distance = 50 + Math.random() * 50;
    const tx = Math.cos(angle) * distance;
    const ty = Math.sin(angle) * distance - 30;
    
    particle.style.setProperty('--tx', tx + 'px');
    particle.style.setProperty('--ty', ty + 'px');
    
    particleContainer.appendChild(particle);
    
    setTimeout(() => particle.remove(), 1000);
  }
}

// ============ 背包系统 ============
function renderBackpackGrid() {
  const grid = document.getElementById('backpackGrid');
  grid.innerHTML = '';
  
  for (let i = 0; i < BACKPACK_SIZE; i++) {
    const slot = document.createElement('div');
    const item = backpack[i];
    
    let classes = 'grid-slot';
    if (item) {
      classes += ' has-item';
    } else {
      classes += ' empty-hint';
    }
    if (selectedSlot === i) classes += ' selected';
    
    slot.className = classes;
    slot.dataset.index = i;
    
    if (item) {
      slot.dataset.type = item.type;
      slot.dataset.rarity = item.rarity;
      
      // 检查是否可合并
      if (selectedSlot !== -1 && selectedSlot !== i && canMerge(selectedSlot, i)) {
        slot.classList.add('can-merge');
      }
      
      slot.innerHTML = `
        <span class="item-icon">${item.icon}</span>
        <span class="item-rarity rarity-${item.rarity}"></span>
      `;
    }
    
    slot.addEventListener('click', () => selectSlot(i));
    slot.addEventListener('mouseenter', (e) => showItemTooltip(e, backpack[i]));
    slot.addEventListener('mouseleave', hideItemTooltip);
    
    grid.appendChild(slot);
  }
}

function selectSlot(index) {
  if (selectedSlot === index) {
    selectedSlot = -1;
  } else if (selectedSlot !== -1 && backpack[selectedSlot] && backpack[index]) {
    // 尝试合并
    if (canMerge(selectedSlot, index)) {
      mergeItems(selectedSlot, index);
    } else {
      // 交换位置
      [backpack[selectedSlot], backpack[index]] = [backpack[index], backpack[selectedSlot]];
      showNotification('物品已交换位置', 'success');
    }
    selectedSlot = -1;
  } else if (selectedSlot !== -1 && backpack[selectedSlot] && !backpack[index]) {
    // 移动物品
    backpack[index] = backpack[selectedSlot];
    backpack[selectedSlot] = null;
    selectedSlot = -1;
    showNotification('物品已移动', 'success');
  } else {
    selectedSlot = index;
  }
  
  renderBackpackGrid();
  updateMergeButton();
  calculateStats();
}

function addToBackpack(item, silent = false) {
  for (let i = 0; i < BACKPACK_SIZE; i++) {
    if (!backpack[i]) {
      backpack[i] = item;
      renderBackpackGrid();
      calculateStats();
      
      // 添加动画效果
      if (!silent) {
        setTimeout(() => {
          const slots = document.querySelectorAll('.grid-slot');
          if (slots[i]) {
            slots[i].classList.add('just-added');
            // 创建粒子效果
            const rect = slots[i].getBoundingClientRect();
            createParticles(rect.left + rect.width/2, rect.top + rect.height/2, item.icon, 6);
          }
        }, 50);
      }
      
      return true;
    }
  }
  showNotification('背包已满！', 'error');
  return false;
}

function canMerge(slot1, slot2) {
  if (!backpack[slot1] || !backpack[slot2]) return false;
  return backpack[slot1].id === backpack[slot2].id && 
         backpack[slot1].rarity === backpack[slot2].rarity;
}

function mergeItems(slot1, slot2) {
  const item = backpack[slot1];
  
  // 获取合并位置的中心点用于粒子效果
  const slots = document.querySelectorAll('.grid-slot');
  const rect1 = slots[slot1].getBoundingClientRect();
  const rect2 = slots[slot2].getBoundingClientRect();
  const centerX = (rect1.left + rect2.left) / 2 + rect1.width / 2;
  const centerY = (rect1.top + rect2.top) / 2 + rect1.height / 2;
  
  if (mergeUpgrades[item.id]) {
    const upgrade = mergeUpgrades[item.id];
    backpack[slot1] = {...upgrade};
    backpack[slot2] = null;
    
    // 创建合并粒子效果
    createParticles(centerX, centerY, '✨', 12);
    createParticles(centerX, centerY, upgrade.icon, 6);
    
    showNotification(`✨ 合成成功！获得 ${upgrade.name}！`, 'success');
  } else {
    // 通用升级：提升稀有度
    const rarities = ['common', 'rare', 'epic', 'legendary'];
    const currentIdx = rarities.indexOf(item.rarity);
    if (currentIdx < rarities.length - 1) {
      const rarityMultipliers = { common: 1, rare: 1.5, epic: 2, legendary: 3 };
      const nextRarity = rarities[currentIdx + 1];
      const multiplier = rarityMultipliers[nextRarity] / rarityMultipliers[item.rarity];
      
      backpack[slot1] = {
        ...item,
        rarity: nextRarity,
        stats: {
          attack: Math.round((item.stats.attack || 0) * multiplier),
          defense: Math.round((item.stats.defense || 0) * multiplier),
          speed: Math.round((item.stats.speed || 0) * multiplier),
          heal: Math.round((item.stats.heal || 0) * multiplier),
          crit: item.stats.crit || 0
        }
      };
      backpack[slot2] = null;
      
      // 创建合并粒子效果
      createParticles(centerX, centerY, '⬆️', 8);
      createParticles(centerX, centerY, '✨', 10);
      
      const rarityNames = { common: '普通', rare: '稀有', epic: '史诗', legendary: '传说' };
      showNotification(`⬆️ 合成成功！${item.name} 升级为 ${rarityNames[nextRarity]}！`, 'success');
    }
  }
  
  // 高亮属性面板
  highlightStats();
  
  renderBackpackGrid();
  calculateStats();
}

function attemptMerge() {
  // 查找可合并的物品
  for (let i = 0; i < BACKPACK_SIZE; i++) {
    for (let j = i + 1; j < BACKPACK_SIZE; j++) {
      if (canMerge(i, j)) {
        mergeItems(i, j);
        return;
      }
    }
  }
  showNotification('没有可以合并的物品', 'warning');
}

function updateMergeButton() {
  const btn = document.getElementById('mergeBtn');
  let canMergeAny = false;
  
  for (let i = 0; i < BACKPACK_SIZE && !canMergeAny; i++) {
    for (let j = i + 1; j < BACKPACK_SIZE && !canMergeAny; j++) {
      if (canMerge(i, j)) {
        canMergeAny = true;
      }
    }
  }
  
  btn.disabled = !canMergeAny;
  if (canMergeAny) {
    btn.classList.add('can-merge');
  } else {
    btn.classList.remove('can-merge');
  }
}

// ============ 商店系统 ============
function generateShopItems() {
  shopItems = [];
  const availableItems = itemDatabase.filter(item => item.cost <= 20);
  
  for (let i = 0; i < 4; i++) {
    const randomItem = availableItems[Math.floor(Math.random() * availableItems.length)];
    shopItems.push({...randomItem});
  }
}

function renderShopItems() {
  const container = document.getElementById('shopItems');
  container.innerHTML = '';
  
  shopItems.forEach((item, index) => {
    const itemEl = document.createElement('div');
    const isAffordable = gameState.gold >= item.cost;
    itemEl.className = `shop-item ${isAffordable ? 'affordable' : 'unaffordable'}`;
    itemEl.dataset.type = item.type;
    itemEl.dataset.index = index;
    
    itemEl.innerHTML = `
      <span class="item-icon">${item.icon}</span>
      <span class="item-cost">💰${item.cost}</span>
      <span class="item-name">${item.name}</span>
      <span class="buy-hint">${isAffordable ? '点击购买' : '金币不足'}</span>
    `;
    
    itemEl.addEventListener('click', () => buyItem(index, itemEl));
    itemEl.addEventListener('mouseenter', (e) => showItemTooltip(e, item));
    itemEl.addEventListener('mouseleave', hideItemTooltip);
    
    container.appendChild(itemEl);
  });
}

function buyItem(index, element) {
  const item = shopItems[index];
  
  if (gameState.gold >= item.cost) {
    if (addToBackpack({...item})) {
      gameState.gold -= item.cost;
      updateStats();
      
      // 动画效果
      element.classList.add('just-bought');
      setTimeout(() => element.classList.remove('just-bought'), 500);
      
      // 高亮金币显示
      document.getElementById('goldValue').classList.add('changed');
      setTimeout(() => document.getElementById('goldValue').classList.remove('changed'), 500);
      
      showNotification(`✓ 购买了 ${item.icon} ${item.name}！`, 'success');
      
      // 移除商店高亮（首次购买后）
      document.getElementById('shopArea').classList.remove('highlight');
      
      // 更新快速提示
      updateQuickTip();
      
      // 刷新商店物品
      const availableItems = itemDatabase.filter(i => i.cost <= 30);
      shopItems[index] = {...availableItems[Math.floor(Math.random() * availableItems.length)]};
      renderShopItems();
      
      // 检查是否可以合并，显示战斗提示
      checkAndShowBattleHint();
    }
  } else {
    showNotification('💰 金币不足！', 'error');
    element.style.animation = 'shake 0.3s ease';
    setTimeout(() => element.style.animation = '', 300);
  }
}

function updateQuickTip() {
  const tip = document.getElementById('quickTip');
  
  // 检查是否有可合并的物品
  let canMergeAny = false;
  for (let i = 0; i < BACKPACK_SIZE; i++) {
    for (let j = i + 1; j < BACKPACK_SIZE; j++) {
      if (backpack[i] && backpack[j] && 
          backpack[i].id === backpack[j].id && 
          backpack[i].rarity === backpack[j].rarity) {
        canMergeAny = true;
        break;
      }
    }
    if (canMergeAny) break;
  }
  
  if (canMergeAny) {
    tip.innerHTML = '💡 有装备可以<span class="action">合并升级</span>！选中一个装备后点击另一个相同的';
  } else {
    tip.innerHTML = '💡 <span class="action">点击商店物品</span>购买装备，准备好后<span class="action">开始战斗</span>！';
  }
}

function checkAndShowBattleHint() {
  if (!hasShownBattleHint && gameState.attack > 15) {
    hasShownBattleHint = true;
    document.getElementById('battleControlBtn').classList.add('highlight');
    showNotification('⚔️ 装备准备好了！点击战斗按钮开始冒险！', 'success');
  }
}

// ============ 物品提示 - 优化版 ============
function showItemTooltip(e, item) {
  if (!item) return;
  
  const rarityNames = {
    common: '普通',
    rare: '稀有',
    epic: '史诗',
    legendary: '传说'
  };
  
  const rarityColors = {
    common: '#9e9e9e',
    rare: '#2196f3',
    epic: '#9c27b0',
    legendary: '#ff9800'
  };
  
  const typeNames = {
    weapon: '武器',
    armor: '防具',
    potion: '药水',
    accessory: '饰品'
  };
  
  // 设置图标和类型背景
  const iconWrap = itemTooltip.querySelector('.tip-icon-wrap');
  iconWrap.className = `tip-icon-wrap ${item.type}`;
  iconWrap.textContent = item.icon;
  
  itemTooltip.querySelector('.tip-name').textContent = item.name;
  itemTooltip.querySelector('.tip-rarity').textContent = rarityNames[item.rarity];
  itemTooltip.querySelector('.tip-rarity').style.color = rarityColors[item.rarity];
  
  // 构建属性显示
  let statsHtml = '';
  if (item.stats.attack) {
    statsHtml += `<div class="tip-stat"><span class="tip-stat-icon">⚔️</span>攻击力 <span class="tip-stat-value">+${item.stats.attack}</span></div>`;
  }
  if (item.stats.defense) {
    statsHtml += `<div class="tip-stat"><span class="tip-stat-icon">🛡️</span>防御力 <span class="tip-stat-value">+${item.stats.defense}</span></div>`;
  }
  if (item.stats.speed) {
    statsHtml += `<div class="tip-stat"><span class="tip-stat-icon">💨</span>速度 <span class="tip-stat-value">+${item.stats.speed}%</span></div>`;
  }
  if (item.stats.heal) {
    statsHtml += `<div class="tip-stat"><span class="tip-stat-icon">💊</span>每回合恢复 <span class="tip-stat-value">+${item.stats.heal}</span></div>`;
  }
  if (item.stats.crit) {
    statsHtml += `<div class="tip-stat"><span class="tip-stat-icon">💥</span>暴击率 <span class="tip-stat-value">+${item.stats.crit}%</span></div>`;
  }
  
  // 添加类型标签
  statsHtml += `<div class="tip-type-badge" style="background: ${ITEM_TYPES[item.type].color}; color: #fff;">${typeNames[item.type]}</div>`;
  
  itemTooltip.querySelector('.tip-stats').innerHTML = statsHtml;
  itemTooltip.querySelector('.tip-desc').textContent = item.desc;
  
  itemTooltip.style.display = 'block';
  
  // 智能定位，避免超出屏幕
  const rect = itemTooltip.getBoundingClientRect();
  let x = e.clientX + 15;
  let y = e.clientY + 15;
  
  if (x + rect.width > window.innerWidth) {
    x = e.clientX - rect.width - 15;
  }
  if (y + rect.height > window.innerHeight) {
    y = e.clientY - rect.height - 15;
  }
  
  itemTooltip.style.left = x + 'px';
  itemTooltip.style.top = y + 'px';
}

function hideItemTooltip() {
  itemTooltip.style.display = 'none';
}

// ============ 属性计算 ============
function calculateStats() {
  const oldAttack = gameState.attack;
  const oldDefense = gameState.defense;
  
  gameState.attack = 10;
  gameState.defense = 5;
  gameState.speed = 1;
  gameState.critChance = 0.05;
  gameState.healPerTurn = 0;
  
  backpack.forEach(item => {
    if (item) {
      gameState.attack += (item.stats.attack || 0);
      gameState.defense += (item.stats.defense || 0);
      gameState.speed += (item.stats.speed || 0) / 100;
      gameState.critChance += (item.stats.crit || 0) / 100;
      gameState.healPerTurn += (item.stats.heal || 0) / 10;
    }
  });
  
  updateStats();
  
  // 如果属性有提升，高亮显示
  if (gameState.attack > oldAttack || gameState.defense > oldDefense) {
    highlightStats();
  }
}

function highlightStats() {
  const statItems = document.querySelectorAll('.stat-item');
  statItems.forEach(item => {
    item.classList.add('highlight');
    setTimeout(() => item.classList.remove('highlight'), 500);
  });
}

function updateStats() {
  document.getElementById('hpValue').textContent = `${gameState.hp}/${gameState.maxHp}`;
  document.getElementById('goldValue').textContent = gameState.gold;
  document.getElementById('waveValue').textContent = gameState.wave;
  
  // 更新属性面板
  document.getElementById('atkValue').textContent = gameState.attack;
  document.getElementById('defValue').textContent = gameState.defense;
  document.getElementById('spdValue').textContent = gameState.speed.toFixed(2) + 'x';
  document.getElementById('healValue').textContent = Math.floor(gameState.healPerTurn);
}

// ============ 战斗系统 ============
function startBattle() {
  if (isBattling) return;
  
  // 移除战斗按钮高亮
  document.getElementById('battleControlBtn').classList.remove('highlight');
  
  isBattling = true;
  battlePanel.classList.add('visible');
  inventoryPanel.classList.remove('visible');
  isInventoryOpen = false;
  
  // 选择敌人
  const availableEnemies = enemyDatabase.filter(e => e.wave <= gameState.wave);
  const enemy = {...availableEnemies[availableEnemies.length - 1]};
  const maxEnemyHp = enemy.hp;
  
  document.getElementById('enemyAvatar').textContent = enemy.icon;
  document.getElementById('enemyName').textContent = enemy.name;
  document.getElementById('playerHpText').textContent = `${gameState.hp}/${gameState.maxHp}`;
  document.getElementById('enemyHpText').textContent = `${enemy.hp}/${maxEnemyHp}`;
  document.getElementById('battleLog').innerHTML = '';
  document.getElementById('battleResult').style.display = 'none';
  document.getElementById('battleRewards').style.display = 'none';
  document.getElementById('closeBattleBtn').style.display = 'none';
  
  let playerHp = gameState.hp;
  let enemyHp = enemy.hp;
  
  const battleInterval = setInterval(() => {
    const log = document.getElementById('battleLog');
    const playerAvatar = document.getElementById('playerAvatar');
    const enemyAvatar = document.getElementById('enemyAvatar');
    
    // 玩家攻击
    let playerDamage = Math.max(1, gameState.attack - Math.floor(enemy.defense || 0));
    let isCrit = Math.random() < gameState.critChance;
    if (isCrit) playerDamage = Math.floor(playerDamage * 2);
    
    enemyHp -= playerDamage;
    playerAvatar.classList.add('attacking');
    setTimeout(() => playerAvatar.classList.remove('attacking'), 300);
    
    const critText = isCrit ? '【暴击】' : '';
    log.innerHTML += `<div class="log-entry ${isCrit ? 'log-crit' : 'log-damage'}">
      ${critText}你造成了 ${playerDamage} 点伤害！
    </div>`;
    
    // 更新敌人血条
    const enemyHpPercent = Math.max(0, (enemyHp / maxEnemyHp) * 100);
    document.getElementById('enemyHpFill').style.width = enemyHpPercent + '%';
    document.getElementById('enemyHpText').textContent = `${Math.max(0, enemyHp)}/${maxEnemyHp}`;
    
    // 检查敌人死亡
    if (enemyHp <= 0) {
      clearInterval(battleInterval);
      endBattle(true, enemy);
      return;
    }
    
    // 敌人攻击
    let enemyDamage = Math.max(1, enemy.attack - Math.floor(gameState.defense));
    playerHp -= enemyDamage;
    enemyAvatar.classList.add('attacking');
    setTimeout(() => enemyAvatar.classList.remove('attacking'), 300);
    
    log.innerHTML += `<div class="log-entry log-enemy">
      ${enemy.name}造成了 ${enemyDamage} 点伤害！
    </div>`;
    
    // 玩家治疗
    if (gameState.healPerTurn > 0) {
      const healAmount = Math.floor(gameState.healPerTurn);
      playerHp = Math.min(gameState.maxHp, playerHp + healAmount);
      log.innerHTML += `<div class="log-entry log-heal">
        💊 药水恢复了 ${healAmount} 点生命！
      </div>`;
    }
    
    // 更新玩家血条
    const playerHpPercent = Math.max(0, (playerHp / gameState.maxHp) * 100);
    document.getElementById('playerHpFill').style.width = playerHpPercent + '%';
    document.getElementById('playerHpText').textContent = `${Math.max(0, Math.floor(playerHp))}/${gameState.maxHp}`;
    gameState.hp = Math.max(0, Math.floor(playerHp));
    updateStats();
    
    // 检查玩家死亡
    if (playerHp <= 0) {
      clearInterval(battleInterval);
      endBattle(false, enemy);
      return;
    }
    
    log.scrollTop = log.scrollHeight;
  }, 800 / gameState.speed);
}

function endBattle(victory, enemy) {
  const result = document.getElementById('battleResult');
  const rewards = document.getElementById('battleRewards');
  
  result.style.display = 'block';
  
  if (victory) {
    result.className = 'battle-result victory';
    result.textContent = '🎉 胜利！';
    
    // 计算奖励
    const goldReward = 10 + gameState.wave * 5;
    gameState.gold += goldReward;
    gameState.wave++;
    
    rewards.style.display = 'block';
    document.getElementById('rewardItems').innerHTML = `
      <div class="reward-item">
        <span class="icon">💰</span>
        <span class="amount">+${goldReward}</span>
      </div>
      <div class="reward-item">
        <span class="icon">🏆</span>
        <span class="amount">波次 ${gameState.wave}</span>
      </div>
    `;
    
    // 恢复生命
    gameState.hp = gameState.maxHp;
    
    // 刷新商店
    generateShopItems();
    renderShopItems();
    
    // 更新提示
    updateQuickTip();
  } else {
    result.className = 'battle-result defeat';
    result.textContent = '💀 失败...';
    
    // 惩罚
    gameState.gold = Math.max(0, gameState.gold - 10);
    gameState.hp = gameState.maxHp;
    gameState.wave = Math.max(1, gameState.wave - 1 > 0 ? gameState.wave - 1 : 1);
    
    rewards.style.display = 'block';
    document.getElementById('rewardItems').innerHTML = `
      <div class="reward-item">
        <span class="icon">💔</span>
        <span class="amount">生命已恢复</span>
      </div>
    `;
  }
  
  updateStats();
  document.getElementById('closeBattleBtn').style.display = 'block';
}

function closeBattle() {
  battlePanel.classList.remove('visible');
  isBattling = false;
  
  // 自动打开背包方便继续装备
  setTimeout(() => {
    toggleInventory();
  }, 200);
}

// ============ UI 控制 ============
function toggleInventory() {
  isInventoryOpen = !isInventoryOpen;
  if (isInventoryOpen) {
    inventoryPanel.classList.add('visible');
    updateMergeButton();
    updateQuickTip();
  } else {
    inventoryPanel.classList.remove('visible');
  }
}

function showNotification(message, type = 'info') {
  notification.textContent = message;
  notification.className = type;
  notification.classList.add('show');
  setTimeout(() => {
    notification.classList.remove('show');
  }, 2500);
}

// ============ 键盘监听 ============
function setupKeyboardListeners() {
  document.addEventListener('keydown', (e) => {
    if (e.code === 'KeyB') {
      toggleInventory();
    }
    if (e.code === 'Space' && !isBattling) {
      e.preventDefault();
      startBattle();
    }
    if (e.code === 'KeyH') {
      startTutorial();
    }
    if (e.code === 'Escape') {
      if (isInventoryOpen) toggleInventory();
      if (battlePanel.classList.contains('visible')) closeBattle();
    }
  });
}

// ============ 游戏主循环 ============
let lastTime = 0;
let animationTime = 0;

function gameLoop(timestamp) {
  const deltaTime = (timestamp - lastTime) / 1000;
  lastTime = timestamp;
  animationTime += deltaTime;
  
  // 绘制游戏画面
  drawGame(animationTime);
  
  requestAnimationFrame(gameLoop);
}

function drawGame(time) {
  const w = canvas.width;
  const h = canvas.height;
  
  // 背景
  const gradient = ctx.createLinearGradient(0, 0, 0, h);
  gradient.addColorStop(0, '#0f0c29');
  gradient.addColorStop(0.5, '#302b63');
  gradient.addColorStop(1, '#24243e');
  ctx.fillStyle = gradient;
  ctx.fillRect(0, 0, w, h);
  
  // 星星
  ctx.fillStyle = 'rgba(255, 255, 255, 0.8)';
  for (let i = 0; i < 50; i++) {
    const x = (i * 37 + time * 10) % w;
    const y = (i * 23) % (h * 0.6);
    const size = (Math.sin(time * 2 + i) + 1) * 1.5;
    ctx.beginPath();
    ctx.arc(x, y, size, 0, Math.PI * 2);
    ctx.fill();
  }
  
  // 地面
  const groundY = h * 0.75;
  const groundGradient = ctx.createLinearGradient(0, groundY, 0, h);
  groundGradient.addColorStop(0, '#1a1a2e');
  groundGradient.addColorStop(1, '#0d0d1a');
  ctx.fillStyle = groundGradient;
  ctx.fillRect(0, groundY, w, h - groundY);
  
  // 草地纹理
  ctx.strokeStyle = 'rgba(0, 212, 255, 0.3)';
  ctx.lineWidth = 2;
  for (let x = 0; x < w; x += 20) {
    const grassHeight = 5 + Math.sin(x * 0.1 + time * 3) * 3;
    ctx.beginPath();
    ctx.moveTo(x, groundY);
    ctx.lineTo(x + 5, groundY - grassHeight);
    ctx.stroke();
  }
  
  // 背包图标（中间）
  const bpX = w / 2;
  const bpY = h / 2 - 30;
  const bounce = Math.sin(time * 3) * 5;
  
  ctx.font = '60px serif';
  ctx.textAlign = 'center';
  ctx.fillText('🎒', bpX, bpY + 50 + bounce);
  
  ctx.font = '16px sans-serif';
  ctx.fillStyle = '#00d4ff';
  ctx.fillText('点击下方按钮打开背包', bpX, bpY + 100);
  
  // 玩家角色
  const playerX = w * 0.2;
  const playerY = groundY - 50;
  const bobY = Math.sin(time * 5) * 3;
  
  ctx.font = '45px serif';
  ctx.textAlign = 'center';
  ctx.fillText('🧙', playerX, playerY + bobY);
  
  // 玩家属性显示（带背景）
  ctx.fillStyle = 'rgba(0, 0, 0, 0.5)';
  ctx.roundRect(playerX - 45, playerY + 15, 90, 75, 8);
  ctx.fill();
  
  ctx.font = 'bold 11px sans-serif';
  ctx.textAlign = 'left';
  ctx.fillStyle = '#ff6464';
  ctx.fillText(`⚔️ ATK: ${gameState.attack}`, playerX - 38, playerY + 35);
  ctx.fillStyle = '#6496ff';
  ctx.fillText(`🛡️ DEF: ${gameState.defense}`, playerX - 38, playerY + 52);
  ctx.fillStyle = '#64ff82';
  ctx.fillText(`💨 SPD: ${gameState.speed.toFixed(2)}x`, playerX - 38, playerY + 69);
  ctx.fillStyle = '#ffd700';
  ctx.fillText(`💥 CRIT: ${Math.floor(gameState.critChance * 100)}%`, playerX - 38, playerY + 86);
  
  // 敌人预览
  const enemy = enemyDatabase[Math.min(gameState.wave - 1, enemyDatabase.length - 1)];
  const enemyX = w * 0.8;
  
  ctx.font = '45px serif';
  ctx.textAlign = 'center';
  ctx.fillText(enemy.icon, enemyX, playerY + bobY);
  
  // 敌人属性显示（带背景）
  ctx.fillStyle = 'rgba(50, 0, 0, 0.5)';
  ctx.roundRect(enemyX - 45, playerY + 15, 90, 55, 8);
  ctx.fill();
  
  ctx.font = 'bold 11px sans-serif';
  ctx.fillStyle = '#ff8a80';
  ctx.fillText(enemy.name, enemyX, playerY + 35);
  ctx.fillStyle = '#f44336';
  ctx.textAlign = 'left';
  ctx.fillText(`❤️ HP: ${enemy.hp}`, enemyX - 38, playerY + 52);
  ctx.fillStyle = '#ff5722';
  ctx.fillText(`⚔️ ATK: ${enemy.attack}`, enemyX - 38, playerY + 67);
  
  // VS 文字
  ctx.font = 'bold 28px sans-serif';
  ctx.fillStyle = '#ffd700';
  ctx.textAlign = 'center';
  ctx.shadowColor = 'rgba(255, 215, 0, 0.5)';
  ctx.shadowBlur = 15;
  ctx.fillText('VS', w / 2, playerY);
  ctx.shadowBlur = 0;
  
  // 波次指示器
  ctx.font = 'bold 14px sans-serif';
  ctx.fillStyle = '#00d4ff';
  ctx.fillText(`第 ${gameState.wave} 波`, w / 2, groundY + 25);
}

// Canvas roundRect polyfill
if (!CanvasRenderingContext2D.prototype.roundRect) {
  CanvasRenderingContext2D.prototype.roundRect = function(x, y, w, h, r) {
    if (w < 2 * r) r = w / 2;
    if (h < 2 * r) r = h / 2;
    this.beginPath();
    this.moveTo(x + r, y);
    this.arcTo(x + w, y, x + w, y + h, r);
    this.arcTo(x + w, y + h, x, y + h, r);
    this.arcTo(x, y + h, x, y, r);
    this.arcTo(x, y, x + w, y, r);
    this.closePath();
    return this;
  };
}

// 启动游戏
init();
</script>
