<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Optimized Click Counter Game</title>
<style>
  body {
    margin: 0;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    background-color: #f0f0f0;
  }
  canvas {
    border: 1px solid #000;
  }
</style>
</head>
<body>
<canvas id="gameCanvas" width="400" height="400"></canvas>

<script>
const canvas = document.getElementById('gameCanvas');
  const ctx = canvas.getContext('2d');
  let count = 0;
  let isGameActive = false;
  let lastTime = 0;
  const fps = 60; // frames per second
  const fpsInterval = 1000 / fps;
  const delta = 0;
  const frameCount = 0;
  let startTime;
  let now;
  let then;

  function init() {
    canvas.width = 400;
    canvas.height = 400;
    ctx.font = '24px Arial';
    ctx.fillStyle = 'black';
    ctx.fillText('Click to start!', canvas.width / 2 - 100, canvas.height / 2 - 30);
    canvas.addEventListener('click', handleClick);
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();
    startTime = Date.now();
    then = startTime;
  }

  function resizeCanvas() {
    canvas.width = window.innerWidth * 0.8;
    canvas.height = window.innerHeight * 0.8;
    ctx.font = (canvas.height * 0.05) + 'px Arial';
  }

  function handleClick(event) {
    const rect = canvas.getBoundingClientRect();
    const x = event.clientX - rect.left;
    const y = event.clientY - rect.top;
    if (x > 50 && x < 350 && y > 50 && y < 350) {
      count++;
      if (!isGameActive) {
        isGameActive = true;
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.fillText('Click count: ' + count, 50, 50);
        requestAnimationFrame(gameLoop);
      }
    }
  }

  function gameLoop(timestamp) {
    now = timestamp;
    delta = now - then;
    if (delta > fpsInterval) {
      then = now - (delta % fpsInterval);
      ctx.fillStyle = 'rgba(0, 0, 0, 0.05)';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.fillText('Click count: ' + count, 50, 50);
    }
    requestAnimationFrame(gameLoop);
  }

  window.onload = init;
</script>
</body>
</html>
