<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>修仙沙盘游戏</title>
<style>
  body {
    margin: 0;
    overflow: hidden;
  }
  canvas {
    display: block;
  }
  #status {
    position: absolute;
    top: 10px;
    left: 10px;
    background: rgba(255, 255, 255, 0.8);
    padding: 5px;
    border-radius: 5px;
  }
  #actions {
    position: absolute;
    top: 10px;
    right: 10px;
    background: rgba(255, 255, 255, 0.8);
    padding: 5px;
    border-radius: 5px;
  }
  #inventory {
    position: absolute;
    top: 50px;
    right: 10px;
    background: rgba(255, 255, 255, 0.8);
    padding: 5px;
    border-radius: 5px;
    max-height: 200px;
    overflow: auto;
  }
  .item {
    margin-bottom: 5px;
    padding: 5px;
    border: 1px solid #ccc;
  }
  #playerAnimation {
    position: absolute;
    top: 100px;
    left: 100px;
    width: 32px;
    height: 32px;
  }
</style>
</head>
<body>
<canvas id="gameCanvas"></canvas>
<div id="status">玩家等级：1，经验：0，金币：100</div>
<div id="actions">
  <button onclick="meditate()">修炼</button>
  <button onclick="useSkill()">使用技能</button>
  <button onclick="trade()">交易</button>
</div>
<div id="inventory">
  <div class="item">金币：100</div>
</div>
<div id="playerAnimation"></div>
<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const scale = 32;
canvas.width = 800;
canvas.height = 600;

// 玩家对象
const player = {
  x: 100,
  y: 100,
  width: 32,
  height: 32,
  speed: 5,
  level: 1,
  experience: 0,
  money: 100,
  skills: [],
  inventory: [],
  animationFrame: 0,
  animationFrames: 3,
  animationSpeed: 10,
  frameWidth: 32,
  frameHeight: 32
};

// 地图数据
const map = [
  // ... 地图数据
];

// 绘制玩家动画
function drawPlayerAnimation() {
  const frameX = player.animationFrame * player.frameWidth;
  const frameY = 0; // 假设只有一帧
  ctx.drawImage(playerImage, frameX, frameY, player.frameWidth, player.frameHeight, player.x, player.y, player.width, player.height);
}

// 更新玩家动画
function updatePlayerAnimation() {
  player.animationFrame++;
  if (player.animationFrame >= player.animationFrames) {
    player.animationFrame = 0;
  }
}

// 加载玩家动画图像
let playerImage = new Image();
playerImage.src = 'player.png'; // 假设玩家动画图像名为player.png
playerImage.onload = function() {
  gameLoop();
};

// 绘制玩家
function drawPlayer() {
  ctx.fillStyle = 'blue';
  ctx.fillRect(player.x, player.y, player.width, player.height);
  drawPlayerAnimation();
}

// 绘制地图
function drawMap() {
  for (let y = 0; y < canvas.height; y += scale) {
    for (let x = 0; x < canvas.width; x += scale) {
      ctx.fillStyle = 'green';
      ctx.fillRect(x, y, scale, scale);
    }
  }
}

// 更新玩家位置
function updatePlayerPosition() {
  // ... (与之前相同，此处省略)
}

// 修炼功能
function meditate() {
  player.experience += 10; // 假设每次修炼获得10点经验
  if (player.experience >= 100) {
    player.level++;
    player.experience -= 100;
    updateStatus();
  }
  updateStatus();
}

// 使用技能
function useSkill() {
  // ... (与之前相同，此处省略)
}

// 炼丹功能
function alchemy() {
  // ... (此处省略炼丹逻辑)
}

// 交易系统
function trade() {
  const gold = prompt('请输入交易金币数量：');
  const goldNumber = parseInt(gold, 10);
  if (!isNaN(goldNumber) && player.money >= goldNumber) {
    player.money -= goldNumber;
    updateStatus();
  } else {
    alert('交易失败：金币不足或输入非法！');
  }
}

// 更新状态信息
function updateStatus() {
  const statusDiv = document.getElementById('status');
  statusDiv.textContent = `玩家等级：${player.level}，经验：${player.experience}，金币：${player.money}`;
}

// 更新物品列表
function updateInventory() {
  const inventoryDiv = document.getElementById('inventory');
  inventoryDiv.innerHTML = '';
  player.inventory.forEach(item => {
    const itemDiv = document.createElement('div');
    itemDiv.className = 'item';
    itemDiv.textContent = `${item.name}（售价：${item.cost}金币）`;
    itemDiv.onclick = () => item.sell();
    inventoryDiv.appendChild(itemDiv);
  });
}

// 添加物品到库存
function addItem(item) {
  player.inventory.push(item);
  updateInventory();
}

// 游戏循环
function gameLoop() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  drawMap();
  drawPlayer();
  updatePlayerAnimation();
  requestAnimationFrame(gameLoop);
}

// 初始化游戏
window.onload = () => {
  updatePlayerPosition();
  gameLoop();
  // 添加其他初始化代码，如绑定按钮事件等
  addItem(new Item('丹药', 10));
  addItem(new Item('法宝', 50));
  updateStatus();
  updateInventory();
};
</script>
</body>
</html>
