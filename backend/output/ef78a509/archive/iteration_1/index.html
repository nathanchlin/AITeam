<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>修仙沙盘游戏 - 鬼谷八荒风格</title>
<style>
  * {
    box-sizing: border-box;
  }
  body {
    margin: 0;
    overflow: hidden;
    font-family: 'Microsoft YaHei', sans-serif;
    background: #1a1a2e;
    touch-action: none;
    -webkit-touch-callout: none;
    -webkit-user-select: none;
    user-select: none;
  }
  canvas {
    display: block;
    touch-action: none;
  }
  
  /* 兼容性报告面板 */
  #compatReport {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    background: linear-gradient(135deg, rgba(20, 20, 40, 0.98), rgba(40, 40, 80, 0.95));
    padding: 25px 30px;
    border-radius: 12px;
    border: 2px solid #6b5b95;
    color: #e8d5b7;
    z-index: 20000;
    max-width: 400px;
    width: 90%;
    display: none;
    box-shadow: 0 10px 40px rgba(0, 0, 0, 0.6);
  }
  #compatReport.show {
    display: block;
  }
  #compatReport h3 {
    margin: 0 0 15px 0;
    color: #ffd700;
    font-size: 18px;
    text-align: center;
  }
  #compatReport .compat-item {
    display: flex;
    justify-content: space-between;
    padding: 8px 0;
    border-bottom: 1px solid rgba(107, 91, 149, 0.3);
  }
  #compatReport .compat-status {
    font-weight: bold;
  }
  #compatReport .compat-status.pass { color: #7cfc00; }
  #compatReport .compat-status.warn { color: #ffa500; }
  #compatReport .compat-status.fail { color: #ff4757; }
  #compatReport .close-btn {
    margin-top: 15px;
    width: 100%;
    padding: 10px;
    background: linear-gradient(135deg, #4a3f6b, #6b5b95);
    border: 1px solid #8b7bb5;
    color: #e8d5b7;
    border-radius: 5px;
    cursor: pointer;
    font-size: 14px;
  }
  #compatReport .close-btn:hover {
    background: linear-gradient(135deg, #6b5b95, #8b7bb5);
  }
  
  /* 虚拟摇杆 */
  #joystickContainer {
    position: fixed;
    bottom: 100px;
    left: 30px;
    width: 120px;
    height: 120px;
    display: none;
    z-index: 500;
  }
  #joystickContainer.show {
    display: block;
  }
  #joystickBase {
    position: absolute;
    width: 120px;
    height: 120px;
    background: rgba(107, 91, 149, 0.3);
    border: 3px solid rgba(107, 91, 149, 0.6);
    border-radius: 50%;
  }
  #joystickThumb {
    position: absolute;
    width: 50px;
    height: 50px;
    background: linear-gradient(135deg, #6b5b95, #8b7bb5);
    border: 2px solid #ffd700;
    border-radius: 50%;
    left: 35px;
    top: 35px;
    transition: none;
  }
  
  /* 触屏技能按钮 */
  #touchSkills {
    position: fixed;
    bottom: 100px;
    right: 20px;
    display: none;
    flex-direction: column;
    gap: 10px;
    z-index: 500;
  }
  #touchSkills.show {
    display: flex;
  }
  .touch-skill-btn {
    width: 60px;
    height: 60px;
    background: linear-gradient(135deg, #4a3f6b, #6b5b95);
    border: 2px solid #ffd700;
    border-radius: 12px;
    color: #ffd700;
    font-size: 24px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    touch-action: manipulation;
  }
  .touch-skill-btn:active {
    background: linear-gradient(135deg, #6b5b95, #8b7bb5);
    transform: scale(0.95);
  }
  
  /* 加载界面 */
  #loadingScreen {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: linear-gradient(135deg, #0d0d1a 0%, #1a1a2e 50%, #0d0d1a 100%);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 9999;
    transition: opacity 0.8s ease;
  }
  #loadingScreen.hidden {
    opacity: 0;
    pointer-events: none;
  }
  .loading-title {
    font-size: 42px;
    color: #ffd700;
    text-shadow: 0 0 20px rgba(255, 215, 0, 0.5), 0 0 40px rgba(255, 215, 0, 0.3);
    margin-bottom: 10px;
    letter-spacing: 8px;
  }
  .loading-subtitle {
    font-size: 18px;
    color: #7b68ee;
    margin-bottom: 40px;
    letter-spacing: 4px;
  }
  .loading-bagua {
    width: 120px;
    height: 120px;
    position: relative;
    animation: rotateBagua 3s linear infinite;
  }
  .loading-bagua::before {
    content: '☯';
    font-size: 100px;
    color: #ffd700;
    text-shadow: 0 0 30px rgba(255, 215, 0, 0.8);
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
  }
  @keyframes rotateBagua {
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }
  }
  .loading-progress-container {
    width: 300px;
    height: 8px;
    background: rgba(107, 91, 149, 0.3);
    border-radius: 4px;
    margin-top: 30px;
    overflow: hidden;
    border: 1px solid #6b5b95;
  }
  .loading-progress-bar {
    height: 100%;
    background: linear-gradient(90deg, #6b5b95, #ffd700, #6b5b95);
    background-size: 200% 100%;
    animation: shimmer 1.5s infinite;
    border-radius: 4px;
    width: 0%;
    transition: width 0.3s ease;
  }
  @keyframes shimmer {
    0% { background-position: -200% 0; }
    100% { background-position: 200% 0; }
  }
  .loading-text {
    color: #e8d5b7;
    font-size: 14px;
    margin-top: 15px;
    opacity: 0.8;
  }
  .loading-particles {
    position: absolute;
    width: 100%;
    height: 100%;
    overflow: hidden;
    pointer-events: none;
  }
  .loading-particle {
    position: absolute;
    width: 4px;
    height: 4px;
    background: #ffd700;
    border-radius: 50%;
    animation: floatParticle 3s infinite ease-in-out;
    opacity: 0.6;
  }
  @keyframes floatParticle {
    0%, 100% { transform: translateY(0) scale(1); opacity: 0.6; }
    50% { transform: translateY(-20px) scale(1.5); opacity: 1; }
  }
  
  /* 开始界面 */
  #startScreen {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: linear-gradient(135deg, rgba(13, 13, 26, 0.95), rgba(26, 26, 46, 0.95));
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 9998;
  }
  #startScreen.show {
    display: flex;
  }
  .start-title {
    font-size: 56px;
    color: #ffd700;
    text-shadow: 0 0 30px rgba(255, 215, 0, 0.6), 0 0 60px rgba(255, 215, 0, 0.4);
    margin-bottom: 20px;
    letter-spacing: 12px;
    animation: titleGlow 2s ease-in-out infinite;
  }
  @keyframes titleGlow {
    0%, 100% { text-shadow: 0 0 30px rgba(255, 215, 0, 0.6), 0 0 60px rgba(255, 215, 0, 0.4); }
    50% { text-shadow: 0 0 40px rgba(255, 215, 0, 0.8), 0 0 80px rgba(255, 215, 0, 0.6); }
  }
  .start-subtitle {
    font-size: 20px;
    color: #7b68ee;
    margin-bottom: 60px;
    letter-spacing: 6px;
  }
  .start-button {
    padding: 18px 60px;
    font-size: 22px;
    background: linear-gradient(135deg, #4a3f6b, #6b5b95);
    border: 2px solid #ffd700;
    color: #ffd700;
    border-radius: 8px;
    cursor: pointer;
    letter-spacing: 4px;
    transition: all 0.3s ease;
    position: relative;
    overflow: hidden;
  }
  .start-button:hover {
    background: linear-gradient(135deg, #6b5b95, #8b7bb5);
    transform: scale(1.05);
    box-shadow: 0 0 30px rgba(255, 215, 0, 0.5);
  }
  .start-button::after {
    content: '';
    position: absolute;
    top: -50%;
    left: -50%;
    width: 200%;
    height: 200%;
    background: linear-gradient(45deg, transparent, rgba(255, 255, 255, 0.1), transparent);
    transform: rotate(45deg);
    animation: buttonShine 2s infinite;
  }
  @keyframes buttonShine {
    0% { transform: translateX(-100%) rotate(45deg); }
    100% { transform: translateX(100%) rotate(45deg); }
  }
  .start-tips {
    margin-top: 40px;
    color: #888;
    font-size: 14px;
    text-align: center;
    line-height: 2;
  }
  .start-tips span {
    color: #ffd700;
  }
  
  /* Toast提示 */
  #toastContainer {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    z-index: 10000;
    pointer-events: none;
  }
  .toast {
    background: linear-gradient(135deg, rgba(20, 20, 40, 0.95), rgba(40, 40, 80, 0.95));
    border: 2px solid #ffd700;
    color: #e8d5b7;
    padding: 15px 30px;
    border-radius: 8px;
    font-size: 18px;
    animation: toastIn 0.3s ease, toastOut 0.3s ease 1.7s forwards;
    text-align: center;
    box-shadow: 0 0 30px rgba(255, 215, 0, 0.3);
  }
  @keyframes toastIn {
    from { opacity: 0; transform: scale(0.8); }
    to { opacity: 1; transform: scale(1); }
  }
  @keyframes toastOut {
    from { opacity: 1; transform: scale(1); }
    to { opacity: 0; transform: scale(0.8); }
  }
  
  /* 操作提示 */
  #controlTips {
    position: fixed;
    bottom: 80px;
    right: 10px;
    background: linear-gradient(135deg, rgba(20, 20, 40, 0.9), rgba(40, 40, 80, 0.85));
    padding: 12px 15px;
    border-radius: 8px;
    border: 1px solid #6b5b95;
    color: #e8d5b7;
    font-size: 12px;
    z-index: 100;
    max-width: 200px;
  }
  #controlTips h5 {
    margin: 0 0 8px 0;
    color: #ffd700;
    font-size: 13px;
    border-bottom: 1px solid #6b5b95;
    padding-bottom: 5px;
  }
  #controlTips .tip-item {
    display: flex;
    justify-content: space-between;
    margin: 4px 0;
  }
  #controlTips .tip-key {
    color: #7cfc00;
    font-weight: bold;
  }
  
  /* 顶部状态栏 - 鬼谷八荒风格 */
  #status {
    position: absolute;
    top: 10px;
    left: 10px;
    background: linear-gradient(135deg, rgba(20, 20, 40, 0.95), rgba(40, 40, 80, 0.9));
    padding: 15px 20px;
    border-radius: 8px;
    border: 2px solid #6b5b95;
    color: #e8d5b7;
    font-size: 14px;
    min-width: 280px;
    box-shadow: 0 4px 15px rgba(107, 91, 149, 0.4);
  }
  #status .realm {
    color: #ffd700;
    font-size: 18px;
    font-weight: bold;
    text-shadow: 0 0 10px rgba(255, 215, 0, 0.5);
  }
  #status .stats {
    margin-top: 8px;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 5px;
  }
  #status .stat-item {
    display: flex;
    align-items: center;
    gap: 5px;
  }
  #status .stat-icon {
    width: 20px;
    height: 20px;
    border-radius: 50%;
    display: inline-block;
  }
  #status .spirit-icon { background: linear-gradient(45deg, #00d4ff, #0099cc); }
  #status .exp-icon { background: linear-gradient(45deg, #7cfc00, #32cd32); }
  #status .gold-icon { background: linear-gradient(45deg, #ffd700, #daa520); }
  #status .hp-icon { background: linear-gradient(45deg, #ff6b6b, #ee5a5a); }
  
  /* 灵气条 */
  .bar-container {
    width: 100%;
    height: 12px;
    background: rgba(0, 0, 0, 0.5);
    border-radius: 6px;
    margin-top: 8px;
    overflow: hidden;
  }
  .bar {
    height: 100%;
    border-radius: 6px;
    transition: width 0.3s ease;
  }
  #spiritBar {
    background: linear-gradient(90deg, #00d4ff, #7b68ee);
    width: 50%;
  }
  #expBar {
    background: linear-gradient(90deg, #7cfc00, #32cd32);
    width: 0%;
  }
  #hpBar {
    background: linear-gradient(90deg, #ff6b6b, #ff4757);
    width: 100%;
  }
  
  /* 右侧操作面板 */
  #actions {
    position: absolute;
    top: 10px;
    right: 10px;
    background: linear-gradient(135deg, rgba(20, 20, 40, 0.95), rgba(40, 40, 80, 0.9));
    padding: 15px;
    border-radius: 8px;
    border: 2px solid #6b5b95;
    display: flex;
    flex-direction: column;
    gap: 8px;
    min-width: 120px;
  }
  #actions button {
    background: linear-gradient(135deg, #4a3f6b, #6b5b95);
    border: 1px solid #8b7bb5;
    color: #e8d5b7;
    padding: 10px 15px;
    border-radius: 5px;
    cursor: pointer;
    font-size: 14px;
    transition: all 0.3s ease;
    position: relative;
    overflow: hidden;
  }
  #actions button:hover {
    background: linear-gradient(135deg, #6b5b95, #8b7bb5);
    transform: translateY(-2px);
    box-shadow: 0 4px 10px rgba(107, 91, 149, 0.5);
  }
  #actions button:active {
    transform: translateY(0);
  }
  #actions button.loading {
    pointer-events: none;
    opacity: 0.7;
  }
  #actions button.loading::after {
    content: '';
    position: absolute;
    width: 16px;
    height: 16px;
    border: 2px solid transparent;
    border-top-color: #ffd700;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    right: 10px;
    top: 50%;
    margin-top: -8px;
  }
  @keyframes spin {
    to { transform: rotate(360deg); }
  }
  
  /* 物品栏 */
  #inventory {
    position: absolute;
    top: 220px;
    right: 10px;
    background: linear-gradient(135deg, rgba(20, 20, 40, 0.95), rgba(40, 40, 80, 0.9));
    padding: 15px;
    border-radius: 8px;
    border: 2px solid #6b5b95;
    color: #e8d5b7;
    max-height: 300px;
    overflow: auto;
    min-width: 200px;
  }
  #inventory h3 {
    margin: 0 0 10px 0;
    color: #ffd700;
    font-size: 16px;
    border-bottom: 1px solid #6b5b95;
    padding-bottom: 5px;
  }
  .item {
    margin-bottom: 8px;
    padding: 8px;
    border: 1px solid #4a3f6b;
    border-radius: 5px;
    background: rgba(74, 63, 107, 0.3);
    cursor: pointer;
    transition: all 0.2s ease;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .item:hover {
    background: rgba(107, 91, 149, 0.5);
    border-color: #8b7bb5;
  }
  .item-name {
    color: #e8d5b7;
  }
  .item-price {
    color: #ffd700;
    font-size: 12px;
  }
  
  /* 宗门信息 */
  #sectInfo {
    position: absolute;
    bottom: 10px;
    left: 10px;
    background: linear-gradient(135deg, rgba(20, 20, 40, 0.95), rgba(40, 40, 80, 0.9));
    padding: 15px;
    border-radius: 8px;
    border: 2px solid #6b5b95;
    color: #e8d5b7;
    min-width: 200px;
  }
  #sectInfo h3 {
    margin: 0 0 10px 0;
    color: #ff9f43;
    font-size: 16px;
  }
  #sectInfo .sect-name {
    color: #ffd700;
    font-weight: bold;
  }
  
  /* 小地图 */
  #minimap {
    position: absolute;
    bottom: 10px;
    right: 10px;
    width: 150px;
    height: 150px;
    background: rgba(20, 20, 40, 0.9);
    border: 2px solid #6b5b95;
    border-radius: 8px;
    overflow: hidden;
  }
  #minimapCanvas {
    width: 100%;
    height: 100%;
  }
  
  /* 消息日志 */
  #messageLog {
    position: absolute;
    bottom: 170px;
    left: 10px;
    width: 300px;
    max-height: 150px;
    background: linear-gradient(135deg, rgba(20, 20, 40, 0.95), rgba(40, 40, 80, 0.9));
    padding: 10px;
    border-radius: 8px;
    border: 2px solid #6b5b95;
    color: #e8d5b7;
    font-size: 12px;
    overflow-y: auto;
  }
  #messageLog h4 {
    margin: 0 0 8px 0;
    color: #ffd700;
    font-size: 14px;
  }
  .message {
    padding: 4px 0;
    border-bottom: 1px solid rgba(107, 91, 149, 0.3);
  }
  .message.event { color: #ff9f43; }
  .message.combat { color: #ff6b6b; }
  .message.gain { color: #7cfc00; }
  
  /* 技能栏 */
  #skillBar {
    position: absolute;
    bottom: 10px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    gap: 10px;
    background: linear-gradient(135deg, rgba(20, 20, 40, 0.95), rgba(40, 40, 80, 0.9));
    padding: 10px 20px;
    border-radius: 8px;
    border: 2px solid #6b5b95;
  }
  .skill-slot {
    width: 50px;
    height: 50px;
    background: rgba(74, 63, 107, 0.5);
    border: 2px solid #6b5b95;
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #e8d5b7;
    font-size: 20px;
    cursor: pointer;
    transition: all 0.2s ease;
    position: relative;
  }
  .skill-slot:hover {
    background: rgba(107, 91, 149, 0.7);
    transform: scale(1.1);
  }
  .skill-slot .key {
    position: absolute;
    bottom: 2px;
    right: 4px;
    font-size: 10px;
    color: #aaa;
  }
  .skill-slot .cooldown-overlay {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0, 0, 0, 0.7);
    border-radius: 6px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 14px;
    color: #fff;
    font-weight: bold;
  }
  .skill-slot.on-cooldown {
    opacity: 0.6;
  }
  
  /* NPC对话框 */
  #dialogBox {
    display: none;
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    background: linear-gradient(135deg, rgba(20, 20, 40, 0.98), rgba(40, 40, 80, 0.95));
    padding: 20px;
    border-radius: 10px;
    border: 3px solid #6b5b95;
    color: #e8d5b7;
    min-width: 350px;
    max-width: 500px;
    z-index: 100;
    box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
  }
  #dialogBox h3 {
    margin: 0 0 15px 0;
    color: #ffd700;
    font-size: 18px;
  }
  #dialogBox .dialog-content {
    margin-bottom: 15px;
    line-height: 1.6;
  }
  #dialogBox .dialog-options {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  #dialogBox button {
    background: linear-gradient(135deg, #4a3f6b, #6b5b95);
    border: 1px solid #8b7bb5;
    color: #e8d5b7;
    padding: 10px 15px;
    border-radius: 5px;
    cursor: pointer;
    transition: all 0.2s ease;
  }
  #dialogBox button:hover {
    background: linear-gradient(135deg, #6b5b95, #8b7bb5);
  }
  
  /* 伤害数字浮动 */
  .damage-number {
    position: fixed;
    font-weight: bold;
    pointer-events: none;
    animation: floatUp 1s ease-out forwards;
    text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
    z-index: 1000;
  }
  @keyframes floatUp {
    0% { opacity: 1; transform: translateY(0) scale(1); }
    50% { opacity: 1; transform: translateY(-30px) scale(1.2); }
    100% { opacity: 0; transform: translateY(-60px) scale(0.8); }
  }
  
  /* 兼容性检测按钮 */
  #compatTestBtn {
    position: fixed;
    top: 10px;
    left: 50%;
    transform: translateX(-50%);
    background: linear-gradient(135deg, #4a3f6b, #6b5b95);
    border: 1px solid #8b7bb5;
    color: #e8d5b7;
    padding: 8px 16px;
    border-radius: 5px;
    cursor: pointer;
    font-size: 12px;
    z-index: 10001;
  }
  #compatTestBtn:hover {
    background: linear-gradient(135deg, #6b5b95, #8b7bb5);
  }
</style>
</head>
<body>

<!-- 兼容性报告面板 -->
<div id="compatReport">
  <h3>🔍 平台兼容性检测报告</h3>
  <div id="compatContent"></div>
  <button class="close-btn" onclick="hideCompatReport()">关闭</button>
</div>

<!-- 兼容性测试按钮 -->
<button id="compatTestBtn" onclick="runCompatibilityTest()">🔍 检测平台兼容性</button>

<!-- 虚拟摇杆 -->
<div id="joystickContainer">
  <div id="joystickBase"></div>
  <div id="joystickThumb"></div>
</div>

<!-- 触屏技能按钮 -->
<div id="touchSkills">
  <button class="touch-skill-btn" ontouchstart="useSkillByIndex(0)">⚔️</button>
  <button class="touch-skill-btn" ontouchstart="useSkillByIndex(1)">🛡️</button>
  <button class="touch-skill-btn" ontouchstart="useSkillByIndex(2)">💚</button>
  <button class="touch-skill-btn" ontouchstart="useSkillByIndex(3)">🌀</button>

// ============ Polyfill 兼容性补丁 ============
// Math.hypot polyfill
if (!Math.hypot) {
  Math.hypot = function() {
    var y = 0;
    var length = arguments.length;
    for (var i = 0; i < length; i++) {
      if (arguments[i] === Infinity || arguments[i] === -Infinity) {
        return Infinity;
      }
      y += arguments[i] * arguments[i];
    }
    return Math.sqrt(y);
  };
}

// CanvasRenderingContext2D.ellipse polyfill
if (!CanvasRenderingContext2D.prototype.ellipse) {
  CanvasRenderingContext2D.prototype.ellipse = function(x, y, radiusX, radiusY, rotation, startAngle, endAngle, anticlockwise) {
    this.save();
    this.translate(x, y);
    this.rotate(rotation);
    this.scale(radiusX / radiusY, 1);
    this.arc(0, 0, radiusY, startAngle, endAngle, anticlockwise);
    this.restore();
  };
}

// requestAnimationFrame polyfill
if (!window.requestAnimationFrame) {
  window.requestAnimationFrame = function(callback) {
    return setTimeout(callback, 16);
  };
}

// ============ 平台兼容性检测类 ============
class CompatibilityTester {
  constructor() {
    this.results = [];
    this.platform = this.detectPlatform();
    this.browser = this.detectBrowser();
  }
  
  detectPlatform() {
    const ua = navigator.userAgent.toLowerCase();
    if (/mobile|android|iphone|ipad|ipod|blackberry|iemobile|opera mini/i.test(ua)) {
      return 'mobile';
    } else if (/tablet|ipad/i.test(ua)) {
      return 'tablet';
    }
    return 'desktop';
  }
  
  detectBrowser() {
    const ua = navigator.userAgent;
    if (ua.indexOf('Chrome') > -1 && ua.indexOf('Edg') === -1) return 'Chrome';
    if (ua.indexOf('Safari') > -1 && ua.indexOf('Chrome') === -1) return 'Safari';
    if (ua.indexOf('Firefox') > -1) return 'Firefox';
    if (ua.indexOf('Edg') > -1) return 'Edge';
    if (ua.indexOf('MSIE') > -1 || ua.indexOf('Trident') > -1) return 'IE';
    return 'Unknown';
  }
  
  test(name, testFn) {
    try {
      const result = testFn();
      this.results.push({
        name: name,
        status: result ? 'pass' : 'fail',
        message: result ? '支持' : '不支持'
      });
      return result;
    } catch (e) {
      this.results.push({
        name: name,
        status: 'fail',
        message: '错误: ' + e.message
      });
      return false;
    }
  }
  
  runAllTests() {
    this.results = [];
    
    // 基础检测
    this.test('Canvas 2D', () => {
      const testCanvas = document.createElement('canvas');
      return !!(testCanvas.getContext && testCanvas.getContext('2d'));
    });
    
    this.test('Canvas椭圆绘制', () => {
      const testCanvas = document.createElement('canvas');
      const ctx = testCanvas.getContext('2d');
      return typeof ctx.ellipse === 'function' || true; // polyfill已添加
    });
    
    this.test('requestAnimationFrame', () => {
      return typeof window.requestAnimationFrame === 'function';
    });
    
    this.test('JSON支持', () => {
      return typeof JSON === 'object' && typeof JSON.parse === 'function';
    });
    
    this.test('localStorage', () => {
      try {
        localStorage.setItem('test', 'test');
        localStorage.removeItem('test');
        return true;
      } catch (e) {
        return false;
      }
    });
    
    this.test('触屏支持', () => {
      return 'ontouchstart' in window || navigator.maxTouchPoints > 0;
    });
    
    this.test('音频支持', () => {
      return typeof AudioContext !== 'undefined' || typeof webkitAudioContext !== 'undefined';
    });
    
    this.test('ES6类支持', () => {
      try {
        eval('class Test {}');
        return true;
      } catch (e) {
        return false;
      }
    });
    
    this.test('CSS Grid', () => {
      return typeof document.createElement('div').style.grid === 'string';
    });
    
    this.test('CSS Flexbox', () => {
      return typeof document.createElement('div').style.flex === 'string';
    });
    
    return this.results;
  }
  
  generateReport() {
    let html = '';
    html += `<div class="compat-item"><span>平台类型</span><span class="compat-status pass">${this.platform}</span></div>`;
    html += `<div class="compat-item"><span>浏览器</span><span class="compat-status pass">${this.browser}</span></div>`;
    html += `<div class="compat-item"><span>屏幕分辨率</span><span class="compat-status pass">${window.innerWidth}x${window.innerHeight}</span></div>`;
    html += `<div class="compat-item"><span>设备像素比</span><span class="compat-status pass">${window.devicePixelRatio}</span></div>`;
    
    html += '<div style="margin: 10px 0; border-top: 1px solid #6b5b95;"></div>';
    
    let passCount = 0;
    this.results.forEach(result => {
      const statusClass = result.status === 'pass' ? 'pass' : result.status === 'warn' ? 'warn' : 'fail';
      html += `<div class="compat-item"><span>${result.name}</span><span class="compat-status ${statusClass}">${result.message}</span></div>`;
      if (result.status === 'pass') passCount++;
    });
    
    const overallStatus = passCount === this.results.length ? 'pass' : passCount >= this.results.length * 0.7 ? 'warn' : 'fail';
    const overallText = overallStatus === 'pass' ? '✅ 完全兼容' : overallStatus === 'warn' ? '⚠️ 基本兼容' : '❌ 兼容性问题';
    
    html += `<div style="margin-top: 15px; padding-top: 10px; border-top: 2px solid #ffd700; text-align: center;">
      <span class="compat-status ${overallStatus}">${overallText}</span>
    </div>`;
    
    return html;
  }
}

// ============ 触屏控制系统 ============
class TouchController {
  constructor() {
    this.joystickContainer = document.getElementById('joystickContainer');
    this.joystickThumb = document.getElementById('joystickThumb');
    this.touchSkills = document.getElementById('touchSkills');
    this.joystickActive = false;
    this.joystickStartX = 0;
    this.joystickStartY = 0;
    this.joystickX = 0;
    this.joystickY = 0;
    this.maxDistance = 40;
    
    this.init();
  }
  
  init() {
    // 检测是否为触屏设备
    if ('ontouchstart' in window || navigator.maxTouchPoints > 0) {
      this.joystickContainer.classList.add('show');
      this.touchSkills.classList.add('show');
      this.setupJoystick();
      console.log('[触屏控制] 已启用虚拟摇杆');
    }
  }
  
  setupJoystick() {
    const base = document.getElementById('joystickBase');
    
    base.addEventListener('touchstart', (e) => {
      e.preventDefault();
      this.joystickActive = true;
      const touch = e.touches[0];
      const rect = base.getBoundingClientRect();
      this.joystickStartX = rect.left + rect.width / 2;
      this.joystickStartY = rect.top + rect.height / 2;
    }, { passive: false });
    
    document.addEventListener('touchmove', (e) => {
      if (!this.joystickActive) return;
      e.preventDefault();
      
      const touch = e.touches[0];
      let dx = touch.clientX - this.joystickStartX;
      let dy = touch.clientY - this.joystickStartY;
      
      const distance = Math.sqrt(dx * dx + dy * dy);
      if (distance > this.maxDistance) {
        dx = dx / distance * this.maxDistance;
        dy = dy / distance * this.maxDistance;
      }
      
      this.joystickX = dx / this.maxDistance;
      this.joystickY = dy / this.maxDistance;
      
      this.joystickThumb.style.transform = `translate(${dx}px, ${dy}px)`;
    }, { passive: false });
    
    document.addEventListener('touchend', (e) => {
      if (this.joystickActive) {
        this.joystickActive = false;
        this.joystickX = 0;
        this.joystickY = 0;
        this.joystickThumb.style.transform = 'translate(0, 0)';
      }
    });
  }
  
  getMovement() {
    return {
      x: this.joystickX,
      y: this.joystickY
    };
  }
}

// ============ 地图生成 ============
// 修复：为每种地形添加 passable 和 solid 属性，用于碰撞检测
const TILE_TYPES = {
  GRASS: { color: '#2d5a27', name: '草地', passable: true, solid: false },
  WATER: { color: '#1a5276', name: '水域', passable: false, solid: true },  // 硬表面，不可通行
  MOUNTAIN: { color: '#5d6d7e', name: '山脉', passable: false, solid: true }, // 硬表面，不可通行
  FOREST: { color: '#1e4d2b', name: '密林', passable: true, solid: false },

  SPIRIT: { color: '#7b68ee', name: '灵脉', passable: true, solid: false },
  TOWN: { color: '#8b7355', name: '城镇', passable: true, solid: false, hasBuildings: true }, // 城镇有建筑碰撞
  CAVE: { color: '#2c2c2c', name: '洞府', passable: true, solid: false }
};

let gameMap = [];

// 建筑物数据（用于硬表面碰撞）
const buildings = [];

function generateMap() {
  gameMap = [];
  buildings.length = 0;
  
  for (let y = 0; y < MAP_HEIGHT; y++) {
    const row = [];
    for (let x = 0; x < MAP_WIDTH; x++) {
      const noise = Math.random();
      let tile = TILE_TYPES.GRASS;
      
      if (noise < 0.05) tile = TILE_TYPES.WATER;
      else if (noise < 0.10) tile = TILE_TYPES.MOUNTAIN;
      else if (noise < 0.20) tile = TILE_TYPES.FOREST;
      else if (noise < 0.25) tile = TILE_TYPES.SAND;
      else if (noise < 0.28) tile = TILE_TYPES.SPIRIT;
      else if (noise < 0.30) tile = TILE_TYPES.TOWN;
      else if (noise < 0.32) tile = TILE_TYPES.CAVE;
      
      row.push(tile);
      
      // 为城镇生成建筑物碰撞体
      if (tile === TILE_TYPES.TOWN) {
        // 每个城镇格子生成1-2个建筑
        const buildingCount = Math.floor(Math.random() * 2) + 1;
        for (let i = 0; i < buildingCount; i++) {
          buildings.push({
            x: x * TILE_SIZE + Math.random() * (TILE_SIZE - 20),
            y: y * TILE_SIZE + Math.random() * (TILE_SIZE - 20),
            width: 20 + Math.random() * 15,
            height: 20 + Math.random() * 15,
            type: 'building'
          });
        }
      }
    }
    gameMap.push(row);
  }
}

// ============ 碰撞检测系统 ============

/**
 * 检测点所在的地形是否可通行
 * @param {number} x - 世界坐标X
 * @param {number} y - 世界坐标Y
 * @returns {object} - { passable: boolean, tile: object }
 */
function checkTileCollision(x, y) {
  const tileX = Math.floor(x / TILE_SIZE);
  const tileY = Math.floor(y / TILE_SIZE);
  
  // 边界检查
  if (tileX < 0 || tileX >= MAP_WIDTH || tileY < 0 || tileY >= MAP_HEIGHT) {
    return { passable: false, tile: null, reason: 'boundary' };
  }
  
  const tile = gameMap[tileY] && gameMap[tileY][tileX];
  if (!tile) {
    return { passable: false, tile: null, reason: 'invalid' };
  }
  
  // 检查是否为硬表面（不可通行）
  if (tile.solid && !tile.passable) {
    return { passable: false, tile: tile, reason: 'solid_surface' };
  }
  
  return { passable: true, tile: tile };
}

/**
 * 检测实体与建筑物的碰撞
 * @param {number} x - 实体中心X坐标
 * @param {number} y - 实体中心Y坐标
 * @param {number} radius - 实体碰撞半径
 * @returns {object|null} - 返回碰撞的建筑物或null
 */
function checkBuildingCollision(x, y, radius) {
  for (const building of buildings) {
    // 简单的AABB碰撞检测
    const closestX = Math.max(building.x, Math.min(x, building.x + building.width));
    const closestY = Math.max(building.y, Math.min(y, building.y + building.height));
    
    const distanceX = x - closestX;
    const distanceY = y - closestY;
    const distanceSquared = distanceX * distanceX + distanceY * distanceY;
    
    if (distanceSquared < radius * radius) {
      return building;
    }
  }
  return null;
}

/**
 * 检测两个实体之间的碰撞
 * @param {object} entity1 - 实体1 {x, y, width, height}
 * @param {object} entity2 - 实体2 {x, y, width, height}
 * @returns {boolean} - 是否碰撞
 */
function checkEntityCollision(entity1, entity2) {
  const dx = entity1.x - entity2.x;
  const dy = entity1.y - entity2.y;
  const distance = Math.sqrt(dx * dx + dy * dy);
  const minDistance = (entity1.width + entity2.width) / 2 * 0.6; // 60%重叠才算碰撞
  return distance < minDistance;
}

/**
 * 计算碰撞后的滑动方向（用于硬表面碰撞响应）
 * @param {number} currentX - 当前X坐标
 * @param {number} currentY - 当前Y坐标
 * @param {number} targetX - 目标X坐标
 * @param {number} targetY - 目标Y坐标
 * @param {number} radius - 碰撞半径
 * @returns {object} - { x, y } 滑动后的坐标
 */
function slideAlongCollision(currentX, currentY, targetX, targetY, radius) {
  // 先尝试X方向移动
  let newX = targetX;
  let newY = currentY;
  
  const xCollision = checkTileCollision(newX, newY);
  if (!xCollision.passable) {
    newX = currentX; // X方向无法移动，保持原位
  }
  
  // 再尝试Y方向移动
  newX = (newX === currentX) ? currentX : newX;
  newY = targetY;
  
  const yCollision = checkTileCollision(newX, newY);
  if (!yCollision.passable) {
    newY = currentY; // Y方向无法移动，保持原位
  }
  
  // 如果两个方向都无法移动，检查建筑物碰撞
  if (newX === currentX && newY === currentY) {
    const buildingCollision = checkBuildingCollision(targetX, targetY, radius);
    if (buildingCollision) {
      // 计算推开方向
      const pushX = targetX - (buildingCollision.x + buildingCollision.width / 2);
      const pushY = targetY - (buildingCollision.y + buildingCollision.height / 2);
      const pushDist = Math.sqrt(pushX * pushX + pushY * pushY);
      
      if (pushDist > 0) {
        newX = currentX + (pushX / pushDist) * 2;
        newY = currentY + (pushY / pushDist) * 2;
      }
    }
  }
  
  return { x: newX, y: newY };
}

// ============ 特效系统 ============
const effects = [];
const floatingTexts = [];

function addEffect(x, y, type, duration = 30) {
  effects.push({
    x, y, type, duration, maxDuration: duration,
    size: type === 'attack' ? 30 : 20,
    alpha: 1
  });
}

function addFloatingText(x, y, text, color = '#ff4757') {
  // 转换为屏幕坐标
  const screenX = x - camera.x + canvas.offsetLeft;
  const screenY = y - camera.y + canvas.offsetTop;
  
  const div = document.createElement('div');
  div.className = 'damage-number';
  div.textContent = text;
  div.style.left = screenX + 'px';
  div.style.top = screenY + 'px';
  div.style.color = color;
  div.style.fontSize = '20px';
  document.body.appendChild(div);
  
  setTimeout(() => div.remove(), 1000);
}

function updateEffects() {
  for (let i = effects.length - 1; i >= 0; i--) {
    const effect = effects[i];
    effect.duration--;
    effect.alpha = effect.duration / effect.maxDuration;
    effect.size += 1;
    if (effect.duration <= 0) {
      effects.splice(i, 1);
    }
  }
}

function drawEffects() {
  effects.forEach(effect => {
    ctx.save();
    ctx.globalAlpha = effect.alpha;
    if (effect.type === 'attack') {
      ctx.strokeStyle = '#ff4757';
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.arc(effect.x - camera.x, effect.y - camera.y, effect.size, 0, Math.PI * 2);
      ctx.stroke();
    } else if (effect.type === 'heal') {
      ctx.fillStyle = '#7cfc00';
      ctx.font = `${effect.size}px Arial`;
      ctx.fillText('✚', effect.x - camera.x - 10, effect.y - camera.y);
    } else if (effect.type === 'spirit') {
      ctx.fillStyle = '#00d4ff';
      ctx.beginPath();
      ctx.arc(effect.x - camera.x, effect.y - camera.y, effect.size / 2, 0, Math.PI * 2);
      ctx.fill();
    } else if (effect.type === 'collision') {
      // 碰撞特效 - 闪烁圆环
      ctx.strokeStyle = '#ff6b6b';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(effect.x - camera.x, effect.y - camera.y, effect.size, 0, Math.PI * 2);
      ctx.stroke();
    }
    ctx.restore();
  });
}

function updateSkillCooldowns() {
  const slots = document.querySelectorAll('.skill-slot');
  
  player.skills.forEach((skill, index) => {
    const slot = slots[index];
    if (!slot) return;
    
    // 移除旧的冷却遮罩
    const oldOverlay = slot.querySelector('.cooldown-overlay');
    if (oldOverlay) oldOverlay.remove();
    
    // 计算冷却时间（秒）
    const cooldownSeconds = Math.ceil(skill.cooldown / 60);
    
    if (cooldownSeconds > 0) {
      slot.classList.add('on-cooldown');
      const overlay = document.createElement('div');
      overlay.className = 'cooldown-overlay';
      overlay.textContent = cooldownSeconds;
      slot.appendChild(overlay);
    } else {
      slot.classList.remove('on-cooldown');
    }
  });
}

// ============ 玩家移动更新（修复碰撞检测） ============
function updatePlayerPosition() {
  if (!gameStarted) return;
  
  let dx = 0, dy = 0;
  player.isMoving = false;
  
  // 键盘控制
  if (keys['w'] || keys['arrowup']) { dy = -player.speed; player.direction = 3; player.isMoving = true; }
  if (keys['s'] || keys['arrowdown']) { dy = player.speed; player.direction = 0; player.isMoving = true; }
  if (keys['a'] || keys['arrowleft']) { dx = -player.speed; player.direction = 1; player.isMoving = true; }
  if (keys['d'] || keys['arrowright']) { dx = player.speed; player.direction = 2; player.isMoving = true; }
  
  // 触屏摇杆控制
  if (touchController) {
    const touchMovement = touchController.getMovement();
    if (Math.abs(touchMovement.x) > 0.1 || Math.abs(touchMovement.y) > 0.1) {
      dx = touchMovement.x * player.speed;
      dy = touchMovement.y * player.speed;
      player.isMoving = true;
      
      // 更新方向
      if (Math.abs(dx) > Math.abs(dy)) {
        player.direction = dx > 0 ? 2 : 1;
      } else {
        player.direction = dy > 0 ? 0 : 3;
      }
    }
  }
  
  // 如果没有移动输入，直接返回
  if (dx === 0 && dy === 0) {
    return;
  }
  
  // 计算目标位置
  let targetX = player.x + dx;
  let targetY = player.y + dy;
  
  // 边界检查
  const boundaryPadding = 20;
  targetX = Math.max(boundaryPadding, Math.min(targetX, MAP_WIDTH * TILE_SIZE - boundaryPadding));
  targetY = Math.max(boundaryPadding, Math.min(targetY, MAP_HEIGHT * TILE_SIZE - boundaryPadding));
  
  // 检测硬表面碰撞
  const collisionRadius = player.width / 2;
  const tileCollision = checkTileCollision(targetX, targetY);
  
  // 重置碰撞状态
  player.isColliding = false;
  
  // 检查地形碰撞
  if (!tileCollision.passable) {
    player.isColliding = true;
    
    // 尝试滑动
    const slideResult = slideAlongCollision(player.x, player.y, targetX, targetY, collisionRadius);
    targetX = slideResult.x;
    targetY = slideResult.y;
    
    // 如果仍然无法移动，保持在原位
    if (targetX === player.x && targetY === player.y) {
      if (player.collisionCooldown <= 0) {
        // 碰撞反馈
        addEffect(player.x, player.y, 'collision', 15);
        player.collisionCooldown = 30;
        
        // 显示碰撞提示
        if (tileCollision.reason === 'solid_surface') {
          addMessage(`⚠️ 前方是${tileCollision.tile.name}，无法通过`, 'event');
        }
      }
    } else {
      player.x = targetX;
      player.y = targetY;
    }
  } else {
    // 检查建筑物碰撞
    const buildingCollision = checkBuildingCollision(targetX, targetY, collisionRadius);
    if (buildingCollision) {
      player.isColliding = true;
      
      // 计算推开方向
      const pushX = targetX - (buildingCollision.x + buildingCollision.width / 2);
      const pushY = targetY - (buildingCollision.y + buildingCollision.height / 2);
      const pushDist = Math.sqrt(pushX * pushX + pushY * pushY);
      
      if (pushDist > 0 && player.collisionCooldown <= 0) {
        addEffect(player.x, player.y, 'collision', 15);
        player.collisionCooldown = 30;
      }
      
      // 不更新位置，保持在建筑外
    } else {
      player.x = targetX;
      player.y = targetY;
    }
  }
  
  // 检查与NPC和敌人的软碰撞（推开效果）
  const allEntities = [...npcs, ...enemies];
  for (const entity of allEntities) {
    const dist = Math.hypot(player.x - entity.x, player.y - entity.y);
    const minDist = (player.width + entity.width) / 2 * 0.8;
    
    if (dist < minDist && dist > 0) {
      // 轻微推开
      const pushX = (player.x - entity.x) / dist * (minDist - dist) * 0.3;
      const pushY = (player.y - entity.y) / dist * (minDist - dist) * 0.3;
      player.x += pushX;
      player.y += pushY;
    }
  }
  
  // 更新碰撞冷却
  if (player.collisionCooldown > 0) {
    player.collisionCooldown--;
  }
  
  // 更新世界坐标
  player.worldX = Math.floor(player.x / TILE_SIZE);
  player.worldY = Math.floor(player.y / TILE_SIZE);
  
  // 检查特殊地形效果
  if (gameMap[player.worldY] && gameMap[player.worldY][player.worldX]) {
    const currentTile = gameMap[player.worldY][player.worldX];
    if (currentTile.color === TILE_TYPES.SPIRIT.color) {
      if (player.spirit < player.maxSpirit) {
        player.spirit = Math.min(player.maxSpirit, player.spirit + 0.5);
        if (Math.random() < 0.01) {
          addMessage('💫 在灵脉中修炼，灵气恢复速度加快', 'gain');
        }
      }
      updateTipStatus('灵脉修炼中');
    } else if (currentTile.color === TILE_TYPES.TOWN.color) {
      updateTipStatus('城镇区域');
    } else if (currentTile.color === TILE_TYPES.CAVE.color) {
      updateTipStatus('洞府探索');
    } else if (currentTile.color === TILE_TYPES.WATER.color) {
      updateTipStatus('水域边缘');
    } else if (currentTile.color === TILE_TYPES.MOUNTAIN.color) {
      updateTipStatus('山脉脚下');
    } else {
      updateTipStatus('探索中');
    }
  }
}

// ============ 动画更新 ============
function updatePlayerAnimation() {
  player.animationTimer++;
  if (player.animationTimer >= 8) {
    player.animationTimer = 0;
    if (player.isMoving) {
      player.animationFrame = (player.animationFrame + 1) % 4;
    } else {
      player.animationFrame = 0;
    }
  }
  
  player.skills.forEach(skill => {
    if (skill.cooldown > 0) skill.cooldown--;
  });
  
  if (player.shield > 0) {
    player.shield = Math.max(0, player.shield - 0.1);
  }
  
  updateSkillCooldowns();
}

// ============ 绘制玩家（添加碰撞反馈） ============
function drawPlayer() {
  const screenX = player.x - camera.x;
  const screenY = player.y - camera.y;
  
  ctx.fillStyle = 'rgba(0, 0, 0, 0.3)';
  ctx.beginPath();
  ctx.ellipse(screenX, screenY + 15, 18, 8, 0, 0, Math.PI * 2);
  ctx.fill();
  
  // 碰撞时的视觉反馈
  if (player.isColliding) {
    ctx.strokeStyle = `rgba(255, 107, 107, ${0.5 + Math.sin(Date.now() / 50) * 0.3})`;
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.arc(screenX, screenY, 25, 0, Math.PI * 2);
    ctx.stroke();
  }
  
  if (player.shield > 0) {
    ctx.strokeStyle = `rgba(0, 212, 255, ${0.3 + Math.sin(Date.now() / 200) * 0.2})`;
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.arc(screenX, screenY, 28, 0, Math.PI * 2);
    ctx.stroke();
  }
  
  const bodyOffset = player.isMoving ? Math.sin(player.animationFrame * Math.PI / 2) * 2 : 0;
  
  ctx.fillStyle = '#e8d5b7';
  ctx.beginPath();
  ctx.moveTo(screenX - 12, screenY + 10 - bodyOffset);
  ctx.lineTo(screenX + 12, screenY + 10 - bodyOffset);
  ctx.lineTo(screenX + 15, screenY + 20);
  ctx.lineTo(screenX - 15, screenY + 20);
  ctx.closePath();
  ctx.fill();
  
  ctx.fillStyle = '#ffd5c8';
  ctx.beginPath();
  ctx.arc(screenX, screenY - 5 - bodyOffset, 12, 0, Math.PI * 2);
  ctx.fill();
  
  ctx.fillStyle = '#2c2c2c';
  ctx.beginPath();
  ctx.arc(screenX, screenY - 12 - bodyOffset, 8, Math.PI, 0);
  ctx.fill();
  ctx.beginPath();
  ctx.arc(screenX, screenY - 18 - bodyOffset, 5, 0, Math.PI * 2);
  ctx.fill();
  
  const eyeOffsetX = player.direction === 1 ? -2 : player.direction === 2 ? 2 : 0;
  ctx.fillStyle = '#2c2c2c';
  ctx.beginPath();
  ctx.arc(screenX - 4 + eyeOffsetX, screenY - 6 - bodyOffset, 2, 0, Math.PI * 2);
  ctx.arc(screenX + 4 + eyeOffsetX, screenY - 6 - bodyOffset, 2, 0, Math.PI * 2);
  ctx.fill();
  
  if (player.realmIndex > 3) {
    const glowIntensity = 0.2 + Math.sin(Date.now() / 500) * 0.1;
    ctx.strokeStyle = `rgba(255, 215, 0, ${glowIntensity})`;
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(screenX, screenY, 25, 0, Math.PI * 2);
    ctx.stroke();
  }
  
  if (player.realmIndex >= 7) {
    ctx.save();
    ctx.globalAlpha = 0.3 + Math.sin(Date.now() / 300) * 0.2;
    const gradient = ctx.createRadialGradient(screenX, screenY, 0, screenX, screenY, 40);
    gradient.addColorStop(0, 'rgba(255, 215, 0, 0.5)');
    gradient.addColorStop(1, 'rgba(255, 215, 0, 0)');
    ctx.fillStyle = gradient;
    ctx.beginPath();
    ctx.arc(screenX, screenY, 40, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }
}

// ============ 绘制地图 ============
function drawMap() {
  const startX = Math.floor(camera.x / TILE_SIZE);
  const startY = Math.floor(camera.y / TILE_SIZE);
  const endX = Math.min(startX + Math.ceil(canvas.width / TILE_SIZE) + 2, MAP_WIDTH);
  const endY = Math.min(startY + Math.ceil(canvas.height / TILE_SIZE) + 2, MAP_HEIGHT);
  
  for (let y = Math.max(0, startY); y < endY; y++) {
    for (let x = Math.max(0, startX); x < endX; x++) {
      const tile = gameMap[y] && gameMap[y][x];
      if (tile) {
        const screenX = x * TILE_SIZE - camera.x;
        const screenY = y * TILE_SIZE - camera.y;
        
        ctx.fillStyle = tile.color;
        ctx.fillRect(screenX, screenY, TILE_SIZE + 1, TILE_SIZE + 1);
        
        // 绘制特殊地形装饰
        if (tile.color === TILE_TYPES.SPIRIT.color) {
          ctx.fillStyle = `rgba(123, 104, 238, ${0.3 + Math.sin(Date.now() / 500 + x + y) * 0.2})`;
          ctx.beginPath();
          ctx.arc(screenX + TILE_SIZE/2, screenY + TILE_SIZE/2, 10, 0, Math.PI * 2);
          ctx.fill();
        } else if (tile.color === TILE_TYPES.WATER.color) {
          ctx.fillStyle = `rgba(255, 255, 255, ${0.1 + Math.sin(Date.now() / 300 + x) * 0.05})`;
          ctx.fillRect(screenX, screenY + 10, TILE_SIZE, 5);
          // 绘制水面波纹效果
          ctx.strokeStyle = `rgba(255, 255, 255, ${0.2 + Math.sin(Date.now() / 200 + x + y) * 0.1})`;
          ctx.lineWidth = 1;
          ctx.beginPath();
          ctx.arc(screenX + TILE_SIZE/2, screenY + TILE_SIZE/2, 15 + Math.sin(Date.now() / 150 + x) * 3, 0, Math.PI);
          ctx.stroke();
        } else if (tile.color === TILE_TYPES.FOREST.color) {
          ctx.fillStyle = '#0d3d1a';
          ctx.beginPath();
          ctx.moveTo(screenX + TILE_SIZE/2, screenY + 5);
          ctx.lineTo(screenX + 10, screenY + TILE_SIZE - 5);
          ctx.lineTo(screenX + TILE_SIZE - 10, screenY + TILE_SIZE - 5);
          ctx.closePath();
          ctx.fill();
        } else if (tile.color === TILE_TYPES.MOUNTAIN.color) {
          // 绘制山脉轮廓，增加硬表面视觉效果
          ctx.fillStyle = '#4a5568';
          ctx.beginPath();
          ctx.moveTo(screenX + 5, screenY + TILE_SIZE - 5);
          ctx.lineTo(screenX + TILE_SIZE/2, screenY + 8);
          ctx.lineTo(screenX + TILE_SIZE - 5, screenY + TILE_SIZE - 5);
          ctx.closePath();
          ctx.fill();
          
          // 山脉边缘高光
          ctx.strokeStyle = '#718096';
          ctx.lineWidth = 1;
          ctx.beginPath();
          ctx.moveTo(screenX + 5, screenY + TILE_SIZE - 5);
          ctx.lineTo(screenX + TILE_SIZE/2, screenY + 8);
          ctx.stroke();
        }
      }
    }
  }
  
  // 绘制建筑物
  for (const building of buildings) {
    const screenX = building.x - camera.x;
    const screenY = building.y - camera.y;
    
    if (screenX < -50 || screenX > canvas.width + 50 || screenY < -50 || screenY > canvas.height + 50) continue;
    
    // 建筑物阴影
    ctx.fillStyle = 'rgba(0, 0, 0, 0.3)';
    ctx.fillRect(screenX + 3, screenY + 3, building.width, building.height);
    
    // 建筑物主体
    ctx.fillStyle = '#8b7355';
    ctx.fillRect(screenX, screenY, building.width, building.height);
    
    // 建筑物边框（硬表面指示）
    ctx.strokeStyle = '#5d4e37';
    ctx.lineWidth = 2;
    ctx.strokeRect(screenX, screenY, building.width, building.height);
    
    // 屋顶
    ctx.fillStyle = '#6b5b45';
    ctx.beginPath();
    ctx.moveTo(screenX, screenY);
    ctx.lineTo(screenX + building.width / 2, screenY - 8);
    ctx.lineTo(screenX + building.width, screenY);
    ctx.closePath();
    ctx.fill();
  }
}

// ============ 绘制NPC ============
function drawNPCs() {
  npcs.forEach(npc => {
    const screenX = npc.x - camera.x;
    const screenY = npc.y - camera.y;
    
    if (screenX < -50 || screenX > canvas.width + 50 || screenY < -50 || screenY > canvas.height + 50) return;
    
    ctx.fillStyle = 'rgba(0, 0, 0, 0.3)';
    ctx.beginPath();
    ctx.ellipse(screenX, screenY + 15, 15, 7, 0, 0, Math.PI * 2);
    ctx.fill();
    
    const bounce = Math.sin(Date.now() / 500 + npc.animationOffset) * 2;
    ctx.fillStyle = npc.color;
    ctx.beginPath();
    ctx.arc(screenX, screenY - 5 + bounce, 15, 0, Math.PI * 2);
    ctx.fill();
    
    ctx.fillStyle = '#ffd5c8';
    ctx.beginPath();
    ctx.arc(screenX, screenY - 20 + bounce, 10, 0, Math.PI * 2);
    ctx.fill();
    
    ctx.fillStyle = npc.hostile ? '#ff4757' : '#ffd700';
    ctx.font = '12px Microsoft YaHei';
    ctx.textAlign = 'center';
    ctx.fillText(npc.name, screenX, screenY - 35);
    
    const dist = Math.hypot(player.x - npc.x, player.y - npc.y);
    if (dist < 80) {
      ctx.fillStyle = 'rgba(255, 255, 255, 0.9)';
      ctx.font = '11px Microsoft YaHei';
      ctx.fillText('[按E交互]', screenX, screenY + 35);
    }
  });
}

// ============ 绘制敌人（添加碰撞反馈） ============
function drawEnemies() {
  enemies.forEach(enemy => {
    const screenX = enemy.x - camera.x;
    const screenY = enemy.y - camera.y;
    
    if (screenX < -50 || screenX > canvas.width + 50 || screenY < -50 || screenY > canvas.height + 50) return;
    
    ctx.fillStyle = 'rgba(0, 0, 0, 0.4)';
    ctx.beginPath();
    ctx.ellipse(screenX, screenY + 12, 14, 6, 0, 0, Math.PI * 2);
    ctx.fill();
    
    // 碰撞时的视觉反馈
    if (enemy.isColliding) {
      ctx.strokeStyle = `rgba(255, 165, 0, ${0.5 + Math.sin(Date.now() / 50) * 0.3})`;
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(screenX, screenY, 20, 0, Math.PI * 2);
      ctx.stroke();
    }
    
    const pulse = Math.sin(Date.now() / 200) * 2;
    ctx.fillStyle = enemy.color;
    ctx.beginPath();
    ctx.arc(screenX, screenY + pulse, 16, 0, Math.PI * 2);
    ctx.fill();
    
    ctx.fillStyle = '#ff0000';
    ctx.beginPath();
    ctx.arc(screenX - 5, screenY - 3 + pulse, 3, 0, Math.PI * 2);
    ctx.arc(screenX + 5, screenY - 3 + pulse, 3, 0, Math.PI * 2);
    ctx.fill();
    
    const hpPercent = enemy.hp / enemy.maxHp;
    ctx.fillStyle = '#333';
    ctx.fillRect(screenX - 20, screenY - 25, 40, 5);
    ctx.fillStyle = hpPercent > 0.5 ? '#2ecc71' : hpPercent > 0.25 ? '#f39c12' : '#e74c3c';
    ctx.fillRect(screenX - 20, screenY - 25, 40 * hpPercent, 5);
    
    ctx.fillStyle = '#ff6b6b';
    ctx.font = '11px Microsoft YaHei';
    ctx.textAlign = 'center';
    ctx.fillText(enemy.name, screenX, screenY - 30);
  });
}

// ============ 绘制小地图 ============
function drawMinimap() {
  minimapCtx.fillStyle = '#1a1a2e';
  minimapCtx.fillRect(0, 0, 150, 150);
  
  const scale = 150 / (MAP_WIDTH * TILE_SIZE);
  
  for (let y = 0; y < MAP_HEIGHT; y += 2) {
    for (let x = 0; x < MAP_WIDTH; x += 2) {
      const tile = gameMap[y] && gameMap[y][x];
      if (tile) {
        minimapCtx.fillStyle = tile.color;
        minimapCtx.fillRect(x * 3, y * 3, 3, 3);
      }
    }
  }
  
  // 绘制建筑物在小地图上
  minimapCtx.fillStyle = '#5d4e37';
  for (const building of buildings) {
    const bx = building.x * scale;
    const by = building.y * scale;
    minimapCtx.fillRect(bx, by, 2, 2);
  }
  
  minimapCtx.fillStyle = '#ffd700';
  npcs.forEach(npc => {
    minimapCtx.fillRect(npc.x * scale - 1, npc.y * scale - 1, 3, 3);
  });
  
  minimapCtx.fillStyle = '#ff4757';
  enemies.forEach(enemy => {
    minimapCtx.fillRect(enemy.x * scale - 1, enemy.y * scale - 1, 2, 2);
  });
  
  minimapCtx.fillStyle = '#00ff00';
  minimapCtx.fillRect(player.x * scale - 2, player.y * scale - 2, 5, 5);
}

// ============ 战斗系统（添加敌人碰撞检测） ============
function updateEnemies() {
  enemies.forEach(enemy => {
    const dist = Math.hypot(player.x - enemy.x, player.y - enemy.y);
    
    // 重置碰撞状态
    enemy.isColliding = false;
    
    if (dist < enemy.aggroRange) {
      const angle = Math.atan2(player.y - enemy.y, player.x - enemy.x);
      let newX = enemy.x + Math.cos(angle) * enemy.speed;
      let newY = enemy.y + Math.sin(angle) * enemy.speed;
      
      // 检查敌人移动的地形碰撞
      const tileCollision = checkTileCollision(newX, newY);
      
      if (!tileCollision.passable) {
        // 敌人被阻挡，尝试滑动
        enemy.isColliding = true;
        
        // 尝试只沿X轴移动
        const xOnlyCollision = checkTileCollision(newX, enemy.y);
        if (xOnlyCollision.passable) {
          enemy.x = newX;
        } else {
          // 尝试只沿Y轴移动
          const yOnlyCollision = checkTileCollision(enemy.x, newY);
          if (yOnlyCollision.passable) {
            enemy.y = newY;
          }
        }
        
        if (enemy.collisionCooldown <= 0) {
          enemy.collisionCooldown = 60;
        }
      } else {
        // 检查建筑物碰撞
        const buildingCollision = checkBuildingCollision(newX, newY, 16);
        if (!buildingCollision) {
          enemy.x = newX;
          enemy.y = newY;
        } else {
          enemy.isColliding = true;
        }
      }
      
      // 攻击逻辑
      if (dist < 40 && enemy.attackCooldown <= 0) {
        let damage = enemy.damage;
        if (player.shield > 0) {
          const absorbed = Math.min(player.shield, damage);
          player.shield -= absorbed;
          damage -= absorbed;
          addEffect(player.x, player.y, 'spirit');
          addFloatingText(player.x, player.y - 30, `护盾-${absorbed}`, '#00d4ff');
        }
        if (damage > 0) {
          player.hp -= damage;
          addEffect(player.x, player.y, 'attack');
          addFloatingText(player.x, player.y - 30, `-${damage}`, '#ff4757');
        }
        enemy.attackCooldown = 60;
        
        if (player.hp <= 0) {
          player.hp = player.maxHp;
          player.x = canvas.width / 2;
          player.y = canvas.height / 2;
          player.money = Math.floor(player.money * 0.9);
          addMessage('你被击败了，损失了10%灵石', 'combat');
          showToast('💀 你被击败了！');
        }
      }
    }
    
    if (enemy.attackCooldown > 0) enemy.attackCooldown--;
    if (enemy.collisionCooldown > 0) enemy.collisionCooldown--;
  });
}

// ============ 功能函数 ============
function meditate() {
  if (player.spirit < 10) {
    addMessage('灵气不足，无法修炼', 'event');
    showToast('⚠️ 灵气不足！');
    return;
  }
  
  player.spirit -= 10;
  const expGain = 15 + REALMS[player.realmIndex].bonus;
  player.experience += expGain;
  player.totalExperience += expGain;
  
  addEffect(player.x, player.y, 'spirit');
  addFloatingText(player.x, player.y - 40, `+${expGain} EXP`, '#7cfc00');
  addMessage(`🧘 修炼获得 ${expGain} 点经验`, 'gain');
  
  checkLevelUp();
  updateStatus();
}

function checkLevelUp() {
  const currentRealm = REALMS[player.realmIndex];
  const nextRealm = REALMS[player.realmIndex + 1];
  
  if (nextRealm && player.experience >= currentRealm.expRequired) {
    player.experience -= currentRealm.expRequired;
    player.realmIndex++;
    player.maxHp += 20;
    player.hp = player.maxHp;
    player.maxSpirit += 10;
    player.spirit = player.maxSpirit;
    player.baseDamage += 5;
    
    addMessage(`🎉 恭喜突破至 ${REALMS[player.realmIndex].name}！`, 'gain');
    showToast(`🌟 突破成功！${REALMS[player.realmIndex].name}`);
    
    for (let i = 0; i < 5; i++) {
      setTimeout(() => {
        addEffect(player.x + (Math.random() - 0.5) * 50, player.y + (Math.random() - 0.5) * 50, 'spirit');
      }, i * 100);
    }
  }
}

function useSkill() {
  useSkillByIndex(0);
}

function useSkillByIndex(index) {
  const skill = player.skills[index];
  if (!skill) return;
  
  if (skill.cooldown > 0) {
    addMessage(`${skill.name} 冷却中...`, 'event');
    showToast(`⏳ ${skill.name} 冷却中`);
    return;
  }
  
  if (player.spirit < skill.spiritCost) {
    addMessage('灵气不足！', 'event');
    showToast('⚠️ 灵气不足！');
    return;
  }
  
  player.spirit -= skill.spiritCost;
  skill.cooldown = skill.maxCooldown * 60;
  
  if (skill.name === '剑气斩' || skill.name === '御剑术') {
    enemies.forEach(enemy => {
      const dist = Math.hypot(player.x - enemy.x, player.y - enemy.y);
      if (dist < player.attackRange) {
        const damage = skill.damage + player.baseDamage + REALMS[player.realmIndex].bonus;
        enemy.hp -= damage;
        addEffect(enemy.x, enemy.y, 'attack');
        addFloatingText(enemy.x, enemy.y - 30, `-${damage}`, '#ff4757');
        addMessage(`⚔️ ${skill.name} 造成 ${damage} 点伤害！`, 'combat');
        
        if (enemy.hp <= 0) {
          player.experience += enemy.exp;
          player.totalExperience += enemy.exp;
          player.money += enemy.money;
          addFloatingText(enemy.x, enemy.y - 60, `+${enemy.exp} EXP`, '#7cfc00');
          addFloatingText(enemy.x, enemy.y - 90, `+${enemy.money} 灵石`, '#ffd700');
          addMessage(`💀 击败 ${enemy.name}！获得 ${enemy.exp} 经验, ${enemy.money} 灵石`, 'gain');
          showToast(`🎯 击败了 ${enemy.name}！`);
          checkLevelUp();
          
          setTimeout(() => {
            // 敌人重生时确保在可通行区域
            let spawnX, spawnY;
            let attempts = 0;
            do {
              spawnX = Math.random() * (MAP_WIDTH - 4) * TILE_SIZE + TILE_SIZE * 2;
              spawnY = Math.random() * (MAP_HEIGHT - 4) * TILE_SIZE + TILE_SIZE * 2;
              attempts++;
            } while (!checkTileCollision(spawnX, spawnY).passable && attempts < 50);
            
            enemy.x = spawnX;
            enemy.y = spawnY;
            enemy.hp = enemy.maxHp;
          }, 10000);
        }
      }
    });
  } else if (skill.name === '灵力护盾') {
    player.shield += skill.shield;
    addEffect(player.x, player.y, 'spirit');
    addFloatingText(player.x, player.y - 30, `+${skill.shield} 护盾`, '#00d4ff');
    addMessage(`🛡️ 获得 ${skill.shield} 点护盾！`, 'gain');
  } else if (skill.name === '回春术') {
    const heal = Math.min(skill.heal, player.maxHp - player.hp);
    player.hp += heal;
    addEffect(player.x, player.y, 'heal');
    addFloatingText(player.x, player.y - 30, `+${heal} HP`, '#7cfc00');
    addMessage(`💚 恢复了 ${heal} 点生命！`, 'gain');
  }
  
  updateStatus();
}

function trade() {
  showDialog('商人王富贵', '道友需要什么？', [

function buyItem(name, cost, type, effect) {
  if (player.money >= cost) {
    player.money -= cost;
    const item = new Item(name, cost, type, effect);
    item.description = type === 'consumable' ? '点击使用' : '点击出售';
    addItem(item);
    addMessage(`购买了 ${name}`, 'gain');
    showToast(`🛒 购买了 ${name}`);
    updateStatus();
    hideDialog();
  } else {
    addMessage('灵石不足！', 'event');
    showToast('⚠️ 灵石不足！');
  }
}

function alchemy() {
  if (player.spirit < 30) {
    addMessage('灵气不足，无法炼丹', 'event');
    showToast('⚠️ 灵气不足！');
    return;
  }
  
  player.spirit -= 30;
  const success = Math.random() < 0.6 + REALMS[player.realmIndex].bonus * 0.01;
  
  if (success) {
    const potions = ['小还丹', '聚灵丹', '筑基丹', '金丹'];
    const potionName = potions[Math.min(Math.floor(player.realmIndex / 4), potions.length - 1)];
    const potion = new Item(potionName, 80 + player.realmIndex * 20, 'consumable', () => {
      player.hp = player.maxHp;
      player.spirit = player.maxSpirit;
      addMessage(`使用 ${potionName}，完全恢复！`, 'gain');
      showToast('✨ 完全恢复！');
      updateStatus();
    });
    addItem(potion);
    addMessage(`🔥 炼丹成功！获得 ${potionName}`, 'gain');
    showToast(`🔥 炼丹成功！${potionName}`);
  } else {
    addMessage('炼丹失败，灵气消散...', 'event');
    showToast('💨 炼丹失败...');
  }
  
  updateStatus();
}

function exploreMap() {
  let targetX, targetY;
  let attempts = 0;
  
  // 确保传送到可通行区域
  do {
    targetX = Math.random() * (MAP_WIDTH - 4) * TILE_SIZE + TILE_SIZE * 2;
    targetY = Math.random() * (MAP_HEIGHT - 4) * TILE_SIZE + TILE_SIZE * 2;
    attempts++;
  } while (!checkTileCollision(targetX, targetY).passable && attempts < 100);
  
  player.x = targetX;
  player.y = targetY;
  
  const tile = gameMap[player.worldY] && gameMap[player.worldY][player.worldX];
  if (tile) {
    addMessage(`🗺️ 探索到达 ${tile.name}`, 'event');
    showToast(`🗺️ 到达 ${tile.name}`);
    
    if (tile.color === TILE_TYPES.SPIRIT.color) {
      addMessage('发现了灵脉！修炼效率提升！', 'gain');
      showToast('✨ 发现灵脉！');
    } else if (tile.color === TILE_TYPES.CAVE.color) {
      const found = Math.random() < 0.3;
      if (found) {
        const money = 50 + Math.floor(Math.random() * 100);
        player.money += money;
        addMessage(`在洞府中发现 ${money} 灵石！`, 'gain');
        showToast(`💰 发现 ${money} 灵石！`);
        addFloatingText(player.x, player.y - 30, `+${money} 灵石`, '#ffd700');
        updateStatus();
      }
    }
  }
}

// ============ NPC交互 ============
function checkNPCInteraction() {
  if ((keys['e'] || keys['E']) && !eKeyPressed) {
    eKeyPressed = true;
    
    for (const npc of npcs) {
      const dist = Math.hypot(player.x - npc.x, player.y - npc.y);
      if (dist < 80) {
        if (npc.hostile) {
          addMessage(`${npc.name}: ${npc.dialog}`, 'combat');

            { text: '离开', action: hideDialog }
          ]);
        }

      }
    }
  }
}

function updateInventory() {
  const inventoryDiv = document.getElementById('inventoryList');

    inventoryDiv.innerHTML = '<div style="color: #888; padding: 10px;">储物袋空空如也</div>';

  player.inventory.forEach((item, index) => {

}

// ============ 消息系统 ============

// ============ 加载动画系统 ============
function createLoadingParticles() {
  const container = document.getElementById('loadingParticles');
  for (let i = 0; i < 20; i++) {
    const particle = document.createElement('div');
    particle.className = 'loading-particle';
    particle.style.left = Math.random() * 100 + '%';
    particle.style.top = Math.random() * 100 + '%';
    particle.style.animationDelay = Math.random() * 3 + 's';
    container.appendChild(particle);
  }
}

function updateLoadingProgress(progress, text) {
  document.getElementById('loadingBar').style.width = progress + '%';
  document.getElementById('loadingText').textContent = text;
}

async function simulateLoading() {
  const steps = [
    { progress: 15, text: '检测平台兼容性...' },
    { progress: 30, text: '正在凝聚灵气...' },
    { progress: 50, text: '构建修仙世界...' },
    { progress: 70, text: '生成地形地貌...' },
    { progress: 85, text: '放置NPC和怪物...' },
    { progress: 100, text: '准备就绪！' }
  ];
  
  for (const step of steps) {
    await new Promise(resolve => setTimeout(resolve, 400));
    updateLoadingProgress(step.progress, step.text);
  }
  
  await new Promise(resolve => setTimeout(resolve, 500));
  
  document.getElementById('loadingScreen').classList.add('hidden');
  document.getElementById('startScreen').classList.add('show');
  
  // 显示兼容性报告
  setTimeout(() => {
    runCompatibilityTest();
  }, 500);
}

// ============ 开始游戏 ============
function startGame() {
  document.getElementById('startScreen').style.display = 'none';
  document.getElementById('compatTestBtn').style.display = 'block';
  gameStarted = true;
  showToast('🎮 欢迎来到修仙世界！');
  addMessage('📝 提示：水域和山脉为硬表面，无法通过', 'event');
  addMessage('📝 提示：城镇中有建筑物阻挡，注意绕行', 'event');
}

// ============ 游戏循环 ============
function gameLoop() {
  if (!gameStarted) {
    requestAnimationFrame(gameLoop);
    return;
  }
  
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  
  updatePlayerPosition();
  updatePlayerAnimation();
  camera.update();
  updateEnemies();
  updateEffects();
  checkNPCInteraction();
  
  if (player.spirit < player.maxSpirit) {
    player.spirit += 0.02;
  }
  
  drawMap();
  drawNPCs();
  drawEnemies();
  drawPlayer();
  drawEffects();
  drawMinimap();
  
  updateStatus();
  
  requestAnimationFrame(gameLoop);
}
