<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>修仙沙盘游戏 - 鬼谷八荒风格</title>
<style>
  * {
    box-sizing: border-box;
  }
  body {
    margin: 0;
    overflow: hidden;
    font-family: 'Microsoft YaHei', sans-serif;
    background: #1a1a2e;
    touch-action: none;
    -webkit-touch-callout: none;
    -webkit-user-select: none;
    user-select: none;
  }
  canvas {
    display: block;
    touch-action: none;
  }
  
  #compatReport {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    background: linear-gradient(135deg, rgba(20, 20, 40, 0.98), rgba(40, 40, 80, 0.95));
    padding: 25px 30px;
    border-radius: 12px;
    border: 2px solid #6b5b95;
    color: #e8d5b7;
    z-index: 20000;
    max-width: 400px;
    width: 90%;
    display: none;
    box-shadow: 0 10px 40px rgba(0, 0, 0, 0.6);
  }
  #compatReport.show {
    display: block;
  }
  #compatReport h3 {
    margin: 0 0 15px 0;
    color: #ffd700;
    font-size: 18px;
    text-align: center;
  }
  #compatReport .compat-item {
    display: flex;
    justify-content: space-between;
    padding: 8px 0;
    border-bottom: 1px solid rgba(107, 91, 149, 0.3);
  }
  #compatReport .compat-status {
    font-weight: bold;
  }
  #compatReport .compat-status.pass { color: #7cfc00; }
  #compatReport .compat-status.warn { color: #ffa500; }
  #compatReport .compat-status.fail { color: #ff4757; }
  #compatReport .close-btn {
    margin-top: 15px;
    width: 100%;
    padding: 10px;
    background: linear-gradient(135deg, #4a3f6b, #6b5b95);
    border: 1px solid #8b7bb5;
    color: #e8d5b7;
    border-radius: 5px;
    cursor: pointer;
    font-size: 14px;
  }
  #compatReport .close-btn:hover {
    background: linear-gradient(135deg, #6b5b95, #8b7bb5);
  }
  
  #joystickContainer {
    position: fixed;
    bottom: 100px;
    left: 30px;
    width: 120px;
    height: 120px;
    display: none;
    z-index: 500;
  }
  #joystickContainer.show {
    display: block;
  }
  #joystickBase {
    position: absolute;
    width: 120px;
    height: 120px;
    background: rgba(107, 91, 149, 0.3);
    border: 3px solid rgba(107, 91, 149, 0.6);
    border-radius: 50%;
  }
  #joystickThumb {
    position: absolute;
    width: 50px;
    height: 50px;
    background: linear-gradient(135deg, #6b5b95, #8b7bb5);
    border: 2px solid #ffd700;
    border-radius: 50%;
    left: 35px;
    top: 35px;
    transition: none;
  }
  
  #touchSkills {
    position: fixed;
    bottom: 100px;
    right: 20px;
    display: none;
    flex-direction: column;
    gap: 10px;
    z-index: 500;
  }
  #touchSkills.show {
    display: flex;
  }
  .touch-skill-btn {
    width: 60px;
    height: 60px;
    background: linear-gradient(135deg, #4a3f6b, #6b5b95);
    border: 2px solid #ffd700;
    border-radius: 12px;
    color: #ffd700;
    font-size: 24px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    touch-action: manipulation;
  }
  .touch-skill-btn:active {
    background: linear-gradient(135deg, #6b5b95, #8b7bb5);
    transform: scale(0.95);
  }
  
  #loadingScreen {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: linear-gradient(135deg, #0d0d1a 0%, #1a1a2e 50%, #0d0d1a 100%);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 9999;
    transition: opacity 0.8s ease;
  }
  #loadingScreen.hidden {
    opacity: 0;
    pointer-events: none;
  }
  .loading-title {
    font-size: 42px;
    color: #ffd700;
    text-shadow: 0 0 20px rgba(255, 215, 0, 0.5), 0 0 40px rgba(255, 215, 0, 0.3);
    margin-bottom: 10px;
    letter-spacing: 8px;
  }
  .loading-subtitle {
    font-size: 18px;
    color: #7b68ee;
    margin-bottom: 40px;
    letter-spacing: 4px;
  }
  .loading-bagua {
    width: 120px;
    height: 120px;
    position: relative;
    animation: rotateBagua 3s linear infinite;
  }
  .loading-bagua::before {
    content: '☯';
    font-size: 100px;
    color: #ffd700;
    text-shadow: 0 0 30px rgba(255, 215, 0, 0.8);
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
  }
  @keyframes rotateBagua {
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }
  }
  .loading-progress-container {
    width: 300px;
    height: 8px;
    background: rgba(107, 91, 149, 0.3);
    border-radius: 4px;
    margin-top: 30px;
    overflow: hidden;
    border: 1px solid #6b5b95;
  }
  .loading-progress-bar {
    height: 100%;
    background: linear-gradient(90deg, #6b5b95, #ffd700, #6b5b95);
    background-size: 200% 100%;
    animation: shimmer 1.5s infinite;
    border-radius: 4px;
    width: 0%;
    transition: width 0.3s ease;
  }
  @keyframes shimmer {
    0% { background-position: -200% 0; }
    100% { background-position: 200% 0; }
  }
  
  #gameContainer {
    position: relative;
    width: 100%;
    height: 100vh;
  }
  
  #uiOverlay {
    position: absolute;
    top: 10px;
    left: 10px;
    color: #e8d5b7;
    font-size: 14px;
    pointer-events: none;
    z-index: 100;
  }
  
  #statusPanel {
    background: linear-gradient(135deg, rgba(20, 20, 40, 0.9), rgba(40, 40, 80, 0.85));
    padding: 15px;
    border-radius: 10px;
    border: 2px solid #6b5b95;
    min-width: 200px;
    pointer-events: auto;
  }
  
  .stat-row {
    display: flex;
    justify-content: space-between;
    margin-bottom: 8px;
  }
  
  .stat-label {
    color: #a8a8a8;
  }
  
  .stat-value {
    color: #ffd700;
    font-weight: bold;
  }
  
  .hp-bar, .spirit-bar, .exp-bar {
    height: 12px;
    background: rgba(0, 0, 0, 0.5);
    border-radius: 6px;
    margin-top: 5px;
    overflow: hidden;
    border: 1px solid #444;
  }
  
  .hp-fill {
    height: 100%;
    background: linear-gradient(90deg, #ff4757, #ff6b7a);
    transition: width 0.3s ease;
  }
  
  .spirit-fill {
    height: 100%;
    background: linear-gradient(90deg, #5f27cd, #a55eea);
    transition: width 0.3s ease;
  }
  
  .exp-fill {
    height: 100%;
    background: linear-gradient(90deg, #ffd700, #ffeb3b);
    transition: width 0.3s ease;
  }
  
  #messageLog {
    position: absolute;
    bottom: 20px;
    left: 20px;
    width: 350px;
    max-height: 150px;
    overflow-y: auto;
    background: rgba(20, 20, 40, 0.8);
    border-radius: 8px;
    padding: 10px;
    border: 1px solid #6b5b95;
  }
  
  .message {
    padding: 4px 0;
    font-size: 13px;
    border-bottom: 1px solid rgba(107, 91, 149, 0.3);
    animation: fadeIn 0.3s ease;
  }
  
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }
  
  .message.gain { color: #7cfc00; }
  .message.loss { color: #ff4757; }
  .message.info { color: #87ceeb; }
  .message.chest { color: #ffd700; }
  .message.legendary { color: #ff8c00; text-shadow: 0 0 5px #ff8c00; }
  .message.site { color: #64c8ff; }
  .message.site-rare { color: #b48ead; text-shadow: 0 0 5px #b48ead; }
  
  #inventoryPanel {
    position: absolute;
    top: 10px;
    right: 10px;
    background: linear-gradient(135deg, rgba(20, 20, 40, 0.9), rgba(40, 40, 80, 0.85));
    padding: 15px;
    border-radius: 10px;
    border: 2px solid #6b5b95;
    min-width: 250px;
    pointer-events: auto;
  }
  
  .panel-title {
    color: #ffd700;
    font-size: 16px;
    margin-bottom: 10px;
    padding-bottom: 5px;
    border-bottom: 1px solid #6b5b95;
  }
  
  .inventory-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 8px;
    margin: 5px 0;
    background: rgba(107, 91, 149, 0.2);
    border-radius: 5px;
    border: 1px solid rgba(107, 91, 149, 0.4);
    cursor: pointer;
    transition: all 0.2s ease;
  }
  
  .inventory-item:hover {
    background: rgba(107, 91, 149, 0.4);
    border-color: #ffd700;
  }
  
  .item-name {
    color: #e8d5b7;
  }
  
  .item-actions {
    display: flex;
    gap: 5px;
  }
  
  .item-btn {
    padding: 3px 8px;
    font-size: 11px;
    background: linear-gradient(135deg, #4a3f6b, #6b5b95);
    border: 1px solid #8b7bb5;
    color: #e8d5b7;
    border-radius: 3px;
    cursor: pointer;
  }
  
  .item-btn:hover {
    background: linear-gradient(135deg, #6b5b95, #8b7bb5);
  }
  
  #skillPanel {
    position: absolute;
    bottom: 20px;
    right: 20px;
    background: linear-gradient(135deg, rgba(20, 20, 40, 0.9), rgba(40, 40, 80, 0.85));
    padding: 15px;
    border-radius: 10px;
    border: 2px solid #6b5b95;
    pointer-events: auto;
  }
  
  .skill-btn {
    display: block;
    width: 100%;
    padding: 10px 15px;
    margin: 5px 0;
    background: linear-gradient(135deg, #4a3f6b, #6b5b95);
    border: 1px solid #8b7bb5;
    color: #e8d5b7;
    border-radius: 5px;
    cursor: pointer;
    text-align: left;
    transition: all 0.2s ease;
  }
  
  .skill-btn:hover:not(:disabled) {
    background: linear-gradient(135deg, #6b5b95, #8b7bb5);
    border-color: #ffd700;
  }
  
  .skill-btn:disabled {
    opacity: 0.5;
    cursor: not-allowed;
  }
  
  .skill-name {
    font-weight: bold;
  }
  
  .skill-cost {
    font-size: 11px;
    color: #a8a8a8;
  }
  
  #minimap {
    position: absolute;
    top: 10px;
    right: 280px;
    background: rgba(20, 20, 40, 0.9);
    border: 2px solid #6b5b95;
    border-radius: 10px;
    overflow: hidden;
    pointer-events: auto;
    cursor: pointer;
  }
  
  #minimap:hover #minimapTooltip {
    display: block;
  }
  
  #minimapTooltip {
    display: none;
    position: absolute;
    top: 160px;
    left: 0;
    width: 150px;
    background: rgba(20, 20, 40, 0.95);
    border: 1px solid #6b5b95;
    border-radius: 5px;
    padding: 8px;
    font-size: 11px;
    color: #e8d5b7;
    z-index: 10;
  }
  
  .minimap-legend-item {
    display: flex;
    align-items: center;
    margin: 3px 0;
  }
  
  .minimap-legend-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    margin-right: 6px;
  }
  
  #chestHint {
    position: fixed;
    bottom: 200px;
    left: 50%;
    transform: translateX(-50%);
    background: linear-gradient(135deg, rgba(20, 20, 40, 0.95), rgba(40, 40, 80, 0.9));
    padding: 12px 25px;
    border-radius: 8px;
    border: 2px solid #ffd700;
    color: #ffd700;
    font-size: 16px;
    z-index: 600;
    display: none;
    animation: pulse 1.5s ease-in-out infinite;
  }
  
  #chestHint.show {
    display: block;
  }
  
  @keyframes pulse {
    0%, 100% { transform: translateX(-50%) scale(1); }
    50% { transform: translateX(-50%) scale(1.05); }
  }
  
  #chestRewardPopup {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    background: linear-gradient(135deg, rgba(20, 20, 40, 0.98), rgba(40, 40, 80, 0.95));
    padding: 30px 40px;
    border-radius: 15px;
    border: 3px solid #ffd700;
    color: #e8d5b7;
    z-index: 700;
    min-width: 320px;
    display: none;
    box-shadow: 0 0 50px rgba(255, 215, 0, 0.3);
    animation: popIn 0.3s ease;
  }
  
  #chestRewardPopup.show {
    display: block;
  }
  
  @keyframes popIn {
    from { transform: translate(-50%, -50%) scale(0.8); opacity: 0; }
    to { transform: translate(-50%, -50%) scale(1); opacity: 1; }
  }
  
  #chestRewardPopup h3 {
    color: #ffd700;
    font-size: 22px;
    margin: 0 0 20px 0;
    text-align: center;
    text-shadow: 0 0 10px rgba(255, 215, 0, 0.5);
  }
  
  .reward-item {
    display: flex;
    align-items: center;
    padding: 10px 15px;
    margin: 8px 0;
    background: rgba(107, 91, 149, 0.3);
    border-radius: 8px;
    border-left: 4px solid #ffd700;
    animation: slideIn 0.3s ease;
  }
  
  @keyframes slideIn {
    from { transform: translateX(-20px); opacity: 0; }
    to { transform: translateX(0); opacity: 1; }
  }
  
  .reward-icon {
    font-size: 24px;
    margin-right: 15px;
  }
  
  .reward-text {
    font-size: 16px;
  }
  
  .reward-amount {
    color: #ffd700;
    font-weight: bold;
    margin-left: auto;
  }
  
  #closeRewardBtn {
    display: block;
    width: 100%;
    margin-top: 20px;
    padding: 12px;
    background: linear-gradient(135deg, #4a3f6b, #6b5b95);
    border: 2px solid #ffd700;
    color: #ffd700;
    border-radius: 8px;
    cursor: pointer;
    font-size: 16px;
    transition: all 0.2s ease;
  }
  
  #closeRewardBtn:hover {
    background: linear-gradient(135deg, #6b5b95, #8b7bb5);
    box-shadow: 0 0 15px rgba(255, 215, 0, 0.3);
  }
  
  /* 修炼灵地状态条 */
  #siteStatus {
    position: fixed;
    top: 80px;
    left: 50%;
    transform: translateX(-50%);
    background: linear-gradient(135deg, rgba(20, 20, 40, 0.95), rgba(40, 40, 80, 0.9));
    padding: 10px 25px;
    border-radius: 25px;
    border: 2px solid #64c8ff;
    color: #e8d5b7;
    font-size: 14px;
    z-index: 600;
    display: none;
    align-items: center;
    gap: 15px;
    box-shadow: 0 0 20px rgba(100, 200, 255, 0.3);
    animation: fadeInDown 0.3s ease;
  }
  
  #siteStatus.show {
    display: flex;
  }
  
  @keyframes fadeInDown {
    from { transform: translateX(-50%) translateY(-20px); opacity: 0; }
    to { transform: translateX(-50%) translateY(0); opacity: 1; }
  }
  
  #siteStatus .site-icon {
    font-size: 20px;
  }
  
  #siteStatus .site-name {
    color: #64c8ff;
    font-weight: bold;
  }
  
  #siteStatus .site-bonus {
    color: #7cfc00;
    font-size: 12px;
  }
  
  #siteStatus .site-hint {
    color: #a8a8a8;
    font-size: 11px;
    margin-left: 10px;
  }
  
  /* 灵地详情弹窗 */
  #siteInfoPopup {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    background: linear-gradient(135deg, rgba(20, 20, 40, 0.98), rgba(40, 40, 80, 0.95));
    padding: 25px 35px;
    border-radius: 15px;
    color: #e8d5b7;
    z-index: 700;
    min-width: 350px;
    display: none;
    box-shadow: 0 0 50px rgba(100, 200, 255, 0.3);
    animation: popIn 0.3s ease;
  }
  
  #siteInfoPopup.show {
    display: block;
  }
  
  #siteInfoPopup h3 {
    margin: 0 0 20px 0;
    font-size: 22px;
    text-align: center;
  }
  
  #siteInfoPopup .site-type {
    text-align: center;
    margin-bottom: 15px;
    padding: 5px 15px;
    border-radius: 15px;
    display: inline-block;
    width: 100%;
  }
  
  #siteInfoPopup .site-stats {
    margin: 15px 0;
  }
  
  #siteInfoPopup .stat-item {
    display: flex;
    justify-content: space-between;
    padding: 8px 0;
    border-bottom: 1px solid rgba(107, 91, 149, 0.3);
  }
  
  #siteInfoPopup .stat-item:last-child {
    border-bottom: none;
  }
  
  #siteInfoPopup .stat-label {
    color: #a8a8a8;
  }
  
  #siteInfoPopup .stat-value {
    font-weight: bold;
  }
  
  #siteInfoPopup .stat-value.bonus {
    color: #7cfc00;
  }
  
  #siteInfoPopup .site-description {
    margin-top: 15px;
    padding: 12px;
    background: rgba(107, 91, 149, 0.2);
    border-radius: 8px;
    font-size: 13px;
    line-height: 1.6;
    color: #c8c8c8;
  }
  
  #closeSiteInfoBtn {
    display: block;
    width: 100%;
    margin-top: 20px;
    padding: 12px;
    background: linear-gradient(135deg, #4a3f6b, #6b5b95);
    border: 2px solid #64c8ff;
    color: #64c8ff;
    border-radius: 8px;
    cursor: pointer;
    font-size: 16px;
    transition: all 0.2s ease;
  }
  
  #closeSiteInfoBtn:hover {
    background: linear-gradient(135deg, #6b5b95, #8b7bb5);
    box-shadow: 0 0 15px rgba(100, 200, 255, 0.3);
  }
  
  /* 灵地类型颜色 */
  .site-common { color: #88c0d0; border-color: #88c0d0; }
  .site-fine { color: #a3be8c; border-color: #a3be8c; }
  .site-rare { color: #ebcb8b; border-color: #ebcb8b; }
  .site-legendary { color: #b48ead; border-color: #b48ead; }
</style>
</head>
<body>
<div id="loadingScreen">
  <div class="loading-title">修仙沙盘</div>
  <div class="loading-subtitle">天地玄黄 宇宙洪荒</div>
  <div class="loading-bagua"></div>
  <div class="loading-progress-container">
    <div class="loading-progress-bar" id="loadingBar"></div>
  </div>
</div>

<div id="compatReport">
  <h3>兼容性报告</h3>
  <div id="compatContent"></div>
  <button class="close-btn" onclick="hideCompatReport()">关闭</button>
</div>

<div id="joystickContainer">
  <div id="joystickBase"></div>
  <div id="joystickThumb"></div>
</div>

<div id="touchSkills">
  <button class="touch-skill-btn" onclick="useSkill(0)">剑</button>
  <button class="touch-skill-btn" onclick="useSkill(1)">盾</button>
  <button class="touch-skill-btn" onclick="useSkill(2)">愈</button>
</div>

<div id="gameContainer">
  <canvas id="gameCanvas"></canvas>
  <canvas id="minimapCanvas" width="150" height="150"></canvas>
  
  <div id="uiOverlay">
    <div id="statusPanel">
      <div class="panel-title">修仙者状态</div>
      <div class="stat-row">
        <span class="stat-label">境界:</span>
        <span class="stat-value" id="realmName">练气一层</span>
      </div>
      <div class="stat-row">
        <span class="stat-label">生命:</span>
        <span class="stat-value" id="hpValue">100/100</span>
      </div>
      <div class="hp-bar"><div class="hp-fill" id="hpFill" style="width: 100%"></div></div>
      <div class="stat-row">
        <span class="stat-label">灵力:</span>
        <span class="stat-value" id="spiritValue">50/100</span>
      </div>
      <div class="spirit-bar"><div class="spirit-fill" id="spiritFill" style="width: 50%"></div></div>
      <div class="stat-row">
        <span class="stat-label">经验:</span>
        <span class="stat-value" id="expValue">0/100</span>
      </div>
      <div class="exp-bar"><div class="exp-fill" id="expFill" style="width: 0%"></div></div>
      <div class="stat-row">
        <span class="stat-label">灵石:</span>
        <span class="stat-value" id="moneyValue">100</span>
      </div>
      <div class="stat-row" id="currentSiteRow" style="display: none;">
        <span class="stat-label">灵地:</span>
        <span class="stat-value" id="currentSiteName" style="color: #64c8ff;">-</span>
      </div>
    </div>
  </div>
  
  <div id="inventoryPanel">
    <div class="panel-title">储物袋</div>
    <div id="inventoryList"></div>
  </div>
  
  <div id="skillPanel">
    <div class="panel-title">技能 [1-4]</div>
    <button class="skill-btn" onclick="useSkill(0)">
      <span class="skill-name">剑气斩</span>
      <span class="skill-cost">灵力: 10 | CD: 2s</span>
    </button>
    <button class="skill-btn" onclick="useSkill(1)">
      <span class="skill-name">灵力护盾</span>
      <span class="skill-cost">灵力: 15 | CD: 5s</span>
    </button>
    <button class="skill-btn" onclick="useSkill(2)">
      <span class="skill-name">回春术</span>
      <span class="skill-cost">灵力: 20 | CD: 8s</span>

// ============ Polyfill 兼容性补丁 ============
if (!Math.hypot) {
  Math.hypot = function() {
    var y = 0;
    var length = arguments.length;
    for (var i = 0; i < length; i++) {
      if (arguments[i] === Infinity || arguments[i] === -Infinity) {
        return Infinity;
      }
      y += arguments[i] * arguments[i];
    }
    return Math.sqrt(y);
  };
}

if (!CanvasRenderingContext2D.prototype.ellipse) {
  CanvasRenderingContext2D.prototype.ellipse = function(x, y, radiusX, radiusY, rotation, startAngle, endAngle, anticlockwise) {
    this.save();
    this.translate(x, y);
    this.rotate(rotation);
    this.scale(radiusX / radiusY, 1);
    this.arc(0, 0, radiusY, startAngle, endAngle, anticlockwise);
    this.restore();
  };
}

if (!window.requestAnimationFrame) {
  window.requestAnimationFrame = function(callback) {
    return setTimeout(callback, 16);
  };
}

// ============ 平台兼容性检测类 ============
class CompatibilityTester {
  constructor() {
    this.results = [];
    this.platform = this.detectPlatform();
    this.browser = this.detectBrowser();
  }
  
  detectPlatform() {
    const ua = navigator.userAgent.toLowerCase();
    if (/mobile|android|iphone|ipad|ipod|blackberry|iemobile|opera mini/i.test(ua)) {
      return 'mobile';
    } else if (/tablet|ipad/i.test(ua)) {
      return 'tablet';
    }
    return 'desktop';
  }
  
  detectBrowser() {
    const ua = navigator.userAgent;
    if (ua.indexOf('Chrome') > -1 && ua.indexOf('Edg') === -1) return 'Chrome';
    if (ua.indexOf('Safari') > -1 && ua.indexOf('Chrome') === -1) return 'Safari';
    if (ua.indexOf('Firefox') > -1) return 'Firefox';
    if (ua.indexOf('Edg') > -1) return 'Edge';
    if (ua.indexOf('MSIE') > -1 || ua.indexOf('Trident') > -1) return 'IE';
    return 'Unknown';
  }
  
  test(name, testFn) {
    try {
      const result = testFn();
      this.results.push({
        name: name,
        status: result ? 'pass' : 'fail',
        message: result ? '支持' : '不支持'
      });
      return result;
    } catch (e) {
      this.results.push({
        name: name,
        status: 'fail',
        message: '错误: ' + e.message
      });
      return false;
    }
  }
  
  runAllTests() {
    this.results = [];
    this.test('Canvas 2D', () => {
      const testCanvas = document.createElement('canvas');
      return !!(testCanvas.getContext && testCanvas.getContext('2d'));
    });
    this.test('Canvas椭圆绘制', () => {
      const testCanvas = document.createElement('canvas');
      const ctx = testCanvas.getContext('2d');
      return typeof ctx.ellipse === 'function' || true;
    });
    this.test('requestAnimationFrame', () => typeof window.requestAnimationFrame === 'function');
    this.test('JSON支持', () => typeof JSON === 'object' && typeof JSON.parse === 'function');
    this.test('localStorage', () => {
      try {
        localStorage.setItem('test', 'test');
        localStorage.removeItem('test');
        return true;
      } catch (e) {
        return false;
      }
    });
    this.test('触屏支持', () => 'ontouchstart' in window || navigator.maxTouchPoints > 0);
    this.test('音频支持', () => typeof AudioContext !== 'undefined' || typeof webkitAudioContext !== 'undefined');
    this.test('ES6类支持', () => {
      try {
        eval('class Test {}');
        return true;
      } catch (e) {
        return false;
      }
    });
    this.test('CSS Grid', () => typeof document.createElement('div').style.grid === 'string');
    this.test('CSS Flexbox', () => typeof document.createElement('div').style.flex === 'string');
    return this.results;
  }
  
  generateReport() {
    let html = '';
    html += `<div class="compat-item"><span>平台类型</span><span class="compat-status pass">${this.platform}</span></div>`;
    html += `<div class="compat-item"><span>浏览器</span><span class="compat-status pass">${this.browser}</span></div>`;
    html += `<div class="compat-item"><span>屏幕分辨率</span><span class="compat-status pass">${window.innerWidth}x${window.innerHeight}</span></div>`;
    html += `<div class="compat-item"><span>设备像素比</span><span class="compat-status pass">${window.devicePixelRatio}</span></div>`;
    html += '<div style="margin: 10px 0; border-top: 1px solid #6b5b95;"></div>';
    let passCount = 0;
    this.results.forEach(result => {
      const statusClass = result.status === 'pass' ? 'pass' : result.status === 'warn' ? 'warn' : 'fail';
      html += `<div class="compat-item"><span>${result.name}</span><span class="compat-status ${statusClass}">${result.message}</span></div>`;
      if (result.status === 'pass') passCount++;
    });
    const overallStatus = passCount === this.results.length ? 'pass' : passCount >= this.results.length * 0.7 ? 'warn' : 'fail';
    const overallText = overallStatus === 'pass' ? '完全兼容' : overallStatus === 'warn' ? '基本兼容' : '兼容性问题';
    html += `<div style="margin-top: 15px; padding-top: 10px; border-top: 2px solid #ffd700; text-align: center;"><span class="compat-status ${overallStatus}">${overallText}</span></div>`;
    return html;
  }
}

const compatTester = new CompatibilityTester();

function runCompatibilityTest() {
  compatTester.runAllTests();
  const report = compatTester.generateReport();
  document.getElementById('compatContent').innerHTML = report;
  document.getElementById('compatReport').classList.add('show');
}

function hideCompatReport() {
  document.getElementById('compatReport').classList.remove('show');
}

// ============ 触屏控制系统 ============
class TouchController {
  constructor() {
    this.joystickContainer = document.getElementById('joystickContainer');
    this.joystickThumb = document.getElementById('joystickThumb');
    this.touchSkills = document.getElementById('touchSkills');
    this.joystickActive = false;
    this.joystickStartX = 0;
    this.joystickStartY = 0;
    this.joystickX = 0;
    this.joystickY = 0;
    this.maxDistance = 40;
    this.init();
  }
  
  init() {
    if ('ontouchstart' in window || navigator.maxTouchPoints > 0) {
      this.joystickContainer.classList.add('show');
      this.touchSkills.classList.add('show');
      this.setupJoystick();
      console.log('[触屏控制] 已启用虚拟摇杆');
    }
  }
  
  setupJoystick() {
    const base = document.getElementById('joystickBase');
    base.addEventListener('touchstart', (e) => {
      e.preventDefault();
      this.joystickActive = true;
      const touch = e.touches[0];
      const rect = base.getBoundingClientRect();
      this.joystickStartX = rect.left + rect.width / 2;
      this.joystickStartY = rect.top + rect.height / 2;
    }, { passive: false });
    
    document.addEventListener('touchmove', (e) => {
      if (!this.joystickActive) return;
      e.preventDefault();
      const touch = e.touches[0];
      let dx = touch.clientX - this.joystickStartX;
      let dy = touch.clientY - this.joystickStartY;
      const distance = Math.sqrt(dx * dx + dy * dy);
      if (distance > this.maxDistance) {
        dx = dx / distance * this.maxDistance;
        dy = dy / distance * this.maxDistance;
      }
      this.joystickX = dx / this.maxDistance;
      this.joystickY = dy / this.maxDistance;
      this.joystickThumb.style.transform = `translate(${dx}px, ${dy}px)`;
    }, { passive: false });
    
    document.addEventListener('touchend', () => {
      if (this.joystickActive) {
        this.joystickActive = false;
        this.joystickX = 0;
        this.joystickY = 0;
        this.joystickThumb.style.transform = 'translate(0, 0)';
      }
    });
  }
  
  getMovement() {
    return { x: this.joystickX, y: this.joystickY };
  }
}

// ============ 修炼灵地类 ============
class SpiritSite {
  constructor(x, y, type, name) {
    this.x = x;
    this.y = y;
    this.type = type;
    this.typeConfig = CULTIVATION_SITE_TYPES[type];
    this.name = name;
    this.radius = this.typeConfig.radius;
    this.pulsePhase = Math.random() * Math.PI * 2;
    this.particles = [];
    this.playerInside = false;
    this.interactionRadius = 60;
  }
  
  checkPlayerInside(px, py) {
    const dx = px - this.x;
    const dy = py - this.y;
    const dist = Math.sqrt(dx * dx + dy * dy);
    return dist < this.radius;
  }
  
  update() {
    // 更新粒子
    this.particles = this.particles.filter(p => {
      p.x += p.vx;
      p.y += p.vy;
      p.vy -= 0.02;
      p.life -= 0.01;
      p.alpha = p.life;
      return p.life > 0;
    });
    
    // 生成新粒子
    if (Math.random() < 0.1) {
      const angle = Math.random() * Math.PI * 2;
      const dist = Math.random() * this.radius * 0.8;
      this.particles.push({
        x: this.x + Math.cos(angle) * dist,
        y: this.y + Math.sin(angle) * dist,
        vx: (Math.random() - 0.5) * 0.5,
        vy: -Math.random() * 0.5 - 0.3,
        life: 1,
        alpha: 1,
        size: 2 + Math.random() * 3
      });
    }
  }
  
  draw(ctx, cameraX, cameraY) {
    const screenX = this.x - cameraX;
    const screenY = this.y - cameraY;
    const time = Date.now() / 1000;
    
    // 绘制粒子
    this.particles.forEach(p => {
      ctx.save();
      ctx.globalAlpha = p.alpha * 0.6;
      ctx.fillStyle = this.typeConfig.particleColor;
      ctx.beginPath();
      ctx.arc(p.x - cameraX, p.y - cameraY, p.size, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    });
    
    // 外圈光晕
    ctx.save();
    const pulseScale = 1 + Math.sin(time * 2 + this.pulsePhase) * 0.1;
    const gradient = ctx.createRadialGradient(screenX, screenY, 0, screenX, screenY, this.radius * pulseScale);
    gradient.addColorStop(0, this.typeConfig.glowColor);
    gradient.addColorStop(0.7, this.typeConfig.glowColor.replace(/[\d.]+\)$/, '0.1)'));
    gradient.addColorStop(1, 'transparent');
    ctx.fillStyle = gradient;
    ctx.beginPath();
    ctx.arc(screenX, screenY, this.radius * pulseScale, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
    
    // 中圈
    ctx.save();
    ctx.globalAlpha = 0.3 + Math.sin(time * 3 + this.pulsePhase) * 0.1;
    ctx.strokeStyle = this.typeConfig.color;
    ctx.lineWidth = 2;
    ctx.setLineDash([5, 5]);
    ctx.beginPath();
    ctx.arc(screenX, screenY, this.radius * 0.6, 0, Math.PI * 2);
    ctx.stroke();
    ctx.restore();
    
    // 中心图标
    ctx.save();
    const iconPulse = 1 + Math.sin(time * 4 + this.pulsePhase) * 0.15;
    ctx.translate(screenX, screenY);
    ctx.scale(iconPulse, iconPulse);
    
    // 外环
    ctx.strokeStyle = this.typeConfig.color;
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.arc(0, 0, 20, 0, Math.PI * 2);
    ctx.stroke();
    
    // 内环
    ctx.beginPath();
    ctx.arc(0, 0, 12, 0, Math.PI * 2);
    ctx.stroke();
    
    // 中心点
    ctx.fillStyle = this.typeConfig.color;
    ctx.beginPath();
    ctx.arc(0, 0, 6, 0, Math.PI * 2);
    ctx.fill();
    
    // 八卦符号装饰
    ctx.strokeStyle = this.typeConfig.color;
    ctx.lineWidth = 1.5;
    for (let i = 0; i < 8; i++) {
      const angle = (i * Math.PI / 4) + time * 0.5;
      ctx.beginPath();
      ctx.moveTo(Math.cos(angle) * 15, Math.sin(angle) * 15);
      ctx.lineTo(Math.cos(angle) * 18, Math.sin(angle) * 18);
      ctx.stroke();
    }
    
    ctx.restore();
    
    // 名称标签
    ctx.save();
    ctx.fillStyle = this.typeConfig.color;
    ctx.font = 'bold 14px Microsoft YaHei';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    
    // 背景框
    const textWidth = ctx.measureText(this.name).width + 16;
    ctx.fillStyle = 'rgba(20, 20, 40, 0.8)';
    ctx.strokeStyle = this.typeConfig.color;
    ctx.lineWidth = 1;
    const labelY = screenY + this.radius * 0.6 + 25;
    ctx.beginPath();
    ctx.roundRect(screenX - textWidth / 2, labelY - 12, textWidth, 24, 4);
    ctx.fill();
    ctx.stroke();
    
    // 文字
    ctx.fillStyle = this.typeConfig.color;
    ctx.fillText(this.name, screenX, labelY);
    ctx.restore();
    
    // 等级标签
    ctx.save();
    ctx.font = '10px Microsoft YaHei';
    ctx.fillStyle = this.typeConfig.color;
    ctx.textAlign = 'center';
    ctx.fillText(`[${this.typeConfig.tier}]`, screenX, screenY + this.radius * 0.6 + 45);
    ctx.restore();
  }
  
  drawMinimap(minimapCtx, scale) {
    // 灵地范围
    minimapCtx.fillStyle = this.typeConfig.glowColor;
    minimapCtx.beginPath();
    minimapCtx.arc(this.x * scale, this.y * scale, this.radius * scale * 0.5, 0, Math.PI * 2);
    minimapCtx.fill();
    
    // 中心点
    minimapCtx.fillStyle = this.typeConfig.color;
    minimapCtx.beginPath();
    minimapCtx.arc(this.x * scale, this.y * scale, 3, 0, Math.PI * 2);
    minimapCtx.fill();
  }
}

// ============ 宝箱类 ============
class TreasureChest {
  constructor(x, y, type) {
    this.x = x;
    this.y = y;
    this.type = type;
    this.typeConfig = CHEST_TYPES[type];
    this.opened = false;
    this.interactionRadius = 60;
    this.animationProgress = 0;
    this.isAnimating = false;
    this.particles = [];
  }
  
  checkInteraction(px, py) {
    if (this.opened) return false;
    const dx = px - this.x;
    const dy = py - this.y;
    return Math.sqrt(dx * dx + dy * dy) < this.interactionRadius;
  }
  
  open() {
    if (this.opened) return null;
    this.opened = true;
    this.isAnimating = true;
    this.animationProgress = 0;
    this.createParticles();
    return this.generateRewards();
  }
  
  generateRewards() {
    const rewards = [];
    const config = this.typeConfig.rewards;
    
    if (Math.random() < config.money.chance) {
      const amount = Math.floor(config.money.min + Math.random() * (config.money.max - config.money.min));
      rewards.push({ type: 'money', amount: amount, icon: '💰', text: '灵石' });
      player.money += amount;
    }
    
    if (Math.random() < config.exp.chance) {
      const amount = Math.floor(config.exp.min + Math.random() * (config.exp.max - config.exp.min));
      rewards.push({ type: 'exp', amount: amount, icon: '✨', text: '修为' });
      player.experience += amount;
      player.totalExperience += amount;
    }
    
    config.items.forEach(itemDef => {
      if (Math.random() < itemDef.chance) {
        const item = new Item(itemDef.name);
        player.inventory.push(item);
        rewards.push({ type: 'item', name: itemDef.name, icon: '📦', text: itemDef.name });
      }
    });
    
    return rewards;
  }
  
  createParticles() {
    const colors = [this.typeConfig.color, '#ffd700', '#ffffff'];
    for (let i = 0; i < 20; i++) {
      this.particles.push({
        x: this.x,
        y: this.y,
        vx: (Math.random() - 0.5) * 8,
        vy: (Math.random() - 0.5) * 8 - 3,
        life: 1,
        color: colors[Math.floor(Math.random() * colors.length)],
        size: 3 + Math.random() * 4
      });
    }
  }
  
  update() {
    if (this.isAnimating) {
      this.animationProgress += 0.05;
      if (this.animationProgress >= 1) {
        this.isAnimating = false;
      }
    }
    
    this.particles = this.particles.filter(p => {
      p.x += p.vx;
      p.y += p.vy;
      p.vy += 0.15;
      p.life -= 0.02;
      return p.life > 0;
    });
  }
  
  draw(ctx, cameraX, cameraY) {
    const screenX = this.x - cameraX;
    const screenY = this.y - cameraY;
    
    this.particles.forEach(p => {
      ctx.save();
      ctx.globalAlpha = p.life;
      ctx.fillStyle = p.color;
      ctx.beginPath();
      ctx.arc(p.x - cameraX, p.y - cameraY, p.size, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    });
    
    if (this.opened && !this.isAnimating) return;
    
    ctx.save();
    ctx.shadowColor = this.typeConfig.glowColor;
    ctx.shadowBlur = this.opened ? 30 : 15;
    
    const wobble = this.isAnimating ? Math.sin(this.animationProgress * Math.PI * 4) * 5 : 0;
    const scale = this.isAnimating ? 1 + Math.sin(this.animationProgress * Math.PI) * 0.2 : 1;
    
    ctx.translate(screenX, screenY);
    ctx.scale(scale, scale);
    ctx.rotate(wobble * Math.PI / 180);
    
    ctx.fillStyle = this.typeConfig.color;
    ctx.beginPath();
    ctx.roundRect(-25, -15, 50, 35, 5);
    ctx.fill();
    
    const lidAngle = this.opened ? -0.5 - this.animationProgress * 0.3 : 0;
    ctx.save();
    ctx.translate(0, -15);
    ctx.rotate(lidAngle);
    ctx.fillStyle = this.typeConfig.color;
    ctx.beginPath();
    ctx.roundRect(-25, -15, 50, 20, 5);
    ctx.fill();
    ctx.restore();
    
    ctx.strokeStyle = this.typeConfig.borderColor;
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(-25, 0);
    ctx.lineTo(25, 0);
    ctx.stroke();
    
    if (!this.opened) {
      ctx.fillStyle = '#ffd700';
      ctx.beginPath();
      ctx.arc(0, 5, 6, 0, Math.PI * 2);
      ctx.fill();
    }
    
    ctx.restore();
  }
}

// ============ 地图生成 ============
function generateMap() {
  gameMap = [];
  for (let y = 0; y < MAP_HEIGHT; y++) {
    gameMap[y] = [];
    for (let x = 0; x < MAP_WIDTH; x++) {
      const noise = Math.sin(x * 0.1) * Math.cos(y * 0.1) + Math.random() * 0.5;
      let tileType;
      if (noise < -0.3) {
        tileType = TILE_TYPES.WATER;
      } else if (noise < 0) {
        tileType = Math.random() > 0.7 ? TILE_TYPES.FOREST : TILE_TYPES.GRASS;
      } else if (noise < 0.3) {
        tileType = Math.random() > 0.8 ? TILE_TYPES.MOUNTAIN : TILE_TYPES.GRASS;
      } else if (noise < 0.5) {
        tileType = Math.random() > 0.5 ? TILE_TYPES.SAND : TILE_TYPES.GRASS;
      } else {
        tileType = Math.random() > 0.7 ? TILE_TYPES.SWAMP : TILE_TYPES.GRASS;
      }
      gameMap[y][x] = tileType;
    }
  }
  
  const centerX = Math.floor(MAP_WIDTH / 2);
  const centerY = Math.floor(MAP_HEIGHT / 2);
  for (let dy = -2; dy <= 2; dy++) {
    for (let dx = -2; dx <= 2; dx++) {
      const nx = centerX + dx;
      const ny = centerY + dy;
      if (nx >= 0 && nx < MAP_WIDTH && ny >= 0 && ny < MAP_HEIGHT) {
        gameMap[ny][nx] = TILE_TYPES.GRASS;
      }
    }
  }
}

// ============ 宝箱生成 ============
function generateChests() {
  chests = [];
  const chestCount = 15 + Math.floor(Math.random() * 10);
  
  for (let i = 0; i < chestCount; i++) {
    let attempts = 0;
    while (attempts < 50) {
      const x = Math.floor(Math.random() * MAP_WIDTH);
      const y = Math.floor(Math.random() * MAP_HEIGHT);
      
      if (gameMap[y] && gameMap[y][x] && gameMap[y][x].passable) {
        const worldX = x * TILE_SIZE + TILE_SIZE / 2;
        const worldY = y * TILE_SIZE + TILE_SIZE / 2;
        
        const distFromCenter = Math.sqrt(Math.pow(x - MAP_WIDTH/2, 2) + Math.pow(y - MAP_HEIGHT/2, 2));
        if (distFromCenter > 5) {
          let type;
          const roll = Math.random();
          if (distFromCenter > 20 && roll < 0.1) {
            type = 'LEGENDARY';
          } else if (distFromCenter > 15 && roll < 0.25) {
            type = 'RARE';
          } else if (distFromCenter > 8 && roll < 0.5) {
            type = 'FINE';
          } else {
            type = 'COMMON';
          }
          
          chests.push(new TreasureChest(worldX, worldY, type));
          break;
        }
      }
      attempts++;
    }
  }
  console.log(`[宝箱系统] 已生成 ${chests.length} 个宝箱`);
}

// ============ 修炼灵地生成 ============
function generateCultivationSites() {
  cultivationSites = [];
  const siteNames = ['青云', '紫霞', '玄月', '灵韵', '仙露', '悟道', '天机', '玄元', '紫府', '玉虚'];
  
  const types = Object.keys(CULTIVATION_SITE_TYPES);
  const totalSites = 6 + Math.floor(Math.random() * 4);
  let sitesGenerated = 0;
  
  for (let i = 0; i < totalSites; i++) {
    let attempts = 0;
    let generated = false;
    
    while (attempts < 100 && !generated) {
      const x = Math.floor(Math.random() * MAP_WIDTH);
      const y = Math.floor(Math.random() * MAP_HEIGHT);
      
      if (gameMap[y] && gameMap[y][x] && gameMap[y][x].passable) {
        const worldX = x * TILE_SIZE + TILE_SIZE / 2;
        const worldY = y * TILE_SIZE + TILE_SIZE / 2;
        
        const distFromCenter = Math.sqrt(Math.pow(x - MAP_WIDTH/2, 2) + Math.pow(y - MAP_HEIGHT/2, 2));
        
        let type;
        const roll = Math.random();
        if (distFromCenter > 20 && roll < 0.15) {
          type = 'LEGENDARY';
        } else if (distFromCenter > 15 && roll < 0.35) {
          type = 'RARE';
        } else if (distFromCenter > 10 && roll < 0.6) {
          type = 'FINE';
        } else {
          type = 'COMMON';
        }
        
        const typeConfig = CULTIVATION_SITE_TYPES[type];
        
        if (distFromCenter >= typeConfig.minDistance) {
          let tooClose = false;
          for (const existingSite of cultivationSites) {
            const distToExisting = Math.sqrt(
              Math.pow(worldX - existingSite.x, 2) + 
              Math.pow(worldY - existingSite.y, 2)
            );
            if (distToExisting < 150) {
              tooClose = true;
              break;
            }
          }
          
          if (!tooClose) {
            const typeCount = cultivationSites.filter(s => s.type === type).length;
            if (typeCount < typeConfig.maxCount) {
              const name = siteNames[sitesGenerated % siteNames.length] + typeConfig.typeName;
              const site = new SpiritSite(worldX, worldY, type, name);
              cultivationSites.push(site);
              sitesGenerated++;
              generated = true;
            }
          }
        }
      }
      attempts++;
    }
  }
  
  console.log(`[修炼灵地] 已生成 ${cultivationSites.length} 个灵地`);
  cultivationSites.forEach(site => {
    console.log(`  - ${site.name} [${site.typeConfig.tier}] 位置:(${Math.floor(site.x)},${Math.floor(site.y)}) 加成:x${site.typeConfig.expBonus}`);
  });
}

// ============ 玩家更新 ============
function updatePlayer() {
  let dx = 0;
  let dy = 0;
  
  if (keys.up) dy -= 1;
  if (keys.down) dy += 1;
  if (keys.left) dx -= 1;
  if (keys.right) dx += 1;
  
  if (touchController) {
    const movement = touchController.getMovement();
    if (Math.abs(movement.x) > 0.1 || Math.abs(movement.y) > 0.1) {
      dx = movement.x;
      dy = movement.y;
    }
  }
  
  if (dx !== 0 && dy !== 0) {
    const len = Math.sqrt(dx * dx + dy * dy);
    dx /= len;
    dy /= len;
  }
  
  const newX = player.x + dx * player.speed;
  const newY = player.y + dy * player.speed;
  
  const tileX = Math.floor(newX / TILE_SIZE);
  const tileY = Math.floor(newY / TILE_SIZE);
  
  if (tileX >= 0 && tileX < MAP_WIDTH && tileY >= 0 && tileY < MAP_HEIGHT) {
    const tile = gameMap[tileY][tileX];
    if (tile.passable) {
      player.x = newX;
      player.y = newY;
    }
  }
  
  player.x = Math.max(TILE_SIZE, Math.min(MAP_WIDTH * TILE_SIZE - TILE_SIZE, player.x));
  player.y = Math.max(TILE_SIZE, Math.min(MAP_HEIGHT * TILE_SIZE - TILE_SIZE, player.y));
  
  player.worldX = Math.floor(player.x / TILE_SIZE);
  player.worldY = Math.floor(player.y / TILE_SIZE);
  
  player.isMoving = dx !== 0 || dy !== 0;
  if (player.isMoving) {
    player.direction = Math.atan2(dy, dx);
    player.animationTimer += 0.15;
  }
  
  nearbyChest = null;
  for (const chest of chests) {
    if (!chest.opened && chest.checkInteraction(player.x, player.y)) {
      nearbyChest = chest;
      break;
    }
  }
  
  const chestHint = document.getElementById('chestHint');
  if (nearbyChest && !nearbyChest.opened) {
    chestHint.classList.add('show');
  } else {
    chestHint.classList.remove('show');
  }
  
  player.collisionCooldown = Math.max(0, player.collisionCooldown - 1);
  
  player.skills.forEach(skill => {
    if (skill.cooldown > 0) skill.cooldown -= 1/60;
  });
  
  if (player.shield > 0) {
    player.shield = Math.max(0, player.shield - 0.01);
  }
  
  // 修炼灵地检测和效果
  let prevSite = player.currentSite;
  player.currentSite = null;
  currentNearbySite = null;
  
  for (const site of cultivationSites) {
    site.update();
    if (site.checkPlayerInside(player.x, player.y)) {
      player.currentSite = site;
      currentNearbySite = site;
      
      // 灵力恢复
      if (player.spirit < player.maxSpirit) {
        player.spirit = Math.min(player.maxSpirit, player.spirit + site.typeConfig.spiritRegen / 60);
      }
      
      // 修炼获得经验
      if (Math.random() < 0.008) {
        const expGain = Math.floor(5 * site.typeConfig.expBonus);
        player.experience += expGain;
        
        const msgType = site.type === 'LEGENDARY' || site.type === 'RARE' ? 'site-rare' : 'site';
        addMessage(`在${site.name}修炼，获得 ${expGain} 修为 (x${site.typeConfig.expBonus})`, msgType);
        checkLevelUp();
      }
      break;
    }
  }
  
  // 更新灵地状态UI
  updateSiteStatusUI(prevSite);
}

// ============ 更新灵地状态UI ============
function updateSiteStatusUI(prevSite) {
  const siteStatus = document.getElementById('siteStatus');
  const currentSiteRow = document.getElementById('currentSiteRow');
  
  if (player.currentSite) {
    const site = player.currentSite;
    document.getElementById('siteStatusName').textContent = site.name;
    document.getElementById('siteStatusName').style.color = site.typeConfig.color;
    document.getElementById('siteStatusBonus').textContent = `修为加成: x${site.typeConfig.expBonus}`;
    siteStatus.style.borderColor = site.typeConfig.color;
    siteStatus.classList.add('show');
    
    currentSiteRow.style.display = 'flex';
    document.getElementById('currentSiteName').textContent = site.name;
    document.getElementById('currentSiteName').style.color = site.typeConfig.color;
    
    // 进入灵地提示
    if (prevSite !== player.currentSite) {
      const msgType = site.type === 'LEGENDARY' || site.type === 'RARE' ? 'site-rare' : 'site';
      addMessage(`进入修炼灵地【${site.name}】，修为加成 x${site.typeConfig.expBonus}`, msgType);
    }
  } else {
    siteStatus.classList.remove('show');
    currentSiteRow.style.display = 'none';
    
    // 离开灵地提示
    if (prevSite && !player.currentSite) {
      addMessage(`离开修炼灵地【${prevSite.name}】`, 'info');
    }
  }
}

// ============ 敌人更新 ============
function updateEnemies() {
  enemies.forEach(enemy => {
    const dx = player.x - enemy.x;
    const dy = player.y - enemy.y;
    const dist = Math.sqrt(dx * dx + dy * dy);
    
    if (dist < enemy.aggroRange && dist > 30) {
      enemy.x += (dx / dist) * enemy.speed;
      enemy.y += (dy / dist) * enemy.speed;
    }
    
    if (dist < 40 && enemy.attackCooldown <= 0) {
      let damage = enemy.damage;
      if (player.shield > 0) {
        const absorbed = Math.min(player.shield, damage);
        player.shield -= absorbed;
        damage -= absorbed;
      }
      if (damage > 0) {
        player.hp -= damage;
        addMessage(`被 ${enemy.name} 攻击，受到 ${damage} 点伤害`, 'loss');
      } else {
        addMessage(`护盾抵挡了 ${enemy.name} 的攻击`, 'info');
      }
      enemy.attackCooldown = 60;
      updateStatus();
    }
    
    if (enemy.attackCooldown > 0) enemy.attackCooldown--;
  });
}

// ============ 更新宝箱 ============
function updateChests() {
  chests.forEach(chest => chest.update());
}

// ============ 更新修炼灵地 ============
function updateCultivationSites() {
  cultivationSites.forEach(site => site.update());
}

// ============ 使用技能 ============
function useSkill(index) {
  if (index < 0 || index >= player.skills.length) return;
  
  const skill = player.skills[index];
  
  if (skill.cooldown > 0) {
    addMessage(`${skill.name} 冷却中...`, 'info');
    return;
  }
  
  if (player.spirit < skill.spiritCost) {
    addMessage('灵力不足！', 'loss');
    return;
  }
  
  player.spirit -= skill.spiritCost;
  skill.cooldown = skill.maxCooldown;
  
  switch(index) {
    case 0:
      const nearestEnemy0 = findNearestEnemy();
      if (nearestEnemy0) {
        nearestEnemy0.hp -= skill.damage + player.baseDamage;
        addMessage(`使用 ${skill.name}，造成 ${skill.damage + player.baseDamage} 点伤害`, 'gain');
        if (nearestEnemy0.hp <= 0) {
          killEnemy(nearestEnemy0);
        }
      } else {
        addMessage('附近没有敌人', 'info');
      }
      break;
    case 1:
      player.shield += skill.shield;
      addMessage(`使用 ${skill.name}，获得 ${skill.shield} 点护盾`, 'gain');
      break;
    case 2:
      const healAmount = Math.min(skill.heal, player.maxHp - player.hp);
      player.hp += healAmount;
      addMessage(`使用 ${skill.name}，恢复 ${healAmount} 点生命`, 'gain');
      break;
    case 3:
      const target = findNearestEnemy();
      if (target) {
        const damage = skill.damage + player.baseDamage * 2;
        target.hp -= damage;
        addMessage(`使用 ${skill.name}，造成 ${damage} 点伤害！`, 'gain');
        if (target.hp <= 0) {
          killEnemy(target);
        }
      } else {
        addMessage('附近没有敌人', 'info');
      }
      break;
  }
  
  updateStatus();
}

// ============ 查找最近敌人 ============
function findNearestEnemy() {
  let nearest = null;
  let nearestDist = Infinity;
  
  enemies.forEach(enemy => {
    const dist = Math.sqrt(Math.pow(player.x - enemy.x, 2) + Math.pow(player.y - enemy.y, 2));
    if (dist < player.attackRange && dist < nearestDist) {
      nearest = enemy;
      nearestDist = dist;
    }
  });
  
  return nearest;
}

// ============ 击杀敌人 ============
function killEnemy(enemy) {
  const index = enemies.indexOf(enemy);
  if (index > -1) {
    // 计算经验加成
    let expGain = enemy.expReward;
    if (player.currentSite) {
      expGain = Math.floor(expGain * player.currentSite.typeConfig.expBonus);
    }
    
    player.experience += expGain;
    player.money += enemy.moneyReward;
    addMessage(`击杀 ${enemy.name}，获得 ${expGain} 经验和 ${enemy.moneyReward} 灵石`, 'gain');
    enemies.splice(index, 1);
    
    if (Math.random() < 0.3) {
      setTimeout(() => {
        if (enemies.length < 15) {
          generateSingleEnemy();
        }
      }, 5000);
    }
    
    checkLevelUp();
    updateStatus();
  }
}

// ============ 生成单个敌人 ============
function generateSingleEnemy() {
  let attempts = 0;
  while (attempts < 30) {
    const x = Math.floor(Math.random() * MAP_WIDTH);
    const y = Math.floor(Math.random() * MAP_HEIGHT);
    
    if (gameMap[y] && gameMap[y][x] && gameMap[y][x].passable) {
      const worldX = x * TILE_SIZE + TILE_SIZE / 2;
      const worldY = y * TILE_SIZE + TILE_SIZE / 2;
      
      const distFromPlayer = Math.sqrt(Math.pow(worldX - player.x, 2) + Math.pow(worldY - player.y, 2));
      if (distFromPlayer > 300) {
        enemies.push({
          x: worldX,
          y: worldY,
          hp: 50 + Math.floor(Math.random() * 50),
          maxHp: 50 + Math.floor(Math.random() * 50),
          damage: 5 + Math.floor(Math.random() * 10),
          speed: 1 + Math.random(),
          name: ['野狼', '妖狐', '石精', '树妖', '怨灵'][Math.floor(Math.random() * 5)],
          expReward: 20 + Math.floor(Math.random() * 30),
          moneyReward: 10 + Math.floor(Math.random() * 20),
          aggroRange: 150,
          attackCooldown: 0
        });
        break;
      }
    }
    attempts++;
  }
}

// ============ 检查升级 ============
function checkLevelUp() {
  let newRealmIndex = player.realmIndex;
  
  for (let i = REALMS.length - 1; i >= 0; i--) {
    if (player.experience >= REALMS[i].expRequired) {
      newRealmIndex = i;
      break;
    }
  }
  
  if (newRealmIndex > player.realmIndex) {
    player.realmIndex = newRealmIndex;
    const newRealm = REALMS[newRealmIndex];
    player.maxHp += 20;
    player.hp = player.maxHp;
    player.maxSpirit += 10;
    player.spirit = player.maxSpirit;
    player.baseDamage += 5;
    addMessage(`突破成功！晋升为 ${newRealm.name}`, 'gain');
  }
}

// ============ 消息系统 ============
function addMessage(text, type = 'info') {
  const log = document.getElementById('messageLog');
  const msg = document.createElement('div');
  msg.className = `message ${type}`;
  msg.textContent = `[${new Date().toLocaleTimeString()}] ${text}`;
  log.appendChild(msg);
  log.scrollTop = log.scrollHeight;
  
  while (log.children.length > 50) {
    log.removeChild(log.firstChild);
  }
}

// ============ 更新状态面板 ============
function updateStatus() {
  const realm = REALMS[player.realmIndex];
  const nextRealm = REALMS[Math.min(player.realmIndex + 1, REALMS.length - 1)];
  
  document.getElementById('realmName').textContent = realm.name;
  document.getElementById('hpValue').textContent = `${Math.floor(player.hp)}/${player.maxHp}`;
  document.getElementById('hpFill').style.width = `${(player.hp / player.maxHp) * 100}%`;
  document.getElementById('spiritValue').textContent = `${Math.floor(player.spirit)}/${player.maxSpirit}`;
  document.getElementById('spiritFill').style.width = `${(player.spirit / player.maxSpirit) * 100}%`;
  
  const expProgress = ((player.experience - realm.expRequired) / (nextRealm.expRequired - realm.expRequired)) * 100;
  document.getElementById('expValue').textContent = `${Math.floor(player.experience)}/${nextRealm.expRequired}`;
  document.getElementById('expFill').style.width = `${Math.max(0, Math.min(100, expProgress))}%`;
  
  document.getElementById('moneyValue').textContent = player.money;
}

// ============ 更新物品栏 ============
function updateInventory() {
  const list = document.getElementById('inventoryList');
  list.innerHTML = '';
  
  if (player.inventory.length === 0) {
    list.innerHTML = '<div style="color: #888; padding: 10px; text-align: center;">储物袋空空如也</div>';
    return;
  }
  
  player.inventory.forEach((item, index) => {
    const div = document.createElement('div');
    div.className = 'inventory-item';
    div.innerHTML = `
      <span class="item-name">${item.name}</span>
      <div class="item-actions">
        <button class="item-btn" onclick="player.inventory[${index}].use()">使用</button>
        <button class="item-btn" onclick="player.inventory[${index}].sell()">出售</button>
      </div>
    `;
    list.appendChild(div);
  });
}

// ============ 绘制地图 ============
function drawMap() {
  const startX = Math.floor(camera.x / TILE_SIZE);
  const startY = Math.floor(camera.y / TILE_SIZE);
  const endX = Math.ceil((camera.x + canvas.width) / TILE_SIZE);
  const endY = Math.ceil((camera.y + canvas.height) / TILE_SIZE);
  
  for (let y = startY; y <= endY; y++) {
    for (let x = startX; x <= endX; x++) {
      if (x >= 0 && x < MAP_WIDTH && y >= 0 && y < MAP_HEIGHT) {
        const tile = gameMap[y][x];
        ctx.fillStyle = tile.color;
        ctx.fillRect(
          x * TILE_SIZE - camera.x,
          y * TILE_SIZE - camera.y,
          TILE_SIZE,
          TILE_SIZE
        );
        
        if (tile === TILE_TYPES.FOREST) {
          ctx.fillStyle = '#0d3d1a';
          ctx.beginPath();
          ctx.arc(
            x * TILE_SIZE - camera.x + TILE_SIZE / 2,
            y * TILE_SIZE - camera.y + TILE_SIZE / 2,
            8,
            0,
            Math.PI * 2
          );
          ctx.fill();
        } else if (tile === TILE_TYPES.WATER) {
          ctx.fillStyle = 'rgba(255, 255, 255, 0.1)';
          ctx.beginPath();
          ctx.arc(
            x * TILE_SIZE - camera.x + TILE_SIZE / 2 + Math.sin(Date.now() / 500 + x) * 3,
            y * TILE_SIZE - camera.y + TILE_SIZE / 2,
            5,
            0,
            Math.PI * 2
          );
          ctx.fill();
        }
      }
    }
  }
}

// ============ 绘制修炼灵地 ============
function drawCultivationSites() {
  cultivationSites.forEach(site => {
    site.draw(ctx, camera.x, camera.y);
  });
}

// ============ 绘制玩家 ============
function drawPlayer() {
  const screenX = player.x - camera.x;
  const screenY = player.y - camera.y;
  
  ctx.save();
  
  if (player.shield > 0) {
    ctx.strokeStyle = 'rgba(100, 200, 255, 0.6)';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.arc(screenX, screenY, 25, 0, Math.PI * 2);
    ctx.stroke();
  }
  
  // 在灵地内时显示光环
  if (player.currentSite) {
    ctx.strokeStyle = player.currentSite.typeConfig.color;
    ctx.lineWidth = 2;
    ctx.globalAlpha = 0.5 + Math.sin(Date.now() / 200) * 0.3;
    ctx.beginPath();
    ctx.arc(screenX, screenY, 28, 0, Math.PI * 2);
    ctx.stroke();
    ctx.globalAlpha = 1;
  }
  
  ctx.fillStyle = 'rgba(0, 0, 0, 0.3)';
  ctx.beginPath();
  ctx.ellipse(screenX, screenY + 15, 15, 8, 0, 0, Math.PI * 2);
  ctx.fill();
  
  ctx.fillStyle = '#ffd700';
  ctx.beginPath();
  ctx.arc(screenX, screenY, 18, 0, Math.PI * 2);
  ctx.fill();
  
  ctx.strokeStyle = 'rgba(255, 215, 0, 0.5)';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.arc(screenX, screenY, 22, 0, Math.PI * 2);
  ctx.stroke();
  
  const eyeOffsetX = Math.cos(player.direction) * 5;
  const eyeOffsetY = Math.sin(player.direction) * 5;
  ctx.fillStyle = '#1a1a2e';
  ctx.beginPath();
  ctx.arc(screenX + eyeOffsetX - 4, screenY + eyeOffsetY - 3, 3, 0, Math.PI * 2);
  ctx.arc(screenX + eyeOffsetX + 4, screenY + eyeOffsetY - 3, 3, 0, Math.PI * 2);
  ctx.fill();
  
  ctx.restore();
}

// ============ 绘制敌人 ============
function drawEnemies() {
  enemies.forEach(enemy => {
    const screenX = enemy.x - camera.x;
    const screenY = enemy.y - camera.y;
    
    ctx.fillStyle = 'rgba(0, 0, 0, 0.3)';
    ctx.beginPath();
    ctx.ellipse(screenX, screenY + 12, 12, 6, 0, 0, Math.PI * 2);
    ctx.fill();
    
    ctx.fillStyle = '#ff4757';
    ctx.beginPath();
    ctx.arc(screenX, screenY, 15, 0, Math.PI * 2);
    ctx.fill();
    
    ctx.fillStyle = '#ffffff';
    ctx.beginPath();
    ctx.arc(screenX - 4, screenY - 3, 3, 0, Math.PI * 2);
    ctx.arc(screenX + 4, screenY - 3, 3, 0, Math.PI * 2);
    ctx.fill();
    
    ctx.fillStyle = '#1a1a2e';
    ctx.beginPath();
    ctx.arc(screenX - 4, screenY - 3, 1.5, 0, Math.PI * 2);
    ctx.arc(screenX + 4, screenY - 3, 1.5, 0, Math.PI * 2);
    ctx.fill();
    
    const hpPercent = enemy.hp / enemy.maxHp;
    ctx.fillStyle = 'rgba(0, 0, 0, 0.5)';
    ctx.fillRect(screenX - 15, screenY - 25, 30, 5);
    ctx.fillStyle = hpPercent > 0.5 ? '#7cfc00' : hpPercent > 0.25 ? '#ffa500' : '#ff4757';
    ctx.fillRect(screenX - 15, screenY - 25, 30 * hpPercent, 5);
    
    ctx.fillStyle = '#e8d5b7';
    ctx.font = '10px Microsoft YaHei';
    ctx.textAlign = 'center';
    ctx.fillText(enemy.name, screenX, screenY - 30);
  });
}

// ============ 绘制宝箱 ============
function drawChests() {
  chests.forEach(chest => {
    chest.draw(ctx, camera.x, camera.y);
  });
}

// ============ 绘制小地图 ============
function drawMinimap() {
  minimapCtx.fillStyle = '#1a1a2e';
  minimapCtx.fillRect(0, 0, 150, 150);
  
  const scale = 150 / (MAP_WIDTH * TILE_SIZE);
  
  for (let y = 0; y < MAP_HEIGHT; y++) {
    for (let x = 0; x < MAP_WIDTH; x++) {
      minimapCtx.fillStyle = gameMap[y][x].color;
      minimapCtx.fillRect(x * 3, y * 3, 3, 3);
    }
  }
  
  // 绘制修炼灵地（按类型分颜色）
  cultivationSites.forEach(site => {
    site.drawMinimap(minimapCtx, scale);
  });
  
  // 绘制宝箱
  chests.forEach(chest => {
    if (!chest.opened) {
      minimapCtx.fillStyle = chest.typeConfig.color;
      minimapCtx.beginPath();
      minimapCtx.arc(chest.x * scale, chest.y * scale, 2, 0, Math.PI * 2);
      minimapCtx.fill();
    }
  });
  
  // 绘制敌人
  minimapCtx.fillStyle = '#ff4757';
  enemies.forEach(enemy => {
    minimapCtx.beginPath();
    minimapCtx.arc(enemy.x * scale, enemy.y * scale, 2, 0, Math.PI * 2);
    minimapCtx.fill();
  });
  
  // 绘制玩家
  minimapCtx.fillStyle = '#ffd700';
  minimapCtx.beginPath();
  minimapCtx.arc(player.x * scale, player.y * scale, 4, 0, Math.PI * 2);
  minimapCtx.fill();
  
  // 绘制视野范围
  minimapCtx.strokeStyle = 'rgba(255, 215, 0, 0.3)';
  minimapCtx.lineWidth = 1;
  minimapCtx.beginPath();
  minimapCtx.rect(
    camera.x * scale,
    camera.y * scale,
    canvas.width * scale,
    canvas.height * scale
  );
  minimapCtx.stroke();
  
  minimapCtx.strokeStyle = '#6b5b95';
  minimapCtx.lineWidth = 2;
  minimapCtx.strokeRect(0, 0, 150, 150);
}

// ============ 游戏主循环 ============
function gameLoop() {
  if (!gameStarted) {
    requestAnimationFrame(gameLoop);
    return;
  }
  
  updatePlayer();
  updateEnemies();
  updateChests();
  updateCultivationSites();
  camera.update();
  
  if (player.spirit < player.maxSpirit && !player.currentSite) {
    player.spirit = Math.min(player.maxSpirit, player.spirit + 0.02);
  }
  
  ctx.fillStyle = '#1a1a2e';
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  
  drawMap();
  drawCultivationSites();
  drawChests();
  drawEnemies();
  drawPlayer();
  drawMinimap();
  
  updateStatus();
  
  if (player.hp <= 0) {
    player.hp = player.maxHp;
    player.x = MAP_WIDTH * TILE_SIZE / 2;
    player.y = MAP_HEIGHT * TILE_SIZE / 2;
    player.money = Math.floor(player.money * 0.8);
    addMessage('你已陨落，损失了20%灵石...', 'loss');
    updateStatus();
  }
  
  requestAnimationFrame(gameLoop);
}

// ============ 加载游戏 ============
function loadGame() {
  const loadingBar = document.getElementById('loadingBar');
  const loadingScreen = document.getElementById('loadingScreen');
  
  const loadingSteps = [
    { progress: 10, message: '初始化天地灵气...' },
    { progress: 25, message: '生成地形地貌...' },
    { progress: 40, message: '布置修炼灵地...' },
    { progress: 55, message: '放置宝箱...' },
    { progress: 70, message: '生成妖兽...' },
    { progress: 85, message: '初始化玩家...' },
    { progress: 100, message: '准备完成！' }
  ];
  
  let stepIndex = 0;
  
  const loadStep = () => {
    if (stepIndex < loadingSteps.length) {
      const step = loadingSteps[stepIndex];
      loadingProgress = step.progress;
      loadingBar.style.width = `${loadingProgress}%`;
      console.log(`[加载] ${step.message}`);
      
      if (stepIndex === 1) generateMap();
      if (stepIndex === 2) generateCultivationSites();
      if (stepIndex === 3) generateChests();
      if (stepIndex === 4) generateEnemies();
      if (stepIndex === 5) {
        player.x = MAP_WIDTH * TILE_SIZE / 2;
        player.y = MAP_HEIGHT * TILE_SIZE / 2;
        setupInput();
        touchController = new TouchController();
      }
      
      stepIndex++;
      setTimeout(loadStep, 300);
    } else {
      setTimeout(() => {
        loadingScreen.classList.add('hidden');
        gameStarted = true;
        addMessage('欢迎来到修仙世界！使用WASD或方向键移动，E键交互。', 'info');
        addMessage('地图上散落着各种宝箱，靠近后按E键开启获得奖励！', 'chest');
        addMessage('寻找修炼灵地可获得修为加成，按F键查看灵地详情。', 'site');
        updateInventory();
        updateStatus();
      }, 500);
    }
  };
  
  loadStep();
}

// ============ 窗口大小调整 ============
window.addEventListener('resize', () => {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
});

// ============ 启动游戏 ============
window.addEventListener('load', () => {
  console.log('[系统] 修仙沙盘游戏启动');
  loadGame();
  gameLoop();
});
</script>
