// ==================== 战斗日志系统 ====================
const battleLog = {
  maxLogs: 50,
  
  add(message, type = 'normal') {
    const logDiv = document.getElementById('battleLog');
    const entry = document.createElement('div');
    entry.className = `log-entry ${type}`;
    entry.textContent = `[${new Date().toLocaleTimeString()}] ${message}`;
    logDiv.appendChild(entry);
    logDiv.scrollTop = logDiv.scrollHeight;
    
    // 限制日志数量
    while (logDiv.children.length > this.maxLogs) {
      logDiv.removeChild(logDiv.children[1]);
    }
  }
};

// 获取怪物模板
function getMonsterTemplate(templateId) {
  return MONSTER_DATABASE[templateId] || null;
}

// 获取所有怪物模板
function getAllMonsterTemplates() {
  return Object.values(MONSTER_DATABASE);
}

// 按类型获取怪物模板
function getMonsterTemplatesByType(type) {
  return Object.values(MONSTER_DATABASE).filter(m => m.type === type);
}

// ==================== 怪物AI系统 ====================

// AI状态枚举
const AIState = {
  IDLE: 'idle',
  PATROL: 'patrol',
  CHASE: 'chase',
  ATTACK: 'attack',
  SKILL: 'skill',
  FLEE: 'flee',
  RETURN: 'return'
};

// 怪物类
class Monster {
  constructor(templateId, x, y, levelModifier = 0) {
    const template = getMonsterTemplate(templateId);
    if (!template) {
      throw new Error(`Monster template "${templateId}" not found`);
    }
    
    // 生成唯一ID
    this.id = `${templateId}_${Date.now()}_${Math.random().toString(36).substr(2, 9)}`;
    this.templateId = templateId;
    this.name = template.name;
    this.type = template.type;
    this.description = template.description;
    this.behavior = template.behavior;
    this.detectionRange = template.detectionRange || 150;
    this.attackRange = template.attackRange || 40;
    this.skills = template.skills || [];
    this.special = template.special || null;
    this.phases = template.phases || null;
    this.currentPhase = 0;
    
    // 计算等级（可以有一定浮动）
    this.level = template.level + levelModifier;
    
    // 计算属性（根据等级可能有修正）
    const levelMultiplier = 1 + levelModifier * 0.1;
    this.maxHp = Math.floor(template.baseStats.hp * levelMultiplier);
    this.hp = this.maxHp;
    this.baseAttack = Math.floor(template.baseStats.attack * levelMultiplier);
    this.attack = this.baseAttack;
    this.baseDefense = Math.floor(template.baseStats.defense * levelMultiplier);
    this.defense = this.baseDefense;
    this.speed = template.baseStats.speed;
    this.critRate = template.baseStats.critRate;
    this.critDamage = template.baseStats.critDamage;
    
    // 经验和金钱奖励
    this.exp = Math.floor(template.exp * levelMultiplier);
    this.moneyMin = Math.floor(template.money[0] * levelMultiplier);
    this.moneyMax = Math.floor(template.money[1] * levelMultiplier);
    
    // 掉落物配置
    this.dropConfig = template.drops;
    
    // 视觉属性
    const typeConfig = MonsterTypeConfig[this.type];
    this.color = template.color || typeConfig.color;
    const baseSize = 32;
    this.width = baseSize * typeConfig.sizeMultiplier;
    this.height = baseSize * typeConfig.sizeMultiplier;
    
    // 位置
    this.x = x;
    this.y = y;
    this.spawnX = x;
    this.spawnY = y;
    
    // 状态
    this.alive = true;
    this.target = null;
    this.aiState = AIState.IDLE;
    this.lastAttackTime = 0;
    this.attackCooldown = 1000;
    
    // AI相关
    this.patrolTarget = null;
    this.patrolTimer = 0;
    this.patrolInterval = 3000;
    this.stateTimer = 0;
    
    // 技能冷却
    this.skillCooldowns = {};
    this.lastSkillTime = {};
    
    // 临时增益/减益
    this.tempBuffs = {};
    this.tempDebuffs = {};
    
    // 动画相关
    this.animationFrame = 0;
    this.animationTimer = 0;
    
    // 特殊标记
    this.hasRevived = false; // 用于凤凰复活
    
    // 视觉效果
    this.skillEffects = [];
  }
  
  // 受到伤害
  takeDamage(damage, attacker) {
    const actualDamage = Math.max(1, damage - this.defense);
    this.hp = Math.max(0, this.hp - actualDamage);
    
    // 被攻击后进入追击状态
    if (this.behavior !== 'passive' || this.hp < this.maxHp * 0.5) {
      this.aiState = AIState.CHASE;
    }
    
    if (this.hp <= 0) {
      // 检查是否有重生技能
      if (this.skills.includes('重生') && !this.hasRevived) {
        this.hasRevived = true;
        this.hp = Math.floor(this.maxHp * 0.3);
        battleLog.add(`${this.name} 涅槃重生！`, 'boss');
        showFloatingText('涅槃重生！', this.x + this.width / 2, this.y, '#FF4500');
        this.skillEffects.push({
          type: 'revive',
          x: this.x,
          y: this.y,
          duration: 60,
          timer: 0
        });
        return {
          died: false,
          damage: actualDamage,
          currentHp: this.hp,
          maxHp: this.maxHp,
          revived: true
        };
      }
      
      this.alive = false;
      return {
        died: true,
        damage: actualDamage,
        drops: this.generateDrops(),
        exp: this.exp,
        money: this.getRandomMoney()
      };
    }
    
    return {
      died: false,
      damage: actualDamage,
      currentHp: this.hp,
      maxHp: this.maxHp
    };
  }
  
  // 攻击目标
  attackTarget(target) {
    const now = Date.now();
    if (now - this.lastAttackTime < this.attackCooldown) {
      return null;
    }
    
    this.lastAttackTime = now;
    this.aiState = AIState.ATTACK;
    
    let damage = this.attack + (this.tempBuffs.attack || 0);
    let isCrit = false;
    
    // 暴击判定
    if (Math.random() < this.critRate) {
      damage = Math.floor(damage * this.critDamage);
      isCrit = true;
    }
    
    return {
      damage: damage,
      isCrit: isCrit,
      attacker: this.name,
      type: 'normal'
    };
  }
  
  // 使用技能
  useSkill(skillName, target) {
    const skill = MonsterSkills[skillName];
    if (!skill) return null;
    
    const now = Date.now();
    if (this.skillCooldowns[skillName] && now < this.skillCooldowns[skillName]) {
      return null;
    }
    
    // 设置冷却
    this.skillCooldowns[skillName] = now + skill.cooldown;
    this.aiState = AIState.SKILL;
    
    // 添加技能视觉效果
    this.skillEffects.push({
      type: 'skill',
      name: skillName,
      x: this.x,
      y: this.y,
      duration: 30,
      timer: 0
    });
    
    return skill.effect(this, target);
  }
  
  // 选择要使用的技能
  selectSkill() {
    if (this.skills.length === 0) return null;
    
    const now = Date.now();
    const availableSkills = this.skills.filter(skillName => {
      const skill = MonsterSkills[skillName];
      if (!skill || skill.type === 'passive') return false;
      return !this.skillCooldowns[skillName] || now >= this.skillCooldowns[skillName];
    });
    
    if (availableSkills.length === 0) return null;
    
    // 根据怪物类型选择技能策略
    if (this.type === MonsterType.BOSS) {
      return this.selectBossSkill(availableSkills);
    } else if (this.type === MonsterType.ELITE) {
      return this.selectEliteSkill(availableSkills);
    }
    
    // 普通怪随机选择
    return availableSkills[Math.floor(Math.random() * availableSkills.length)];
  }
  
  // BOSS技能选择策略
  selectBossSkill(availableSkills) {
    const hpPercent = (this.hp / this.maxHp) * 100;
    
    // 血量低时优先使用恢复技能
    if (hpPercent < 50 && availableSkills.includes('涅槃之火')) {
      return '涅槃之火';
    }
    if (hpPercent < 30 && availableSkills.includes('噬魂')) {
      return '噬魂';
    }
    
    // 根据阶段选择技能
    if (this.phases) {
      for (let i = this.phases.length - 1; i >= 0; i--) {
        if (hpPercent <= this.phases[i].hpPercent) {
          // 在这个阶段，使用更激进的技能
          const attackSkills = availableSkills.filter(s => {
            const skill = MonsterSkills[s];
            return skill && (skill.type === 'attack' || skill.type === 'aoe' || skill.type === 'breath');
          });
          if (attackSkills.length > 0 && Math.random() > 0.3) {
            return attackSkills[Math.floor(Math.random() * attackSkills.length)];
          }
          break;
        }
      }
    }
    
    // 随机选择
    return availableSkills[Math.floor(Math.random() * availableSkills.length)];
  }
  
  // 精英怪技能选择策略
  selectEliteSkill(availableSkills) {
    // 精英怪有更高概率使用攻击技能
    if (Math.random() < 0.6) {
      const attackSkills = availableSkills.filter(s => {
        const skill = MonsterSkills[s];
        return skill && (skill.type === 'attack' || skill.type === 'dot');
      });
      if (attackSkills.length > 0) {
        return attackSkills[Math.floor(Math.random() * attackSkills.length)];
      }
    }
    
    return availableSkills[Math.floor(Math.random() * availableSkills.length)];
  }
  
  // 更新阶段
  updatePhase() {
    if (!this.phases) return;
    
    const hpPercent = (this.hp / this.maxHp) * 100;
    
    for (let i = this.phases.length - 1; i >= 0; i--) {
      if (hpPercent <= this.phases[i].hpPercent) {
        if (this.currentPhase !== i) {
          this.currentPhase = i;
          const phase = this.phases[i];
          
          // 应用阶段增益
          this.attack = Math.floor(this.baseAttack * (1 + (phase.attackBonus || 0)));
          this.defense = Math.floor(this.baseDefense * (1 + (phase.defenseBonus || 0)));
          
          battleLog.add(`${this.name} 进入第${i + 1}阶段！`, 'boss');
          showFloatingText(`第${i + 1}阶段！`, this.x + this.width / 2, this.y - 30, '#FFD700');
          
          // 添加阶段转换视觉效果
          this.skillEffects.push({
            type: 'phase_change',
            x: this.x,
            y: this.y,
            duration: 60,
            timer: 0
          });
        }
        break;
      }
    }
  }
  
  // 生成掉落物
  generateDrops() {
    const drops = [];
    for (const dropEntry of this.dropConfig) {
      if (Math.random() < dropEntry.rate) {
        drops.push({
          ...dropEntry.item,
          quantity: 1
        });
      }
    }
    return drops;
  }
  
  // 获取随机金钱
  getRandomMoney() {
    return Math.floor(Math.random() * (this.moneyMax - this.moneyMin + 1)) + this.moneyMin;
  }
  
  // 更新AI
  updateAI(playerX, playerY, player, deltaTime) {
    if (!this.alive) return;
    
    const dx = playerX - this.x;
    const dy = playerY - this.y;
    const distance = Math.sqrt(dx * dx + dy * dy);
    
    // 更新阶段（BOSS）
    this.updatePhase();
    
    // 更新临时增益持续时间
    this.updateBuffs(deltaTime);
    
    // 根据怪物类型执行不同的AI逻辑
    switch (this.type) {
      case MonsterType.BOSS:
        this.updateBossAI(playerX, playerY, player, distance, dx, dy, deltaTime);
        break;
      case MonsterType.ELITE:
        this.updateEliteAI(playerX, playerY, player, distance, dx, dy, deltaTime);
        break;
      default:
        this.updateNormalAI(playerX, playerY, player, distance, dx, dy, deltaTime);
    }
    
    // 更新技能效果
    this.updateSkillEffects();
  }
  
  // 普通怪AI
  updateNormalAI(playerX, playerY, player, distance, dx, dy, deltaTime) {
    // 普通怪：简单追击和攻击
    
    if (this.behavior === 'aggressive') {
      if (distance < this.detectionRange) {
        this.aiState = AIState.CHASE;
        
        if (distance > this.attackRange) {
          // 追击
          const moveX = (dx / distance) * this.speed * 0.5;
          const moveY = (dy / distance) * this.speed * 0.5;
          this.x += moveX;
          this.y += moveY;
        }
      } else {
        // 返回出生点
        this.aiState = AIState.RETURN;
        const returnDx = this.spawnX - this.x;
        const returnDy = this.spawnY - this.y;
        const returnDist = Math.sqrt(returnDx * returnDx + returnDy * returnDy);
        
        if (returnDist > 10) {
          this.x += (returnDx / returnDist) * this.speed * 0.3;
          this.y += (returnDy / returnDist) * this.speed * 0.3;
        } else {
          this.aiState = AIState.IDLE;
        }
      }
    } else if (this.behavior === 'passive') {
      // 被动怪：只在被攻击或很近时才有反应
      if (distance < 50 || this.hp < this.maxHp) {
        this.aiState = AIState.CHASE;
        
        if (distance > this.attackRange) {
          const moveX = (dx / distance) * this.speed * 0.4;
          const moveY = (dy / distance) * this.speed * 0.4;
          this.x += moveX;
          this.y += moveY;
        }
      } else {
        // 巡逻
        this.updatePatrol(deltaTime);
      }
    }
  }
  
  // 精英怪AI
  updateEliteAI(playerX, playerY, player, distance, dx, dy, deltaTime) {
    // 精英怪：更聪明的追击，会使用技能
    
    if (distance < this.detectionRange || this.hp < this.maxHp) {
      this.aiState = AIState.CHASE;
      
      // 尝试使用技能
      if (Math.random() < 0.02) {
        const selectedSkill = this.selectSkill();
        if (selectedSkill && distance < 150) {
          const skillResult = this.useSkill(selectedSkill, player);
          if (skillResult) {
            this.applySkillEffect(skillResult, player, distance);
            return;
          }
        }
      }
      
      // 普通追击
      if (distance > this.attackRange) {
        // 使用更智能的移动方式
        const moveSpeed = this.speed * 0.6;
        const moveX = (dx / distance) * moveSpeed;
        const moveY = (dy / distance) * moveSpeed;
        this.x += moveX;
        this.y += moveY;
      }
    } else {
      // 巡逻
      this.updatePatrol(deltaTime);
    }
  }
  
  // BOSS AI
  updateBossAI(playerX, playerY, player, distance, dx, dy, deltaTime) {
    // BOSS：复杂的行为模式，多阶段，多技能
    
    // BOSS总是追击玩家
    this.aiState = AIState.CHASE;
    
    // 更频繁地尝试使用技能
    if (Math.random() < 0.05) {
      const selectedSkill = this.selectSkill();
      if (selectedSkill) {
        const skill = MonsterSkills[selectedSkill];
        const skillRange = skill.range || 200;
        
        if (distance < skillRange) {
          const skillResult = this.useSkill(selectedSkill, player);
          if (skillResult) {
            this.applySkillEffect(skillResult, player, distance);
            return;
          }
        }
      }
    }
    
    // 追击移动
    if (distance > this.attackRange) {
      const phase = this.phases ? this.phases[this.currentPhase] : null;
      const speedMultiplier = phase ? (1 + (phase.attackBonus || 0) * 0.5) : 1;
      const moveSpeed = this.speed * 0.7 * speedMultiplier;
      
      const moveX = (dx / distance) * moveSpeed;
      const moveY = (dy / distance) * moveSpeed;
      this.x += moveX;
      this.y += moveY;
    }
  }
  
  // 应用技能效果
  applySkillEffect(skillResult, player, distance) {
    if (!skillResult) return;
    
    switch (skillResult.type) {
      case 'damage':
      case 'aoe':
        // 直接伤害在碰撞检测中处理
        break;
      case 'lifesteal':
        // 吸血
        if (skillResult.healPercent) {
          const heal = Math.floor(skillResult.damage * skillResult.healPercent);
          this.hp = Math.min(this.maxHp, this.hp + heal);
          showFloatingText(`+${heal}`, this.x + this.width / 2, this.y, '#00FF00');
        }
        break;
      case 'buff':
        // 增益已在技能效果中处理
        break;
      case 'debuff':
        // 减益效果应用到玩家
        if (player && skillResult.stat && skillResult.value) {
          player.applyDebuff(skillResult.stat, skillResult.value, skillResult.duration || 3000);
        }
        break;
      case 'stun':
        // 眩晕效果
        if (player) {
          player.applyStun(skillResult.duration || 2000);
        }
        break;
    }
  }
  
  // 更新巡逻
  updatePatrol(deltaTime) {
    this.patrolTimer += deltaTime;
    
    if (!this.patrolTarget || this.patrolTimer > this.patrolInterval) {
      // 设置新的巡逻目标
      this.patrolTimer = 0;
      const patrolRadius = 100;
      this.patrolTarget = {
        x: this.spawnX + (Math.random() - 0.5) * patrolRadius * 2,
        y: this.spawnY + (Math.random() - 0.5) * patrolRadius * 2
      };
      this.aiState = AIState.PATROL;
    }
    
    if (this.patrolTarget) {
      const dx = this.patrolTarget.x - this.x;
      const dy = this.patrolTarget.y - this.y;
      const dist = Math.sqrt(dx * dx + dy * dy);
      
      if (dist > 5) {
        this.x += (dx / dist) * this.speed * 0.2;
        this.y += (dy / dist) * this.speed * 0.2;
      } else {
        this.patrolTarget = null;
        this.aiState = AIState.IDLE;
      }
    }
  }
  
  // 更新增益效果
  updateBuffs(deltaTime) {
    // 简化处理，临时增益会在一定时间后消失
    for (const buff in this.tempBuffs) {
      // 这里可以添加持续时间逻辑
    }
  }
  
  // 更新技能效果（视觉）
  updateSkillEffects() {
    for (let i = this.skillEffects.length - 1; i >= 0; i--) {
      this.skillEffects[i].timer++;
      if (this.skillEffects[i].timer >= this.skillEffects[i].duration) {
        this.skillEffects.splice(i, 1);
      }
    }
  }
  
  // 更新位置（兼容旧接口）
  update(playerX, playerY, deltaTime) {
    // 这个方法现在由 MonsterManager 调用 updateAI
    this.updateAI(playerX, playerY, null, deltaTime);
    
    // 边界检测
    this.x = Math.max(0, Math.min(canvas.width - this.width, this.x));
    this.y = Math.max(0, Math.min(canvas.height - this.height, this.y));
    
    // 更新动画
    this.animationTimer++;
    if (this.animationTimer >= 15) {
      this.animationTimer = 0;
      this.animationFrame = (this.animationFrame + 1) % 4;
    }
  }
  
  // 获取信息摘要
  getInfo() {
    return {
      id: this.id,
      name: this.name,
      type: this.type,
      typeName: MonsterTypeConfig[this.type].name,
      level: this.level,
      hp: this.hp,
      maxHp: this.maxHp,
      hpPercent: Math.floor((this.hp / this.maxHp) * 100),
      attack: this.attack,
      defense: this.defense,
      exp: this.exp,
      alive: this.alive,
      description: this.description,
      aiState: this.aiState,
      phase: this.currentPhase + 1
    };
  }
  
  // 绘制技能效果
  drawSkillEffects(ctx) {
    this.skillEffects.forEach(effect => {
      const progress = effect.timer / effect.duration;
      
      switch (effect.type) {
        case 'skill':
          // 技能释放效果
          ctx.save();
          ctx.globalAlpha = 1 - progress;
          ctx.strokeStyle = '#FFD700';
          ctx.lineWidth = 3;
          ctx.beginPath();
          ctx.arc(
            this.x + this.width / 2,
            this.y + this.height / 2,
            this.width * (1 + progress),
            0,
            Math.PI * 2
          );
          ctx.stroke();
          ctx.restore();
          break;
          
        case 'phase_change':
          // 阶段转换效果
          ctx.save();
          ctx.globalAlpha = 1 - progress;
          ctx.fillStyle = '#FF4500';
          for (let i = 0; i < 8; i++) {
            const angle = (Math.PI * 2 / 8) * i + progress * Math.PI;
            const radius = this.width * 1.5 * progress;
            const px = this.x + this.width / 2 + Math.cos(angle) * radius;
            const py = this.y + this.height / 2 + Math.sin(angle) * radius;
            ctx.beginPath();
            ctx.arc(px, py, 5, 0, Math.PI * 2);
            ctx.fill();
          }
          ctx.restore();
          break;
          
        case 'revive':
          // 复活效果
          ctx.save();
          ctx.globalAlpha = 1 - progress;
          ctx.strokeStyle = '#FF4500';
          ctx.lineWidth = 5;
          const reviveRadius = this.width * (0.5 + progress);
          ctx.beginPath();
          ctx.arc(
            this.x + this.width / 2,
            this.y + this.height / 2,
            reviveRadius,
            0,
            Math.PI * 2
          );
          ctx.stroke();
          
          // 火焰效果
          for (let i = 0; i < 12; i++) {
            const angle = (Math.PI * 2 / 12) * i;
            const flameHeight = 20 * (1 - progress);
            const fx = this.x + this.width / 2 + Math.cos(angle) * reviveRadius;
            const fy = this.y + this.height / 2 + Math.sin(angle) * reviveRadius;
            ctx.fillStyle = `rgba(255, ${100 + Math.random() * 100}, 0, ${1 - progress})`;
            ctx.beginPath();
            ctx.moveTo(fx, fy);
            ctx.lineTo(fx + Math.cos(angle) * flameHeight, fy + Math.sin(angle) * flameHeight - 10);
            ctx.lineTo(fx + Math.cos(angle + 0.3) * flameHeight * 0.5, fy + Math.sin(angle + 0.3) * flameHeight * 0.5);
            ctx.closePath();
            ctx.fill();
          }
          ctx.restore();
          break;
      }
    });
  }
}

// 怪物管理器
class MonsterManager {
  constructor() {
    this.monsters = [];
    this.maxMonsters = 10;
    this.spawnCooldown = 0;
    this.spawnInterval = 5000;
    this.currentFilter = 'all';
  }
  
  // 添加怪物
  addMonster(templateId, x, y, levelModifier = 0) {
    if (this.monsters.length >= this.maxMonsters) {
      console.log('已达到怪物数量上限');
      return null;
    }
    
    try {
      const monster = new Monster(templateId, x, y, levelModifier);
      this.monsters.push(monster);
      this.updateMonsterPanel();
      
      // 显示怪物出现信息
      const typeConfig = MonsterTypeConfig[monster.type];
      battleLog.add(`${typeConfig.name}怪物 ${monster.name} 出现了！`, monster.type === 'boss' ? 'boss' : 'monster');
      
      return monster;
    } catch (error) {
      console.error('创建怪物失败:', error.message);
      return null;
    }
  }
  
  // 移除怪物
  removeMonster(monsterId) {
    const index = this.monsters.findIndex(m => m.id === monsterId);
    if (index !== -1) {
      this.monsters.splice(index, 1);
      this.updateMonsterPanel();
      return true;
    }
    return false;
  }
  
  // 获取活着的怪物
  getAliveMonsters() {
    return this.monsters.filter(m => m.alive);
  }
  
  // 按类型筛选怪物
  getMonstersByType(type) {
    return this.monsters.filter(m => m.type === type);
  }
  
  // 更新所有怪物
  update(playerX, playerY, playerObj, deltaTime) {
    this.monsters.forEach(monster => {
      monster.updateAI(playerX, playerY, playerObj, deltaTime);
      
      // 边界检测
      monster.x = Math.max(0, Math.min(canvas.width - monster.width, monster.x));
      monster.y = Math.max(0, Math.min(canvas.height - monster.height, monster.y));
      
      // 更新动画
      monster.animationTimer++;
      if (monster.animationTimer >= 15) {
        monster.animationTimer = 0;
        monster.animationFrame = (monster.animationFrame + 1) % 4;
      }
    });
    
    // 清理死亡的怪物（延迟清理以便显示死亡效果）
    this.monsters = this.monsters.filter(m => m.alive);
  }
  
  // 绘制所有怪物
  draw(ctx) {
    this.monsters.forEach(monster => {
      if (!monster.alive) return;
      
      const typeConfig = MonsterTypeConfig[monster.type];
      
      // 绘制怪物主体
      ctx.save();
      
      // 根据怪物类型绘制不同形状
      if (monster.type === MonsterType.BOSS) {
        // BOSS绘制为六边形
        ctx.fillStyle = monster.color;
        ctx.beginPath();
        const cx = monster.x + monster.width / 2;
        const cy = monster.y + monster.height / 2;
        const r = monster.width / 2;
        for (let i = 0; i < 6; i++) {
          const angle = (Math.PI / 3) * i - Math.PI / 6;
          const px = cx + r * Math.cos(angle);
          const py = cy + r * Math.sin(angle);
          if (i === 0) ctx.moveTo(px, py);
          else ctx.lineTo(px, py);
        }
        ctx.closePath();
        ctx.fill();
        
        // BOSS光环效果
        ctx.strokeStyle = 'rgba(255, 215, 0, 0.5)';
        ctx.lineWidth = 3;
        ctx.stroke();
        
        // 阶段指示器
        if (monster.phases) {
          const phaseColors = ['#4CAF50', '#FFC107', '#F44336'];
          ctx.fillStyle = phaseColors[Math.min(monster.currentPhase, phaseColors.length - 1)];
          ctx.beginPath();
          ctx.arc(cx + r * 0.7, cy - r * 0.7, 6, 0, Math.PI * 2);
          ctx.fill();
        }
      } else if (monster.type === MonsterType.ELITE) {
        // 精英怪绘制为菱形
        ctx.fillStyle = monster.color;
        ctx.beginPath();
        const cx = monster.x + monster.width / 2;
        const cy = monster.y + monster.height / 2;
        ctx.moveTo(cx, monster.y);
        ctx.lineTo(monster.x + monster.width, cy);
        ctx.lineTo(cx, monster.y + monster.height);
        ctx.lineTo(monster.x, cy);
        ctx.closePath();
        ctx.fill();
        
        // 精英怪边框
        ctx.strokeStyle = 'rgba(75, 0, 130, 0.8)';
        ctx.lineWidth = 2;
        ctx.stroke();
      } else {
        // 普通怪绘制为圆形
        ctx.fillStyle = monster.color;
        ctx.beginPath();
        ctx.arc(
          monster.x + monster.width / 2,
          monster.y + monster.height / 2,
          monster.width / 2,
          0,
          Math.PI * 2
        );
        ctx.fill();
      }
      
      // 绘制眼睛
      ctx.fillStyle = 'white';
      const eyeOffset = monster.width * 0.15;
      const eyeSize = monster.width * 0.1;
      ctx.beginPath();
      ctx.arc(monster.x + monster.width / 2 - eyeOffset, monster.y + monster.height / 2 - eyeOffset, eyeSize, 0, Math.PI * 2);
      ctx.arc(monster.x + monster.width / 2 + eyeOffset, monster.y + monster.height / 2 - eyeOffset, eyeSize, 0, Math.PI * 2);
      ctx.fill();
      
      ctx.fillStyle = 'black';
      ctx.beginPath();
      ctx.arc(monster.x + monster.width / 2 - eyeOffset, monster.y + monster.height / 2 - eyeOffset, eyeSize * 0.5, 0, Math.PI * 2);
      ctx.arc(monster.x + monster.width / 2 + eyeOffset, monster.y + monster.height / 2 - eyeOffset, eyeSize * 0.5, 0, Math.PI * 2);
      ctx.fill();
      
      ctx.restore();
      
      // 绘制技能效果
      monster.drawSkillEffects(ctx);
      
      // 绘制血条
      this.drawHealthBar(ctx, monster);
      
      // 绘制名称和状态
      ctx.fillStyle = monster.type === MonsterType.BOSS ? '#FFD700' : 
                      monster.type === MonsterType.ELITE ? '#9C27B0' : '#ffffff';
      ctx.font = monster.type === MonsterType.BOSS ? 'bold 14px Microsoft YaHei' : '12px Microsoft YaHei';
      ctx.textAlign = 'center';
      
      let nameText = `${monster.name} Lv.${monster.level}`;
      if (monster.type === MonsterType.BOSS && monster.phases) {
        nameText += ` [P${monster.currentPhase + 1}]`;
      }
      ctx.fillText(nameText, monster.x + monster.width / 2, monster.y - 8);
      
      // 绘制AI状态指示器
      if (monster.aiState !== AIState.IDLE) {
        ctx.font = '10px Microsoft YaHei';
        ctx.fillStyle = monster.aiState === AIState.CHASE ? '#FF0000' : 
                       monster.aiState === AIState.ATTACK ? '#FFA500' :
                       monster.aiState === AIState.SKILL ? '#00FFFF' : '#888';
        const stateText = monster.aiState === AIState.CHASE ? '追击' :
                         monster.aiState === AIState.ATTACK ? '攻击' :
                         monster.aiState === AIState.SKILL ? '技能' :
                         monster.aiState === AIState.PATROL ? '巡逻' : '';
        ctx.fillText(stateText, monster.x + monster.width / 2, monster.y + monster.height + 12);
      }
    });
  }
  
  // 绘制血条
  drawHealthBar(ctx, monster) {
    const barWidth = monster.width;
    const barHeight = 4;
    const barX = monster.x;
    const barY = monster.y - 5;
    
    // 背景
    ctx.fillStyle = '#333';
    ctx.fillRect(barX, barY, barWidth, barHeight);
    
    // 血量
    const hpPercent = monster.hp / monster.maxHp;
    const typeConfig = MonsterTypeConfig[monster.type];
    ctx.fillStyle = typeConfig.hpBarColor;
    ctx.fillRect(barX, barY, barWidth * hpPercent, barHeight);
    
    // 边框
    ctx.strokeStyle = '#000';
    ctx.lineWidth = 1;
    ctx.strokeRect(barX, barY, barWidth, barHeight);
  }
  
  // 更新怪物面板
  updateMonsterPanel() {
    const monsterListDiv = document.getElementById('monsterList');
    if (!monsterListDiv) return;
    
    let filteredMonsters = this.monsters;
    if (this.currentFilter !== 'all') {
      filteredMonsters = this.monsters.filter(m => m.type === this.currentFilter);
    }
    
    if (filteredMonsters.length === 0) {
      monsterListDiv.innerHTML = '<div style="color: #999; font-size: 12px;">暂无怪物</div>';
      return;
    }
    
    monsterListDiv.innerHTML = filteredMonsters.map(monster => {
      const info = monster.getInfo();
      const typeConfig = MonsterTypeConfig[monster.type];
      return `
        <div class="monster-info ${monster.type}">
          <div style="font-weight: bold;">${info.name} <span style="color: #666;">Lv.${info.level}</span></div>
          <div style="font-size: 10px; color: #888;">[${typeConfig.name}] ${info.description}</div>
          <div style="margin-top: 3px;">
            <span style="color: #e74c3c;">HP: ${info.hp}/${info.maxHp}</span>
            <span style="color: #3498db; margin-left: 8px;">ATK: ${info.attack}</span>
            <span style="color: #9b59b6; margin-left: 8px;">DEF: ${info.defense}</span>
          </div>
          <div class="monster-hp-bar">
            <div class="monster-hp-fill" style="width: ${info.hpPercent}%; background: ${typeConfig.hpBarColor};"></div>
          </div>
          <div style="font-size: 10px; color: #f1c40f; margin-top: 3px;">
            掉落: ${info.exp}经验 | 状态: ${info.aiState}
            ${monster.type === 'boss' ? `| 阶段: ${info.phase}` : ''}
          </div>
        </div>
      `;
    }).join('');
  }
  
  // 设置筛选器
  setFilter(filterType) {
    this.currentFilter = filterType;
    this.updateMonsterPanel();
    
    // 更新按钮状态
    const buttons = document.querySelectorAll('#monsterTypeFilter button');
    buttons.forEach(btn => {
      btn.classList.remove('active');
      if (btn.textContent.includes(
        filterType === 'all' ? '全部' : 
        filterType === 'normal' ? '普通' : 
        filterType === 'elite' ? '精英' : 'BOSS'
      )) {
        btn.classList.add('active');
      }
    });
  }
  
  // 自动生成怪物
  autoSpawn() {
    if (this.monsters.length < this.maxMonsters) {
      const templates = Object.keys(MONSTER_DATABASE);
      const randomTemplate = templates[Math.floor(Math.random() * templates.length)];
      
      // 随机位置（避开玩家）
      let x, y;
      do {
        x = Math.random() * (canvas.width - 100) + 50;
        y = Math.random() * (canvas.height - 100) + 50;
      } while (
        Math.abs(x - player.x) < 150 && Math.abs(y - player.y) < 150
      );
      
      // 根据怪物类型调整生成概率
      const template = MONSTER_DATABASE[randomTemplate];
      let spawnChance = 1;
      if (template.type === MonsterType.ELITE) spawnChance = 0.3;
      if (template.type === MonsterType.BOSS) spawnChance = 0.1;
      
      if (Math.random() < spawnChance) {
        this.addMonster(randomTemplate, x, y);
      }
    }
  }
}

const player = {
  x: 100,
  y: 100,
  width: 32,
  height: 32,
  speed: 5,
  baseSpeed: 5,
  level: 1,
  experience: 0,
  experienceToLevel: 100,
  money: 100,
  hp: 100,
  maxHp: 100,
  attack: 10,
  defense: 5,
  baseAttack: 10,
  baseDefense: 5,
  skills: [],
  inventory: [],
  animationFrame: 0,
  animationFrames: 3,
  animationSpeed: 10,
  frameWidth: 32,
  frameHeight: 32,
  
  // 状态效果
  debuffs: [],
  stunEndTime: 0,
  dotEffects: [],
  
  // 应用减益效果
  applyDebuff(stat, value, duration) {
    this.debuffs.push({
      stat: stat,
      value: value,
      endTime: Date.now() + duration
    });
    
    // 立即应用减益
    if (stat === 'attack') {
      this.attack = Math.floor(this.baseAttack * value);
    } else if (stat === 'defense') {
      this.defense = Math.floor(this.baseDefense * value);
    } else if (stat === 'speed') {
      this.speed = this.baseSpeed * value;
    }
    
    battleLog.add(`玩家受到${stat}降低效果！`, 'monster');
    showFloatingText(`${stat}↓`, player.x, player.y - 20, '#FF00FF');
  },
  
  // 应用眩晕
  applyStun(duration) {
    this.stunEndTime = Date.now() + duration;
    battleLog.add(`玩家被眩晕！`, 'monster');
    showFloatingText('眩晕!', player.x, player.y - 20, '#FF0000');
  },
  
  // 应用持续伤害
  applyDot(damage, duration) {
    this.dotEffects.push({
      damage: damage,
      endTime: Date.now() + duration,
      lastTick: Date.now()
    });
    battleLog.add(`玩家受到持续伤害效果！`, 'monster');
  },
  
  // 更新状态效果
  updateEffects() {
    const now = Date.now();
    
    // 清理过期的减益
    this.debuffs = this.debuffs.filter(d => {
      if (now >= d.endTime) {
        // 恢复属性
        if (d.stat === 'attack') {
          this.attack = this.baseAttack;
        } else if (d.stat === 'defense') {
          this.defense = this.baseDefense;
        } else if (d.stat === 'speed') {
          this.speed = this.baseSpeed;
        }
        return false;
      }
      return true;
    });
    
    // 处理持续伤害
    this.dotEffects = this.dotEffects.filter(dot => {
      if (now >= dot.endTime) {
        return false;
      }
      
      // 每秒造成伤害
      if (now - dot.lastTick >= 1000) {
        dot.lastTick = now;
        this.hp -= dot.damage;
        showFloatingText(`-${dot.damage}`, player.x + player.width / 2, player.y, '#FF6600');
        updateStatus();
      }
      
      return true;
    });
  },
  
  // 检查是否眩晕
  isStunned() {
    return Date.now() < this.stunEndTime;
  }
};

      }

// 更新玩家位置
function updatePlayerPosition() {
  // 检查眩晕状态
  if (player.isStunned()) {
    return false;
  }
  
  let moved = false;
  
  if (keys['ArrowUp'] || keys['KeyW']) {
    player.y = Math.max(0, player.y - player.speed);
    moved = true;
  }
  if (keys['ArrowDown'] || keys['KeyS']) {
    player.y = Math.min(canvas.height - player.height, player.y + player.speed);
    moved = true;
  }
  if (keys['ArrowLeft'] || keys['KeyA']) {
    player.x = Math.max(0, player.x - player.speed);
    moved = true;
  }
  if (keys['ArrowRight'] || keys['KeyD']) {
    player.x = Math.min(canvas.width - player.width, player.x + player.speed);
    moved = true;
  }
  
  return moved;
}

// 检测玩家与怪物的碰撞
function checkPlayerMonsterCollision() {
  const aliveMonsters = monsterManager.getAliveMonsters();
  
  for (const monster of aliveMonsters) {
    if (
      player.x < monster.x + monster.width &&
      player.x + player.width > monster.x &&
      player.y < monster.y + monster.height &&
      player.y + player.height > monster.y
    ) {
      // 碰撞发生，玩家受到伤害
      const attackResult = monster.attackTarget(player);
      if (attackResult) {
        // 计算实际伤害（考虑玩家防御和减益）
        let playerDef = player.defense;
        const defDebuff = player.debuffs.find(d => d.stat === 'defense');
        if (defDebuff) {
          playerDef = Math.floor(player.baseDefense * defDebuff.value);
        }
        
        const actualDamage = Math.max(1, attackResult.damage - playerDef);
        player.hp -= actualDamage;
        
        // 显示伤害
        const damageText = `-${actualDamage}${attackResult.isCrit ? '!' : ''}`;
        showFloatingText(damageText, player.x + player.width / 2, player.y, '#ff0000');
        battleLog.add(`${monster.name} 对玩家造成 ${actualDamage} 伤害${attackResult.isCrit ? '(暴击!)' : ''}`, 'monster');
        
        // 推开玩家
        const dx = player.x - monster.x;
        const dy = player.y - monster.y;
        const dist = Math.sqrt(dx * dx + dy * dy) || 1;
        player.x += (dx / dist) * 20;
        player.y += (dy / dist) * 20;
        
        // 边界检测
        player.x = Math.max(0, Math.min(canvas.width - player.width, player.x));
        player.y = Math.max(0, Math.min(canvas.height - player.height, player.y));
        
        // 检查玩家是否死亡
        if (player.hp <= 0) {
          player.hp = player.maxHp;
          player.money = Math.floor(player.money * 0.9);
          player.x = canvas.width / 2;
          player.y = canvas.height / 2;
          battleLog.add('玩家被击败，损失10%金币！', 'monster');
          showFloatingText('你被击败了！', canvas.width / 2, canvas.height / 2, '#ff0000');
          
          // 清除所有效果
          player.debuffs = [];
          player.dotEffects = [];
          player.stunEndTime = 0;
          player.attack = player.baseAttack;
          player.defense = player.baseDefense;
          player.speed = player.baseSpeed;
          
          updateStatus();
        }
        
        updateStatus();
      }
    }
  }
}

// 浮动文字效果
const floatingTexts = [];

function showFloatingText(text, x, y, color) {
  floatingTexts.push({
    text: text,
    x: x,
    y: y,
    color: color,
    alpha: 1,
    vy: -2
  });
}

function updateFloatingTexts() {
  for (let i = floatingTexts.length - 1; i >= 0; i--) {
    const ft = floatingTexts[i];
    ft.y += ft.vy;
    ft.alpha -= 0.02;
    
    if (ft.alpha <= 0) {
      floatingTexts.splice(i, 1);
    }
  }
}

function drawFloatingTexts() {
  floatingTexts.forEach(ft => {
    ctx.save();
    ctx.globalAlpha = ft.alpha;
    ctx.fillStyle = ft.color;
    ctx.font = 'bold 16px Microsoft YaHei';
    ctx.textAlign = 'center';
    ctx.fillText(ft.text, ft.x, ft.y);
    ctx.restore();
  });
}

// 攻击怪物
function attackNearestMonster() {
  const aliveMonsters = monsterManager.getAliveMonsters();
  if (aliveMonsters.length === 0) {
    battleLog.add('周围没有怪物', 'player');
    return;
  }
  
  // 找到最近的怪物
  let nearestMonster = null;
  let nearestDistance = Infinity;
  
  for (const monster of aliveMonsters) {
    const dx = monster.x - player.x;
    const dy = monster.y - player.y;
    const distance = Math.sqrt(dx * dx + dy * dy);
    
    if (distance < nearestDistance && distance < 100) {
      nearestDistance = distance;
      nearestMonster = monster;
    }
  }
  
  if (nearestMonster) {
    // 计算伤害（考虑玩家攻击减益）
    let playerAtk = player.attack;
    const atkDebuff = player.debuffs.find(d => d.stat === 'attack');
    if (atkDebuff) {
      playerAtk = Math.floor(player.baseAttack * atkDebuff.value);
    }
    
    const damage = playerAtk;
    const result = nearestMonster.takeDamage(damage, player);
    
    showFloatingText(`-${result.damage}`, nearestMonster.x + nearestMonster.width / 2, nearestMonster.y, '#ffff00');
    battleLog.add(`玩家对 ${nearestMonster.name} 造成 ${result.damage} 伤害`, 'player');
    
    if (result.died) {
      // 怪物死亡
      player.experience += result.exp;
      player.money += result.money;
      
      showFloatingText(`+${result.exp}经验 +${result.money}金币`, nearestMonster.x, nearestMonster.y, '#00ff00');
      battleLog.add(`${nearestMonster.name} 被击败！获得 ${result.exp} 经验, ${result.money} 金币`, 'player');
      
      // 处理掉落物
      if (result.drops.length > 0) {
        result.drops.forEach(drop => {
          addItem(new Item(drop.name, drop.value, drop.type));
          showFloatingText(`获得 ${drop.name}`, nearestMonster.x, nearestMonster.y + 20, '#ffcc00');
          battleLog.add(`获得物品: ${drop.name}`, 'player');
        });
      }
      
      // 检查升级
      while (player.experience >= player.experienceToLevel) {
        player.experience -= player.experienceToLevel;
        player.level++;
        player.experienceToLevel = Math.floor(player.experienceToLevel * 1.5);
        player.maxHp += 20;
        player.hp = player.maxHp;
        player.baseAttack += 5;
        player.attack = player.baseAttack;
        player.baseDefense += 2;
        player.defense = player.baseDefense;
        showFloatingText(`升级! 等级 ${player.level}`, canvas.width / 2, canvas.height / 2, '#ffd700');
        battleLog.add(`玩家升级到 ${player.level} 级！`, 'player');
      }
      
      updateStatus();
      monsterManager.updateMonsterPanel();
    } else if (result.revived) {
      // 怪物复活
      battleLog.add(`${nearestMonster.name} 涅槃重生！`, 'boss');
    }
  } else {
    battleLog.add('没有在攻击范围内的怪物', 'player');
  }
}

// 修炼功能
function meditate() {
  player.experience += 10;
  showFloatingText('+10经验', player.x, player.y, '#00ffff');
  battleLog.add('玩家修炼，获得10经验', 'player');
  
  if (player.experience >= player.experienceToLevel) {
    player.experience -= player.experienceToLevel;
    player.level++;
    player.experienceToLevel = Math.floor(player.experienceToLevel * 1.5);
    player.maxHp += 20;
    player.hp = player.maxHp;
    player.baseAttack += 5;
    player.attack = player.baseAttack;
    player.baseDefense += 2;
    player.defense = player.baseDefense;
    showFloatingText(`升级! 等级 ${player.level}`, player.x, player.y, '#ffd700');
    battleLog.add(`玩家升级到 ${player.level} 级！`, 'player');
  }
  updateStatus();
}

// 使用技能
function useSkill() {
  attackNearestMonster();
}

// 交易系统
function trade() {
  const gold = prompt('请输入交易金币数量：');
  const goldNumber = parseInt(gold, 10);
  if (!isNaN(goldNumber) && player.money >= goldNumber) {
    player.money -= goldNumber;
    updateStatus();
    battleLog.add(`玩家交易，消耗${goldNumber}金币`, 'player');
  } else {
    alert('交易失败：金币不足或输入非法！');
  }
}

// 生成随机怪物
function spawnRandomMonster() {
  const templates = Object.keys(MONSTER_DATABASE);
  const randomTemplate = templates[Math.floor(Math.random() * templates.length)];
  
  let x, y;
  do {
    x = Math.random() * (canvas.width - 100) + 50;
    y = Math.random() * (canvas.height - 100) + 50;
  } while (
    Math.abs(x - player.x) < 100 && Math.abs(y - player.y) < 100
  );
  
  const monster = monsterManager.addMonster(randomTemplate, x, y);
  if (monster) {
    showFloatingText(`${monster.name} 出现了!`, x, y - 20, '#ffffff');
  }
}

// 按类型生成怪物
function spawnMonsterByType(type) {
  const templates = getMonsterTemplatesByType(type);
  if (templates.length === 0) return;
  
  const randomTemplate = templates[Math.floor(Math.random() * templates.length)];
  
  let x, y;
  do {
    x = Math.random() * (canvas.width - 100) + 50;
    y = Math.random() * (canvas.height - 100) + 50;
  } while (
    Math.abs(x - player.x) < 100 && Math.abs(y - player.y) < 100
  );
  
  const monster = monsterManager.addMonster(randomTemplate.id, x, y);
  if (monster) {
    showFloatingText(`${monster.name} 出现了!`, x, y - 20, '#ffffff');
  }
}

// 筛选怪物
function filterMonsters(type) {
  monsterManager.setFilter(type);
}

// 更新状态信息
function updateStatus() {
  const statusDiv = document.getElementById('status');
  statusDiv.innerHTML = `玩家等级：${player.level}，经验：${player.experience}/${player.experienceToLevel}，金币：${player.money}<br>生命：${player.hp}/${player.maxHp}，攻击：${player.attack}，防御：${player.defense}`;
}

// 更新物品列表
function updateInventory() {
  const inventoryDiv = document.getElementById('inventory');
  inventoryDiv.innerHTML = '';
  
  // 添加金币显示
  const goldDiv = document.createElement('div');
  goldDiv.className = 'item';
  goldDiv.textContent = `金币：${player.money}`;
  inventoryDiv.appendChild(goldDiv);
  
  // 添加物品
  player.inventory.forEach(item => {
    const itemDiv = document.createElement('div');
    itemDiv.className = 'item';
    itemDiv.textContent = `${item.name}（售价：${item.cost}金币）`;
    itemDiv.onclick = () => {
      if (confirm(`确定要出售 ${item.name} 吗？`)) {
        item.sell();
        battleLog.add(`出售 ${item.name}，获得 ${item.cost} 金币`, 'player');
      }
    };
    inventoryDiv.appendChild(itemDiv);
  });
}

// 添加物品到库存
function addItem(item) {
  player.inventory.push(item);
  updateInventory();
}

// ==================== 输入处理 ====================

// 键盘事件
document.addEventListener('keydown', (e) => {
  keys[e.code] = true;
  
  // 空格键攻击
  if (e.code === 'Space') {
    e.preventDefault();
    attackNearestMonster();
  }
});

document.addEventListener('keyup', (e) => {
  keys[e.code] = false;
});

// ==================== 游戏循环 ====================

let lastTime = 0;
let autoSpawnTimer = 0;

function gameLoop(timestamp) {
  const deltaTime = timestamp - lastTime;
  lastTime = timestamp;
  
  // 清空画布
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  
  // 绘制地图
  drawMap();
  
  // 更新玩家状态效果
  player.updateEffects();
  
  // 更新玩家位置
  updatePlayerPosition();
  
  // 更新怪物
  monsterManager.update(player.x, player.y, player, deltaTime);
  
  // 绘制怪物
  monsterManager.draw(ctx);
  
  // 绘制玩家
  drawPlayer();
  
  // 更新玩家动画
  updatePlayerAnimation();
  
  // 检测碰撞
  checkPlayerMonsterCollision();
  
  // 更新和绘制浮动文字
  updateFloatingTexts();
  drawFloatingTexts();
  
  // 自动生成怪物
  autoSpawnTimer += deltaTime;
  if (autoSpawnTimer > 10000) {
    autoSpawnTimer = 0;
    monsterManager.autoSpawn();
  }
  
  // 更新怪物面板（定期刷新）
  if (Math.floor(timestamp / 1000) !== Math.floor((timestamp - deltaTime) / 1000)) {
    monsterManager.updateMonsterPanel();
  }
  
  requestAnimationFrame(gameLoop);
}

// ==================== 初始化 ====================

// 初始化游戏
window.onload = () => {
  updateStatus();
  updateInventory();
  
  // 添加初始物品
  addItem(new Item('丹药', 10));
  addItem(new Item('法宝', 50));
  
  // 生成一些初始怪物
  monsterManager.addMonster('wolf', 300, 200);
  monsterManager.addMonster('bat', 500, 300);
  monsterManager.addMonster('slime', 200, 400);
  
  // 生成一个精英怪
  monsterManager.addMonster('elite_wolf', 600, 150);
  
  // 更新怪物面板
  monsterManager.updateMonsterPanel();
  
  // 开始游戏循环
  requestAnimationFrame(gameLoop);
  
  console.log('修仙沙盘游戏初始化完成！');
  console.log('可用的怪物模板:', Object.keys(MONSTER_DATABASE));
  console.log('操作说明：WASD或方向键移动，空格键攻击');
  console.log('怪物AI系统已启用：普通怪、精英怪、BOSS各有不同的战斗逻辑');
  
  battleLog.add('游戏开始！使用WASD移动，空格键攻击', 'player');
};
