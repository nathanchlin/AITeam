<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>修仙沙盘游戏</title>
<style>
  body {
    margin: 0;
    overflow: hidden;
  }
  canvas {
    display: block;
  }
  #status {
    position: absolute;
    top: 10px;
    left: 10px;
    background: rgba(255, 255, 255, 0.8);
    padding: 5px;
    border-radius: 5px;
  }
  #actions {
    position: absolute;
    top: 10px;
    right: 10px;
    background: rgba(255, 255, 255, 0.8);
    padding: 5px;
    border-radius: 5px;
  }
</style>
</head>
<body>
<canvas id="gameCanvas"></canvas>
<div id="status">玩家等级：1，经验：0</div>
<div id="actions">
  <button onclick="meditate()">修炼</button>
  <button onclick="useSkill()">使用技能</button>
</div>
<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const scale = 32;
canvas.width = 800;
canvas.height = 600;

// 玩家对象
const player = {
  x: 100,
  y: 100,
  width: 32,
  height: 32,
  speed: 5,
  level: 1,
  experience: 0,
  skills: []
};

// 怪物对象
const monster = {
  x: 300,
  y: 300,
  width: 32,
  height: 32,
  health: 100
};

// 绘制玩家
function drawPlayer() {
  ctx.fillStyle = 'blue';
  ctx.fillRect(player.x, player.y, player.width, player.height);
}

// 绘制怪物
function drawMonster() {
  ctx.fillStyle = 'red';
  ctx.fillRect(monster.x, monster.y, monster.width, monster.height);
}

// 绘制地图
function drawMap() {
  for (let y = 0; y < canvas.height; y += scale) {
    for (let x = 0; x < canvas.width; x += scale) {
      ctx.fillStyle = 'green';
      ctx.fillRect(x, y, scale, scale);
    }
  }
}

// 更新玩家位置
function updatePlayerPosition() {
  const keys = {
    ArrowUp: { direction: 'up', step: -player.speed },
    ArrowDown: { direction: 'down', step: player.speed },
    ArrowLeft: { direction: 'left', step: -player.speed },
    ArrowRight: { direction: 'right', step: player.speed }
  };

  Object.keys(keys).forEach(key => {
    window.addEventListener(key, (e) => {
      if (keys[key].direction === 'up' && player.y > 0) {
        player.y += keys[key].step;
      } else if (keys[key].direction === 'down' && player.y < canvas.height - player.height) {
        player.y += keys[key].step;
      } else if (keys[key].direction === 'left' && player.x > 0) {
        player.x += keys[key].step;
      } else if (keys[key].direction === 'right' && player.x < canvas.width - player.width) {
        player.x += keys[key].step;
      }
    });
  });
}

// 修炼功能
function meditate() {
  player.experience += 10; // 假设每次修炼获得10点经验
  if (player.experience >= 100) {
    player.level++;
    player.experience -= 100;
    updateStatus();
  }
  updateStatus();
}

// 使用技能
function useSkill() {
  if (player.skills.length > 0) {
    const skill = player.skills[0]; // 使用第一个技能
    skill.use(monster);
  }
  updateStatus();
}

// 技能类
class Skill {
  constructor(name, damage) {
    this.name = name;
    this.damage = damage;
  }

  use(target) {
    target.health -= this.damage;
    console.log(`${this.name} used on monster! Monster health: ${target.health}`);
  }
}

// 更新状态信息
function updateStatus() {
  const statusDiv = document.getElementById('status');
  statusDiv.textContent = `玩家等级：${player.level}，经验：${player.experience}`;
}

// 初始化技能
player.skills.push(new Skill('火焰术', 20));

// 游戏循环
function gameLoop() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  drawMap();
  drawPlayer();
  drawMonster();
  requestAnimationFrame(gameLoop);
}

// 初始化游戏
window.onload = () => {
  updatePlayerPosition();
  gameLoop();
};
</script>
</body>
</html>
