<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>坦克大战</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #2c3e50;
            font-family: 'Arial', sans-serif;
        }
        
        #gameContainer {
            position: relative;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.5);
        }
        
        canvas {
            background-color: #34495e;
            border: 2px solid #ecf0f1;
        }
        
        #gameInfo {
            position: absolute;
            top: 10px;
            left: 10px;
            color: white;
            font-size: 16px;
            background-color: rgba(0, 0, 0, 0.5);
            padding: 10px;
            border-radius: 5px;
        }
        
        #gameOver {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background-color: rgba(0, 0, 0, 0.8);
            color: white;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
            display: none;
        }
        
        button {
            background-color: #3498db;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            margin-top: 10px;
        }
        
        button:hover {
            background-color: #2980b9;
        }
    </style>
</head>
<body>
    <div id="gameContainer">
        <canvas id="gameCanvas" width="800" height="600"></canvas>
        <div id="gameInfo">
            <div>生命值: <span id="playerHealth">100</span></div>
            <div>得分: <span id="score">0</span></div>
        </div>
        <div id="gameOver">
            <h2 id="gameOverText">游戏结束</h2>
            <p>最终得分: <span id="finalScore">0</span></p>
            <button id="restartBtn">重新开始</button>
        </div>
    </div>

    <script>
        // 游戏常量
        const CANVAS_WIDTH = 800;
        const CANVAS_HEIGHT = 600;
        const TANK_SIZE = 30;
        const BULLET_SIZE = 5;
        const TANK_SPEED = 3;
        const BULLET_SPEED = 5;
        const ENEMY_SPAWN_RATE = 2000; // 每2秒生成一个敌人
        
        // 获取canvas和上下文
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        
        // 游戏状态
        let gameRunning = true;
        let score = 0;
        let lastEnemySpawn = 0;
        
        // 键盘状态
        const keys = {};
        
        // 游戏对象
        class Tank {
            constructor(x, y, color, isPlayer = false) {
                this.x = x;
                this.y = y;
                this.color = color;
                this.width = TANK_SIZE;
                this.height = TANK_SIZE;
                this.speed = isPlayer ? TANK_SPEED : TANK_SPEED * 0.7;
                this.isPlayer = isPlayer;
                this.health = isPlayer ? 100 : 30;
                this.direction = isPlayer ? 0 : Math.random() * Math.PI * 2;
                this.lastShot = 0;
                this.shootCooldown = isPlayer ? 500 : 1000;
            }
            
            update() {
                if (this.isPlayer) {
                    // 玩家控制
                    if (keys['ArrowUp'] || keys['w']) {
                        this.y -= this.speed;
                        this.direction = -Math.PI / 2;
                    }
                    if (keys['ArrowDown'] || keys['s']) {
                        this.y += this.speed;
                        this.direction = Math.PI / 2;
                    }
                    if (keys['ArrowLeft'] || keys['a']) {
                        this.x -= this.speed;
                        this.direction = Math.PI;
                    }
                    if (keys['ArrowRight'] || keys['d']) {
                        this.x += this.speed;
                        this.direction = 0;
                    }
                    
                    // 边界检查
                    this.x = Math.max(this.width / 2, Math.min(CANVAS_WIDTH - this.width / 2, this.x));
                    this.y = Math.max(this.height / 2, Math.min(CANVAS_HEIGHT - this.height / 2, this.y));
                } else {
                    // AI控制
                    this.direction += (Math.random() - 0.5) * 0.1;
                    
                    // 移动
                    this.x += Math.cos(this.direction) * this.speed;
                    this.y += Math.sin(this.direction) * this.speed;
                    
                    // 边界反弹
                    if (this.x < this.width / 2 || this.x > CANVAS_WIDTH - this.width / 2) {
                        this.direction = Math.PI - this.direction;
                    }
                    if (this.y < this.height / 2 || this.y > CANVAS_HEIGHT - this.height / 2) {
                        this.direction = -this.direction;
                    }
                    
                    // 确保在边界内
                    this.x = Math.max(this.width / 2, Math.min(CANVAS_WIDTH - this.width / 2, this.x));
                    this.y = Math.max(this.height / 2, Math.min(CANVAS_HEIGHT - this.height / 2, this.y));
                }
            }
            
            draw() {
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.rotate(this.direction);
                
                // 绘制坦克主体
                ctx.fillStyle = this.color;
                ctx.fillRect(-this.width / 2, -this.height / 2, this.width, this.height);
                
                // 绘制炮管
                ctx.fillStyle = this.isPlayer ? '#2ecc71' : '#e74c3c';
                ctx.fillRect(this.width / 2 - 5, -5, this.width / 2 + 5, 10);
                
                // 绘制生命值条
                if (!this.isPlayer) {
                    ctx.restore();
                    ctx.fillStyle = 'red';
                    ctx.fillRect(this.x - this.width / 2, this.y - this.height / 2 - 10, this.width * (this.health / 30), 5);
                    ctx.strokeStyle = 'white';
                    ctx.strokeRect(this.x - this.width / 2, this.y - this.height / 2 - 10, this.width, 5);
                } else {
                    ctx.restore();
                }
            }
            
            shoot() {
                const now = Date.now();
                if (now - this.lastShot > this.shootCooldown) {
                    this.lastShot = now;
                    return new Bullet(
                        this.x + Math.cos(this.direction) * this.width,
                        this.y + Math.sin(this.direction) * this.height,
                        this.direction,
                        this.isPlayer
                    );
                }
                return null;
            }
            
            takeDamage(damage) {
                this.health -= damage;
                return this.health <= 0;
            }
        }
        
        class Bullet {
            constructor(x, y, direction, isPlayerBullet) {
                this.x = x;
                this.y = y;
                this.direction = direction;
                this.radius = BULLET_SIZE;
                this.speed = BULLET_SPEED;
                this.isPlayerBullet = isPlayerBullet;
            }
            
            update() {
                this.x += Math.cos(this.direction) * this.speed;
                this.y += Math.sin(this.direction) * this.speed;
            }
            
            draw() {
                ctx.fillStyle = this.isPlayerBullet ? '#f1c40f' : '#e74c3c';
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fill();
            }
            
            isOutOfBounds() {
                return this.x < 0 || this.x > CANVAS_WIDTH || 
                       this.y < 0 || this.y > CANVAS_HEIGHT;
            }
        }
        
        class Base {
            constructor(x, y, color) {
                this.x = x;
                this.y = y;
                this.width = 40;
                this.height = 40;
                this.color = color;
                this.health = 100;
            }
            
            draw() {
                // 绘制基地
                ctx.fillStyle = this.color;
                ctx.fillRect(this.x - this.width / 2, this.y - this.height / 2, this.width, this.height);
                
                // 绘制基地生命值条
                ctx.fillStyle = 'red';
                ctx.fillRect(this.x - this.width / 2, this.y - this.height / 2 - 10, this.width * (this.health / 100), 5);
                ctx.strokeStyle = 'white';
                ctx.strokeRect(this.x - this.width / 2, this.y - this.height / 2 - 10, this.width, 5);
            }
            
            takeDamage(damage) {
                this.health -= damage;
                return this.health <= 0;
            }
        }
        
        // 游戏对象实例
        const player = new Tank(CANVAS_WIDTH / 2, CANVAS_HEIGHT - 50, '#3498db', true);
        const enemyBase = new Base(CANVAS_WIDTH / 2, 50, '#e74c3c');
        const playerBase = new Base(CANVAS_WIDTH / 2, CANVAS_HEIGHT - 50, '#3498db');
        
        let enemies = [];
        let bullets = [];
        
        // 游戏循环
        function gameLoop(timestamp) {
            if (!gameRunning) return;
            
            // 清空画布
            ctx.clearRect(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);
            
            // 生成敌人
            if (timestamp - lastEnemySpawn > ENEMY_SPAWN_RATE) {
                const x = Math.random() * (CANVAS_WIDTH - TANK_SIZE) + TANK_SIZE / 2;
                enemies.push(new Tank(x, 50, '#e74c3c', false));
                lastEnemySpawn = timestamp;
            }
            
            // 更新和绘制玩家
            player.update();
            player.draw();
            
            // 更新和绘制基地
            enemyBase.draw();
            playerBase.draw();
            
            // 更新和绘制敌人
            enemies = enemies.filter(enemy => {
                enemy.update();
                enemy.draw();
                
                // 敌人射击
                const bullet = enemy.shoot();
                if (bullet) {
                    bullets.push(bullet);
                }
                
                return true;
            });
            
            // 更新和绘制子弹
            bullets = bullets.filter(bullet => {
                bullet.update();
                bullet.draw();
                
                // 检查子弹是否击中玩家
                if (!bullet.isPlayerBullet && 
                    Math.abs(bullet.x - player.x) < (player.width + bullet.radius) / 2 &&
                    Math.abs(bullet.y - player.y) < (player.height + bullet.radius) / 2) {
                    
                    if (player.takeDamage(10)) {
                        gameOver(false);
                    }
                    updateUI();
                    return false;
                }
                
                // 检查子弹是否击中敌人
                if (bullet.isPlayerBullet) {
                    for (let i = 0; i < enemies.length; i++) {
                        if (Math.abs(bullet.x - enemies[i].x) < (enemies[i].width + bullet.radius) / 2 &&
                            Math.abs(bullet.y - enemies[i].y) < (enemies[i].height + bullet.radius) / 2) {
                            
                            if (enemies[i].takeDamage(30)) {
                                score += 100;
                                updateUI();
                                enemies.splice(i, 1);
                            }
                            return false;
                        }
                    }
                    
                    // 检查是否击中敌方基地
                    if (Math.abs(bullet.x - enemyBase.x) < (enemyBase.width + bullet.radius) / 2 &&
                        Math.abs(bullet.y - enemyBase.y) < (enemyBase.height + bullet.radius) / 2) {
                        
                        if (enemyBase.takeDamage(20)) {
                            gameOver(true);
                        }
                        updateUI();
                        return false;
                    }
                } else {
                    // 检查是否击中玩家基地
                    if (Math.abs(bullet.x - playerBase.x) < (playerBase.width + bullet.radius) / 2 &&
                        Math.abs(bullet.y - playerBase.y) < (playerBase.height + bullet.radius) / 2) {
                        
                        if (playerBase.takeDamage(20)) {
                            gameOver(false);
                        }
                        updateUI();
                        return false;
                    }
                }
                
                // 检查子弹是否超出边界
                return !bullet.isOutOfBounds();
            });
            
            // 检查敌人是否碰到玩家基地
            enemies = enemies.filter(enemy => {
                if (Math.abs(enemy.x - playerBase.x) < (enemy.width + playerBase.width) / 2 &&
                    Math.abs(enemy.y - playerBase.y) < (enemy.height + playerBase.height) / 2) {
                    
                    if (playerBase.takeDamage(30)) {
                        gameOver(false);
                    }
                    updateUI();
                    return false;
                }
                return true;
            });
            
            requestAnimationFrame(gameLoop);
        }
        
        // 更新UI
        function updateUI() {
            document.getElementById('playerHealth').textContent = player.health;
            document.getElementById('score').textContent = score;
        }
        
        // 游戏结束
        function gameOver(playerWon) {
            gameRunning = false;
            document.getElementById('gameOver').style.display = 'block';
            document.getElementById('gameOverText').textContent = playerWon ? '你赢了！' : '游戏结束';
            document.getElementById('finalScore').textContent = score;
        }
        
        // 重新开始游戏
        function restartGame() {
            gameRunning = true;
            score = 0;
            player.health = 100;
            player.x = CANVAS_WIDTH / 2;
            player.y = CANVAS_HEIGHT - 50;
            enemyBase.health = 100;
            playerBase.health = 100;
            enemies = [];
            bullets = [];
            document.getElementById('gameOver').style.display = 'none';
            updateUI();
            requestAnimationFrame(gameLoop);
        }
        
        // 键盘事件
        window.addEventListener('keydown', (e) => {
            keys[e.key] = true;
            
            // 射击
            if (e.key === ' ' || e.key === 'Enter') {
                const bullet = player.shoot();
                if (bullet) {
                    bullets.push(bullet);
                }
            }
        });
        
        window.addEventListener('keyup', (e) => {
            keys[e.key] = false;
        });
        
        // 重新开始按钮
        document.getElementById('restartBtn').addEventListener('click', restartGame);
        
        // 初始化游戏
        window.onload = () => {
            updateUI();
            requestAnimationFrame(gameLoop);
        };
    </script>
</body>
</html>
