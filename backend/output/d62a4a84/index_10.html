<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>球球大作战 - 原生Canvas实现</title>
<style>
  body {
    margin: 0;
    overflow: hidden;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    background-color: #f0f0f0;
  }
  canvas {
    border: 2px solid #000;
  }
  #controls {
    position: absolute;
    bottom: 10px;
    left: 10px;
  }
  button {
    padding: 5px 10px;
    margin-right: 5px;
    cursor: pointer;
  }
</style>
</head>
<body>
<canvas id="gameCanvas"></canvas>
<div id="controls">
  <button id="startButton">开始游戏</button>
</div>
<script>
  const canvas = document.getElementById('gameCanvas');
  const ctx = canvas.getContext('2d');
  const startButton = document.getElementById('startButton');
  let gameRunning = false;

  canvas.width = window.innerWidth * 0.8;
  canvas.height = window.innerHeight * 0.8;

  let ball = {
    x: canvas.width / 2,
    y: canvas.height / 2,
    radius: 30,
    color: 'red',
    velocityX: 5,
    velocityY: 5
  };

  let score = 0;

  function drawBall() {
    ctx.beginPath();
    ctx.arc(ball.x, ball.y, ball.radius, 0, Math.PI * 2);
    ctx.fillStyle = ball.color;
    ctx.fill();
    ctx.closePath();
  }

  function drawScore() {
    ctx.font = '24px Arial';
    ctx.fillStyle = 'black';
    ctx.fillText('Score: ' + score, 10, 30);
  }

  function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    drawBall();
    drawScore();
    ball.x += ball.velocityX;
    ball.y += ball.velocityY;

    // Reverse direction when ball hits the canvas wall
    if (ball.x + ball.radius > canvas.width || ball.x - ball.radius < 0) {
      ball.velocityX = -ball.velocityX;
    }

    if (ball.y + ball.radius > canvas.height || ball.y - ball.radius < 0) {
      ball.velocityY = -ball.velocityY;
    }

    // Collision detection with the canvas wall
    if (ball.x + ball.radius > canvas.width || ball.x - ball.radius < 0 || ball.y + ball.radius > canvas.height || ball.y - ball.radius < 0) {
      ball.velocityX = -ball.velocityX;
      ball.velocityY = -ball.velocityY;
    }

    requestAnimationFrame(draw);
  }

  function handleKeyDown(event) {
    switch (event.key) {
      case 'ArrowLeft':
        ball.velocityX = -5;
        break;
      case 'ArrowRight':
        ball.velocityX = 5;
        break;
      case 'ArrowUp':
        ball.velocityY = -5;
        break;
      case 'ArrowDown':
        ball.velocityY = 5;
        break;
    }
  }

  function handleKeyUp(event) {
    switch (event.key) {
      case 'ArrowLeft':
      case 'ArrowRight':
        ball.velocityX = 0;
        break;
      case 'ArrowUp':
      case 'ArrowDown':
        ball.velocityY = 0;
        break;
    }
  }

  function startGame() {
    gameRunning = true;
    draw();
    document.addEventListener('keydown', handleKeyDown);
    document.addEventListener('keyup', handleKeyUp);
    startButton.style.display = 'none';
  }

  window.onload = function() {
    startButton.addEventListener('click', startGame);
  };
</script>
</body>
</html>
