<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>打砖块游戏</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #f0f0f0;
            font-family: Arial, sans-serif;
        }
        .game-container {
            text-align: center;
            background-color: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }
        canvas {
            border: 1px solid #333;
            background-color: #111;
            display: block;
            margin: 0 auto;
        }
        .game-info {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
            font-size: 18px;
        }
        .controls {
            margin-top: 15px;
            color: #666;
        }
        button {
            padding: 10px 20px;
            font-size: 16px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            margin-top: 10px;
            transition: background-color 0.3s;
        }
        button:hover {
            background-color: #45a049;
        }
        .game-over {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background-color: rgba(0, 0, 0, 0.8);
            color: white;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
            display: none;
        }
    </style>
</head>
<body>
    <div class="game-container">
        <div class="game-info">
            <div>分数: <span id="score">0</span></div>
            <div>生命: <span id="lives">3</span></div>
        </div>
        <canvas id="gameCanvas" width="480" height="320"></canvas>
        <div class="controls">
            <p>使用 ← → 方向键控制挡板移动</p>
            <button id="restartBtn">重新开始</button>
        </div>
        <div class="game-over" id="gameOverModal">
            <h2 id="gameOverText">游戏结束</h2>
            <p>最终得分: <span id="finalScore">0</span></p>
            <button id="restartBtnModal">重新开始</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreElement = document.getElementById('score');
        const livesElement = document.getElementById('lives');
        const gameOverModal = document.getElementById('gameOverModal');
        const gameOverText = document.getElementById('gameOverText');
        const finalScoreElement = document.getElementById('finalScore');
        const restartBtn = document.getElementById('restartBtn');
        const restartBtnModal = document.getElementById('restartBtnModal');

        // 游戏变量
        let score = 0;
        let lives = 3;
        let gameRunning = true;
        let rightPressed = false;
        let leftPressed = false;

        // 球的属性
        const ball = {
            x: canvas.width / 2,
            y: canvas.height - 30,
            radius: 8,
            dx: 4,
            dy: -4,
            speed: 4
        };

        // 挡板属性
        const paddle = {
            width: 75,
            height: 10,
            x: (canvas.width - 75) / 2,
            speed: 7
        };

        // 砖块属性
        const brickRowCount = 3;
        const brickColumnCount = 5;
        const brickWidth = 75;
        const brickHeight = 20;
        const brickPadding = 10;
        const brickOffsetTop = 30;
        const brickOffsetLeft = 30;
        let bricks = [];

        // 初始化砖块
        function initBricks() {
            bricks = [];
            for (let c = 0; c < brickColumnCount; c++) {
                bricks[c] = [];
                for (let r = 0; r < brickRowCount; r++) {
                    bricks[c][r] = { 
                        x: 0, 
                        y: 0, 
                        status: 1,
                        color: `hsl(${r * 60 + c * 20}, 70%, 50%)`
                    };
                }
            }
        }

        // 绘制球
        function drawBall() {
            ctx.beginPath();
            ctx.arc(ball.x, ball.y, ball.radius, 0, Math.PI * 2);
            ctx.fillStyle = '#0095DD';
            ctx.fill();
            ctx.closePath();
        }

        // 绘制挡板
        function drawPaddle() {
            ctx.beginPath();
            ctx.rect(paddle.x, canvas.height - paddle.height, paddle.width, paddle.height);
            ctx.fillStyle = '#0095DD';
            ctx.fill();
            ctx.closePath();
        }

        // 绘制砖块
        function drawBricks() {
            for (let c = 0; c < brickColumnCount; c++) {
                for (let r = 0; r < brickRowCount; r++) {
                    if (bricks[c][r].status === 1) {
                        const brickX = c * (brickWidth + brickPadding) + brickOffsetLeft;
                        const brickY = r * (brickHeight + brickPadding) + brickOffsetTop;
                        bricks[c][r].x = brickX;
                        bricks[c][r].y = brickY;
                        
                        ctx.beginPath();
                        ctx.rect(brickX, brickY, brickWidth, brickHeight);
                        ctx.fillStyle = bricks[c][r].color;
                        ctx.fill();
                        ctx.closePath();
                    }
                }
            }
        }

        // 碰撞检测
        function collisionDetection() {
            for (let c = 0; c < brickColumnCount; c++) {
                for (let r = 0; r < brickRowCount; r++) {
                    const b = bricks[c][r];
                    if (b.status === 1) {
                        if (
                            ball.x > b.x && 
                            ball.x < b.x + brickWidth && 
                            ball.y > b.y && 
                            ball.y < b.y + brickHeight
                        ) {
                            ball.dy = -ball.dy;
                            b.status = 0;
                            score += 10;
                            scoreElement.textContent = score;
                            
                            // 检查是否所有砖块都被消除
                            if (score === brickRowCount * brickColumnCount * 10) {
                                gameWin();
                            }
                        }
                    }
                }
            }
        }

        // 球边界检测
        function ballBoundaryCheck() {
            // 左右边界
            if (ball.x + ball.dx > canvas.width - ball.radius || ball.x + ball.dx < ball.radius) {
                ball.dx = -ball.dx;
            }
            
            // 上边界
            if (ball.y + ball.dy < ball.radius) {
                ball.dy = -ball.dy;
            }
            // 下边界（球掉落）
            else if (ball.y + ball.dy > canvas.height - ball.radius) {
                // 检查是否碰到挡板
                if (ball.x > paddle.x && ball.x < paddle.x + paddle.width) {
                    // 根据球击中挡板的位置调整反弹角度
                    const hitPos = (ball.x - paddle.x) / paddle.width;
                    ball.dx = 8 * (hitPos - 0.5); // -4 到 4 之间的值
                    ball.dy = -ball.dy;
                } else {
                    // 没有碰到挡板，失去一条生命
                    lives--;
                    livesElement.textContent = lives;
                    
                    if (lives === 0) {
                        gameOver();
                    } else {
                        resetBall();
                    }
                }
            }
        }

        // 挡板边界检测
        function paddleBoundaryCheck() {
            if (rightPressed && paddle.x < canvas.width - paddle.width) {
                paddle.x += paddle.speed;
            } else if (leftPressed && paddle.x > 0) {
                paddle.x -= paddle.speed;
            }
        }

        // 重置球的位置
        function resetBall() {
            ball.x = canvas.width / 2;
            ball.y = canvas.height - 30;
            ball.dx = 4 * (Math.random() > 0.5 ? 1 : -1);
            ball.dy = -4;
        }

        // 游戏结束
        function gameOver() {
            gameRunning = false;
            gameOverText.textContent = "游戏结束";
            finalScoreElement.textContent = score;
            gameOverModal.style.display = "block";
        }

        // 游戏胜利
        function gameWin() {
            gameRunning = false;
            gameOverText.textContent = "恭喜你赢了！";
            finalScoreElement.textContent = score;
            gameOverModal.style.display = "block";
        }

        // 重新开始游戏
        function restartGame() {
            score = 0;
            lives = 3;
            scoreElement.textContent = score;
            livesElement.textContent = lives;
            gameRunning = true;
            gameOverModal.style.display = "none";
            
            resetBall();
            paddle.x = (canvas.width - paddle.width) / 2;
            initBricks();
            
            gameLoop();
        }

        // 键盘事件处理
        function keyDownHandler(e) {
            if (e.key === "Right" || e.key === "ArrowRight") {
                rightPressed = true;
            } else if (e.key === "Left" || e.key === "ArrowLeft") {
                leftPressed = true;
            }
        }

        function keyUpHandler(e) {
            if (e.key === "Right" || e.key === "ArrowRight") {
                rightPressed = false;
            } else if (e.key === "Left" || e.key === "ArrowLeft") {
                leftPressed = false;
            }
        }

        // 触摸事件处理（移动设备支持）
        function touchMoveHandler(e) {
            const relativeX = e.touches[0].clientX - canvas.offsetLeft;
            if (relativeX > 0 && relativeX < canvas.width) {
                paddle.x = relativeX - paddle.width / 2;
            }
        }

        // 游戏主循环
        function gameLoop() {
            if (!gameRunning) return;
            
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            drawBricks();
            drawBall();
            drawPaddle();
            collisionDetection();
            ballBoundaryCheck();
            paddleBoundaryCheck();
            
            // 更新球的位置
            ball.x += ball.dx;
            ball.y += ball.dy;
            
            requestAnimationFrame(gameLoop);
        }

        // 事件监听器
        document.addEventListener("keydown", keyDownHandler, false);
        document.addEventListener("keyup", keyUpHandler, false);
        canvas.addEventListener("touchmove", touchMoveHandler, false);
        restartBtn.addEventListener("click", restartGame);
        restartBtnModal.addEventListener("click", restartGame);

        // 初始化游戏
        initBricks();
        gameLoop();
    </script>
</body>
</html>
