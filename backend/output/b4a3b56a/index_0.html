<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>飞机大战游戏</title>
<style>
  canvas {
    border: 1px solid black;
  }
</style>
</head>
<body>
<canvas id="gameCanvas" width="800" height="600"></canvas>
<script>
// 游戏配置
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const gameWidth = canvas.width;
const gameHeight = canvas.height;
let score = 0;

// 飞机类
class Plane {
  constructor(x, y, width, height, color) {
    this.x = x;
    this.y = y;
    this.width = width;
    this.height = height;
    this.color = color;
  }

  draw() {
    ctx.fillStyle = this.color;
    ctx.fillRect(this.x, this.y, this.width, this.height);
  }

  move(x, y) {
    this.x = x;
    this.y = y;
  }
}

// 敌机类
class Enemy {
  constructor(x, y, width, height, color) {
    this.x = x;
    this.y = y;
    this.width = width;
    this.height = height;
    this.color = color;
    this.speed = Math.random() * 2 + 1;
  }

  draw() {
    ctx.fillStyle = this.color;
    ctx.fillRect(this.x, this.y, this.width, this.height);
  }

  move() {
    this.y += this.speed;
  }
}

// 子弹类
class Bullet {
  constructor(x, y, width, height, color) {
    this.x = x;
    this.y = y;
    this.width = width;
    this.height = height;
    this.color = color;
    this.speed = -5;
  }

  draw() {
    ctx.fillStyle = this.color;
    ctx.fillRect(this.x, this.y, this.width, this.height);
  }

  move() {
    this.y += this.speed;
  }
}

// 创建飞机
const player = new Plane(gameWidth / 2, gameHeight - 50, 50, 50, 'blue');

// 敌机数组
const enemies = [];
for (let i = 0; i < 5; i++) {
  enemies.push(new Enemy(Math.random() * (gameWidth - 50), 0, 50, 50, 'red'));
}

// 子弹数组
const bullets = [];

// 绘制得分板
function drawScore() {
  ctx.fillStyle = 'white';
  ctx.fillText('Score: ' + score, 10, 20);
}

// 游戏循环
function gameLoop() {
  ctx.clearRect(0, 0, gameWidth, gameHeight);
  player.draw();
  drawScore();

  // 敌机移动和绘制
  for (let enemy of enemies) {
    enemy.move();
    enemy.draw();
    if (enemy.y > gameHeight) {
      enemies.shift();
      score++;
    }
  }

  // 子弹移动和绘制
  for (let bullet of bullets) {
    bullet.move();
    bullet.draw();
    if (bullet.y < 0) {
      bullets.shift();
    }
  }

  // 检测碰撞
  for (let enemy of enemies) {
    for (let bullet of bullets) {
      if (bullet.x < enemy.x + enemy.width &&
          bullet.x + bullet.width > enemy.x &&
          bullet.y < enemy.y + enemy.height &&
          bullet.y + bullet.height > enemy.y) {
        enemies.shift();
        bullets.shift();
        score++;
      }
    }
  }

  requestAnimationFrame(gameLoop);
}

// 键盘事件绑定
document.addEventListener('keydown', (e) => {
  if (e.key === 'ArrowLeft') {
    player.move(player.x - 10, player.y);
  } else if (e.key === 'ArrowRight') {
    player.move(player.x + 10, player.y);
  } else if (e.key === ' ') {
    bullets.push(new Bullet(player.x + player.width / 2, player.y, 5, 10, 'yellow'));
  }
});

// 初始化游戏
window.onload = () => {
  gameLoop();
};
</script>
</body>
</html>
