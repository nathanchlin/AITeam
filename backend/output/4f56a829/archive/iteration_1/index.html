<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Angry Birds</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-dark: #1a1a2e;
            --accent: #FF6B35;
            --accent-secondary: #4ECDC4;
            --text: #ffffff;
        }

        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 50%, #f093fb 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', system-ui, sans-serif;
            overflow: hidden;
        }

        .game-container {
            position: relative;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 0 60px rgba(255, 107, 53, 0.3), 0 20px 60px rgba(0, 0, 0, 0.4);
        }

        canvas {
            display: block;
            cursor: crosshair;
        }

        .ui-overlay {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            pointer-events: none;
            z-index: 100;
        }

        .main-menu {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(180deg, rgba(102, 126, 234, 0.95) 0%, rgba(118, 75, 162, 0.95) 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            pointer-events: auto;
            z-index: 200;
            transition: opacity 0.5s ease;
        }

        .main-menu.hidden {
            opacity: 0;
            pointer-events: none;
        }

        .game-title {
            font-family: 'Arial Black', sans-serif;
            font-size: 48px;
            color: #fff;
            text-shadow: 0 4px 0 #E94560, 0 8px 20px rgba(0,0,0,0.3);
            margin-bottom: 10px;
            animation: titleBounce 2s ease-in-out infinite;
        }

        .game-title span {
            color: #FFD93D;
        }

        @keyframes titleBounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        .subtitle {
            font-size: 16px;
            color: rgba(255,255,255,0.8);
            margin-bottom: 40px;
        }

        .menu-btn {
            padding: 16px 50px;
            font-size: 20px;
            font-weight: bold;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            margin: 8px;
            transition: all 0.3s;
        }

        .menu-btn.primary {
            background: linear-gradient(135deg, #FF6B35, #F7931E);
            color: #fff;
            box-shadow: 0 6px 0 #c45a2a, 0 10px 30px rgba(255, 107, 53, 0.4);
        }

        .menu-btn.secondary {
            background: linear-gradient(135deg, #4ECDC4, #44A08D);
            color: #fff;
            box-shadow: 0 6px 0 #3aa89e, 0 10px 30px rgba(78, 205, 196, 0.4);
        }

        .menu-btn:hover {
            transform: translateY(-3px) scale(1.05);
        }

        .menu-btn:active {
            transform: translateY(2px);
        }

        .game-ui {
            position: absolute;
            top: 16px;
            left: 16px;
            right: 16px;
            display: flex;
            justify-content: space-between;
            pointer-events: none;
            z-index: 10;
        }

        .ui-panel {
            background: rgba(22, 33, 62, 0.9);
            backdrop-filter: blur(10px);
            border-radius: 8px;
            padding: 12px 16px;
            color: #fff;
        }

        .ui-panel h3 {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 1px;
            opacity: 0.7;
            margin-bottom: 4px;
        }

        .ui-panel .value {
            font-size: 24px;
            font-weight: bold;
        }

        .birds-left {
            display: flex;
            gap: 8px;
            margin-top: 8px;
        }

        .bird-icon {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            background: #FF6B35;
            box-shadow: inset -3px -3px 0 rgba(0,0,0,0.2);
        }

        .bird-icon.used {
            opacity: 0.3;
        }

        .game-over-screen {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.8);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            pointer-events: auto;
            z-index: 300;
            opacity: 0;
            transition: opacity 0.3s;
        }

        .game-over-screen.visible {
            opacity: 1;
        }

        .game-over-screen h2 {
            font-size: 42px;
            color: #fff;
            margin-bottom: 20px;
        }

        .game-over-screen.win h2 {
            color: #4ECDC4;
        }

        .game-over-screen.lose h2 {
            color: #E94560;
        }

        .final-score {
            font-size: 24px;
            color: #FFD93D;
            margin-bottom: 30px;
        }

        .slingshot-guide {
            position: absolute;
            pointer-events: none;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            75% { transform: translateX(5px); }
        }

        .shake {
            animation: shake 0.3s ease;
        }
    </style>
</head>
<body>
    <div class="game-container">
        <canvas id="gameCanvas" width="900" height="600"></canvas>
        
        <div class="ui-overlay">
            <div class="main-menu" id="mainMenu">
                <div class="game-title">ANGRY <span>BIRDS</span></div>
                <div class="subtitle">Physics-based destruction game</div>
                <button class="menu-btn primary" id="playBtn">PLAY</button>
                <button class="menu-btn secondary" id="resetBtn">RESET</button>
            </div>
            
            <div class="game-ui" id="gameUI" style="display: none;">
                <div class="ui-panel">
                    <h3>Score</h3>
                    <div class="value" id="scoreValue">0</div>
                </div>
                <div class="ui-panel">
                    <h3>Birds</h3>
                    <div class="birds-left" id="birdsLeft"></div>
                </div>
                <div class="ui-panel">
                    <h3>Level</h3>
                    <div class="value" id="levelValue">1</div>
                </div>
            </div>
            
            <div class="game-over-screen" id="gameOverScreen">
                <h2 id="gameOverTitle">Game Over</h2>
                <div class="final-score" id="finalScore">Score: 0</div>
                <button class="menu-btn primary" id="restartBtn">RESTART</button>
                <button class="menu-btn secondary" id="menuBtn">MENU</button>
            </div>
        </div>
    </div>

    <script>
        // ============== 配置 ==============
        const CONFIG = {
            CANVAS_WIDTH: 900,
            CANVAS_HEIGHT: 600,
            GROUND_HEIGHT: 80,
            GRAVITY: 0.35,
            AIR_RESISTANCE: 0.995,
            SLINGSHOT: { x: 150, y: 420 },
            MAX_PULL: 100,
            BIRD_TYPES: {
                red: { color: '#FF6B35', power: 1.0, radius: 18 },
                yellow: { color: '#FFD93D', power: 1.3, radius: 15 },
                black: { color: '#2D3436', power: 1.5, radius: 22 }
            }
        };

        // ============== 工具类 ==============
        class Vector2 {
            constructor(x = 0, y = 0) {
                this.x = x;
                this.y = y;
            }
            add(v) { return new Vector2(this.x + v.x, this.y + v.y); }
            sub(v) { return new Vector2(this.x - v.x, this.y - v.y); }
            mul(s) { return new Vector2(this.x * s, this.y * s); }
            length() { return Math.sqrt(this.x * this.x + this.y * this.y); }
            normalize() {
                const len = this.length();
                return len > 0 ? new Vector2(this.x / len, this.y / len) : new Vector2();
            }
            clone() { return new Vector2(this.x, this.y); }
        }

        const Utils = {
            distance: (x1, y1, x2, y2) => Math.sqrt((x2-x1)**2 + (y2-y1)**2),
            clamp: (val, min, max) => Math.max(min, Math.min(max, val)),
            random: (min, max) => Math.random() * (max - min) + min
        };

        // ============== 小鸟类 ==============
        class Bird {
            constructor(x, y, type = 'red') {
                this.pos = new Vector2(x, y);
                this.vel = new Vector2(0, 0);
                this.type = type;
                this.radius = CONFIG.BIRD_TYPES[type].radius;
                this.config = CONFIG.BIRD_TYPES[type];
                this.launched = false;
                this.active = true;
                this.rotation = 0;
                this.trail = [];
                this.startPos = new Vector2(x, y);
            }
            
            reset() {
                this.pos = this.startPos.clone();
                this.vel = new Vector2(0, 0);
                this.launched = false;
                this.active = true;
                this.rotation = 0;
                this.trail = [];
            }
            
            update() {
                if (!this.active) return;
                
                if (this.launched) {
                    this.vel.y += CONFIG.GRAVITY;
                    this.vel.x *= CONFIG.AIR_RESISTANCE;
                    this.vel.y *= CONFIG.AIR_RESISTANCE;
                    
                    this.pos.x += this.vel.x;
                    this.pos.y += this.vel.y;
                    
                    this.rotation += this.vel.x * 0.02;
                    
                    if (this.trail.length === 0 || 
                        Utils.distance(this.pos.x, this.pos.y, 
                        this.trail[this.trail.length-1].x, 
                        this.trail[this.trail.length-1].y) > 10) {
                        this.trail.push({ x: this.pos.x, y: this.pos.y, alpha: 1 });
                        if (this.trail.length > 30) this.trail.shift();
                    }
                    
                    this.trail.forEach((t, i) => {
                        t.alpha = (i + 1) / this.trail.length * 0.5;
                    });
                    
                    const groundY = CONFIG.CANVAS_HEIGHT - CONFIG.GROUND_HEIGHT - this.radius;
                    if (this.pos.y > groundY) {
                        this.pos.y = groundY;
                        this.vel.y *= -0.4;
                        this.vel.x *= 0.7;
                    }
                    
                    if (this.pos.x < this.radius) { this.pos.x = this.radius; this.vel.x *= -0.5; }
                    if (this.pos.x > CONFIG.CANVAS_WIDTH - this.radius) { 
                        this.pos.x = CONFIG.CANVAS_WIDTH - this.radius; 
                        this.vel.x *= -0.5; 
                    }
                    
                    if (Math.abs(this.vel.x) < 0.2 && Math.abs(this.vel.y) < 0.2 && 
                        this.pos.y >= groundY - 5) {
                        this.active = false;
                    }
                    
                    if (this.pos.y > CONFIG.CANVAS_HEIGHT + 100) {
                        this.active = false;
                    }
                }
            }
            
            launch(velocity) {
                this.vel = velocity.mul(this.config.power);
                this.launched = true;
            }
            
            checkCollision(body) {
                if (body.destroyed) return false;
                const closestX = Utils.clamp(this.pos.x, body.pos.x, body.pos.x + body.width);
                const closestY = Utils.clamp(this.pos.y, body.pos.y, body.pos.y + body.height);
                const dist = Utils.distance(this.pos.x, this.pos.y, closestX, closestY);
                return dist < this.radius;
            }
            
            checkCircleCollision(other, radius) {
                const dist = Utils.distance(this.pos.x, this.pos.y, other.x, other.y);
                return dist < this.radius + radius;
            }
            
            draw(ctx) {
                // 轨迹
                this.trail.forEach(t => {
                    ctx.beginPath();
                    ctx.arc(t.x, t.y, 4, 0, Math.PI * 2);
                    ctx.fillStyle = `rgba(255, 107, 53, ${t.alpha})`;
                    ctx.fill();
                });
                
                ctx.save();
                ctx.translate(this.pos.x, this.pos.y);
                ctx.rotate(this.rotation);
                
                // 身体
                ctx.beginPath();
                ctx.arc(0, 0, this.radius, 0, Math.PI * 2);
                const gradient = ctx.createRadialGradient(-5, -5, 0, 0, 0, this.radius);
                gradient.addColorStop(0, this.config.color);
                gradient.addColorStop(1, this.darkenColor(this.config.color, 30));
                ctx.fillStyle = gradient;
                ctx.fill();
                
                // 眼睛
                ctx.fillStyle = '#fff';
                ctx.beginPath();
                ctx.ellipse(-5, -3, 6, 7, 0, 0, Math.PI * 2);
                ctx.ellipse(5, -3, 6, 7, 0, 0, Math.PI * 2);
                ctx.fill();
                
                ctx.fillStyle = '#000';
                ctx.beginPath();
                ctx.arc(-4, -2, 3, 0, Math.PI * 2);
                ctx.arc(6, -2, 3, 0, Math.PI * 2);
                ctx.fill();
                
                // 眉毛
                ctx.strokeStyle = '#8B4513';
                ctx.lineWidth = 3;
                ctx.beginPath();
                ctx.moveTo(-12, -10);
                ctx.lineTo(-2, -8);
                ctx.moveTo(12, -10);
                ctx.lineTo(2, -8);
                ctx.stroke();
                
                // 嘴巴
                ctx.fillStyle = '#FFA500';
                ctx.beginPath();
                ctx.moveTo(0, 5);
                ctx.lineTo(-8, 10);
                ctx.lineTo(8, 10);
                ctx.closePath();
                ctx.fill();
                
                ctx.restore();
            }
            
            darkenColor(hex, amount) {
                const num = parseInt(hex.slice(1), 16);
                const r = Math.max(0, (num >> 16) - amount);
                const g = Math.max(0, ((num >> 8) & 0x00FF) - amount);
                const b = Math.max(0, (num & 0x0000FF) - amount);
                return `rgb(${r},${g},${b})`;
            }
        }

        // ============== 猪类 ==============
        class Pig {
            constructor(x, y, size = 'medium') {
                this.pos = new Vector2(x, y);
                this.size = size;
                this.radius = size === 'large' ? 30 : size === 'medium' ? 22 : 16;
                this.health = size === 'large' ? 3 : size === 'medium' ? 2 : 1;
                this.maxHealth = this.health;
                this.destroyed = false;
                this.shakeOffset = 0;
            }
            
            hit() {
                this.health--;
                this.shakeOffset = 10;
                if (this.health <= 0) {
                    this.destroyed = true;
                    return true;
                }
                return false;
            }
            
            update() {
                if (this.shakeOffset > 0) {
                    this.shakeOffset *= 0.8;
                }
            }
            
            draw(ctx) {
                if (this.destroyed) return;
                
                ctx.save();
                ctx.translate(this.pos.x + this.shakeOffset, this.pos.y);
                
                // 身体
                ctx.beginPath();
                ctx.arc(0, 0, this.radius, 0, Math.PI * 2);
                const gradient = ctx.createRadialGradient(-5, -5, 0, 0, 0, this.radius);
                gradient.addColorStop(0, '#90EE90');
                gradient.addColorStop(1, '#228B22');
                ctx.fillStyle = gradient;
                ctx.fill();
                
                // 耳朵
                ctx.fillStyle = '#228B22';
                ctx.beginPath();
                ctx.ellipse(-this.radius + 5, -this.radius + 5, 8, 10, -0.5, 0, Math.PI * 2);
                ctx.ellipse(this.radius - 5, -this.radius + 5, 8, 10, 0.5, 0, Math.PI * 2);
                ctx.fill();
                
                // 眼睛
                ctx.fillStyle = '#fff';
                ctx.beginPath();
                ctx.arc(-6, -3, 6, 0, Math.PI * 2);
                ctx.arc(6, -3, 6, 0, Math.PI * 2);
                ctx.fill();
                
                ctx.fillStyle = '#000';
                ctx.beginPath();
                ctx.arc(-5, -2, 3, 0, Math.PI * 2);
                ctx.arc(7, -2, 3, 0, Math.PI * 2);
                ctx.fill();
                
                // 鼻子
                ctx.fillStyle = '#228B22';
                ctx.beginPath();
                ctx.ellipse(0, 8, 10, 7, 0, 0, Math.PI * 2);
                ctx.fill();
                
                ctx.fillStyle = '#1a5a1a';
                ctx.beginPath();
                ctx.ellipse(-4, 8, 3, 4, 0, 0, Math.PI * 2);
                ctx.ellipse(4, 8, 3, 4, 0, 0, Math.PI * 2);
                ctx.fill();
                
                // 血量指示
                if (this.health < this.maxHealth) {
                    ctx.fillStyle = 'rgba(255,0,0,0.5)';
                    for (let i = this.health; i < this.maxHealth; i++) {
                        ctx.beginPath();
                        ctx.arc(-10 + i * 10, -this.radius - 8, 4, 0, Math.PI * 2);
                        ctx.fill();
                    }
                }
                
                ctx.restore();
            }
        }

        // ============== 方块类 ==============
        class Block {
            constructor(x, y, width, height, type = 'wood') {
                this.pos = new Vector2(x, y);
                this.width = width;
                this.height = height;
                this.type = type;
                this.health = type === 'stone' ? 3 : type === 'wood' ? 2 : 1;
                this.destroyed = false;
                this.shakeOffset = 0;
            }
            
            hit() {
                this.health--;
                this.shakeOffset = 8;
                if (this.health <= 0) {
                    this.destroyed = true;
                    return true;
                }
                return false;
            }
            
            update() {
                if (this.shakeOffset > 0) {
                    this.shakeOffset *= 0.85;
                }
            }
            
            draw(ctx) {
                if (this.destroyed) return;
                
                ctx.save();
                ctx.translate(this.shakeOffset, 0);
                
                const colors = {
                    wood: { main: '#8B4513', dark: '#5D2E0C', pattern: '#A0522D' },
                    stone: { main: '#808080', dark: '#505050', pattern: '#A0A0A0' },
                    glass: { main: 'rgba(135, 206, 250, 0.7)', dark: 'rgba(70, 130, 180, 0.7)', pattern: 'rgba(200, 230, 255, 0.5)' }
                };
                
                const c = colors[this.type];
                
                ctx.fillStyle = c.main;
                ctx.fillRect(this.pos.x, this.pos.y, this.width, this.height);
                
                ctx.strokeStyle = c.dark;
                ctx.lineWidth = 2;
                ctx.strokeRect(this.pos.x, this.pos.y, this.width, this.height);
                
                if (this.type === 'wood') {
                    ctx.strokeStyle = c.pattern;
                    ctx.lineWidth = 1;
                    for (let i = 0; i < this.height; i += 8) {
                        ctx.beginPath();
                        ctx.moveTo(this.pos.x, this.pos.y + i);
                        ctx.lineTo(this.pos.x + this.width, this.pos.y + i);
                        ctx.stroke();
                    }
                }
                
                ctx.restore();
            }
        }

        // ============== 游戏主类 ==============
        class Game {
            constructor() {
                this.canvas = document.getElementById('gameCanvas');
                this.ctx = this.canvas.getContext('2d');
                
                // 游戏状态 - 必须先初始化这些变量！
                this.isGameOver = false;
                this.isGameWon = false;
                this.isGameStarted = false;
                this.score = 0;
                this.level = 1;
                this.currentLevel = 1;
                
                // 游戏对象
                this.birds = [];
                this.pigs = [];
                this.blocks = [];
                this.currentBirdIndex = 0;
                
                // 弹弓状态
                this.isDragging = false;
                this.pullVector = new Vector2(0, 0);
                
                // 特效
                this.particles = [];
                this.floatingTexts = [];
                
                // 初始化UI事件
                this.initUI();
                
                // 开始渲染循环（但不开始游戏逻辑）
                this.render();
            }
            
            // ========== 关键修复：确保游戏状态正确初始化 ==========
            startGame() {
                console.log('Starting game...');
                
                // 重置所有游戏状态变量 - 这是修复BUG的关键！
                this.isGameOver = false;
                this.isGameWon = false;
                this.isGameStarted = true;
                this.score = 0;
                this.currentBirdIndex = 0;
                
                // 清空游戏对象
                this.birds = [];
                this.pigs = [];
                this.blocks = [];
                this.particles = [];
                this.floatingTexts = [];
                
                // 重置弹弓状态
                this.isDragging = false;
                this.pullVector = new Vector2(0, 0);
                
                // 加载关卡
                this.loadLevel(this.currentLevel);
                
                // 更新UI
                document.getElementById('mainMenu').classList.add('hidden');
                document.getElementById('gameUI').style.display = 'flex';
                document.getElementById('gameOverScreen').classList.remove('visible');
                
                this.updateUI();
                
                // 启动游戏循环
                this.gameLoop();
                
                console.log('Game started! isGameOver:', this.isGameOver, 'Birds:', this.birds.length, 'Pigs:', this.pigs.length);
            }
            
            loadLevel(levelNum) {
                this.level = levelNum;
                
                // 创建小鸟
                const birdTypes = ['red', 'red', 'yellow'];
                for (let i = 0; i < 3; i++) {
                    this.birds.push(new Bird(
                        CONFIG.SLINGSHOT.x + (i * 40),
                        CONFIG.SLINGSHOT.y + 50,
                        birdTypes[i]
                    ));
                }
                
                // 根据关卡创建猪和方块
                this.createLevelStructure(levelNum);
                
                this.currentBirdIndex = 0;
                this.prepareNextBird();
            }
            
            createLevelStructure(level) {
                const baseX = 500;
                const groundY = CONFIG.CANVAS_HEIGHT - CONFIG.GROUND_HEIGHT;
                
                if (level === 1) {
                    // 简单关卡：一个猪，简单结构
                    this.blocks.push(new Block(baseX, groundY - 60, 20, 60, 'wood'));
                    this.blocks.push(new Block(baseX + 80, groundY - 60, 20, 60, 'wood'));
                    this.blocks.push(new Block(baseX - 10, groundY - 80, 120, 20, 'wood'));
                    
                    this.pigs.push(new Pig(baseX + 50, groundY - 30, 'medium'));
                } else if (level === 2) {
                    // 中等关卡
                    this.blocks.push(new Block(baseX, groundY - 80, 20, 80, 'stone'));
                    this.blocks.push(new Block(baseX + 100, groundY - 80, 20, 80, 'stone'));
                    this.blocks.push(new Block(baseX - 10, groundY - 100, 140, 20, 'wood'));
                    this.blocks.push(new Block(baseX + 45, groundY - 140, 20, 40, 'wood'));
                    this.blocks.push(new Block(baseX + 35, groundY - 160, 50, 20, 'glass'));
                    
                    this.pigs.push(new Pig(baseX + 55, groundY - 30, 'medium'));
                    this.pigs.push(new Pig(baseX + 55, groundY - 180, 'small'));
                } else {
                    // 困难关卡
                    this.blocks.push(new Block(baseX - 50, groundY - 60, 20, 60, 'stone'));
                    this.blocks.push(new Block(baseX + 70, groundY - 60, 20, 60, 'stone'));
                    this.blocks.push(new Block(baseX - 60, groundY - 80, 120, 20, 'wood'));
                    
                    this.blocks.push(new Block(baseX + 150, groundY - 80, 20, 80, 'stone'));
                    this.blocks.push(new Block(baseX + 250, groundY - 80, 20, 80, 'stone'));
                    this.blocks.push(new Block(baseX + 140, groundY - 100, 140, 20, 'wood'));
                    
                    this.pigs.push(new Pig(baseX + 10, groundY - 30, 'large'));
                    this.pigs.push(new Pig(baseX + 200, groundY - 30, 'medium'));
                    this.pigs.push(new Pig(baseX + 200, groundY - 130, 'small'));
                }
            }
            
            prepareNextBird() {
                if (this.currentBirdIndex < this.birds.length) {
                    const bird = this.birds[this.currentBirdIndex];
                    bird.pos = new Vector2(CONFIG.SLINGSHOT.x, CONFIG.SLINGSHOT.y);
                    bird.startPos = bird.pos.clone();
                }
            }
            
            initUI() {
                // Play 按钮
                document.getElementById('playBtn').addEventListener('click', () => {
                    this.startGame();
                });
                
                // Reset 按钮
                document.getElementById('resetBtn').addEventListener('click', () => {
                    this.currentLevel = 1;
                    this.startGame();
                });
                
                // Restart 按钮
                document.getElementById('restartBtn').addEventListener('click', () => {
                    this.startGame();
                });
                
                // Menu 按钮
                document.getElementById('menuBtn').addEventListener('click', () => {
                    this.isGameStarted = false;
                    document.getElementById('mainMenu').classList.remove('hidden');
                    document.getElementById('gameUI').style.display = 'none';
                    document.getElementById('gameOverScreen').classList.remove('visible');
                });
                
                // 鼠标事件
                this.canvas.addEventListener('mousedown', (e) => this.onMouseDown(e));
                this.canvas.addEventListener('mousemove', (e) => this.onMouseMove(e));
                this.canvas.addEventListener('mouseup', (e) => this.onMouseUp(e));
                
                // 触摸事件
                this.canvas.addEventListener('touchstart', (e) => {
                    e.preventDefault();
                    const touch = e.touches[0];
                    this.onMouseDown({ clientX: touch.clientX, clientY: touch.clientY });
                });
                this.canvas.addEventListener('touchmove', (e) => {
                    e.preventDefault();
                    const touch = e.touches[0];
                    this.onMouseMove({ clientX: touch.clientX, clientY: touch.clientY });
                });
                this.canvas.addEventListener('touchend', (e) => {
                    e.preventDefault();
                    this.onMouseUp(e);
                });
            }
            
            getMousePos(e) {
                const rect = this.canvas.getBoundingClientRect();
                return new Vector2(
                    e.clientX - rect.left,
                    e.clientY - rect.top
                );
            }
            
            onMouseDown(e) {
                if (this.isGameOver || !this.isGameStarted) return;
                
                const mousePos = this.getMousePos(e);
                
                if (this.currentBirdIndex < this.birds.length) {
                    const bird = this.birds[this.currentBirdIndex];
                    if (!bird.launched && Utils.distance(mousePos.x, mousePos.y, bird.pos.x, bird.pos.y) < 50) {
                        this.isDragging = true;
                    }
                }
            }
            
            onMouseMove(e) {
                if (!this.isDragging || this.isGameOver) return;
                
                const mousePos = this.getMousePos(e);
                const slingshot = CONFIG.SLINGSHOT;
                
                let dx = mousePos.x - slingshot.x;
                let dy = mousePos.y - slingshot.y;
                
                const dist = Math.sqrt(dx * dx + dy * dy);
                if (dist > CONFIG.MAX_PULL) {
                    dx = (dx / dist) * CONFIG.MAX_PULL;
                    dy = (dy / dist) * CONFIG.MAX_PULL;
                }
                
                // 只允许向后拉
                if (dx > 0) dx = 0;
                
                this.pullVector = new Vector2(dx, dy);
                
                if (this.currentBirdIndex < this.birds.length) {
                    this.birds[this.currentBirdIndex].pos = new Vector2(
                        slingshot.x + dx,
                        slingshot.y + dy
                    );
                }
            }
            
            onMouseUp(e) {
                if (!this.isDragging || this.isGameOver) return;
                
                this.isDragging = false;
                
                if (this.currentBirdIndex < this.birds.length) {
                    const bird = this.birds[this.currentBirdIndex];
                    const launchPower = this.pullVector.length();
                    
                    if (launchPower > 20) {
                        const velocity = this.pullVector.mul(-0.2);
                        bird.launch(velocity);
                        
                        setTimeout(() => this.checkBirdStopped(), 3000);
                    } else {
                        // 拉力太小，重置位置
                        bird.pos = bird.startPos.clone();
                    }
                }
                
                this.pullVector = new Vector2(0, 0);
            }
            
            checkBirdStopped() {
                if (this.isGameOver) return;
                
                if (this.currentBirdIndex < this.birds.length) {
                    const bird = this.birds[this.currentBirdIndex];
                    if (bird.launched && !bird.active) {
                        this.nextBird();
                    } else if (bird.launched) {
                        // 继续等待
                        setTimeout(() => this.checkBirdStopped(), 500);
                    }
                }
            }
            
            nextBird() {
                this.currentBirdIndex++;
                
                if (this.currentBirdIndex < this.birds.length) {
                    this.prepareNextBird();
                }
                
                this.checkGameState();
            }
            
            checkGameState() {
                if (this.isGameOver) return;
                
                // 检查是否还有猪存活
                const pigsAlive = this.pigs.filter(p => !p.destroyed).length;
                
                console.log('Checking game state - Pigs alive:', pigsAlive, 'Birds left:', this.birds.length - this.currentBirdIndex);
                
                if (pigsAlive === 0) {
                    // 胜利！
                    this.winGame();
                } else if (this.currentBirdIndex >= this.birds.length) {
                    // 没有小鸟了，检查是否所有小鸟都已停止
                    const allBirdsStopped = this.birds.every(b => !b.active || !b.launched);
                    if (allBirdsStopped) {
                        // 失败
                        this.loseGame();
                    }
                }
            }
            
            winGame() {
                this.isGameOver = true;
                this.isGameWon = true;
                this.score += 1000 + (this.birds.length - this.currentBirdIndex) * 200;
                
                this.showGameOver(true);
            }
            
            loseGame() {
                this.isGameOver = true;
                this.isGameWon = false;
                
                this.showGameOver(false);
            }
            
            showGameOver(isWin) {
                const screen = document.getElementById('gameOverScreen');
                const title = document.getElementById('gameOverTitle');
                const score = document.getElementById('finalScore');
                
                screen.classList.remove('win', 'lose');
                screen.classList.add(isWin ? 'win' : 'lose');
                screen.classList.add('visible');
                
                title.textContent = isWin ? 'Level Complete!' : 'Level Failed';
                score.textContent = `Score: ${this.score}`;
                
                if (isWin) {
                    document.getElementById('restartBtn').textContent = 'NEXT LEVEL';
                    document.getElementById('restartBtn').onclick = () => {
                        this.currentLevel = Math.min(this.currentLevel + 1, 3);
                        this.startGame();
                    };
                } else {
                    document.getElementById('restartBtn').textContent = 'RETRY';
                    document.getElementById('restartBtn').onclick = () => {
                        this.startGame();
                    };
                }
            }
            
            update() {
                if (!this.isGameStarted || this.isGameOver) return;
                
                // 更新小鸟
                this.birds.forEach(bird => bird.update());
                
                // 更新猪
                this.pigs.forEach(pig => pig.update());
                
                // 更新方块
                this.blocks.forEach(block => block.update());
                
                // 碰撞检测
                this.checkCollisions();
                
                // 更新特效
                this.particles = this.particles.filter(p => {
                    p.x += p.vx;
                    p.y += p.vy;
                    p.vy += 0.1;
                    p.life -= 0.02;
                    return p.life > 0;
                });
                
                this.floatingTexts = this.floatingTexts.filter(t => {
                    t.y -= 1;
                    t.life -= 0.02;
                    return t.life > 0;
                });
            }
            
            checkCollisions() {
                for (const bird of this.birds) {
                    if (!bird.launched || !bird.active) continue;
                    
                    // 检测与猪的碰撞
                    for (const pig of this.pigs) {
                        if (pig.destroyed) continue;
                        
                        if (bird.checkCircleCollision(pig.pos, pig.radius)) {
                            const destroyed = pig.hit();
                            if (destroyed) {
                                this.score += 500;
                                this.createParticles(pig.pos.x, pig.pos.y, '#90EE90');
                                this.addFloatingText(pig.pos.x, pig.pos.y, '+500');
                            } else {
                                this.score += 50;
                            }
                        }
                    }
                    
                    // 检测与方块的碰撞
                    for (const block of this.blocks) {
                        if (block.destroyed) continue;
                        
                        if (bird.checkCollision(block)) {
                            const destroyed = block.hit();
                            if (destroyed) {
                                this.score += 100;
                                this.createParticles(
                                    block.pos.x + block.width/2,
                                    block.pos.y + block.height/2,
                                    block.type === 'wood' ? '#8B4513' : '#808080'
                                );
                                this.addFloatingText(block.pos.x, block.pos.y, '+100');
                            } else {
                                this.score += 10;
                            }
                        }
                    }
                }
            }
            
            createParticles(x, y, color) {
                for (let i = 0; i < 15; i++) {
                    this.particles.push({
                        x: x,
                        y: y,
                        vx: Utils.random(-5, 5),
                        vy: Utils.random(-8, -2),
                        color: color,
                        size: Utils.random(3, 8),
                        life: 1
                    });
                }
            }
            
            addFloatingText(x, y, text) {
                this.floatingTexts.push({
                    x: x,
                    y: y,
                    text: text,
                    life: 1
                });
            }
            
            updateUI() {
                document.getElementById('scoreValue').textContent = this.score;
                document.getElementById('levelValue').textContent = this.level;
                
                // 更新小鸟图标
                const birdsLeft = document.getElementById('birdsLeft');
                birdsLeft.innerHTML = '';
                for (let i = 0; i < this.birds.length; i++) {
                    const icon = document.createElement('div');
                    icon.className = 'bird-icon' + (i < this.currentBirdIndex ? ' used' : '');
                    birdsLeft.appendChild(icon);
                }
            }
            
            render() {
                // 清空画布
                this.ctx.clearRect(0, 0, CONFIG.CANVAS_WIDTH, CONFIG.CANVAS_HEIGHT);
                
                // 绘制背景
                this.drawBackground();
                
                // 只有游戏开始后才绘制游戏对象
                if (this.isGameStarted) {
                    // 绘制地面
                    this.drawGround();
                    
                    // 绘制弹弓
                    this.drawSlingshot();
                    
                    // 绘制方块
                    this.blocks.forEach(block => block.draw(this.ctx));
                    
                    // 绘制猪
                    this.pigs.forEach(pig => pig.draw(this.ctx));
                    
                    // 绘制小鸟
                    this.birds.forEach((bird, index) => {
                        if (index >= this.currentBirdIndex || bird.launched) {
                            bird.draw(this.ctx);
                        }
                    });
                    
                    // 绘制弹弓皮筋
                    this.drawSlingshotBands();
                    
                    // 绘制瞄准线
                    if (this.isDragging) {
                        this.drawAimLine();
                    }
                    
                    // 绘制特效
                    this.drawParticles();
                    this.drawFloatingTexts();
                    
                    // 更新UI
                    this.updateUI();
                }
                
                // 继续渲染循环
                requestAnimationFrame(() => {
                    this.update();
                    this.render();
                });
            }
            
            drawBackground() {
                // 天空渐变
                const gradient = this.ctx.createLinearGradient(0, 0, 0, CONFIG.CANVAS_HEIGHT);
                gradient.addColorStop(0, '#87CEEB');
                gradient.addColorStop(0.6, '#B0E0E6');
                gradient.addColorStop(1, '#E0F6FF');
                this.ctx.fillStyle = gradient;
                this.ctx.fillRect(0, 0, CONFIG.CANVAS_WIDTH, CONFIG.CANVAS_HEIGHT);
                
                // 云朵
                this.ctx.fillStyle = 'rgba(255, 255, 255, 0.8)';
                this.drawCloud(100, 80, 60);
                this.drawCloud(300, 120, 45);
                this.drawCloud(600, 60, 70);
                this.drawCloud(800, 140, 50);
            }
            
            drawCloud(x, y, size) {
                this.ctx.beginPath();
                this.ctx.arc(x, y, size * 0.5, 0, Math.PI * 2);
                this.ctx.arc(x + size * 0.4, y - size * 0.1, size * 0.4, 0, Math.PI * 2);
                this.ctx.arc(x + size * 0.8, y, size * 0.35, 0, Math.PI * 2);
                this.ctx.arc(x + size * 0.4, y + size * 0.2, size * 0.3, 0, Math.PI * 2);
                this.ctx.fill();
            }
            
            drawGround() {
                const groundY = CONFIG.CANVAS_HEIGHT - CONFIG.GROUND_HEIGHT;
                
                // 草地
                const grassGradient = this.ctx.createLinearGradient(0, groundY, 0, CONFIG.CANVAS_HEIGHT);
                grassGradient.addColorStop(0, '#228B22');
                grassGradient.addColorStop(0.3, '#1a6b1a');
                grassGradient.addColorStop(1, '#145214');
                this.ctx.fillStyle = grassGradient;
                this.ctx.fillRect(0, groundY, CONFIG.CANVAS_WIDTH, CONFIG.GROUND_HEIGHT);
                
                // 草地纹理
                this.ctx.strokeStyle = '#2d8f2d';
                this.ctx.lineWidth = 2;
                for (let i = 0; i < CONFIG.CANVAS_WIDTH; i += 20) {
                    this.ctx.beginPath();
                    this.ctx.moveTo(i, groundY);
                    this.ctx.lineTo(i + 5, groundY - 8);
                    this.ctx.stroke();
                }
            }
            
            drawSlingshot() {
                const x = CONFIG.SLINGSHOT.x;
                const y = CONFIG.SLINGSHOT.y;
                
                this.ctx.fillStyle = '#5D2E0C';
                
                // 左支架
                this.ctx.beginPath();
                this.ctx.moveTo(x - 20, y + 60);
                this.ctx.lineTo(x - 25, y - 20);
                this.ctx.lineTo(x - 15, y - 30);
                this.ctx.lineTo(x - 10, y + 60);
                this.ctx.fill();
                
                // 右支架
                this.ctx.beginPath();
                this.ctx.moveTo(x + 10, y + 60);
                this.ctx.lineTo(x + 15, y - 20);
                this.ctx.lineTo(x + 25, y - 30);
                this.ctx.lineTo(x + 20, y + 60);
                this.ctx.fill();
                
                // 底座
                this.ctx.fillStyle = '#4a2409';
                this.ctx.fillRect(x - 30, y + 55, 50, 20);
            }
            
            drawSlingshotBands() {
                if (this.currentBirdIndex >= this.birds.length) return;
                
                const bird = this.birds[this.currentBirdIndex];
                const x = CONFIG.SLINGSHOT.x;
                const y = CONFIG.SLINGSHOT.y;
                
                this.ctx.strokeStyle = '#8B4513';
                this.ctx.lineWidth = 4;
                
                // 左皮筋
                this.ctx.beginPath();
                this.ctx.moveTo(x - 20, y - 20);
                this.ctx.lineTo(bird.pos.x, bird.pos.y);
                this.ctx.stroke();
                
                // 右皮筋
                this.ctx.beginPath();
                this.ctx.moveTo(x + 20, y - 20);
                this.ctx.lineTo(bird.pos.x, bird.pos.y);
                this.ctx.stroke();
            }
            
            drawAimLine() {
                const bird = this.birds[this.currentBirdIndex];
                if (!bird) return;
                
                const vx = -this.pullVector.x * 0.2 * bird.config.power;
                const vy = -this.pullVector.y * 0.2 * bird.config.power;
                
                this.ctx.strokeStyle = 'rgba(255, 255, 255, 0.5)';
                this.ctx.lineWidth = 2;
                this.ctx.setLineDash([5, 5]);
                this.ctx.beginPath();
                
                let px = bird.pos.x;
                let py = bird.pos.y;
                let pvx = vx;
                let pvy = vy;
                
                this.ctx.moveTo(px, py);
                
                for (let i = 0; i < 50; i++) {
                    pvy += CONFIG.GRAVITY;
                    px += pvx;
                    py += pvy;
                    
                    if (py > CONFIG.CANVAS_HEIGHT - CONFIG.GROUND_HEIGHT) break;
                    
                    this.ctx.lineTo(px, py);
                }
                
                this.ctx.stroke();
                this.ctx.setLineDash([]);
            }
            
            drawParticles() {
                this.particles.forEach(p => {
                    this.ctx.globalAlpha = p.life;
                    this.ctx.fillStyle = p.color;
                    this.ctx.fillRect(p.x - p.size/2, p.y - p.size/2, p.size, p.size);
                });
                this.ctx.globalAlpha = 1;
            }
            
            drawFloatingTexts() {
                this.ctx.font = 'bold 20px Arial';
                this.ctx.textAlign = 'center';
                
                this.floatingTexts.forEach(t => {
                    this.ctx.globalAlpha = t.life;
                    this.ctx.fillStyle = '#FFD93D';
                    this.ctx.strokeStyle = '#000';
                    this.ctx.lineWidth = 2;
                    this.ctx.strokeText(t.text, t.x, t.y);
                    this.ctx.fillText(t.text, t.x, t.y);
                });
                
                this.ctx.globalAlpha = 1;
            }
            
            gameLoop() {
                // 游戏循环由 render 函数中的 requestAnimationFrame 处理
                // 这里只是启动入口
            }
        }

constructor() {
    this.canvas = document.getElementById('gameCanvas');
    this.ctx = this.canvas.getContext('2d');
    
    // 游戏状态
    this.gameState = 'menu'; // menu, playing, win, lose
    this.score = 0;
    this.currentLevel = 1;
    
    // 状态保护 - 防止误判
    this.isPlaying = false;      // 游戏是否正在进行
    this.hasLaunched = false;    // 是否已发射过小鸟
    this.settlementDelay = 0;    // 结算延迟计数器
    
    // 游戏对象
    this.birds = [];
    this.pigs = [];
    this.blocks = [];
    this.particles = [];
    this.floatingTexts = [];
    this.currentBirdIndex = 0;
    
    // 弹弓状态
    this.isDragging = false;
    this.pullVector = { x: 0, y: 0 };
    this.birdOnSling = null;
    
    // 物理常量
    this.GRAVITY = 0.3;
    
    this.init();
}

startGame() {
    this.gameState = 'playing';
    this.score = 0;
    this.currentBirdIndex = 0;
    
    // 重置状态保护变量
    this.isPlaying = true;
    this.hasLaunched = false;
    this.settlementDelay = 0;
    
    this.loadLevel(this.currentLevel);
    
    // 重置小鸟到弹弓
    this.resetBirdToSlingshot();
    
    // 显示游戏UI
    document.querySelector('.main-menu').classList.add('hidden');
}

update() {
    if (this.gameState !== 'playing') return;
    
    // 更新物理
    this.updatePhysics();
    
    // 更新粒子
    this.updateParticles();
    
    // 更新浮动文字
    this.updateFloatingTexts();
    
    // 状态保护：只有游戏正在进行且已发射过小鸟后才进行胜负判定
    // 同时增加延迟计数器，避免在发射瞬间误判
    if (this.isPlaying && this.hasLaunched) {
        // 检查所有物体是否静止
        const allSettled = this.checkAllSettled();
        
        if (allSettled) {
            this.settlementDelay++;
            
            // 延迟60帧（约1秒）后再进行判定，确保物理模拟完全稳定
            if (this.settlementDelay >= 60) {
                this.checkGameEnd();
            }
        } else {
            this.settlementDelay = 0;
        }
    }
}

launchBird() {
    if (!this.birdOnSling) return;
    
    const bird = this.birdOnSling;
    const power = Math.sqrt(this.pullVector.x ** 2 + this.pullVector.y ** 2);
    
    if (power < 10) {
        // 力度太小，不放开发射
        return;
    }
    
    // 计算发射速度
    bird.vel.x = -this.pullVector.x * 0.2 * bird.config.power;
    bird.vel.y = -this.pullVector.y * 0.2 * bird.config.power;
    bird.launched = true;
    
    // 标记已发射
    this.hasLaunched = true;
    this.settlementDelay = 0;
    
    // 重置弹弓状态
    this.birdOnSling = null;
    this.isDragging = false;
    this.pullVector = { x: 0, y: 0 };
    
    // 播放发射音效（如果有）
    // this.playSound('launch');
}

checkGameEnd() {
    // 状态保护：确保游戏正在进行且已发射过小鸟
    if (!this.isPlaying || !this.hasLaunched) {
        return;
    }
    
    // 检查是否胜利（所有猪被消灭）
    const pigsAlive = this.pigs.filter(p => p.active).length;
    
    if (pigsAlive === 0) {
        this.gameWin();
        return;
    }
    
    // 检查是否失败（没有可用小鸟且所有物体已静止）
    const birdsAvailable = this.birds.filter(b => !b.launched || b.active).length;
    
    if (birdsAvailable === 0 && this.currentBirdIndex >= this.birds.length) {
        // 确保当前没有飞行中的小鸟
        const flyingBirds = this.birds.filter(b => b.launched && b.active);
        if (flyingBirds.length === 0) {
            this.gameLose();
        }
    }
}

gameWin() {
    this.gameState = 'win';
    this.isPlaying = false;
    
    // 计算星级和奖励分数
    const birdsRemaining = this.birds.filter(b => !b.launched).length;
    const bonusScore = birdsRemaining * 10000;
    this.score += bonusScore;
    
    // 计算星级
    let stars = 1;
    if (birdsRemaining >= 2) stars = 3;
    else if (birdsRemaining >= 1) stars = 2;
    
    // 显示胜利UI
    this.showWinUI(stars);
}

gameLose() {
    this.gameState = 'lose';
    this.isPlaying = false;
    
    // 显示失败UI
    this.showLoseUI();
}

// 检查所有物体是否已静止
checkAllSettled() {
    // 检查所有小鸟是否静止
    for (const bird of this.birds) {
        if (bird.active && bird.launched) {
            const speed = Math.sqrt(bird.vel.x ** 2 + bird.vel.y ** 2);
            if (speed > 0.5) return false;
        }
    }
    
    // 检查所有方块是否静止
    for (const block of this.blocks) {
        if (block.active) {
            const speed = Math.sqrt(block.vel.x ** 2 + block.vel.y ** 2);
            if (speed > 0.5) return false;
        }
    }
    
    // 检查所有猪是否静止
    for (const pig of this.pigs) {
        if (pig.active) {
            const speed = Math.sqrt(pig.vel.x ** 2 + pig.vel.y ** 2);
            if (speed > 0.5) return false;
        }
    }
    
    return true;
}
