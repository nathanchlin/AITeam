<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>心跳回忆 - 校园物语</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-dark: #1a1a2e;
            --bg-medium: #16213e;
            --bg-lighter: #1f2b4d;
            --accent-sakura: #ffb7c5;
            --accent-gold: #ffd700;
            --text-light: #f0e6d3;
            --text-dim: #a0a0b0;
            --ui-glass: rgba(255, 255, 255, 0.1);
            --stat-knowledge: #6b8cce;
            --stat-charm: #ff6b8a;
            --stat-stamina: #4ecdc4;
            --stat-social: #ffd700;
            --stat-art: #9b59b6;
            --stat-fitness: #e67e22;
            --glass-bg: linear-gradient(135deg, rgba(26, 26, 46, 0.95), rgba(22, 33, 62, 0.95));
            --glass-border: rgba(255, 183, 197, 0.3);
            --danger: #e74c3c;
            --success: #2ecc71;
        }

        body {
            background: var(--bg-dark);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-family: 'Hiragino Sans', 'Microsoft YaHei', sans-serif;
            overflow: hidden;
        }

        .game-wrapper {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .game-container {
            position: relative;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 
                0 0 60px rgba(255, 183, 197, 0.3),
                0 20px 60px rgba(0, 0, 0, 0.5);
            transform-origin: center center;
            transition: transform 0.3s ease;
        }

        #gameCanvas {
            display: block;
            cursor: pointer;
        }

        /* 主菜单界面 */
        .main-menu {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 200;
            background: linear-gradient(180deg, 
                rgba(26, 26, 46, 0.95) 0%,
                rgba(22, 33, 62, 0.9) 50%,
                rgba(26, 26, 46, 0.95) 100%);
            transition: opacity 0.5s ease;
        }

        .main-menu.hidden {
            opacity: 0;
            pointer-events: none;
        }

        .menu-bg-decor {
            position: absolute;
            width: 100%;
            height: 100%;
            overflow: hidden;
            pointer-events: none;
        }

        .menu-title {
            position: relative;
            z-index: 10;
            text-align: center;
            margin-bottom: 50px;
        }

        .menu-title h1 {
            font-size: 52px;
            font-weight: 300;
            color: var(--accent-sakura);
            text-shadow: 
                0 0 40px rgba(255, 183, 197, 0.5),
                0 4px 20px rgba(0, 0, 0, 0.3);
            letter-spacing: 8px;
            animation: titleGlow 3s ease-in-out infinite;
        }

        .menu-title .subtitle {
            font-size: 16px;
            color: var(--text-light);
            opacity: 0.7;
            letter-spacing: 12px;
            margin-top: 10px;
        }

        @keyframes titleGlow {
            0%, 100% { text-shadow: 0 0 40px rgba(255, 183, 197, 0.5), 0 4px 20px rgba(0, 0, 0, 0.3); }
            50% { text-shadow: 0 0 60px rgba(255, 183, 197, 0.8), 0 4px 20px rgba(0, 0, 0, 0.3); }
        }

        .menu-buttons {
            display: flex;
            flex-direction: column;
            gap: 14px;
            position: relative;
            z-index: 10;
        }

        .menu-btn {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 30px;
            padding: 14px 50px;
            color: var(--text-light);
            font-size: 16px;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            backdrop-filter: blur(10px);
            min-width: 260px;
            text-align: center;
            position: relative;
            overflow: hidden;
            letter-spacing: 3px;
        }

        .menu-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, 
                transparent, 
                rgba(255, 183, 197, 0.2), 
                transparent);
            transition: left 0.5s ease;
        }

        .menu-btn:hover::before {
            left: 100%;
        }

        .menu-btn:hover {
            border-color: var(--accent-sakura);
            box-shadow: 0 0 30px rgba(255, 183, 197, 0.3);
            transform: translateY(-2px);
        }

        .menu-btn:active {
            transform: translateY(0);
        }

        /* 游戏HUD */
        .game-hud {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            pointer-events: none;
            z-index: 50;
        }

        .game-hud.hidden {
            display: none;
        }

        .hud-left {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .time-panel {
            background: linear-gradient(135deg, rgba(26, 26, 46, 0.95), rgba(22, 33, 62, 0.95));
            border: 1px solid rgba(255, 183, 197, 0.3);
            border-radius: 12px;
            padding: 12px 18px;
            backdrop-filter: blur(10px);
            pointer-events: auto;
            min-width: 160px;
        }

        .date-display {
            font-size: 13px;
            color: var(--accent-sakura);
            margin-bottom: 4px;
            letter-spacing: 1px;
        }

        .time-display {
            font-size: 24px;
            font-weight: 700;
            color: var(--accent-gold);
            text-shadow: 0 0 15px rgba(255, 215, 0, 0.4);
            letter-spacing: 2px;
        }

        .period-display {
            font-size: 11px;
            color: var(--text-light);
            margin-top: 3px;
            letter-spacing: 2px;
            opacity: 0.8;
        }

        .location-panel {
            background: linear-gradient(135deg, rgba(26, 26, 46, 0.9), rgba(22, 33, 62, 0.9));
            border: 1px solid rgba(255, 183, 197, 0.2);
            border-radius: 8px;
            padding: 8px 14px;
            pointer-events: auto;
        }

        .location-name {
            font-size: 14px;
            color: var(--text-light);
            letter-spacing: 1px;
        }

        .hud-right {
            display: flex;
            gap: 10px;
            pointer-events: auto;
        }

        .hud-btn {
            background: linear-gradient(135deg, rgba(26, 26, 46, 0.9), rgba(22, 33, 62, 0.9));
            border: 1px solid rgba(255, 183, 197, 0.3);
            border-radius: 8px;
            padding: 10px 16px;
            color: var(--text-light);
            font-size: 13px;
            cursor: pointer;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
        }

        .hud-btn:hover {
            border-color: var(--accent-sakura);
            box-shadow: 0 0 20px rgba(255, 183, 197, 0.2);
        }

        /* 对话框 */
        .dialogue-box {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            width: calc(100% - 40px);
            max-width: 900px;
            background: linear-gradient(135deg, rgba(26, 26, 46, 0.97), rgba(22, 33, 62, 0.97));
            border: 1px solid rgba(255, 183, 197, 0.4);
            border-radius: 16px;
            padding: 20px 25px;
            backdrop-filter: blur(15px);
            z-index: 100;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .dialogue-box.active {
            opacity: 1;
            pointer-events: auto;
        }

        .dialogue-speaker {
            font-size: 16px;
            font-weight: 600;
            color: var(--accent-sakura);
            margin-bottom: 10px;
            padding-bottom: 8px;
            border-bottom: 1px solid rgba(255, 183, 197, 0.2);
        }

        .dialogue-text {
            font-size: 15px;
            line-height: 1.8;
            color: var(--text-light);
            min-height: 60px;
        }

        .dialogue-continue {
            position: absolute;
            bottom: 12px;
            right: 20px;
            font-size: 12px;
            color: var(--text-dim);
            animation: blink 1s infinite;
        }

        @keyframes blink {
            0%, 50%, 100% { opacity: 1; }
            25%, 75% { opacity: 0.3; }
        }

        /* 选项面板 */
        .choices-panel {
            position: absolute;
            bottom: 180px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            flex-direction: column;
            gap: 10px;
            z-index: 110;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .choices-panel.active {
            opacity: 1;
            pointer-events: auto;
        }

        .choice-btn {
            background: linear-gradient(135deg, rgba(26, 26, 46, 0.95), rgba(22, 33, 62, 0.95));
            border: 1px solid rgba(255, 183, 197, 0.4);
            border-radius: 25px;
            padding: 12px 30px;
            color: var(--text-light);
            font-size: 14px;
            cursor: pointer;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
            min-width: 280px;
            text-align: center;
        }

        .choice-btn:hover {
            border-color: var(--accent-sakura);
            box-shadow: 0 0 25px rgba(255, 183, 197, 0.3);
            transform: translateX(5px);
        }

        /* 属性面板 */
        .stats-panel {
            position: absolute;
            top: 50%;
            right: 20px;
            transform: translateY(-50%);
            background: linear-gradient(135deg, rgba(26, 26, 46, 0.95), rgba(22, 33, 62, 0.95));
            border: 1px solid rgba(255, 183, 197, 0.3);
            border-radius: 14px;
            padding: 18px;
            backdrop-filter: blur(10px);
            z-index: 80;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
            min-width: 200px;
        }

        .stats-panel.active {
            opacity: 1;
            pointer-events: auto;
        }

        .stats-title {
            font-size: 14px;
            color: var(--accent-sakura);
            margin-bottom: 15px;
            text-align: center;
            letter-spacing: 2px;
        }

        .stat-row {
            display: flex;
            align-items: center;
            margin-bottom: 10px;
        }

        .stat-label {
            font-size: 12px;
            color: var(--text-dim);
            width: 50px;
        }

        .stat-bar-bg {
            flex: 1;
            height: 6px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 3px;
            overflow: hidden;
        }

        .stat-bar-fill {
            height: 100%;
            border-radius: 3px;
            transition: width 0.5s ease;
        }

        .stat-value {
            font-size: 11px;
            color: var(--text-light);
            width: 35px;
            text-align: right;
            margin-left: 8px;
        }

        /* 好感度面板 */
        .affection-panel {
            position: absolute;
            top: 50%;
            left: 20px;
            transform: translateY(-50%);
            background: linear-gradient(135deg, rgba(26, 26, 46, 0.95), rgba(22, 33, 62, 0.95));
            border: 1px solid rgba(255, 183, 197, 0.3);
            border-radius: 14px;
            padding: 18px;
            backdrop-filter: blur(10px);
            z-index: 80;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
            min-width: 180px;
        }

        .affection-panel.active {
            opacity: 1;
            pointer-events: auto;
        }

        .affection-title {
            font-size: 14px;
            color: var(--accent-sakura);
            margin-bottom: 15px;
            text-align: center;
            letter-spacing: 2px;
        }

        .affection-row {
            display: flex;
            align-items: center;
            margin-bottom: 12px;
        }

        .affection-avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            margin-right: 10px;
            border: 2px solid rgba(255, 183, 197, 0.5);
        }

        .affection-info {
            flex: 1;
        }

        .affection-name {
            font-size: 12px;
            color: var(--text-light);
            margin-bottom: 4px;
        }

        .affection-hearts {
            display: flex;
            gap: 3px;
        }

        .heart {
            width: 12px;
            height: 12px;
            opacity: 0.3;
            transition: opacity 0.3s ease;
        }

        .heart.filled {
            opacity: 1;
        }

        /* 存档界面 */
        .save-load-panel {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: linear-gradient(135deg, rgba(26, 26, 46, 0.98), rgba(22, 33, 62, 0.98));
            border: 1px solid rgba(255, 183, 197, 0.4);
            border-radius: 16px;
            padding: 25px;
            backdrop-filter: blur(15px);
            z-index: 150;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
            min-width: 500px;
            max-height: 80%;
            overflow-y: auto;
        }

        .save-load-panel.active {
            opacity: 1;
            pointer-events: auto;
        }

        .panel-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 1px solid rgba(255, 183, 197, 0.2);
        }

        .panel-title {
            font-size: 18px;
            color: var(--accent-sakura);
            letter-spacing: 3px;
        }

        .close-btn {
            background: transparent;
            border: none;
            color: var(--text-dim);
            font-size: 24px;
            cursor: pointer;
            transition: color 0.3s ease;
        }

        .close-btn:hover {
            color: var(--accent-sakura);
        }

        .save-slots {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
        }

        .save-slot {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 183, 197, 0.2);
            border-radius: 10px;
            padding: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
            min-height: 100px;
        }

        .save-slot:hover {
            border-color: var(--accent-sakura);
            background: rgba(255, 183, 197, 0.1);
        }

        .save-slot.empty {
            opacity: 0.6;
        }

        .slot-number {
            font-size: 12px;
            color: var(--accent-gold);
            margin-bottom: 6px;
        }

        .slot-info {
            font-size: 11px;
            color: var(--text-dim);
            line-height: 1.5;
        }

        .slot-info .scene-name {
            color: var(--text-light);
        }

        /* 行动选择面板 */
        .action-panel {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 15px;
            z-index: 90;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .action-panel.active {
            opacity: 1;
            pointer-events: auto;
        }

        .action-btn {
            background: linear-gradient(135deg, rgba(26, 26, 46, 0.9), rgba(22, 33, 62, 0.9));
            border: 1px solid rgba(255, 183, 197, 0.3);
            border-radius: 12px;
            padding: 15px 20px;
            color: var(--text-light);
            font-size: 13px;
            cursor: pointer;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
            text-align: center;
            min-width: 100px;
        }

        .action-btn:hover {
            border-color: var(--accent-sakura);
            box-shadow: 0 0 20px rgba(255, 183, 197, 0.2);
            transform: translateY(-3px);
        }

        .action-btn .icon {
            font-size: 20px;
            margin-bottom: 5px;
        }

        /* 提示消息 */
        .toast-message {
            position: absolute;
            top: 80px;
            left: 50%;
            transform: translateX(-50%) translateY(-20px);
            background: linear-gradient(135deg, rgba(26, 26, 46, 0.95), rgba(22, 33, 62, 0.95));
            border: 1px solid rgba(255, 183, 197, 0.4);
            border-radius: 25px;
            padding: 12px 25px;
            color: var(--text-light);
            font-size: 14px;
            z-index: 200;
            opacity: 0;
            pointer-events: none;
            transition: all 0.4s ease;
        }

        .toast-message.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        .toast-message.success {
            border-color: var(--success);
        }

        .toast-message.error {
            border-color: var(--danger);
        }

        /* 转场效果 */
        .transition-overlay {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: var(--bg-dark);
            z-index: 300;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.5s ease;
        }

        .transition-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        /* 心跳特效 */
        .heartbeat-effect {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            pointer-events: none;
            z-index: 120;
        }

        .pulse-ring {
            position: absolute;
            width: 100px;
            height: 100px;
            border: 2px solid var(--accent-sakura);
            border-radius: 50%;
            opacity: 0;
            transform: translate(-50%, -50%) scale(0.5);
        }

        .pulse-ring.animate {
            animation: pulseExpand 1s ease-out forwards;
        }

        @keyframes pulseExpand {
            0% { transform: translate(-50%, -50%) scale(0.5); opacity: 0.8; }
            100% { transform: translate(-50%, -50%) scale(2); opacity: 0; }
        }

        /* 樱花粒子容器 */
        .sakura-container {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            pointer-events: none;
            overflow: hidden;
            z-index: 60;
        }

        .sakura-petal {
            position: absolute;
            width: 10px;
            height: 10px;
            background: radial-gradient(ellipse at center, var(--accent-sakura), transparent);
            border-radius: 50% 0 50% 50%;
            opacity: 0.6;
            animation: fall linear infinite;
        }

        @keyframes fall {
            0% { transform: translateY(-10px) rotate(0deg); }
            100% { transform: translateY(720px) rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="game-wrapper">
        <div class="game-container" id="gameContainer">
            <canvas id="gameCanvas"></canvas>
            
            <!-- 主菜单 -->
            <div class="main-menu" id="mainMenu">
                <div class="menu-bg-decor" id="menuBgDecor"></div>
                <div class="menu-title">
                    <h1>心跳回忆</h1>
                    <div class="subtitle">校园物语</div>
                </div>
                <div class="menu-buttons">
                    <button class="menu-btn" id="newGameBtn">开始新游戏</button>
                    <button class="menu-btn" id="continueBtn">继续游戏</button>
                    <button class="menu-btn" id="loadBtn">读取存档</button>
                    <button class="menu-btn" id="settingsBtn">游戏设置</button>
                </div>
            </div>

            <!-- 游戏HUD -->
            <div class="game-hud hidden" id="gameHud">
                <div class="hud-left">
                    <div class="time-panel">
                        <div class="date-display" id="dateDisplay">2024年4月1日 周一</div>
                        <div class="time-display" id="timeDisplay">08:00</div>
                        <div class="period-display" id="periodDisplay">早晨</div>
                    </div>
                    <div class="location-panel">
                        <div class="location-name" id="locationName">教室</div>
                    </div>
                </div>
                <div class="hud-right">
                    <button class="hud-btn" id="showStatsBtn">属性</button>
                    <button class="hud-btn" id="showAffectionBtn">好感</button>
                    <button class="hud-btn" id="saveBtn">存档</button>
                    <button class="hud-btn" id="menuBtn">菜单</button>
                </div>
            </div>

            <!-- 对话框 -->
            <div class="dialogue-box" id="dialogueBox">
                <div class="dialogue-speaker" id="dialogueSpeaker">???</div>
                <div class="dialogue-text" id="dialogueText"></div>
                <div class="dialogue-continue">点击继续 ▼</div>
            </div>

            <!-- 选项面板 -->
            <div class="choices-panel" id="choicesPanel"></div>

            <!-- 属性面板 -->
            <div class="stats-panel" id="statsPanel">
                <div class="stats-title">角色属性</div>
                <div id="statsContent"></div>
            </div>

            <!-- 好感度面板 -->
            <div class="affection-panel" id="affectionPanel">
                <div class="affection-title">好感度</div>
                <div id="affectionContent"></div>
            </div>

            <!-- 存档面板 -->
            <div class="save-load-panel" id="saveLoadPanel">
                <div class="panel-header">
                    <div class="panel-title" id="saveLoadTitle">存档管理</div>
                    <button class="close-btn" id="closeSavePanel">&times;</button>
                </div>
                <div class="save-slots" id="saveSlots"></div>
            </div>

            <!-- 行动选择面板 -->
            <div class="action-panel" id="actionPanel">
                <button class="action-btn" data-action="study">
                    <div class="icon">📚</div>
                    <div>学习</div>
                </button>
                <button class="action-btn" data-action="exercise">
                    <div class="icon">🏃</div>
                    <div>运动</div>
                </button>
                <button class="action-btn" data-action="rest">
                    <div class="icon">☕</div>
                    <div>休息</div>
                </button>
                <button class="action-btn" data-action="socialize">
                    <div class="icon">💬</div>
                    <div>社交</div>
                </button>
                <button class="action-btn" data-action="explore">
                    <div class="icon">🚶</div>
                    <div>探索</div>
                </button>
            </div>

            <!-- 提示消息 -->
            <div class="toast-message" id="toastMessage"></div>

            <!-- 转场效果 -->
            <div class="transition-overlay" id="transitionOverlay"></div>

            <!-- 心跳特效 -->
            <div class="heartbeat-effect" id="heartbeatEffect">
                <div class="pulse-ring"></div>
                <div class="pulse-ring"></div>
            </div>

            <!-- 樱花粒子 -->
            <div class="sakura-container" id="sakuraContainer"></div>
        </div>
    </div>

    

<script>
// ============================================
    // 游戏配置
    // ============================================

    // ============================================
    // 存档管理系统
    // ============================================
    class SaveManager {
        constructor() {
            this.SAVE_KEY_PREFIX = 'tokimemo_save_';
            this.AUTO_SAVE_KEY = 'tokimemo_autosave';
            this.CONFIG_KEY = 'tokimemo_config';
            this.VERSION = '1.0.0';
            this.CHECKSUM_SALT = 'tokimemo_2024';
            this.isStorageAvailable = this.checkStorage();
        }

        checkStorage() {
            try {
                const test = '__test__';
                localStorage.setItem(test, test);
                localStorage.removeItem(test);
                return true;
            } catch (e) {
                console.warn('LocalStorage 不可用，存档功能将禁用');
                return false;
            }
        }

        sortObjectKeys(obj) {
            if (typeof obj !== 'object' || obj === null) return obj;
            if (Array.isArray(obj)) return obj.map(item => this.sortObjectKeys(item));
            
            return Object.keys(obj).sort().reduce((acc, key) => {
                acc[key] = this.sortObjectKeys(obj[key]);
                return acc;
            }, {});
        }

        calculateChecksum(data) {
            const sortedData = this.sortObjectKeys(data);
            const str = JSON.stringify(sortedData) + this.CHECKSUM_SALT;
            
            let hash = 5381;
            for (let i = 0; i < str.length; i++) {
                hash = ((hash << 5) + hash) + str.charCodeAt(i);
            }
            return (hash >>> 0).toString(16);
        }

        serializeGameState() {
            const saveData = {
                version: this.VERSION,
                timestamp: Date.now(),
                playtime: GameState.stats.totalPlayTime || 0,
                scene: GameState.currentScene || 'classroom',
                player: JSON.parse(JSON.stringify(GameState.player)),
                time: JSON.parse(JSON.stringify(GameState.time)),
                affections: JSON.parse(JSON.stringify(GameState.affections)),
                flags: JSON.parse(JSON.stringify(GameState.flags)),
                dialogue: {
                    current: GameState.dialogue.current,
                    currentIndex: GameState.dialogue.currentIndex
                },
                settings: JSON.parse(JSON.stringify(GameState.settings)),
                stats: JSON.parse(JSON.stringify(GameState.stats))
            };
            
            saveData.checksum = this.calculateChecksum({
                player: saveData.player,
                time: saveData.time,
                affections: saveData.affections
            });
            
            return JSON.stringify(saveData);
        }

        deserializeGameState(jsonString) {
            try {
                const data = JSON.parse(jsonString);
                if (!this.validateSaveData(data)) {
                    console.error('存档数据校验失败');
                    return null;
                }
                return data;
            } catch (e) {
                console.error('存档解析失败:', e);
                return null;
            }
        }

        validateSaveData(data) {
            if (!data || typeof data !== 'object') return false;
            if (!data.version || !data.timestamp) return false;
            if (!data.player || !data.time || !data.affections) return false;
            
            if (data.checksum) {
                const expectedChecksum = this.calculateChecksum({
                    player: data.player,
                    time: data.time,
                    affections: data.affections
                });
                if (data.checksum !== expectedChecksum) {
                    console.warn('存档校验和不匹配');
                }
            }
            
            if (!data.player.stats || typeof data.player.stats !== 'object') return false;
            if (typeof data.time.year !== 'number' || 
                typeof data.time.month !== 'number' ||
                typeof data.time.day !== 'number') return false;
            
            return true;
        }

        saveToSlot(slotIndex) {
            if (!this.isStorageAvailable) {
                return { success: false, message: '浏览器存储不可用' };
            }
            
            if (slotIndex < 0 || slotIndex >= CONFIG.MAX_SAVE_SLOTS) {
                return { success: false, message: '无效的存档槽位' };
            }
            
            try {
                const key = this.SAVE_KEY_PREFIX + slotIndex;
                const data = this.serializeGameState();
                localStorage.setItem(key, data);
                
                GameState.stats.saveCount++;
                
                return { success: true, message: '保存成功' };
            } catch (e) {
                console.error('保存失败:', e);
                if (e.name === 'QuotaExceededError') {
                    return { success: false, message: '存储空间不足' };
                }
                return { success: false, message: '保存失败: ' + e.message };
            }
        }

        loadFromSlot(slotIndex) {
            if (!this.isStorageAvailable) {
                return { success: false, message: '浏览器存储不可用' };
            }
            
            const key = this.SAVE_KEY_PREFIX + slotIndex;
            const data = localStorage.getItem(key);
            
            if (!data) {
                return { success: false, message: '存档不存在' };
            }
            
            const parsed = this.deserializeGameState(data);
            if (!parsed) {
                return { success: false, message: '存档数据损坏' };
            }
            
            this.applySaveData(parsed);
            
            return { success: true, message: '读取成功', data: parsed };
        }

        applySaveData(data) {
            GameState.currentScene = data.scene || 'classroom';
            GameState.player = JSON.parse(JSON.stringify(data.player));
            GameState.time = JSON.parse(JSON.stringify(data.time));
            GameState.affections = JSON.parse(JSON.stringify(data.affections));
            GameState.flags = data.flags ? JSON.parse(JSON.stringify(data.flags)) : {};
            GameState.dialogue = data.dialogue ? JSON.parse(JSON.stringify(data.dialogue)) : { current: null, currentIndex: 0, isTyping: false, textQueue: [], currentText: '' };
            GameState.settings = data.settings ? JSON.parse(JSON.stringify(data.settings)) : GameState.settings;
            GameState.stats = data.stats ? JSON.parse(JSON.stringify(data.stats)) : GameState.stats;
        }

        deleteSlot(slotIndex) {
            const key = this.SAVE_KEY_PREFIX + slotIndex;
            localStorage.removeItem(key);
            return { success: true, message: '删除成功' };
        }

        getSlotPreview(slotIndex) {
            const key = this.SAVE_KEY_PREFIX + slotIndex;
            const data = localStorage.getItem(key);
            
            if (!data) return null;
            
            const parsed = this.deserializeGameState(data);
            if (!parsed) return null;
            
            return {
                index: slotIndex,
                exists: true,
                timestamp: parsed.timestamp,
                scene: parsed.scene,
                sceneName: SceneNames[parsed.scene] || parsed.scene,
                player: parsed.player,
                time: parsed.time,
                playtime: parsed.playtime || 0
            };
        }

        getAllSaveSlots() {
            const slots = [];
            for (let i = 0; i < CONFIG.MAX_SAVE_SLOTS; i++) {
                const preview = this.getSlotPreview(i);
                if (preview) {
                    slots.push(preview);
                } else {
                    slots.push({ index: i, exists: false });
                }
            }
            return slots;
        }

        autoSave() {
            if (!this.isStorageAvailable) return { success: false };
            
            try {
                const data = this.serializeGameState();
                localStorage.setItem(this.AUTO_SAVE_KEY, data);
                return { success: true };
            } catch (e) {
                console.error('自动存档失败:', e);
                return { success: false };
            }
        }

        getAutoSave() {
            const data = localStorage.getItem(this.AUTO_SAVE_KEY);
            if (!data) return null;
            return this.deserializeGameState(data);
        }

        formatTimestamp(timestamp) {
            const date = new Date(timestamp);
            const year = date.getFullYear();
            const month = String(date.getMonth() + 1).padStart(2, '0');
            const day = String(date.getDate()).padStart(2, '0');
            const hour = String(date.getHours()).padStart(2, '0');
            const minute = String(date.getMinutes()).padStart(2, '0');
            return `${year}/${month}/${day} ${hour}:${minute}`;
        }

        formatPlaytime(seconds) {
            if (!seconds || seconds < 0) return '0分钟';
            const hours = Math.floor(seconds / 3600);
            const mins = Math.floor((seconds % 3600) / 60);
            if (hours > 0) {
                return `${hours}小时${mins}分钟`;
            }
            return `${mins}分钟`;
        }

        saveSettings() {
            try {
                localStorage.setItem(this.CONFIG_KEY, JSON.stringify(GameState.settings));
                return true;
            } catch (e) {
                return false;
            }
        }

        loadSettings() {
            try {
                const data = localStorage.getItem(this.CONFIG_KEY);
                if (data) {
                    GameState.settings = { ...GameState.settings, ...JSON.parse(data) };
                }
                return true;
            } catch (e) {
                return false;
            }
        }
    }
