<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>忍者必须死 - 跑酷游戏</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #111;
            font-family: 'Arial', sans-serif;
            overflow: hidden;
        }
        
        #gameContainer {
            position: relative;
            width: 800px;
            height: 400px;
            border: 2px solid #333;
            box-shadow: 0 0 20px rgba(0, 255, 0, 0.3);
        }
        
        #gameCanvas {
            background-color: #222;
            display: block;
        }
        
        #gameInfo {
            position: absolute;
            top: 10px;
            left: 10px;
            color: #0f0;
            font-size: 16px;
            text-shadow: 0 0 5px rgba(0, 255, 0, 0.5);
        }
        
        #gameOver {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background-color: rgba(0, 0, 0, 0.8);
            color: #0f0;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
            display: none;
            border: 2px solid #0f0;
            box-shadow: 0 0 15px rgba(0, 255, 0, 0.5);
        }
        
        button {
            background-color: #0f0;
            color: #000;
            border: none;
            padding: 10px 20px;
            margin-top: 10px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s;
        }
        
        button:hover {
            background-color: #0a0;
            box-shadow: 0 0 10px rgba(0, 255, 0, 0.7);
        }
    </style>
</head>
<body>
    <div id="gameContainer">
        <canvas id="gameCanvas" width="800" height="400"></canvas>
        <div id="gameInfo">
            <div>分数: <span id="score">0</span></div>
            <div>生命: <span id="lives">3</span></div>
        </div>
        <div id="gameOver">
            <h2>游戏结束</h2>
            <p>最终分数: <span id="finalScore">0</span></p>
            <button id="restartBtn">重新开始</button>
        </div>
    </div>

    <script>
        // 游戏基础框架代码
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreElement = document.getElementById('score');
        const livesElement = document.getElementById('lives');
        const gameOverElement = document.getElementById('gameOver');
        const finalScoreElement = document.getElementById('finalScore');
        const restartBtn = document.getElementById('restartBtn');

        // 游戏状态
        let gameState = {
            isRunning: true,
            score: 0,
            lives: 3,
            gameSpeed: 5,
            gravity: 0.5,
            groundHeight: 350
        };

        // 忍者角色
        const ninja = {
            x: 100,
            y: gameState.groundHeight,
            width: 40,
            height: 60,
            velocityY: 0,
            isJumping: false,
            color: '#0f0', // 绿色忍者
            draw: function() {
                ctx.fillStyle = this.color;
                // 绘制忍者身体
                ctx.fillRect(this.x, this.y, this.width, this.height);
                
                // 绘制忍者头部
                ctx.fillStyle = '#0a0';
                ctx.fillRect(this.x + 5, this.y - 15, 30, 20);
                
                // 绘制忍者眼睛
                ctx.fillStyle = '#fff';
                ctx.fillRect(this.x + 10, this.y - 10, 5, 5);
                ctx.fillRect(this.x + 25, this.y - 10, 5, 5);
                
                // 绘制忍者武器
                ctx.fillStyle = '#888';
                ctx.fillRect(this.x + this.width, this.y + 20, 15, 5);
            },
            update: function() {
                // 应用重力
                this.velocityY += gameState.gravity;
                this.y += this.velocityY;
                
                // 地面碰撞检测
                if (this.y > gameState.groundHeight) {
                    this.y = gameState.groundHeight;
                    this.velocityY = 0;
                    this.isJumping = false;
                }
            },
            jump: function() {
                if (!this.isJumping) {
                    this.velocityY = -12;
                    this.isJumping = true;
                }
            }
        };

        // 障碍物数组
        let obstacles = [];

        // 粒子效果数组
        let particles = [];

        // 背景元素
        let backgroundElements = [];

        // 初始化背景元素
        function initBackground() {
            for (let i = 0; i < 5; i++) {
                backgroundElements.push({
                    x: Math.random() * canvas.width,
                    y: Math.random() * canvas.height * 0.5,
                    width: 20 + Math.random() * 30,
                    height: 20 + Math.random() * 30,
                    speed: 1 + Math.random() * 2
                });
            }
        }

        // 创建障碍物
        function createObstacle() {
            const height = 30 + Math.random() * 50;
            obstacles.push({
                x: canvas.width,
                y: gameState.groundHeight - height,
                width: 20,
                height: height,
                color: '#f00'
            });
        }

        // 创建粒子效果
        function createParticle(x, y) {
            for (let i = 0; i < 10; i++) {
                particles.push({
                    x: x,
                    y: y,
                    velocityX: -2 + Math.random() * 4,
                    velocityY: -5 + Math.random() * 2,
                    size: 2 + Math.random() * 3,
                    life: 20 + Math.random() * 30,
                    color: `hsl(${Math.random() * 60 + 90}, 100%, 50%)`
                });
            }
        }

        // 更新背景
        function updateBackground() {
            backgroundElements.forEach(element => {
                element.x -= element.speed;
                if (element.x + element.width < 0) {
                    element.x = canvas.width;
                    element.y = Math.random() * canvas.height * 0.5;
                }
            });
        }

        // 绘制背景
        function drawBackground() {
            // 绘制天空渐变
            const gradient = ctx.createLinearGradient(0, 0, 0, canvas.height);
            gradient.addColorStop(0, '#1a1a2e');
            gradient.addColorStop(1, '#16213e');
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            // 绘制背景元素
            ctx.fillStyle = 'rgba(0, 255, 0, 0.1)';
            backgroundElements.forEach(element => {
                ctx.fillRect(element.x, element.y, element.width, element.height);
            });
            
            // 绘制地面
            ctx.fillStyle = '#333';
            ctx.fillRect(0, gameState.groundHeight, canvas.width, canvas.height - gameState.groundHeight);
            
            // 绘制地面纹理
            ctx.strokeStyle = '#444';
            ctx.lineWidth = 1;
            for (let i = 0; i < canvas.width; i += 20) {
                ctx.beginPath();
                ctx.moveTo(i, gameState.groundHeight);
                ctx.lineTo(i + 10, gameState.groundHeight + 10);
                ctx.stroke();
            }
        }

        // 更新障碍物
        function updateObstacles() {
            // 移动障碍物
            obstacles.forEach(obstacle => {
                obstacle.x -= gameState.gameSpeed;
            });
            
            // 移除屏幕外的障碍物
            obstacles = obstacles.filter(obstacle => obstacle.x + obstacle.width > 0);
            
            // 随机生成新障碍物
            if (Math.random() < 0.02) {
                createObstacle();
            }
        }

        // 绘制障碍物
        function drawObstacles() {
            obstacles.forEach(obstacle => {
                ctx.fillStyle = obstacle.color;
                ctx.fillRect(obstacle.x, obstacle.y, obstacle.width, obstacle.height);
                
                // 添加阴影效果
                ctx.fillStyle = 'rgba(0, 0, 0, 0.3)';
                ctx.fillRect(obstacle.x, obstacle.y + obstacle.height, obstacle.width, 5);
            });
        }

        // 更新粒子
        function updateParticles() {
            particles.forEach(particle => {
                particle.x += particle.velocityX;
                particle.y += particle.velocityY;
                particle.velocityY += 0.2; // 重力
                particle.life--;
            });
            
            // 移除生命周期结束的粒子
            particles = particles.filter(particle => particle.life > 0);
        }

        // 绘制粒子
        function drawParticles() {
            particles.forEach(particle => {
                ctx.fillStyle = particle.color;
                ctx.globalAlpha = particle.life / 50;
                ctx.fillRect(particle.x, particle.y, particle.size, particle.size);
                ctx.globalAlpha = 1;
            });
        }

        // 碰撞检测
        function checkCollision() {
            obstacles.forEach((obstacle, index) => {
                if (
                    ninja.x < obstacle.x + obstacle.width &&
                    ninja.x + ninja.width > obstacle.x &&
                    ninja.y < obstacle.y + obstacle.height &&
                    ninja.y + ninja.height > obstacle.y
                ) {
                    // 碰撞发生
                    createParticle(ninja.x + ninja.width / 2, ninja.y + ninja.height / 2);
                    obstacles.splice(index, 1);
                    gameState.lives--;
                    livesElement.textContent = gameState.lives;
                    
                    if (gameState.lives <= 0) {
                        gameOver();
                    }
                }
            });
        }

        // 更新分数
        function updateScore() {
            gameState.score++;
            scoreElement.textContent = gameState.score;
            
            // 随着分数增加，游戏速度逐渐加快
            if (gameState.score % 500 === 0) {
                gameState.gameSpeed += 0.5;
            }
        }

        // 游戏结束
        function gameOver() {
            gameState.isRunning = false;
            finalScoreElement.textContent = gameState.score;
            gameOverElement.style.display = 'block';
        }

        // 重新开始游戏
        function restartGame() {
            gameState = {
                isRunning: true,
                score: 0,
                lives: 3,
                gameSpeed: 5,
                gravity: 0.5,
                groundHeight: 350
            };
            
            ninja.x = 100;
            ninja.y = gameState.groundHeight;
            ninja.velocityY = 0;
            ninja.isJumping = false;
            
            obstacles = [];
            particles = [];
            
            scoreElement.textContent = gameState.score;
            livesElement.textContent = gameState.lives;
            gameOverElement.style.display = 'none';
            
            gameLoop();
        }

        // 游戏主循环
        function gameLoop() {
            if (!gameState.isRunning) return;
            
            // 清空画布
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // 更新和绘制背景
            updateBackground();
            drawBackground();
            
            // 更新和绘制游戏元素
            ninja.update();
            ninja.draw();
            
            updateObstacles();
            drawObstacles();
            
            updateParticles();
            drawParticles();
            
            // 碰撞检测
            checkCollision();
            
            // 更新分数
            updateScore();
            
            // 继续游戏循环
            requestAnimationFrame(gameLoop);
        }

        // 键盘控制
        document.addEventListener('keydown', (e) => {
            if (e.code === 'Space') {
                e.preventDefault();
                ninja.jump();
            }
        });

        // 触摸控制（移动设备）
        canvas.addEventListener('touchstart', (e) => {
            e.preventDefault();
            ninja.jump();
        });

        // 点击控制
        canvas.addEventListener('click', () => {
            ninja.jump();
        });

        // 重新开始按钮
        restartBtn.addEventListener('click', restartGame);

        // 初始化游戏
        initBackground();
        gameLoop();
    </script>
</body>
</html>
