<div id="scoreDisplay" class="hidden">分数: 0</div>

<script>

// ========== 全局变量初始化 ==========
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

let width = window.innerWidth;
let height = window.innerHeight;
canvas.width = width;
canvas.height = height;

// 游戏状态
let gameRunning = false;
let score = 0;
let highScore = 0;
let difficultyLevel = 1;
let frameCount = 0;
let killCount = 0;

// 玩家对象
const player = {
  x: 0,
  y: 0,
  width: 28,
  height: 28,
  speed: 5,
  trail: [],
  invincible: false,
  invincibleTimer: 0,
  shootCooldown: 0
};

// 弹幕数组
let bullets = [];
let playerBullets = [];
let monsters = [];
let particles = [];
let stars = [];

// 击杀奖励时间
let powerUpTimer = 0;
let isPowerUp = false;

// 弹幕发射器配置
const bulletConfig = {
  spawnInterval: 25,
  baseSpeed: 2.5,
  speedVariation: 1.5,
  patterns: ['rain', 'spread', 'spiral', 'side', 'cross'],
  currentPattern: 0,
  patternTimer: 0,
  patternDuration: 400
};

// 键盘状态
const keys = {
  ArrowLeft: false,
  ArrowRight: false,
  ArrowUp: false,
  ArrowDown: false,
  a: false,
  d: false,
  w: false,
  s: false,
  ' ': false
};

// 鼠标状态
const mouse = {
  isDown: false,
  x: 0,
  y: 0
};

// 性能限制
const MAX_PARTICLES = 150;
const MAX_BULLETS = 200;
const MAX_PLAYER_BULLETS = 100;
const MAX_MONSTERS = 15;
const MAX_TRAIL_LENGTH = 12;

// ========== 怪物系统 ==========
const monsterManager = {
  spawnTimer: 0,
  spawnInterval: 120,
  
  types: {
    basic: { hp: 30, speed: 1.5, size: 20, color: '#ff6b6b', score: 10 },
    fast: { hp: 20, speed: 3, size: 15, color: '#ffaa00', score: 15 },
    tank: { hp: 80, speed: 0.8, size: 30, color: '#aa66ff', score: 25 }
  },
  
  spawn() {
    if (monsters.length >= MAX_MONSTERS) return;
    
    const typeKeys = Object.keys(this.types);
    const typeKey = typeKeys[Math.floor(Math.random() * typeKeys.length)];
    const type = this.types[typeKey];
    
    const scaledHp = Math.floor(type.hp * (1 + difficultyLevel * 0.15));
    
    let x, y;
    const side = Math.floor(Math.random() * 4);
    switch(side) {
      case 0: x = Math.random() * width; y = -type.size; break;
      case 1: x = width + type.size; y = Math.random() * height; break;
      case 2: x = Math.random() * width; y = height + type.size; break;
      case 3: x = -type.size; y = Math.random() * height; break;
    }
    
    monsters.push({
      x: x,
      y: y,
      hp: scaledHp,
      maxHp: scaledHp,
      speed: type.speed,
      size: type.size,
      color: type.color,
      score: type.score
    });
  },
  
  update() {
    this.spawnTimer++;
    const adjustedInterval = Math.max(40, this.spawnInterval - difficultyLevel * 8);
    if (this.spawnTimer >= adjustedInterval) {
      this.spawn();
      this.spawnTimer = 0;
    }
  }
};

// ========== 初始化函数 ==========
function initGame() {
  console.log('[DEBUG] initGame 被调用');
  
  player.x = width / 2;
  player.y = height / 2;
  player.trail = [];
  player.invincible = false;
  player.invincibleTimer = 0;
  player.shootCooldown = 0;
  
  bullets = [];
  playerBullets = [];
  monsters = [];
  particles = [];
  
  score = 0;
  difficultyLevel = 1;
  frameCount = 0;
  killCount = 0;
  powerUpTimer = 0;
  isPowerUp = false;
  
  bulletConfig.currentPattern = 0;
  bulletConfig.patternTimer = 0;
  monsterManager.spawnTimer = 0;
  
  initStars();
  
  document.getElementById('scoreDisplay').classList.remove('hidden');
  document.getElementById('killDisplay').classList.remove('hidden');
  document.getElementById('difficultyDisplay').classList.remove('hidden');
  
  console.log('[DEBUG] initGame 完成');
}

// ========== 星空背景 ==========
function initStars() {
  stars = [];
  for (let i = 0; i < 100; i++) {
    stars.push({
      x: Math.random() * width,
      y: Math.random() * height,
      size: Math.random() * 2 + 0.5,
      speed: Math.random() * 0.5 + 0.1,
      brightness: Math.random()
    });
  }
}

// ========== 弹幕系统 ==========
const bulletSystem = {
  types: ['rain', 'spread', 'spiral', 'side', 'cross'],
  currentType: 0,
  timer: 0,
  
  cycleType() {
    this.currentType = (this.currentType + 1) % this.types.length;
  },
  
  spawn() {
    if (bullets.length >= MAX_BULLETS) return;
    
    const pattern = this.types[this.currentType];
    const baseSpeed = bulletConfig.baseSpeed + difficultyLevel * 0.3;
    
    switch(pattern) {
      case 'rain':
        this.spawnRain(baseSpeed);
        break;
      case 'spread':
        this.spawnSpread(baseSpeed);
        break;
      case 'spiral':
        this.spawnSpiral(baseSpeed);
        break;
      case 'side':
        this.spawnSide(baseSpeed);
        break;
      case 'cross':
        this.spawnCross(baseSpeed);
        break;
    }
  },
  
  spawnRain(speed) {
    const x = Math.random() * width;
    bullets.push({
      x: x,
      y: -10,
      vx: (Math.random() - 0.5) * 2,
      vy: speed + Math.random() * 2,
      size: 6,
      color: `hsl(${180 + Math.random() * 60}, 100%, 60%)`
    });
  },
  
  spawnSpread(speed) {
    const centerX = width / 2;
    for (let i = 0; i < 5; i++) {
      const angle = (Math.PI / 6) * (i - 2);
      bullets.push({
        x: centerX,
        y: -10,
        vx: Math.sin(angle) * speed * 1.5,
        vy: Math.cos(angle) * speed,
        size: 5,
        color: `hsl(${280 + Math.random() * 40}, 100%, 65%)`
      });
    }
  },
  
  spawnSpiral(speed) {
    const angle = frameCount * 0.1;
    const centerX = width / 2;
    bullets.push({
      x: centerX,
      y: height / 2,
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed,
      size: 5,
      color: `hsl(${(frameCount * 2) % 360}, 100%, 60%)`
    });
  },
  
  spawnSide(speed) {
    const side = Math.random() > 0.5 ? -10 : width + 10;
    const dir = side < 0 ? 1 : -1;
    bullets.push({
      x: side,
      y: Math.random() * height,
      vx: dir * speed,
      vy: (Math.random() - 0.5) * 2,
      size: 6,
      color: `hsl(${30 + Math.random() * 30}, 100%, 55%)`
    });
  },
  
  spawnCross(speed) {
    if (frameCount % 60 === 0) {
      for (let i = 0; i < 4; i++) {
        const angle = (Math.PI / 2) * i;
        bullets.push({
          x: width / 2,
          y: height / 2,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed,
          size: 7,
          color: '#ff3366'
        });
      }
    }
  },
  
  update() {
    this.timer++;
    const interval = Math.max(10, bulletConfig.spawnInterval - difficultyLevel * 2);
    if (this.timer >= interval) {
      this.spawn();
      this.timer = 0;
    }
    
    this.timer++;
    if (this.timer > bulletConfig.patternDuration) {
      this.cycleType();
      this.timer = 0;
    }
  }
};

// ========== 玩家弹幕发射 ==========
function shootPlayerBullet() {
  if (playerBullets.length >= MAX_PLAYER_BULLETS) return;
  if (player.shootCooldown > 0) return;
  
  player.shootCooldown = isPowerUp ? 3 : 8;
  
  const angle = Math.atan2(mouse.y - player.y, mouse.x - player.x);
  const speed = 10;
  
  if (isPowerUp) {
    for (let i = -1; i <= 1; i++) {
      const spreadAngle = angle + i * 0.2;
      playerBullets.push({
        x: player.x,
        y: player.y,
        vx: Math.cos(spreadAngle) * speed,
        vy: Math.sin(spreadAngle) * speed,
        size: 6,
        damage: 15
      });
    }
  } else {
    playerBullets.push({
      x: player.x,
      y: player.y,
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed,
      size: 5,
      damage: 10
    });
  }
}

// ========== 游戏主循环 ==========
function gameLoop() {
  if (!gameRunning) return;
  
  frameCount++;
  
  update();
  render();
  
  requestAnimationFrame(gameLoop);
}

// ========== 更新逻辑 ==========
function update() {
  updatePlayer();
  updateBullets();
  updatePlayerBullets();
  updateMonsters();
  updateParticles();
  updateStars();
  
  bulletSystem.update();
  monsterManager.update();
  
  // 难度提升
  if (killCount > 0 && killCount % 10 === 0 && difficultyLevel < Math.floor(killCount / 10) + 1) {
    difficultyLevel = Math.floor(killCount / 10) + 1;
  }
  
  // PowerUp 效果
  if (isPowerUp) {
    powerUpTimer--;
    if (powerUpTimer <= 0) {
      isPowerUp = false;
    }
  }
  
  // 更新UI
  document.getElementById('scoreDisplay').textContent = `分数: ${score}`;
  document.getElementById('killDisplay').textContent = `击杀: ${killCount}`;
  document.getElementById('difficultyDisplay').textContent = `难度: ${difficultyLevel}`;
  
  // 射击
  if ((mouse.isDown || keys[' ']) && gameRunning) {
    shootPlayerBullet();
  }
  
  if (player.shootCooldown > 0) player.shootCooldown--;
}

// ========== 玩家更新 ==========
function updatePlayer() {
  let dx = 0;
  let dy = 0;
  
  // 键盘控制
  if (keys.ArrowLeft || keys.a) dx -= player.speed;
  if (keys.ArrowRight || keys.d) dx += player.speed;
  if (keys.ArrowUp || keys.w) dy -= player.speed;
  if (keys.ArrowDown || keys.s) dy += player.speed;
  
  // 鼠标拖动控制
  if (mouse.isDown && !keys[' ']) {
    const distX = mouse.x - player.x;
    const distY = mouse.y - player.y;
    const dist = Math.sqrt(distX * distX + distY * distY);
    if (dist > 5) {
      dx = (distX / dist) * player.speed;
      dy = (distY / dist) * player.speed;
    }
  }
  
  player.x += dx;
  player.y += dy;
  
  // 边界限制
  player.x = Math.max(player.width/2, Math.min(width - player.width/2, player.x));
  player.y = Math.max(player.height/2, Math.min(height - player.height/2, player.y));
  
  // 轨迹
  player.trail.push({ x: player.x, y: player.y });
  if (player.trail.length > MAX_TRAIL_LENGTH) {
    player.trail.shift();
  }
  
  // 无敌时间
  if (player.invincible) {
    player.invincibleTimer--;
    if (player.invincibleTimer <= 0) {
      player.invincible = false;
    }
  }
  
  // 受伤闪烁计时
  if (player.isHurt) {
    player.hurtTimer--;
    if (player.hurtTimer <= 0) {
      player.isHurt = false;
    }
  }
  
  // 碰撞检测
  if (!player.invincible && player.hp > 0) {
    for (let bullet of bullets) {
      const dist = Math.sqrt((player.x - bullet.x) ** 2 + (player.y - bullet.y) ** 2);
      if (dist < player.width/2 + bullet.size) {
        takeDamage();
        break;
      }
    }
  }
}

// ========== 弹幕更新 ==========
function updateBullets() {
  for (let i = bullets.length - 1; i >= 0; i--) {
    const b = bullets[i];
    b.x += b.vx;
    b.y += b.vy;
    
    if (b.x < -50 || b.x > width + 50 || b.y < -50 || b.y > height + 50) {
      bullets.splice(i, 1);
    }
  }
}

// ========== 玩家弹幕更新 ==========
function updatePlayerBullets() {
  for (let i = playerBullets.length - 1; i >= 0; i--) {
    const b = playerBullets[i];
    b.x += b.vx;
    b.y += b.vy;
    
    if (b.x < -50 || b.x > width + 50 || b.y < -50 || b.y > height + 50) {
      playerBullets.splice(i, 1);
      continue;
    }
    
    // 怪物碰撞
    for (let j = monsters.length - 1; j >= 0; j--) {
      const m = monsters[j];
      const dist = Math.sqrt((b.x - m.x) ** 2 + (b.y - m.y) ** 2);
      if (dist < b.size + m.size) {
        m.hp -= b.damage;
        playerBullets.splice(i, 1);
        
        // 击杀粒子
        for (let k = 0; k < 5; k++) {
          if (particles.length < MAX_PARTICLES) {
            particles.push({
              x: b.x,
              y: b.y,
              vx: (Math.random() - 0.5) * 5,
              vy: (Math.random() - 0.5) * 5,
              size: Math.random() * 4 + 2,
              color: m.color,
              life: 1
            });
          }
        }
        
        if (m.hp <= 0) {
          killMonster(j);
        }
        break;
      }
    }
  }
}

// ========== 怪物更新 ==========
function updateMonsters() {
  for (let m of monsters) {
    const dx = player.x - m.x;
    const dy = player.y - m.y;
    const dist = Math.sqrt(dx * dx + dy * dy);
    if (dist > 0) {
      m.x += (dx / dist) * m.speed;
      m.y += (dy / dist) * m.speed;
    }
  }

      if (dist < player.width/2 + m.size) {
        takeDamage();
        break;
      }
    }
  }
}

function updateParticles() {

const player = {

// DOM 元素引用
const healthBar = document.getElementById('healthBar');
const healthText = document.getElementById('healthText');
const healthBarContainer = document.getElementById('healthBarContainer');
const gameOverOverlay = document.getElementById('gameOverOverlay');

// ========== 受伤处理 ==========
function takeDamage() {
  if (player.invincible || player.hp <= 0) return;
  
  player.hp -= 20;
  player.invincible = true;
  player.invincibleTimer = 60;
  player.isHurt = true;
  player.hurtTimer = 10;
  
  // 更新血条显示
  updateHealthBar();
  
  // 屏幕震动效果
  canvas.classList.add('screen-shake');
  setTimeout(() => canvas.classList.remove('screen-shake'), 200);
  
  // 受伤粒子效果
  for (let i = 0; i < 15; i++) {
    if (particles.length < MAX_PARTICLES) {
      particles.push({
        x: player.x,
        y: player.y,
        vx: (Math.random() - 0.5) * 8,
        vy: (Math.random() - 0.5) * 8,
        size: Math.random() * 6 + 3,
        color: '#ff4444',
        life: 1
      });
    }
  }
  
  // 检测游戏结束
  if (player.hp <= 0) {
    player.hp = 0;
    gameOver();
  }
}

// ========== 更新血条显示 ==========
function updateHealthBar() {
  const percent = Math.max(0, (player.hp / player.maxHp) * 100);
  healthBar.style.width = percent + '%';
  healthText.textContent = Math.max(0, player.hp) + ' / ' + player.maxHp;
  
  // 低血量警告
  if (percent <= 30) {
    healthBar.style.background = 'linear-gradient(90deg, #ff0000, #ff4444)';
    healthBar.style.animation = 'damageFlash 0.5s infinite';
  } else if (percent <= 50) {
    healthBar.style.background = 'linear-gradient(90deg, #ff6600, #ffaa00)';
    healthBar.style.animation = 'none';
  } else {
    healthBar.style.background = 'linear-gradient(90deg, #ff4444, #ff6b6b)';
    healthBar.style.animation = 'none';
  }
}

// ========== 游戏结束 ==========
function gameOver() {
  gameRunning = false;
  
  // 显示游戏结束界面
  finalScoreEl.textContent = score;
  finalKillsEl.textContent = killCount;
  gameOverOverlay.classList.remove('hidden');
  
  // 隐藏游戏UI
  document.getElementById('scoreDisplay').classList.add('hidden');
  document.getElementById('killDisplay').classList.add('hidden');
  document.getElementById('difficultyDisplay').classList.add('hidden');
  healthBarContainer.classList.add('hidden');
  healthText.classList.add('hidden');
}

// ========== 重新开始游戏 ==========
function restartGame() {
  // 重置玩家状态
  resetPlayer();
  
  // 重置游戏状态
  score = 0;
  killCount = 0;
  difficultyLevel = 1;
  frameCount = 0;
  
  // 清空所有实体
  bullets = [];
  playerBullets = [];
  monsters = [];
  particles = [];
  
  // 重置弹幕配置
  bulletConfig.currentPattern = 0;
  bulletConfig.patternTimer = 0;
  
  // 隐藏游戏结束界面
  if (gameOverOverlay) gameOverOverlay.classList.add('hidden');
  
  // 显示游戏UI
  document.getElementById('scoreDisplay').classList.remove('hidden');
  document.getElementById('killDisplay').classList.remove('hidden');
  document.getElementById('difficultyDisplay').classList.remove('hidden');
  if (healthBarContainer) healthBarContainer.classList.remove('hidden');
  if (healthText) healthText.classList.remove('hidden');
  
  // 更新显示
  updateHealthBar();
  document.getElementById('scoreDisplay').textContent = '分数: 0';
  document.getElementById('killDisplay').textContent = '击杀: 0';
  document.getElementById('difficultyDisplay').textContent = '难度: 1';
  
  // 开始游戏
  gameRunning = true;
  requestAnimationFrame(gameLoop);
}

// ========== 重置玩家状态 ==========
function resetPlayer() {
  player.x = width / 2;
  player.y = height / 2;
  player.hp = player.maxHp;
  player.invincible = false;
  player.invincibleTimer = 0;
  player.isHurt = false;
  player.hurtTimer = 0;
  player.trail = [];
  player.shootCooldown = 0;
}

// ========== 渲染玩家血条（Canvas内） ==========
function renderPlayerHealthBar() {
  const barWidth = 50;
  const barHeight = 6;
  const barX = player.x - barWidth / 2;
  const barY = player.y - player.height / 2 - 15;
  
  // 背景
  ctx.fillStyle = 'rgba(0, 0, 0, 0.6)';
  ctx.fillRect(barX, barY, barWidth, barHeight);
  
  // 血量
  const percent = player.hp / player.maxHp;
  let healthColor;
  if (percent > 0.5) {
    healthColor = '#00ff88';
  } else if (percent > 0.3) {
    healthColor = '#ffaa00';
  } else {
    healthColor = '#ff4444';
  }
  
  ctx.fillStyle = healthColor;
  ctx.fillRect(barX, barY, barWidth * percent, barHeight);
  
  // 边框
  ctx.strokeStyle = '#fff';
  ctx.lineWidth = 1;
  ctx.strokeRect(barX, barY, barWidth, barHeight);
}

  y: 0,
  width: 28,
  height: 28,
  speed: 5,

  invincible: false,

  takeDamage(amount) {
    if (this.invincible) return;
    
    this.hp -= amount;
    this.invincible = true;
    this.invincibleTimer = 60;
    this.isHurt = true;

    if (this.hp <= 0) {

// 玩家对象（完整定义）
const player = {
  x: 0,
  y: 0,
  width: 28,
  height: 28,
  speed: 5,
  trail: [],
  invincible: false,
  invincibleTimer: 0,
  shootCooldown: 0,
  hp: 100,
  maxHp: 100,
  isHurt: false,
  hurtTimer: 0,
  
  takeDamage(amount) {
    if (this.invincible || !gameRunning) return;
    
    this.hp -= amount;
    this.invincible = true;
    this.invincibleTimer = 60;
    this.isHurt = true;
    this.hurtTimer = 10;
    
    // 更新血条显示
    updateHealthBar();
    
    // 产生受伤粒子效果
    for (let i = 0; i < 8; i++) {
      particles.push({
        x: this.x,
        y: this.y,
        vx: (Math.random() - 0.5) * 6,
        vy: (Math.random() - 0.5) * 6,
        life: 30,
        maxLife: 30,
        color: '#ff4444',
        size: 4
      });
    }
    
    // 检查是否死亡
    if (this.hp <= 0) {
      this.hp = 0;
      triggerGameOver();
    }
  }
};

function startGame() {
  // 初始化 DOM 引用
  initDOMReferences();
  
  // 重置玩家状态
  resetPlayer();
  
  // 重置游戏状态
  score = 0;
  killCount = 0;
  difficultyLevel = 1;

  // 清空所有实体

  updateHealthBar();
  document.getElementById('scoreDisplay').textContent = '分数: 0';
  document.getElementById('killDisplay').textContent = '击杀: 0';

// ========== DOM 元素引用初始化 ==========
let healthBarContainer, healthBar, healthText;
let gameOverOverlay, finalScoreEl, finalKillsEl, restartBtn;

// 初始化 DOM 引用（在 DOMContentLoaded 后调用）
function initDOMReferences() {
  healthBarContainer = document.getElementById('healthBarContainer');
  healthBar = document.getElementById('healthBar');
  healthText = document.getElementById('healthText');
  gameOverOverlay = document.getElementById('gameOverOverlay');
  finalScoreEl = document.getElementById('finalScore');
  finalKillsEl = document.getElementById('finalKills');
  restartBtn = document.getElementById('restartBtn');
  
  // 绑定重新开始按钮事件
  if (restartBtn) {
    restartBtn.addEventListener('click', restartGame);
  }
}

// ========== 更新血条显示 ==========
function updateHealthBar() {
  if (!healthBar || !healthText) return;
  
  const percent = Math.max(0, player.hp / player.maxHp);
  healthBar.style.width = (percent * 100) + '%';
  healthText.textContent = `HP: ${Math.max(0, player.hp)}/${player.maxHp}`;
  
  // 根据血量改变颜色
  if (percent > 0.5) {
    healthBar.style.background = 'linear-gradient(90deg, #00ff88, #00ffcc)';
  } else if (percent > 0.3) {
    healthBar.style.background = 'linear-gradient(90deg, #ffaa00, #ffcc00)';
  } else {
    healthBar.style.background = 'linear-gradient(90deg, #ff4444, #ff6666)';
  }
}

// ========== 游戏结束触发函数 ==========
function triggerGameOver() {
  if (!gameRunning) return;
  
  gameRunning = false;
  
  // 产生死亡爆炸效果
  for (let i = 0; i < 30; i++) {
    particles.push({
      x: player.x,
      y: player.y,
      vx: (Math.random() - 0.5) * 12,
      vy: (Math.random() - 0.5) * 12,
      life: 60,
      maxLife: 60,
      color: ['#00ffcc', '#ff4444', '#ffaa00'][Math.floor(Math.random() * 3)],
      size: Math.random() * 6 + 2
    });
  }
  
  // 延迟显示游戏结束界面（让爆炸效果播放）
  setTimeout(() => {
    showGameOverScreen();
  }, 500);
}

// ========== 显示游戏结束界面 ==========
function showGameOverScreen() {
  // 更新最终分数显示
  if (finalScoreEl) finalScoreEl.textContent = score;
  if (finalKillsEl) finalKillsEl.textContent = killCount;
  
  // 显示游戏结束界面
  if (gameOverOverlay) gameOverOverlay.classList.remove('hidden');
  
  // 隐藏游戏UI
  document.getElementById('scoreDisplay').classList.add('hidden');
  document.getElementById('killDisplay').classList.add('hidden');
  document.getElementById('difficultyDisplay').classList.add('hidden');
  if (healthBarContainer) healthBarContainer.classList.add('hidden');
  if (healthText) healthText.classList.add('hidden');
}
