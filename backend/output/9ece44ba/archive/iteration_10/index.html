<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>灵画师躲避弹幕</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }
  body {
    overflow: hidden;
    background: #0a0a1a;
    font-family: 'Microsoft YaHei', sans-serif;
  }
  canvas {
    display: block;
  }
  #gameOverlay {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(10, 10, 26, 0.95);
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    z-index: 100;
  }
  #gameOverlay h1 {
    color: #00ffcc;
    font-size: 52px;
    margin-bottom: 20px;
    text-shadow: 0 0 30px rgba(0, 255, 204, 0.6);
    letter-spacing: 8px;
  }
  #gameOverlay p {
    color: rgba(255, 255, 255, 0.8);
    font-size: 18px;
    margin-bottom: 40px;
    line-height: 1.8;
    text-align: center;
  }
  #startBtn {
    padding: 18px 60px;
    font-size: 20px;
    background: linear-gradient(135deg, #00ffcc, #0088ff);
    border: none;
    border-radius: 40px;
    color: #0a0a1a;
    cursor: pointer;
    font-weight: bold;
    transition: transform 0.2s, box-shadow 0.2s;
    letter-spacing: 2px;
  }
  #startBtn:hover {
    transform: scale(1.08);
    box-shadow: 0 0 40px rgba(0, 255, 204, 0.5);
  }
  .hidden {
    display: none !important;
  }
  #scoreDisplay {
    position: fixed;
    top: 20px;
    left: 20px;
    color: #00ffcc;
    font-size: 24px;
    font-weight: bold;
    text-shadow: 0 0 10px rgba(0, 255, 204, 0.5);
    z-index: 50;
  }
  #killDisplay {
    position: fixed;
    top: 55px;
    left: 20px;
    color: #ff6b6b;
    font-size: 16px;
    z-index: 50;
  }
  #difficultyDisplay {
    position: fixed;
    top: 80px;
    left: 20px;
    color: #ffd700;
    font-size: 14px;
    z-index: 50;
  }
</style>
</head>
<body>

<div id="gameOverlay">
  <h1>灵画师</h1>
  <p>使用 <strong>鼠标拖动</strong> 或 方向键/WASD 控制角色移动<br>
  <strong>按住鼠标/空格</strong> 发射弹幕击杀怪物<br>
  击杀越多，怪物越强，弹幕也越强！</p>
  <button id="startBtn">开始游戏</button>
</div>

<div id="scoreDisplay" class="hidden">分数: 0</div>
<div id="killDisplay" class="hidden">击杀: 0</div>
<div id="difficultyDisplay" class="hidden">难度: 1</div>

<canvas id="gameCanvas"></canvas>


</body>
</html>



<script>


// ========== 全局变量初始化 ==========
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

let width = window.innerWidth;
let height = window.innerHeight;
canvas.width = width;
canvas.height = height;

// 游戏状态
let gameRunning = false;
let score = 0;
let highScore = 0;
let difficultyLevel = 1;
let frameCount = 0;
let killCount = 0;

// 玩家对象
const player = {
  x: 0,
  y: 0,
  width: 28,
  height: 28,
  speed: 5,
  trail: [],
  invincible: false,
  invincibleTimer: 0,
  shootCooldown: 0
};

// 弹幕数组
let bullets = [];
let playerBullets = [];
let monsters = [];
let particles = [];
let stars = [];

// 击杀奖励时间
let powerUpTimer = 0;
let isPowerUp = false;

// 弹幕发射器配置
const bulletConfig = {
  spawnInterval: 25,
  baseSpeed: 2.5,
  speedVariation: 1.5,
  patterns: ['rain', 'spread', 'spiral', 'side', 'cross'],
  currentPattern: 0,
  patternTimer: 0,
  patternDuration: 400
};

// 键盘状态
const keys = {
  ArrowLeft: false,
  ArrowRight: false,
  ArrowUp: false,
  ArrowDown: false,
  a: false,
  d: false,
  w: false,
  s: false,
  ' ': false
};

// 鼠标状态
const mouse = {
  isDown: false,
  x: 0,
  y: 0
};

// 性能限制
const MAX_PARTICLES = 150;
const MAX_BULLETS = 200;
const MAX_PLAYER_BULLETS = 100;
const MAX_MONSTERS = 15;
const MAX_TRAIL_LENGTH = 12;

// ========== 怪物系统 ==========
const monsterManager = {
  spawnTimer: 0,
  spawnInterval: 120,
  
  types: {
    basic: { hp: 30, speed: 1.5, size: 20, color: '#ff6b6b', score: 10 },
    fast: { hp: 20, speed: 3, size: 15, color: '#ffaa00', score: 15 },
    tank: { hp: 80, speed: 0.8, size: 30, color: '#aa66ff', score: 25 }
  },
  
  spawn() {
    if (monsters.length >= MAX_MONSTERS) return;
    
    const typeKeys = Object.keys(this.types);
    const typeKey = typeKeys[Math.floor(Math.random() * typeKeys.length)];
    const type = this.types[typeKey];
    
    const scaledHp = Math.floor(type.hp * (1 + difficultyLevel * 0.15));
    
    let x, y;
    const side = Math.floor(Math.random() * 4);
    switch(side) {
      case 0: x = Math.random() * width; y = -type.size; break;
      case 1: x = width + type.size; y = Math.random() * height; break;
      case 2: x = Math.random() * width; y = height + type.size; break;
      case 3: x = -type.size; y = Math.random() * height; break;
    }
    
    monsters.push({
      x: x,
      y: y,
      hp: scaledHp,
      maxHp: scaledHp,
      speed: type.speed,
      size: type.size,
      color: type.color,
      score: type.score
    });
  },
  
  update() {
    this.spawnTimer++;
    const adjustedInterval = Math.max(40, this.spawnInterval - difficultyLevel * 8);
    if (this.spawnTimer >= adjustedInterval) {
      this.spawn();
      this.spawnTimer = 0;
    }
  }
};

// ========== 初始化函数 ==========
function initGame() {
  console.log('[DEBUG] initGame 被调用');
  
  player.x = width / 2;
  player.y = height / 2;
  player.trail = [];
  player.invincible = false;
  player.invincibleTimer = 0;
  player.shootCooldown = 0;
  
  bullets = [];
  playerBullets = [];
  monsters = [];
  particles = [];
  
  score = 0;
  difficultyLevel = 1;
  frameCount = 0;
  killCount = 0;
  powerUpTimer = 0;
  isPowerUp = false;
  
  bulletConfig.currentPattern = 0;
  bulletConfig.patternTimer = 0;
  monsterManager.spawnTimer = 0;
  
  initStars();
  
  document.getElementById('scoreDisplay').classList.remove('hidden');
  document.getElementById('killDisplay').classList.remove('hidden');
  document.getElementById('difficultyDisplay').classList.remove('hidden');
  
  console.log('[DEBUG] initGame 完成');
}

// ========== 星空背景 ==========
function initStars() {
  console.log('[STARS] 初始化星空背景...');
  stars = [];
  for (let i = 0; i < 100; i++) {
    stars.push({
      x: Math.random() * width,
      y: Math.random() * height,
      size: Math.random() * 2 + 0.5,
      speed: Math.random() * 0.5 + 0.2,
      alpha: Math.random() * 0.5 + 0.3
    });
  }
  console.log('[STARS] 星空初始化完成，数量:', stars.length);
}

// ========== 弹幕系统 ==========
const bulletSystem = {
  types: ['rain', 'spread', 'spiral', 'side', 'cross'],
  currentType: 0,
  timer: 0,
  
  cycleType() {
    this.currentType = (this.currentType + 1) % this.types.length;
  },
  
  spawn() {
    if (bullets.length >= MAX_BULLETS) return;
    
    const pattern = this.types[this.currentType];
    const baseSpeed = bulletConfig.baseSpeed + difficultyLevel * 0.3;
    
    switch(pattern) {
      case 'rain':
        this.spawnRain(baseSpeed);
        break;
      case 'spread':
        this.spawnSpread(baseSpeed);
        break;
      case 'spiral':
        this.spawnSpiral(baseSpeed);
        break;
      case 'side':
        this.spawnSide(baseSpeed);
        break;
      case 'cross':
        this.spawnCross(baseSpeed);
        break;
    }
  },
  
  spawnRain(speed) {
    const x = Math.random() * width;
    bullets.push({
      x: x,
      y: -10,
      vx: (Math.random() - 0.5) * 2,
      vy: speed + Math.random() * 2,
      size: 6,
      color: `hsl(${180 + Math.random() * 60}, 100%, 60%)`
    });
  },
  
  spawnSpread(speed) {
    const centerX = width / 2;
    for (let i = 0; i < 5; i++) {
      const angle = (Math.PI / 6) * (i - 2);
      bullets.push({
        x: centerX,
        y: -10,
        vx: Math.sin(angle) * speed * 1.5,
        vy: Math.cos(angle) * speed,
        size: 5,
        color: `hsl(${280 + Math.random() * 40}, 100%, 65%)`
      });
    }
  },
  
  spawnSpiral(speed) {
    const angle = frameCount * 0.1;
    const centerX = width / 2;
    bullets.push({
      x: centerX,
      y: height / 2,
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed,
      size: 5,
      color: `hsl(${(frameCount * 2) % 360}, 100%, 60%)`
    });
  },
  
  spawnSide(speed) {
    const side = Math.random() > 0.5 ? -10 : width + 10;
    const dir = side < 0 ? 1 : -1;
    bullets.push({
      x: side,
      y: Math.random() * height,
      vx: dir * speed,
      vy: (Math.random() - 0.5) * 2,
      size: 6,
      color: `hsl(${30 + Math.random() * 30}, 100%, 55%)`
    });
  },
  
  spawnCross(speed) {
    if (frameCount % 60 === 0) {
      for (let i = 0; i < 4; i++) {
        const angle = (Math.PI / 2) * i;
        bullets.push({
          x: width / 2,
          y: height / 2,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed,
          size: 7,
          color: '#ff3366'
        });
      }
    }
  },
  
  update() {
    this.timer++;
    const interval = Math.max(10, bulletConfig.spawnInterval - difficultyLevel * 2);
    if (this.timer >= interval) {
      this.spawn();
      this.timer = 0;
    }
    
    this.timer++;
    if (this.timer > bulletConfig.patternDuration) {
      this.cycleType();
      this.timer = 0;
    }
  }
};

// ========== 玩家弹幕发射 ==========
function shootPlayerBullet() {
  if (playerBullets.length >= MAX_PLAYER_BULLETS) return;
  if (player.shootCooldown > 0) return;
  
  player.shootCooldown = isPowerUp ? 3 : 8;
  
  const angle = Math.atan2(mouse.y - player.y, mouse.x - player.x);
  const speed = 10;
  
  if (isPowerUp) {
    for (let i = -1; i <= 1; i++) {
      const spreadAngle = angle + i * 0.2;
      playerBullets.push({
        x: player.x,
        y: player.y,
        vx: Math.cos(spreadAngle) * speed,
        vy: Math.sin(spreadAngle) * speed,
        size: 6,
        damage: 15
      });
    }
  } else {
    playerBullets.push({
      x: player.x,
      y: player.y,
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed,
      size: 5,
      damage: 10
    });
  }
}

// ========== 游戏主循环 ==========
function gameLoop() {
  if (!gameRunning) {
    console.log('[GAMELOOP] 游戏已停止');
    return;
  }
  
  frameCount++;
  
  // 更新
  updatePlayer();
  updateBullets();
  updatePlayerBullets();
  updateMonsters();
  updateParticles();
  
  // 生成
  if (frameCount % bulletConfig.spawnInterval === 0) {
    spawnBullet();
  }
  
  if (frameCount % monsterManager.spawnInterval === 0) {
    monsterManager.spawn();
  }
  
  // 碰撞检测
  checkCollisions();
  
  // 渲染
  render();
  
  // 更新UI
  updateUI();
  
  // 继续循环
  requestAnimationFrame(gameLoop);
}

// ========== 更新逻辑 ==========
function update() {
  updatePlayer();
  updateBullets();
  updatePlayerBullets();
  updateMonsters();
  updateParticles();
  updateStars();
  
  bulletSystem.update();
  monsterManager.update();
  
  // 难度提升
  if (killCount > 0 && killCount % 10 === 0 && difficultyLevel < Math.floor(killCount / 10) + 1) {
    difficultyLevel = Math.floor(killCount / 10) + 1;
  }
  
  // PowerUp 效果
  if (isPowerUp) {
    powerUpTimer--;
    if (powerUpTimer <= 0) {
      isPowerUp = false;
    }
  }
  
  // 更新UI
  document.getElementById('scoreDisplay').textContent = `分数: ${score}`;
  document.getElementById('killDisplay').textContent = `击杀: ${killCount}`;
  document.getElementById('difficultyDisplay').textContent = `难度: ${difficultyLevel}`;
  
  // 射击
  if ((mouse.isDown || keys[' ']) && gameRunning) {
    shootPlayerBullet();
  }
  
  if (player.shootCooldown > 0) player.shootCooldown--;
}

// ========== 玩家更新 ==========
function updatePlayer() {
  let dx = 0;
  let dy = 0;
  
  // 键盘控制
  if (keys.ArrowLeft || keys.a) dx -= player.speed;
  if (keys.ArrowRight || keys.d) dx += player.speed;
  if (keys.ArrowUp || keys.w) dy -= player.speed;
  if (keys.ArrowDown || keys.s) dy += player.speed;
  
  // 鼠标拖动控制
  if (mouse.isDown && !keys[' ']) {
    const distX = mouse.x - player.x;
    const distY = mouse.y - player.y;
    const dist = Math.sqrt(distX * distX + distY * distY);
    if (dist > 5) {
      dx = (distX / dist) * player.speed;
      dy = (distY / dist) * player.speed;
    }
  }
  
  player.x += dx;
  player.y += dy;
  
  // 边界限制
  player.x = Math.max(player.width/2, Math.min(width - player.width/2, player.x));
  player.y = Math.max(player.height/2, Math.min(height - player.height/2, player.y));
  
  // 轨迹
  player.trail.push({ x: player.x, y: player.y });
  if (player.trail.length > MAX_TRAIL_LENGTH) {
    player.trail.shift();
  }
  
  // 无敌时间
  if (player.invincible) {
    player.invincibleTimer--;
    if (player.invincibleTimer <= 0) {
      player.invincible = false;
    }
  }
  
  // 受伤闪烁计时
  if (player.isHurt) {
    player.hurtTimer--;
    if (player.hurtTimer <= 0) {
      player.isHurt = false;
    }
  }
  
  // 碰撞检测
  if (!player.invincible && player.hp > 0) {
    for (let bullet of bullets) {
      const dist = Math.sqrt((player.x - bullet.x) ** 2 + (player.y - bullet.y) ** 2);
      if (dist < player.width/2 + bullet.size) {
        takeDamage();
        break;
      }
    }
  }
}

// ========== 弹幕更新 ==========
function updateBullets() {
  for (let i = bullets.length - 1; i >= 0; i--) {
    const b = bullets[i];
    b.x += b.vx;
    b.y += b.vy;
    
    if (b.x < -50 || b.x > width + 50 || b.y < -50 || b.y > height + 50) {
      bullets.splice(i, 1);
    }
  }
}

// ========== 玩家弹幕更新 ==========
function updatePlayerBullets() {
  for (let i = playerBullets.length - 1; i >= 0; i--) {
    const b = playerBullets[i];
    b.x += b.vx;
    b.y += b.vy;
    
    if (b.x < -50 || b.x > width + 50 || b.y < -50 || b.y > height + 50) {
      playerBullets.splice(i, 1);
      continue;
    }
    
    // 怪物碰撞
    for (let j = monsters.length - 1; j >= 0; j--) {
      const m = monsters[j];
      const dist = Math.sqrt((b.x - m.x) ** 2 + (b.y - m.y) ** 2);
      if (dist < b.size + m.size) {
        m.hp -= b.damage;
        playerBullets.splice(i, 1);
        
        // 击杀粒子
        for (let k = 0; k < 5; k++) {
          if (particles.length < MAX_PARTICLES) {
            particles.push({
              x: b.x,
              y: b.y,
              vx: (Math.random() - 0.5) * 5,
              vy: (Math.random() - 0.5) * 5,
              size: Math.random() * 4 + 2,
              color: m.color,
              life: 1
            });
          }
        }
        
        if (m.hp <= 0) {
          killMonster(j);
        }
        break;
      }
    }
  }
}

// ========== 怪物更新 ==========
function updateMonsters() {
  for (let m of monsters) {
    const dx = player.x - m.x;
    const dy = player.y - m.y;
    const dist = Math.sqrt(dx * dx + dy * dy);
    if (dist > 0) {
      m.x += (dx / dist) * m.speed;
      m.y += (dy / dist) * m.speed;
    }
  }
  
  // 怪物碰撞玩家
  if (!player.invincible) {
    for (let m of monsters) {
      const dist = Math.sqrt((player.x - m.x) ** 2 + (player.y - m.y) ** 2);
      if (dist < player.width/2 + m.size) {
        takeDamage();
        break;
      }
    }
  }
}
// ========== 开始游戏 ==========
function startGame() {
  document.getElementById('gameOverlay').classList.add('hidden');
  document.getElementById('scoreDisplay').classList.remove('hidden');
  document.getElementById('killDisplay').classList.remove('hidden');
  document.getElementById('difficultyDisplay').classList.remove('hidden');
  
  // 重置游戏状态
  score = 0;
  difficultyLevel = 1;
  frameCount = 0;
  killCount = 0;
  bullets = [];
  playerBullets = [];
  monsters = [];
  particles = [];
  
  // 重置玩家
  player.x = width / 2;
  player.y = height / 2;
  player.hp = 3;
  player.invincible = false;
  player.invincibleTimer = 0;
  player.trail = [];
  player.isHurt = false;
  player.hurtTimer = 0;
  
  gameRunning = true;
}

// ========== 初始化游戏 ==========
function init() {
  console.log('[INIT] 开始初始化游戏...');
  
  // 初始化画布尺寸
  width = window.innerWidth;
  height = window.innerHeight;
  canvas.width = width;
  canvas.height = height;
  console.log('[INIT] 画布尺寸:', width, 'x', height);
  
  // 初始化玩家位置
  player.x = width / 2;
  player.y = height * 0.75;
  player.hp = 3;
  player.trail = [];
  console.log('[INIT] 玩家位置:', player.x, player.y);
  
  // 初始化星空背景
  initStars();
  console.log('[INIT] 星空初始化完成，星星数量:', stars.length);
  
  // 绑定事件监听器
  setupEventListeners();
  console.log('[INIT] 事件监听器绑定完成');
  
  console.log('[INIT] 游戏初始化完成!');
}
// ========== 事件监听器设置 ==========
function setupEventListeners() {
  console.log('[EVENT] 设置事件监听器...');
  
  const startBtn = document.getElementById('startBtn');
  console.log('[EVENT] 开始按钮元素:', startBtn);
  
  if (startBtn) {
    startBtn.addEventListener('click', function(e) {
      console.log('[EVENT] 开始按钮被点击!');
      console.log('[EVENT] 当前gameRunning状态:', gameRunning);
      startGame();
    });
    console.log('[EVENT] 开始按钮点击事件已绑定');
  } else {
    console.error('[EVENT] 错误: 找不到开始按钮元素!');
  }
  
  // 键盘事件
  window.addEventListener('keydown', function(e) {
    if (keys.hasOwnProperty(e.key)) {
      keys[e.key] = true;
      console.log('[KEYDOWN]', e.key);
    }
  });
  
  window.addEventListener('keyup', function(e) {
    if (keys.hasOwnProperty(e.key)) {
      keys[e.key] = false;
    }
  });
  
  // 鼠标事件
  canvas.addEventListener('mousedown', function(e) {
    mouse.isDown = true;
    mouse.x = e.clientX;
    mouse.y = e.clientY;
    console.log('[MOUSE] 按下:', mouse.x, mouse.y);
  });
  
  canvas.addEventListener('mouseup', function() {
    mouse.isDown = false;
  });
  
  canvas.addEventListener('mousemove', function(e) {
    mouse.x = e.clientX;
    mouse.y = e.clientY;
  });
  
  // 窗口大小改变
  window.addEventListener('resize', function() {
    width = window.innerWidth;
    height = window.innerHeight;
    canvas.width = width;
    canvas.height = height;
    console.log('[RESIZE] 新尺寸:', width, 'x', height);
  });
  
  console.log('[EVENT] 所有事件监听器设置完成');
}

// ========== 开始游戏 ==========
function startGame() {
  console.log('[START] startGame() 被调用');
  console.log('[START] 准备开始游戏...');
  
  // 重置游戏状态
  gameRunning = true;
  score = 0;
  frameCount = 0;
  killCount = 0;
  difficultyLevel = 1;
  
  console.log('[START] 游戏状态已重置');
  
  // 重置玩家
  player.x = width / 2;
  player.y = height * 0.75;
  player.hp = 3;
  player.invincible = false;
  player.trail = [];
  
  console.log('[START] 玩家状态已重置, 位置:', player.x, player.y);
  
  // 清空数组
  bullets = [];
  playerBullets = [];
  monsters = [];
  particles = [];
  
  console.log('[START] 所有数组已清空');
  
  // 隐藏开始界面
  const overlay = document.getElementById('gameOverlay');
  overlay.classList.add('hidden');
  console.log('[START] 开始界面已隐藏');
  
  // 显示游戏UI
  document.getElementById('scoreDisplay').classList.remove('hidden');
  document.getElementById('killDisplay').classList.remove('hidden');
  document.getElementById('difficultyDisplay').classList.remove('hidden');
  console.log('[START] 游戏UI已显示');
  
  // 开始游戏循环
  console.log('[START] 准备调用 gameLoop()');
  gameLoop();
  console.log('[START] gameLoop() 已启动');
}


// ========== 开始游戏 ==========
function startGame() {
  // 重置游戏状态
  gameRunning = true;
  score = 0;
  killCount = 0;
  difficultyLevel = 1;
  frameCount = 0;
  
  // 重置玩家
  player.x = width / 2;
  player.y = height * 0.7;
  player.hp = 3;
  player.invincible = false;
  player.invincibleTimer = 0;
  player.isHurt = false;
  player.trail = [];
  
  // 清空数组
  bullets = [];
  playerBullets = [];
  monsters = [];
  particles = [];
  
  // 重置弹幕配置
  bulletConfig.currentPattern = 0;
  bulletConfig.patternTimer = 0;
  
  // 隐藏开始界面
  document.getElementById('gameOverlay').classList.add('hidden');
  document.getElementById('scoreDisplay').classList.remove('hidden');
  document.getElementById('killDisplay').classList.remove('hidden');
  document.getElementById('difficultyDisplay').classList.remove('hidden');
  
  // 更新显示
  updateDisplays();
  
  // 启动游戏循环
  gameLoop();
}

// ========== 更新显示 ==========
function updateDisplays() {
  document.getElementById('scoreDisplay').textContent = `分数: ${score}`;
  document.getElementById('killDisplay').textContent = `击杀: ${killCount}`;
  document.getElementById('difficultyDisplay').textContent = `难度: ${difficultyLevel}`;
}

// ========== 渲染背景 ==========
function renderBackground() {
  ctx.fillStyle = '#0a0a1a';
  ctx.fillRect(0, 0, width, height);
}

// ========== 游戏主循环 ==========
function gameLoop() {
  if (!gameRunning) return;
  
  frameCount++;
  
  // 清屏
  ctx.fillStyle = 'rgba(10, 10, 26, 0.3)';
  ctx.fillRect(0, 0, width, height);
  
  // 绘制星空
  drawStars();
  
  // 更新难度
  if (frameCount % 600 === 0 && difficultyLevel < 10) {
    difficultyLevel++;
    bulletConfig.spawnInterval = Math.max(10, 25 - difficultyLevel * 2);
  }
  
  // 生成弹幕
  if (frameCount % bulletConfig.spawnInterval === 0) {
    spawnBullet();
  }
  
  // 生成怪物
  if (frameCount % monsterManager.spawnInterval === 0) {
    monsterManager.spawn();
  }
  
  // 更新玩家
  updatePlayer();
  
  // 玩家射击
  if ((mouse.isDown || keys[' ']) && frameCount % 8 === 0) {
    playerShoot();
  }
  
  // 更新弹幕
  updateBullets();
  
  // 更新玩家子弹
  updatePlayerBullets();
  
  // 更新怪物
  updateMonsters();
  
  // 更新粒子
  updateParticles();
  
  // 碰撞检测
  checkCollisions();
  
  // 绘制所有元素
  drawAll();
  
  // 更新显示
  if (frameCount % 10 === 0) {
    updateDisplays();
  }
  
  requestAnimationFrame(gameLoop);
}

// ========== 绘制星空 ==========
function drawStars() {
  for (let star of stars) {
    star.y += star.speed;
    if (star.y > height) {
      star.y = 0;
      star.x = Math.random() * width;
    }
    ctx.beginPath();
    ctx.arc(star.x, star.y, star.size, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(255, 255, 255, ${star.alpha})`;
    ctx.fill();
  }
}

// ========== 更新玩家 ==========
function updatePlayer() {
  // 键盘控制
  if (keys.ArrowLeft || keys.a) player.x -= player.speed;
  if (keys.ArrowRight || keys.d) player.x += player.speed;
  if (keys.ArrowUp || keys.w) player.y -= player.speed;
  if (keys.ArrowDown || keys.s) player.y += player.speed;
  
  // 鼠标拖动控制
  if (mouse.isDown && !keys[' ']) {
    const dx = mouse.x - player.x;
    const dy = mouse.y - player.y;
    const dist = Math.sqrt(dx * dx + dy * dy);
    if (dist > 5) {
      player.x += dx * 0.1;
      player.y += dy * 0.1;
    }
  }
  
  // 边界限制
  player.x = Math.max(player.width / 2, Math.min(width - player.width / 2, player.x));
  player.y = Math.max(player.height / 2, Math.min(height - player.height / 2, player.y));
  
  // 更新轨迹
  player.trail.unshift({ x: player.x, y: player.y });
  if (player.trail.length > MAX_TRAIL_LENGTH) {
    player.trail.pop();
  }
  
  // 无敌时间倒计时
  if (player.invincible) {
    player.invincibleTimer--;
    if (player.invincibleTimer <= 0) {
      player.invincible = false;
    }
  }
  
  // 受伤动画倒计时
  if (player.isHurt) {
    player.hurtTimer--;
    if (player.hurtTimer <= 0) {
      player.isHurt = false;
    }
  }
}

// ========== 更新弹幕 ==========
function updateBullets() {
  for (let i = bullets.length - 1; i >= 0; i--) {
    const b = bullets[i];
    b.x += b.vx;
    b.y += b.vy;
    
    // 移除出界弹幕
    if (b.x < -50 || b.x > width + 50 || b.y < -50 || b.y > height + 50) {
      bullets.splice(i, 1);
    }
  }
}

// ========== 更新玩家子弹 ==========
function updatePlayerBullets() {
  for (let i = playerBullets.length - 1; i >= 0; i--) {
    const b = playerBullets[i];
    b.x += b.vx;
    b.y += b.vy;
    
    if (b.x < -50 || b.x > width + 50 || b.y < -50 || b.y > height + 50) {
      playerBullets.splice(i, 1);
    }
  }
}

// ========== 更新怪物 ==========
function updateMonsters() {
  for (let m of monsters) {
    // 追踪玩家
    const dx = player.x - m.x;
    const dy = player.y - m.y;
    const dist = Math.sqrt(dx * dx + dy * dy);
    if (dist > 0) {
      m.x += (dx / dist) * m.speed;
      m.y += (dy / dist) * m.speed;
    }
  }
}

// ========== 更新粒子 ==========
function updateParticles() {
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx;
    p.y += p.vy;
    p.life -= 0.02;
    p.vx *= 0.98;
    p.vy *= 0.98;
    
    if (p.life <= 0) {
      particles.splice(i, 1);
    }
  }
}

// ========== 碰撞检测 ==========
function checkCollisions() {
  // 玩家与弹幕碰撞
  for (let i = bullets.length - 1; i >= 0; i--) {
    const b = bullets[i];
    const dx = player.x - b.x;
    const dy = player.y - b.y;
    const dist = Math.sqrt(dx * dx + dy * dy);
    if (dist < player.width / 2 + b.size) {
      takeDamage();
      bullets.splice(i, 1);
    }
  }
  
  // 玩家子弹与怪物碰撞
  for (let i = playerBullets.length - 1; i >= 0; i--) {
    const b = playerBullets[i];
    for (let j = monsters.length - 1; j >= 0; j--) {
      const m = monsters[j];
      const dx = b.x - m.x;
      const dy = b.y - m.y;
      const dist = Math.sqrt(dx * dx + dy * dy);
      if (dist < m.size + b.size) {
        m.hp -= b.damage;
        playerBullets.splice(i, 1);
        if (m.hp <= 0) {
          killMonster(j);
        }
        break;
      }
    }
  }
}

// ========== 绘制所有元素 ==========
function drawAll() {
  // 绘制玩家轨迹
  for (let i = 0; i < player.trail.length; i++) {
    const t = player.trail[i];
    const alpha = (1 - i / player.trail.length) * 0.3;
    ctx.beginPath();
    ctx.arc(t.x, t.y, player.width / 2 * (1 - i / player.trail.length), 0, Math.PI * 2);
    ctx.fillStyle = `rgba(0, 255, 204, ${alpha})`;
    ctx.fill();
  }
  
  // 绘制玩家
  ctx.beginPath();
  ctx.arc(player.x, player.y, player.width / 2, 0, Math.PI * 2);
  if (player.isHurt) {
    ctx.fillStyle = '#ff0000';
  } else if (player.invincible) {
    ctx.fillStyle = frameCount % 10 < 5 ? '#00ffcc' : '#ffffff';
  } else {
    ctx.fillStyle = '#00ffcc';
  }
  ctx.fill();
  
  // 绘制玩家光环
  ctx.beginPath();
  ctx.arc(player.x, player.y, player.width / 2 + 5, 0, Math.PI * 2);
  ctx.strokeStyle = 'rgba(0, 255, 204, 0.5)';
  ctx.lineWidth = 2;
  ctx.stroke();
  
  // 绘制弹幕
  for (let b of bullets) {
    ctx.beginPath();
    ctx.arc(b.x, b.y, b.size, 0, Math.PI * 2);
    ctx.fillStyle = b.color;
    ctx.fill();
    ctx.beginPath();
    ctx.arc(b.x, b.y, b.size * 1.5, 0, Math.PI * 2);
    ctx.strokeStyle = b.color;
    ctx.globalAlpha = 0.3;
    ctx.stroke();
    ctx.globalAlpha = 1;
  }
  
  // 绘制玩家子弹
  for (let b of playerBullets) {
    ctx.beginPath();
    ctx.arc(b.x, b.y, b.size, 0, Math.PI * 2);
    ctx.fillStyle = '#00ff88';
    ctx.fill();
  }
  
  // 绘制怪物
  for (let m of monsters) {
    ctx.beginPath();
    ctx.arc(m.x, m.y, m.size, 0, Math.PI * 2);
    ctx.fillStyle = m.color;
    ctx.fill();
    
    // 怪物血条
    const hpBarWidth = m.size * 2;
    const hpPercent = m.hp / m.maxHp;
    ctx.fillStyle = '#333';
    ctx.fillRect(m.x - hpBarWidth / 2, m.y - m.size - 10, hpBarWidth, 4);
    ctx.fillStyle = hpPercent > 0.5 ? '#00ff00' : hpPercent > 0.25 ? '#ffff00' : '#ff0000';
    ctx.fillRect(m.x - hpBarWidth / 2, m.y - m.size - 10, hpBarWidth * hpPercent, 4);
  }
  
  // 绘制粒子
  for (let p of particles) {
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.size * p.life, 0, Math.PI * 2);
    ctx.fillStyle = p.color;
    ctx.globalAlpha = p.life;
    ctx.fill();
    ctx.globalAlpha = 1;
  }
  
  // 绘制玩家血量
  for (let i = 0; i < player.hp; i++) {
    ctx.beginPath();
    ctx.arc(30 + i * 25, height - 30, 8, 0, Math.PI * 2);
    ctx.fillStyle = '#00ffcc';
    ctx.fill();
  }
}

// ========== 游戏主循环 ==========
function gameLoop() {
  if (gameRunning) {
    update();
  }
  draw();
  requestAnimationFrame(gameLoop);
}

// ========== 更新游戏状态 ==========
function update() {
  frameCount++;
  
  // 更新难度
  difficultyLevel = Math.floor(killCount / 10) + 1;
  
  // 更新弹幕发射器
  updateBulletSpawner();
  
  // 更新怪物生成
  monsterManager.spawnTimer++;
  if (monsterManager.spawnTimer >= monsterManager.spawnInterval) {
    monsterManager.spawn();
    monsterManager.spawnTimer = 0;
  }
  
  updatePlayer();
  updateBullets();
  updatePlayerBullets();
  updateMonsters();
  updateParticles();
  
  // 玩家射击
  if ((mouse.isDown || keys[' ']) && player.shootCooldown <= 0) {
    playerShoot();
    player.shootCooldown = isPowerUp ? 5 : 12;
  }
  if (player.shootCooldown > 0) player.shootCooldown--;
  
  // 更新UI
  document.getElementById('scoreDisplay').textContent = '分数: ' + score;
  document.getElementById('killDisplay').textContent = '击杀: ' + killCount;
  document.getElementById('difficultyDisplay').textContent = '难度: ' + difficultyLevel;
}

// ========== 绘制游戏 ==========
function draw() {
  // 清空画布
  ctx.fillStyle = '#0a0a1a';
  ctx.fillRect(0, 0, width, height);
  
  // 绘制星空
  drawStars();
  
  if (!gameRunning) return;
  
  // 绘制玩家轨迹
  drawPlayerTrail();
  
  // 绘制玩家
  drawPlayer();
  
  // 绘制弹幕
  drawBullets();
  
  // 绘制玩家弹幕
  drawPlayerBullets();
  
  // 绘制怪物
  drawMonsters();
  
  // 绘制粒子
  drawParticles();
}

// ========== 初始化星空 ==========
function initStars() {
  stars = [];
  for (let i = 0; i < 100; i++) {
    stars.push({
      x: Math.random() * width,
      y: Math.random() * height,
      size: Math.random() * 2,
      alpha: Math.random() * 0.5 + 0.3
    });
  }
}

// ========== 绘制星空 ==========
function drawStars() {
  for (let star of stars) {
    ctx.beginPath();
    ctx.arc(star.x, star.y, star.size, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(255, 255, 255, ${star.alpha})`;
    ctx.fill();
  }
}

// ========== 绘制玩家轨迹 ==========
function drawPlayerTrail() {
  for (let i = 0; i < player.trail.length; i++) {
    const t = player.trail[i];
    const alpha = i / player.trail.length * 0.5;
    ctx.beginPath();
    ctx.arc(t.x, t.y, player.width / 2 * (i / player.trail.length), 0, Math.PI * 2);
    ctx.fillStyle = `rgba(0, 255, 204, ${alpha})`;
    ctx.fill();
  }
}

// ========== 绘制玩家 ==========
function drawPlayer() {
  if (player.isHurt && Math.floor(player.hurtTimer / 3) % 2 === 0) return;
  
  ctx.save();
  ctx.translate(player.x, player.y);
  
  // 外圈光晕
  const gradient = ctx.createRadialGradient(0, 0, 0, 0, 0, player.width);
  gradient.addColorStop(0, 'rgba(0, 255, 204, 0.8)');
  gradient.addColorStop(0.5, 'rgba(0, 255, 204, 0.3)');
  gradient.addColorStop(1, 'rgba(0, 255, 204, 0)');
  ctx.beginPath();
  ctx.arc(0, 0, player.width, 0, Math.PI * 2);
  ctx.fillStyle = gradient;
  ctx.fill();
  
  // 核心
  ctx.beginPath();
  ctx.arc(0, 0, player.width / 2, 0, Math.PI * 2);
  ctx.fillStyle = player.invincible ? '#ffffff' : '#00ffcc';
  ctx.fill();
  
  ctx.restore();
}

// ========== 绘制弹幕 ==========
function drawBullets() {
  for (let b of bullets) {
    ctx.beginPath();
    ctx.arc(b.x, b.y, b.size, 0, Math.PI * 2);
    ctx.fillStyle = b.color || '#ff4444';
    ctx.fill();
    
    // 光晕效果
    ctx.beginPath();
    ctx.arc(b.x, b.y, b.size * 2, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(255, 68, 68, 0.2)`;
    ctx.fill();
  }
}

// ========== 绘制玩家弹幕 ==========
function drawPlayerBullets() {
  for (let b of playerBullets) {
    ctx.beginPath();
    ctx.arc(b.x, b.y, b.size, 0, Math.PI * 2);
    ctx.fillStyle = '#00ffcc';
    ctx.fill();
  }
}

// ========== 绘制怪物 ==========
function drawMonsters() {
  for (let m of monsters) {
    ctx.beginPath();
    ctx.arc(m.x, m.y, m.size, 0, Math.PI * 2);
    ctx.fillStyle = m.color;
    ctx.fill();
    
    // 血条
    const hpPercent = m.hp / m.maxHp;
    ctx.fillStyle = '#333';
    ctx.fillRect(m.x - m.size, m.y - m.size - 8, m.size * 2, 4);
    ctx.fillStyle = hpPercent > 0.5 ? '#00ff00' : '#ff0000';
    ctx.fillRect(m.x - m.size, m.y - m.size - 8, m.size * 2 * hpPercent, 4);
  }
}

// ========== 绘制粒子 ==========
function drawParticles() {
  for (let p of particles) {
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
    ctx.fillStyle = p.color;
    ctx.globalAlpha = p.life;
    ctx.fill();
    ctx.globalAlpha = 1;
  }
}

// ========== 更新粒子 ==========
function updateParticles() {
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx;
    p.y += p.vy;
    p.life -= 0.02;
    if (p.life <= 0) {
      particles.splice(i, 1);
    }
  }
}

// ========== 弹幕生成器更新 ==========
function updateBulletSpawner() {
  bulletConfig.patternTimer++;
  if (bulletConfig.patternTimer >= bulletConfig.patternDuration) {
    bulletConfig.patternTimer = 0;
    bulletConfig.currentPattern = (bulletConfig.currentPattern + 1) % bulletConfig.patterns.length;
  }
  
  if (frameCount % bulletConfig.spawnInterval === 0) {
    spawnBullets();
  }
}

// ========== 生成弹幕 ==========
function spawnBullets() {
  if (bullets.length >= MAX_BULLETS) return;
  
  const pattern = bulletConfig.patterns[bulletConfig.currentPattern];
  const speed = bulletConfig.baseSpeed + difficultyLevel * 0.3;
  
  switch (pattern) {
    case 'rain':
      for (let i = 0; i < 3; i++) {
        bullets.push({
          x: Math.random() * width,
          y: -10,
          vx: (Math.random() - 0.5) * 2,
          vy: speed + Math.random() * bulletConfig.speedVariation,
          size: 6,
          color: '#ff4466'
        });
      }
      break;
    case 'spread':
      const centerX = Math.random() * width;
      for (let i = -2; i <= 2; i++) {
        const angle = Math.PI / 2 + i * 0.3;
        bullets.push({
          x: centerX,
          y: -10,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed,
          size: 5,
          color: '#ffaa00'
        });
      }
      break;
    case 'spiral':
      const spiralAngle = frameCount * 0.1;
      bullets.push({
        x: width / 2 + Math.cos(spiralAngle) * 100,
        y: -10,
        vx: Math.cos(spiralAngle) * speed * 0.5,
        vy: speed,
        size: 6,
        color: '#ff00ff'
      });
      break;
    case 'side':
      const side = Math.random() > 0.5 ? -10 : width + 10;
      bullets.push({
        x: side,
        y: Math.random() * height * 0.5,
        vx: side < 0 ? speed : -speed,
        vy: Math.random() * 2 - 1,
        size: 7,
        color: '#00ffff'
      });
      break;
    case 'cross':
      if (frameCount % 50 === 0) {
        for (let i = 0; i < 4; i++) {
          const angle = (Math.PI / 2) * i;
          bullets.push({
            x: width / 2,
            y: height / 2,
            vx: Math.cos(angle) * speed,
            vy: Math.sin(angle) * speed,
            size: 8,
            color: '#ffff00'
          });
        }
      }
      break;
  }
}

// ========== 玩家射击 ==========
function playerShoot() {
  if (playerBullets.length >= MAX_PLAYER_BULLETS) return;
  
  const angle = Math.atan2(mouse.y - player.y, mouse.x - player.x);
  const speed = 10;
  
  playerBullets.push({
    x: player.x,
    y: player.y,
    vx: Math.cos(angle) * speed,
    vy: Math.sin(angle) * speed,
    size: 5,
    damage: 10 + difficultyLevel * 2
  });
}

// ========== 受伤处理 ==========
function takeDamage() {
  if (player.invincible) return;
  
  player.hp--;
  player.invincible = true;
  player.invincibleTimer = 90;
  player.isHurt = true;
  player.hurtTimer = 30;
  
  // 产生粒子
  for (let i = 0; i < 10; i++) {
    if (particles.length < MAX_PARTICLES) {
      particles.push({
        x: player.x,
        y: player.y,
        vx: (Math.random() - 0.5) * 8,
        vy: (Math.random() - 0.5) * 8,
        size: Math.random() * 5 + 2,
        color: '#00ffcc',
        life: 1
      });
    }
  }
  
  if (player.hp <= 0) {
    gameOver();
  }
}

// ========== 击杀怪物 ==========
function killMonster(index) {
  const m = monsters[index];
  score += m.score * difficultyLevel;
  killCount++;
  
  // 爆炸粒子
  for (let i = 0; i < 15; i++) {
    if (particles.length < MAX_PARTICLES) {
      particles.push({
        x: m.x,
        y: m.y,
        vx: (Math.random() - 0.5) * 10,
        vy: (Math.random() - 0.5) * 10,
        size: Math.random() * 6 + 3,
        color: m.color,
        life: 1
      });
    }
  }
  
  monsters.splice(index, 1);
}

// ========== 游戏结束 ==========
function gameOver() {
  gameRunning = false;
  if (score > highScore) {
    highScore = score;
  }
  
  // 显示结束界面
  const overlay = document.getElementById('gameOverlay');
  overlay.classList.remove('hidden');
  overlay.querySelector('h1').textContent = '游戏结束';
  overlay.querySelector('p').innerHTML = `最终分数: <strong>${score}</strong><br>击杀数: ${killCount}<br>最高分: ${highScore}`;
  document.getElementById('startBtn').textContent = '重新开始';
  
  document.getElementById('scoreDisplay').classList.add('hidden');
  document.getElementById('killDisplay').classList.add('hidden');
  document.getElementById('difficultyDisplay').classList.add('hidden');
}

// ========== 页面加载完成后初始化 ==========
window.onload = init;


//
</script>
