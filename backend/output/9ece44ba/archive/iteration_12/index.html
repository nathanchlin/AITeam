<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>灵画师躲避弹幕</title>
<style>
@keyframes shake {
0%, 100% { transform: translateX(0); }
    10%, 30%, 50%, 70%, 90% { transform: translateX(-5px); }
    20%, 40%, 60%, 80% { transform: translateX(5px); }
}
@keyframes waveSubtitleIn {
from {
        opacity: 0;
        transform: translateY(20px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}
@keyframes waveTextIn {
from {
        opacity: 0;
        transform: scale(0.5);
        filter: blur(10px);
    }
    to {
        opacity: 1;
        transform: scale(1);
        filter: blur(0);
    }
}
.elite-badge {
position: absolute;
    top: -10px;
    right: -10px;
    background: linear-gradient(135deg, #ff4444, #ff8800);
    color: white;
    font-size: 10px;
    padding: 2px 6px;
    border-radius: 8px;
    font-weight: bold;
    box-shadow: 0 0 10px rgba(255, 68, 68, 0.6);
}
.wave-subtitle {
font-size: 24px;
    color: rgba(255, 255, 255, 0.9);
    margin-top: 10px;
    letter-spacing: 5px;
    animation: waveSubtitleIn 0.5s 0.2s ease-out forwards;
    opacity: 0;
}
.wave-text {
font-size: 72px;
    font-weight: bold;
    color: #ffd700;
    text-shadow: 
        0 0 20px rgba(255, 215, 0, 0.8),
        0 0 40px rgba(255, 215, 0, 0.6),
        0 0 60px rgba(255, 215, 0, 0.4);
    letter-spacing: 15px;
    animation: waveTextIn 0.5s ease-out forwards;
}
#waveAnnouncement {
position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    z-index: 200;
    text-align: center;
    pointer-events: none;
    opacity: 0;
}
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }
  body {
    overflow: hidden;
    background: #0a0a1a;
    font-family: 'Microsoft YaHei', sans-serif;
  }
  canvas {
    display: block;
  }
  #gameOverlay {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(10, 10, 26, 0.95);
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    z-index: 100;
  }
  #gameOverlay h1 {
    color: #00ffcc;
    font-size: 52px;
    margin-bottom: 20px;
    text-shadow: 0 0 30px rgba(0, 255, 204, 0.6);
    letter-spacing: 8px;
  }
  #gameOverlay p {
    color: rgba(255, 255, 255, 0.8);
    font-size: 18px;
    margin-bottom: 40px;
    line-height: 1.8;
    text-align: center;
  }
  #startBtn {
    padding: 18px 60px;
    font-size: 20px;
    background: linear-gradient(135deg, #00ffcc, #0088ff);
    border: none;
    border-radius: 40px;
    color: #0a0a1a;
    cursor: pointer;
    font-weight: bold;
    transition: transform 0.2s, box-shadow 0.2s;
    letter-spacing: 2px;
  }
  #startBtn:hover {
    transform: scale(1.08);
    box-shadow: 0 0 40px rgba(0, 255, 204, 0.5);
  }
  .hidden {
    display: none !important;
  }
  #scoreDisplay {
    position: fixed;
    top: 20px;
    left: 20px;
    color: #00ffcc;
    font-size: 24px;
    font-weight: bold;
    text-shadow: 0 0 10px rgba(0, 255, 204, 0.5);
    z-index: 50;
  }
  #waveDisplay {
    position: fixed;
    top: 55px;
    left: 20px;
    color: #ffd700;
    font-size: 18px;
    font-weight: bold;
    text-shadow: 0 0 10px rgba(255, 215, 0, 0.5);
    z-index: 50;
  }
  #killDisplay {
    position: fixed;
    top: 85px;
    left: 20px;
    color: #ff6b6b;
    font-size: 16px;
    z-index: 50;
  }
  
  /* 资源显示区域 */
  #resourceContainer {
    position: fixed;
    top: 20px;
    right: 20px;
    display: flex;
    flex-direction: column;
    gap: 8px;
    z-index: 50;
  }
  .resource-item {
    display: flex;
    align-items: center;
    gap: 8px;
    background: rgba(0, 0, 0, 0.5);
    padding: 8px 15px;
    border-radius: 20px;
    border: 1px solid rgba(255, 255, 255, 0.1);
  }
  .resource-icon {
    font-size: 18px;
  }
  .resource-value {
    color: #fff;
    font-size: 16px;
    font-weight: bold;
  }
  #inkValue { color: #00ccff; }
  #essenceValue { color: #ff66cc; }
  #skillPointValue { color: #ffd700; }
  
  #healthContainer {
    position: fixed;
    top: 115px;
    left: 20px;
    z-index: 50;
  }
  #hpDisplay {
    color: #ff6b6b;
    font-size: 14px;
    margin-bottom: 4px;
  }
  #healthBarContainer {
    width: 150px;
    height: 12px;
    background: rgba(255, 255, 255, 0.1);
    border-radius: 6px;
    overflow: hidden;
    margin-bottom: 4px;
  }
  #hpBar {
    width: 100%;
    height: 100%;
    background: linear-gradient(90deg, #ff4444, #ff6b6b);
    transition: width 0.2s;
  }
  #shieldBarContainer {
    width: 150px;
    height: 8px;
    background: rgba(255, 255, 255, 0.1);
    border-radius: 4px;
    overflow: hidden;
  }
  #shieldBar {
    width: 100%;
    height: 100%;
    background: linear-gradient(90deg, #4488ff, #00ccff);
    transition: width 0.2s;
  }
  
  /* 技能按钮 */
  #skillTreeBtn {
    position: fixed;
    bottom: 20px;
    right: 20px;
    width: 60px;
    height: 60px;
    background: linear-gradient(135deg, #6633ff, #9933ff);
    border: 2px solid #aa66ff;
    border-radius: 50%;
    cursor: pointer;
    z-index: 60;
    display: flex;
    justify-content: center;
    align-items: center;
    font-size: 28px;
    transition: transform 0.2s, box-shadow 0.2s;
  }
  #skillTreeBtn:hover {
    transform: scale(1.1);
    box-shadow: 0 0 25px rgba(153, 51, 255, 0.6);
  }
  #skillTreeBtn .notification {
    position: absolute;
    top: -5px;
    right: -5px;
    background: #ff4444;
    color: white;
    font-size: 12px;
    width: 22px;
    height: 22px;
    border-radius: 50%;
    display: flex;
    justify-content: center;
    align-items: center;
    display: none;
  }
  
  /* 技能树面板 */
  #skillTreeOverlay {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(10, 10, 26, 0.95);
    display: none;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    z-index: 180;
  }
  #skillTreePanel {
    width: 90%;
    max-width: 900px;
    max-height: 80vh;
    background: linear-gradient(180deg, #1a1a3a, #0a0a2a);
    border-radius: 20px;
    border: 2px solid #6633ff;
    padding: 30px;
    overflow-y: auto;
  }
  #skillTreeHeader {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 25px;
    padding-bottom: 15px;
    border-bottom: 1px solid rgba(102, 51, 255, 0.3);
  }
  #skillTreeHeader h2 {
    color: #cc99ff;
    font-size: 28px;
    text-shadow: 0 0 15px rgba(204, 153, 255, 0.5);
  }
  #availablePoints {
    color: #ffd700;
    font-size: 18px;
  }
  #closeSkillTree {
    background: transparent;
    border: 2px solid #ff6666;
    color: #ff6666;
    font-size: 24px;
    width: 40px;
    height: 40px;
    border-radius: 50%;
    cursor: pointer;
    transition: all 0.2s;
  }
  #closeSkillTree:hover {
    background: #ff6666;
    color: white;
  }
  
  /* 技能分类 */
  .skill-category {
    margin-bottom: 25px;
  }
  .skill-category-title {
    color: #00ffcc;
    font-size: 18px;
    margin-bottom: 15px;
    padding-left: 10px;
    border-left: 3px solid #00ffcc;
  }
  .skill-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
    gap: 15px;
  }
  
  /* 技能节点 */
  .skill-node {
    background: rgba(0, 0, 0, 0.4);
    border: 2px solid rgba(102, 51, 255, 0.3);
    border-radius: 12px;
    padding: 15px;
    cursor: pointer;
    transition: all 0.2s;
    position: relative;
  }
  .skill-node:hover {
    border-color: #9933ff;
    background: rgba(102, 51, 255, 0.1);
    transform: translateY(-2px);
  }
  .skill-node.locked {
    opacity: 0.5;
    cursor: not-allowed;
  }
  .skill-node.maxed {
    border-color: #ffd700;
    box-shadow: 0 0 15px rgba(255, 215, 0, 0.3);
  }
  .skill-node.unlocked {
    border-color: #00ff88;
    box-shadow: 0 0 10px rgba(0, 255, 136, 0.3);
  }
  .skill-icon-wrapper {
    font-size: 32px;
    margin-bottom: 8px;
    text-align: center;
  }
  .skill-name {
    color: #fff;
    font-size: 14px;
    font-weight: bold;
    text-align: center;
    margin-bottom: 5px;
  }
  .skill-level {
    color: #00ffcc;
    font-size: 12px;
    text-align: center;
    margin-bottom: 8px;
  }
  .skill-desc {
    color: rgba(255, 255, 255, 0.7);
    font-size: 11px;
    text-align: center;
    line-height: 1.4;
  }
  .skill-cost {
    position: absolute;
    top: 8px;
    right: 8px;
    background: rgba(255, 215, 0, 0.2);
    color: #ffd700;
    font-size: 10px;
    padding: 2px 6px;
    border-radius: 8px;
  }
  
  #gameOverOverlay {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(10, 10, 26, 0.95);
    display: none;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    z-index: 200;
  }
  #gameOverOverlay h1 {
    color: #ff4444;
    font-size: 48px;
    margin-bottom: 20px;
    text-shadow: 0 0 30px rgba(255, 68, 68, 0.6);
  }
  #gameOverOverlay p {
    color: rgba(255, 255, 255, 0.8);
    font-size: 18px;
    margin-bottom: 20px;
  }
  #gameOverStats {
    background: rgba(0, 0, 0, 0.3);
    padding: 20px 40px;
    border-radius: 15px;
    margin-bottom: 20px;
  }
  #gameOverStats p {
    margin: 8px 0;
  }
  #restartBtn {
    padding: 15px 50px;
    font-size: 18px;
    background: linear-gradient(135deg, #ff6b6b, #ff4444);
    border: none;
    border-radius: 30px;
    color: white;
    cursor: pointer;
    font-weight: bold;
    transition: transform 0.2s, box-shadow 0.2s;
    margin-top: 20px;
  }
  #restartBtn:hover {
    transform: scale(1.05);
    box-shadow: 0 0 30px rgba(255, 68, 68, 0.5);
  }
  
  #waveTransitionOverlay {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(10, 10, 26, 0.85);
    display: none;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    z-index: 150;
  }
  #waveTransitionOverlay h2 {
    color: #ffd700;
    font-size: 42px;
    margin-bottom: 30px;
    text-shadow: 0 0 30px rgba(255, 215, 0, 0.6);
  }
  #upgradeOptions {
    display: flex;
    gap: 25px;
    flex-wrap: wrap;
    justify-content: center;
    max-width: 900px;
  }
  .upgrade-card {
    width: 220px;
    background: linear-gradient(145deg, #1a2a3a, #0a1a2a);
    border: 2px solid #00ffcc;
    border-radius: 15px;
    padding: 25px 20px;
    cursor: pointer;
    transition: all 0.3s;
    text-align: center;
  }
  .upgrade-card:hover {
    transform: translateY(-8px);
    box-shadow: 0 15px 40px rgba(0, 255, 204, 0.3);
    border-color: #00ff88;
  }
  .upgrade-icon {
    font-size: 48px;
    margin-bottom: 15px;
  }
  .upgrade-name {
    color: #00ffcc;
    font-size: 18px;
    font-weight: bold;
    margin-bottom: 10px;
  }
  .upgrade-desc {
    color: rgba(255, 255, 255, 0.7);
    font-size: 13px;
    line-height: 1.5;
  }
  .upgrade-hint {
    color: #ffd700;
    font-size: 12px;
    margin-top: 15px;
    opacity: 0.8;
  }
  #upgradeTip {
    color: rgba(255, 255, 255, 0.5);
    font-size: 14px;
    margin-top: 40px;
    font-style: italic;
  }
  
  /* 已激活技能显示 */
  #activeSkills {
    position: fixed;
    bottom: 20px;
    left: 20px;
    display: flex;
    gap: 10px;
    z-index: 50;
  }
  .active-skill-icon {
    width: 45px;
    height: 45px;
    background: rgba(0, 0, 0, 0.6);
    border: 2px solid #6633ff;
    border-radius: 10px;
    display: flex;
    justify-content: center;
    align-items: center;
    font-size: 22px;
    position: relative;
  }
  .active-skill-icon .level-badge {
    position: absolute;
    bottom: -5px;
    right: -5px;
    background: #ffd700;
    color: #000;
    font-size: 10px;
    font-weight: bold;
    width: 18px;
    height: 18px;
    border-radius: 50%;
    display: flex;
    justify-content: center;
    align-items: center;
  }
</style>
</head>
<body>

<canvas id="gameCanvas"></canvas>

<!-- 资源显示 -->
<div id="resourceContainer">
  <div class="resource-item">
    <span class="resource-icon">💧</span>
    <span class="resource-value" id="inkValue">0</span>
  </div>
  <div class="resource-item">
    <span class="resource-icon">✨</span>
    <span class="resource-value" id="essenceValue">0</span>
  </div>
  <div class="resource-item">
    <span class="resource-icon">⭐</span>
    <span class="resource-value" id="skillPointValue">0</span>
  </div>
</div>

<!-- 已激活技能 -->
<div id="activeSkills"></div>

<!-- 技能树按钮 -->
<button id="skillTreeBtn">
  📜
  <span class="notification" id="skillNotification">0</span>
</button>

<!-- 技能树面板 -->
<div id="skillTreeOverlay">
  <div id="skillTreePanel">
    <div id="skillTreeHeader">
      <h2>🌸 灵画秘典</h2>
      <span id="availablePoints">可用技能点: <strong>0</strong></span>
      <button id="closeSkillTree">×</button>
    </div>
    <div id="skillTreeContent"></div>
  </div>
</div>

<div id="scoreDisplay">分数: <span id="score">0</span></div>
<div id="waveDisplay">波次: <span id="wave">1</span></div>
<div id="killDisplay">击杀: <span id="kills">0</span></div>

<div id="healthContainer">
  <div id="hpDisplay">HP: <span id="hpText">100/100</span></div>
  <div id="healthBarContainer">
    <div id="hpBar"></div>
  </div>
  <div id="shieldBarContainer">
    <div id="shieldBar"></div>
  </div>
</div>

<div id="gameOverlay">
  <h1>灵画师</h1>
  <p>
    身为灵画师，你需要在画境中躲避敌人的弹幕攻击<br>
    移动鼠标控制角色，击败画灵获得资源与经验<br>
    收集灵墨💧和精华✨来解锁强大的技能<br>
    每波结束可选择强化，逐步成为最强灵画师
  </p>
  <button id="startBtn">开始绘制</button>
</div>

<div id="gameOverOverlay">
  <h1>画境崩塌</h1>
  <div id="gameOverStats">
    <p>最终分数: <span id="finalScore">0</span></p>
    <p>到达波次: <span id="finalWave">1</span></p>
    <p>总击杀数: <span id="finalKills">0</span></p>
    <p>收集灵墨: <span id="finalInk">0</span></p>
    <p>收集精华: <span id="finalEssence">0</span></p>
  </div>
  <button id="restartBtn">重绘画卷</button>
</div>

<div id="waveTransitionOverlay">
  <h2>波次完成</h2>
  <div id="upgradeOptions"></div>
  <p id="upgradeTip"></p>
</div>

<script>
// ============== 游戏核心变量 ==============
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

let width, height;
let gameRunning = false;
let animationId;
let score = 0;
let kills = 0;
let wave = 1;
let waveTimer = 0;
let waveDuration = 45000; // 45秒一波
let spawnTimer = 0;
let lastTime = 0;

// ============== 资源系统 ==============
const resources = {
  ink: 0,           // 灵墨 - 基础资源
  essence: 0,       // 精华 - 稀有资源
  skillPoints: 0,   // 技能点 - 用于技能树
  totalInk: 0,      // 统计用
  totalEssence: 0   // 统计用
};

// ============== 技能树系统 ==============
const skillTree = {
  // 攻击系
  powerStrike: {
    id: 'powerStrike',
    name: '蓄力一击',
    icon: '⚔️',
    category: 'attack',
    maxLevel: 5,
    currentLevel: 0,
    cost: [1, 2, 3, 4, 5],
    description: ['伤害+10%', '伤害+20%', '伤害+30%', '伤害+40%', '伤害+50%'],
    effect: (level) => ({ damageBonus: level * 0.1 })
  },
  rapidFire: {
    id: 'rapidFire',
    name: '连珠画笔',
    icon: '🖌️',
    category: 'attack',
    maxLevel: 5,
    currentLevel: 0,
    cost: [1, 2, 2, 3, 4],
    description: ['射速+8%', '射速+16%', '射速+24%', '射速+32%', '射速+40%'],
    effect: (level) => ({ fireRateBonus: level * 0.08 })
  },
  piercingShot: {
    id: 'piercingShot',
    name: '贯穿墨锋',
    icon: '🔱',
    category: 'attack',
    maxLevel: 3,
    currentLevel: 0,
    cost: [3, 4, 5],
    description: ['穿透1个敌人', '穿透2个敌人', '穿透3个敌人'],
    effect: (level) => ({ pierce: level })
  },
  criticalMaster: {
    id: 'criticalMaster',
    name: '会心之眼',
    icon: '👁️',
    category: 'attack',
    maxLevel: 5,
    currentLevel: 0,
    cost: [2, 2, 3, 4, 5],
    description: ['暴击率+5%', '暴击率+10%', '暴击率+15%', '暴击率+20%', '暴击率+25%'],
    effect: (level) => ({ critChance: level * 0.05 })
  },
  
  // 防御系
  ironSkin: {
    id: 'ironSkin',
    name: '铁壁画身',
    icon: '🛡️',
    category: 'defense',
    maxLevel: 5,
    currentLevel: 0,
    cost: [1, 2, 3, 3, 4],
    description: ['最大生命+20', '最大生命+40', '最大生命+60', '最大生命+80', '最大生命+100'],
    effect: (level) => ({ maxHPBonus: level * 20 })
  },
  shieldMastery: {
    id: 'shieldMastery',
    name: '灵盾精通',
    icon: '🔰',
    category: 'defense',
    maxLevel: 5,
    currentLevel: 0,
    cost: [2, 2, 3, 4, 5],
    description: ['护盾+15', '护盾+30', '护盾+45', '护盾+60', '护盾+75'],
    effect: (level) => ({ shieldBonus: level * 15 })
  },
  regeneration: {
    id: 'regeneration',
    name: '墨韵恢复',
    icon: '💚',
    category: 'defense',
    maxLevel: 5,
    currentLevel: 0,
    cost: [2, 3, 4, 5, 6],
    description: ['每秒回复0.5HP', '每秒回复1HP', '每秒回复1.5HP', '每秒回复2HP', '每秒回复2.5HP'],
    effect: (level) => ({ hpRegen: level * 0.5 })
  },
  damageReduction: {
    id: 'damageReduction',
    name: '画境守护',
    icon: '🏛️',
    category: 'defense',
    maxLevel: 3,
    currentLevel: 0,
    cost: [4, 5, 6],
    description: ['减伤5%', '减伤10%', '减伤15%'],
    effect: (level) => ({ damageReduction: level * 0.05 })
  },
  
  // 移动系
  swiftFeet: {
    id: 'swiftFeet',
    name: '疾风步',
    icon: '💨',
    category: 'movement',
    maxLevel: 5,
    currentLevel: 0,
    cost: [1, 1, 2, 2, 3],
    description: ['移速+6%', '移速+12%', '移速+18%', '移速+24%', '移速+30%'],
    effect: (level) => ({ speedBonus: level * 0.06 })
  },
  dashMaster: {
    id: 'dashMaster',
    name: '闪现大师',
    icon: '⚡',
    category: 'movement',
    maxLevel: 3,
    currentLevel: 0,

// 获取当前所有技能效果
function getActiveEffects() {
  const effects = {
    damageBonus: 0,
    fireRateBonus: 0,
    pierce: 0,
    critChance: 0,
    maxHPBonus: 0,
    shieldBonus: 0,
    hpRegen: 0,
    damageReduction: 0,
    speedBonus: 0,
    dashCooldownReduction: 0,
    pickupRange: 1,
    luckBonus: 0,
    expBonus: 0,
    soulSteal: 0
  };
  
  for (const key in skillTree) {
    const skill = skillTree[key];
    if (skill.currentLevel > 0) {
      const skillEffect = skill.effect(skill.currentLevel);
      for (const effectKey in skillEffect) {
        if (effects.hasOwnProperty(effectKey)) {
          if (effectKey === 'pickupRange') {
            effects[effectKey] *= skillEffect[effectKey];
          } else {
            effects[effectKey] += skillEffect[effectKey];
          }
        }
      }
    }
  }
  
  return effects;
}

let player = {
  x: 0,
  y: 0,
  size: 18,
  baseSpeed: 5,
  speed: 5,
  hp: 100,
  maxHP: 100,
  shield: 0,
  maxShield: 30,
  damage: 25,
  fireRate: 250,
  lastShot: 0,
  color: '#00ffcc',
  invincible: false,
  invincibleTimer: 0,
  dashCooldown: 2000,
  lastDash: 0,
  exp: 0,
  level: 1,
  expToLevel: 100
};

// ============== 游戏对象数组 ==============
let bullets = [];
let enemyBullets = [];
let monsters = [];
let particles = [];
let floatingTexts = [];
let drops = []; // 掉落物

// ============== 初始化 ==============
function resize() {
  width = window.innerWidth;
  height = window.innerHeight;
  canvas.width = width;
  canvas.height = height;
}

function init() {
  resize();
  window.addEventListener('resize', resize);
  
  // 重置资源
  resources.ink = 0;
  resources.essence = 0;
  resources.skillPoints = 0;
  resources.totalInk = 0;
  resources.totalEssence = 0;
  
  // 重置技能树
  for (const key in skillTree) {
    skillTree[key].currentLevel = 0;
  }
  
  // 重置玩家
  player.x = width / 2;
  player.y = height / 2;
  player.hp = 100;
  player.maxHP = 100;
  player.shield = 0;
  player.maxShield = 30;
  player.exp = 0;
  player.level = 1;
  
  // 重置游戏状态
  score = 0;
  kills = 0;
  wave = 1;
  waveTimer = 0;
  spawnTimer = 0;
  bullets = [];
  enemyBullets = [];
  monsters = [];
  particles = [];
  floatingTexts = [];
  drops = [];
  
  updateUI();
  updateResourceUI();
  updateActiveSkillsUI();
  renderSkillTree();
}

// ============== UI更新 ==============
function updateUI() {
  document.getElementById('score').textContent = score;
  document.getElementById('wave').textContent = wave;
  document.getElementById('kills').textContent = kills;
  document.getElementById('hpText').textContent = `${Math.ceil(player.hp)}/${player.maxHP}`;
  document.getElementById('hpBar').style.width = `${(player.hp / player.maxHP) * 100}%`;
  document.getElementById('shieldBar').style.width = `${(player.shield / player.maxShield) * 100}%`;
}

function updateResourceUI() {
  document.getElementById('inkValue').textContent = Math.floor(resources.ink);
  document.getElementById('essenceValue').textContent = Math.floor(resources.essence);
  document.getElementById('skillPointValue').textContent = resources.skillPoints;
  document.getElementById('availablePoints').innerHTML = `可用技能点: <strong>${resources.skillPoints}</strong>`;
  
  // 更新技能树通知
  const notification = document.getElementById('skillNotification');
  if (resources.skillPoints > 0) {
    notification.style.display = 'flex';
    notification.textContent = resources.skillPoints;
  } else {
    notification.style.display = 'none';
  }
}

// 更新已激活技能显示
function updateActiveSkillsUI() {
  const container = document.getElementById('activeSkills');
  container.innerHTML = '';
  
  for (const key in skillTree) {
    const skill = skillTree[key];
    if (skill.currentLevel > 0) {
      const icon = document.createElement('div');
      icon.className = 'active-skill-icon';
      icon.innerHTML = `${skill.icon}<span class="level-badge">${skill.currentLevel}</span>`;
      icon.title = `${skill.name} Lv.${skill.currentLevel}`;
      container.appendChild(icon);
    }
  }
}

// ============== 技能树UI ==============
function renderSkillTree() {
  const container = document.getElementById('skillTreeContent');
  container.innerHTML = '';
  
  const categories = {
    attack: { name: '⚔️ 攻击系', skills: [] },
    defense: { name: '🛡️ 防御系', skills: [] },
    movement: { name: '💨 移动系', skills: [] },
    special: { name: '✨ 特殊系', skills: [] }
  };
  
  // 分类技能
  for (const key in skillTree) {
    const skill = skillTree[key];
    if (categories[skill.category]) {
      categories[skill.category].skills.push(skill);
    }
  }
  
  // 渲染每个分类
  for (const catKey in categories) {
    const cat = categories[catKey];
    if (cat.skills.length === 0) continue;
    
    const catDiv = document.createElement('div');
    catDiv.className = 'skill-category';
    catDiv.innerHTML = `<div class="skill-category-title">${cat.name}</div>`;
    
    const grid = document.createElement('div');
    grid.className = 'skill-grid';
    
    cat.skills.forEach(skill => {
      const node = document.createElement('div');
      const isMaxed = skill.currentLevel >= skill.maxLevel;
      const canUpgrade = !isMaxed && resources.skillPoints >= skill.cost[skill.currentLevel];
      
      node.className = `skill-node ${isMaxed ? 'maxed' : skill.currentLevel > 0 ? 'unlocked' : ''} ${!canUpgrade && !isMaxed ? 'locked' : ''}`;
      
      node.innerHTML = `
        <div class="skill-icon-wrapper">${skill.icon}</div>
        <div class="skill-name">${skill.name}</div>
        <div class="skill-level">Lv.${skill.currentLevel}/${skill.maxLevel}</div>
        <div class="skill-desc">${skill.description[skill.currentLevel] || '已达最高等级'}</div>
        ${!isMaxed ? `<div class="skill-cost">需要 ${skill.cost[skill.currentLevel]} 点</div>` : ''}
      `;
      
      if (canUpgrade) {
        node.onclick = () => upgradeSkill(skill.id);
      }
      
      grid.appendChild(node);
    });
    
    catDiv.appendChild(grid);
    container.appendChild(catDiv);
  }
}

function upgradeSkill(skillId) {
  const skill = skillTree[skillId];
  if (!skill) return;
  
  const cost = skill.cost[skill.currentLevel];
  if (resources.skillPoints >= cost && skill.currentLevel < skill.maxLevel) {
    resources.skillPoints -= cost;
    skill.currentLevel++;
    
    // 应用技能效果
    applySkillEffects();
    
    // 更新UI
    updateResourceUI();
    updateActiveSkillsUI();
    renderSkillTree();
    
    // 特效
    createUpgradeParticles();
  }
}

function applySkillEffects() {
  const effects = getActiveEffects();
  
  // 应用最大生命值加成
  const oldMaxHP = player.maxHP;
  player.maxHP = 100 + effects.maxHPBonus;
  if (player.maxHP > oldMaxHP) {
    player.hp += (player.maxHP - oldMaxHP);
  }
  
  // 应用护盾加成
  player.maxShield = 30 + effects.shieldBonus;
  
  // 应用速度加成
  player.speed = player.baseSpeed * (1 + effects.speedBonus);
}

function createUpgradeParticles() {
  for (let i = 0; i < 30; i++) {
    particles.push({
      x: player.x,
      y: player.y,
      vx: (Math.random() - 0.5) * 8,
      vy: (Math.random() - 0.5) * 8,
      size: Math.random() * 6 + 3,
      color: `hsl(${270 + Math.random() * 30}, 100%, 60%)`,
      alpha: 1,
      decay: 0.02
    });
  }
}

// ============== 掉落物系统 ==============
function spawnDrop(x, y, type, amount) {
  const effects = getActiveEffects();
  
  drops.push({
    x: x,
    y: y,
    type: type,
    amount: amount,
    size: type === 'essence' ? 14 : 10,
    color: type === 'ink' ? '#00ccff' : type === 'essence' ? '#ff66cc' : '#ffd700',
    glowColor: type === 'ink' ? '#0088ff' : type === 'essence' ? '#ff33aa' : '#ffaa00',
    vx: (Math.random() - 0.5) * 4,
    vy: (Math.random() - 0.5) * 4,
    life: 600,
    magnetized: false
  });
}

function updateDrops(dt) {
  const effects = getActiveEffects();
  const magnetRange = 80 * effects.pickupRange;
  
  for (let i = drops.length - 1; i >= 0; i--) {
    const drop = drops[i];
    
    // 计算与玩家距离
    const dx = player.x - drop.x;
    const dy = player.y - drop.y;
    const dist = Math.sqrt(dx * dx + dy * dy);
    
    // 磁力吸引
    if (dist < magnetRange) {
      drop.magnetized = true;
      const speed = 8;
      drop.vx += (dx / dist) * speed * 0.3;
      drop.vy += (dy / dist) * speed * 0.3;
    }
    
    // 移动
    drop.x += drop.vx;
    drop.y += drop.vy;
    drop.vx *= 0.95;
    drop.vy *= 0.95;
    
    // 生命周期
    drop.life--;
    
    // 拾取检测
    if (dist < player.size + drop.size) {
      collectDrop(drop);
      drops.splice(i, 1);
      continue;
    }
    
    // 超时
    if (drop.life <= 0) {
      drops.splice(i, 1);
    }
  }
}

function collectDrop(drop) {
  switch (drop.type) {
    case 'ink':
      resources.ink += drop.amount;
      resources.totalInk += drop.amount;
      break;
    case 'essence':
      resources.essence += drop.amount;
      resources.totalEssence += drop.amount;
      break;
    case 'skillPoint':
      resources.skillPoints += drop.amount;
      break;
    case 'hp':
      player.hp = Math.min(player.hp + drop.amount, player.maxHP);
      break;
    case 'shield':
      player.shield = Math.min(player.shield + drop.amount, player.maxShield);
      break;
  }
  
  updateResourceUI();
  
  // 拾取特效
  for (let i = 0; i < 5; i++) {
    particles.push({
      x: drop.x,
      y: drop.y,
      vx: (Math.random() - 0.5) * 3,
      vy: -Math.random() * 3 - 1,
      size: 4,
      color: drop.color,
      alpha: 1,
      decay: 0.05
    });
  }
}

function drawDrops() {
  drops.forEach(drop => {
    ctx.save();
    
    // 发光效果
    const gradient = ctx.createRadialGradient(drop.x, drop.y, 0, drop.x, drop.y, drop.size * 2);
    gradient.addColorStop(0, drop.glowColor);
    gradient.addColorStop(1, 'transparent');
    ctx.fillStyle = gradient;
    ctx.globalAlpha = 0.3 + Math.sin(Date.now() / 200) * 0.1;
    ctx.beginPath();
    ctx.arc(drop.x, drop.y, drop.size * 2, 0, Math.PI * 2);
    ctx.fill();
    
    // 主体
    ctx.globalAlpha = 1;
    ctx.fillStyle = drop.color;
    ctx.beginPath();
    ctx.arc(drop.x, drop.y, drop.size, 0, Math.PI * 2);
    ctx.fill();
    
    // 高光
    ctx.fillStyle = 'rgba(255, 255, 255, 0.6)';
    ctx.beginPath();
    ctx.arc(drop.x - drop.size * 0.3, drop.y - drop.size * 0.3, drop.size * 0.3, 0, Math.PI * 2);
    ctx.fill();
    
    ctx.restore();
  });
}

// ============== 敌人击杀与掉落 ==============
function onEnemyKilled(enemy) {
  kills++;
  score += enemy.level * 100 || 100;
  
  const effects = getActiveEffects();
  const luckBonus = 1 + effects.luckBonus;
  
  // 灵魂吸取
  if (effects.soulSteal > 0) {
    player.hp = Math.min(player.hp + effects.soulSteal, player.maxHP);
  }
  
  // 基础灵墨掉落
  const inkAmount = Math.floor((5 + wave * 2) * luckBonus);
  spawnDrop(enemy.x, enemy.y, 'ink', inkAmount);
  
  // 精华掉落（概率）
  if (Math.random() < 0.2 * luckBonus) {
    spawnDrop(enemy.x + (Math.random() - 0.5) * 20, enemy.y + (Math.random() - 0.5) * 20, 'essence', 1);
  }
  
  // 生命掉落（概率）
  if (Math.random() < 0.1 * luckBonus) {
    spawnDrop(enemy.x + (Math.random() - 0.5) * 20, enemy.y + (Math.random() - 0.5) * 20, 'hp', 10);
  }
  
  // 宝箱怪额外掉落
  if (enemy.isTreasure) {
    for (let i = 0; i < 5; i++) {
      setTimeout(() => {
        spawnDrop(enemy.x + (Math.random() - 0.5) * 40, enemy.y + (Math.random() - 0.5) * 40, 'ink', 20);
      }, i * 100);
    }
    spawnDrop(enemy.x, enemy.y, 'essence', 5);
    if (Math.random() < 0.5) {
      spawnDrop(enemy.x, enemy.y, 'skillPoint', 1);
    }
  }
  
  // 死亡特效
  for (let i = 0; i < 15; i++) {
    particles.push({
      x: enemy.x,
      y: enemy.y,
      vx: (Math.random() - 0.5) * 8,
      vy: (Math.random() - 0.5) * 8,
      size: Math.random() * 6 + 2,
      color: enemy.color || '#ff6666',
      alpha: 1,
      decay: 0.02
    });
  }
  
  updateUI();
}

// ============== 更新逻辑 ==============
function update(dt) {
  if (!gameRunning) return;
  
  waveTimer += dt;
  
  // 波次结束检测
  if (waveTimer >= waveDuration) {
    endWave();
    return;
  }
  
  const effects = getActiveEffects();
  
  // HP回复
  if (effects.hpRegen > 0) {
    player.hp = Math.min(player.hp + effects.hpRegen * dt / 1000, player.maxHP);
  }
  
  // 更新玩家
  updatePlayer(dt, effects);
  
  // 更新子弹
  updateBullets(dt, effects);
  
  // 更新敌人
  updateMonsters(dt, effects);
  
  // 更新敌人子弹
  updateEnemyBullets(dt, effects);
  
  // 更新粒子
  updateParticles(dt);
  
  // 更新掉落物
  updateDrops(dt);
  
  // 生成敌人
  spawnTimer += dt;
  const spawnInterval = Math.max(800 - wave * 30, 300);
  if (spawnTimer >= spawnInterval) {
    spawnTimer = 0;
    spawnEnemy();
  }
  
  // 宝箱怪生成
  if (Math.random() < 0.0003 * wave) {
    spawnTreasureGoblin();
  }
  
  updateUI();
}

function updatePlayer(dt, effects) {
  // 无敌时间
  if (player.invincible) {
    player.invincibleTimer -= dt;
    if (player.invincibleTimer <= 0) {
      player.invincible = false;
    }
  }
  
  // 冲刺冷却
  const dashCooldownMax = player.dashCooldown * (1 - effects.dashCooldownReduction);
}

function updateBullets(dt, effects) {
  for (let i = bullets.length - 1; i >= 0; i--) {
    const bullet = bullets[i];
    bullet.x += bullet.vx;
    bullet.y += bullet.vy;
    
    // 移除出界子弹
    if (bullet.x < 0 || bullet.x > width || bullet.y < 0 || bullet.y > height) {
      bullets.splice(i, 1);
      continue;
    }
    
    // 碰撞检测
    for (let j = monsters.length - 1; j >= 0; j--) {
      const enemy = monsters[j];
      const dx = bullet.x - enemy.x;
      const dy = bullet.y - enemy.y;
      const dist = Math.sqrt(dx * dx + dy * dy);
      
      if (dist < bullet.size + enemy.size) {
        // 计算伤害
        let damage = player.damage * (1 + effects.damageBonus);
        
        // 暴击
        if (Math.random() < effects.critChance) {
          damage *= 2;
          showFloatingText(enemy.x, enemy.y - 20, '暴击!', '#ffd700');
        }
        
        enemy.hp -= damage;
        
        // 击中特效
        for (let k = 0; k < 5; k++) {
          particles.push({
            x: bullet.x,
            y: bullet.y,
            vx: (Math.random() - 0.5) * 4,
            vy: (Math.random() - 0.5) * 4,
            size: Math.random() * 3 + 1,
            color: bullet.color,
            alpha: 1,
            decay: 0.05
          });
        }
        
        // 穿透检测
        if (effects.pierce > 0) {
          bullet.pierceCount = (bullet.pierceCount || 0) + 1;
          if (bullet.pierceCount > effects.pierce) {
            bullets.splice(i, 1);
          }
        } else {
          bullets.splice(i, 1);
        }
        
        // 敌人死亡
        if (enemy.hp <= 0) {
          onEnemyKilled(enemy);
          monsters.splice(j, 1);
        }
        
        break;
      }
    }
  }
}

function updateEnemyBullets(dt, effects) {
  for (let i = enemyBullets.length - 1; i >= 0; i--) {
    const bullet = enemyBullets[i];
    bullet.x += bullet.vx;
    bullet.y += bullet.vy;
    
    // 移除出界
    if (bullet.x < 0 || bullet.x > width || bullet.y < 0 || bullet.y > height) {
      enemyBullets.splice(i, 1);
      continue;
    }
    
    // 玩家碰撞
    if (!player.invincible) {
      const dx = bullet.x - player.x;
      const dy = bullet.y - player.y;
      const dist = Math.sqrt(dx * dx + dy * dy);
      
      if (dist < bullet.size + player.size) {
        let damage = bullet.damage * (1 - effects.damageReduction);
        
        // 先扣护盾
        if (player.shield > 0) {
          const shieldDamage = Math.min(player.shield, damage);
          player.shield -= shieldDamage;
          damage -= shieldDamage;
        }
        
        player.hp -= damage;
        player.invincible = true;
        player.invincibleTimer = 500;
        
        enemyBullets.splice(i, 1);
        
        // 受伤特效
        for (let k = 0; k < 10; k++) {
          particles.push({
            x: player.x,
            y: player.y,
            vx: (Math.random() - 0.5) * 6,
            vy: (Math.random() - 0.5) * 6,
            size: Math.random() * 4 + 2,
            color: '#ff4444',
            alpha: 1,
            decay: 0.03
          });
        }
        
        if (player.hp <= 0) {
          gameOver();
        }
      }
    }
  }
}

function updateMonsters(dt, effects) {
  monsters.forEach(enemy => {
    // 移动向玩家
    const dx = player.x - enemy.x;
    const dy = player.y - enemy.y;
    const dist = Math.sqrt(dx * dx + dy * dy);
    
    if (dist > 0) {
      enemy.x += (dx / dist) * enemy.speed;
      enemy.y += (dy / dist) * enemy.speed;
    }
    
    // 敌人射击
    if (enemy.shootCooldown) {
      enemy.shootTimer += dt;
      if (enemy.shootTimer >= enemy.shootCooldown) {
        enemy.shootTimer = 0;
        enemyShoot(enemy);
      }
    }
    
    // 行为模式更新
    enemy.pulsePhase += 0.1;
  });
}

function updateParticles(dt) {
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx;
    p.y += p.vy;
    p.alpha -= p.decay;
    p.vx *= 0.98;
    p.vy *= 0.98;
    
    if (p.alpha <= 0) {
      particles.splice(i, 1);
    }
  }
  
  // 浮动文字
  for (let i = floatingTexts.length - 1; i >= 0; i--) {
    const ft = floatingTexts[i];
    ft.y += ft.vy;
    ft.life--;
    ft.alpha = ft.life / 60;
    
    if (ft.life <= 0) {
      floatingTexts.splice(i, 1);
    }
  }
}

// ============== 敌人生成 ==============
function spawnEnemy() {
  const sides = [
    { x: -50, y: Math.random() * height },
    { x: width + 50, y: Math.random() * height },
    { x: Math.random() * width, y: -50 },
    { x: Math.random() * width, y: height + 50 }
  ];
  const side = sides[Math.floor(Math.random() * sides.length)];
  
  const types = ['NORMAL', 'FAST', 'TANK', 'SHOOTER'];
  const weights = [50, 20 + wave, 15 + wave, 10 + wave * 2];
  const totalWeight = weights.reduce((a, b) => a + b, 0);
  let rand = Math.random() * totalWeight;
  let type = 'NORMAL';
  
  for (let i = 0; i < types.length; i++) {
    rand -= weights[i];
    if (rand <= 0) {
      type = types[i];
      break;
    }
  }
  
  const baseHP = 30 + wave * 10;
  let enemy = {
    x: side.x,
    y: side.y,
    type: type,
    level: wave,
    pulsePhase: 0
  };
  
  switch (type) {
    case 'NORMAL':
      Object.assign(enemy, {
        size: 18,
        hp: baseHP,
        maxHP: baseHP,
        speed: 2 + wave * 0.1,
        color: '#ff6666',
        glowColor: '#ff3333',
        typeName: '画灵',
        shootCooldown: null
      });
      break;
    case 'FAST':
      Object.assign(enemy, {
        size: 12,
        hp: baseHP * 0.5,
        maxHP: baseHP * 0.5,
        speed: 4 + wave * 0.15,
        color: '#66ff66',
        glowColor: '#33ff33',
        typeName: '疾风画灵',
        shootCooldown: null
      });
      break;
    case 'TANK':
      Object.assign(enemy, {
        size: 28,
        hp: baseHP * 2.5,
        maxHP: baseHP * 2.5,
        speed: 1 + wave * 0.05,
        color: '#6666ff',
        glowColor: '#3333ff',
        typeName: '重甲画灵',
        shootCooldown: 3000,
        shootTimer: 0
      });
      break;
    case 'SHOOTER':
      Object.assign(enemy, {
        size: 16,
        hp: baseHP * 0.8,
        maxHP: baseHP * 0.8,
        speed: 1.5 + wave * 0.08,
        color: '#ff66ff',
        glowColor: '#ff33ff',
        typeName: '弹幕画灵',
        shootCooldown: 2000,
        shootTimer: 0
      });
      break;
  }
  
  monsters.push(enemy);
}

function enemyShoot(enemy) {
  const dx = player.x - enemy.x;
  const dy = player.y - enemy.y;
  const dist = Math.sqrt(dx * dx + dy * dy);
  
  if (dist <= 0) return;
  
  const speed = 4 + wave * 0.2;
  const bulletCount = enemy.type === 'TANK' ? 8 : 1;
  
  if (bulletCount === 1) {
    enemyBullets.push({
      x: enemy.x,
      y: enemy.y,
      vx: (dx / dist) * speed,
      vy: (dy / dist) * speed,
      size: 6,
      color: enemy.color,
      damage: 10 + wave * 2
    });
  } else {
    for (let i = 0; i < bulletCount; i++) {
      const angle = (Math.PI * 2 / bulletCount) * i;
      enemyBullets.push({
        x: enemy.x,
        y: enemy.y,
        vx: Math.cos(angle) * speed,
        vy: Math.sin(angle) * speed,
        size: 5,
        color: enemy.color,
        damage: 8 + wave
      });
    }
  }
}

function playerShoot() {
  const effects = getActiveEffects();
  const now = Date.now();
  const fireRate = player.fireRate / (1 + effects.fireRateBonus);
  
  if (now - player.lastShot < fireRate) return;
  
  player.lastShot = now;
  
  const angle = Math.atan2(mouseY - player.y, mouseX - player.x);
  const bulletSpeed = 10;
  
  bullets.push({
    x: player.x,
    y: player.y,
    vx: Math.cos(angle) * bulletSpeed,
    vy: Math.sin(angle) * bulletSpeed,
    size: 6,
    color: '#00ffcc',
    damage: player.damage * (1 + effects.damageBonus),
    pierceCount: 0
  });
}

// ============== 绘制 ==============
function draw() {
  ctx.fillStyle = '#0a0a1a';
  ctx.fillRect(0, 0, width, height);
  
  // 绘制背景网格
  drawGrid();
  
  // 绘制掉落物
  drawDrops();
  
  // 绘制子弹
  drawBullets();
  
  // 绘制敌人子弹
  drawEnemyBullets();
  
  // 绘制敌人
  drawMonsters();
  
  // 绘制玩家
  drawPlayer();
  
  // 绘制粒子
  drawParticles();
  
  // 绘制浮动文字
  drawFloatingTexts();
  
  // 绘制波次进度
  drawWaveProgress();
}

function drawGrid() {
  ctx.strokeStyle = 'rgba(0, 255, 204, 0.05)';
  ctx.lineWidth = 1;
  const gridSize = 50;
  
  for (let x = 0; x < width; x += gridSize) {
    ctx.beginPath();
    ctx.moveTo(x, 0);
    ctx.lineTo(x, height);
    ctx.stroke();
  }
  for (let y = 0; y < height; y += gridSize) {
    ctx.beginPath();
    ctx.moveTo(0, y);
    ctx.lineTo(width, y);
    ctx.stroke();
  }
}

function drawPlayer() {
  ctx.save();
  
  // 无敌闪烁
  if (player.invincible && Math.floor(Date.now() / 50) % 2 === 0) {
    ctx.globalAlpha = 0.5;
  }
  
  // 外圈光晕
  const gradient = ctx.createRadialGradient(player.x, player.y, 0, player.x, player.y, player.size * 2.5);
  gradient.addColorStop(0, 'rgba(0, 255, 204, 0.3)');
  gradient.addColorStop(1, 'transparent');
  ctx.fillStyle = gradient;
  ctx.beginPath();
  ctx.arc(player.x, player.y, player.size * 2.5, 0, Math.PI * 2);
  ctx.fill();
  
  // 玩家主体
  ctx.fillStyle = player.color;
  ctx.beginPath();
  ctx.arc(player.x, player.y, player.size, 0, Math.PI * 2);
  ctx.fill();
  
  // 中心亮点
  ctx.fillStyle = '#ffffff';
  ctx.beginPath();
  ctx.arc(player.x, player.y, player.size * 0.4, 0, Math.PI * 2);
  ctx.fill();
  
  // 护盾显示
  if (player.shield > 0) {
    ctx.strokeStyle = `rgba(68, 136, 255, ${0.5 + Math.sin(Date.now() / 200) * 0.2})`;
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.arc(player.x, player.y, player.size + 5, 0, Math.PI * 2);
    ctx.stroke();
  }
  
  ctx.restore();
}

function drawBullets() {
  bullets.forEach(bullet => {
    ctx.save();
    
    // 光晕
    const gradient = ctx.createRadialGradient(bullet.x, bullet.y, 0, bullet.x, bullet.y, bullet.size * 2);
    gradient.addColorStop(0, bullet.color);
    gradient.addColorStop(1, 'transparent');
    ctx.fillStyle = gradient;
    ctx.beginPath();
    ctx.arc(bullet.x, bullet.y, bullet.size * 2, 0, Math.PI * 2);
    ctx.fill();
    
    // 主体
    ctx.fillStyle = bullet.color;
    ctx.beginPath();
    ctx.arc(bullet.x, bullet.y, bullet.size, 0, Math.PI * 2);
    ctx.fill();
    
    ctx.restore();
  });
}

function drawEnemyBullets() {
  enemyBullets.forEach(bullet => {
    ctx.save();
    
    ctx.fillStyle = bullet.color;
    ctx.beginPath();
    ctx.arc(bullet.x, bullet.y, bullet.size, 0, Math.PI * 2);
    ctx.fill();
    
    // 外圈
    ctx.strokeStyle = 'rgba(255, 255, 255, 0.3)';
    ctx.lineWidth = 1;
    ctx.stroke();
    
    ctx.restore();
  });
}

function drawMonsters() {
  monsters.forEach(enemy => {
    ctx.save();
    
    const pulse = 1 + Math.sin(enemy.pulsePhase) * 0.1;
    
    // 光晕
    const gradient = ctx.createRadialGradient(enemy.x, enemy.y, 0, enemy.x, enemy.y, enemy.size * 2 * pulse);
    gradient.addColorStop(0, enemy.glowColor);
    gradient.addColorStop(1, 'transparent');
    ctx.fillStyle = gradient;
    ctx.beginPath();
    ctx.arc(enemy.x, enemy.y, enemy.size * 2 * pulse, 0, Math.PI * 2);
    ctx.fill();
    
    // 主体
    ctx.fillStyle = enemy.color;
    ctx.beginPath();
    ctx.arc(enemy.x, enemy.y, enemy.size * pulse, 0, Math.PI * 2);
    ctx.fill();
    
    // HP条
    if (enemy.hp < enemy.maxHP) {
      const barWidth = enemy.size * 2;
      const barHeight = 4;
      const barX = enemy.x - barWidth / 2;
      const barY = enemy.y - enemy.size - 10;
      
      ctx.fillStyle = 'rgba(0, 0, 0, 0.5)';
      ctx.fillRect(barX, barY, barWidth, barHeight);
      
      ctx.fillStyle = '#ff4444';
      ctx.fillRect(barX, barY, barWidth * (enemy.hp / enemy.maxHP), barHeight);
    }
    
    ctx.restore();
  });
}

function drawParticles() {
  particles.forEach(p => {
    ctx.save();
    ctx.globalAlpha = p.alpha;
    ctx.fillStyle = p.color;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  });
}

function drawFloatingTexts() {
  floatingTexts.forEach(ft => {
    ctx.save();
    ctx.globalAlpha = ft.alpha;
    ctx.fillStyle = ft.color;
    ctx.font = 'bold 18px Microsoft YaHei';
    ctx.textAlign = 'center';
    ctx.fillText(ft.text, ft.x, ft.y);
    ctx.restore();
  });
}

function drawWaveProgress() {
  const progress = waveTimer / waveDuration;
  const barWidth = 200;
  const barHeight = 6;
  const barX = width / 2 - barWidth / 2;
  const barY = height - 30;
  
  ctx.fillStyle = 'rgba(255, 255, 255, 0.1)';
  ctx.fillRect(barX, barY, barWidth, barHeight);
  
  ctx.fillStyle = '#ffd700';
  ctx.fillRect(barX, barY, barWidth * progress, barHeight);
  
  ctx.fillStyle = 'rgba(255, 255, 255, 0.5)';
  ctx.font = '12px Microsoft YaHei';
  ctx.textAlign = 'center';
  ctx.fillText(`波次 ${wave} 进度`, width / 2, barY - 5);
}

function showFloatingText(x, y, text, color = '#ffffff') {
  floatingTexts.push({
    x: x,
    y: y,
    text: text,
    color: color,
    alpha: 1,
    vy: -2,
    life: 60
  });
}

// ============== 音效系统 ==============
const AudioSystem = {
  context: null,
  masterVolume: 0.3,
  
  init() {
    this.context = new (window.AudioContext || window.webkitAudioContext)();
  },
  
  // 波次开始音效 - 史诗感上升音
  playWaveStart(waveNum) {
    if (!this.context) this.init();
    const ctx = this.context;
    const now = ctx.currentTime;
    
    // 基础和弦
    const frequencies = [130.81, 164.81, 196.00, 261.63]; // C3, E3, G3, C4
    
    frequencies.forEach((freq, i) => {
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      const filter = ctx.createBiquadFilter();
      
      osc.type = 'sine';
      osc.frequency.setValueAtTime(freq * 0.5, now);
      osc.frequency.exponentialRampToValueAtTime(freq, now + 0.3);
      osc.frequency.exponentialRampToValueAtTime(freq * 1.5, now + 0.8);
      
      filter.type = 'lowpass';
      filter.frequency.setValueAtTime(500, now);
      filter.frequency.exponentialRampToValueAtTime(2000, now + 0.5);
      
      gain.gain.setValueAtTime(0, now);
      gain.gain.linearRampToValueAtTime(this.masterVolume * 0.4, now + 0.1 + i * 0.05);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 1.2);
      
      osc.connect(filter);
      filter.connect(gain);
      gain.connect(ctx.destination);
      
      osc.start(now + i * 0.08);
      osc.stop(now + 1.3);
    });
    
    // 鼓点效果
    for (let i = 0; i < 3; i++) {
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      
      osc.type = 'sine';
      osc.frequency.setValueAtTime(80 + i * 20, now + i * 0.15);
      osc.frequency.exponentialRampToValueAtTime(40, now + i * 0.15 + 0.1);
      
      gain.gain.setValueAtTime(this.masterVolume * 0.6, now + i * 0.15);
      gain.gain.exponentialRampToValueAtTime(0.001, now + i * 0.15 + 0.15);
      
      osc.connect(gain);
      gain.connect(ctx.destination);
      
      osc.start(now + i * 0.15);
      osc.stop(now + i * 0.15 + 0.2);
    }
  },
  
  // 精英敌人出现音效 - 金属共鸣
  playEliteSpawn() {
    if (!this.context) this.init();
    const ctx = this.context;
    const now = ctx.currentTime;
    
    const freqs = [440, 554.37, 659.25]; // A4, C#5, E5
    
    freqs.forEach((freq, i) => {
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(freq, now);
      
      gain.gain.setValueAtTime(0, now);
      gain.gain.linearRampToValueAtTime(this.masterVolume * 0.15, now + 0.05);
      gain.gain.setValueAtTime(this.masterVolume * 0.15, now + 0.1);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.8);
      
      osc.connect(gain);
      gain.connect(ctx.destination);
      
      osc.start(now + i * 0.03);
      osc.stop(now + 1);
    });
  },
  
  // 敌人死亡音效
  playEnemyDeath(isElite = false) {
    if (!this.context) this.init();
    const ctx = this.context;
    const now = ctx.currentTime;
    
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    const filter = ctx.createBiquadFilter();
    
    osc.type = 'square';
    osc.frequency.setValueAtTime(isElite ? 300 : 200, now);
    osc.frequency.exponentialRampToValueAtTime(50, now + 0.15);
    
    filter.type = 'lowpass';
    filter.frequency.setValueAtTime(isElite ? 1500 : 1000, now);
    filter.frequency.exponentialRampToValueAtTime(100, now + 0.15);
    
    gain.gain.setValueAtTime(this.masterVolume * (isElite ? 0.35 : 0.2), now);
    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.2);
    
    osc.connect(filter);
    filter.connect(gain);
    gain.connect(ctx.destination);
    
    osc.start(now);
    osc.stop(now + 0.25);
    
    // 精英额外爆炸音
    if (isElite) {
      for (let i = 0; i < 3; i++) {
        const noise = ctx.createOscillator();
        const noiseGain = ctx.createGain();
        
        noise.type = 'sine';
        noise.frequency.setValueAtTime(100 + Math.random() * 200, now + i * 0.05);
        
        noiseGain.gain.setValueAtTime(this.masterVolume * 0.1, now + i * 0.05);
        noiseGain.gain.exponentialRampToValueAtTime(0.001, now + i * 0.05 + 0.1);
        
        noise.connect(noiseGain);
        noiseGain.connect(ctx.destination);
        
        noise.start(now + i * 0.05);
        noise.stop(now + i * 0.05 + 0.15);
      }
    }
  },
  
  // 升级选择音效 - 神秘和弦
  playUpgradeSelect() {
    if (!this.context) this.init();
    const ctx = this.context;
    const now = ctx.currentTime;
    
    // 闪闪发光的音效
    const freqs = [523.25, 659.25, 783.99, 1046.50]; // C5, E5, G5, C6
    
    freqs.forEach((freq, i) => {
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      
      osc.type = 'sine';
      osc.frequency.setValueAtTime(freq, now + i * 0.1);
      
      gain.gain.setValueAtTime(0, now + i * 0.1);
      gain.gain.linearRampToValueAtTime(this.masterVolume * 0.2, now + i * 0.1 + 0.05);
      gain.gain.exponentialRampToValueAtTime(0.001, now + i * 0.1 + 0.5);
      
      osc.connect(gain);
      gain.connect(ctx.destination);
      
      osc.start(now + i * 0.1);
      osc.stop(now + i * 0.1 + 0.6);
    });
  },
  
  // 受伤音效
  playDamage() {
    if (!this.context) this.init();
    const ctx = this.context;
    const now = ctx.currentTime;
    
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    
    osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(150, now);
    osc.frequency.exponentialRampToValueAtTime(50, now + 0.1);
    
    gain.gain.setValueAtTime(this.masterVolume * 0.4, now);
    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.15);
    
    osc.connect(gain);
    gain.connect(ctx.destination);
    
    osc.start(now);
    osc.stop(now + 0.2);
  }
};

// 波次开始屏幕特效
function createWaveStartEffect() {
  const isBossWave = wave % 5 === 0;
  const color = isBossWave ? '#ff4444' : '#ffd700';
  
  // 边缘光晕效果
  for (let i = 0; i < 30; i++) {
    const angle = (Math.PI * 2 / 30) * i;
    const distance = Math.max(canvas.width, canvas.height);
    
    particles.push({
      x: canvas.width / 2 + Math.cos(angle) * distance * 0.6,
      y: canvas.height / 2 + Math.sin(angle) * distance * 0.6,
      vx: -Math.cos(angle) * 3,
      vy: -Math.sin(angle) * 3,
      size: isBossWave ? 15 : 10,
      color: color,
      alpha: 1,
      decay: 0.02,
      trail: true
    });
  }
  
  // 中心爆发
  for (let i = 0; i < 50; i++) {
    const angle = Math.random() * Math.PI * 2;
    const speed = Math.random() * 8 + 2;
    
    particles.push({
      x: canvas.width / 2,
      y: canvas.height / 2,
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed,
      size: Math.random() * 6 + 3,
      color: isBossWave ? '#ff8844' : '#ffee88',
      alpha: 1,
      decay: 0.03
    });
  }
  
  // 屏幕震动效果（通过CSS）
  canvas.style.animation = 'none';
  canvas.offsetHeight; // 触发重绘
  canvas.style.animation = isBossWave ? 'shake 0.5s ease-out' : 'shake 0.3s ease-out';
}

      desc: '获得50灵墨',
      apply: () => { resources.ink += 50; resources.totalInk += 50; updateResourceUI(); }
    },
    {
      name: '精华汇聚',
      icon: '✨',
      desc: '获得10精华',
      apply: () => { resources.essence += 10; resources.totalEssence += 10; updateResourceUI(); }
    },
    {
      name: '技能觉醒',
      icon: '⭐',
      desc: '获得1技能点',
      apply: () => { resources.skillPoints += 1; updateResourceUI(); }
    },
    {
      name: '恢复之光',
      icon: '💚',
      desc: '恢复50%生命值',
      apply: () => { player.hp = Math.min(player.hp + player.maxHP * 0.5, player.maxHP); }
    },
    {
      name: '护盾充能',
      icon: '🔰',
      desc: '护盾完全充能',
      apply: () => { player.shield = player.maxShield; }
    }
  ];
  
  // 随机选择3个
  const shuffled = allUpgrades.sort(() => Math.random() - 0.5);
  return shuffled.slice(0, 3);
}

  const overlay = document.getElementById('upgradeOverlay');

  // 生成升级选项
  const upgrades = [
    { id: 'atk', name: '画笔之力', desc: '攻击力 +20%', icon: '⚔️' },
    { id: 'def', name: '墨韵护体', desc: '最大生命 +15%', icon: '🛡️' },
    { id: 'spd', name: '云行风随', desc: '移速/攻速 +10%', icon: '💨' },
    { id: 'hp', name: '灵墨再生', desc: '每秒恢复 2 点生命', icon: '💚' },
    { id: 'shield', name: '画境结界', desc: '获得 30 点护盾', icon: '🔮' },

  ];

    card.onclick = () => {

  const tips = [

    '墨韵流转，命运由你书写',
    '画境之中，万物皆有可能'

  document.getElementById('upgradeTip').textContent = tips[Math.floor(Math.random() * tips.length)];

}

function createUpgradeEffect() {
  for (let i = 0; i < 20; i++) {
    particles.push({
      x: player.x,
      y: player.y,
      vx: (Math.random() - 0.5) * 10,
      vy: (Math.random() - 0.5) * 10,
      size: Math.random() * 8 + 4,
      color: '#ffd700',
      alpha: 1,
      decay: 0.02
    });
  }
}

// ============== 游戏循环 ==============
function gameLoop(currentTime) {
  const dt = currentTime - lastTime;
  lastTime = currentTime;
  
  update(dt);
  draw();
  
  animationId = requestAnimationFrame(gameLoop);
}

// 初始化尺寸
resize();

function createEnemy() {
  const margin = 80;
  let x, y;
  const side = Math.floor(Math.random() * 4);
  
  switch (side) {
    case 0: x = Math.random() * canvas.width; y = -margin; break;
    case 1: x = canvas.width + margin; y = Math.random() * canvas.height; break;
    case 2: x = Math.random() * canvas.width; y = canvas.height + margin; break;
    case 3: x = -margin; y = Math.random() * canvas.height; break;
  }
  
  const waveMultiplier = 1 + (wave - 1) * 0.1;
  const isElite = wave > 2 && Math.random() < (0.1 + wave * 0.02);
  const isBoss = wave % 5 === 0 && !enemies.some(e => e.isBoss);
  
  const types = ['normal', 'shooter', 'charger', 'splitter'];
  let type = types[Math.floor(Math.random() * types.length)];
  
  // 波次越高，出现更强敌人的概率越大
  if (wave > 3) {
    const advancedTypes = ['shooter', 'charger', 'splitter', 'spiral'];
    if (Math.random() < 0.3 + wave * 0.05) {
      type = advancedTypes[Math.floor(Math.random() * advancedTypes.length)];
    }
  }
  
  let size, hp, speed, color;
  
  if (isBoss) {
    size = 60;
    hp = 100 + wave * 20;
    speed = 1 + wave * 0.05;
    color = '#ff0066';
    type = 'boss';
  } else if (isElite) {
    size = 40;
    hp = Math.floor((20 + wave * 5) * 2);
    speed = 2 + wave * 0.08;
    color = '#ff8800';
  } else {
    size = 25;
    hp = 10 + wave * 3;
    speed = 1.5 + wave * 0.1;
    color = '#ff6b6b';
  }
  
  const enemy = {
    x, y,
    size,
    hp,
    maxHp: hp,
    speed,
    color,
    type,
    isElite,
    isBoss,
    eliteColor: isElite ? getEliteColor(type) : null,
    shootCooldown: 0,
    angle: 0,
    spiralAngle: 0,
    chargeTimer: 0,
    isCharging: false
  };
  
  enemies.push(enemy);
  
  // 精英敌人出现音效
  if (isElite || isBoss) {
    AudioSystem.playEliteSpawn();
    
    // 精英出现特效
    for (let i = 0; i < 15; i++) {
      const angle = Math.random() * Math.PI * 2;
      particles.push({
        x: enemy.x,
        y: enemy.y,
        vx: Math.cos(angle) * 5,
        vy: Math.sin(angle) * 5,
        size: 6,
        color: enemy.eliteColor || '#ff4444',
        alpha: 1,
        decay: 0.04
      });
    }
  }
}

function getEliteColor(type) {
  const colors = {
    'normal': '#ff8800',
    'shooter': '#00ff88',
    'charger': '#ff0088',
    'splitter': '#8800ff',
    'spiral': '#00ffff',
    'boss': '#ff0066'
  };
  return colors[type] || '#ff8800';
}

function drawEnemies() {
  enemies.forEach(enemy => {
    ctx.save();
    ctx.translate(enemy.x, enemy.y);
    
    // 更新精英视觉
    updateEnemyVisual(enemy);
    
    // 精英/BOSS光环
    if (enemy.isElite || enemy.isBoss) {
      const glowColor = enemy.eliteColor || '#ff4444';
      
      // 外层脉动光环
      const pulseSize = Math.sin(Date.now() / 200) * 5 + enemy.size * 1.5;
      const gradient = ctx.createRadialGradient(0, 0, enemy.size, 0, 0, pulseSize);
      gradient.addColorStop(0, glowColor + '40');
      gradient.addColorStop(0.5, glowColor + '20');
      gradient.addColorStop(1, 'transparent');
      
      ctx.fillStyle = gradient;
      ctx.beginPath();
      ctx.arc(0, 0, pulseSize, 0, Math.PI * 2);
      ctx.fill();
      
      // 旋转光环
      ctx.strokeStyle = glowColor + '60';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(0, 0, enemy.size + 8, 0, Math.PI * 2);
      ctx.stroke();
      
      // 光环装饰点
      for (let i = 0; i < 4; i++) {
        const angle = (Date.now() / 500) + (Math.PI / 2) * i;
        const dotX = Math.cos(angle) * (enemy.size + 8);
        const dotY = Math.sin(angle) * (enemy.size + 8);
        
        ctx.fillStyle = glowColor;
        ctx.beginPath();
        ctx.arc(dotX, dotY, 3, 0, Math.PI * 2);
        ctx.fill();
      }
    }
    
    // 敌人身体
    ctx.fillStyle = enemy.color;
    ctx.beginPath();
    
    switch (enemy.type) {
      case 'boss':
        // BOSS - 复杂多边形
        const points = 8;
        for (let i = 0; i < points; i++) {
          const angle = (Math.PI * 2 / points) * i - Math.PI / 2;
          const radius = enemy.size * (i % 2 === 0 ? 1 : 0.7);
          const px = Math.cos(angle) * radius;
          const py = Math.sin(angle) * radius;
          if (i === 0) ctx.moveTo(px, py);
          else ctx.lineTo(px, py);
        }
        ctx.closePath();
        break;
        
      case 'shooter':
        // 射手 - 菱形
        ctx.moveTo(0, -enemy.size);
        ctx.lineTo(enemy.size, 0);
        ctx.lineTo(0, enemy.size);
        ctx.lineTo(-enemy.size, 0);
        ctx.closePath();
        break;
        
      case 'charger':
        // 冲锋 - 三角形
        const chargeAngle = Math.atan2(player.y - enemy.y, player.x - enemy.x);
        ctx.rotate(chargeAngle);
        ctx.moveTo(enemy.size, 0);
        ctx.lineTo(-enemy.size * 0.7, -enemy.size * 0.7);
        ctx.lineTo(-enemy.size * 0.7, enemy.size * 0.7);
        ctx.closePath();
        break;
        
      case 'splitter':
        // 分裂 - 六边形
        for (let i = 0; i < 6; i++) {
          const angle = (Math.PI / 3) * i - Math.PI / 2;
          const px = Math.cos(angle) * enemy.size;
          const py = Math.sin(angle) * enemy.size;
          if (i === 0) ctx.moveTo(px, py);
          else ctx.lineTo(px, py);
        }
        ctx.closePath();
        break;
        
      case 'spiral':
        // 螺旋 - 五角星
        for (let i = 0; i < 10; i++) {
          const angle = (Math.PI / 5) * i - Math.PI / 2;
          const radius = enemy.size * (i % 2 === 0 ? 1 : 0.5);
          const px = Math.cos(angle) * radius;
          const py = Math.sin(angle) * radius;
          if (i === 0) ctx.moveTo(px, py);
          else ctx.lineTo(px, py);
        }
        ctx.closePath();
        break;
        
      default:
        // 普通 - 圆形
        ctx.arc(0, 0, enemy.size, 0, Math.PI * 2);
    }
    
    ctx.fill();
    
    // 敌人内部纹理
    if (enemy.isElite || enemy.isBoss) {
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.3)';
      ctx.lineWidth = 2;
      ctx.stroke();
    }
    
    // 血条
    if (enemy.hp < enemy.maxHp) {
      const barWidth = enemy.size * 2;
      const barHeight = 4;
      const hpPercent = enemy.hp / enemy.maxHp;
      
      ctx.fillStyle = 'rgba(0, 0, 0, 0.5)';
      ctx.fillRect(-barWidth / 2, -enemy.size - 12, barWidth, barHeight);
      
      ctx.fillStyle = enemy.isElite ? '#ff8800' : (enemy.isBoss ? '#ff0066' : '#ff4444');
      ctx.fillRect(-barWidth / 2, -enemy.size - 12, barWidth * hpPercent, barHeight);
    }
    
    // 精英标识
    if (enemy.isElite && !enemy.isBoss) {
      ctx.fillStyle = '#fff';
      ctx.font = 'bold 12px Microsoft YaHei';
      ctx.textAlign = 'center';
      ctx.fillText('★', 0, -enemy.size - 18);
    }
    
    // BOSS标识
    if (enemy.isBoss) {
      ctx.fillStyle = '#ff0066';
      ctx.font = 'bold 14px Microsoft YaHei';
      ctx.textAlign = 'center';
      ctx.fillText('BOSS', 0, -enemy.size - 18);
    }
    
    ctx.restore();
  });
}

function damageEnemy(enemy, damage) {
  enemy.hp -= damage;
  
  // 受击特效
  for (let i = 0; i < 5; i++) {
    particles.push({
      x: enemy.x + (Math.random() - 0.5) * enemy.size,
      y: enemy.y + (Math.random() - 0.5) * enemy.size,
      vx: (Math.random() - 0.5) * 3,
      vy: (Math.random() - 0.5) * 3,
      size: 4,
      color: enemy.color,
      alpha: 1,
      decay: 0.05
    });
  }
  
  if (enemy.hp <= 0) {
    const index = enemies.indexOf(enemy);
    if (index > -1) {
      enemies.splice(index, 1);
      
      // 播放死亡音效
      AudioSystem.playEnemyDeath(enemy.isElite || enemy.isBoss);
      
      // 死亡爆炸特效
      const explosionCount = enemy.isBoss ? 40 : (enemy.isElite ? 25 : 15);
      for (let i = 0; i < explosionCount; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = Math.random() * 6 + 2;
        particles.push({
          x: enemy.x,
          y: enemy.y,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed,
          size: Math.random() * 6 + 2,
          color: enemy.isElite ? (enemy.eliteColor || '#ff8800') : enemy.color,
          alpha: 1,
          decay: 0.03
        });
      }
      
      // 分裂敌人
      if (enemy.type === 'splitter' && enemy.size > 15) {
        for (let i = 0; i < 2; i++) {
          const miniEnemy = {
            x: enemy.x + (Math.random() - 0.5) * 30,
            y: enemy.y + (Math.random() - 0.5) * 30,
            size: enemy.size * 0.6,
            hp: enemy.maxHp * 0.3,
            maxHp: enemy.maxHp * 0.3,
            speed: enemy.speed * 1.2,
            color: enemy.color,
            type: 'normal',
            isElite: false,
            isBoss: false,
            shootCooldown: 0
          };
          enemies.push(miniEnemy);
        }
      }
      
      // 资源掉落
      resources.ink += 5 + wave * 2;
      resources.totalInk += 5 + wave * 2;
      resources.essence += enemy.isElite ? 15 : 5;
      resources.totalEssence += enemy.isElite ? 15 : 5;
      
      if (enemy.isBoss) {
        resources.skillPoints++;
        resources.essence += 50;
        resources.totalEssence += 50;
      }
      
      score += enemy.isBoss ? 500 : (enemy.isElite ? 100 : 20);
      kills++;
      
      updateUI();
    }
  }
}

function playerTakeDamage(damage) {
  // 护盾优先吸收
  if (player.shield > 0) {
    const shieldAbsorb = Math.min(player.shield, damage);
    player.shield -= shieldAbsorb;
    damage -= shieldAbsorb;
  }
  
  if (damage > 0) {
    player.hp -= damage;
    
    // 播放受伤音效
    AudioSystem.playDamage();
    
    // 受伤视觉效果
    for (let i = 0; i < 10; i++) {
      particles.push({
        x: player.x,
        y: player.y,
        vx: (Math.random() - 0.5) * 8,
        vy: (Math.random() - 0.5) * 8,
        size: 5,
        color: '#ff4444',
        alpha: 1,
        decay: 0.04
      });
    }
    
    // 屏幕闪红
    canvas.style.boxShadow = 'inset 0 0 100px rgba(255, 0, 0, 0.5)';
    setTimeout(() => {
      canvas.style.boxShadow = 'none';
    }, 100);
  }
  
  if (player.hp <= 0) {
    gameOver();
  }
  
  updateUI();
}
