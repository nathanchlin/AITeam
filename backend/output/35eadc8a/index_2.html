<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>贪吃蛇游戏</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f0f0f0;
            font-family: Arial, sans-serif;
        }
        .game-container {
            text-align: center;
        }
        canvas {
            border: 2px solid #333;
            background-color: #fff;
        }
        .score {
            font-size: 24px;
            margin-bottom: 10px;
        }
        .game-over {
            font-size: 36px;
            color: red;
            margin-top: 10px;
            display: none;
        }
        .controls {
            margin-top: 10px;
            font-size: 14px;
            color: #666;
        }
    </style>
</head>
<body>
    <div class="game-container">
        <div class="score">分数: <span id="score">0</span></div>
        <canvas id="gameCanvas" width="400" height="400"></canvas>
        <div class="game-over" id="gameOver">游戏结束！</div>
        <div class="controls">使用方向键控制蛇的移动</div>
    </div>

    <script>
        // 获取画布和上下文
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreElement = document.getElementById('score');
        const gameOverElement = document.getElementById('gameOver');

        // 游戏配置
        const gridSize = 20; // 网格大小
        const tileCount = canvas.width / gridSize; // 网格数量

        // 游戏状态
        let snake = [];
        let direction = { x: 1, y: 0 }; // 初始向右移动
        let food = {};
        let score = 0;
        let gameRunning = true;

        // 初始化蛇
        function initSnake() {
            snake = [
                { x: 10, y: 10 },
                { x: 9, y: 10 },
                { x: 8, y: 10 }
            ];
        }

        // 生成食物
        function generateFood() {
            food = {
                x: Math.floor(Math.random() * tileCount),
                y: Math.floor(Math.random() * tileCount)
            };
            
            // 确保食物不会出现在蛇身上
            for (let segment of snake) {
                if (segment.x === food.x && segment.y === food.y) {
                    generateFood();
                    break;
                }
            }
        }

        // 绘制游戏
        function draw() {
            // 清空画布
            ctx.fillStyle = '#fff';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // 绘制蛇
            ctx.fillStyle = '#4CAF50';
            for (let segment of snake) {
                ctx.fillRect(segment.x * gridSize, segment.y * gridSize, gridSize - 2, gridSize - 2);
            }

            // 绘制食物
            ctx.fillStyle = '#F44336';
            ctx.fillRect(food.x * gridSize, food.y * gridSize, gridSize - 2, gridSize - 2);
        }

        // 更新游戏状态
        function update() {
            if (!gameRunning) return;

            // 计算新的头部位置
            const head = { x: snake[0].x + direction.x, y: snake[0].y + direction.y };

            // 检查是否撞墙
            if (head.x < 0 || head.x >= tileCount || head.y < 0 || head.y >= tileCount) {
                gameOver();
                return;
            }

            // 检查是否撞到自己
            for (let segment of snake) {
                if (head.x === segment.x && head.y === segment.y) {
                    gameOver();
                    return;
                }
            }

            // 将新头部添加到蛇的前面
            snake.unshift(head);

            // 检查是否吃到食物
            if (head.x === food.x && head.y === food.y) {
                score += 10;
                scoreElement.textContent = score;
                generateFood();
            } else {
                // 如果没有吃到食物，移除尾部
                snake.pop();
            }
        }

        // 游戏结束
        function gameOver() {
            gameRunning = false;
            gameOverElement.style.display = 'block';
        }

        // 重置游戏
        function resetGame() {
            initSnake();
            direction = { x: 1, y: 0 };
            score = 0;
            scoreElement.textContent = score;
            gameRunning = true;
            gameOverElement.style.display = 'none';
            generateFood();
        }

        // 键盘事件监听
        document.addEventListener('keydown', function(e) {
            if (!gameRunning && e.key === ' ') {
                resetGame();
                return;
            }

            // 防止蛇直接掉头
            switch(e.key) {
                case 'ArrowUp':
                    if (direction.y === 0) {
                        direction = { x: 0, y: -1 };
                    }
                    break;
                case 'ArrowDown':
                    if (direction.y === 0) {
                        direction = { x: 0, y: 1 };
                    }
                    break;
                case 'ArrowLeft':
                    if (direction.x === 0) {
                        direction = { x: -1, y: 0 };
                    }
                    break;
                case 'ArrowRight':
                    if (direction.x === 0) {
                        direction = { x: 1, y: 0 };
                    }
                    break;
            }
        });

        // 游戏循环
        function gameLoop() {
            update();
            draw();
        }

        // 初始化游戏
        function initGame() {
            initSnake();
            generateFood();
            setInterval(gameLoop, 100); // 每100毫秒更新一次游戏
        }

        // 页面加载完成后初始化游戏
        window.onload = initGame;
    </script>
</body>
</html>
