<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2046游戏</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>2046游戏</h1>
            <div class="score-container">
                <div class="score-box">
                    <div class="score-label">当前分数</div>
                    <div class="score" id="current-score">0</div>
                </div>
                <div class="score-box">
                    <div class="score-label">最高分数</div>
                    <div class="score" id="best-score">0</div>
                </div>
                <div class="score-box">
                    <div class="score-label">游戏时间</div>
                    <div class="score" id="game-time">00:00</div>
                </div>
            </div>
        </div>
        
        <div class="game-container">
            <div class="game-info">
                <div class="game-controls">
                    <button id="new-game-btn" class="btn">新游戏</button>
                    <button id="undo-btn" class="btn">撤销</button>
                    <button id="difficulty-btn" class="btn">难度: 4x4</button>
                </div>
                <div class="game-message" id="game-message"></div>
            </div>
            
            <div class="game-board" id="game-board">
                <!-- 游戏格子将通过JavaScript动态生成 -->
            </div>
        </div>
        
        <div class="instructions">
            <h2>游戏说明</h2>
            <p>使用方向键或滑动来移动方块。相同数字的方块碰撞时会合并成一个！</p>
            <p>目标：创造出2046方块！</p>
        </div>
    </div>

    <script src="game.js"></script>
</body>
</html>
