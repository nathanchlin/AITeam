<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2046游戏</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="responsive.css">
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>2046</h1>
            <div class="scores-container">
                <div class="score-container">
                    <div class="score-title">当前分数</div>
                    <div id="score" class="score">0</div>
                </div>
                <div class="score-container">
                    <div class="score-title">最高分数</div>
                    <div id="best-score" class="score">0</div>
                </div>
            </div>
            <button id="new-game-button" class="new-game-button">新游戏</button>
        </div>
        
        <div class="game-container">
            <div class="game-message">
                <p></p>
                <div class="lower">
                    <button class="retry-button">再玩一次</button>
                </div>
            </div>
            
            <div class="grid-container">
                <div class="grid-row">
                    <div class="grid-cell"></div>
                    <div class="grid-cell"></div>
                    <div class="grid-cell"></div>
                    <div class="grid-cell"></div>
                </div>
                <div class="grid-row">
                    <div class="grid-cell"></div>
                    <div class="grid-cell"></div>
                    <div class="grid-cell"></div>
                    <div class="grid-cell"></div>
                </div>
                <div class="grid-row">
                    <div class="grid-cell"></div>
                    <div class="grid-cell"></div>
                    <div class="grid-cell"></div>
                    <div class="grid-cell"></div>
                </div>
                <div class="grid-row">
                    <div class="grid-cell"></div>
                    <div class="grid-cell"></div>
                    <div class="grid-cell"></div>
                    <div class="grid-cell"></div>
                </div>
            </div>
            
            <div class="tile-container"></div>
        </div>
        
        <div class="game-explanation">
            <p><strong>游戏说明:</strong> 使用方向键移动方块。当两个相同数字的方块碰撞时，它们会合并成一个！</p>
        </div>
    </div>

    <script src="game.js"></script>
</body>
</html>
