<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>2046游戏</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>2046</h1>
            <div class="score-container">
                <div class="score-box">
                    <span class="score-label">分数</span>
                    <span id="score" class="score">0</span>
                </div>
                <div class="score-box">
                    <span class="score-label">最高分</span>
                    <span id="best-score" class="score">0</span>
                </div>
            </div>
        </header>
        
        <main>
            <div class="game-controls">
                <button id="new-game-btn" class="btn">新游戏</button>
                <button id="undo-btn" class="btn">撤销</button>
                <select id="size-selector" class="size-selector">
                    <option value="4">4×4</option>
                    <option value="5">5×5</option>
                    <option value="6">6×6</option>
                </select>
            </div>
            
            <div class="game-container">
                <div id="grid-container" class="grid-container">
                    <!-- 游戏网格将通过JavaScript动态生成 -->
                </div>
                <div id="tile-container" class="tile-container">
                    <!-- 游戏方块将通过JavaScript动态生成 -->
                </div>
            </div>
            
            <div class="game-message">
                <p id="game-message"></p>
                <button id="try-again-btn" class="btn hidden">再试一次</button>
            </div>
        </main>
        
        <footer>
            <div class="game-info">
                <h3>游戏说明</h3>
                <p>使用方向键或滑动来移动方块。当两个相同数字的方块碰撞时，它们会合并成一个！</p>
                <p>目标是创建一个值为2046的方块！</p>
            </div>
            <div class="game-stats">
                <div class="stat-item">
                    <span class="stat-label">游戏时间:</span>
                    <span id="game-time" class="stat-value">00:00</span>
                </div>
                <div class="stat-item">
                    <span class="stat-label">移动次数:</span>
                    <span id="move-count" class="stat-value">0</span>
                </div>
            </div>
        </footer>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
