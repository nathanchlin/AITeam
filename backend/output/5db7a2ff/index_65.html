<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2046游戏</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="responsive.css">
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>2046</h1>
            <div class="score-container">
                <div class="score-box">
                    <span class="score-label">当前分数</span>
                    <span id="score" class="score">0</span>
                </div>
                <div class="score-box">
                    <span class="score-label">最高分数</span>
                    <span id="best-score" class="score">0</span>
                </div>
            </div>
        </div>
        
        <div class="game-container">
            <div class="game-info">
                <button id="new-game-btn" class="btn">新游戏</button>
                <button id="undo-btn" class="btn">撤销</button>
            </div>
            
            <div id="grid-container" class="grid-container">
                <!-- 游戏网格将通过JavaScript动态生成 -->
            </div>
            
            <div class="game-message">
                <p id="game-message-text"></p>
                <button id="try-again-btn" class="btn hidden">再试一次</button>
            </div>
        </div>
        
        <div class="instructions">
            <p><strong>如何玩:</strong> 使用方向键移动方块。当两个相同数字的方块碰撞时，它们会合并成一个！</p>
        </div>
    </div>

    <script src="game.js"></script>
</body>
</html>
