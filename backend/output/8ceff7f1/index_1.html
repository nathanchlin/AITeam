<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>羊了羊 - 挑战你的记忆力</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐑</text></svg>">
</head>
<body>
    <div class="game-container">
        <header class="game-header">
            <div class="game-info">
                <div class="score-container">
                    <span class="label">得分:</span>
                    <span id="score" class="score">0</span>
                </div>
                <div class="timer-container">
                    <span class="label">时间:</span>
                    <span id="timer" class="timer">00:00</span>
                </div>
                <div class="level-container">
                    <span class="label">关卡:</span>
                    <span id="level" class="level">1</span>
                </div>
            </div>
            <div class="game-controls">
                <button id="start-btn" class="btn primary">开始游戏</button>
                <button id="save-btn" class="btn secondary">保存进度</button>
                <button id="load-btn" class="btn secondary">加载进度</button>
                <button id="reset-btn" class="btn danger">重置游戏</button>
            </div>
        </header>

        <main class="game-board">
            <div class="card-deck" id="card-deck">
                <!-- 卡片将通过JavaScript动态生成 -->
            </div>
            <div class="game-message" id="game-message"></div>
        </main>

        <footer class="game-footer">
            <div class="stats-container">
                <div class="stat-item">
                    <span class="stat-label">最高分:</span>
                    <span id="high-score" class="stat-value">0</span>
                </div>
                <div class="stat-item">
                    <span class="stat-label">游戏次数:</span>
                    <span id="games-played" class="stat-value">0</span>
                </div>
            </div>
            <div class="share-container">
                <button id="share-btn" class="btn share">分享成绩</button>
            </div>
        </footer>
    </div>

    <!-- 游戏结束弹窗 -->
    <div class="modal" id="game-over-modal">
        <div class="modal-content">
            <h2>游戏结束</h2>
            <p>最终得分: <span id="final-score">0</span></p>
            <p>用时: <span id="final-time">00:00</span></p>
            <div class="modal-buttons">
                <button id="restart-btn" class="btn primary">再玩一次</button>
                <button id="close-modal-btn" class="btn secondary">关闭</button>
            </div>
        </div>
    </div>

    <!-- 保存成功提示 -->
    <div class="toast" id="toast">游戏进度已保存</div>

    <script src="js/storage.js"></script>
    <script src="js/game.js"></script>
</body>
</html>
