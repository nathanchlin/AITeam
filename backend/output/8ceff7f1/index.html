<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>羊了羊 - 消消乐游戏</title>
    <link rel="stylesheet" href="style.css">
    <style>
        /* Additional styles for game */
        .card {
            width: 60px;
            height: 60px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            cursor: pointer;
            transition: all 0.3s ease;
            background: linear-gradient(145deg, #ffffff, #e6e6e6);
            box-shadow: 3px 3px 6px rgba(0,0,0,0.1);
        }
        .card:hover {
            transform: scale(1.05);
        }
        .card.selected {
            background: #ffd700;
            box-shadow: 0 0 10px #ffd700;
        }
        .card.matched {
            opacity: 0;
            transform: scale(0);
        }
        .card-grid {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            gap: 10px;
            padding: 20px;
            justify-items: center;
        }
        .game-board {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }
        #game-message {
            font-size: 1.2rem;
            color: #ff6b6b;
            font-weight: bold;
            min-height: 30px;
        }
    </style>
</head>
<body>
    <div class="game-container">
        <!-- 游戏头部信息 -->
        <header class="game-header">
            <div class="game-title">
                <h1>羊了羊</h1>
            </div>
            <div class="game-stats">
                <div class="stat-item">
                    <span>⏱️</span>
                    <span id="timer">00:00</span>
                </div>
                <div class="stat-item">
                    <span>🔄</span>
                    <span id="moves">0</span>
                </div>
                <div class="stat-item">
                    <span>🏆</span>
                    <span id="score">0</span>
                </div>
            </div>
        </header>

        <!-- 游戏主体区域 -->
        <main class="game-board">
            <div class="card-grid" id="card-deck">
                <!-- 卡片将通过JavaScript动态生成 -->
            </div>
            <div id="game-message"></div>
        </main>

        <!-- 游戏控制按钮 -->
        <footer class="game-controls">
            <button id="restart-btn" class="btn btn-primary">
                🔄 重新开始
            </button>
        </footer>
    </div>

    <!-- 游戏结束弹窗 -->
    <div id="game-over-modal" class="modal" style="display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.5);z-index:1000;">
        <div style="position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);background:white;padding:30px;border-radius:15px;text-align:center;">
            <h2 style="color:#ff6b6b;margin-bottom:20px;">🎉 恭喜过关！</h2>
            <p style="margin-bottom:10px;">用时: <span id="final-time">00:00</span></p>
            <p style="margin-bottom:20px;">步数: <span id="final-moves">0</span></p>
            <button onclick="initGame()" style="padding:10px 30px;font-size:16px;background:#ff6b6b;color:white;border:none;border-radius:8px;cursor:pointer;">
                再玩一次
            </button>
        </div>
    </div>

    <script>
        // 羊了羊游戏主逻辑
        const cardSymbols = ['🐑', '🐮', '🐷', '🐸', '🐔', '🦆', '🐟', '🦀', '🐌', '🐝', '🦋', '🐞'];
        let cards = [];
        let flippedCards = [];
        let matchedPairs = 0;
        let moves = 0;
        let score = 0;
        let timer = null;
        let seconds = 0;
        let gameStarted = false;
        let canFlip = true;

        function shuffleArray(array) {
            const newArray = [...array];
            for (let i = newArray.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [newArray[i], newArray[j]] = [newArray[j], newArray[i]];
            }
            return newArray;
        }

        function createCards() {
            const gameBoard = document.getElementById('card-deck');
            gameBoard.innerHTML = '';

            // 创建配对卡片
            const selectedSymbols = cardSymbols.slice(0, 6); // 使用6种符号
            const cardPairs = [...selectedSymbols, ...selectedSymbols];
            cards = shuffleArray(cardPairs);

            cards.forEach((symbol, index) => {
                const card = document.createElement('div');
                card.className = 'card';
                card.textContent = symbol;
                card.dataset.index = index;
                card.dataset.symbol = symbol;
                card.addEventListener('click', () => flipCard(card));
                gameBoard.appendChild(card);
            });
        }

        function flipCard(card) {
            if (!canFlip) return;
            if (card.classList.contains('selected') || card.classList.contains('matched')) return;

            if (!gameStarted) {
                startTimer();
                gameStarted = true;
            }

            card.classList.add('selected');
            flippedCards.push(card);

            if (flippedCards.length === 2) {
                moves++;
                document.getElementById('moves').textContent = moves;
                canFlip = false;

                const [card1, card2] = flippedCards;

                if (card1.dataset.symbol === card2.dataset.symbol) {
                    // 匹配成功
                    setTimeout(() => {
                        card1.classList.remove('selected');
                        card2.classList.remove('selected');
                        card1.classList.add('matched');
                        card2.classList.add('matched');
                        matchedPairs++;
                        score += 100;
                        document.getElementById('score').textContent = score;

                        flippedCards = [];
                        canFlip = true;

                        if (matchedPairs === cards.length / 2) {
                            endGame();
                        }
                    }, 500);
                } else {
                    // 匹配失败
                    setTimeout(() => {
                        card1.classList.remove('selected');
                        card2.classList.remove('selected');
                        flippedCards = [];
                        canFlip = true;
                    }, 1000);
                }
            }
        }

        function startTimer() {
            timer = setInterval(() => {
                seconds++;
                const mins = Math.floor(seconds / 60).toString().padStart(2, '0');
                const secs = (seconds % 60).toString().padStart(2, '0');
                document.getElementById('timer').textContent = `${mins}:${secs}`;
            }, 1000);
        }

        function stopTimer() {
            clearInterval(timer);
        }

        function endGame() {
            stopTimer();
            document.getElementById('final-time').textContent = document.getElementById('timer').textContent;
            document.getElementById('final-moves').textContent = moves;
            document.getElementById('game-over-modal').style.display = 'block';
        }

        function initGame() {
            stopTimer();
            flippedCards = [];
            matchedPairs = 0;
            moves = 0;
            score = 0;
            seconds = 0;
            gameStarted = false;
            canFlip = true;

            document.getElementById('timer').textContent = '00:00';
            document.getElementById('moves').textContent = '0';
            document.getElementById('score').textContent = '0';
            document.getElementById('game-over-modal').style.display = 'none';

            createCards();
        }

        document.getElementById('restart-btn').addEventListener('click', initGame);

        // 初始化游戏
        initGame();
    </script>
</body>
</html>
