<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>打砖块游戏</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            background-color: #f0f0f0;
            font-family: Arial, sans-serif;
        }
        
        #game-container {
            position: relative;
            margin-bottom: 20px;
        }
        
        #game-canvas {
            background-color: #333;
            border: 2px solid #222;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.5);
        }
        
        #game-info {
            display: flex;
            justify-content: space-between;
            width: 800px;
            margin-bottom: 10px;
            font-size: 18px;
            font-weight: bold;
        }
        
        #score {
            color: #ff9900;
        }
        
        #lives {
            color: #ff3366;
        }
        
        #level {
            color: #33cc33;
        }
        
        #controls {
            display: flex;
            gap: 10px;
        }
        
        button {
            padding: 10px 20px;
            font-size: 16px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            transition: background-color 0.3s;
        }
        
        button:hover {
            background-color: #45a049;
        }
        
        button:disabled {
            background-color: #cccccc;
            cursor: not-allowed;
        }
        
        #instructions {
            margin-top: 20px;
            padding: 15px;
            background-color: #f9f9f9;
            border-radius: 5px;
            max-width: 800px;
        }
        
        #game-over-message {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 36px;
            font-weight: bold;
            color: white;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.8);
            display: none;
        }
        
        .particle {
            position: absolute;
            width: 5px;
            height: 5px;
            background-color: #ff9900;
            border-radius: 50%;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <h1>打砖块游戏</h1>
    
    <div id="game-info">
        <div id="score">得分: 0</div>
        <div id="level">等级: 1</div>
        <div id="lives">生命: 3</div>
    </div>
    
    <div id="game-container">
        <canvas id="game-canvas" width="800" height="600"></canvas>
        <div id="game-over-message"></div>
    </div>
    
    <div id="controls">
        <button id="start-btn">开始游戏</button>
        <button id="pause-btn" disabled>暂停</button>
        <button id="reset-btn">重置游戏</button>
    </div>
    
    <div id="instructions">
        <h3>游戏说明：</h3>
        <p>使用左右方向键控制挡板移动，接住球并反弹击碎砖块。</p>
        <p>击碎所有砖块进入下一关，球掉落底部会失去一条生命。</p>
        <p>生命值为0时游戏结束。祝您游戏愉快！</p>
    </div>

    <script>
        // 获取DOM元素
        const canvas = document.getElementById('game-canvas');
        const ctx = canvas.getContext('2d');
        const startBtn = document.getElementById('start-btn');
        const pauseBtn = document.getElementById('pause-btn');
        const resetBtn = document.getElementById('reset-btn');
        const scoreElement = document.getElementById('score');
        const livesElement = document.getElementById('lives');
        const levelElement = document.getElementById('level');
        const gameOverMessage = document.getElementById('game-over-message');
        
        // 游戏状态
        let gameRunning = false;
        let gamePaused = false;
        let score = 0;
        let lives = 3;
        let level = 1;
        let animationId = null;
        
        // 游戏对象
        const paddle = {
            x: canvas.width / 2 - 50,
            y: canvas.height - 30,
            width: 100,
            height: 15,
            speed: 8,
            color: '#00ccff'
        };
        
        const ball = {
            x: canvas.width / 2,
            y: canvas.height - 50,
            radius: 10,
            dx: 4,
            dy: -4,
            speed: 4,
            color: '#ffffff'
        };
        
        // 砖块设置
        const brickConfig = {
            rows: 5,
            cols: 10,
            width: 70,
            height: 20,
            padding: 10,
            offsetTop: 60,
            offsetLeft: 35,
            colors: ['#ff3366', '#ff9933', '#ffcc00', '#33cc33', '#3366ff']
        };
        
        let bricks = [];
        
        // 粒子效果
        let particles = [];
        
        // 键盘状态
        const keys = {
            left: false,
            right: false
        };
        
        // 初始化砖块
        function initBricks() {
            bricks = [];
            for (let r = 0; r < brickConfig.rows; r++) {
                bricks[r] = [];
                for (let c = 0; c < brickConfig.cols; c++) {
                    bricks[r][c] = { 
                        x: 0, 
                        y: 0, 
                        status: 1,
                        color: brickConfig.colors[r % brickConfig.colors.length]
                    };
                }
            }
        }
        
        // 绘制挡板
        function drawPaddle() {
            ctx.beginPath();
            ctx.roundRect(paddle.x, paddle.y, paddle.width, paddle.height, 5);
            ctx.fillStyle = paddle.color;
            ctx.fill();
            ctx.closePath();
            
            // 添加光泽效果
            ctx.beginPath();
            ctx.roundRect(paddle.x, paddle.y, paddle.width, paddle.height / 2, 5);
            ctx.fillStyle = 'rgba(255, 255, 255, 0.3)';
            ctx.fill();
            ctx.closePath();
        }
        
        // 绘制球
        function drawBall() {
            ctx.beginPath();
            ctx.arc(ball.x, ball.y, ball.radius, 0, Math.PI * 2);
            ctx.fillStyle = ball.color;
            ctx.fill();
            ctx.closePath();
            
            // 添加光泽效果
            ctx.beginPath();
            ctx.arc(ball.x - ball.radius / 3, ball.y - ball.radius / 3, ball.radius / 2, 0, Math.PI * 2);
            ctx.fillStyle = 'rgba(255, 255, 255, 0.5)';
            ctx.fill();
            ctx.closePath();
        }
        
        // 绘制砖块
        function drawBricks() {
            for (let r = 0; r < brickConfig.rows; r++) {
                for (let c = 0; c < brickConfig.cols; c++) {
                    if (bricks[r][c].status === 1) {
                        const brickX = c * (brickConfig.width + brickConfig.padding) + brickConfig.offsetLeft;
                        const brickY = r * (brickConfig.height + brickConfig.padding) + brickConfig.offsetTop;
                        
                        bricks[r][c].x = brickX;
                        bricks[r][c].y = brickY;
                        
                        ctx.beginPath();
                        ctx.roundRect(brickX, brickY, brickConfig.width, brickConfig.height, 3);
                        ctx.fillStyle = bricks[r][c].color;
                        ctx.fill();
                        ctx.closePath();
                        
                        // 添加光泽效果
                        ctx.beginPath();
                        ctx.roundRect(brickX, brickY, brickConfig.width, brickConfig.height / 2, 3);
                        ctx.fillStyle = 'rgba(255, 255, 255, 0.3)';
                        ctx.fill();
                        ctx.closePath();
                    }
                }
            }
        }
        
        // 创建粒子效果
        function createParticles(x, y, color) {
            for (let i = 0; i < 10; i++) {
                particles.push({
                    x: x,
                    y: y,
                    dx: (Math.random() - 0.5) * 5,
                    dy: (Math.random() - 0.5) * 5,
                    radius: Math.random() * 3 + 1,
                    color: color,
                    alpha: 1,
                    life: 30
                });
            }
        }
        
        // 更新和绘制粒子
        function updateParticles() {
            for (let i = 0; i < particles.length; i++) {
                const p = particles[i];
                
                p.x += p.dx;
                p.y += p.dy;
                p.alpha -= 1 / p.life;
                
                ctx.globalAlpha = p.alpha;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                ctx.fillStyle = p.color;
                ctx.fill();
                ctx.closePath();
                ctx.globalAlpha = 1;
                
                if (p.alpha <= 0) {
                    particles.splice(i, 1);
                    i--;
                }
            }
        }
        
        // 碰撞检测
        function collisionDetection() {
            for (let r = 0; r < brickConfig.rows; r++) {
                for (let c = 0; c < brickConfig.cols; c++) {
                    const b = bricks[r][c];
                    if (b.status === 1) {
                        if (ball.x > b.x && 
                            ball.x < b.x + brickConfig.width && 
                            ball.y > b.y && 
                            ball.y < b.y + brickConfig.height) {
                            
                            ball.dy = -ball.dy;
                            b.status = 0;
                            score += 10 * level;
                            updateScore();
                            
                            // 创建粒子效果
                            createParticles(b.x + brickConfig.width / 2, b.y + brickConfig.height / 2, b.color);
                            
                            // 检查是否通关
                            if (checkLevelComplete()) {
                                nextLevel();
                            }
                        }
                    }
                }
            }
        }
        
        // 检查关卡是否完成
        function checkLevelComplete() {
            for (let r = 0; r < brickConfig.rows; r++) {
                for (let c = 0; c < brickConfig.cols; c++) {
                    if (bricks[r][c].status === 1) {
                        return false;
                    }
                }
            }
            return true;
        }
        
        // 进入下一关
        function nextLevel() {
            level++;
            updateLevel();
            ball.speed += 0.5;
            initBricks();
            resetBall();
            
            // 显示关卡完成消息
            showMessage(`关卡 ${level - 1} 完成！`, 2000);
        }
        
        // 显示消息
        function showMessage(text, duration) {
            gameOverMessage.textContent = text;
            gameOverMessage.style.display = 'block';
            
            setTimeout(() => {
                gameOverMessage.style.display = 'none';
            }, duration);
        }
        
        // 更新球的位置
        function updateBall() {
            ball.x += ball.dx;
            ball.y += ball.dy;
            
            // 左右边界碰撞
            if (ball.x + ball.radius > canvas.width || ball.x - ball.radius < 0) {
                ball.dx = -ball.dx;
            }
            
            // 上边界碰撞
            if (ball.y - ball.radius < 0) {
                ball.dy = -ball.dy;
            }
            
            // 挡板碰撞
            if (ball.y + ball.radius > paddle.y && 
                ball.x > paddle.x && 
                ball.x < paddle.x + paddle.width) {
                
                // 计算球击中挡板的位置，影响反弹角度
                const hitPos = (ball.x - paddle.x) / paddle.width;
                const angle = hitPos * Math.PI - Math.PI / 2;
                
                ball.dx = ball.speed * Math.cos(angle);
                ball.dy = -ball.speed * Math.sin(angle);
                
                // 确保球不会卡在挡板里
                ball.y = paddle.y - ball.radius;
            }
            
            // 底部边界 - 失去生命
            if (ball.y + ball.radius > canvas.height) {
                lives--;
                updateLives();
                
                if (lives === 0) {
                    gameOver();
                } else {
                    resetBall();
                    showMessage(`生命 -1`, 1000);
                }
            }
        }
        
        // 更新挡板位置
        function updatePaddle() {
            if (keys.left && paddle.x > 0) {
                paddle.x -= paddle.speed;
            }
            if (keys.right && paddle.x + paddle.width < canvas.width) {
                paddle.x += paddle.speed;
            }
        }
        
        // 重置球的位置
        function resetBall() {
            ball.x = canvas.width / 2;
            ball.y = canvas.height - 50;
            ball.dx = ball.speed * (Math.random() > 0.5 ? 1 : -1);
            ball.dy = -ball.speed;
        }
        
        // 更新分数显示
        function updateScore() {
            scoreElement.textContent = `得分: ${score}`;
        }
        
        // 更新生命显示
        function updateLives() {
            livesElement.textContent = `生命: ${lives}`;
        }
        
        // 更新等级显示
        function updateLevel() {
            levelElement.textContent = `等级: ${level}`;
        }
        
        // 游戏结束
        function gameOver() {
            gameRunning = false;
            cancelAnimationFrame(animationId);
            gameOverMessage.textContent = `游戏结束！最终得分: ${score}`;
            gameOverMessage.style.display = 'block';
            
            startBtn.disabled = false;
            pauseBtn.disabled = true;
        }
        
        // 游戏主循环
        function gameLoop() {
            if (!gameRunning || gamePaused) return;
            
            // 清空画布
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // 绘制游戏元素
            drawBricks();
            drawPaddle();
            drawBall();
            
            // 更新游戏状态
            updateBall();
            updatePaddle();
            collisionDetection();
            updateParticles();
            
            animationId = requestAnimationFrame(gameLoop);
        }
        
        // 开始游戏
        function startGame() {
            gameRunning = true;
            gamePaused = false;
            gameOverMessage.style.display = 'none';
            
            startBtn.disabled = true;
            pauseBtn.disabled = false;
            
            gameLoop();
        }
        
        // 暂停/继续游戏
        function togglePause() {
            if (!gameRunning) return;
            
            gamePaused = !gamePaused;
            pauseBtn.textContent = gamePaused ? '继续' : '暂停';
            
            if (!gamePaused) {
                gameLoop();
            }
        }
        
        // 重置游戏
        function resetGame() {
            gameRunning = false;
            gamePaused = false;
            score = 0;
            lives = 3;
            level = 1;
            ball.speed = 4;
            
            cancelAnimationFrame(animationId);
            
            updateScore();
            updateLives();
            updateLevel();
            
            initBricks();
            resetBall();
            paddle.x = canvas.width / 2 - 50;
            particles = [];
            
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            drawBricks();
            drawPaddle();
            drawBall();
            
            gameOverMessage.style.display = 'none';
            startBtn.disabled = false;
            pauseBtn.disabled = true;
            pauseBtn.textContent = '暂停';
        }
        
        // 键盘事件监听
        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowLeft') {
                keys.left = true;
            } else if (e.key === 'ArrowRight') {
                keys.right = true;
            }
        });
        
        document.addEventListener('keyup', (e) => {
            if (e.key === 'ArrowLeft') {
                keys.left = false;
            } else if (e.key === 'ArrowRight') {
                keys.right = false;
            }
        });
        
        // 按钮事件监听
        startBtn.addEventListener('click', startGame);
        pauseBtn.addEventListener('click', togglePause);
        resetBtn.addEventListener('click', resetGame);
        
        // 初始化游戏
        initBricks();
        drawBricks();
        drawPaddle();
        drawBall();
    </script>
</body>
</html>
