<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>打砖块游戏</title>
    
<style>
/* From style_11.css */
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: 'Arial', sans-serif;
    background-color: #f0f0f0;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
}

.game-container {
    width: 800px;
    background-color: #fff;
    border-radius: 10px;
    box-shadow: 0 0 20px rgba(0, 0, 0, 0.2);
    overflow: hidden;
}

header {
    background-color: #4a4a4a;
    color: white;
    padding: 1rem;
    text-align: center;
}

h1 {
    margin-bottom: 0.5rem;
}

.score-container {
    display: flex;
    justify-content: space-around;
    font-size: 1.2rem;
}

main {
    position: relative;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 1rem;
    background-color: #f8f8f8;
}

#gameCanvas {
    background-color: #000;
    border: 2px solid #333;
    display: block;
}

footer {
    background-color: #e0e0e0;
    padding: 1rem;
    text-align: center;
}

.controls {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 1rem;
}

p {
    margin-bottom: 0.5rem;
}

button {
    padding: 0.5rem 1rem;
    font-size: 1rem;
    background-color: #4CAF50;
    color: white;
    border: none;
    border-radius: 5px;
    cursor: pointer;
    transition: background-color 0.3s;
}

button:hover {
    background-color: #45a049;
}

button:active {
    transform: scale(0.98);
}

#pauseBtn {
    background-color: #ff9800;
}

#pauseBtn:hover {
    background-color: #e68900;
}
</style>
</head>
<body>
    <div class="game-container">
        <header>
            <h1>打砖块游戏</h1>
            <div class="score-container">
                <span>得分: <span id="score">0</span></span>
                <span>生命: <span id="lives">3</span></span>
            </div>
        </header>
        
        <main>
            <canvas id="gameCanvas"></canvas>
        </main>
        
        <footer>
            <div class="controls">
                <p>使用 ← → 方向键控制挡板移动</p>
                <button id="startBtn">开始游戏</button>
                <button id="pauseBtn">暂停</button>
            </div>
        </footer>
    </div>
    
    
<script>
// From code_12.js
// 游戏配置
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const scoreElement = document.getElementById('score');
const livesElement = document.getElementById('lives');
const startBtn = document.getElementById('startBtn');
const pauseBtn = document.getElementById('pauseBtn');

// 设置Canvas尺寸
canvas.width = 800;
canvas.height = 600;

// 游戏状态
let gameRunning = false;
let gamePaused = false;
let score = 0;
let lives = 3;

// 游戏对象
const paddle = {
    x: canvas.width / 2 - 50,
    y: canvas.height - 30,
    width: 100,
    height: 15,
    speed: 8,
    dx: 0
};

const ball = {
    x: canvas.width / 2,
    y: canvas.height - 50,
    radius: 10,
    speed: 5,
    dx: 3,
    dy: -3
};

// 砖块配置
const brickRowCount = 5;
const brickColumnCount = 10;
const brickWidth = 70;
const brickHeight = 20;
const brickPadding = 10;
const brickOffsetTop = 60;
const brickOffsetLeft = 35;

// 初始化砖块
let bricks = [];
function initBricks() {
    bricks = [];
    for (let c = 0; c < brickColumnCount; c++) {
        bricks[c] = [];
        for (let r = 0; r < brickRowCount; r++) {
            const brickX = c * (brickWidth + brickPadding) + brickOffsetLeft;
            const brickY = r * (brickHeight + brickPadding) + brickOffsetTop;
            bricks[c][r] = { x: brickX, y: brickY, status: 1 };
        }
    }
}

// 键盘控制
let rightPressed = false;
let leftPressed = false;

document.addEventListener('keydown', keyDownHandler);
document.addEventListener('keyup', keyUpHandler);

function keyDownHandler(e) {
    if (e.key === 'Right' || e.key === 'ArrowRight') {
        rightPressed = true;
    } else if (e.key === 'Left' || e.key === 'ArrowLeft') {
        leftPressed = true;
    }
}

function keyUpHandler(e) {
    if (e.key === 'Right' || e.key === 'ArrowRight') {
        rightPressed = false;
    } else if (e.key === 'Left' || e.key === 'ArrowLeft') {
        leftPressed = false;
    }
}

// 绘制挡板
function drawPaddle() {
    ctx.beginPath();
    ctx.rect(paddle.x, paddle.y, paddle.width, paddle.height);
    ctx.fillStyle = '#0095DD';
    ctx.fill();
    ctx.closePath();
}

// 绘制球
function drawBall() {
    ctx.beginPath();
    ctx.arc(ball.x, ball.y, ball.radius, 0, Math.PI * 2);
    ctx.fillStyle = '#0095DD';
    ctx.fill();
    ctx.closePath();
}

// 绘制砖块
function drawBricks() {
    for (let c = 0; c < brickColumnCount; c++) {
        for (let r = 0; r < brickRowCount; r++) {
            if (bricks[c][r].status === 1) {
                const brickX = c * (brickWidth + brickPadding) + brickOffsetLeft;
                const brickY = r * (brickHeight + brickPadding) + brickOffsetTop;
                bricks[c][r].x = brickX;
                bricks[c][r].y = brickY;
                
                ctx.beginPath();
                ctx.rect(brickX, brickY, brickWidth, brickHeight);
                ctx.fillStyle = `hsl(${r * 40}, 70%, 50%)`;
                ctx.fill();
                ctx.closePath();
            }
        }
    }
}

// 碰撞检测
function collisionDetection() {
    for (let c = 0; c < brickColumnCount; c++) {
        for (let r = 0; r < brickRowCount; r++) {
            const b = bricks[c][r];
            if (b.status === 1) {
                if (
                    ball.x > b.x &&
                    ball.x < b.x + brickWidth &&
                    ball.y > b.y &&
                    ball.y < b.y + brickHeight
                ) {
                    ball.dy = -ball.dy;
                    b.status = 0;
                    score += 10;
                    scoreElement.textContent = score;
                    
                    // 检查是否所有砖块都被消除
                    if (score === brickRowCount * brickColumnCount * 10) {
                        gameWin();
                    }
                }
            }
        }
    }
}

// 更新游戏状态
function update() {
    if (!gameRunning || gamePaused) return;
    
    // 移动挡板
    if (rightPressed && paddle.x < canvas.width - paddle.width) {
        paddle.x += paddle.speed;
    } else if (leftPressed && paddle.x > 0) {
        paddle.x -= paddle.speed;
    }
    
    // 移动球
    ball.x += ball.dx;
    ball.y += ball.dy;
    
    // 球碰到左右边界
    if (ball.x + ball.dx > canvas.width - ball.radius || ball.x + ball.dx < ball.radius) {
        ball.dx = -ball.dx;
    }
    
    // 球碰到上边界
    if (ball.y + ball.dy < ball.radius) {
        ball.dy = -ball.dy;
    }
    // 球碰到挡板
    else if (
        ball.y + ball.dy > paddle.y - ball.radius &&
        ball.x > paddle.x &&
        ball.x < paddle.x + paddle.width
    ) {
        ball.dy = -ball.dy;
        
        // 根据球击中挡板的位置改变反弹角度
        const hitPoint = (ball.x - paddle.x) / paddle.width;
        ball.dx = 5 * (hitPoint - 0.5);
    }
    // 球掉落到底部
    else if (ball.y + ball.dy > canvas.height - ball.radius) {
        lives--;
        livesElement.textContent = lives;
        
        if (lives === 0) {
            gameOver();
        } else {
            resetBall();
        }
    }
    
    collisionDetection();
}

// 重置球的位置
function resetBall() {
    ball.x = canvas.width / 2;
    ball.y = canvas.height - 50;
    ball.dx = 3;
    ball.dy = -3;
    paddle.x = canvas.width / 2 - 50;
}

// 渲染游戏画面
function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    drawBricks();
    drawPaddle();
    drawBall();
    
    if (!gameRunning) {
        ctx.font = '36px Arial';
        ctx.fillStyle = '#0095DD';
        ctx.textAlign = 'center';
        ctx.fillText('点击"开始游戏"开始', canvas.width / 2, canvas.height / 2);
    } else if (gamePaused) {
        ctx.font = '36px Arial';
        ctx.fillStyle = '#0095DD';
        ctx.textAlign = 'center';
        ctx.fillText('游戏暂停', canvas.width / 2, canvas.height / 2);
    }
}

// 游戏循环
function gameLoop() {
    update();
    draw();
    requestAnimationFrame(gameLoop);
}

// 开始游戏
function startGame() {
    if (!gameRunning) {
        gameRunning = true;
        gamePaused = false;
        score = 0;
        lives = 3;
        scoreElement.textContent = score;
        livesElement.textContent = lives;
        initBricks();
        resetBall();
        startBtn.textContent = '重新开始';
    } else {
        // 重新开始游戏
        gameRunning = true;
        gamePaused = false;
        score = 0;
        lives = 3;
        scoreElement.textContent = score;
        livesElement.textContent = lives;
        initBricks();
        resetBall();
    }
}

// 暂停/继续游戏
function togglePause() {
    if (gameRunning) {
        gamePaused = !gamePaused;
        pauseBtn.textContent = gamePaused ? '继续' : '暂停';
    }
}

// 游戏结束
function gameOver() {
    gameRunning = false;
    ctx.font = '36px Arial';
    ctx.fillStyle = '#FF0000';
    ctx.textAlign = 'center';
    ctx.fillText('游戏结束!', canvas.width / 2, canvas.height / 2);
    ctx.font = '24px Arial';
    ctx.fillText(`最终得分: ${score}`, canvas.width / 2, canvas.height / 2 + 40);
}

// 游戏胜利
function gameWin() {
    gameRunning = false;
    ctx.font = '36px Arial';
    ctx.fillStyle = '#00FF00';
    ctx.textAlign = 'center';
    ctx.fillText('恭喜你赢了!', canvas.width / 2, canvas.height / 2);
    ctx.font = '24px Arial';
    ctx.fillText(`最终得分: ${score}`, canvas.width / 2, canvas.height / 2 + 40);
}

// 事件监听
startBtn.addEventListener('click', startGame);
pauseBtn.addEventListener('click', togglePause);

// 初始化游戏
initBricks();
draw();
gameLoop();
// From code_57.js
// Node.js Express示例
const express = require('express');
const bodyParser = require('body-parser');
const fs = require('fs');
const path = require('path');

const app = express();
app.use(bodyParser.json());

const FEEDBACK_FILE = path.join(__dirname, 'feedback.json');

// 保存反馈
app.post('/feedback', (req, res) => {
    const feedback = req.body;
    
    // 读取现有反馈
    let feedbacks = [];
    if (fs.existsSync(FEEDBACK_FILE)) {
        feedbacks = JSON.parse(fs.readFileSync(FEEDBACK_FILE));
    }
    
    // 添加新反馈
    feedbacks.push(feedback);
    
    // 保存反馈
    fs.writeFileSync(FEEDBACK_FILE, JSON.stringify(feedbacks, null, 2));
    
    res.json({ success: true, id: feedbacks.length });
});

// 获取反馈（管理员功能）
app.get('/admin/feedback', (req, res) => {
    if (!req.headers.authorization || req.headers.authorization !== 'Bearer admin-token') {
        return res.status(401).json({ error: 'Unauthorized' });
    }
    
    const feedbacks = fs.existsSync(FEEDBACK_FILE) 
        ? JSON.parse(fs.readFileSync(FEEDBACK_FILE)) 
        : [];
    
    res.json(feedbacks);
});

app.listen(3000, () => console.log('Feedback API running on port 3000'));

// 全局错误捕获
window.addEventListener('error', (event) => {
    const errorData = {
        timestamp: new Date().toISOString(),
        message: event.message,
        filename: event.filename,
        lineno: event.lineno,
        colno: event.colno,
        error: event.error ? event.error.stack : null,
        userAgent: navigator.userAgent,
        gameVersion: "1.0.0"
    };
    
    // 发送错误信息到服务器
    fetch('https://yourapi.com/errors', {
        method: 'POST',
        headers: {
            'Content-Type': 'application/json'
        },
        body: JSON.stringify(errorData)
    });
});

// 反馈收集函数
function collectFeedback(rating, issue, suggestion, contact) {
    const feedback = {
        timestamp: new Date().toISOString(),
        rating: rating,
        issue: issue,
        suggestion: suggestion,
        contact: contact,
        userAgent: navigator.userAgent,
        screenResolution: `${screen.width}x${screen.height}`,
        gameVersion: "1.0.0" // 从游戏配置中获取
    };
    
    // 发送到服务器
    fetch('https://yourapi.com/feedback', {
        method: 'POST',
        headers: {
            'Content-Type': 'application/json'
        },
        body: JSON.stringify(feedback)
    })
    .then(response => response.json())
    .then(data => console.log('Feedback submitted:', data))
    .catch(error => console.error('Error submitting feedback:', error));
}
</script>
</body>
</html>
