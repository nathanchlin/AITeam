<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>俄罗斯方块对战</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #1e3c72, #2a5298);
            color: #fff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .game-container {
            display: flex;
            gap: 30px;
            flex-wrap: wrap;
            justify-content: center;
            max-width: 1200px;
            width: 100%;
        }

        .game-board {
            position: relative;
            background: rgba(0, 0, 0, 0.7);
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }

        canvas {
            border: 2px solid #fff;
            border-radius: 5px;
            background: #111;
        }

        .game-info {
            background: rgba(0, 0, 0, 0.7);
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            min-width: 200px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .info-box {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            padding: 15px;
            text-align: center;
        }

        .info-box h3 {
            margin-bottom: 10px;
            font-size: 18px;
            color: #4fc3f7;
        }

        .score {
            font-size: 24px;
            font-weight: bold;
            color: #ffeb3b;
        }

        .next-piece {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .next-piece canvas {
            width: 80px;
            height: 80px;
            border: 1px solid #fff;
        }

        .controls {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .control-btn {
            background: #4fc3f7;
            color: #000;
            border: none;
            border-radius: 5px;
            padding: 10px 15px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .control-btn:hover {
            background: #29b6f6;
            transform: translateY(-2px);
        }

        .control-btn:active {
            transform: translateY(0);
        }

        .game-status {
            text-align: center;
            font-size: 20px;
            font-weight: bold;
            padding: 10px;
            border-radius: 5px;
            background: rgba(76, 175, 80, 0.3);
            margin-bottom: 10px;
        }

        .game-over {
            background: rgba(244, 67, 54, 0.3) !important;
        }

        .paused {
            background: rgba(255, 193, 7, 0.3) !important;
        }

        .instructions {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            padding: 15px;
            font-size: 14px;
            line-height: 1.6;
        }

        .instructions h3 {
            margin-bottom: 10px;
            color: #4fc3f7;
        }

        .instructions p {
            margin-bottom: 8px;
        }

        .key {
            display: inline-block;
            background: rgba(255, 255, 255, 0.2);
            padding: 3px 8px;
            border-radius: 4px;
            font-weight: bold;
            margin: 0 3px;
        }

        @media (max-width: 768px) {
            .game-container {
                flex-direction: column;
                align-items: center;
            }
            
            .game-info {
                width: 100%;
                max-width: 300px;
            }
        }
    </style>
</head>
<body>
    <div class="game-container">
        <div class="game-board">
            <div class="game-status" id="gameStatus">准备开始</div>
            <canvas id="gameCanvas" width="300" height="600"></canvas>
        </div>
        
        <div class="game-info">
            <div class="info-box">
                <h3>分数</h3>
                <div class="score" id="score">0</div>
            </div>
            
            <div class="info-box next-piece">
                <h3>下一个方块</h3>
                <canvas id="nextCanvas" width="80" height="80"></canvas>
            </div>
            
            <div class="info-box">
                <h3>控制</h3>
                <div class="controls">
                    <button class="control-btn" id="startBtn">开始游戏</button>
                    <button class="control-btn" id="pauseBtn">暂停</button>
                    <button class="control-btn" id="resetBtn">重置</button>
                </div>
            </div>
            
            <div class="instructions">
                <h3>操作说明</h3>
                <p><span class="key">←</span> <span class="key">→</span> 左右移动</p>
                <p><span class="key">↓</span> 加速下落</p>
                <p><span class="key">↑</span> 旋转方块</p>
                <p><span class="key">空格</span> 直接落下</p>
            </div>
        </div>
    </div>

    <script>
        // 游戏常量
        const COLS = 10;
        const ROWS = 20;
        const BLOCK_SIZE = 30;
        const COLORS = [
            '#FF0D72', '#0DC2FF', '#0DFF72', '#F538FF',
            '#FF8E0D', '#FFE138', '#3877FF'
        ];

        // 方块形状定义
        const SHAPES = [
            [[1, 1, 1, 1]], // I
            [[1, 1], [1, 1]], // O
            [[0, 1, 0], [1, 1, 1]], // T
            [[1, 1, 0], [0, 1, 1]], // S
            [[0, 1, 1], [1, 1, 0]], // Z
            [[1, 0, 0], [1, 1, 1]], // J
            [[0, 0, 1], [1, 1, 1]]  // L
        ];

        // 游戏状态
        let board = [];
        let currentPiece = null;
        let nextPiece = null;
        let score = 0;
        let gameRunning = false;
        let gamePaused = false;
        let dropCounter = 0;
        let lastTime = 0;
        let dropInterval = 1000; // 1秒

        // 获取DOM元素
        const gameCanvas = document.getElementById('gameCanvas');
        const nextCanvas = document.getElementById('nextCanvas');
        const gameCtx = gameCanvas.getContext('2d');
        const nextCtx = nextCanvas.getContext('2d');
        const scoreElement = document.getElementById('score');
        const gameStatusElement = document.getElementById('gameStatus');
        const startBtn = document.getElementById('startBtn');
        const pauseBtn = document.getElementById('pauseBtn');
        const resetBtn = document.getElementById('resetBtn');

        // 方块类
        class Piece {
            constructor(shape, color) {
                this.shape = shape;
                this.color = color;
                this.x = Math.floor((COLS - shape[0].length) / 2);
                this.y = 0;
            }

            rotate() {
                // 转置矩阵
                const rotated = this.shape[0].map((_, i) => 
                    this.shape.map(row => row[i])
                );
                
                // 反转每一行以完成旋转
                return rotated.map(row => row.reverse());
            }
        }

        // 初始化游戏板
        function initBoard() {
            board = Array(ROWS).fill().map(() => Array(COLS).fill(0));
        }

        // 创建随机方块
        function createRandomPiece() {
            const shapeIndex = Math.floor(Math.random() * SHAPES.length);
            return new Piece(SHAPES[shapeIndex], COLORS[shapeIndex]);
        }

        // 绘制方块
        function drawBlock(ctx, x, y, color) {
            ctx.fillStyle = color;
            ctx.fillRect(x * BLOCK_SIZE, y * BLOCK_SIZE, BLOCK_SIZE, BLOCK_SIZE);
            
            // 绘制边框
            ctx.strokeStyle = '#333';
            ctx.lineWidth = 1;
            ctx.strokeRect(x * BLOCK_SIZE, y * BLOCK_SIZE, BLOCK_SIZE, BLOCK_SIZE);
        }

        // 绘制游戏板
        function drawBoard() {
            // 清空画布
            gameCtx.fillStyle = '#111';
            gameCtx.fillRect(0, 0, gameCanvas.width, gameCanvas.height);
            
            // 绘制已固定的方块
            for (let row = 0; row < ROWS; row++) {
                for (let col = 0; col < COLS; col++) {
                    if (board[row][col]) {
                        drawBlock(gameCtx, col, row, board[row][col]);
                    }
                }
            }
            
            // 绘制当前方块
            if (currentPiece) {
                for (let row = 0; row < currentPiece.shape.length; row++) {
                    for (let col = 0; col < currentPiece.shape[row].length; col++) {
                        if (currentPiece.shape[row][col]) {
                            drawBlock(gameCtx, currentPiece.x + col, currentPiece.y + row, currentPiece.color);
                        }
                    }
                }
            }
        }

        // 绘制下一个方块预览
        function drawNextPiece() {
            // 清空画布
            nextCtx.fillStyle = '#111';
            nextCtx.fillRect(0, 0, nextCanvas.width, nextCanvas.height);
            
            if (nextPiece) {
                const blockSize = 20;
                const offsetX = (nextCanvas.width - nextPiece.shape[0].length * blockSize) / 2;
                const offsetY = (nextCanvas.height - nextPiece.shape.length * blockSize) / 2;
                
                for (let row = 0; row < nextPiece.shape.length; row++) {
                    for (let col = 0; col < nextPiece.shape[row].length; col++) {
                        if (nextPiece.shape[row][col]) {
                            nextCtx.fillStyle = nextPiece.color;
                            nextCtx.fillRect(
                                offsetX + col * blockSize,
                                offsetY + row * blockSize,
                                blockSize,
                                blockSize
                            );
                            
                            // 绘制边框
                            nextCtx.strokeStyle = '#333';
                            nextCtx.lineWidth = 1;
                            nextCtx.strokeRect(
                                offsetX + col * blockSize,
                                offsetY + row * blockSize,
                                blockSize,
                                blockSize
                            );
                        }
                    }
                }
            }
        }

        // 碰撞检测
        function collision(piece, dx = 0, dy = 0) {
            for (let row = 0; row < piece.shape.length; row++) {
                for (let col = 0; col < piece.shape[row].length; col++) {
                    if (piece.shape[row][col]) {
                        const newX = piece.x + col + dx;
                        const newY = piece.y + row + dy;
                        
                        // 检查边界
                        if (newX < 0 || newX >= COLS || newY >= ROWS) {
                            return true;
                        }
                        
                        // 检查与已有方块的碰撞
                        if (newY >= 0 && board[newY][newX]) {
                            return true;
                        }
                    }
                }
            }
            return false;
        }

        // 固定方块
        function lockPiece() {
            for (let row = 0; row < currentPiece.shape.length; row++) {
                for (let col = 0; col < currentPiece.shape[row].length; col++) {
                    if (currentPiece.shape[row][col]) {
                        const boardY = currentPiece.y + row;
                        const boardX = currentPiece.x + col;
                        
                        if (boardY >= 0) {
                            board[boardY][boardX] = currentPiece.color;
                        }
                    }
                }
            }
            
            // 检查并清除完整的行
            clearLines();
            
            // 生成新方块
            currentPiece = nextPiece;
            nextPiece = createRandomPiece();
            
            // 检查游戏是否结束
            if (collision(currentPiece)) {
                gameOver();
            }
        }

        // 清除完整的行
        function clearLines() {
            let linesCleared = 0;
            
            for (let row = ROWS - 1; row >= 0; row--) {
                if (board[row].every(cell => cell !== 0)) {
                    board.splice(row, 1);
                    board.unshift(Array(COLS).fill(0));
                    linesCleared++;
                    row++; // 重新检查当前行
                }
            }
            
            // 更新分数
            if (linesCleared > 0) {
                score += linesCleared * 100 * linesCleared; // 连消有额外加分
                updateScore();
            }
        }

        // 更新分数显示
        function updateScore() {
            scoreElement.textContent = score;
        }

        // 移动方块
        function movePiece(dx, dy) {
            if (!collision(currentPiece, dx, dy)) {
                currentPiece.x += dx;
                currentPiece.y += dy;
                return true;
            }
            return false;
        }

        // 旋转方块
        function rotatePiece() {
            const rotated = currentPiece.rotate();
            const originalShape = currentPiece.shape;
            currentPiece.shape = rotated;
            
            // 如果旋转后发生碰撞，尝试 wall kick
            if (collision(currentPiece)) {
                // 尝试向左或向右移动
                if (!movePiece(1, 0) && !movePiece(-1, 0)) {
                    // 如果无法移动，恢复原始形状
                    currentPiece.shape = originalShape;
                }
            }
        }

        // 直接落下
        function hardDrop() {
            while (movePiece(0, 1)) {
                // 继续下落直到碰撞
            }
            lockPiece();
        }

        // 游戏结束
        function gameOver() {
            gameRunning = false;
            gameStatusElement.textContent = '游戏结束';
            gameStatusElement.classList.add('game-over');
            startBtn.textContent = '重新开始';
        }

        // 暂停游戏
        function pauseGame() {
            if (!gameRunning) return;
            
            gamePaused = !gamePaused;
            if (gamePaused) {
                gameStatusElement.textContent = '游戏暂停';
                gameStatusElement.classList.add('paused');
                pauseBtn.textContent = '继续';
            } else {
                gameStatusElement.textContent = '游戏进行中';
                gameStatusElement.classList.remove('paused');
                pauseBtn.textContent = '暂停';
            }
        }

        // 重置游戏
        function resetGame() {
            initBoard();
            currentPiece = createRandomPiece();
            nextPiece = createRandomPiece();
            score = 0;
            updateScore();
            gameRunning = false;
            gamePaused = false;
            dropCounter = 0;
            lastTime = 0;
            
            gameStatusElement.textContent = '准备开始';
            gameStatusElement.classList.remove('game-over', 'paused');
            startBtn.textContent = '开始游戏';
            pauseBtn.textContent = '暂停';
            
            drawBoard();
            drawNextPiece();
        }

        // 开始游戏
        function startGame() {
            if (gameRunning) return;
            
            if (!gameRunning && gameStatusElement.textContent === '游戏结束') {
                resetGame();
            }
            
            gameRunning = true;
            gameStatusElement.textContent = '游戏进行中';
            gameStatusElement.classList.remove('game-over', 'paused');
            pauseBtn.textContent = '暂停';
            
            // 开始游戏循环
            requestAnimationFrame(gameLoop);
        }

        // 游戏循环
        function gameLoop(time = 0) {
            if (!gameRunning || gamePaused) return;
            
            const deltaTime = time - lastTime;
            lastTime = time;
            
            dropCounter += deltaTime;
            if (dropCounter > dropInterval) {
                if (!movePiece(0, 1)) {
                    lockPiece();
                }
                dropCounter = 0;
            }
            
            drawBoard();
            drawNextPiece();
            
            requestAnimationFrame(gameLoop);
        }

        // 键盘控制
        document.addEventListener('keydown', (e) => {
            if (!gameRunning || gamePaused) return;
            
            switch (e.key) {
                case 'ArrowLeft':
                    movePiece(-1, 0);
                    break;
                case 'ArrowRight':
                    movePiece(1, 0);
                    break;
                case 'ArrowDown':
                    if (movePiece(0, 1)) {
                        score++;
                        updateScore();
                    }
                    break;
                case 'ArrowUp':
                    rotatePiece();
                    break;
                case ' ':
                    e.preventDefault();
                    hardDrop();
                    break;
            }
        });

        // 按钮事件绑定
        startBtn.addEventListener('click', startGame);
        pauseBtn.addEventListener('click', pauseGame);
        resetBtn.addEventListener('click', resetGame);

        // 初始化游戏
        window.onload = () => {
            initBoard();
            currentPiece = createRandomPiece();
            nextPiece = createRandomPiece();
            drawBoard();
            drawNextPiece();
        };
    </script>
</body>
</html>
