<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neon Racer - 2D Top-Down</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Share+Tech+Mono&display=swap');
        
        :root {
            --bg-dark: #0a0a0f;
            --bg-panel: rgba(15, 15, 25, 0.95);
            --neon-cyan: #00f5ff;
            --neon-pink: #ff2d75;
            --neon-yellow: #f0ff00;
            --neon-green: #00ff88;
            --neon-orange: #ff8800;
            --neon-purple: #b347ea;
            --text-primary: #e0e0e0;
            --text-muted: #6a6a7a;
            --border-color: rgba(0, 245, 255, 0.3);
            --road-color: #1a1a2e;
            --grass-color: #0d2818;
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Share Tech Mono', monospace;
            background: var(--bg-dark);
            color: var(--text-primary);
            overflow: hidden;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        
        #gameContainer {
            position: relative;
            width: 100%;
            max-width: 900px;
            aspect-ratio: 4/3;
        }
        
        #gameCanvas {
            display: block;
            width: 100%;
            height: 100%;
            border: 2px solid var(--border-color);
            border-radius: 8px;
            box-shadow: 
                0 0 30px rgba(0, 245, 255, 0.15),
                inset 0 0 60px rgba(0, 0, 0, 0.5);
            image-rendering: pixelated;
            image-rendering: crisp-edges;
        }
        
        .menu-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, rgba(10, 10, 15, 0.98) 0%, rgba(26, 10, 46, 0.95) 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 200;
            border-radius: 8px;
        }
        
        .menu-overlay.hidden {
            display: none;
        }
        
        .menu-title {
            font-family: 'Orbitron', sans-serif;
            font-size: clamp(28px, 5vw, 48px);
            font-weight: 900;
            color: var(--neon-cyan);
            text-shadow: 
                0 0 10px var(--neon-cyan),
                0 0 20px var(--neon-cyan),
                0 0 40px var(--neon-cyan);
            margin-bottom: 10px;
            letter-spacing: 4px;
        }
        
        .menu-subtitle {
            font-size: 14px;
            color: var(--neon-pink);
            margin-bottom: 40px;
            letter-spacing: 2px;
        }
        
        .menu-btn {
            font-family: 'Orbitron', sans-serif;
            font-size: 16px;
            font-weight: 700;
            padding: 15px 50px;
            margin: 8px;
            background: linear-gradient(135deg, rgba(0, 245, 255, 0.1) 0%, rgba(255, 45, 117, 0.1) 100%);
            border: 2px solid var(--neon-cyan);
            color: var(--neon-cyan);
            cursor: pointer;
            border-radius: 4px;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 2px;
            min-width: 250px;
        }
        
        .menu-btn:hover {
            background: linear-gradient(135deg, rgba(0, 245, 255, 0.3) 0%, rgba(255, 45, 117, 0.3) 100%);
            box-shadow: 0 0 20px rgba(0, 245, 255, 0.5);
            transform: scale(1.05);
        }
        
        .menu-btn.primary {
            background: linear-gradient(135deg, var(--neon-cyan) 0%, var(--neon-pink) 100%);
            color: var(--bg-dark);
        }
        
        .result-title {
            font-family: 'Orbitron', sans-serif;
            font-size: clamp(32px, 6vw, 56px);
            font-weight: 900;
            margin-bottom: 20px;
        }
        
        .result-title.win {
            color: var(--neon-green);
            text-shadow: 0 0 20px var(--neon-green);
        }
        
        .result-title.lose {
            color: var(--neon-pink);
            text-shadow: 0 0 20px var(--neon-pink);
        }
        
        .result-stats {
            font-size: 16px;
            color: var(--text-muted);
            margin-bottom: 30px;
            text-align: center;
            line-height: 1.8;
        }
        
        .hud {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            pointer-events: none;
            z-index: 100;
        }
        
        .hud-left, .hud-right {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        
        .hud-item {
            font-family: 'Orbitron', sans-serif;
            font-size: 14px;
            color: var(--neon-cyan);
            text-shadow: 0 0 10px var(--neon-cyan);
        }
        
        .hud-value {
            font-weight: 700;
            color: var(--neon-yellow);
        }
        
        .speed-bar {
            width: 150px;
            height: 8px;
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid var(--neon-cyan);
            border-radius: 4px;
            overflow: hidden;
        }
        
        .speed-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--neon-green), var(--neon-yellow), var(--neon-pink));
            transition: width 0.1s ease;
        }
        
        .endurance-bar {
            width: 150px;
            height: 8px;
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid var(--neon-pink);
            border-radius: 4px;
            overflow: hidden;
        }
        
        .endurance-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--neon-pink), var(--neon-orange));
            transition: width 0.2s ease;
        }
        
        .lap-indicator {
            font-size: 18px;
            font-weight: 700;
        }
        
        .controls-hint {
            position: absolute;
            bottom: 15px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 12px;
            color: var(--text-muted);
            pointer-events: none;
            z-index: 100;
        }
        
        .controls-hint kbd {
            display: inline-block;
            padding: 2px 6px;
            background: rgba(0, 245, 255, 0.2);
            border: 1px solid var(--neon-cyan);
            border-radius: 3px;
            margin: 0 2px;
        }
        
        @media (max-width: 600px) {
            .hud {
                padding: 10px;
            }
            .hud-item {
                font-size: 11px;
            }
            .speed-bar, .endurance-bar {
                width: 100px;
            }
            .menu-btn {
                min-width: 200px;
                font-size: 14px;
                padding: 12px 30px;
            }
        }
    </style>
</head>
<body>
    <div id="gameContainer">
        <canvas id="gameCanvas"></canvas>
        
        <!-- HUD -->
        <div class="hud hidden" id="hud">
            <div class="hud-left">
                <div class="hud-item">速度 <span class="hud-value" id="speedValue">0</span> km/h</div>
                <div class="speed-bar"><div class="speed-fill" id="speedFill"></div></div>
                <div class="hud-item">耐力 <span class="hud-value" id="enduranceValue">100</span>%</div>
                <div class="endurance-bar"><div class="endurance-fill" id="enduranceFill"></div></div>
            </div>
            <div class="hud-right">
                <div class="hud-item lap-indicator">圈数 <span class="hud-value" id="lapValue">1</span>/<span id="totalLaps">3</span></div>
                <div class="hud-item">时间 <span class="hud-value" id="timeValue">0:00</span></div>
                <div class="hud-item">最佳 <span class="hud-value" id="bestLapValue">--:--</span></div>
            </div>
        </div>
        
        <!-- 开始菜单 -->
        <div class="menu-overlay" id="startMenu">
            <div class="menu-title">NEON RACER</div>
            <div class="menu-subtitle">2D Top-Down Racing</div>
            <button class="menu-btn primary" id="startBtn">开始游戏</button>
            <button class="menu-btn" id="howToPlayBtn">操作说明</button>
        </div>
        
        <!-- 结果界面 -->
        <div class="menu-overlay hidden" id="resultMenu">
            <div class="result-title" id="resultTitle">完成比赛!</div>
            <div class="result-stats" id="resultStats"></div>
            <button class="menu-btn primary" id="restartBtn">再来一局</button>
            <button class="menu-btn" id="menuBtn">返回菜单</button>
        </div>
        
        <!-- 操作提示 -->
        <div class="controls-hint hidden" id="controlsHint">
            <kbd>W</kbd>加速 <kbd>S</kbd>刹车 <kbd>A</kbd><kbd>D</kbd>转向
        </div>
    </div>

<script>
// ============ 常量定义 ============
const CANVAS_WIDTH = 800;
const CANVAS_HEIGHT = 600;
const ROAD_WIDTH = 300;
const LANE_COUNT = 3;
const LANE_WIDTH = ROAD_WIDTH / LANE_COUNT;

// ============ 音效系统 ============
class AudioSystem {
    constructor() {
        this.ctx = null;
        this.enabled = true;
        this.initialized = false;
    }
    
    init() {
        if (this.initialized) return;
        try {
            this.ctx = new (window.AudioContext || window.webkitAudioContext)();
            this.initialized = true;
        } catch (e) {
            this.enabled = false;
        }
    }
    
    playEngine(speed) {
        if (!this.enabled || !this.ctx) return;
        // 简化的引擎音效
    }
    
    playCollision(intensity) {
        if (!this.enabled || !this.ctx) return;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.frequency.setValueAtTime(150, this.ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(50, this.ctx.currentTime + 0.1);
        gain.gain.setValueAtTime(Math.min(intensity * 0.1, 0.3), this.ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.15);
        osc.start();
        osc.stop(this.ctx.currentTime + 0.15);
    }
    
    playLap() {
        if (!this.enabled || !this.ctx) return;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.frequency.setValueAtTime(880, this.ctx.currentTime);
        osc.frequency.setValueAtTime(1100, this.ctx.currentTime + 0.1);
        gain.gain.setValueAtTime(0.2, this.ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.3);
        osc.start();
        osc.stop(this.ctx.currentTime + 0.3);
    }
    
    playGameOver(win) {
        if (!this.enabled || !this.ctx) return;
        const frequencies = win ? [523, 659, 784, 1047] : [400, 350, 300, 250];
        frequencies.forEach((freq, i) => {
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            osc.connect(gain);
            gain.connect(this.ctx.destination);
            osc.frequency.setValueAtTime(freq, this.ctx.currentTime + i * 0.15);
            gain.gain.setValueAtTime(0.15, this.ctx.currentTime + i * 0.15);
            gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + i * 0.15 + 0.2);
            osc.start(this.ctx.currentTime + i * 0.15);
            osc.stop(this.ctx.currentTime + i * 0.15 + 0.2);
        });
    }
}

// ============ 2D赛道系统 ============
class Track2D {
    constructor() {
        this.roadLeft = (CANVAS_WIDTH - ROAD_WIDTH) / 2;
        this.roadRight = this.roadLeft + ROAD_WIDTH;
        this.scrollY = 0;
        this.checkpointY = 0;
        this.passedCheckpoint = false;
    }
    
    update(speed, dt) {
        this.scrollY += speed * dt * 0.5;
        if (this.scrollY > 100) this.scrollY -= 100;
    }
    
    isOnTrack(x, y) {
        return x >= this.roadLeft && x <= this.roadRight;
    }
    
    getLaneCenter(lane) {
        return this.roadLeft + LANE_WIDTH * (lane + 0.5);
    }
    
    checkLapCompletion(player, playerPrevY) {
        const finishLineY = 100;
        // 玩家从下方穿过终点线到上方
        if (playerPrevY > finishLineY && player.y <= finishLineY && !this.passedCheckpoint) {
            this.passedCheckpoint = true;
            return true;
        }
        // 重置检查点状态（当玩家回到赛道中段）
        if (player.y > finishLineY + 200) {
            this.passedCheckpoint = false;
        }
        return false;
    }
    
    render(ctx) {
        // 草地背景
        ctx.fillStyle = '#0d2818';
        ctx.fillRect(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);
        
        // 道路
        const gradient = ctx.createLinearGradient(this.roadLeft, 0, this.roadRight, 0);
        gradient.addColorStop(0, '#1a1a2e');
        gradient.addColorStop(0.5, '#252540');
        gradient.addColorStop(1, '#1a1a2e');
        ctx.fillStyle = gradient;
        ctx.fillRect(this.roadLeft, 0, ROAD_WIDTH, CANVAS_HEIGHT);
        
        // 道路边线（霓虹效果）
        ctx.strokeStyle = '#00f5ff';
        ctx.lineWidth = 4;
        ctx.shadowColor = '#00f5ff';
        ctx.shadowBlur = 15;
        ctx.beginPath();
        ctx.moveTo(this.roadLeft, 0);
        ctx.lineTo(this.roadLeft, CANVAS_HEIGHT);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(this.roadRight, 0);
        ctx.lineTo(this.roadRight, CANVAS_HEIGHT);
        ctx.stroke();
        ctx.shadowBlur = 0;
        
        // 车道分隔线（虚线）
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.3)';
        ctx.lineWidth = 2;
        ctx.setLineDash([30, 20]);
        for (let i = 1; i < LANE_COUNT; i++) {
            const x = this.roadLeft + LANE_WIDTH * i;
            ctx.beginPath();
            ctx.moveTo(x, -this.scrollY % 50);
            for (let y = -this.scrollY % 50; y < CANVAS_HEIGHT; y += 50) {
                ctx.lineTo(x, y);
            }
            ctx.stroke();
        }
        ctx.setLineDash([]);
        
        // 终点线
        ctx.fillStyle = '#ff2d75';
        ctx.shadowColor = '#ff2d75';
        ctx.shadowBlur = 20;
        ctx.fillRect(this.roadLeft + 10, 95, ROAD_WIDTH - 20, 10);
        ctx.shadowBlur = 0;
        
        // 终点线棋盘格
        const tileSize = 10;
        for (let i = 0; i < Math.floor((ROAD_WIDTH - 20) / tileSize); i++) {
            for (let j = 0; j < 1; j++) {
                ctx.fillStyle = (i + j) % 2 === 0 ? '#ffffff' : '#000000';
                ctx.fillRect(this.roadLeft + 10 + i * tileSize, 95 + j * tileSize, tileSize, tileSize);
            }
        }
    }
}

// ============ 玩家车辆 ============
class PlayerCar {
    constructor(x, y) {
        this.x = x;
        this.y = y;
        this.width = 40;
        this.height = 70;
        this.speed = 0;
        this.maxSpeed = 600;
        this.acceleration = 400;
        this.deceleration = 200;
        this.turnSpeed = 250;
        this.angle = 0;
        this.endurance = 100;
        this.invincible = false;
        this.invincibleTimer = 0;
    }
    
    update(dt, keys, track) {
        // 加速/减速
        if (keys.up) {
            this.speed += this.acceleration * dt;
        } else if (keys.down) {
            this.speed -= this.deceleration * 2 * dt;
        } else {
            this.speed -= this.deceleration * 0.5 * dt;
        }
        this.speed = Math.max(0, Math.min(this.maxSpeed, this.speed));
        
        // 转向
        if (keys.left) {
            this.x -= this.turnSpeed * dt;
            this.angle = -0.15;
        } else if (keys.right) {
            this.x += this.turnSpeed * dt;
            this.angle = 0.15;
        } else {
            this.angle *= 0.9;
        }
        
        // 边界检测
        const halfWidth = this.width / 2;
        this.x = Math.max(halfWidth, Math.min(CANVAS_WIDTH - halfWidth, this.x));
        
        // 不在赛道上减速
        if (track && !track.isOnTrack(this.x, this.y)) {
            this.speed *= 0.98;
        }
        
        // 无敌时间更新
        if (this.invincible) {
            this.invincibleTimer -= dt;
            if (this.invincibleTimer <= 0) {
                this.invincible = false;
            }
        }
    }
    
    getBounds() {
        return {
            x: this.x - this.width / 2,
            y: this.y - this.height / 2,
            width: this.width,
            height: this.height
        };
    }
    
    takeDamage(amount) {
        if (this.invincible) return false;
        this.endurance -= amount;
        this.invincible = true;
        this.invincibleTimer = 1.0; // 1秒无敌时间
        return true;
    }
    
    render(ctx) {
        ctx.save();
        ctx.translate(this.x, this.y);
        ctx.rotate(this.angle);
        
        // 无敌时闪烁
        if (this.invincible && Math.floor(Date.now() / 100) % 2 === 0) {
            ctx.globalAlpha = 0.5;
        }
        
        // 车身阴影
        ctx.fillStyle = 'rgba(0, 0, 0, 0.3)';
        ctx.fillRect(-this.width/2 + 3, -this.height/2 + 3, this.width, this.height);
        
        // 车身
        const gradient = ctx.createLinearGradient(-this.width/2, 0, this.width/2, 0);
        gradient.addColorStop(0, '#ff2d75');
        gradient.addColorStop(0.5, '#ff5588');
        gradient.addColorStop(1, '#ff2d75');
        ctx.fillStyle = gradient;
        ctx.fillRect(-this.width/2, -this.height/2, this.width, this.height);
        
        // 车顶
        ctx.fillStyle = '#cc1155';
        ctx.fillRect(-this.width/4, -this.height/4, this.width/2, this.height/2);
        
        // 挡风玻璃
        ctx.fillStyle = '#00f5ff';
        ctx.fillRect(-this.width/3, -this.height/2 + 8, this.width * 2/3, 12);
        
        // 尾灯
        ctx.fillStyle = '#ff0000';
        ctx.shadowColor = '#ff0000';
        ctx.shadowBlur = 10;
        ctx.fillRect(-this.width/2 + 5, this.height/2 - 8, 8, 5);
        ctx.fillRect(this.width/2 - 13, this.height/2 - 8, 8, 5);
        ctx.shadowBlur = 0;
        
        ctx.restore();
    }
}

// ============ 障碍物基类 ============
class Obstacle {
    constructor(x, y, type) {
        this.x = x;
        this.y = y;
        this.type = type;
        this.speed = 0; // 相对于地面的速度
        this.active = true;
    }
    
    getBounds() {
        return {
            x: this.x - this.width / 2,
            y: this.y - this.height / 2,
            width: this.width,
            height: this.height
        };
    }
    
    update(playerSpeed, dt) {
        // 障碍物相对于玩家移动（玩家向前时，障碍物向下移动）
        this.y += (playerSpeed - this.speed) * dt;
    }
    
    isOffScreen() {
        return this.y > CANVAS_HEIGHT + 100 || this.y < -200;
    }
}

// ============ 路障（静态障碍物） ============
class RoadCone extends Obstacle {
    constructor(x, y) {
        super(x, y, 'cone');
        this.width = 25;
        this.height = 30;
        this.damage = 15;
        this.speed = 0;
    }
    
    render(ctx) {
        // 锥桶
        ctx.fillStyle = '#ff8800';
        ctx.shadowColor = '#ff8800';
        ctx.shadowBlur = 5;
        
        ctx.beginPath();
        ctx.moveTo(this.x, this.y - this.height/2);
        ctx.lineTo(this.x - this.width/2, this.y + this.height/2);
        ctx.lineTo(this.x + this.width/2, this.y + this.height/2);
        ctx.closePath();
        ctx.fill();
        
        // 白色条纹
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(this.x - 8, this.y - 5, 16, 4);
        ctx.fillRect(this.x - 5, this.y + 5, 10, 3);
        
        ctx.shadowBlur = 0;
    }
}

// ============ 油桶（大型静态障碍物） ============
class OilBarrel extends Obstacle {
    constructor(x, y) {
        super(x, y, 'barrel');
        this.width = 35;
        this.height = 45;
        this.damage = 25;
        this.speed = 0;
    }
    
    render(ctx) {
        // 油桶主体
        ctx.fillStyle = '#444444';
        ctx.fillRect(this.x - this.width/2, this.y - this.height/2, this.width, this.height);
        
        // 危险标志
        ctx.fillStyle = '#ffcc00';
        ctx.fillRect(this.x - this.width/2 + 5, this.y - this.height/2 + 5, this.width - 10, this.height - 10);
        
        ctx.fillStyle = '#000000';
        ctx.font = 'bold 16px Arial';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('!', this.x, this.y);
        
        // 边框
        ctx.strokeStyle = '#666666';
        ctx.lineWidth = 2;
        ctx.strokeRect(this.x - this.width/2, this.y - this.height/2, this.width, this.height);
    }
}

// ============ 敌方车辆（移动障碍物） ============
class EnemyCar extends Obstacle {
    constructor(x, y, lane) {
        super(x, y, 'enemy');
        this.width = 38;
        this.height = 65;
        this.damage = 30;
        this.speed = 150 + Math.random() * 150; // 敌车自身速度
        this.lane = lane;
        this.colorIndex = Math.floor(Math.random() * 4);
        this.colors = [
            { main: '#00ff88', dark: '#00aa55' }, // 绿
            { main: '#f0ff00', dark: '#aabb00' }, // 黄
            { main: '#b347ea', dark: '#7722aa' }, // 紫
            { main: '#00f5ff', dark: '#0099aa' }  // 青
        ];
    }
    
    render(ctx) {
        const color = this.colors[this.colorIndex];
        
        ctx.save();
        ctx.translate(this.x, this.y);
        
        // 车身阴影
        ctx.fillStyle = 'rgba(0, 0, 0, 0.3)';
        ctx.fillRect(-this.width/2 + 3, -this.height/2 + 3, this.width, this.height);
        
        // 车身
        const gradient = ctx.createLinearGradient(-this.width/2, 0, this.width/2, 0);
        gradient.addColorStop(0, color.dark);
        gradient.addColorStop(0.5, color.main);
        gradient.addColorStop(1, color.dark);
        ctx.fillStyle = gradient;
        ctx.fillRect(-this.width/2, -this.height/2, this.width, this.height);
        
        // 车顶
        ctx.fillStyle = color.dark;
        ctx.fillRect(-this.width/4, -this.height/4, this.width/2, this.height/2);
        
        // 前灯
        ctx.fillStyle = '#ffffff';
        ctx.shadowColor = '#ffffff';
        ctx.shadowBlur = 8;
        ctx.fillRect(-this.width/2 + 5, -this.height/2 + 5, 6, 4);
        ctx.fillRect(this.width/2 - 11, -this.height/2 + 5, 6, 4);
        ctx.shadowBlur = 0;
        
        ctx.restore();
    }
}

// ============ 碰撞粒子效果 ============
class CollisionParticle {
    constructor(x, y) {
        this.x = x;
        this.y = y;
        this.vx = (Math.random() - 0.5) * 300;
        this.vy = (Math.random() - 0.5) * 300;
        this.life = 0.5;
        this.maxLife = 0.5;
        this.size = 3 + Math.random() * 4;
        this.color = Math.random() > 0.5 ? '#ff8800' : '#ffcc00';
    }
    
    update(dt) {
        this.x += this.vx * dt;
        this.y += this.vy * dt;
        this.life -= dt;
        this.vx *= 0.98;
        this.vy *= 0.98;
    }
    
    render(ctx) {
        const alpha = this.life / this.maxLife;
        ctx.fillStyle = this.color;
        ctx.globalAlpha = alpha;
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size * alpha, 0, Math.PI * 2);
        ctx.fill();
        ctx.globalAlpha = 1;
    }
}

// ============ 游戏主类 ============
class Game {
    constructor() {
        this.canvas = document.getElementById('gameCanvas');
        this.ctx = this.canvas.getContext('2d');
        this.canvas.width = CANVAS_WIDTH;
        this.canvas.height = CANVAS_HEIGHT;
        
        this.audio = new AudioSystem();
        this.track = new Track2D();
        
        this.keys = { up: false, down: false, left: false, right: false };
        this.state = 'menu'; // menu, playing, paused, gameover
        
        this.lastTime = 0;
        this.gameTime = 0;
        this.lap = 0;
        this.totalLaps = 3;
        this.currentLapTime = 0;
        this.bestLapTime = null;
        
        // 障碍物系统
        this.obstacles = [];
        this.obstacleSpawnTimer = 0;
        this.obstacleSpawnInterval = 1.5; // 秒
        this.difficulty = 1;
        
        // 碰撞粒子
        this.particles = [];
        
        // 相机震动
        this.shakeIntensity = 0;
        this.shakeDuration = 0;
        
        // UI元素
        this.hud = document.getElementById('hud');
        this.startMenu = document.getElementById('startMenu');
        this.resultMenu = document.getElementById('resultMenu');
        this.controlsHint = document.getElementById('controlsHint');
        
        this.init();
    }
    
    init() {
        // 绑定事件
        document.getElementById('startBtn').addEventListener('click', () => this.startGame());
        document.getElementById('restartBtn').addEventListener('click', () => this.startGame());
        document.getElementById('menuBtn').addEventListener('click', () => this.showMenu());
        document.getElementById('howToPlayBtn').addEventListener('click', () => {
            alert('操作说明：\n\nW / ↑ - 加速\nS / ↓ - 刹车\nA / ← - 左转\nD / → - 右转\n\n完成3圈即可获胜！\n躲避障碍物，保护耐力值！');
        });
        
        // 键盘控制
        window.addEventListener('keydown', (e) => this.handleKeyDown(e));
        window.addEventListener('keyup', (e) => this.handleKeyUp(e));
        
        // 显示菜单
        this.showMenu();
        this.gameLoop(0);
    }
    
    handleKeyDown(e) {
        switch(e.key.toLowerCase()) {
            case 'w': case 'arrowup': this.keys.up = true; break;
            case 's': case 'arrowdown': this.keys.down = true; break;
            case 'a': case 'arrowleft': this.keys.left = true; break;
            case 'd': case 'arrowright': this.keys.right = true; break;
        }
    }
    
    handleKeyUp(e) {
        switch(e.key.toLowerCase()) {
            case 'w': case 'arrowup': this.keys.up = false; break;
            case 's': case 'arrowdown': this.keys.down = false; break;
            case 'a': case 'arrowleft': this.keys.left = false; break;
            case 'd': case 'arrowright': this.keys.right = false; break;
        }
    }
    
    startGame() {
        this.audio.init();
        
        // 初始化玩家
        this.player = new PlayerCar(CANVAS_WIDTH / 2, CANVAS_HEIGHT - 100);
        
        // 重置状态
        this.lap = 0;
        this.gameTime = 0;
        this.currentLapTime = 0;
        this.bestLapTime = null;
        this.obstacles = [];
        this.particles = [];
        this.obstacleSpawnTimer = 0;
        this.difficulty = 1;
        
        // 重置赛道
        this.track = new Track2D();
        
        // 生成初始障碍物
        this.generateInitialObstacles();
        
        // 更新UI
        this.state = 'playing';
        this.startMenu.classList.add('hidden');
        this.resultMenu.classList.add('hidden');
        this.hud.classList.remove('hidden');
        this.controlsHint.classList.remove('hidden');
    }
    
    generateInitialObstacles() {
        // 在赛道前方生成一些初始障碍物
        for (let i = 0; i < 5; i++) {
            const y = -200 - i * 300;
            this.spawnObstacleAt(y);
        }
    }
    
    showMenu() {
        this.state = 'menu';
        this.startMenu.classList.remove('hidden');
        this.resultMenu.classList.add('hidden');
        this.hud.classList.add('hidden');
        this.controlsHint.classList.add('hidden');
    }
    
    gameOver(win) {
        this.state = 'gameover';
        this.audio.playGameOver(win);
        
        const resultTitle = document.getElementById('resultTitle');
        const resultStats = document.getElementById('resultStats');
        
        if (win) {
            resultTitle.textContent = '恭喜获胜!';
            resultTitle.className = 'result-title win';
        } else {
            resultTitle.textContent = this.player.endurance <= 0 ? '车辆损毁!' : '游戏结束';
            resultTitle.className = 'result-title lose';
        }
        
        const timeStr = this.formatTime(this.gameTime);
        const bestStr = this.bestLapTime ? this.formatTime(this.bestLapTime) : '--:--';
        resultStats.innerHTML = `
            完成圈数: ${this.lap} / ${this.totalLaps}<br>
            总用时: ${timeStr}<br>
            最佳圈速: ${bestStr}<br>
            剩余耐力: ${Math.max(0, Math.floor(this.player.endurance))}%
        `;
        
        this.resultMenu.classList.remove('hidden');
        this.hud.classList.add('hidden');
        this.controlsHint.classList.add('hidden');
    }
    
    formatTime(seconds) {
        const mins = Math.floor(seconds / 60);
        const secs = Math.floor(seconds % 60);
        return `${mins}:${secs.toString().padStart(2, '0')}`;
    }
    
    // ========== 障碍物生成 ==========
    spawnObstacle() {
        const lane = Math.floor(Math.random() * LANE_COUNT);
        const x = this.track.getLaneCenter(lane);
        const y = -100; // 在屏幕上方生成
        
        this.spawnObstacleAt(y);
    }
    
    spawnObstacleAt(y) {
        const lane = Math.floor(Math.random() * LANE_COUNT);
        const x = this.track.getLaneCenter(lane);
        
        // 根据难度决定障碍物类型
        const rand = Math.random();
        let obstacle;
        
        if (rand < 0.4) {
            // 40% 概率生成路障
            obstacle = new RoadCone(x + (Math.random() - 0.5) * 20, y);
        } else if (rand < 0.6) {
            // 20% 概率生成油桶
            obstacle = new OilBarrel(x, y);
        } else {
            // 40% 概率生成敌车
            obstacle = new EnemyCar(x, y, lane);
        }
        
        // 确保不会和现有障碍物重叠
        let canSpawn = true;
        for (const existing of this.obstacles) {
            if (this.rectIntersect(
                { x: obstacle.x - obstacle.width/2, y: obstacle.y - obstacle.height/2, width: obstacle.width, height: obstacle.height },
                { x: existing.x - existing.width/2, y: existing.y - existing.height/2, width: existing.width, height: existing.height }
            )) {
                canSpawn = false;
                break;
            }
        }
        
        if (canSpawn) {
            this.obstacles.push(obstacle);
        }
    }
    
    updateObstacles(dt) {
        // 更新障碍物位置
        for (const obstacle of this.obstacles) {
            obstacle.update(this.player.speed, dt);
        }
        
        // 移除离开屏幕的障碍物
        this.obstacles = this.obstacles.filter(o => !o.isOffScreen());
        
        // 生成新障碍物
        this.obstacleSpawnTimer += dt;
        if (this.obstacleSpawnTimer >= this.obstacleSpawnInterval) {
            this.obstacleSpawnTimer = 0;
            this.spawnObstacle();
            
            // 随着游戏进行，加快生成速度
            this.obstacleSpawnInterval = Math.max(0.5, 1.5 - this.difficulty * 0.1);
        }
    }
    
    // ========== 碰撞检测 ==========
    checkCollisions() {
        const playerBounds = this.player.getBounds();
        
        for (const obstacle of this.obstacles) {
            if (!obstacle.active) continue;
            
            const obstacleBounds = obstacle.getBounds();
            
            if (this.rectIntersect(playerBounds, obstacleBounds)) {
                this.handleObstacleCollision(obstacle);
            }
        }
        
        // 检测与赛道边界的碰撞
        if (!this.track.isOnTrack(this.player.x, this.player.y)) {
            // 在赛道外减速
            this.player.speed *= 0.98;
            
            // 轻微损伤
            if (this.player.speed > 100) {
                this.player.endurance -= 0.1;
            }
        }
    }
    
    handleObstacleCollision(obstacle) {
        // 计算碰撞强度
        const relativeSpeed = Math.abs(this.player.speed - obstacle.speed);
        const collisionIntensity = Math.min(relativeSpeed / 300, 1);
        
        // 尝试造成伤害
        if (this.player.takeDamage(obstacle.damage * collisionIntensity)) {
            // 播放碰撞音效
            this.audio.playCollision(collisionIntensity * 10);
            
            // 生成碰撞粒子
            this.spawnCollisionParticles(this.player.x, this.player.y, Math.floor(collisionIntensity * 8 + 3));
            
            // 触发震动
            this.triggerShake(collisionIntensity * 8);
        }
        
        // 分离玩家和障碍物
        const dx = this.player.x - obstacle.x;
        const dy = this.player.y - obstacle.y;
        const dist = Math.sqrt(dx * dx + dy * dy) || 1;
        
        this.player.x += (dx / dist) * 10;
        this.player.y += (dy / dist) * 10;
        
        // 速度衰减
        this.player.speed *= 0.7;
        
        // 如果是敌车，也减速
        if (obstacle.type === 'enemy') {
            obstacle.speed *= 0.8;
        }
    }
    
    rectIntersect(a, b) {
        return a.x < b.x + b.width &&
               a.x + a.width > b.x &&
               a.y < b.y + b.height &&
               a.y + a.height > b.y;
    }
    
    spawnCollisionParticles(x, y, count) {
        for (let i = 0; i < count; i++) {
            this.particles.push(new CollisionParticle(x, y));
        }
    }
    
    updateParticles(dt) {
        for (const particle of this.particles) {
            particle.update(dt);
        }
        this.particles = this.particles.filter(p => p.life > 0);
    }
    
    // ========== 胜负判定 ==========
    checkWinLoseCondition() {
        // 胜利条件：完成指定圈数
        if (this.lap >= this.totalLaps) {
            this.gameOver(true);
            return;
        }
        
        // 失败条件：耐力归零
        if (this.player.endurance <= 0) {
            this.player.endurance = 0;
            this.gameOver(false);
            return;
        }
    }
    
    checkLapCompletion() {
        const prevY = this.player.y;
        
        if (this.track.checkLapCompletion(this.player, prevY)) {
            this.lap++;
            
            // 更新最佳圈速
            if (this.bestLapTime === null || this.currentLapTime < this.bestLapTime) {
                this.bestLapTime = this.currentLapTime;
            }
            
            this.currentLapTime = 0;
            
            // 增加难度
            this.difficulty += 0.5;
            
            // 播放音效
            this.audio.playLap();
            
            // 触发震动
            this.triggerShake(5);
            
            // 检查是否完成比赛
            if (this.lap >= this.totalLaps) {
                this.gameOver(true);
            }
        }
    }
    
    triggerShake(intensity) {
        this.shakeIntensity = Math.max(this.shakeIntensity, intensity);
        this.shakeDuration = 0.3;
    }
    
    // ========== 游戏循环 ==========
    update(dt) {
        if (this.state !== 'playing') return;
        
        // 更新游戏时间
        this.gameTime += dt;
        this.currentLapTime += dt;
        
        // 保存玩家上一帧Y坐标（用于圈数检测）
        const prevPlayerY = this.player.y;
        
        // 更新玩家
        this.player.update(dt, this.keys, this.track);
        
        // 更新赛道
        this.track.update(this.player.speed, dt);
        
        // 更新障碍物
        this.updateObstacles(dt);
        
        // 碰撞检测
        this.checkCollisions();
        
        // 更新粒子
        this.updateParticles(dt);
        
        // 检查圈数完成
        this.checkLapCompletion();
        
        // 检查胜负
        this.checkWinLoseCondition();
        
        // 更新震动
        if (this.shakeDuration > 0) {
            this.shakeDuration -= dt;
            if (this.shakeDuration <= 0) {
                this.shakeIntensity = 0;
            }
        }
        
        // 更新HUD
        this.updateHUD();
    }
    
    updateHUD() {
        document.getElementById('speedValue').textContent = Math.floor(this.player.speed);
        document.getElementById('speedFill').style.width = (this.player.speed / this.player.maxSpeed * 100) + '%';
        document.getElementById('enduranceValue').textContent = Math.max(0, Math.floor(this.player.endurance));
        document.getElementById('enduranceFill').style.width = Math.max(0, this.player.endurance) + '%';
        document.getElementById('lapValue').textContent = Math.min(this.lap + 1, this.totalLaps);
        document.getElementById('timeValue').textContent = this.formatTime(this.gameTime);
        document.getElementById('bestLapValue').textContent = this.bestLapTime ? this.formatTime(this.bestLapTime) : '--:--';
    }
    
    render() {
        const ctx = this.ctx;
        
        // 清空画布
        ctx.clearRect(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);
        
        // 应用震动效果
        ctx.save();
        if (this.shakeIntensity > 0) {
            const shakeX = (Math.random() - 0.5) * this.shakeIntensity;
            const shakeY = (Math.random() - 0.5) * this.shakeIntensity;
            ctx.translate(shakeX, shakeY);
        }
        
        if (this.state === 'playing') {
            // 渲染赛道
            this.track.render(ctx);
            
            // 渲染障碍物
            for (const obstacle of this.obstacles) {
                obstacle.render(ctx);
            }
            
            // 渲染玩家
            this.player.render(ctx);
            
            // 渲染粒子
            for (const particle of this.particles) {
                particle.render(ctx);
            }
        } else if (this.state === 'menu') {
            // 渲染菜单背景
            this.renderMenuBackground(ctx);
        }
        
        ctx.restore();
    }
    
    renderMenuBackground(ctx) {
        // 动态背景
        ctx.fillStyle = '#0a0a0f';
        ctx.fillRect(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);
        
        // 绘制装饰性道路
        const roadX = (CANVAS_WIDTH - 200) / 2;
        ctx.fillStyle = '#1a1a2e';
        ctx.fillRect(roadX, 0, 200, CANVAS_HEIGHT);
        
        // 霓虹边框
        ctx.strokeStyle = '#00f5ff';
        ctx.lineWidth = 3;
        ctx.shadowColor = '#00f5ff';
        ctx.shadowBlur = 20;
        ctx.strokeRect(roadX, 0, 200, CANVAS_HEIGHT);
        ctx.shadowBlur = 0;
        
        // 移动的虚线
        const time = Date.now() / 1000;
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.3)';
        ctx.lineWidth = 2;
        ctx.setLineDash([30, 20]);
        ctx.beginPath();
        ctx.moveTo(CANVAS_WIDTH / 2, (time * 50) % 50);
        for (let y = (time * 50) % 50; y < CANVAS_HEIGHT; y += 50) {
            ctx.lineTo(CANVAS_WIDTH / 2, y);
        }
        ctx.stroke();
        ctx.setLineDash([]);
    }
    
    gameLoop(timestamp) {
        const dt = Math.min((timestamp - this.lastTime) / 1000, 0.1);
        this.lastTime = timestamp;
        
        this.update(dt);
        this.render();
        
        requestAnimationFrame((t) => this.gameLoop(t));
    }
}

// ============ 启动游戏 ============
window.addEventListener('DOMContentLoaded', () => {
    new Game();
});
