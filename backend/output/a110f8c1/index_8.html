<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>寻道大千 - 挂机修仙</title>
    <link href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=Noto+Sans+SC:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-primary: #080810;
            --bg-secondary: #101020;
            --fg-primary: #e8e4d9;
            --fg-secondary: #7a7a8a;
            --accent-gold: #d4a54a;
            --accent-cyan: #3ecdc4;
            --accent-red: #d64545;
            --accent-green: #45b76c;
            --card-bg: rgba(16, 16, 32, 0.9);
            --border-gold: rgba(212, 165, 74, 0.3);
            --shadow-gold: rgba(212, 165, 74, 0.15);
        }
        
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            background: var(--bg-primary);
            color: var(--fg-primary);
            font-family: 'Noto Sans SC', sans-serif;
            overflow: hidden;
            min-height: 100vh;
            user-select: none;
        }
        
        #gameContainer {
            position: relative;
            width: 100vw;
            height: 100vh;
        }
        
        #gameCanvas {
            display: block;
            position: absolute;
            top: 0;
            left: 0;
        }
        
        #uiLayer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 10;
        }
        
        #uiLayer > * { pointer-events: auto; }
        
        /* 顶部状态栏 */
        .top-bar {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            padding: 12px 20px;
            background: linear-gradient(180deg, rgba(8,8,16,0.98) 0%, rgba(8,8,16,0.8) 70%, transparent 100%);
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 20;
        }
        
        .player-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        
        .player-avatar {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            border: 2px solid var(--accent-gold);
            background: linear-gradient(135deg, #1a1a2e 0%, #0a0a1a 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Ma Shan Zheng', cursive;
            font-size: 22px;
            color: var(--accent-gold);
            box-shadow: 0 0 15px var(--shadow-gold);
        }
        
        .player-stats { display: flex; flex-direction: column; gap: 3px; }
        .player-name { font-size: 15px; font-weight: 600; color: var(--fg-primary); }
        .player-realm { font-size: 12px; color: var(--accent-cyan); font-weight: 500; }
        
        .resource-bar {
            display: flex;
            gap: 12px;
        }
        
        .resource-item {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 8px 14px;
            background: var(--card-bg);
            border-radius: 20px;
            border: 1px solid var(--border-gold);
            transition: all 0.2s ease;
        }
        
        .resource-item:hover {
            border-color: var(--accent-gold);
            box-shadow: 0 0 10px var(--shadow-gold);
        }
        
        .resource-icon { width: 18px; height: 18px; }
        .resource-value { font-size: 14px; font-weight: 600; min-width: 30px; }
        
        /* 底部导航 */
        .bottom-nav {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 8px;
            padding: 8px;
            background: var(--card-bg);
            border-radius: 28px;
            border: 1px solid var(--border-gold);
            backdrop-filter: blur(12px);
            box-shadow: 0 4px 20px rgba(0,0,0,0.4);
        }
        
        .nav-btn {
            width: 56px;
            height: 56px;
            border-radius: 50%;
            border: none;
            background: transparent;
            color: var(--fg-secondary);
            cursor: pointer;
            transition: all 0.25s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 2px;
            font-size: 10px;
            font-family: 'Noto Sans SC', sans-serif;
        }
        
        .nav-btn:hover {
            background: rgba(212, 165, 74, 0.15);
            color: var(--accent-gold);
            transform: translateY(-2px);
        }
        
        .nav-btn.active {
            background: linear-gradient(135deg, var(--accent-gold) 0%, #a67c30 100%);
            color: var(--bg-primary);
            box-shadow: 0 0 20px var(--shadow-gold);
        }
        
        .nav-btn svg { width: 22px; height: 22px; }
        
        /* 侧边面板 */
        .side-panel {
            position: absolute;
            right: 20px;
            top: 50%;
            transform: translateY(-50%);
            width: 260px;
            background: var(--card-bg);
            border-radius: 16px;
            border: 1px solid var(--border-gold);
            backdrop-filter: blur(12px);
            overflow: hidden;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s ease;
        }
        
        .side-panel.visible {
            opacity: 1;
            visibility: visible;
        }
        
        .panel-header {
            padding: 14px 16px;
            background: rgba(212, 165, 74, 0.08);
            border-bottom: 1px solid var(--border-gold);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .panel-title {
            font-family: 'Ma Shan Zheng', cursive;
            font-size: 20px;
            color: var(--accent-gold);
        }
        
        .panel-close {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            border: none;
            background: transparent;
            color: var(--fg-secondary);
            cursor: pointer;
            font-size: 18px;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .panel-close:hover {
            background: rgba(214, 69, 69, 0.2);
            color: var(--accent-red);
        }
        
        .panel-content {
            padding: 14px;
            max-height: 350px;
            overflow-y: auto;
        }
        
        /* 战斗信息面板 */
        .battle-panel {
            position: absolute;
            left: 20px;
            top: 80px;
            width: 240px;
        }
        
        .status-card {
            background: var(--card-bg);
            border-radius: 12px;
            border: 1px solid var(--border-gold);
            padding: 14px;
            margin-bottom: 12px;
            backdrop-filter: blur(10px);
        }
        
        .status-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }
        
        .status-name { font-size: 14px; font-weight: 600; }
        .status-level { font-size: 11px; color: var(--fg-secondary); }
        
        .hp-bar {
            width: 100%;
            height: 18px;
            background: rgba(0,0,0,0.5);
            border-radius: 9px;
            overflow: hidden;
            position: relative;
        }
        
        .hp-fill {
            height: 100%;
            border-radius: 9px;
            transition: width 0.25s ease;
        }
        
        .hp-fill.enemy { background: linear-gradient(90deg, #c0392b, #e74c3c); }
        .hp-fill.player { background: linear-gradient(90deg, #27ae60, #2ecc71); }
        
        .hp-text {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 10px;
            font-weight: 600;
            text-shadow: 0 1px 2px rgba(0,0,0,0.8);
        }
        
        /* 战斗日志 */
        .battle-log {
            position: absolute;
            left: 20px;
            bottom: 100px;
            width: 280px;
            height: 130px;
            background: var(--card-bg);
            border-radius: 10px;
            border: 1px solid var(--border-gold);
            padding: 10px;
            overflow-y: auto;
            font-size: 11px;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s ease;
        }
        
        .battle-log.visible {
            opacity: 1;
            visibility: visible;
        }
        
        .log-entry {
            padding: 4px 0;
            border-bottom: 1px solid rgba(255,255,255,0.04);
            color: var(--fg-secondary);
            line-height: 1.4;
        }
        
        .log-entry.damage { color: var(--accent-red); }
        .log-entry.reward { color: var(--accent-gold); }
        .log-entry.info { color: var(--accent-cyan); }
        .log-entry.levelup { color: var(--accent-green); font-weight: 600; }
        
        /* 菜单屏幕 */
        .menu-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(ellipse at 50% 30%, rgba(20,20,40,0.95) 0%, rgba(8,8,16,0.98) 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 100;
            opacity: 1;
            visibility: visible;
            transition: all 0.5s ease;
        }
        
        .menu-screen.hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }
        
        .game-title {
            font-family: 'Ma Shan Zheng', cursive;
            font-size: 68px;
            color: var(--accent-gold);
            text-shadow: 0 0 40px var(--shadow-gold), 0 4px 20px rgba(0,0,0,0.5);
            margin-bottom: 8px;
            animation: titlePulse 4s ease-in-out infinite;
        }
        
        @keyframes titlePulse {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.02); opacity: 0.95; }
        }
        
        .game-subtitle {
            font-size: 16px;
            color: var(--fg-secondary);
            margin-bottom: 50px;
            letter-spacing: 6px;
        }
        
        .menu-buttons { display: flex; flex-direction: column; gap: 14px; }
        
        .menu-btn {
            padding: 14px 50px;
            font-size: 16px;
            font-family: 'Noto Sans SC', sans-serif;
            font-weight: 500;
            border: 2px solid var(--accent-gold);
            background: transparent;
            color: var(--accent-gold);
            border-radius: 30px;
            cursor: pointer;
            transition: all 0.3s ease;
            min-width: 180px;
            position: relative;
            overflow: hidden;
        }
        
        .menu-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(212,165,74,0.2), transparent);
            transition: left 0.5s ease;
        }
        
        .menu-btn:hover::before { left: 100%; }
        
        .menu-btn:hover {
            background: var(--accent-gold);
            color: var(--bg-primary);
            box-shadow: 0 0 25px var(--shadow-gold);
            transform: translateY(-2px);
        }
        
        /* 加载界面 */
        .loading-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: var(--bg-primary);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 200;
            transition: all 0.5s ease;
        }
        
        .loading-screen.hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }
        
        .loading-text {
            font-family: 'Ma Shan Zheng', cursive;
            font-size: 28px;
            color: var(--accent-gold);
            margin-bottom: 30px;
        }
        
        .loading-bar {
            width: 280px;
            height: 6px;
            background: rgba(255,255,255,0.08);
            border-radius: 3px;
            overflow: hidden;
        }
        
        .loading-progress {
            height: 100%;
            background: linear-gradient(90deg, var(--accent-cyan), var(--accent-gold));
            border-radius: 3px;
            transition: width 0.3s ease;
            width: 0%;
        }
        
        .loading-percent {
            margin-top: 15px;
            font-size: 13px;
            color: var(--fg-secondary);
        }
        
        /* 设置面板 */
        .settings-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.8);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 150;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s ease;
        }
        
        .settings-overlay.visible {
            opacity: 1;
            visibility: visible;
        }
        
        .settings-panel {
            background: var(--card-bg);
            border-radius: 16px;
            border: 1px solid var(--border-gold);
            padding: 24px;
            width: 320px;
        }
        
        .settings-title {
            font-family: 'Ma Shan Zheng', cursive;
            font-size: 24px;
            color: var(--accent-gold);
            text-align: center;
            margin-bottom: 20px;
        }
        
        .setting-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 0;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }
        
        .setting-label { font-size: 14px; }
        
        .setting-toggle {
            width: 44px;
            height: 24px;
            background: rgba(255,255,255,0.1);
            border-radius: 12px;
            position: relative;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .setting-toggle.active { background: var(--accent-gold); }
        
        .setting-toggle::after {
            content: '';
            position: absolute;
            width: 18px;
            height: 18px;
            background: #fff;
            border-radius: 50%;
            top: 3px;
            left: 3px;
            transition: all 0.3s ease;
        }
        
        .setting-toggle.active::after { left: 23px; }
        
        /* 属性面板 */
        .stat-row {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }
        
        .stat-label { color: var(--fg-secondary); font-size: 13px; }
        .stat-value { color: var(--fg-primary); font-size: 13px; font-weight: 500; }
        .stat-value.highlight { color: var(--accent-gold); }
        
        /* 响应式 */
        @media (max-width: 768px) {
            .side-panel { display: none; }
            .game-title { font-size: 48px; }
            .resource-bar { display: none; }
            .battle-log { width: calc(100% - 40px); }
            .battle-panel { width: calc(100% - 40px); left: 20px; right: 20px; }
        }
        
        /* 滚动条 */
        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-track { background: rgba(0,0,0,0.2); border-radius: 3px; }
        ::-webkit-scrollbar-thumb { background: var(--accent-gold); border-radius: 3px; }
    </style>
</head>
<body>
    <div id="gameContainer">
        <canvas id="gameCanvas"></canvas>
        
        <div id="uiLayer">
            <!-- 加载界面 -->
            <div class="loading-screen" id="loadingScreen">
                <div class="loading-text">正在加载修仙资源</div>
                <div class="loading-bar">
                    <div class="loading-progress" id="loadingProgress"></div>
                </div>
                <div class="loading-percent" id="loadingPercent">0%</div>
            </div>
            
            <!-- 主菜单 -->
            <div class="menu-screen hidden" id="menuScreen">
                <h1 class="game-title">寻道大千</h1>
                <p class="game-subtitle">修仙挂机 问道长生</p>
                <div class="menu-buttons">
                    <button class="menu-btn" id="startBtn">开始修仙</button>
                    <button class="menu-btn" id="continueBtn">继续游戏</button>
                    <button class="menu-btn" id="settingsBtn">游戏设置</button>
                </div>
            </div>
            
            <!-- 设置面板 -->
            <div class="settings-overlay" id="settingsOverlay">
                <div class="settings-panel">
                    <div class="settings-title">游戏设置</div>
                    <div class="setting-item">
                        <span class="setting-label">音效</span>
                        <div class="setting-toggle active" data-setting="sound"></div>
                    </div>
                    <div class="setting-item">
                        <span class="setting-label">背景音乐</span>
                        <div class="setting-toggle active" data-setting="music"></div>
                    </div>
                    <div class="setting-item">
                        <span class="setting-label">粒子效果</span>
                        <div class="setting-toggle active" data-setting="particles"></div>
                    </div>
                    <div class="setting-item">
                        <span class="setting-label">自动保存</span>
                        <div class="setting-toggle active" data-setting="autosave"></div>
                    </div>
                    <button class="menu-btn" id="closeSettings" style="margin-top: 20px; width: 100%;">返回</button>
                </div>
            </div>
            
            <!-- 游戏UI -->
            <div class="top-bar" id="topBar" style="display: none;">
                <div class="player-info">
                    <div class="player-avatar">道</div>
                    <div class="player-stats">
                        <div class="player-name" id="playerName">无名修士</div>
                        <div class="player-realm" id="playerRealm">炼气期 一层</div>
                    </div>
                </div>
                <div class="resource-bar">
                    <div class="resource-item">
                        <svg class="resource-icon" viewBox="0 0 24 24" fill="none" stroke="#d4a54a" stroke-width="2">
                            <circle cx="12" cy="12" r="8"/>
                            <path d="M12 8v4l2 2"/>
                        </svg>
                        <span class="resource-value" id="spiritStones">0</span>
                    </div>
                    <div class="resource-item">
                        <svg class="resource-icon" viewBox="0 0 24 24" fill="none" stroke="#3ecdc4" stroke-width="2">
                            <polygon points="12,2 15,8 22,9 17,14 18,21 12,17 6,21 7,14 2,9 9,8"/>
                        </svg>
                        <span class="resource-value" id="spiritualGems">0</span>
                    </div>
                </div>
            </div>
            
            <!-- 战斗面板 -->
            <div class="battle-panel" id="battlePanel" style="display: none;">
                <div class="status-card">
                    <div class="status-header">
                        <span class="status-name" id="enemyName">妖兽</span>
                        <span class="status-level" id="enemyLevel">Lv.1</span>
                    </div>
                    <div class="hp-bar">
                        <div class="hp-fill enemy" id="enemyHpFill" style="width: 100%"></div>
                        <div class="hp-text" id="enemyHpText">100/100</div>
                    </div>
                </div>
                <div class="status-card">
                    <div class="status-header">
                        <span class="status-name" style="color: var(--accent-cyan);">自身</span>
                        <span class="status-level" id="playerLevel">Lv.1</span>
                    </div>
                    <div class="hp-bar">
                        <div class="hp-fill player" id="playerHpFill" style="width: 100%"></div>
                        <div class="hp-text" id="playerHpText">100/100</div>
                    </div>
                </div>
            </div>
            
            <!-- 战斗日志 -->
            <div class="battle-log" id="battleLog"></div>
            
            <!-- 底部导航 -->
            <div class="bottom-nav" id="bottomNav" style="display: none;">
                <button class="nav-btn active" data-state="idle" title="洞府">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/>
                        <polyline points="9 22 9 12 15 12 15 22"/>
                    </svg>
                    <span>洞府</span>
                </button>
                <button class="nav-btn" data-state="battle" title="战斗">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M14.5 17.5L3 6V3h3l11.5 11.5"/>
                        <path d="M13 19l6-6M16 16l4 4M19 21l2-2"/>
                    </svg>
                    <span>战斗</span>
                </button>
                <button class="nav-btn" data-state="cultivate" title="修炼">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="12" cy="12" r="10"/>
                        <path d="M12 6v6l4 2"/>
                    </svg>
                    <span>修炼</span>
                </button>
                <button class="nav-btn" data-panel="bag" title="背包">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M6 2L3 6v14a2 2 0 002 2h14a2 2 0 002-2V6l-3-4z"/>
                        <line x1="3" y1="6" x2="21" y2="6"/>
                        <path d="M16 10a4 4 0 01-8 0"/>
                    </svg>
                    <span>背包</span>
                </button>
                <button class="nav-btn" data-panel="skills" title="功法">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <polygon points="12,2 15.09,8.26 22,9.27 17,14.14 18.18,21.02 12,17.77 5.82,21.02 7,14.14 2,9.27 8.91,8.26"/>
                    </svg>
                    <span>功法</span>
                </button>
            </div>
            
            <!-- 侧边面板 -->
            <div class="side-panel" id="sidePanel">
                <div class="panel-header">
                    <span class="panel-title" id="panelTitle">背包</span>
                    <button class="panel-close" id="panelClose">×</button>
                </div>
                <div class="panel-content" id="panelContent"></div>
            </div>
        </div>
    </div>

    <script>
    (function() {
        'use strict';
        
        // ============================================
        // 游戏配置
        // ============================================
        const GameConfig = {
            TARGET_FPS: 60,
            AUTO_SAVE_INTERVAL: 30000,
            PARTICLE_LIMIT: 150,
            
            REALMS: [
                { name: '炼气期', layers: 9, baseExp: 100, hpBonus: 20, atkBonus: 3 },
                { name: '筑基期', layers: 9, baseExp: 400, hpBonus: 40, atkBonus: 6 },
                { name: '金丹期', layers: 9, baseExp: 1600, hpBonus: 80, atkBonus: 12 },
                { name: '元婴期', layers: 9, baseExp: 6400, hpBonus: 160, atkBonus: 24 },
                { name: '化神期', layers: 9, baseExp: 25600, hpBonus: 320, atkBonus: 48 },
                { name: '炼虚期', layers: 9, baseExp: 102400, hpBonus: 640, atkBonus: 96 },
                { name: '合体期', layers: 9, baseExp: 409600, hpBonus: 1280, atkBonus: 192 },
                { name: '大乘期', layers: 9, baseExp: 1638400, hpBonus: 2560, atkBonus: 384 }
            ],
            
            ENEMIES: [
                { name: '妖狼', hp: 40, attack: 5, defense: 2, exp: 8, gold: 3 },
                { name: '魔猿', hp: 80, attack: 10, defense: 4, exp: 20, gold: 8 },
                { name: '血蝠', hp: 60, attack: 15, defense: 2, exp: 25, gold: 10 },
