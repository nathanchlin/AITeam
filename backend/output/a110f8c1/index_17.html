<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>寻道大千 - 挂机修仙</title>
    <link href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=Noto+Sans+SC:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-primary: #080810;
            --bg-secondary: #101020;
            --bg-card: rgba(12, 12, 24, 0.95);
            --fg-primary: #e8e4d9;
            --fg-secondary: #7a7a8a;
            --fg-muted: #4a4a5a;
            --accent-gold: #d4a54a;
            --accent-gold-light: #e8c878;
            --accent-cyan: #3ecdc4;
            --accent-red: #d64545;
            --accent-green: #45b76c;
            --accent-purple: #9c64b5;
            --accent-orange: #e67e22;
            --border-gold: rgba(212, 165, 74, 0.4);
            --border-light: rgba(212, 165, 74, 0.2);
            --shadow-gold: rgba(212, 165, 74, 0.2);
            --quality-common: #8a8a9a;
            --quality-good: #4caf50;
            --quality-rare: #2196f3;
            --quality-epic: #9c27b0;
            --quality-legend: #ff9800;
            --quality-mythic: #f44336;
        }
        
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            background: var(--bg-primary);
            color: var(--fg-primary);
            font-family: 'Noto Sans SC', sans-serif;
            overflow: hidden;
            min-height: 100vh;
            min-height: 100dvh;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        
        #gameContainer {
            position: relative;
            width: 100vw;
            height: 100vh;
            height: 100dvh;
        }
        
        #gameCanvas {
            display: block;
            position: absolute;
            top: 0;
            left: 0;
        }
        
        #uiLayer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 10;
        }
        
        #uiLayer > * { pointer-events: auto; }
        
        /* 顶部状态栏 */
        .top-bar {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            padding: 10px 16px;
            background: linear-gradient(180deg, rgba(8,8,16,0.98) 0%, rgba(8,8,16,0.7) 80%, transparent 100%);
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 20;
        }
        
        .player-info {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .player-avatar {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            border: 2px solid var(--accent-gold);
            background: linear-gradient(135deg, #1a1a2e 0%, #0a0a1a 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Ma Shan Zheng', cursive;
            font-size: 20px;
            color: var(--accent-gold);
            box-shadow: 0 0 15px rgba(212, 165, 74, 0.3);
        }
        
        .player-stats { display: flex; flex-direction: column; gap: 2px; }
        .player-name { font-size: 14px; font-weight: 600; }
        .player-realm { font-size: 11px; color: var(--accent-gold); }
        
        .resource-bar {
            display: flex;
            gap: 12px;
        }
        
        .resource-item {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 5px 12px;
            background: rgba(20, 20, 35, 0.8);
            border: 1px solid var(--border-light);
            border-radius: 20px;
        }
        
        .resource-icon {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
        }
        
        .resource-icon.wood { background: linear-gradient(135deg, #5d4037 0%, #3e2723 100%); border: 2px solid #8d6e63; }
        .resource-icon.spirit { background: linear-gradient(135deg, #1565c0 0%, #0d47a1 100%); border: 2px solid #42a5f5; }
        .resource-icon.jade { background: linear-gradient(135deg, #00695c 0%, #004d40 100%); border: 2px solid #26a69a; }
        
        .resource-value { font-size: 13px; font-weight: 600; min-width: 50px; }
        
        /* 关卡信息 */
        .stage-info {
            position: absolute;
            top: 70px;
            left: 50%;
            transform: translateX(-50%);
            text-align: center;
            z-index: 15;
        }
        
        .stage-title {
            font-family: 'Ma Shan Zheng', cursive;
            font-size: 24px;
            color: var(--accent-gold);
            text-shadow: 0 0 15px rgba(212, 165, 74, 0.5);
        }
        
        .stage-progress { font-size: 12px; color: var(--fg-secondary); margin-top: 4px; }
        
        /* 战斗信息 */
        .battle-info {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            pointer-events: none;
        }
        
        .enemy-name {
            font-family: 'Ma Shan Zheng', cursive;
            font-size: 20px;
            color: var(--accent-red);
            margin-bottom: 8px;
        }
        
        .enemy-hp-bar {
            width: 200px;
            height: 12px;
            background: rgba(30, 30, 50, 0.9);
            border-radius: 6px;
            overflow: hidden;
            border: 1px solid var(--border-light);
        }
        
        .enemy-hp-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--accent-red) 0%, #ff6b6b 100%);
            transition: width 0.3s ease;
        }
        
        .damage-text {
            position: absolute;
            font-family: 'Ma Shan Zheng', cursive;
            font-size: 28px;
            color: var(--accent-gold);
            text-shadow: 0 0 10px rgba(212, 165, 74, 0.8), 2px 2px 4px rgba(0,0,0,0.8);
            pointer-events: none;
            animation: damageFloat 1s ease-out forwards;
        }
        
        .damage-text.crit {
            font-size: 36px;
            color: #ff6b6b;
        }
        
        @keyframes damageFloat {
            0% { opacity: 1; transform: translateY(0) scale(1); }
            50% { opacity: 1; transform: translateY(-30px) scale(1.2); }
            100% { opacity: 0; transform: translateY(-60px) scale(0.8); }
        }
        
        /* 底部导航 */
        .bottom-nav {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            padding: 10px 20px 15px;
            background: linear-gradient(0deg, rgba(8,8,16,0.98) 0%, rgba(8,8,16,0.7) 80%, transparent 100%);
            display: flex;
            justify-content: center;
            gap: 15px;
            z-index: 20;
        }
        
        .nav-btn {
            width: 56px;
            height: 56px;
            border-radius: 50%;
            background: linear-gradient(135deg, rgba(212, 165, 74, 0.15) 0%, rgba(212, 165, 74, 0.05) 100%);
            border: 2px solid var(--border-gold);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .nav-btn:hover {
            background: linear-gradient(135deg, rgba(212, 165, 74, 0.3) 0%, rgba(212, 165, 74, 0.15) 100%);
            transform: translateY(-3px);
            box-shadow: 0 5px 20px rgba(212, 165, 74, 0.3);
        }
        
        .nav-btn.active {
            background: linear-gradient(135deg, rgba(62, 205, 196, 0.3) 0%, rgba(62, 205, 196, 0.1) 100%);
            border-color: var(--accent-cyan);
        }
        
        .nav-btn svg { width: 22px; height: 22px; stroke: var(--accent-gold); fill: none; stroke-width: 2; }
        .nav-btn.active svg { stroke: var(--accent-cyan); }
        .nav-btn span { font-size: 9px; margin-top: 2px; color: var(--fg-secondary); }
        
        /* 面板通用样式 */
        .game-panel {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(8, 8, 16, 0.95);
            z-index: 100;
            display: none;
            flex-direction: column;
            animation: panelIn 0.3s ease;
        }
        
        .game-panel.active { display: flex; }
        
        @keyframes panelIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        
        .panel-header {
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-light);
        }
        
        .panel-title {
            font-family: 'Ma Shan Zheng', cursive;
            font-size: 24px;
            color: var(--accent-gold);
        }
        
        .close-btn {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: rgba(214, 69, 69, 0.2);
            border: 1px solid var(--accent-red);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .close-btn:hover { background: rgba(214, 69, 69, 0.4); }
        .close-btn svg { width: 18px; height: 18px; stroke: var(--accent-red); }
        
        .panel-content {
            flex: 1;
            overflow-y: auto;
            padding: 15px;
        }
        
        /* 境界面板 */
        .realm-card {
            background: linear-gradient(135deg, rgba(20, 20, 40, 0.9) 0%, rgba(15, 15, 30, 0.9) 100%);
            border: 1px solid var(--border-gold);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 15px;
        }
        
        .realm-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }
        
        .realm-name {
            font-family: 'Ma Shan Zheng', cursive;
            font-size: 22px;
            color: var(--accent-gold);
        }
        
        .realm-level {
            font-size: 14px;
            color: var(--accent-cyan);
        }
        
        .realm-stats {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            margin-bottom: 15px;
        }
        
        .stat-item {
            background: rgba(10, 10, 20, 0.6);
            padding: 10px;
            border-radius: 8px;
            text-align: center;
        }
        
        .stat-label { font-size: 11px; color: var(--fg-secondary); }
        .stat-value { font-size: 16px; font-weight: 600; color: var(--accent-cyan); margin-top: 3px; }
        
        .exp-bar {
            height: 8px;
            background: rgba(30, 30, 50, 0.8);
            border-radius: 4px;
            overflow: hidden;
            margin-bottom: 10px;
        }
        
        .exp-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--accent-gold) 0%, var(--accent-gold-light) 100%);
            transition: width 0.5s ease;
        }
        
        .breakthrough-btn {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, rgba(212, 165, 74, 0.3) 0%, rgba(212, 165, 74, 0.1) 100%);
            border: 2px solid var(--accent-gold);
            border-radius: 8px;
            color: var(--accent-gold);
            font-family: 'Ma Shan Zheng', cursive;
            font-size: 18px;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .breakthrough-btn:hover:not(:disabled) {
            background: linear-gradient(135deg, rgba(212, 165, 74, 0.5) 0%, rgba(212, 165, 74, 0.2) 100%);
            box-shadow: 0 0 20px rgba(212, 165, 74, 0.4);
        }
        
        .breakthrough-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        
        /* 装备面板 */
        .equip-section { margin-bottom: 20px; }
        .section-title { font-size: 14px; color: var(--fg-secondary); margin-bottom: 10px; padding-left: 5px; }
        
        .equip-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
        }
        
        .equip-slot {
            aspect-ratio: 1;
            background: linear-gradient(135deg, rgba(20, 20, 40, 0.8) 0%, rgba(10, 10, 25, 0.8) 100%);
            border: 2px solid var(--border-light);
            border-radius: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
        }
        
        .equip-slot:hover { border-color: var(--accent-gold); transform: scale(1.05); }
        .equip-slot.equipped { border-color: var(--quality-rare); }
        .equip-slot.equipped::after { content: ''; position: absolute; inset: 0; border-radius: 8px; box-shadow: inset 0 0 15px rgba(33, 150, 243, 0.3); }
        
        .equip-icon { font-size: 24px; margin-bottom: 4px; }
        .equip-name { font-size: 10px; text-align: center; padding: 0 4px; }
        
        .quality-common { color: var(--quality-common); }
        .quality-good { color: var(--quality-good); }
        .quality-rare { color: var(--quality-rare); }
        .quality-epic { color: var(--quality-epic); }
        .quality-legend { color: var(--quality-legend); }
        
        /* 灵兽面板 */
        .beast-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
        }
        
        .beast-card {
            background: linear-gradient(135deg, rgba(20, 20, 40, 0.9) 0%, rgba(10, 10, 25, 0.9) 100%);
            border: 2px solid var(--border-light);
            border-radius: 12px;
            padding: 12px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .beast-card:hover { border-color: var(--accent-gold); transform: translateY(-3px); }
        .beast-card.active { border-color: var(--accent-cyan); box-shadow: 0 0 20px rgba(62, 205, 196, 0.3); }
        
        .beast-icon { font-size: 36px; margin-bottom: 8px; }
        .beast-name { font-family: 'Ma Shan Zheng', cursive; font-size: 16px; margin-bottom: 4px; }
        .beast-level { font-size: 11px; color: var(--fg-secondary); }
        
        /* 设置面板 */
        .settings-section {
            background: linear-gradient(135deg, rgba(20, 20, 40, 0.9) 0%, rgba(15, 15, 30, 0.9) 100%);
            border: 1px solid var(--border-light);
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 15px;
        }
        
        .settings-title {
            font-size: 14px;
            color: var(--accent-gold);
            margin-bottom: 12px;
            padding-bottom: 8px;
            border-bottom: 1px solid var(--border-light);
        }
        
        .setting-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }
        
        .setting-row:last-child { border-bottom: none; }
        .setting-label { font-size: 14px; }
        .setting-value { font-size: 13px; color: var(--fg-secondary); }
        
        .setting-btn {
            padding: 8px 16px;
            background: linear-gradient(135deg, rgba(212, 165, 74, 0.2) 0%, rgba(212, 165, 74, 0.1) 100%);
            border: 1px solid var(--border-gold);
            border-radius: 6px;
            color: var(--accent-gold);
            font-size: 13px;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .setting-btn:hover {
            background: linear-gradient(135deg, rgba(212, 165, 74, 0.4) 0%, rgba(212, 165, 74, 0.2) 100%);
        }
        
        .setting-btn.danger {
            background: linear-gradient(135deg, rgba(214, 69, 69, 0.2) 0%, rgba(214, 69, 69, 0.1) 100%);
            border-color: var(--accent-red);
            color: var(--accent-red);
        }
        
        .setting-btn.danger:hover {
            background: linear-gradient(135deg, rgba(214, 69, 69, 0.4) 0%, rgba(214, 69, 69, 0.2) 100%);
        }
        
        /* 离线收益弹窗 */
        .offline-modal {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.85);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 200;
        }
        
        .offline-modal.active { display: flex; }
        
        .offline-content {
            background: linear-gradient(135deg, rgba(20, 20, 40, 0.98) 0%, rgba(10, 10, 25, 0.98) 100%);
            border: 2px solid var(--accent-gold);
            border-radius: 16px;
            padding: 30px;
            max-width: 340px;
            width: 90%;
            text-align: center;
            animation: modalPop 0.4s ease;
        }
        
        @keyframes modalPop {
            0% { opacity: 0; transform: scale(0.8); }
            100% { opacity: 1; transform: scale(1); }
        }
        
        .offline-title {
            font-family: 'Ma Shan Zheng', cursive;
            font-size: 28px;
            color: var(--accent-gold);
            margin-bottom: 10px;
        }
        
        .offline-time {
            font-size: 14px;
            color: var(--fg-secondary);
            margin-bottom: 20px;
        }
        
        .offline-rewards {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 25px;
        }
        
        .offline-reward {
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        
        .offline-reward-icon {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            margin-bottom: 8px;
        }
        
        .offline-reward-icon.wood { background: linear-gradient(135deg, #5d4037 0%, #3e2723 100%); border: 2px solid #8d6e63; }
        .offline-reward-icon.spirit { background: linear-gradient(135deg, #1565c0 0%, #0d47a1 100%); border: 2px solid #42a5f5; }
        
        .offline-reward-value { font-size: 16px; font-weight: 600; }
        
        .collect-btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, var(--accent-gold) 0%, #b8860b 100%);
            border: none;
            border-radius: 10px;
            color: #1a1a2e;
            font-family: 'Ma Shan Zheng', cursive;
            font-size: 20px;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .collect-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 25px rgba(212, 165, 74, 0.5);
        }
        
        /* Toast提示 */
        .toast {
            position: fixed;
            bottom: 100px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: rgba(20, 20, 40, 0.95);
            border: 1px solid var(--accent-gold);
            padding: 12px 24px;
            border-radius: 25px;
            font-size: 14px;
            opacity: 0;
            transition: all 0.3s ease;
            z-index: 300;
        }
        
        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }
        
        .toast.success { border-color: var(--accent-green); color: var(--accent-green); }
        .toast.error { border-color: var(--accent-red); color: var(--accent-red); }
        
        /* 存档导入文本框 */
        .import-textarea {
            width: 100%;
            height: 120px;
            background: rgba(10, 10, 20, 0.8);
            border: 1px solid var(--border-light);
            border-radius: 8px;
            padding: 10px;
            color: var(--fg-primary);
            font-family: monospace;
            font-size: 11px;
            resize: none;
            margin-bottom: 10px;
        }
        
        .import-textarea:focus {
            outline: none;
            border-color: var(--accent-gold);
        }
        
        .import-actions {
            display: flex;
            gap: 10px;
        }
        
        .import-actions .setting-btn {
            flex: 1;
        }
        
        /* 粒子效果容器 */
        .particle-container {
            position: absolute;
            inset: 0;
            pointer-events: none;
            overflow: hidden;
        }
        
        /* 滚动条样式 */
        .panel-content::-webkit-scrollbar { width: 4px; }
        .panel-content::-webkit-scrollbar-track { background: transparent; }
        .panel-content::-webkit-scrollbar-thumb { background: var(--border-gold); border-radius: 2px; }
        
        /* 响应式 */
        @media (max-width: 400px) {
            .resource-bar { gap: 8px; }
            .resource-item { padding: 4px 8px; }
            .resource-value { font-size: 11px; min-width: 40px; }
            .nav-btn { width: 48px; height: 48px; }
            .nav-btn svg { width: 18px; height: 18px; }
        }
    </style>
</head>
<body>
    <div id="gameContainer">
        <canvas id="gameCanvas"></canvas>
        
        <div id="uiLayer">
            <!-- 顶部状态栏 -->
            <div class="top-bar">
                <div class="player-info">
                    <div class="player-avatar">妖</div>
                    <div class="player-stats">
                        <div class="player-name">小妖精</div>
                        <div class="player-realm" id="playerRealm">炼气期 · 一层</div>
                    </div>
                </div>
                <div class="resource-bar">
                    <div class="resource-item">
                        <div class="resource-icon wood">木</div>
                        <div class="resource-value" id="woodCount">0</div>
                    </div>
                    <div class="resource-item">
                        <div class="resource-icon spirit">灵</div>
                        <div class="resource-value" id="spiritCount">0</div>
                    </div>
                </div>
            </div>
            
            <!-- 关卡信息 -->
            <div class="stage-info">
                <div class="stage-title" id="stageTitle">青云山 · 第一章</div>
                <div class="stage-progress" id="stageProgress">关卡 1/10</div>
            </div>
            
            <!-- 战斗信息 -->
            <div class="battle-info">
                <div class="enemy-name" id="enemyName">野狼妖</div>
                <div class="enemy-hp-bar">
                    <div class="enemy-hp-fill" id="enemyHpFill" style="width: 100%"></div>
                </div>
            </div>
            
            <!-- 粒子容器 -->
            <div class="particle-container" id="particleContainer"></div>
            
            <!-- 底部导航 -->
            <div class="bottom-nav">
                <div class="nav-btn" data-panel="realm">
                    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>
                    <span>境界</span>
                </div>
                <div class="nav-btn" data-panel="equip">

    <script>
        // ==================== 游戏数据结构 ====================

        const EquipIcons = ['剑', '甲', '盔', '靴', '戒', '链', '带', '符'];
        const Qualities = ['common', 'good', 'rare', 'epic', 'legend', 'mythic'];

        // ==================== 游戏状态 ====================
        let canvas = null;

        // ==================== 存档系统 ====================
        const SaveSystem = {
            SAVE_KEY: 'xundao_save_data',
            
            // 保存游戏数据
            save() {
                try {
                    GameData.save.lastSaveTime = Date.now();
                    const saveString = JSON.stringify(GameData);
                    localStorage.setItem(this.SAVE_KEY, saveString);
                    this.updateLastSaveDisplay();
                    console.log('游戏已保存');
                    return true;
                } catch (e) {
                    console.error('保存失败:', e);
                    return false;
                }
            },
            
            // 加载游戏数据
            load() {
                try {
                    const saveString = localStorage.getItem(this.SAVE_KEY);
                    if (saveString) {
                        const loadedData = JSON.parse(saveString);
                        this.mergeData(loadedData);
                        console.log('存档加载成功');
                        return true;
                    }
                } catch (e) {
                    console.error('加载存档失败:', e);
                }
                return false;
            },
            
            // 合并数据（处理版本兼容）
            mergeData(loadedData) {
                // 递归合并，保留默认值
                const merge = (target, source) => {
                    for (const key in source) {
                        if (source[key] && typeof source[key] === 'object' && !Array.isArray(source[key])) {
                            if (!target[key]) target[key] = {};
                            merge(target[key], source[key]);
                        } else {
                            target[key] = source[key];
                        }
                    }
                };
                merge(GameData, loadedData);
            },
            
            // 计算离线收益
            calculateOfflineRewards() {
                const now = Date.now();
                const lastOnline = GameData.save.lastOnlineTime || now;
                let offlineTime = (now - lastOnline) / 1000; // 秒
                
                // 上限24小时
                const maxOfflineTime = 24 * 60 * 60;
                offlineTime = Math.min(offlineTime, maxOfflineTime);
                
                if (offlineTime < 60) return null; // 少于1分钟不计算
                
                const production = this.getProductionRate();
                const woodGain = Math.floor(production.wood * offlineTime);
                const spiritGain = Math.floor(production.spirit * offlineTime);
                
                return {
                    time: offlineTime,
                    wood: woodGain,
                    spirit: spiritGain
                };
            },
            
            // 获取产出速率
            getProductionRate() {
                // 基础产出
                let woodPerSec = 1 + GameData.player.realm * 0.5;
                let spiritPerSec = 0.5 + GameData.player.realm * 0.3;
                
                // 加成计算
                const beastBonus = this.getBeastBonus();
                woodPerSec *= beastBonus.woodMult || 1;
                spiritPerSec *= beastBonus.spiritMult || 1;
                
                return { wood: woodPerSec, spirit: spiritPerSec };
            },
            
            // 获取灵兽加成
            getBeastBonus() {
                const bonus = { woodMult: 1, spiritMult: 1 };
                if (GameData.beasts.owned.length > 0) {
                    const activeBeast = GameData.beasts.active;
                    if (GameData.beasts.owned.includes(activeBeast)) {
                        const beastIdx = GameData.beasts.owned.indexOf(activeBeast);
                        const beastLevel = GameData.beasts.levels[beastIdx] || 1;
                        const beast = BeastConfig[activeBeast];
                        if (beast && beast.bonus.woodMult) {
                            bonus.woodMult = beast.bonus.woodMult + (beastLevel - 1) * 0.02;
                        }
                        if (beast && beast.bonus.spiritMult) {
                            bonus.spiritMult = beast.bonus.spiritMult + (beastLevel - 1) * 0.02;
                        }
                    }
                }
                return bonus;
            },
            
            // 导出存档（Base64编码）
            exportSave() {
                try {
                    this.save();
                    const saveString = JSON.stringify(GameData);
                    // Base64编码
                    const base64 = btoa(unescape(encodeURIComponent(saveString)));
                    return base64;
                } catch (e) {
                    console.error('导出失败:', e);
                    return null;
                }
            },
            
            // 导入存档（Base64解码）
            importSave(base64String) {
                try {
                    const jsonString = decodeURIComponent(escape(atob(base64String)));
                    const loadedData = JSON.parse(jsonString);
                    this.mergeData(loadedData);
                    this.save();
                    return true;
                } catch (e) {
                    console.error('导入失败:', e);
                    return false;
                }
            },
            
            // 重置游戏
            resetGame() {
                localStorage.removeItem(this.SAVE_KEY);
                location.reload();
            },
            
            // 更新显示
            updateLastSaveDisplay() {
                const el = document.getElementById('lastSaveTime');
                if (el) {
                    el.textContent = new Date(GameData.save.lastSaveTime).toLocaleString();
                }
            }
        };
        
        // ==================== 游戏逻辑 ====================
        const GameLogic = {
            // 计算总属性
            calculateStats() {
                const realm = RealmConfig[GameData.player.realm];
                const levelBonus = GameData.player.realmLevel;
                
                let atk = realm.baseAtk + levelBonus * 20;
                let def = realm.baseDef + levelBonus * 10;
                let hp = realm.baseHp + levelBonus * 100;
                let critRate = 0.05 + levelBonus * 0.005;
                let critDmg = 1.5;
                
                // 装备加成
                GameData.equipment.equipped.forEach(equip => {
                    if (equip) {
                        atk += equip.stats.atk || 0;
                        def += equip.stats.def || 0;
                        hp += equip.stats.hp || 0;
                        critRate += equip.stats.critRate || 0;
                        critDmg += equip.stats.critDmg || 0;
                    }
                });
                
                // 灵兽加成
                if (GameData.beasts.owned.length > 0) {
                    const activeIdx = GameData.beasts.owned.indexOf(GameData.beasts.active);
                    if (activeIdx >= 0) {
                        const beast = BeastConfig[GameData.beasts.active];
                        const level = GameData.beasts.levels[activeIdx] || 1;
                        if (beast) {
                            atk += (beast.bonus.atk || 0) * level;
                            def += (beast.bonus.def || 0) * level;
                            hp += (beast.bonus.hp || 0) * level;
                            critRate += (beast.bonus.critRate || 0) * level;
                            critDmg += (beast.bonus.critDmg || 0) * level;
                        }
                    }
                }
                
                GameData.player.atk = atk;
                GameData.player.def = def;
                GameData.player.hp = hp;
                GameData.player.critRate = critRate;
                GameData.player.critDmg = critDmg;
            },
            
            // 获取升级所需经验
            getExpRequired() {
                const realm = RealmConfig[GameData.player.realm];
                return Math.floor(100 * realm.expMult * Math.pow(1.5, GameData.player.realmLevel - 1));
            },
            
            // 添加经验
            addExp(amount) {
                GameData.player.exp += amount;
                const required = this.getExpRequired();
                
                while (GameData.player.exp >= required) {
                    GameData.player.exp -= required;
                    this.levelUp();
                }
                
                GameData.player.maxExp = this.getExpRequired();
            },
            
            // 升级
            levelUp() {
                const realm = RealmConfig[GameData.player.realm];
                
                if (GameData.player.realmLevel >= realm.levels) {
                    // 突破到下一境界
                    if (GameData.player.realm < RealmConfig.length - 1) {
                        GameData.player.realm++;
                        GameData.player.realmLevel = 1;
                        showToast('突破成功！进入' + RealmConfig[GameData.player.realm].name, 'success');
                    }
                } else {
                    GameData.player.realmLevel++;
                }
                
                this.calculateStats();
            },
            
            // 尝试突破
            tryBreakthrough() {
                const required = this.getExpRequired();
                if (GameData.player.exp >= required * 0.8) {
                    GameData.player.exp = 0;
                    this.levelUp();
                    SaveSystem.save();
                    return true;
                }
                return false;
            },
            
            // 生成敌人
            generateEnemy() {
                const chapter = ChapterConfig[Math.min(GameData.stage.chapter - 1, ChapterConfig.length - 1)];
                const enemyName = chapter.enemies[GameData.stage.level % chapter.enemies.length];
                
                const baseHp = 50 + GameData.stage.chapter * 100 + GameData.stage.level * 20;
                
                GameData.stage.enemyHp = baseHp;
                GameData.stage.enemyMaxHp = baseHp;
                
                return enemyName;
            },
            
            // 战斗
            attack() {
                if (GameData.stage.enemyHp <= 0) return;
                
                let damage = GameData.player.atk;
                let isCrit = false;
                
                // 暴击判定
                if (Math.random() < GameData.player.critRate) {
                    damage *= GameData.player.critDmg;
                    isCrit = true;
                }
                
                // 随机浮动
                damage = Math.floor(damage * (0.9 + Math.random() * 0.2));
                
                GameData.stage.enemyHp -= damage;
                
                // 显示伤害数字
                this.showDamage(damage, isCrit);
                
                // 敌人受击动画
                enemyCharacter.shakeOffset = 10;
                
                // 检查敌人死亡
                if (GameData.stage.enemyHp <= 0) {
                    this.enemyDefeated();
                }
            },
            
            // 显示伤害数字
            showDamage(damage, isCrit) {
                const container = document.getElementById('particleContainer');
                const dmgEl = document.createElement('div');
                dmgEl.className = 'damage-text' + (isCrit ? ' crit' : '');
                dmgEl.textContent = (isCrit ? '暴击 ' : '') + damage;
                
                const offsetX = Math.random() * 40 - 20;
                dmgEl.style.left = `calc(50% + ${offsetX}px)`;
                dmgEl.style.top = '45%';
                
                container.appendChild(dmgEl);
                
                setTimeout(() => dmgEl.remove(), 1000);
            },
            
            // 敌人被击败
            enemyDefeated() {
                // 获得奖励
                const woodGain = 5 + GameData.stage.chapter * 3 + GameData.stage.level;
                const spiritGain = 2 + GameData.stage.chapter * 2;
                const expGain = 10 + GameData.stage.chapter * 5 + GameData.stage.level * 2;
                
                GameData.resources.wood += woodGain;
                GameData.resources.spirit += spiritGain;
                GameData.stats.totalWood += woodGain;
                GameData.stats.totalSpirit += spiritGain;
                GameData.stats.totalKills++;
                
                this.addExp(expGain);
                
                // 掉落装备概率
                if (Math.random() < 0.1) {
                    this.dropEquipment();
                }
                
                // 下一关
                GameData.stage.level++;
                if (GameData.stage.level > GameData.stage.maxLevel) {
                    GameData.stage.level = 1;
                    GameData.stage.chapter++;
                }
                
                // 生成新敌人
                setTimeout(() => {
                    const enemyName = this.generateEnemy();
                    document.getElementById('enemyName').textContent = enemyName;
                    enemyCharacter.deathAnim = 0;
                }, 500);
                
                enemyCharacter.deathAnim = 1;
            },
            
            // 掉落装备
            dropEquipment() {
                const typeIdx = Math.floor(Math.random() * EquipTypes.length);
                const quality = this.rollQuality();
                const level = GameData.stage.chapter;
                
                const equip = {
                    id: Date.now(),
                    type: EquipTypes[typeIdx],
                    icon: EquipIcons[typeIdx],
                    name: QualityNames[quality] + EquipIcons[typeIdx],
                    quality: quality,
                    level: level,
                    stats: {
                        atk: Math.floor((10 + level * 5) * QualityMultipliers[quality]),
                        def: Math.floor((5 + level * 3) * QualityMultipliers[quality]),
                        hp: Math.floor((20 + level * 10) * QualityMultipliers[quality])
                    }
                };
                
                GameData.equipment.backpack.push(equip);
                showToast('获得装备: ' + equip.name, 'success');
            },
            
            // 品质随机
            rollQuality() {
                const rand = Math.random();
                if (rand < 0.5) return 0;       // 50% 普通
                if (rand < 0.75) return 1;      // 25% 优秀
                if (rand < 0.9) return 2;       // 15% 稀有
                if (rand < 0.97) return 3;      // 7% 史诗
                if (rand < 0.995) return 4;     // 2.5% 传说
                return 5;                        // 0.5% 神话
            },
            
            // 装备/卸下装备
            toggleEquip(equipId) {
                const backpackIdx = GameData.equipment.backpack.findIndex(e => e.id === equipId);
                if (backpackIdx >= 0) {
                    const equip = GameData.equipment.backpack[backpackIdx];
                    const slotIdx = EquipTypes.indexOf(equip.type);
                    
                    if (GameData.equipment.equipped[slotIdx]) {
                        // 交换装备
                        GameData.equipment.backpack.push(GameData.equipment.equipped[slotIdx]);
                    }
                    
                    GameData.equipment.equipped[slotIdx] = equip;
                    GameData.equipment.backpack.splice(backpackIdx, 1);
                    
                    this.calculateStats();
                    SaveSystem.save();
                    UI.renderEquipment();
                }
            },
            
            // 卸下装备
            unequip(slotIdx) {
                if (GameData.equipment.equipped[slotIdx]) {
                    GameData.equipment.backpack.push(GameData.equipment.equipped[slotIdx]);
                    GameData.equipment.equipped[slotIdx] = null;
                    
                    this.calculateStats();
                    SaveSystem.save();
                    UI.renderEquipment();
                }
            },
            
            // 选择灵兽
            selectBeast(beastIdx) {
                if (GameData.beasts.owned.includes(beastIdx)) {
                    GameData.beasts.active = beastIdx;
                    this.calculateStats();
                    SaveSystem.save();
                    UI.renderBeasts();
                }
            }
        };

        // ==================== 渲染系统 ====================
        const Renderer = {
            // 初始化场景
            initScene() {
                // 初始化场景元素
                this.initMountains();
                this.initClouds();
                this.initTrees();
            },
            
            initMountains() {
                sceneElements.mountains = [];
                for (let layer = 0; layer < 3; layer++) {
                    for (let i = 0; i < 4; i++) {
                        sceneElements.mountains.push({
                            x: i * 400 - 100 + Math.random() * 200,
                            layer: layer,
                            height: 150 + Math.random() * 100 + layer * 30,
                            width: 200 + Math.random() * 150
                        });
                    }
                }
            },
            
            initClouds() {
                sceneElements.clouds = [];
                for (let i = 0; i < 8; i++) {
                    sceneElements.clouds.push({
                        x: Math.random() * canvas.width,
                        y: 50 + Math.random() * 150,
                        size: 30 + Math.random() * 50,
                        speed: 0.2 + Math.random() * 0.3,
                        opacity: 0.1 + Math.random() * 0.2
                    });
                }
            },
            
            initTrees() {
                sceneElements.trees = [];
                for (let i = 0; i < 6; i++) {
                    sceneElements.trees.push({
                        x: Math.random() * canvas.width,
                        y: canvas.height * 0.65,
                        scale: 0.6 + Math.random() * 0.4,
                        swayOffset: Math.random() * Math.PI * 2
                    });
                }
            },
            
            // 主渲染
            render() {
                ctx.fillStyle = '#080810';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                
                this.renderBackground();
                this.renderMountains();
                this.renderClouds();
                this.renderTrees();
                this.renderCharacters();
                this.renderParticles();
            },
            
            renderBackground() {
                // 渐变天空
                const skyGrad = ctx.createLinearGradient(0, 0, 0, canvas.height);
                skyGrad.addColorStop(0, '#0a0a1a');
                skyGrad.addColorStop(0.4, '#151530');
                skyGrad.addColorStop(0.7, '#1a1a35');
                skyGrad.addColorStop(1, '#0f0f25');
                ctx.fillStyle = skyGrad;
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                
                // 星星
                ctx.fillStyle = 'rgba(255, 255, 255, 0.3)';
                for (let i = 0; i < 50; i++) {
                    const x = (i * 73) % canvas.width;
                    const y = (i * 47) % (canvas.height * 0.5);
                    const size = (i % 3) + 1;
                    ctx.beginPath();
                    ctx.arc(x, y, size, 0, Math.PI * 2);
                    ctx.fill();
                }
                
                // 月亮
                ctx.fillStyle = 'rgba(255, 250, 230, 0.15)';
                ctx.beginPath();
                ctx.arc(canvas.width * 0.8, 80, 40, 0, Math.PI * 2);
                ctx.fill();
                
                ctx.fillStyle = 'rgba(255, 250, 230, 0.3)';
                ctx.beginPath();
                ctx.arc(canvas.width * 0.8, 80, 35, 0, Math.PI * 2);
                ctx.fill();
            },
            
            renderMountains() {
                sceneElements.mountains.sort((a, b) => a.layer - b.layer);
                
                sceneElements.mountains.forEach(m => {
                    const parallax = m.layer * 0.1;
                    const baseColor = `rgba(${15 + m.layer * 8}, ${15 + m.layer * 8}, ${30 + m.layer * 10}, ${0.6 + m.layer * 0.1})`;
                    
                    ctx.fillStyle = baseColor;
                    ctx.beginPath();
                    ctx.moveTo(m.x - m.width / 2, canvas.height * 0.7);
                    
                    // 山峰轮廓
                    const peakX = m.x;
                    const peakY = canvas.height * 0.7 - m.height;
                    ctx.quadraticCurveTo(peakX - m.width * 0.3, canvas.height * 0.7 - m.height * 0.5, peakX, peakY);
                    ctx.quadraticCurveTo(peakX + m.width * 0.3, canvas.height * 0.7 - m.height * 0.5, m.x + m.width / 2, canvas.height * 0.7);
                    
                    ctx.fill();
                });
            },
            
            renderClouds() {
                sceneElements.clouds.forEach(cloud => {
                    cloud.x += cloud.speed;
                    if (cloud.x > canvas.width + cloud.size) {
                        cloud.x = -cloud.size * 2;
                    }
                    
                    ctx.fillStyle = `rgba(200, 200, 220, ${cloud.opacity})`;
                    
                    // 云朵形状
                    for (let i = 0; i < 3; i++) {
                        ctx.beginPath();
                        ctx.arc(cloud.x + i * cloud.size * 0.5, cloud.y, cloud.size * (0.8 - i * 0.15), 0, Math.PI * 2);
                        ctx.fill();
                    }
                });
            },
            
            renderTrees() {
                const time = Date.now() / 1000;
                
                sceneElements.trees.forEach(tree => {
                    const sway = Math.sin(time + tree.swayOffset) * 3;
                    
                    ctx.save();
                    ctx.translate(tree.x, tree.y);
                    ctx.scale(tree.scale, tree.scale);
                    
                    // 树干
                    ctx.fillStyle = '#2d1f12';
                    ctx.fillRect(-8, -80, 16, 80);
                    
                    // 树冠
                    ctx.fillStyle = '#1a3d1a';
                    ctx.beginPath();
                    ctx.moveTo(sway, -180);
                    ctx.lineTo(-60, -80);
                    ctx.lineTo(60, -80);
                    ctx.closePath();
                    ctx.fill();
                    
                    ctx.fillStyle = '#1f4d1f';
                    ctx.beginPath();
                    ctx.moveTo(sway * 0.8, -150);
                    ctx.lineTo(-50, -70);
                    ctx.lineTo(50, -70);
                    ctx.closePath();
                    ctx.fill();
                    
                    ctx.restore();
                });
            },
            
            renderCharacters() {
                const centerY = canvas.height * 0.55;
                const time = Date.now() / 1000;
                
                // 玩家位置
                playerCharacter.x = canvas.width * 0.35;
                playerCharacter.y = centerY;
                playerCharacter.bobOffset = Math.sin(time * 2) * 3;
                
                // 敌人位置
                enemyCharacter.x = canvas.width * 0.65;
                enemyCharacter.y = centerY;
                
                // 敌人死亡动画
                if (enemyCharacter.deathAnim > 0) {
                    enemyCharacter.deathAnim -= 0.02;
                    if (enemyCharacter.deathAnim < 0) enemyCharacter.deathAnim = 0;
                }
                
                // 敌人震动
                if (enemyCharacter.shakeOffset > 0) {
                    enemyCharacter.shakeOffset *= 0.8;
                    if (enemyCharacter.shakeOffset < 0.5) enemyCharacter.shakeOffset = 0;
                }
                
                // 绘制玩家
                this.drawPlayer(playerCharacter.x, playerCharacter.y + playerCharacter.bobOffset);
                
                // 绘制敌人（如果存活）
                if (enemyCharacter.deathAnim < 0.5) {
                    const shakeX = (Math.random() - 0.5) * enemyCharacter.shakeOffset;
                    const alpha = 1 - enemyCharacter.deathAnim * 2;
                    this.drawEnemy(enemyCharacter.x + shakeX, enemyCharacter.y, alpha);
                }
            },
            
            drawPlayer(x, y) {
                ctx.save();
                ctx.translate(x, y);
                
                // 身体
                ctx.fillStyle = '#4a90d9';
                ctx.beginPath();
                ctx.ellipse(0, 0, 25, 35, 0, 0, Math.PI * 2);
                ctx.fill();
                
                // 头
                ctx.fillStyle = '#f5deb3';
                ctx.beginPath();
                ctx.arc(0, -45, 20, 0, Math.PI * 2);
                ctx.fill();
                
                // 眼睛
                ctx.fillStyle = '#333';
                ctx.beginPath();
                ctx.arc(-7, -48, 4, 0, Math.PI * 2);
                ctx.arc(7, -48, 4, 0, Math.PI * 2);
                ctx.fill();
                
                // 嘴巴
                ctx.strokeStyle = '#333';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.arc(0, -38, 6, 0.2, Math.PI - 0.2);
                ctx.stroke();
                
                // 道袍
                ctx.fillStyle = '#3a7bc8';
                ctx.beginPath();
                ctx.moveTo(-20, -10);
                ctx.lineTo(-30, 40);
                ctx.lineTo(30, 40);
                ctx.lineTo(20, -10);
                ctx.closePath();
                ctx.fill();
                
                // 腰带
                ctx.fillStyle = '#d4a54a';
                ctx.fillRect(-22, 0, 44, 8);
                
                ctx.restore();
            },
            
            drawEnemy(x, y, alpha) {
                ctx.save();
                ctx.globalAlpha = alpha;
                ctx.translate(x, y);
                
                // 根据关卡选择敌人颜色
                const hue = (GameData.stage.chapter * 40 + GameData.stage.level * 20) % 360;
                
                // 身体
                ctx.fillStyle = `hsl(${hue}, 50%, 35%)`;
                ctx.beginPath();
                ctx.ellipse(0, 0, 30, 40, 0, 0, Math.PI * 2);
                ctx.fill();
                
                // 头
                ctx.fillStyle = `hsl(${hue}, 45%, 45%)`;
                ctx.beginPath();
                ctx.arc(0, -50, 22, 0, Math.PI * 2);
                ctx.fill();
                
                // 眼睛（红色）
                ctx.fillStyle = '#ff3333';
                ctx.beginPath();
                ctx.arc(-8, -52, 5, 0, Math.PI * 2);
                ctx.arc(8, -52, 5, 0, Math.PI * 2);
                ctx.fill();
                
                // 瞳孔
                ctx.fillStyle = '#000';
                ctx.beginPath();
                ctx.arc(-8, -52, 2, 0, Math.PI * 2);
                ctx.arc(8, -52, 2, 0, Math.PI * 2);
                ctx.fill();
                
                // 角
                ctx.fillStyle = `hsl(${hue}, 30%, 25%)`;
                ctx.beginPath();
                ctx.moveTo(-15, -65);
                ctx.lineTo(-20, -85);
                ctx.lineTo(-10, -70);
                ctx.closePath();
                ctx.fill();
                
                ctx.beginPath();
                ctx.moveTo(15, -65);
                ctx.lineTo(20, -85);
                ctx.lineTo(10, -70);
                ctx.closePath();
                ctx.fill();
                
                ctx.restore();
            },
            
            renderParticles() {
                // 添加新粒子
                if (Math.random() < 0.1) {
                    sceneElements.particles.push({
                        x: Math.random() * canvas.width,
                        y: canvas.height,
                        vx: (Math.random() - 0.5) * 0.5,
                        vy: -0.5 - Math.random() * 1,
                        size: 2 + Math.random() * 3,
                        alpha: 0.3 + Math.random() * 0.4,
                        color: Math.random() > 0.5 ? '#d4a54a' : '#3ecdc4'
                    });
                }
                
                // 更新和渲染粒子
                sceneElements.particles = sceneElements.particles.filter(p => {
                    p.x += p.vx;
                    p.y += p.vy;
                    p.alpha -= 0.002;
                    
                    if (p.alpha <= 0) return false;
                    
                    ctx.fillStyle = p.color;
                    ctx.globalAlpha = p.alpha;
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.globalAlpha = 1;
                    
                    return p.y > 0;
                });
            }
        };
        
        // ==================== 游戏循环 ====================
        function gameLoop(timestamp) {
            if (!lastTime) lastTime = timestamp;
            deltaTime = timestamp - lastTime;
            lastTime = timestamp;
            
            if (gameRunning) {
                // 更新游戏逻辑
                update(deltaTime);
                
                // 渲染
                Renderer.render();
                
                // 更新UI
                UI.updateMain();
            }
            
            requestAnimationFrame(gameLoop);
        }
        
        // 游戏更新
        let battleTimer = 0;
        const BATTLE_INTERVAL = 1000; // 1秒攻击一次
        
        function update(dt) {
            // 统计游戏时间
            GameData.stats.totalPlayTime += dt / 1000;
            
            // 挂机资源产出
            const production = SaveSystem.getProductionRate();
            GameData.resources.wood += production.wood * dt / 1000;
            GameData.resources.spirit += production.spirit * dt / 1000;
            
            // 自动战斗
            battleTimer += dt;
            if (battleTimer >= BATTLE_INTERVAL) {
                battleTimer = 0;
                if (enemyCharacter.deathAnim < 0.5) {
                    GameLogic.attack();
                }
            }
            
            // 自动存档
            autoSaveTimer += dt;
            if (autoSaveTimer >= AUTO_SAVE_INTERVAL) {
                autoSaveTimer = 0;
                GameData.save.lastOnlineTime = Date.now();
                SaveSystem.save();
            }
        }
        
        // ==================== 工具函数 ====================
        function showToast(message, type) {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.className = 'toast show ' + (type || '');
            setTimeout(() => {
                toast.className = 'toast';
            }, 2000);
        }
        
        function formatTime(seconds) {
            const hours = Math.floor(seconds / 3600);
            const minutes = Math.floor((seconds % 3600) / 60);
            return hours + '小时' + minutes + '分钟';
        }

                    document.getElementById(panelId).classList.remove('active');
                });
            });

            document.getElementById('breakthroughBtn').addEventListener('click', function() {

                    }).catch(() => {
                        // 备用方案：显示文本框
                        const section = document.getElementById('importSection');
                        section.style.display = 'block';
                        document.getElementById('importText').value = saveData;
                        showToast('请手动复制存档数据', '');
                    });
                }
            });
            
            // 导入存档按钮
            document.getElementById('importBtn').addEventListener('click', function() {
                const section = document.getElementById('importSection');
                section.style.display = section.style.display === 'none' ? 'block' : 'none';
                document.getElementById('importText').value = '';
            });
            
            // 确认导入
            document.getElementById('confirmImport').addEventListener('click', function() {
                const text = document.getElementById('importText').value.trim();
                if (text && SaveSystem.importSave(text)) {
                    document.getElementById('importSection').style.display = 'none';
                    GameLogic.calculateStats();
                    UI.updateMain();
                    showToast('存档导入成功！', 'success');
                } else {
                    showToast('存档格式错误', 'error');
                }
            });
            
            // 取消导入
            document.getElementById('cancelImport').addEventListener('click', function() {
                document.getElementById('importSection').style.display = 'none';
            });
            
            // 重置游戏
            document.getElementById('resetBtn').addEventListener('click', function() {
                if (confirm('确定要重置所有游戏数据吗？此操作不可恢复！')) {
                    SaveSystem.resetGame();
                }
            });
            
            // 收取离线奖励
            document.getElementById('collectBtn').addEventListener('click', function() {
                document.getElementById('offlineModal').classList.remove('active');
            });
        }
        
        // ==================== 初始化 ====================
        function init() {
            // 获取Canvas
            canvas = document.getElementById('gameCanvas');
            ctx = canvas.getContext('2d');
            
            // 设置Canvas尺寸
            function resize() {
                canvas.width = window.innerWidth;
                canvas.height = window.innerHeight;
                Renderer.initScene();
            }
            resize();
            window.addEventListener('resize', resize);
            
            // 加载存档
            SaveSystem.load();
            
            // 计算离线收益
            const offlineRewards = SaveSystem.calculateOfflineRewards();
            if (offlineRewards) {
                GameData.resources.wood += offlineRewards.wood;
                GameData.resources.spirit += offlineRewards.spirit;
                GameData.stats.totalWood += offlineRewards.wood;
                GameData.stats.totalSpirit += offlineRewards.spirit;
                
                document.getElementById('offlineTime').textContent = '离线时间: ' + formatTime(offlineRewards.time);
                document.getElementById('offlineWood').textContent = '+' + Math.floor(offlineRewards.wood);
                document.getElementById('offlineSpirit').textContent = '+' + Math.floor(offlineRewards.spirit);
                document.getElementById('offlineModal').classList.add('active');
            }
            
            // 更新最后在线时间
            GameData.save.lastOnlineTime = Date.now();
            
            // 计算属性
            GameLogic.calculateStats();
            
            // 生成初始敌人
            const enemyName = GameLogic.generateEnemy();
            document.getElementById('enemyName').textContent = enemyName;
            
            // 设置经验上限
            GameData.player.maxExp = GameLogic.getExpRequired();
            
            // 初始化事件
            initEvents();
            
            // 初始化UI
            UI.updateMain();
            
            // 开始游戏循环
            requestAnimationFrame(gameLoop);
        }
        
        // 页面加载完成后初始化
        window.addEventListener('DOMContentLoaded', init);
        
        // 页面关闭前保存
        window.addEventListener('beforeunload', function() {
            GameData.save.lastOnlineTime = Date.now();
            SaveSystem.save();
        });
        
        // 页面可见性变化时保存
        document.addEventListener('visibilitychange', function() {
            if (document.hidden) {
                GameData.save.lastOnlineTime = Date.now();
                SaveSystem.save();
            }
        });
    </script>
</body>
</html>
