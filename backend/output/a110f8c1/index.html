<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>寻道大千挂机游戏</title>
<style>
  body {
    margin: 0;
    overflow: hidden;
  }
  canvas {
    display: block;
  }
  #ui {
    position: absolute;
    bottom: 10px;
    left: 10px;
    background-color: rgba(255, 255, 255, 0.8);
    padding: 5px;
    border-radius: 5px;
  }
  #status {
    position: absolute;
    top: 10px;
    left: 10px;
    background-color: rgba(255, 255, 255, 0.8);
    padding: 5px;
    border-radius: 5px;
  }
</style>
</head>
<body>
<canvas id="gameCanvas"></canvas>
<div id="status">Health: 100</div>
<div id="ui">Score: 0</div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const role = {
  x: canvas.width / 2,
  y: canvas.height - 30,
  width: 20,
  height: 30,
  color: 'green',
  health: 100
};
const background = {
  color: 'skyblue'
};
const score = 0;
let keys = {};
let lastTime = 0;
const frameRate = 30;

function drawBackground() {
  ctx.fillStyle = background.color;
  ctx.fillRect(0, 0, canvas.width, canvas.height);
}

function drawRole() {
  ctx.fillStyle = role.color;
  ctx.fillRect(role.x, role.y, role.width, role.height);
}

function drawHealthBar() {
  const healthBarWidth = 100;
  const healthBarHeight = 10;
  const healthBarX = 10;
  const healthBarY = 10;
  ctx.fillStyle = 'red';
  ctx.fillRect(healthBarX, healthBarY, healthBarWidth, healthBarHeight);
  ctx.fillStyle = 'green';
  ctx.fillRect(healthBarX + (healthBarWidth - (role.health / 100) * healthBarWidth), healthBarY, (role.health / 100) * healthBarWidth, healthBarHeight);
}

function drawUI() {
  ctx.fillStyle = 'black';
  ctx.fillText(`Score: ${score}`, 10, 20);
}

function moveRole(timestamp) {
  if (!lastTime) lastTime = timestamp;
  const deltaTime = timestamp - lastTime;
  lastTime = timestamp;
  
  if (keys.ArrowUp) {
    role.y -= 5;
  }
  if (keys.ArrowDown) {
    role.y += 5;
  }
  if (keys.ArrowLeft) {
    role.x -= 5;
  }
  if (keys.ArrowRight) {
    role.x += 5;
  }
  
  // Ensure the role stays within the canvas bounds
  role.x = Math.max(0, Math.min(role.x, canvas.width - role.width));
  role.y = Math.max(0, Math.min(role.y, canvas.height - role.height));
}

function loop(timestamp) {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  drawBackground();
  drawRole();
  drawHealthBar();
  drawUI();
  moveRole(timestamp);
  requestAnimationFrame(loop);
}

window.addEventListener('DOMContentLoaded', () => {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
  loop();
});

window.addEventListener('keydown', (e) => {
  keys[e.key] = true;
});

window.addEventListener('keyup', (e) => {
  keys[e.key] = false;
});

// From code_13.js
// 基础伤害 = 攻击力 × (1 - 防御/(防御+100))
// 防御减伤采用边际递减设计，避免完全免疫
// 暴击伤害 = 基础伤害 × 暴击倍率
// From code_18.js
GameData = {
    player: { name, realm, realmLevel, exp, atk, def, hp, critRate, critDmg },
    resources: { wood, spirit, jade },
    stage: { chapter, level, enemyHp },
    equipment: { equipped[], backpack[] },
    beasts: { owned[], active, levels[] },
    stats: { totalPlayTime, totalKills },
    save: { lastSaveTime, lastOnlineTime, version }
}
// From code_22.js
// 假设使用Unity引擎
var roleImage = Resources.Load("Character/RoleImage.png") as Texture2D;
var roleSprite = Sprite.Create(roleImage, new Rect(0, 0, roleImage.width, roleImage.height), new Vector3(0.5f, 0.5f, 0f), 100f);
roleSprite.name = "RoleSprite";
transform.Find("Character").AddChild(roleSprite);
</script>
</body>
</html>
