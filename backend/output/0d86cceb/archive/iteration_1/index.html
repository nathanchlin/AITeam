<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>寻道大千 - 挂机类游戏</title>
<style>
  body {
    margin: 0;
    overflow: hidden;
  }
  canvas {
    display: block;
  }
  #status {
    position: absolute;
    top: 10px;
    left: 10px;
    background: rgba(0, 0, 0, 0.5);
    color: white;
    padding: 5px;
    border-radius: 5px;
  }
</style>
</head>
<body>
<canvas id="gameCanvas"></canvas>
<div id="status">Score: 0</div>

<script>
const canvas = document.getElementById('gameCanvas');
  const ctx = canvas.getContext('2d');
  const status = document.getElementById('status');
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;

  let player = {
    x: canvas.width / 2,
    y: canvas.height / 2,
    width: 50,
    height: 50,
    color: 'blue',
    score: 0,
    health: 100,
    animationFrameId: null
  };

  let map = {
    width: canvas.width,
    height: canvas.height,
    color: 'green'
  };

  function drawRect(x, y, width, height, color) {
    ctx.fillStyle = color;
    ctx.fillRect(x, y, width, height);
  }

  function drawPlayer() {
    // 仅绘制角色，不绘制文字UI，交由 UIManager 处理
    ctx.fillStyle = player.color;
    ctx.fillRect(player.x, player.y, player.width, player.height);
    
    // 绘制角色动画或特效（例如呼吸效果）
    if (player.isHit) {
        ctx.globalAlpha = 0.5;
        ctx.fillStyle = 'white';
        ctx.fillRect(player.x, player.y, player.width, player.height);
        ctx.globalAlpha = 1.0;
        player.isHit = false; // 重置状态
    }
  }

  function drawMap() {
    drawRect(map.x, map.y, map.width, map.height, map.color);
  }

  
// ==================== 性能监控器 ====================
  class PerformanceMonitor {
    constructor() {
      this.fps = 0;
      this.frameTime = 0;
      this.lastTime = performance.now();
      this.frameCount = 0;
      this.fpsHistory = [];
      this.maxHistoryLength = 60;
      this.isVisible = true;
      
      // 性能等级
      this.performanceLevel = 'high';
      this.recommendedSettings = {
        high: { maxParticles: 1000, effectsQuality: 'high', updateInterval: 16 },
        medium: { maxParticles: 500, effectsQuality: 'medium', updateInterval: 33 },
        low: { maxParticles: 200, effectsQuality: 'low', updateInterval: 50 }
      };
      
      this.createPanel();
      this.startMonitoring();
    }
    
    createPanel() {
      this.panel = document.createElement('div');
      this.panel.id = 'performancePanel';
      this.panel.innerHTML = `
        <div class="panel-header">
          <span class="panel-title">📊 性能监控</span>
          <span id="perfToggle" style="cursor:pointer;color:#888;">_</span>
        </div>
        <div id="perfContent">
          <div class="stat-row">
            <span class="stat-label">FPS:</span>
            <span id="fpsValue" style="color:#0f0;font-weight:bold;">60</span>
          </div>
          <div class="fps-bar"><div class="fps-fill" id="fpsBar" style="width:100%"></div></div>
          <div class="stat-row">
            <span class="stat-label">帧时间:</span>
            <span id="frameTime">16.67ms</span>
          </div>
          <div class="stat-row">
            <span class="stat-label">性能等级:</span>
            <span id="perfLevel" style="color:#0f0;">HIGH</span>
          </div>
          <div class="stat-row">
            <span class="stat-label">粒子数:</span>
            <span id="particleCount">0</span>
          </div>
          <div class="stat-row">
            <span class="stat-label">内存:</span>
            <span id="memoryUsage">--</span>
          </div>
        </div>
      `;
      document.body.appendChild(this.panel);
      
      // 最小化切换
      document.getElementById('perfToggle').onclick = () => {
        const content = document.getElementById('perfContent');
        const toggle = document.getElementById('perfToggle');
        this.isVisible = !this.isVisible;
        content.style.display = this.isVisible ? 'block' : 'none';
        toggle.textContent = this.isVisible ? '_' : '□';
      };
    }
    
    startMonitoring() {
      this.monitorInterval = setInterval(() => {
        this.calculatePerformance();
        this.updatePanel();
        this.adjustPerformanceLevel();
      }, 500);
    }
    
    calculatePerformance() {
      const now = performance.now();
      if (this.frameCount > 0) {
        this.fps = Math.round((this.frameCount * 1000) / (now - this.lastTime));
        this.frameTime = ((now - this.lastTime) / this.frameCount).toFixed(2);
      }
      this.frameCount = 0;
      this.lastTime = now;
      
      this.fpsHistory.push(this.fps);
      if (this.fpsHistory.length > this.maxHistoryLength) {
        this.fpsHistory.shift();
      }
    }
    
    tick() {
      this.frameCount++;
    }
    
    adjustPerformanceLevel() {
      if (this.fpsHistory.length < 10) return;
      
      const recentFps = this.fpsHistory.slice(-10);
      const avgFps = recentFps.reduce((a, b) => a + b, 0) / recentFps.length;
      
      const prevLevel = this.performanceLevel;
      
      if (avgFps >= 50) {
        this.performanceLevel = 'high';
      } else if (avgFps >= 30) {
        this.performanceLevel = 'medium';
      } else {
        this.performanceLevel = 'low';
      }
      
      if (prevLevel !== this.performanceLevel) {
        console.log(`[PerformanceMonitor] 性能等级调整为: ${this.performanceLevel.toUpperCase()}`);
        this.applyPerformanceSettings();
      }
    }
    
    applyPerformanceSettings() {
      const settings = this.recommendedSettings[this.performanceLevel];
      
      // 调整粒子系统
      if (typeof ParticleSystem !== 'undefined' && window.particleSystem) {
        window.particleSystem.maxParticles = settings.maxParticles;
      }
      
      console.log('[PerformanceMonitor] 应用设置:', settings);
    }
    
    updatePanel() {
      if (!this.isVisible) return;
      
      const fpsEl = document.getElementById('fpsValue');
      const fpsBar = document.getElementById('fpsBar');
      const frameTimeEl = document.getElementById('frameTime');
      const perfLevelEl = document.getElementById('perfLevel');
      const particleEl = document.getElementById('particleCount');
      const memoryEl = document.getElementById('memoryUsage');
      
      // FPS 颜色
      let fpsColor = '#0f0';
      if (this.fps < 30) fpsColor = '#f00';
      else if (this.fps < 50) fpsColor = '#ff0';
      
      fpsEl.textContent = this.fps;
      fpsEl.style.color = fpsColor;
      fpsBar.style.width = Math.min(100, (this.fps / 60) * 100) + '%';
      
      frameTimeEl.textContent = this.frameTime + 'ms';
      
      // 性能等级颜色
      const levelColors = { high: '#0f0', medium: '#ff0', low: '#f00' };
      perfLevelEl.textContent = this.performanceLevel.toUpperCase();
      perfLevelEl.style.color = levelColors[this.performanceLevel];
      
      // 粒子数
      if (window.particleSystem) {
        particleEl.textContent = window.particleSystem.particles.length;
      }
      
      // 内存使用
      if (performance.memory) {
        const usedMB = (performance.memory.usedJSHeapSize / 1048576).toFixed(1);
        const totalMB = (performance.memory.jsHeapSizeLimit / 1048576).toFixed(0);
        memoryEl.textContent = `${usedMB}MB / ${totalMB}MB`;
      }
    }
    
    getSettings() {
      return this.recommendedSettings[this.performanceLevel];
    }
    
    destroy() {
      clearInterval(this.monitorInterval);
      this.panel.remove();
    }
  }

  // ==================== 兼容性测试器 ====================
  class CompatibilityTester {
    constructor() {
      this.results = {};
      this.createButton();
      this.createPanel();
    }
    
    createButton() {
      const btn = document.createElement('button');
      btn.id = 'testButton';
      btn.textContent = '🔍 兼容性测试';
      btn.onclick = () => this.runTests();
      document.body.appendChild(btn);
    }
    
    createPanel() {
      this.panel = document.createElement('div');
      this.panel.id = 'compatibilityPanel';
      document.body.appendChild(this.panel);
    }
    
    runTests() {
      this.results = {
        screen: this.testScreen(),
        browser: this.testBrowser(),
        graphics: this.testGraphics(),
        input: this.testInput(),
        performance: this.testPerformance(),
        storage: this.testStorage()
      };
      
      this.showResults();
    }
    
    testScreen() {
      return {
        '屏幕分辨率': { value: `${screen.width}x${screen.height}`, status: 'pass' },
        '窗口大小': { value: `${window.innerWidth}x${window.innerHeight}`, status: 'pass' },
        '设备像素比': { value: window.devicePixelRatio || 1, status: window.devicePixelRatio > 2 ? 'warn' : 'pass' },
        '色彩深度': { value: screen.colorDepth + 'bit', status: 'pass' },
        '屏幕方向': { value: screen.orientation ? screen.orientation.type : 'unknown', status: 'pass' }
      };
    }
    
    testBrowser() {
      const ua = navigator.userAgent;
      let browser = 'Unknown';
      if (ua.includes('Chrome')) browser = 'Chrome';
      else if (ua.includes('Firefox')) browser = 'Firefox';
      else if (ua.includes('Safari')) browser = 'Safari';
      else if (ua.includes('Edge')) browser = 'Edge';
      
      return {
        '浏览器': { value: browser, status: 'pass' },
        '用户代理': { value: ua.substring(0, 50) + '...', status: 'pass' },
        '语言': { value: navigator.language, status: 'pass' },
        'Cookies启用': { value: navigator.cookieEnabled ? '是' : '否', status: navigator.cookieEnabled ? 'pass' : 'warn' },
        '在线状态': { value: navigator.onLine ? '在线' : '离线', status: navigator.onLine ? 'pass' : 'warn' }
      };
    }
    
    testGraphics() {
      const canvas = document.createElement('canvas');
      const ctx2d = canvas.getContext('2d');
      const webgl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');
      
      return {
        'Canvas 2D': { value: ctx2d ? '支持' : '不支持', status: ctx2d ? 'pass' : 'fail' },
        'WebGL': { value: webgl ? '支持' : '不支持', status: webgl ? 'pass' : 'warn' },
        'WebGL 2': { 
          value: canvas.getContext('webgl2') ? '支持' : '不支持', 
          status: canvas.getContext('webgl2') ? 'pass' : 'warn' 
        },
        '最大纹理尺寸': { 
          value: webgl ? webgl.getParameter(webgl.MAX_TEXTURE_SIZE) + 'px' : 'N/A', 
          status: 'pass' 
        }
      };
    }
    
    testInput() {
      return {
        '触摸支持': { 
          value: 'ontouchstart' in window ? '支持' : '不支持', 
          status: 'ontouchstart' in window ? 'pass' : 'warn' 
        },
        '指针事件': { 
          value: 'PointerEvent' in window ? '支持' : '不支持', 
          status: 'PointerEvent' in window ? 'pass' : 'warn' 
        },
        '鼠标支持': { value: 'onmousemove' in window ? '支持' : '不支持', status: 'pass' },
        '键盘支持': { value: 'onkeydown' in window ? '支持' : '不支持', status: 'pass' }
      };
    }
    
    testPerformance() {
      const cores = navigator.hardwareConcurrency || '未知';
      const memory = navigator.deviceMemory || '未知';
      
      return {
        'CPU核心数': { 
          value: cores, 
          status: cores === '未知' ? 'warn' : (cores >= 4 ? 'pass' : 'warn') 
        },
        '设备内存': { 
          value: memory === '未知' ? '未知' : memory + 'GB', 
          status: memory === '未知' ? 'warn' : (memory >= 4 ? 'pass' : 'warn') 
        },
        '请求动画帧': { 
          value: 'requestAnimationFrame' in window ? '支持' : '不支持', 
          status: 'requestAnimationFrame' in window ? 'pass' : 'fail' 
        }
      };
    }
    
    testStorage() {
      let localStorageTest = false;
      try {
        localStorage.setItem('test', 'test');
        localStorage.removeItem('test');
        localStorageTest = true;
      } catch(e) {}
      
      return {
        'LocalStorage': { value: localStorageTest ? '支持' : '不支持', status: localStorageTest ? 'pass' : 'warn' },
        'SessionStorage': { 
          value: 'sessionStorage' in window ? '支持' : '不支持', 
          status: 'sessionStorage' in window ? 'pass' : 'warn' 
        },
        'IndexedDB': { 
          value: 'indexedDB' in window ? '支持' : '不支持', 
          status: 'indexedDB' in window ? 'pass' : 'warn' 
        }
      };
    }
    
    showResults() {
      let html = `
        <div class="compat-title">📋 兼容性测试报告</div>
        <div class="test-section">
          <strong>🖥️ 屏幕信息</strong>
          ${this.renderSection(this.results.screen)}
        </div>
        <div class="test-section">
          <strong>🌐 浏览器信息</strong>
          ${this.renderSection(this.results.browser)}
        </div>
        <div class="test-section">
          <strong>🎨 图形支持</strong>
          ${this.renderSection(this.results.graphics)}
        </div>
        <div class="test-section">
          <strong>👆 输入设备</strong>
          ${this.renderSection(this.results.input)}
        </div>
        <div class="test-section">
          <strong>⚡ 性能指标</strong>
          ${this.renderSection(this.results.performance)}
        </div>
        <div class="test-section">
          <strong>💾 存储支持</strong>
          ${this.renderSection(this.results.storage)}
        </div>
        <button class="close-btn" onclick="document.getElementById('compatibilityPanel').style.display='none'">关闭</button>
      `;
      
      this.panel.innerHTML = html;
      this.panel.style.display = 'block';
    }
    
    renderSection(section) {
      return Object.entries(section).map(([key, data]) => `
        <div class="test-item">
          <span>${key}</span>
          <span class="test-result ${data.status}">${data.value}</span>
        </div>
      `).join('');
    }
  }

  // ==================== 响应式布局管理器 ====================
  class ResponsiveManager {
    constructor() {
      this.breakpoints = {
        mobile: 480,
        tablet: 768,
        desktop: 1024
      };
      this.currentBreakpoint = this.getBreakpoint();
      this.listeners = [];
      
      window.addEventListener('resize', () => this.handleResize());
      this.handleResize();
    }
    
    getBreakpoint() {
      const width = window.innerWidth;
      if (width < this.breakpoints.mobile) return 'mobile';
      if (width < this.breakpoints.tablet) return 'tablet';
      return 'desktop';
    }
    
    handleResize() {
      const newBreakpoint = this.getBreakpoint();
      
      if (newBreakpoint !== this.currentBreakpoint) {
        console.log(`[ResponsiveManager] 断点变化: ${this.currentBreakpoint} -> ${newBreakpoint}`);
        this.currentBreakpoint = newBreakpoint;
        this.notifyListeners(newBreakpoint);
      }
      
      this.adjustUILayout();
    }
    
    adjustUILayout() {
      const width = window.innerWidth;
      const height = window.innerHeight;
      
      // 调整游戏画布
      canvas.width = width;
      canvas.height = height;
      
      // 调整UI元素缩放
      const scale = Math.min(width / 1280, height / 720);
      document.documentElement.style.setProperty('--ui-scale', Math.max(0.7, Math.min(1, scale)));
      
      // 低分辨率适配
      if (width < 480 || height < 360) {
        document.body.classList.add('low-resolution');
      } else {
        document.body.classList.remove('low-resolution');
      }
    }
    
    onChange(callback) {
      this.listeners.push(callback);
    }
    
    notifyListeners(breakpoint) {
      this.listeners.forEach(cb => cb(breakpoint));
    }
  }

  // 全局实例
  let performanceMonitor = null;
  let compatibilityTester = null;
  let responsiveManager = null;
function gameLoop() {
    // 性能监控计数
    if (performanceMonitor) {
      performanceMonitor.tick();
    }
    
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    
    // 动态调整画布大小（如果窗口改变）
    if (canvas.width !== window.innerWidth) canvas.width = window.innerWidth;
    if (canvas.height !== window.innerHeight) canvas.height = window.innerHeight;

    updateScore(); 
    
    drawMap();
    drawPlayer();
    
    // 关键：每帧更新 UI 数据
    if (typeof UIManager !== 'undefined') {
        UIManager.update(player);
    }
    
    requestAnimationFrame(gameLoop);
}

  function handleKeyPress(event) {
    const { keyCode } = event;
    const step = 10;

    switch (keyCode) {
      case 37: // Left arrow
        player.x = Math.max(0, player.x - step);
        break;
      case 38: // Up arrow
        player.y = Math.max(0, player.y - step);
        break;
      case 39: // Right arrow
        player.x = Math.min(canvas.width - player.width, player.x + step);
        break;
      case 40: // Down arrow
        player.y = Math.min(canvas.height - player.height, player.y + step);
        break;
    }
  }

  function checkCollision(player, map) {
    return player.x < map.x + map.width &&
           player.x + player.width > map.x &&
           player.y < map.y + map.height &&
           player.y + player.height > map.y;
  }

  function updateScore() {
    if (checkCollision(player, map)) {
      player.score += 10;
      player.health -= 5; // Deduct health on collision
      animateHit();
    }
  }

  function animateHit() {
    // 简化动画逻辑，通过状态标记驱动绘制
    player.isHit = true;
    UIManager.logMessage("受到伤害！生命值: " + player.health);
  }

  window.onload = function() {
    document.addEventListener('keydown', handleKeyPress);
    gameLoop();
  };

  setInterval(updateScore, 1000); // Update score every second

// From code_4.js
class ParticleSystem {
  constructor(canvas) {
    this.canvas = canvas;
    this.ctx = canvas.getContext('2d');
    this.particles = [];
    this.maxParticles = 1000;
  }

  addParticle(x, y, velocity) {
    if (this.particles.length < this.maxParticles) {
      const particle = { x, y, velocity, age: 0 };
      this.particles.push(particle);
    }
  }

  update() {
    for (let i = this.particles.length - 1; i >= 0; i--) {
      const particle = this.particles[i];
      particle.x += particle.velocity.x;
      particle.y += particle.velocity.y;
      particle.age++;

      if (particle.age > 10) {
        this.particles.splice(i, 1);
      }
    }
  }

  render() {
    this.ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);
    this.particles.forEach(particle => {
      this.ctx.fillStyle = 'white';
      this.ctx.beginPath();
      this.ctx.arc(particle.x, particle.y, 2, 0, Math.PI * 2);
      this.ctx.fill();
    });
  }
}
// From code_5.js
class LODManager {
  constructor() {
    this.models = [];
  }

  addModel(modelName, distances, models) {
    this.models.push({ name: modelName, distances, models });
  }

  getModelForDistance(distance) {
    for (let i = 0; i < this.models.length; i++) {
      if (distance < this.models[i].distances[i]) {
        return this.models[i].models[i];
      }
    }
    return this.models[this.models.length - 1].models[this.models.length - 1];
  }
}

  // --- 交互管理器：处理滑动和点击逻辑 ---
  class InteractionManager {
    static init(zone, knob) {
      this.zone = zone;
      this.knob = knob;
      this.isDragging = false;
      this.startX = 0;
      this.startY = 0;
      
      // 绑定触摸/鼠标事件
      const eventStart = window.ontouchstart !== undefined ? 'touchstart' : 'mousedown';
      const eventMove = window.ontouchmove !== undefined ? 'touchmove' : 'mousemove';
      const eventEnd = window.ontouchend !== undefined ? 'touchend' : 'mouseup';

      // 将事件绑定到整个 document 以确保松开时能捕捉
      document.addEventListener(eventStart, (e) => this.handleStart(e), { passive: false });
      document.addEventListener(eventMove, (e) => this.handleMove(e), { passive: false });
      document.addEventListener(eventEnd, (e) => this.handleEnd(e));
    }

    static handleStart(e) {
      // 检查是否点击在了摇杆区域内
      const rect = this.zone.getBoundingClientRect();
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const clientY = e.touches ? e.touches[0].clientY : e.clientY;

      // 简单判断：如果点击在摇杆区域附近，则激活拖动
      const dist = Math.sqrt(Math.pow(clientX - (rect.left + rect.width/2), 2) + Math.pow(clientY - (rect.top + rect.height/2), 2));
      
      if (dist < 60) { // 60px 激活半径
        this.isDragging = true;
        this.startX = clientX;
        this.startY = clientY;
        this.zone.style.background = 'rgba(255,255,255,0.2)';
        e.preventDefault(); // 防止滚动
      }
    }

    static handleMove(e) {
      if (!this.isDragging) return;
      
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const clientY = e.touches ? e.touches[0].clientY : e.clientY;
      
      const dx = clientX - this.startX;
      const dy = clientY - this.startY;
      
      // 限制摇杆移动范围
      const maxDist = 40;
      const dist = Math.sqrt(dx*dx + dy*dy);
      const angle = Math.atan2(dy, dx);
      
      const limitedX = Math.min(maxDist, dist) * Math.cos(angle);
      const limitedY = Math.min(maxDist, dist) * Math.sin(angle);

      // 移动摇杆 UI
      this.knob.style.transform = `translate(${limitedX}px, ${limitedY}px)`;
      
      // 更新玩家位置 (滑动操作 -> 移动逻辑)
      const speed = 5;
      player.x += (limitedX / maxDist) * speed;
      player.y += (limitedY / maxDist) * speed;

      // 边界限制
      player.x = Math.max(0, Math.min(canvas.width - player.width, player.x));
      player.y = Math.max(0, Math.min(canvas.height - player.height, player.y));
    }

    static handleEnd(e) {
      if (this.isDragging) {
        this.isDragging = false;
        // 复位摇杆
        this.knob.style.transform = `translate(0px, 0px)`;
        this.zone.style.background = 'rgba(255,255,255,0.1)';
      }
    }
  }
  
  // 全局实例化
  const UIManager = new UIManager();

class PerformanceMonitor {
    constructor() {
      this.fps = 0;
      this.frameTime = 0;
      this.lastTime = performance.now();
      this.frameCount = 0;
      this.fpsHistory = [];
      this.maxHistoryLength = 60;
      this.isVisible = true;
      
      this.performanceLevel = 'high';
      this.recommendedSettings = {
        high: { maxParticles: 1000, effectsQuality: 'high', updateInterval: 16 },
        medium: { maxParticles: 500, effectsQuality: 'medium', updateInterval: 33 },
        low: { maxParticles: 200, effectsQuality: 'low', updateInterval: 50 }
      };
      
      this.createPanel();
      this.startMonitoring();
    }
    
    createPanel() {
      this.panel = document.createElement('div');
      this.panel.id = 'performancePanel';
      this.panel.innerHTML = `
        <div class="panel-header">
          <span class="panel-title">📊 性能监控</span>
          <span id="perfToggle" class="toggle-btn ripple-btn">_</span>
        </div>
        <div id="perfContent">
          <div class="stat-row">
            <span class="stat-label">FPS:</span>
            <span id="fpsValue" style="color:#0f0;font-weight:bold;">60</span>
          </div>
          <div class="fps-bar"><div class="fps-fill" id="fpsBar" style="width:100%"></div></div>
          <div class="stat-row">
            <span class="stat-label">帧时间:</span>
            <span id="frameTime">16.67ms</span>
          </div>
          <div class="stat-row">
            <span class="stat-label">性能等级:</span>
            <span id="perfLevel" style="color:#0f0;">HIGH</span>
          </div>
          <div class="stat-row">
            <span class="stat-label">粒子数:</span>
            <span id="particleCount">0</span>
          </div>
          <div class="stat-row">
            <span class="stat-label">内存:</span>
            <span id="memoryUsage">--</span>
          </div>
        </div>
      `;
      document.body.appendChild(this.panel);
      
      const toggle = document.getElementById('perfToggle');
      toggle.onclick = (e) => {
        e.stopPropagation();
        const content = document.getElementById('perfContent');
        this.isVisible = !this.isVisible;
        content.style.display = this.isVisible ? 'block' : 'none';
        toggle.textContent = this.isVisible ? '_' : '□';
        
        // Toast反馈
        if (uiFeedback) {
          uiFeedback.showToast(this.isVisible ? '性能面板已展开' : '性能面板已收起', 'info', 1500);
        }
      };
    }
    
    startMonitoring() {
      const update = () => {
        this.frameCount++;
        const currentTime = performance.now();
        const delta = currentTime - this.lastTime;
        
        if (delta >= 1000) {
          this.fps = Math.round((this.frameCount * 1000) / delta);
          this.frameTime = (delta / this.frameCount).toFixed(2);
          this.frameCount = 0;
          this.lastTime = currentTime;
          
          this.fpsHistory.push(this.fps);
          if (this.fpsHistory.length > this.maxHistoryLength) {
            this.fpsHistory.shift();
          }
          
          this.updatePanel();
          this.assessPerformance();
        }
        
        requestAnimationFrame(update);
      };
      requestAnimationFrame(update);
    }
    
    updatePanel() {
      document.getElementById('fpsValue').textContent = this.fps;
      document.getElementById('fpsBar').style.width = `${Math.min(100, (this.fps / 60) * 100)}%`;
      document.getElementById('frameTime').textContent = `${this.frameTime}ms`;
      document.getElementById('perfLevel').textContent = this.performanceLevel.toUpperCase();
      
      const fpsColor = this.fps >= 50 ? '#0f0' : this.fps >= 30 ? '#ff0' : '#f00';
      document.getElementById('fpsValue').style.color = fpsColor;
      document.getElementById('perfLevel').style.color = fpsColor;
      
      if (performance.memory) {
        const mb = (performance.memory.usedJSHeapSize / 1048576).toFixed(1);
        document.getElementById('memoryUsage').textContent = `${mb}MB`;
      }
    }
    
    assessPerformance() {
      const avgFps = this.fpsHistory.reduce((a, b) => a + b, 0) / this.fpsHistory.length;
      if (avgFps >= 55) this.performanceLevel = 'high';
      else if (avgFps >= 35) this.performanceLevel = 'medium';
      else this.performanceLevel = 'low';
    }
    
    show() { this.panel.style.display = 'block'; }
    hide() { this.panel.style.display = 'none'; }
  }

// ==================== UI反馈管理器 ====================
class UIFeedbackManager {
  constructor() {
    this.initRippleEffect();
    this.initButtonAnimations();
    this.initToasts();
  }
  
  // 初始化涟漪效果
  initRippleEffect() {
    document.addEventListener('click', (e) => {
      const btn = e.target.closest('.ripple-btn, .game-btn');
      if (!btn) return;
      
      const ripple = document.createElement('span');
      ripple.className = 'ripple-effect';
      
      const rect = btn.getBoundingClientRect();
      const size = Math.max(rect.width, rect.height);
      const x = e.clientX - rect.left - size / 2;
      const y = e.clientY - rect.top - size / 2;
      
      ripple.style.cssText = `
        width: ${size}px;
        height: ${size}px;
        left: ${x}px;
        top: ${y}px;
      `;
      
      btn.appendChild(ripple);
      ripple.addEventListener('animationend', () => ripple.remove());
      
      // 震动反馈（移动端）
      if (navigator.vibrate) {
        navigator.vibrate(10);
      }
    });
  }
  
  // 初始化按钮动画
  initButtonAnimations() {
    document.querySelectorAll('.game-btn').forEach(btn => {
      btn.addEventListener('mousedown', () => {
        btn.style.transform = 'scale(0.95)';
      });
      btn.addEventListener('mouseup', () => {
        btn.style.transform = 'scale(1)';
      });
      btn.addEventListener('mouseleave', () => {
        btn.style.transform = 'scale(1)';
      });
    });
  }
  
  // 初始化Toast容器
  initToasts() {
    if (!document.getElementById('toastContainer')) {
      const container = document.createElement('div');
      container.id = 'toastContainer';
      document.body.appendChild(container);
    }
  }
  
  // 显示Toast通知
  showToast(message, type = 'info', duration = 3000) {
    const container = document.getElementById('toastContainer');
    const toast = document.createElement('div');
    toast.className = `toast toast-${type}`;
    
    const icons = {
      success: '✓',
      error: '✕',
      warning: '⚠',
      info: 'ℹ'
    };
    
    toast.innerHTML = `
      <span class="toast-icon">${icons[type]}</span>
      <span class="toast-message">${message}</span>
      <div class="toast-progress"></div>
    `;
    
    container.appendChild(toast);
    
    // 进度条动画
    const progress = toast.querySelector('.toast-progress');
    progress.style.animationDuration = `${duration}ms`;
    
    setTimeout(() => {
      toast.classList.add('toast-fade-out');
      setTimeout(() => toast.remove(), 300);
    }, duration);
    
    // 点击关闭
    toast.addEventListener('click', () => {
      toast.classList.add('toast-fade-out');
      setTimeout(() => toast.remove(), 300);
    });
  }
  
  // 按钮加载状态
  setButtonLoading(btn, isLoading, loadingText = '处理中...') {
    if (isLoading) {
      btn.dataset.originalText = btn.innerHTML;
      btn.disabled = true;
      btn.innerHTML = `<span class="btn-spinner"></span>${loadingText}`;
      btn.classList.add('btn-loading');
    } else {
      btn.disabled = false;
      btn.innerHTML = btn.dataset.originalText;
      btn.classList.remove('btn-loading');
    }
  }
  
  // 数字飘动效果
  showFloatingNumber(x, y, value, color = '#ffcc00') {
    const floater = document.createElement('div');
    floater.className = 'floating-number';
    floater.style.cssText = `
      left: ${x}px;
      top: ${y}px;
      color: ${color};
    `;
    floater.textContent = value > 0 ? `+${value}` : value;
    document.body.appendChild(floater);
    
    floater.addEventListener('animationend', () => floater.remove());
  }
  
  // 屏幕闪烁效果
  flashScreen(color = 'white', duration = 100) {
    const flash = document.createElement('div');
    flash.className = 'screen-flash';
    flash.style.cssText = `
      background: ${color};
      animation-duration: ${duration}ms;
    `;
    document.body.appendChild(flash);
    flash.addEventListener('animationend', () => flash.remove());
  }
  
  // 伤害数字效果
  showDamageNumber(x, y, damage, isCritical = false) {
    const dmg = document.createElement('div');
    dmg.className = `damage-number ${isCritical ? 'critical' : ''}`;
    dmg.style.cssText = `left: ${x}px; top: ${y}px;`;
    dmg.textContent = isCritical ? `暴击! -${damage}` : `-${damage}`;
    document.body.appendChild(dmg);
    dmg.addEventListener('animationend', () => dmg.remove());
  }
}

// ==================== 加载管理器 ====================
class LoadingManager {
  constructor() {
    this.activeLoaders = new Set();
    this.createOverlay();
  }
  
  createOverlay() {
    this.overlay = document.createElement('div');
    this.overlay.id = 'loadingOverlay';
    this.overlay.innerHTML = `
      <div class="loading-content">
        <div class="loading-spinner"></div>
        <div class="loading-text">加载中...</div>
        <div class="loading-progress">
          <div class="loading-progress-bar"></div>
        </div>
      </div>
    `;
    this.overlay.style.display = 'none';
    document.body.appendChild(this.overlay);
    
    this.progressBar = this.overlay.querySelector('.loading-progress-bar');
    this.loadingText = this.overlay.querySelector('.loading-text');
  }
  
  show(text = '加载中...', progress = 0) {
    this.overlay.style.display = 'flex';
    this.loadingText.textContent = text;
    this.setProgress(progress);
    this.activeLoaders.add('main');
  }
  
  hide() {
    this.activeLoaders.delete('main');
    if (this.activeLoaders.size === 0) {
      this.overlay.style.display = 'none';
    }
  }
  
  setProgress(percent) {
    this.progressBar.style.width = `${Math.min(100, Math.max(0, percent))}%`;
  }
  
  setText(text) {
    this.loadingText.textContent = text;
  }
  
  // 模拟加载过程
  async simulateLoading(steps) {
    this.show();
    for (let i = 0; i < steps.length; i++) {
      this.setText(steps[i].text);
      this.setProgress((i + 1) / steps.length * 100);
      await new Promise(r => setTimeout(r, steps[i].duration || 500));
    }
    this.hide();
  }
}

// ==================== 按钮悬停效果管理器 ====================
class ButtonHoverEffect {
  constructor() {
    this.init();
  }
  
  init() {
    document.addEventListener('mouseover', (e) => {
      const btn = e.target.closest('.game-btn, .ripple-btn');
      if (btn && !btn.disabled) {
        btn.classList.add('btn-hover');
      }
    });
    
    document.addEventListener('mouseout', (e) => {
      const btn = e.target.closest('.game-btn, .ripple-btn');
      if (btn) {
        btn.classList.remove('btn-hover');
      }
    });
  }
}
