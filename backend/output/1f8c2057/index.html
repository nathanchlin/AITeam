<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />
    <meta name="description" content="Modern Snake Game" />
    <title>Snake Game</title>
  <style>
/* From style.css */
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen,
    Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
  background-color: #1a1a1a;
  color: #ffffff;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}

.app-container {
  display: flex;
  flex-direction: column;
  flex: 1;
}

.app-header {
  text-align: center;
  padding: 1rem;
  background-color: #2d2d2d;
  border-bottom: 2px solid #444;
}

.app-header h1 {
  font-size: 2.5rem;
  color: #4caf50;
  text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
}

.app-main {
  display: flex;
  flex: 1;
  padding: 2rem;
  gap: 2rem;
  max-width: 1200px;
  margin: 0 auto;
  width: 100%;
}

.game-area {
  position: relative;
  flex: 1;
  display: flex;
  justify-content: center;
  align-items: center;
}

.game-sidebar {
  width: 250px;
  display: flex;
  flex-direction: column;
  gap: 1.5rem;
}

.game-overlay {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  display: flex;
  justify-content: center;
  align-items: center;
  background-color: rgba(0, 0, 0, 0.7);
  z-index: 10;
}

.game-over {
  text-align: center;
  padding: 2rem;
  background-color: #2d2d2d;
  border-radius: 8px;
  box-shadow: 0 4px 8px rgba(0, 0, 0, 0.3);
}

.game-over h2 {
  font-size: 2rem;
  margin-bottom: 1rem;
  color: #f44336;
}

.btn {
  padding: 0.75rem 1.5rem;
  font-size: 1rem;
  border: none;
  border-radius: 4px;
  cursor: pointer;
  transition: background-color 0.3s;
}

.btn-primary {
  background-color: #4caf50;
  color: white;
}

.btn-primary:hover {
  background-color: #45a049;
}

.btn-secondary {
  background-color: #2196f3;
  color: white;
}

.btn-secondary:hover {
  background-color: #0b7dda;
}

.app-footer {
  text-align: center;
  padding: 1rem;
  background-color: #2d2d2d;
  border-top: 2px solid #444;
  color: #aaa;
}

/* Responsive design */
@media (max-width: 768px) {
  .app-main {
    flex-direction: column;
    padding: 1rem;
  }
  
  .game-sidebar {
    width: 100%;
    flex-direction: row;
    flex-wrap: wrap;
  }
  
  .game-sidebar > div {
    flex: 1;
    min-width: 200px;
  }
}
</style>
</head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
  <script>
// From code_5.js
export const GAME_CONFIG = {
  GRID_SIZE: 20,
  CELL_SIZE: 20,
  INITIAL_SPEED: 150,
  SPEED_INCREMENT: 5,
  MAX_SPEED: 50,
  FOOD_COLOR: '#ff5252',
  SNAKE_HEAD_COLOR: '#4caf50',
  SNAKE_BODY_COLOR: '#388e3c',
  GRID_COLOR: '#333',
  BACKGROUND_COLOR: '#1a1a1a',
};

export const GAME_STATES = {
  IDLE: 'idle',
  RUNNING: 'running',
  PAUSED: 'paused',
  GAME_OVER: 'gameOver',
};

export const DIRECTIONS = {
  UP: 'UP',
  DOWN: 'DOWN',
  LEFT: 'LEFT',
  RIGHT: 'RIGHT',
};
</script>
</body>
</html>
