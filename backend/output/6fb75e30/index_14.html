<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>火柴人跑酷游戏</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Arial', sans-serif;
            background-color: #f0f0f0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }
        
        .game-container {
            position: relative;
            width: 800px;
            height: 400px;
            background-color: #87CEEB;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
            overflow: hidden;
        }
        
        canvas {
            display: block;
            background-color: #87CEEB;
        }
        
        .game-info {
            position: absolute;
            top: 10px;
            left: 10px;
            color: white;
            font-size: 18px;
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.5);
        }
        
        .game-over {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background-color: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
            display: none;
        }
        
        .restart-btn {
            margin-top: 10px;
            padding: 8px 16px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
        }
        
        .restart-btn:hover {
            background-color: #45a049;
        }
    </style>
</head>
<body>
    <div class="game-container">
        <canvas id="gameCanvas" width="800" height="400"></canvas>
        <div class="game-info">
            <div>分数: <span id="score">0</span></div>
            <div>最高分: <span id="highScore">0</span></div>
        </div>
        <div class="game-over" id="gameOver">
            <h2>游戏结束!</h2>
            <p>你的分数: <span id="finalScore">0</span></p>
            <button class="restart-btn" id="restartBtn">重新开始</button>
        </div>
    </div>

    <script>
        // 游戏状态管理
        const GameState = {
            MENU: 0,
            PLAYING: 1,
            GAME_OVER: 2
        };

        // 游戏主类
        class StickmanRunnerGame {
            constructor(canvasId) {
                this.canvas = document.getElementById(canvasId);
                this.ctx = this.canvas.getContext('2d');
                this.width = this.canvas.width;
                this.height = this.canvas.height;
                
                // 游戏状态
                this.state = GameState.MENU;
                this.score = 0;
                this.highScore = localStorage.getItem('stickmanHighScore') || 0;
                
                // 游戏对象
                this.stickman = null;
                this.obstacles = [];
                this.particles = [];
                this.ground = this.height - 50;
                
                // 游戏参数
                this.gameSpeed = 5;
                this.obstacleTimer = 0;
                this.obstacleInterval = 100;
                
                // 初始化
                this.init();
            }
            
            init() {
                // 创建火柴人
                this.stickman = new Stickman(100, this.ground);
                
                // 更新最高分显示
                document.getElementById('highScore').textContent = this.highScore;
                
                // 绑定事件
                this.bindEvents();
                
                // 开始游戏循环
                this.gameLoop();
            }
            
            bindEvents() {
                // 键盘事件
                document.addEventListener('keydown', (e) => {
                    if (this.state === GameState.PLAYING) {
                        if (e.key === ' ' || e.key === 'ArrowUp') {
                            this.stickman.jump();
                        }
                    }
                });
                
                // 触摸/点击事件（移动设备支持）
                this.canvas.addEventListener('touchstart', (e) => {
                    e.preventDefault();
                    if (this.state === GameState.PLAYING) {
                        this.stickman.jump();
                    }
                });
                
                this.canvas.addEventListener('click', () => {
                    if (this.state === GameState.PLAYING) {
                        this.stickman.jump();
                    } else if (this.state === GameState.MENU) {
                        this.startGame();
                    } else if (this.state === GameState.GAME_OVER) {
                        this.restartGame();
                    }
                });
                
                // 重新开始按钮
                document.getElementById('restartBtn').addEventListener('click', () => {
                    this.restartGame();
                });
            }
            
            startGame() {
                this.state = GameState.PLAYING;
                this.score = 0;
                this.obstacles = [];
                this.particles = [];
                this.gameSpeed = 5;
                this.stickman.reset();
                document.getElementById('gameOver').style.display = 'none';
            }
            
            restartGame() {
                this.startGame();
            }
            
            gameOver() {
                this.state = GameState.GAME_OVER;
                
                // 更新最高分
                if (this.score > this.highScore) {
                    this.highScore = this.score;
                    localStorage.setItem('stickmanHighScore', this.highScore);
                    document.getElementById('highScore').textContent = this.highScore;
                }
                
                // 显示游戏结束界面
                document.getElementById('finalScore').textContent = this.score;
                document.getElementById('gameOver').style.display = 'block';
            }
            
            update() {
                if (this.state !== GameState.PLAYING) return;
                
                // 更新火柴人
                this.stickman.update();
                
                // 检查火柴人是否落地
                if (this.stickman.y >= this.ground) {
                    this.stickman.y = this.ground;
                    this.stickman.jumping = false;
                    this.stickman.velocity = 0;
                }
                
                // 生成障碍物
                this.obstacleTimer++;
                if (this.obstacleTimer >= this.obstacleInterval) {
                    this.obstacles.push(new Obstacle(this.width, this.ground));
                    this.obstacleTimer = 0;
                    
                    // 随着分数增加，提高难度
                    if (this.score > 0 && this.score % 100 === 0) {
                        this.gameSpeed += 0.5;
                        this.obstacleInterval = Math.max(50, this.obstacleInterval - 5);
                    }
                }
                
                // 更新障碍物
                for (let i = this.obstacles.length - 1; i >= 0; i--) {
                    this.obstacles[i].update(this.gameSpeed);
                    
                    // 移除屏幕外的障碍物
                    if (this.obstacles[i].x + this.obstacles[i].width < 0) {
                        this.obstacles.splice(i, 1);
                        this.score += 10;
                        document.getElementById('score').textContent = this.score;
                    }
                    
                    // 碰撞检测
                    if (this.checkCollision(this.stickman, this.obstacles[i])) {
                        this.gameOver();
                    }
                }
                
                // 更新粒子效果
                for (let i = this.particles.length - 1; i >= 0; i--) {
                    this.particles[i].update();
                    
                    // 移除消失的粒子
                    if (this.particles[i].alpha <= 0) {
                        this.particles.splice(i, 1);
                    }
                }
            }
            
            checkCollision(stickman, obstacle) {
                // 简单的矩形碰撞检测
                return stickman.x < obstacle.x + obstacle.width &&
                       stickman.x + stickman.width > obstacle.x &&
                       stickman.y < obstacle.y + obstacle.height &&
                       stickman.y + stickman.height > obstacle.y;
            }
            
            render() {
                // 清空画布
                this.ctx.clearRect(0, 0, this.width, this.height);
                
                // 绘制背景
                this.drawBackground();
                
                // 绘制地面
                this.drawGround();
                
                if (this.state === GameState.MENU) {
                    this.drawMenu();
                } else if (this.state === GameState.PLAYING) {
                    // 绘制火柴人
                    this.stickman.draw(this.ctx);
                    
                    // 绘制障碍物
                    this.obstacles.forEach(obstacle => obstacle.draw(this.ctx));
                    
                    // 绘制粒子效果
                    this.particles.forEach(particle => particle.draw(this.ctx));
                } else if (this.state === GameState.GAME_OVER) {
                    // 绘制游戏结束画面
                    this.obstacles.forEach(obstacle => obstacle.draw(this.ctx));
                    this.stickman.draw(this.ctx);
                    this.drawGameOver();
                }
            }
            
            drawBackground() {
                // 绘制天空渐变
                const gradient = this.ctx.createLinearGradient(0, 0, 0, this.height);
                gradient.addColorStop(0, '#87CEEB');
                gradient.addColorStop(1, '#E0F7FA');
                this.ctx.fillStyle = gradient;
                this.ctx.fillRect(0, 0, this.width, this.height);
                
                // 绘制云朵
                this.drawClouds();
            }
            
            drawClouds() {
                this.ctx.fillStyle = 'rgba(255, 255, 255, 0.8)';
                
                // 静态云朵（简单示例）
                this.drawCloud(100, 50, 40);
                this.drawCloud(300, 80, 50);
                this.drawCloud(500, 40, 35);
                this.drawCloud(700, 70, 45);
            }
            
            drawCloud(x, y, size) {
                this.ctx.beginPath();
                this.ctx.arc(x, y, size, 0, Math.PI * 2);
                this.ctx.arc(x + size, y, size * 0.8, 0, Math.PI * 2);
                this.ctx.arc(x - size * 0.8, y, size * 0.7, 0, Math.PI * 2);
                this.ctx.fill();
            }
            
            drawGround() {
                // 绘制地面
                this.ctx.fillStyle = '#8BC34A';
                this.ctx.fillRect(0, this.ground, this.width, this.height - this.ground);
                
                // 绘制地面线条
                this.ctx.strokeStyle = '#689F38';
                this.ctx.lineWidth = 2;
                this.ctx.beginPath();
                this.ctx.moveTo(0, this.ground);
                this.ctx.lineTo(this.width, this.ground);
                this.ctx.stroke();
            }
            
            drawMenu() {
                this.ctx.fillStyle = 'rgba(0, 0, 0, 0.5)';
                this.ctx.fillRect(0, 0, this.width, this.height);
                
                this.ctx.fillStyle = 'white';
                this.ctx.font = '36px Arial';
                this.ctx.textAlign = 'center';
                this.ctx.fillText('火柴人跑酷', this.width / 2, this.height / 2 - 40);
                
                this.ctx.font = '20px Arial';
                this.ctx.fillText('点击开始游戏', this.width / 2, this.height / 2 + 20);
                
                this.ctx.font = '16px Arial';
                this.ctx.fillText('使用空格键或上箭头跳跃', this.width / 2, this.height / 2 + 60);
            }
            
            drawGameOver() {
                // 半透明遮罩
                this.ctx.fillStyle = 'rgba(0, 0, 0, 0.5)';
                this.ctx.fillRect(0, 0, this.width, this.height);
            }
            
            gameLoop() {
                this.update();
                this.render();
                requestAnimationFrame(() => this.gameLoop());
            }
        }
        
        // 火柴人类
        class Stickman {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                this.width = 30;
                this.height = 60;
                this.velocity = 0;
                this.jumping = false;
                this.jumpPower = 15;
                this.gravity = 0.8;
                this.animFrame = 0;
                this.animSpeed = 0.2;
            }
            
            jump() {
                if (!this.jumping) {
                    this.jumping = true;
                    this.velocity = -this.jumpPower;
                }
            }
            
            update() {
                // 更新跳跃状态
                if (this.jumping) {
                    this.y += this.velocity;
                    this.velocity += this.gravity;
                }
                
                // 更新动画帧
                this.animFrame += this.animSpeed;
                if (this.animFrame >= 4) {
                    this.animFrame = 0;
                }
            }
            
            draw(ctx) {
                ctx.save();
                ctx.translate(this.x + this.width / 2, this.y + this.height / 2);
                
                // 绘制火柴人身体
                ctx.strokeStyle = '#333';
                ctx.lineWidth = 2;
                ctx.lineCap = 'round';
                
                // 头部
                ctx.beginPath();
                ctx.arc(0, -this.height / 2 + 10, 8, 0, Math.PI * 2);
                ctx.stroke();
                
                // 身体
                ctx.beginPath();
                ctx.moveTo(0, -this.height / 2 + 18);
                ctx.lineTo(0, -this.height / 2 + 40);
                ctx.stroke();
                
                // 手臂
                const armAngle = Math.sin(this.animFrame) * 0.5;
                ctx.beginPath();
                ctx.moveTo(0, -this.height / 2 + 25);
                ctx.lineTo(-10, -this.height / 2 + 30 + Math.sin(armAngle + Math.PI) * 5);
                ctx.moveTo(0, -this.height / 2 + 25);
                ctx.lineTo(10, -this.height / 2 + 30 + Math.sin(armAngle) * 5);
                ctx.stroke();
                
                // 腿部
                const legAngle = Math.sin(this.animFrame + Math.PI) * 0.5;
                ctx.beginPath();
                ctx.moveTo(0, -this.height / 2 + 40);
                ctx.lineTo(-8, -this.height / 2 + 55 + Math.sin(legAngle) * 5);
                ctx.moveTo(0, -this.height / 2 + 40);
                ctx.lineTo(8, -this.height / 2 + 55 + Math.sin(legAngle + Math.PI) * 5);
                ctx.stroke();
                
                ctx.restore();
            }
            
            reset() {
                this.y = this.y;
                this.velocity = 0;
                this.jumping = false;
                this.animFrame = 0;
            }
        }
        
        // 障碍物类
        class Obstacle {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                this.width = 20;
                this.height = 40;
                this.color = '#E53935';
            }
            
            update(speed) {
                this.x -= speed;
            }
            
            draw(ctx) {
                // 绘制障碍物（简单的矩形）
                ctx.fillStyle = this.color;
                ctx.fillRect(this.x, this.y - this.height, this.width, this.height);
                
                // 添加一些细节
                ctx.fillStyle = '#C62828';
                ctx.fillRect(this.x + 2, this.y - this.height + 2, this.width - 4, 5);
            }
        }
        
        // 粒子效果类
        class Particle {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                this.size = Math.random() * 3 + 1;
                this.speedX = Math.random() * 3 - 1.5;
                this.speedY = Math.random() * 3 - 1.5;
                this.alpha = 1;
                this.decay = Math.random() * 0.02 + 0.01;
            }
            
            update() {
                this.x += this.speedX;
                this.y += this.speedY;
                this.alpha -= this.decay;
            }
            
            draw(ctx) {
                ctx.save();
                ctx.globalAlpha = this.alpha;
                ctx.fillStyle = '#FFD700';
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }
        }
        
        // 初始化游戏
        window.addEventListener('DOMContentLoaded', () => {
            const game = new StickmanRunnerGame('gameCanvas');
        });
    </script>
</body>
</html>
