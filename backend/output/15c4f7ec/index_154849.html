<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>1942 Clone Game</title>
<style>
  body {
    margin: 0;
    overflow: hidden;
  }
  canvas {
    display: block;
  }
</style>
</head>
<body>
<canvas id="gameCanvas"></canvas>
<script>
// Game Constants
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const width = canvas.width = window.innerWidth;
const height = canvas.height = window.innerHeight;
const playerWidth = 100;
const playerHeight = 50;
const playerSpeed = 5;
const bulletSpeed = 10;
const enemySpeed = 2;
const enemySpawnRate = 1000; // in milliseconds
let player = {
  x: (width - playerWidth) / 2,
  y: height - playerHeight,
  width: playerWidth,
  height: playerHeight,
  speed: playerSpeed,
  bullets: []
};
let enemies = [];
let score = 0;
let lives = 3;

// Player Class
class Player {
  constructor(x, y, width, height, speed) {
    this.x = x;
    this.y = y;
    this.width = width;
    this.height = height;
    this.speed = speed;
  }

  draw() {
    ctx.fillStyle = 'white';
    ctx.fillRect(this.x, this.y, this.width, this.height);
  }

  move() {
    if (key.isPressed('ArrowLeft') && this.x > 0) {
      this.x -= this.speed;
    }
    if (key.isPressed('ArrowRight') && this.x < width - this.width) {
      this.x += this.speed;
    }
    if (key.isPressed('ArrowUp') && this.y > 0) {
      this.y -= this.speed;
    }
    if (key.isPressed('ArrowDown') && this.y < height - this.height) {
      this.y += this.speed;
    }
  }

  shoot() {
    player.bullets.push({
      x: this.x + this.width / 2,
      y: this.y,
      width: 5,
      height: 10,
      speed: bulletSpeed
    });
  }
}

// Bullet Class
class Bullet {
  constructor(x, y, width, height, speed) {
    this.x = x;
    this.y = y;
    this.width = width;
    this.height = height;
    this.speed = speed;
  }

  draw() {
    ctx.fillStyle = 'blue';
    ctx.fillRect(this.x, this.y, this.width, this.height);
  }

  move() {
    this.y -= this.speed;
  }
}

// Enemy Class
class Enemy {
  constructor(x, y, width, height, speed) {
    this.x = x;
    this.y = y;
    this.width = width;
    this.height = height;
    this.speed = speed;
  }

  draw() {
    ctx.fillStyle = 'red';
    ctx.fillRect(this.x, this.y, this.width, this.height);
  }

  move() {
    this.y += this.speed;
  }
}

// Key Press Handling
const key = {
  isPressed: function(keyCode) {
    return keys[keyCode] === true;
  }
};

let keys = {};
window.addEventListener('keydown', function(event) {
  keys[event.keyCode] = true;
});
window.addEventListener('keyup', function(event) {
  keys[event.keyCode] = false;
});

// Game Loop
function gameLoop() {
  ctx.clearRect(0, 0, width, height);
  player.draw();
  player.move();

  // Handle player bullets
  for (let i = player.bullets.length - 1; i >= 0; i--) {
    let bullet = player.bullets[i];
    bullet.move();
    bullet.draw();

    // Remove bullet if it goes off screen
    if (bullet.y < 0) {
      player.bullets.splice(i, 1);
    }
  }

  // Handle enemy spawning
  if (new Date().getTime() - lastEnemySpawnTime > enemySpawnRate) {
    let enemy = new Enemy(
      Math.random() * (width - enemyWidth),
      -enemyHeight,
      enemyWidth,
      enemyHeight,
      enemySpeed
    );
    enemies.push(enemy);
    lastEnemySpawnTime = new Date().getTime();
  }

  // Handle enemy movement
  for (let i = enemies.length - 1; i >= 0; i--) {
    let enemy = enemies[i];
    enemy.move();
    enemy.draw();

    // Remove enemy if it goes off screen
    if (enemy.y > height) {
      enemies.splice(i, 1);
      lives--;
    }

    // Check for collision with player bullets
    for (let j = player.bullets.length - 1; j >= 0; j--) {
      let bullet = player.bullets[j];
      if (bullet.x > enemy.x && bullet.x < enemy.x + enemy.width &&
          bullet.y > enemy.y && bullet.y < enemy.y + enemy.height) {
        score += 10; // Increase score for each enemy destroyed
        player.bullets.splice(j, 1);
        enemies.splice(i, 1);
      }
    }
  }

  // Display score and lives
  ctx.fillStyle = 'black';
  ctx.fillText('Score: ' + score, 10, 20);
  ctx.fillText('Lives: ' + lives, width - 100, 20);

  // Game over if no lives remaining
  if (lives <= 0) {
    ctx.fillStyle = 'white';
    ctx.fillText('Game Over', width / 2 - 50, height / 2);
  }

  requestAnimationFrame(gameLoop);
}

// Initialize game variables
let lastEnemySpawnTime = new Date().getTime();

// Start the game loop
window.onload = gameLoop;
</script>
</body>
</html>
