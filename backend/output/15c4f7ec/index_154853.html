<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>1942 Clone Game</title>
<style>
  body {
    margin: 0;
    overflow: hidden;
  }
  canvas {
    display: block;
  }
  #score {
    position: absolute;
    top: 10px;
    left: 10px;
    color: white;
    font-size: 20px;
  }
  #lives {
    position: absolute;
    top: 10px;
    right: 10px;
    color: white;
    font-size: 20px;
  }
</style>
</head>
<body>
<canvas id="gameCanvas"></canvas>
<div id="score">Score: 0</div>
<div id="lives">Lives: 3</div>
<audio id="shootSound" src="shoot.mp3"></audio>
<audio id="explosionSound" src="explosion.mp3"></audio>
<script>
// Game Constants
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const width = canvas.width = window.innerWidth;
const height = canvas.height = window.innerHeight;
const playerWidth = 100;
const playerHeight = 50;
const playerSpeed = 5;
const bulletSpeed = 10;
const enemySpeed = 2;
const enemySpawnRate = 1000; // in milliseconds
let player = {
  x: (width - playerWidth) / 2,
  y: height - playerHeight,
  width: playerWidth,
  height: playerHeight,
  speed: playerSpeed,
  bullets: []
};
let enemies = [];
let score = 0;
let lives = 3;

// Player Class
class Player {
  constructor(x, y, width, height, speed) {
    this.x = x;
    this.y = y;
    this.width = width;
    this.height = height;
    this.speed = speed;
  }

  draw() {
    ctx.fillStyle = 'white';
    ctx.fillRect(this.x, this.y, this.width, this.height);
  }

  move() {
    if (key.isPressed('ArrowLeft') && this.x > 0) {
      this.x -= this.speed;
    }
    if (key.isPressed('ArrowRight') && this.x < width - this.width) {
      this.x += this.speed;
    }
    if (key.isPressed('ArrowUp') && this.y > 0) {
      this.y -= this.speed;
    }
    if (key.isPressed('ArrowDown') && this.y < height - this.height) {
      this.y += this.speed;
    }
  }

  shoot() {
    player.bullets.push({
      x: this.x + this.width / 2,
      y: this.y,
      width: 5,
      height: 10,
      speed: bulletSpeed
    });
    document.getElementById('shootSound').play();
  }
}

// Bullet Class
class Bullet {
  constructor(x, y, width, height, speed) {
    this.x = x;
    this.y = y;
    this.width = width;
    this.height = height;
    this.speed = speed;
  }

  draw() {
    ctx.fillStyle = 'blue';
    ctx.fillRect(this.x, this.y, this.width, this.height);
  }

  move() {
    this.y -= this.speed;
  }
}

// Enemy Class
class Enemy {
  constructor(x, y, width, height, speed) {
    this.x = x;
    this.y = y;
    this.width = width;
    this.height = height;
    this.speed = speed;
  }

  draw() {
    ctx.fillStyle = 'red';
    ctx.fillRect(this.x, this.y, this.width, this.height);
  }

  move() {
    this.y += this.speed;
  }
}

// Key Press Handling
const key = {
  isPressed: function(keyCode) {
    return keys[keyCode] === true;
  }
};

let keys = {};
window.addEventListener('keydown', function(event) {
  keys[event.keyCode] = true;
});
window.addEventListener('keyup', function(event) {
  keys[event.keyCode] = false;
});

// Game Loop
function gameLoop() {
  ctx.clearRect(0, 0, width, height);
  player.draw();
  player.move();

  // Handle player bullets
  for (let i = player.bullets.length - 1; i >= 0; i--) {
    let bullet = player.bullets[i];
    bullet.move();
    bullet.draw();

    if (bullet.y < 0) {
      player.bullets.splice(i, 1);
    }
  }

  // Spawn enemies
  if (new Date().getTime() - lastEnemyTime >= enemySpawnRate) {
    let enemy = new Enemy(
      Math.random() * (width - 50),
      0,
      50,
      30,
      enemySpeed
    );
    enemies.push(enemy);
    lastEnemyTime = new Date().getTime();
  }

  // Handle enemies
  for (let i = enemies.length - 1; i >= 0; i--) {
    let enemy = enemies[i];
    enemy.move();
    enemy.draw();

    // Check for collision with player
    if (player.x < enemy.x + enemy.width &&
        player.x + player.width > enemy.x &&
        player.y < enemy.y + enemy.height &&
        player.y + player.height > enemy.y) {
      playerHit();
    }

    // Check for collision with bullets
    for (let j = player.bullets.length - 1; j >= 0; j--) {
      let bullet = player.bullets[j];
      if (bullet.x < enemy.x + enemy.width &&
          bullet.x + bullet.width > enemy.x &&
          bullet.y < enemy.y + enemy.height &&
          bullet.y + bullet.height > enemy.y) {
        enemyHit(bullet);
      }
    }

    if (enemy.y > height) {
      enemies.splice(i, 1);
      playerHit();
    }
  }

  // Update score and lives
  document.getElementById('score').textContent = `Score: ${score}`;
  document.getElementById('lives').textContent = `Lives: ${lives}`;

  if (lives <= 0) {
    gameOver();
  }

  requestAnimationFrame(gameLoop);
}

let lastEnemyTime = new Date().getTime();

function playerHit() {
  lives--;
  enemies = [];
  player.bullets = [];
  player.x = (width - playerWidth) / 2;
  player.y = height - playerHeight;
}

function enemyHit(bullet) {
  score += 10;
  enemies.splice(enemies.indexOf(bullet.enemy), 1);
  player.bullets.splice(player.bullets.indexOf(bullet), 1);
  document.getElementById('explosionSound').play();
}

function gameOver() {
  alert('Game Over');
  cancelAnimationFrame(gameLoop);
}

window.onload = gameLoop;
</script>
</body>
</html>
