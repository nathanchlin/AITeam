<!-- 在body中添加游戏说明区域 -->
<div class="instructions">
    <h2>游戏控制说明</h2>
    <ul>
        <li>←/→: 左右移动方块</li>
        <li>↑: 旋转方块</li>
        <li>↓: 加速方块下落</li>
        <li>空格键: 直接落到底部</li>
        <li>P: 暂停/继续游戏</li>
        <li>R: 重新开始游戏</li>
    </ul>
    
    <h2>游戏规则</h2>
    <p>1. 方块从顶部不断下落</p>
    <p>2. 玩家可以控制方块的移动和旋转</p>
    <p>3. 当一行被完全填满时，该行会被消除并得分</p>
    <p>4. 当方块堆到顶部时，游戏结束</p>
    <p>5. 每消除一定行数，游戏速度会增加</p>
    
    <h2>得分规则</h2>
    <ul>
        <li>消除1行: 100分</li>
        <li>消除2行: 300分</li>
        <li>消除3行: 500分</li>
        <li>消除4行: 800分</li>
    </ul>
    
    <button id="hideInstructions">隐藏说明</button>
</div>
