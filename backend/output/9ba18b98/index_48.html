<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>俄罗斯方块</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="game-container">
        <div class="game-info">
            <h1>俄罗斯方块</h1>
            <div class="score-container">
                <div>得分: <span id="score">0</span></div>
                <div>等级: <span id="level">1</span></div>
                <div>行数: <span id="lines">0</span></div>
                <div>最高分: <span id="highScore">0</span></div>
            </div>
            <div class="controls">
                <button id="startBtn">开始游戏</button>
                <button id="pauseBtn">暂停</button>
                <button id="resetBtn">重置</button>
            </div>
            <div class="instructions">
                <h3>操作说明</h3>
                <p>← → : 左右移动</p>
                <p>↑ : 旋转方块</p>
                <p>↓ : 加速下落</p>
                <p>空格 : 直接落下</p>
            </div>
        </div>
        <div class="game-board">
            <canvas id="gameCanvas"></canvas>
        </div>
        <div class="next-piece">
            <h3>下一个方块</h3>
            <canvas id="nextCanvas"></canvas>
        </div>
    </div>
    
    <div class="touch-controls">
        <button id="leftBtn">左</button>
        <button id="rotateBtn">旋转</button>
        <button id="rightBtn">右</button>
        <button id="downBtn">下</button>
    </div>

    <script src="script.js"></script>
</body>
</html>
