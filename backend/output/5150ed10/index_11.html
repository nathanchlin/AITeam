<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>男人就要撑过100秒</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #111;
            font-family: Arial, sans-serif;
            overflow: hidden;
        }
        
        #gameContainer {
            position: relative;
            width: 800px;
            height: 600px;
            border: 2px solid #fff;
            box-shadow: 0 0 20px rgba(0, 255, 255, 0.5);
        }
        
        #gameCanvas {
            background-color: #000;
            display: block;
        }
        
        #gameInfo {
            position: absolute;
            top: 10px;
            left: 10px;
            color: #fff;
            font-size: 18px;
            text-shadow: 1px 1px 3px rgba(0, 0, 0, 0.8);
        }
        
        #gameOver {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background-color: rgba(0, 0, 0, 0.8);
            color: #fff;
            padding: 30px;
            border-radius: 10px;
            text-align: center;
            display: none;
        }
        
        #gameOver h2 {
            margin-top: 0;
            color: #ff6b6b;
        }
        
        #restartBtn {
            margin-top: 15px;
            padding: 10px 20px;
            background-color: #4ecdc4;
            color: #fff;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            transition: background-color 0.3s;
        }
        
        #restartBtn:hover {
            background-color: #45b7b8;
        }
        
        #startScreen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.9);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: #fff;
            z-index: 10;
        }
        
        #startScreen h1 {
            margin-bottom: 20px;
            color: #4ecdc4;
            text-shadow: 0 0 10px rgba(78, 205, 196, 0.7);
        }
        
        #startBtn {
            padding: 15px 30px;
            background-color: #ff6b6b;
            color: #fff;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 20px;
            transition: background-color 0.3s;
        }
        
        #startBtn:hover {
            background-color: #ff5252;
        }
        
        #instructions {
            margin-top: 30px;
            text-align: center;
            line-height: 1.6;
        }
    </style>
</head>
<body>
    <div id="gameContainer">
        <canvas id="gameCanvas" width="800" height="600"></canvas>
        <div id="gameInfo">
            <div>时间: <span id="timeDisplay">0</span>秒</div>
            <div>生命: <span id="livesDisplay">3</span></div>
        </div>
        <div id="gameOver">
            <h2>游戏结束!</h2>
            <p>你撑过了 <span id="finalTime">0</span> 秒</p>
            <button id="restartBtn">重新开始</button>
        </div>
        <div id="startScreen">
            <h1>男人就要撑过100秒</h1>
            <button id="startBtn">开始游戏</button>
            <div id="instructions">
                <p>使用方向键或WASD控制飞机移动</p>
                <p>躲避敌人和障碍物，尽可能撑过100秒!</p>
            </div>
        </div>
    </div>

    <script>
        // 游戏配置
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const gameContainer = document.getElementById('gameContainer');
        const gameOverScreen = document.getElementById('gameOver');
        const startScreen = document.getElementById('startScreen');
        const timeDisplay = document.getElementById('timeDisplay');
        const livesDisplay = document.getElementById('livesDisplay');
        const finalTimeDisplay = document.getElementById('finalTime');
        const startBtn = document.getElementById('startBtn');
        const restartBtn = document.getElementById('restartBtn');
        
        // 游戏状态
        let gameRunning = false;
        let gameTime = 0;
        let lastTime = 0;
        let animationId = null;
        
        // 玩家飞机
        const player = {
            x: canvas.width / 2,
            y: canvas.height - 100,
            width: 40,
            height: 40,
            speed: 5,
            color: '#4ecdc4',
            lives: 3,
            invulnerable: false,
            invulnerableTime: 0
        };
        
        // 敌人数组
        let enemies = [];
        
        // 粒子效果数组
        let particles = [];
        
        // 键盘状态
        const keys = {};
        
        // 键盘事件监听
        window.addEventListener('keydown', (e) => {
            keys[e.key] = true;
        });
        
        window.addEventListener('keyup', (e) => {
            keys[e.key] = false;
        });
        
        // 开始游戏按钮
        startBtn.addEventListener('click', startGame);
        
        // 重新开始按钮
        restartBtn.addEventListener('click', () => {
            gameOverScreen.style.display = 'none';
            startGame();
        });
        
        // 初始化游戏
        function init() {
            player.x = canvas.width / 2;
            player.y = canvas.height - 100;
            player.lives = 3;
            player.invulnerable = false;
            player.invulnerableTime = 0;
            
            enemies = [];
            particles = [];
            gameTime = 0;
            
            timeDisplay.textContent = '0';
            livesDisplay.textContent = player.lives;
            
            // 创建初始敌人
            for (let i = 0; i < 3; i++) {
                createEnemy();
            }
        }
        
        // 开始游戏
        function startGame() {
            startScreen.style.display = 'none';
            gameOverScreen.style.display = 'none';
            gameRunning = true;
            init();
            lastTime = performance.now();
            gameLoop(lastTime);
        }
        
        // 创建敌人
        function createEnemy() {
            const enemy = {
                x: Math.random() * (canvas.width - 30),
                y: -30,
                width: 30,
                height: 30,
                speed: 2 + Math.random() * 3,
                color: '#ff6b6b',
                type: Math.random() > 0.8 ? 'special' : 'normal'
            };
            
            if (enemy.type === 'special') {
                enemy.width = 40;
                enemy.height = 40;
                enemy.speed *= 0.7;
                enemy.color = '#ff9f40';
            }
            
            enemies.push(enemy);
        }
        
        // 创建粒子效果
        function createParticles(x, y, color, count = 10) {
            for (let i = 0; i < count; i++) {
                particles.push({
                    x: x,
                    y: y,
                    vx: (Math.random() - 0.5) * 8,
                    vy: (Math.random() - 0.5) * 8,
                    radius: Math.random() * 3 + 1,
                    color: color,
                    alpha: 1,
                    life: 1
                });
            }
        }
        
        // 更新玩家位置
        function updatePlayer() {
            // 左右移动
            if ((keys['ArrowLeft'] || keys['a'] || keys['A']) && player.x > 0) {
                player.x -= player.speed;
            }
            if ((keys['ArrowRight'] || keys['d'] || keys['D']) && player.x < canvas.width - player.width) {
                player.x += player.speed;
            }
            
            // 上下移动
            if ((keys['ArrowUp'] || keys['w'] || keys['W']) && player.y > 0) {
                player.y -= player.speed;
            }
            if ((keys['ArrowDown'] || keys['s'] || keys['S']) && player.y < canvas.height - player.height) {
                player.y += player.speed;
            }
            
            // 更新无敌时间
            if (player.invulnerable) {
                player.invulnerableTime--;
                if (player.invulnerableTime <= 0) {
                    player.invulnerable = false;
                }
            }
        }
        
        // 更新敌人
        function updateEnemies() {
            for (let i = enemies.length - 1; i >= 0; i--) {
                const enemy = enemies[i];
                enemy.y += enemy.speed;
                
                // 移除超出屏幕的敌人
                if (enemy.y > canvas.height) {
                    enemies.splice(i, 1);
                    continue;
                }
                
                // 检测碰撞
                if (!player.invulnerable && checkCollision(player, enemy)) {
                    // 玩家被击中
                    player.lives--;
                    livesDisplay.textContent = player.lives;
                    
                    // 创建爆炸效果
                    createParticles(player.x + player.width / 2, player.y + player.height / 2, '#ff6b6b', 20);
                    
                    // 设置无敌状态
                    player.invulnerable = true;
                    player.invulnerableTime = 120; // 2秒无敌时间
                    
                    // 移除敌人
                    enemies.splice(i, 1);
                    
                    // 检查游戏结束
                    if (player.lives <= 0) {
                        endGame();
                    }
                }
            }
            
            // 根据游戏时间增加敌人数量
            const enemySpawnRate = Math.max(30, 100 - Math.floor(gameTime / 10));
            if (Math.random() < 1 / enemySpawnRate) {
                createEnemy();
            }
        }
        
        // 更新粒子
        function updateParticles() {
            for (let i = particles.length - 1; i >= 0; i--) {
                const particle = particles[i];
                particle.x += particle.vx;
                particle.y += particle.vy;
                particle.life -= 0.02;
                particle.alpha = particle.life;
                
                if (particle.life <= 0) {
                    particles.splice(i, 1);
                }
            }
        }
        
        // 碰撞检测
        function checkCollision(rect1, rect2) {
            return rect1.x < rect2.x + rect2.width &&
                   rect1.x + rect1.width > rect2.x &&
                   rect1.y < rect2.y + rect2.height &&
                   rect1.y + rect1.height > rect2.y;
        }
        
        // 绘制玩家
        function drawPlayer() {
            ctx.save();
            
            // 无敌状态闪烁效果
            if (player.invulnerable && Math.floor(player.invulnerableTime / 5) % 2 === 0) {
                ctx.globalAlpha = 0.5;
            }
            
            // 绘制飞机主体
            ctx.fillStyle = player.color;
            ctx.beginPath();
            ctx.moveTo(player.x + player.width / 2, player.y);
            ctx.lineTo(player.x, player.y + player.height);
            ctx.lineTo(player.x + player.width / 2, player.y + player.height - 10);
            ctx.lineTo(player.x + player.width, player.y + player.height);
            ctx.closePath();
            ctx.fill();
            
            // 绘制飞机细节
            ctx.fillStyle = '#fff';
            ctx.beginPath();
            ctx.arc(player.x + player.width / 2, player.y + player.height / 2, 5, 0, Math.PI * 2);
            ctx.fill();
            
            ctx.restore();
        }
        
        // 绘制敌人
        function drawEnemies() {
            enemies.forEach(enemy => {
                ctx.fillStyle = enemy.color;
                
                if (enemy.type === 'special') {
                    // 特殊敌人 - 菱形
                    ctx.beginPath();
                    ctx.moveTo(enemy.x + enemy.width / 2, enemy.y);
                    ctx.lineTo(enemy.x, enemy.y + enemy.height / 2);
                    ctx.lineTo(enemy.x + enemy.width / 2, enemy.y + enemy.height);
                    ctx.lineTo(enemy.x + enemy.width, enemy.y + enemy.height / 2);
                    ctx.closePath();
                    ctx.fill();
                    
                    // 特殊敌人发光效果
                    ctx.strokeStyle = enemy.color;
                    ctx.lineWidth = 2;
                    ctx.stroke();
                } else {
                    // 普通敌人 - 三角形
                    ctx.beginPath();
                    ctx.moveTo(enemy.x + enemy.width / 2, enemy.y + enemy.height);
                    ctx.lineTo(enemy.x, enemy.y);
                    ctx.lineTo(enemy.x + enemy.width, enemy.y);
                    ctx.closePath();
                    ctx.fill();
                }
            });
        }
        
        // 绘制粒子
        function drawParticles() {
            particles.forEach(particle => {
                ctx.save();
                ctx.globalAlpha = particle.alpha;
                ctx.fillStyle = particle.color;
                ctx.beginPath();
                ctx.arc(particle.x, particle.y, particle.radius, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            });
        }
        
        // 绘制背景
        function drawBackground() {
            // 渐变背景
            const gradient = ctx.createLinearGradient(0, 0, 0, canvas.height);
            gradient.addColorStop(0, '#0a0a2a');
            gradient.addColorStop(1, '#000');
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            // 星星效果
            ctx.fillStyle = '#fff';
            for (let i = 0; i < 50; i++) {
                const x = (i * 17 + gameTime * 0.1) % canvas.width;
                const y = (i * 13) % canvas.height;
                const size = (i % 3) + 1;
                ctx.beginPath();
                ctx.arc(x, y, size * 0.5, 0, Math.PI * 2);
                ctx.fill();
            }
        }
        
        // 游戏主循环
        function gameLoop(currentTime) {
            if (!gameRunning) return;
            
            // 计算时间增量
            const deltaTime = currentTime - lastTime;
            lastTime = currentTime;
            
            // 更新游戏时间
            gameTime += deltaTime / 1000;
            timeDisplay.textContent = Math.floor(gameTime);
            
            // 检查胜利条件
            if (gameTime >= 100) {
                endGame(true);
                return;
            }
            
            // 清空画布
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // 绘制背景
            drawBackground();
            
            // 更新游戏对象
            updatePlayer();
            updateEnemies();
            updateParticles();
            
            // 绘制游戏对象
            drawPlayer();
            drawEnemies();
            drawParticles();
            
            // 继续游戏循环
            animationId = requestAnimationFrame(gameLoop);
        }
        
        // 结束游戏
        function endGame(isWin = false) {
            gameRunning = false;
            cancelAnimationFrame(animationId);
            
            // 显示游戏结束画面
            finalTimeDisplay.textContent = Math.floor(gameTime);
            
            if (isWin) {
                gameOverScreen.querySelector('h2').textContent = '恭喜你赢了!';
                gameOverScreen.querySelector('h2').style.color = '#4ecdc4';
            } else {
                gameOverScreen.querySelector('h2').textContent = '游戏结束!';
                gameOverScreen.querySelector('h2').style.color = '#ff6b6b';
            }
            
            gameOverScreen.style.display = 'block';
            
            // 创建庆祝效果
            if (isWin) {
                for (let i = 0; i < 50; i++) {
                    setTimeout(() => {
                        createParticles(
                            Math.random() * canvas.width,
                            Math.random() * canvas.height,
                            ['#4ecdc4', '#ff6b6b', '#ff9f40', '#ffd166'][Math.floor(Math.random() * 4)],
                            5
                        );
                    }, i * 50);
                }
            }
        }
        
        // 初始化游戏但不开始
        window.onload = () => {
            init();
        };
    </script>
</body>
</html>
