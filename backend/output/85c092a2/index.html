<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>躲避弹幕游戏</title>
<style>
  body { margin: 0; overflow: hidden; }
  canvas { display: block; }
  #scoreboard { position: absolute; top: 10px; left: 10px; color: white; font-size: 20px; }
  #gameOver { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); color: white; font-size: 30px; display: none; }
  #player1, #player2 { position: absolute; }
  #player1 { background-color: blue; width: 50px; height: 50px; }
  #player2 { background-color: red; width: 50px; height: 50px; }
  .bullet { position: absolute; border-radius: 50%; background-color: red; }
  #player1:after, #player2:after {
    content: '';
    position: absolute;
    top: 100%;
    left: 50%;
    border: 2px solid white;
    border-top: none;
    border-right: none;
    border-left: none;
    transform: translateX(-50%);
    width: 0;
    height: 0;
    display: none;
  }
  #gameOver:hover:after {
    display: block;
  }
</style>
</head>
<body>
<canvas id="gameCanvas"></canvas>
<div id="scoreboard">Score: 0</div>
<div id="gameOver">Game Over</div>


<script>
// 游戏变量
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const playerSize = 50;
const bulletSize = 5;
const bulletColor = 'red';
let score = 0;
let gameOver = false;
let player1 = { x: canvas.width / 2 - playerSize, y: canvas.height - playerSize, dx: 0, dy: 0 };
let player2 = { x: canvas.width / 2 + playerSize, y: canvas.height - playerSize, dx: 0, dy: 0 };
let bullets = [];

// 存储游戏状态
function saveGameState() {
  const gameState = {
    score: score,
    gameOver: gameOver,
    player1: { x: player1.x, y: player1.y, dx: player1.dx, dy: player1.dy },
    player2: { x: player2.x, y: player2.y, dx: player2.dx, dy: player2.dy },
    bullets: bullets.map(bullet => ({ x: bullet.x, y: bullet.y, dx: bullet.dx, dy: bullet.dy }))
  };
  localStorage.setItem('gameState', JSON.stringify(gameState));
}

// 加载游戏状态
function loadGameState() {
  const savedState = localStorage.getItem('gameState');
  if (savedState) {
    const gameState = JSON.parse(savedState);
    score = gameState.score;
    gameOver = gameState.gameOver;
    player1.x = gameState.player1.x;
    player1.y = gameState.player1.y;
    player1.dx = gameState.player1.dx;
    player1.dy = gameState.player1.dy;
    player2.x = gameState.player2.x;
    player2.y = gameState.player2.y;
    player2.dx = gameState.player2.dx;
    player2.dy = gameState.player2.dy;
    bullets = gameState.bullets.map(bullet => ({ x: bullet.x, y: bullet.y, dx: bullet.dx, dy: bullet.dy }));
    updateScoreboard();
    if (gameOver) {
      document.getElementById('gameOver').style.display = 'block';
    }
  }
}

// 初始化游戏
function init() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
  window.addEventListener('keydown', handleKeyDown);
  canvas.addEventListener('click', shoot);
  requestAnimationFrame(gameLoop);
  updateScoreboard();
  loadGameState();
}

// 绘制玩家
function drawPlayer(player) {
  ctx.fillStyle = player.x < canvas.width / 2 ? 'blue' : 'red';
  ctx.fillRect(player.x, player.y, playerSize, playerSize);
  ctx.fillStyle = 'white';
  ctx.fillText(player.x < canvas.width / 2 ? 'P1' : 'P2', player.x + playerSize / 2, player.y - 10);
}

// 绘制弹幕
function drawBullets() {
  for (let i = 0; i < bullets.length; i++) {
    const bullet = bullets[i];
    ctx.beginPath();
    ctx.arc(bullet.x, bullet.y, bulletSize, 0, Math.PI * 2);
    ctx.fillStyle = bulletColor;
    ctx.fill();
  }
}

// 更新游戏状态
function update() {
  if (gameOver) return;

  // 玩家移动逻辑
  player1.x += player1.dx;
  player1.y += player1.dy;
  player1.x = Math.max(0, Math.min(player1.x, canvas.width - playerSize));
  player1.y = Math.max(0, Math.min(player1.y, canvas.height - playerSize));
  player2.x += player2.dx;
  player2.y += player2.dy;
  player2.x = Math.max(0, Math.min(player2.x, canvas.width - playerSize));
  player2.y = Math.max(0, Math.min(player2.y, canvas.height - playerSize));

  // 弹幕逻辑
  for (let i = 0; i < bullets.length; i++) {
    const bullet = bullets[i];
    bullet.x += bullet.dx;
    if (bullet.x < 0) {
      bullets.splice(i, 1);
      i--;
    }
  }

  // 检测碰撞逻辑
  for (let i = 0; i < bullets.length; i++) {
    const bullet = bullets[i];
    if (player1.x < bullet.x + bulletSize &&
        player1.x + playerSize > bullet.x &&
        player1.y < bullet.y + bulletSize &&
        player1.y + playerSize > bullet.y) {
      player1.x = canvas.width / 2 - playerSize;
      player1.y = canvas.height - playerSize;
      score += 10;
      updateScoreboard();
      bullets.splice(i, 1);
      i--;
    }
    if (player2.x < bullet.x + bulletSize &&
        player2.x + playerSize > bullet.x &&
        player2.y < bullet.y + bulletSize &&
        player2.y + playerSize > bullet.y) {
      player2.x = canvas.width / 2 + playerSize;
      player2.y = canvas.height - playerSize;
      score += 10;
      updateScoreboard();
      bullets.splice(i, 1);
      i--;
    }
  }

  saveGameState();
}

// 游戏循环
function gameLoop() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  update();
  drawPlayer(player1);
  drawPlayer(player2);
  drawBullets();
  requestAnimationFrame(gameLoop);
}

// 处理键盘按键
function handleKeyDown(event) {
  if (gameOver) return;

  const keys = {
    '65': { player: player1, direction: 'left' },
    '87': { player: player1, direction: 'up' },
    '68': { player: player1, direction: 'right' },
    '83': { player: player1, direction: 'down' },
    '74': { player: player2, direction: 'left' },
    '75': { player: player2, direction: 'up' },
    '76': { player: player2, direction: 'right' },
    '82': { player: player2, direction: 'down' }
  };

  const key = event.keyCode;
  const { player, direction } = keys[key] || { player: null, direction: null };

  if (player) {
    switch (direction) {
      case 'left': player.dx = -5; break;
      case 'up': player.dy = -5; break;
      case 'right': player.dx = 5; break;
      case 'down': player.dy = 5; break;
    }
  }
}

// 开火
function shoot(event) {
  if (gameOver) return;

  const player = event.target.id === 'player1' ? player1 : player2;
  bullets.push({
    x: player.x + playerSize / 2,
    y: player.y,
    dx: 0,
    dy: -5
  });
}

// 更新得分板
function updateScoreboard() {
  document.getElementById('scoreboard').innerText = 'Score: ' + score;
}

// 重新开始游戏
function restartGame() {
  gameOver = false;
  player1.x = canvas.width / 2 - playerSize;
  player1.y = canvas.height - playerSize;
  player1.dx = 0;
  player1.dy = 0;
  player2.x = canvas.width / 2 + playerSize;
  player2.y = canvas.height - playerSize;
  player2.dx = 0;
  player2.dy = 0;
  bullets = [];
  score = 0;
  updateScoreboard();
  document.getElementById('gameOver').style.display = 'none';
}

// 监听重新开始游戏事件
document.getElementById('gameOver').addEventListener('click', restartGame);

// 加载游戏
window.onload = init;
</script>
</body>
</html>
