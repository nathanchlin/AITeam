<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>贪吃蛇游戏</title>
    <style>
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            background-color: #f0f0f0;
            font-family: Arial, sans-serif;
        }
        
        #game-container {
            position: relative;
            background-color: #333;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
        }
        
        #game-board {
            display: grid;
            grid-template-columns: repeat(20, 20px);
            grid-template-rows: repeat(20, 20px);
            gap: 1px;
            background-color: #222;
            padding: 10px;
        }
        
        .cell {
            width: 20px;
            height: 20px;
            background-color: #444;
        }
        
        .snake {
            background-color: #4CAF50;
            border-radius: 3px;
        }
        
        .snake-head {
            background-color: #2E7D32;
            border-radius: 3px;
        }
        
        .food {
            background-color: #F44336;
            border-radius: 50%;
        }
        
        #score {
            margin-top: 20px;
            font-size: 24px;
            color: #333;
        }
        
        #game-over {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background-color: rgba(0, 0, 0, 0.8);
            color: white;
            padding: 20px;
            border-radius: 8px;
            text-align: center;
            display: none;
        }
        
        #restart-button {
            margin-top: 15px;
            padding: 10px 20px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
        }
        
        #restart-button:hover {
            background-color: #45a049;
        }
        
        .controls {
            margin-top: 20px;
            text-align: center;
            color: #666;
        }
    </style>
</head>
<body>
    <h1>贪吃蛇游戏</h1>
    <div id="game-container">
        <div id="game-board"></div>
        <div id="game-over">
            <h2>游戏结束!</h2>
            <p>最终得分: <span id="final-score">0</span></p>
            <button id="restart-button">重新开始</button>
        </div>
    </div>
    <div id="score">得分: 0</div>
    <div class="controls">
        <p>使用方向键控制蛇的移动</p>
    </div>

    <script>
        // 游戏配置
        const GRID_SIZE = 20;
        const CELL_SIZE = 20;
        const INITIAL_SPEED = 150;
        const SPEED_INCREMENT = 2;
        
        // 游戏状态
        let snake;
        let food;
        let direction;
        let nextDirection;
        let gameRunning;
        let score;
        let gameSpeed;
        let gameLoopInterval;
        
        // 获取DOM元素
        const gameBoard = document.getElementById('game-board');
        const scoreElement = document.getElementById('score');
        const gameOverElement = document.getElementById('game-over');
        const finalScoreElement = document.getElementById('final-score');
        const restartButton = document.getElementById('restart-button');
        
        // 初始化游戏板
        function initializeBoard() {
            gameBoard.innerHTML = '';
            for (let i = 0; i < GRID_SIZE * GRID_SIZE; i++) {
                const cell = document.createElement('div');
                cell.classList.add('cell');
                gameBoard.appendChild(cell);
            }
        }
        
        // Snake类定义
        class Snake {
            constructor() {
                this.body = [
                    {x: 10, y: 10},
                    {x: 9, y: 10},
                    {x: 8, y: 10}
                ];
                this.direction = {x: 1, y: 0};
            }
            
            getBody() {
                return this.body;
            }
            
            move() {
                // 应用下一个方向
                this.direction = {...nextDirection};
                
                // 计算新的头部位置
                const head = {...this.body[0]};
                head.x += this.direction.x;
                head.y += this.direction.y;
                
                // 将新头部添加到蛇身
                this.body.unshift(head);
                
                // 如果没有吃到食物，移除尾部
                if (!this.eat(food)) {
                    this.body.pop();
                }
                
                return head;
            }
            
            eat(foodPosition) {
                const head = this.body[0];
                if (head.x === foodPosition.x && head.y === foodPosition.y) {
                    return true;
                }
                return false;
            }
            
            checkCollision() {
                const head = this.body[0];
                
                // 检查是否撞墙
                if (head.x < 0 || head.x >= GRID_SIZE || head.y < 0 || head.y >= GRID_SIZE) {
                    return true;
                }
                
                // 检查是否撞到自己
                for (let i = 1; i < this.body.length; i++) {
                    if (head.x === this.body[i].x && head.y === this.body[i].y) {
                        return true;
                    }
                }
                
                return false;
            }
            
            changeDirection(newDirection) {
                // 防止蛇直接掉头
                if (this.direction.x === -newDirection.x && this.direction.y === -newDirection.y) {
                    return;
                }
                nextDirection = newDirection;
            }
        }
        
        // 生成食物
        function generateFood() {
            let newFood;
            do {
                newFood = {
                    x: Math.floor(Math.random() * GRID_SIZE),
                    y: Math.floor(Math.random() * GRID_SIZE)
                };
                // 确保食物不会出现在蛇身上
            } while (snake.getBody().some(segment => segment.x === newFood.x && segment.y === newFood.y));
            
            food = newFood;
        }
        
        // 渲染游戏
        function render() {
            // 清除所有单元格
            const cells = document.querySelectorAll('.cell');
            cells.forEach(cell => {
                cell.classList.remove('snake', 'snake-head', 'food');
            });
            
            // 渲染蛇
            snake.getBody().forEach((segment, index) => {
                const cellIndex = segment.y * GRID_SIZE + segment.x;
                if (cellIndex >= 0 && cellIndex < cells.length) {
                    cells[cellIndex].classList.add('snake');
                    if (index === 0) {
                        cells[cellIndex].classList.add('snake-head');
                    }
                }
            });
            
            // 渲染食物
            const foodIndex = food.y * GRID_SIZE + food.x;
            if (foodIndex >= 0 && foodIndex < cells.length) {
                cells[foodIndex].classList.add('food');
            }
        }
        
        // 游戏主循环
        function gameLoop() {
            if (!gameRunning) return;
            
            // 移动蛇
            snake.move();
            
            // 检查碰撞
            if (snake.checkCollision()) {
                gameOver();
                return;
            }
            
            // 检查是否吃到食物
            if (snake.eat(food)) {
                score++;
                scoreElement.textContent = `得分: ${score}`;
                
                // 增加游戏难度
                if (score % 5 === 0 && gameSpeed > 50) {
                    gameSpeed -= SPEED_INCREMENT;
                    clearInterval(gameLoopInterval);
                    gameLoopInterval = setInterval(gameLoop, gameSpeed);
                }
                
                generateFood();
            }
            
            // 渲染游戏
            render();
        }
        
        // 键盘事件处理
        function handleKeyPress(e) {
            if (!gameRunning) return;
            
            switch(e.key) {
                case 'ArrowUp':
                    snake.changeDirection({x: 0, y: -1});
                    break;
                case 'ArrowDown':
                    snake.changeDirection({x: 0, y: 1});
                    break;
                case 'ArrowLeft':
                    snake.changeDirection({x: -1, y: 0});
                    break;
                case 'ArrowRight':
                    snake.changeDirection({x: 1, y: 0});
                    break;
            }
        }
        
        // 游戏结束
        function gameOver() {
            gameRunning = false;
            clearInterval(gameLoopInterval);
            finalScoreElement.textContent = score;
            gameOverElement.style.display = 'block';
        }
        
        // 重新开始游戏
        function restartGame() {
            // 重置游戏状态
            snake = new Snake();
            direction = {x: 1, y: 0};
            nextDirection = {x: 1, y: 0};
            score = 0;
            gameSpeed = INITIAL_SPEED;
            gameRunning = true;
            
            // 更新UI
            scoreElement.textContent = `得分: ${score}`;
            gameOverElement.style.display = 'none';
            
            // 生成食物
            generateFood();
            
            // 重新开始游戏循环
            clearInterval(gameLoopInterval);
            gameLoopInterval = setInterval(gameLoop, gameSpeed);
            
            // 渲染游戏
            render();
        }
        
        // 初始化游戏
        function initGame() {
            initializeBoard();
            restartGame();
            
            // 添加事件监听器
            document.addEventListener('keydown', handleKeyPress);
            restartButton.addEventListener('click', restartGame);
        }
        
        // 页面加载完成后初始化游戏
        window.addEventListener('DOMContentLoaded', initGame);
    </script>
</body>
</html>
