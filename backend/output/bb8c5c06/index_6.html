<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>贪吃蛇游戏</title>
  <style>
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      background-color: #111;
      color: white;
      font-family: Arial, sans-serif;
    }
    
    #game-container {
      position: relative;
    }
    
    #game-board {
      display: grid;
      grid-template-columns: repeat(20, 20px);
      grid-template-rows: repeat(20, 20px);
      gap: 1px;
      background-color: #333;
      border: 2px solid #555;
    }
    
    .cell {
      width: 20px;
      height: 20px;
      background-color: #222;
    }
    
    .snake {
      background-color: #4CAF50;
      border-radius: 3px;
    }
    
    .food {
      background-color: #f44336;
      border-radius: 50%;
    }
    
    #score {
      margin-top: 20px;
      font-size: 24px;
    }
    
    #game-over {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background-color: rgba(0, 0, 0, 0.8);
      padding: 20px;
      border-radius: 10px;
      text-align: center;
      display: none;
    }
  </style>
</head>
<body>
  <h1>贪吃蛇游戏</h1>
  <div id="game-container">
    <div id="game-board"></div>
    <div id="game-over">
      <h2>游戏结束!</h2>
      <p>得分: <span id="final-score">0</span></p>
      <button id="restart">重新开始</button>
    </div>
  </div>
  <div id="score">得分: 0</div>

  <script>
    // 游戏配置
    const GRID_WIDTH = 20;
    const GRID_HEIGHT = 20;
    const GAME_SPEED = 100; // 毫秒
    
    // 游戏状态
    let snake;
    let food;
    let score = 0;
    let gameRunning = true;
    
    // 初始化游戏板
    const gameBoard = document.getElementById('game-board');
    const scoreElement = document.getElementById('score');
    const gameOverElement = document.getElementById('game-over');
    const finalScoreElement = document.getElementById('final-score');
    const restartButton = document.getElementById('restart');
    
    // 创建单元格
    function createBoard() {
      gameBoard.innerHTML = '';
      for (let y = 0; y < GRID_HEIGHT; y++) {
        for (let x = 0; x < GRID_WIDTH; x++) {
          const cell = document.createElement('div');
          cell.classList.add('cell');
          cell.dataset.x = x;
          cell.dataset.y = y;
          gameBoard.appendChild(cell);
        }
      }
    }
    
    // 渲染游戏
    function render() {
      // 清除所有单元格
      document.querySelectorAll('.cell').forEach(cell => {
        cell.classList.remove('snake', 'food');
      });
      
      // 渲染蛇
      snake.getBody().forEach(segment => {
        const cell = document.querySelector(`.cell[data-x="${segment.x}"][data-y="${segment.y}"]`);
        if (cell) {
          cell.classList.add('snake');
        }
      });
      
      // 渲染食物
      const foodCell = document.querySelector(`.cell[data-x="${food.x}"][data-y="${food.y}"]`);
      if (foodCell) {
        foodCell.classList.add('food');
      }
      
      // 更新分数
      scoreElement.textContent = `得分: ${score}`;
    }
    
    // 生成新食物
    function generateFood() {
      let newFood;
      do {
        newFood = {
          x: Math.floor(Math.random() * GRID_WIDTH),
          y: Math.floor(Math.random() * GRID_HEIGHT)
        };
        // 确保食物不会生成在蛇身上
      } while (snake.getBody().some(segment => segment.x === newFood.x && segment.y === newFood.y));
      
      food = newFood;
    }
    
    // 游戏结束
    function gameOver() {
      gameRunning = false;
      finalScoreElement.textContent = score;
      gameOverElement.style.display = 'block';
    }
    
    // 重新开始游戏
    function restartGame() {
      snake = new Snake();
      score = 0;
      gameRunning = true;
      gameOverElement.style.display = 'none';
      generateFood();
      gameLoop();
    }
    
    // 键盘事件监听
    document.addEventListener('keydown', (e) => {
      if (!gameRunning) return;
      
      switch (e.key) {
        case 'ArrowUp':
          snake.changeDirection('up');
          break;
        case 'ArrowDown':
          snake.changeDirection('down');
          break;
        case 'ArrowLeft':
          snake.changeDirection('left');
          break;
        case 'ArrowRight':
          snake.changeDirection('right');
          break;
      }
    });
    
    // 重新开始按钮
    restartButton.addEventListener('click', restartGame);
    
    // 蛇类定义
    class Snake {
      constructor(initialLength = 3) {
        this.body = [];
        this.direction = 'right';
        this.nextDirection = 'right';
        
        const startX = Math.floor(GRID_WIDTH / 2);
        const startY = Math.floor(GRID_HEIGHT / 2);
        
        for (let i = 0; i < initialLength; i++) {
          this.body.push({ x: startX - i, y: startY });
        }
      }
      
      changeDirection(newDirection) {
        const opposites = {
          'up': 'down',
          'down': 'up',
          'left': 'right',
          'right': 'left'
        };
        
        if (newDirection !== opposites[this.direction]) {
          this.nextDirection = newDirection;
        }
      }
      
      move() {
        this.direction = this.nextDirection;
        const head = { ...this.body[0] };
        
        switch (this.direction) {
          case 'up':
            head.y -= 1;
            break;
          case 'down':
            head.y += 1;
            break;
          case 'left':
            head.x -= 1;
            break;
          case 'right':
            head.x += 1;
            break;
        }
        
        this.body.unshift(head);
      }
      
      checkWallCollision() {
        const head = this.body[0];
        return (
          head.x < 0 || 
          head.x >= GRID_WIDTH || 
          head.y < 0 || 
          head.y >= GRID_HEIGHT
        );
      }
      
      checkSelfCollision() {
        const head = this.body[0];
        for (let i = 1; i < this.body.length; i++) {
          if (head.x === this.body[i].x && head.y === this.body[i].y) {
            return true;
          }
        }
        return false;
      }
      
      eat() {
        // 不移除尾部，蛇会变长
      }
      
      getBody() {
        return this.body;
      }
    }
    
    // 游戏主循环
    function gameLoop() {
      if (!gameRunning) return;
      
      snake.move();
      
      if (snake.checkWallCollision() || snake.checkSelfCollision()) {
        gameOver();
        return;
      }
      
      if (snake.body[0].x === food.x && snake.body[0].y === food.y) {
        snake.eat();
        generateFood();
        score++;
      } else {
        snake.body.pop();
      }
      
      render();
      setTimeout(gameLoop, GAME_SPEED);
    }
    
    // 初始化游戏
    createBoard();
    snake = new Snake();
    generateFood();
    render();
    gameLoop();
  </script>
</body>
</html>
