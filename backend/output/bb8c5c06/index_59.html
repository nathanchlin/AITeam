<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>贪吃蛇游戏</title>
    <style>
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            background-color: #f0f0f0;
            font-family: Arial, sans-serif;
        }
        
        .game-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }
        
        .game-info {
            display: flex;
            gap: 30px;
            font-size: 18px;
            font-weight: bold;
        }
        
        .game-board {
            display: grid;
            grid-template-columns: repeat(20, 20px);
            grid-template-rows: repeat(20, 20px);
            border: 2px solid #333;
            background-color: #fff;
        }
        
        .cell {
            width: 20px;
            height: 20px;
            border: 1px solid #eee;
        }
        
        .snake {
            background-color: #4CAF50;
            border-radius: 3px;
        }
        
        .snake-head {
            background-color: #2E7D32;
        }
        
        .food {
            background-color: #F44336;
            border-radius: 50%;
        }
        
        .controls {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }
        
        button {
            padding: 10px 20px;
            font-size: 16px;
            background-color: #2196F3;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            transition: background-color 0.3s;
        }
        
        button:hover {
            background-color: #0b7dda;
        }
        
        .game-over {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background-color: rgba(0, 0, 0, 0.8);
            color: white;
            padding: 30px;
            border-radius: 10px;
            text-align: center;
            display: none;
        }
        
        .difficulty-selector {
            display: flex;
            gap: 10px;
            margin-bottom: 10px;
        }
        
        .difficulty-selector button {
            background-color: #757575;
        }
        
        .difficulty-selector button.active {
            background-color: #2196F3;
        }
    </style>
</head>
<body>
    <div class="game-container">
        <h1>贪吃蛇游戏</h1>
        <div class="game-info">
            <div>得分: <span id="score">0</span></div>
            <div>最高分: <span id="highScore">0</span></div>
        </div>
        <div class="difficulty-selector">
            <button id="easy" class="difficulty active">简单</button>
            <button id="medium" class="difficulty">中等</button>
            <button id="hard" class="difficulty">困难</button>
        </div>
        <div id="gameBoard" class="game-board"></div>
        <div class="controls">
            <button id="startBtn">开始游戏</button>
            <div>使用方向键控制蛇的移动</div>
        </div>
    </div>
    
    <div id="gameOver" class="game-over">
        <h2>游戏结束!</h2>
        <p>最终得分: <span id="finalScore">0</span></p>
        <button id="restartBtn">重新开始</button>
    </div>

    <script>
        // 游戏配置
        const GRID_SIZE = 20;
        const INITIAL_SPEED = 150; // 毫秒
        const SPEED_INCREMENT = 5; // 每吃一个食物速度增加的毫秒数
        
        // 游戏状态
        let gameBoard;
        let scoreElement;
        let highScoreElement;
        let gameOverElement;
        let finalScoreElement;
        let startBtn;
        let restartBtn;
        let difficultyButtons;
        
        let snake;
        let food;
        let direction;
        let gameInterval;
        let score;
        let highScore;
        let gameSpeed;
        let currentDifficulty;
        
        // 方常量
        const DIRECTIONS = {
            UP: { x: 0, y: -1 },
            DOWN: { x: 0, y: 1 },
            LEFT: { x: -1, y: 0 },
            RIGHT: { x: 1, y: 0 }
        };
        
        // 难度配置
        const DIFFICULTY_SETTINGS = {
            easy: { speed: 150, name: '简单' },
            medium: { speed: 100, name: '中等' },
            hard: { speed: 70, name: '困难' }
        };
        
        // 蛇类
        class Snake {
            constructor() {
                this.reset();
            }
            
            reset() {
                this.body = [
                    { x: Math.floor(GRID_SIZE / 2), y: Math.floor(GRID_SIZE / 2) }
                ];
                this.direction = DIRECTIONS.RIGHT;
                this.nextDirection = DIRECTIONS.RIGHT;
            }
            
            move() {
                // 更新方向
                this.direction = this.nextDirection;
                
                // 计算新的头部位置
                const head = { ...this.body[0] };
                head.x += this.direction.x;
                head.y += this.direction.y;
                
                // 添加新头部
                this.body.unshift(head);
                
                // 如果没有吃到食物，移除尾部
                if (!this.hasEaten) {
                    this.body.pop();
                } else {
                    this.hasEaten = false;
                }
            }
            
            grow() {
                this.hasEaten = true;
            }
            
            changeDirection(newDirection) {
                // 防止蛇直接掉头
                const oppositeDirection = {
                    [DIRECTIONS.UP]: DIRECTIONS.DOWN,
                    [DIRECTIONS.DOWN]: DIRECTIONS.UP,
                    [DIRECTIONS.LEFT]: DIRECTIONS.RIGHT,
                    [DIRECTIONS.RIGHT]: DIRECTIONS.LEFT
                };
                
                if (newDirection !== oppositeDirection[this.direction]) {
                    this.nextDirection = newDirection;
                }
            }
            
            // 碰撞检测 - 撞墙
            checkWallCollision() {
                const head = this.body[0];
                return head.x < 0 || head.x >= GRID_SIZE || head.y < 0 || head.y >= GRID_SIZE;
            }
            
            // 碰撞检测 - 撞自身
            checkSelfCollision() {
                const head = this.body[0];
                for (let i = 1; i < this.body.length; i++) {
                    if (head.x === this.body[i].x && head.y === this.body[i].y) {
                        return true;
                    }
                }
                return false;
            }
            
            // 获取蛇头位置
            getHeadPosition() {
                return { ...this.body[0] };
            }
            
            // 检查是否吃到食物
            checkFoodCollision(foodPosition) {
                const head = this.body[0];
                return head.x === foodPosition.x && head.y === foodPosition.y;
            }
        }
        
        // 食物类
        class Food {
            constructor() {
                this.position = this.generateRandomPosition();
            }
            
            generateRandomPosition() {
                let newPosition;
                do {
                    newPosition = {
                        x: Math.floor(Math.random() * GRID_SIZE),
                        y: Math.floor(Math.random() * GRID_SIZE)
                    };
                } while (this.isPositionOnSnake(newPosition));
                
                return newPosition;
            }
            
            isPositionOnSnake(position) {
                return snake.body.some(segment => 
                    segment.x === position.x && segment.y === position.y
                );
            }
            
            respawn() {
                this.position = this.generateRandomPosition();
            }
        }
        
        // 初始化游戏
        function initGame() {
            gameBoard = document.getElementById('gameBoard');
            scoreElement = document.getElementById('score');
            highScoreElement = document.getElementById('highScore');
            gameOverElement = document.getElementById('gameOver');
            finalScoreElement = document.getElementById('finalScore');
            startBtn = document.getElementById('startBtn');
            restartBtn = document.getElementById('restartBtn');
            difficultyButtons = document.querySelectorAll('.difficulty');
            
            // 从本地存储加载最高分
            highScore = localStorage.getItem('snakeHighScore') || 0;
            highScoreElement.textContent = highScore;
            
            // 创建游戏网格
            createGameBoard();
            
            // 初始化游戏对象
            snake = new Snake();
            food = new Food();
            
            // 设置难度
            currentDifficulty = 'easy';
            gameSpeed = DIFFICULTY_SETTINGS[currentDifficulty].speed;
            
            // 添加事件监听器
            startBtn.addEventListener('click', startGame);
            restartBtn.addEventListener('click', restartGame);
            
            // 难度选择
            difficultyButtons.forEach(button => {
                button.addEventListener('click', () => {
                    if (!gameInterval) {
                        currentDifficulty = button.id;
                        gameSpeed = DIFFICULTY_SETTINGS[currentDifficulty].speed;
                        
                        // 更新按钮样式
                        difficultyButtons.forEach(btn => btn.classList.remove('active'));
                        button.classList.add('active');
                    }
                });
            });
            
            // 键盘控制
            document.addEventListener('keydown', handleKeyPress);
        }
        
        // 创建游戏网格
        function createGameBoard() {
            gameBoard.innerHTML = '';
            for (let i = 0; i < GRID_SIZE * GRID_SIZE; i++) {
                const cell = document.createElement('div');
                cell.classList.add('cell');
                gameBoard.appendChild(cell);
            }
        }
        
        // 开始游戏
        function startGame() {
            if (gameInterval) return;
            
            // 重置游戏状态
            snake.reset();
            food = new Food();
            score = 0;
            scoreElement.textContent = score;
            direction = DIRECTIONS.RIGHT;
            
            // 隐藏游戏结束界面
            gameOverElement.style.display = 'none';
            
            // 开始游戏循环
            gameInterval = setInterval(gameLoop, gameSpeed);
        }
        
        // 游戏主循环
        function gameLoop() {
            // 移动蛇
            snake.move();
            
            // 检查碰撞
            if (snake.checkWallCollision() || snake.checkSelfCollision()) {
                endGame();
                return;
            }
            
            // 检查是否吃到食物
            if (snake.checkFoodCollision(food.position)) {
                snake.grow();
                score += 10;
                scoreElement.textContent = score;
                
                // 更新最高分
                if (score > highScore) {
                    highScore = score;
                    highScoreElement.textContent = highScore;
                    localStorage.setItem('snakeHighScore', highScore);
                }
                
                // 生成新食物
                food.respawn();
                
                // 增加游戏速度
                if (gameSpeed > 50) {
                    gameSpeed -= SPEED_INCREMENT;
                    clearInterval(gameInterval);
                    gameInterval = setInterval(gameLoop, gameSpeed);
                }
            }
            
            // 更新显示
            updateDisplay();
        }
        
        // 更新游戏显示
        function updateDisplay() {
            // 清除所有单元格
            const cells = gameBoard.querySelectorAll('.cell');
            cells.forEach(cell => {
                cell.classList.remove('snake', 'snake-head', 'food');
            });
            
            // 绘制蛇
            snake.body.forEach((segment, index) => {
                const cellIndex = segment.y * GRID_SIZE + segment.x;
                if (cells[cellIndex]) {
                    if (index === 0) {
                        cells[cellIndex].classList.add('snake-head');
                    } else {
                        cells[cellIndex].classList.add('snake');
                    }
                }
            });
            
            // 绘制食物
            const foodCellIndex = food.position.y * GRID_SIZE + food.position.x;
            if (cells[foodCellIndex]) {
                cells[foodCellIndex].classList.add('food');
            }
        }
        
        // 结束游戏
        function endGame() {
            clearInterval(gameInterval);
            gameInterval = null;
            
            // 显示游戏结束界面
            finalScoreElement.textContent = score;
            gameOverElement.style.display = 'block';
        }
        
        // 重新开始游戏
        function restartGame() {
            startGame();
        }
        
        // 处理键盘输入
        function handleKeyPress(event) {
            if (!gameInterval) return;
            
            switch (event.key) {
                case 'ArrowUp':
                    event.preventDefault();
                    snake.changeDirection(DIRECTIONS.UP);
                    break;
                case 'ArrowDown':
                    event.preventDefault();
                    snake.changeDirection(DIRECTIONS.DOWN);
                    break;
                case 'ArrowLeft':
                    event.preventDefault();
                    snake.changeDirection(DIRECTIONS.LEFT);
                    break;
                case 'ArrowRight':
                    event.preventDefault();
                    snake.changeDirection(DIRECTIONS.RIGHT);
                    break;
            }
        }
        
        // 页面加载完成后初始化游戏
        document.addEventListener('DOMContentLoaded', initGame);
    </script>
</body>
</html>
