<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>贪吃蛇游戏</title>
    <style>
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            background-color: #f0f0f0;
            font-family: Arial, sans-serif;
        }
        
        .game-container {
            position: relative;
            margin-bottom: 20px;
        }
        
        canvas {
            border: 2px solid #333;
            background-color: #fff;
        }
        
        .score {
            font-size: 24px;
            margin-bottom: 10px;
        }
        
        .controls {
            display: flex;
            gap: 10px;
            margin-bottom: 10px;
        }
        
        button {
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 4px;
            transition: background-color 0.3s;
        }
        
        button:hover {
            background-color: #45a049;
        }
        
        button:disabled {
            background-color: #cccccc;
            cursor: not-allowed;
        }
        
        .game-over {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background-color: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
            display: none;
        }
        
        .instructions {
            text-align: center;
            margin-top: 20px;
            color: #666;
        }
    </style>
</head>
<body>
    <div class="score">得分: <span id="score">0</span></div>
    <div class="controls">
        <button id="startBtn">开始游戏</button>
        <button id="pauseBtn" disabled>暂停</button>
        <button id="restartBtn" disabled>重新开始</button>
    </div>
    <div class="game-container">
        <canvas id="gameCanvas" width="400" height="400"></canvas>
        <div class="game-over" id="gameOver">
            <h2>游戏结束!</h2>
            <p>最终得分: <span id="finalScore">0</span></p>
            <button id="restartGameOverBtn">重新开始</button>
        </div>
    </div>
    <div class="instructions">
        <p>使用方向键控制蛇的移动</p>
    </div>

    <script>
        // 游戏常量
        const GRID_SIZE = 20;
        const CELL_SIZE = 20;
        const GAME_SPEED = 150; // 初始游戏速度（毫秒）
        const SPEED_INCREMENT = 5; // 每得5分速度增加的毫秒数
        
        // 游戏状态
        let canvas = document.getElementById('gameCanvas');
        let ctx = canvas.getContext('2d');
        let gameRunning = false;
        let gamePaused = false;
        let score = 0;
        let gameSpeed = GAME_SPEED;
        let food = null;
        
        // DOM元素
        const scoreElement = document.getElementById('score');
        const startBtn = document.getElementById('startBtn');
        const pauseBtn = document.getElementById('pauseBtn');
        const restartBtn = document.getElementById('restartBtn');
        const gameOverElement = document.getElementById('gameOver');
        const finalScoreElement = document.getElementById('finalScore');
        const restartGameOverBtn = document.getElementById('restartGameOverBtn');
        
        // Snake类
        class Snake {
            constructor() {
                this.body = [{x: 10, y: 10}];
                this.direction = {x: 1, y: 0};
                this.nextDirection = {x: 1, y: 0};
            }
            
            getBody() {
                return this.body;
            }
            
            getHead() {
                return this.body[0];
            }
            
            setDirection(newDirection) {
                // 防止蛇直接掉头
                if (this.direction.x !== -newDirection.x || this.direction.y !== -newDirection.y) {
                    this.nextDirection = newDirection;
                }
            }
            
            move() {
                // 更新方向
                this.direction = {...this.nextDirection};
                
                // 计算新头部位置
                const head = this.getHead();
                const newHead = {
                    x: head.x + this.direction.x,
                    y: head.y + this.direction.y
                };
                
                // 添加新头部
                this.body.unshift(newHead);
                
                // 如果没有吃到食物，移除尾部
                if (!this.eat(food)) {
                    this.body.pop();
                }
            }
            
            grow() {
                // 不移除尾部，使蛇变长
                const head = this.getHead();
                const newHead = {
                    x: head.x + this.direction.x,
                    y: head.y + this.direction.y
                };
                this.body.unshift(newHead);
            }
            
            eat(food) {
                const head = this.getHead();
                return head.x === food.x && head.y === food.y;
            }
            
            checkCollision() {
                const head = this.getHead();
                
                // 检查是否撞墙
                if (head.x < 0 || head.x >= GRID_SIZE || head.y < 0 || head.y >= GRID_SIZE) {
                    return true;
                }
                
                // 检查是否撞到自己
                for (let i = 1; i < this.body.length; i++) {
                    if (head.x === this.body[i].x && head.y === this.body[i].y) {
                        return true;
                    }
                }
                
                return false;
            }
            
            draw() {
                this.body.forEach((segment, index) => {
                    ctx.fillStyle = index === 0 ? '#2ecc71' : '#27ae60'; // 头部颜色稍浅
                    ctx.fillRect(segment.x * CELL_SIZE, segment.y * CELL_SIZE, CELL_SIZE, CELL_SIZE);
                    
                    // 添加边框使蛇身更清晰
                    ctx.strokeStyle = '#1e8449';
                    ctx.strokeRect(segment.x * CELL_SIZE, segment.y * CELL_SIZE, CELL_SIZE, CELL_SIZE);
                });
            }
        }
        
        // 食物生成系统
        function generateFood() {
            let newFood;
            let foodOnSnake;
            
            do {
                foodOnSnake = false;
                newFood = {
                    x: Math.floor(Math.random() * GRID_SIZE),
                    y: Math.floor(Math.random() * GRID_SIZE)
                };
                
                // 检查食物是否生成在蛇身上
                for (let segment of snake.getBody()) {
                    if (segment.x === newFood.x && segment.y === newFood.y) {
                        foodOnSnake = true;
                        break;
                    }
                }
            } while (foodOnSnake);
            
            food = newFood;
        }
        
        // 绘制食物
        function drawFood() {
            ctx.fillStyle = '#e74c3c';
            ctx.beginPath();
            ctx.arc(
                food.x * CELL_SIZE + CELL_SIZE / 2,
                food.y * CELL_SIZE + CELL_SIZE / 2,
                CELL_SIZE / 2 - 2,
                0,
                Math.PI * 2
            );
            ctx.fill();
        }
        
        // 渲染游戏
        function render() {
            // 清空画布
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // 绘制网格线（可选，使游戏更清晰）
            ctx.strokeStyle = '#ecf0f1';
            ctx.lineWidth = 1;
            
            for (let i = 0; i <= GRID_SIZE; i++) {
                // 垂直线
                ctx.beginPath();
                ctx.moveTo(i * CELL_SIZE, 0);
                ctx.lineTo(i * CELL_SIZE, canvas.height);
                ctx.stroke();
                
                // 水平线
                ctx.beginPath();
                ctx.moveTo(0, i * CELL_SIZE);
                ctx.lineTo(canvas.width, i * CELL_SIZE);
                ctx.stroke();
            }
            
            // 绘制食物和蛇
            drawFood();
            snake.draw();
        }
        
        // 游戏主循环
        function gameLoop() {
            if (!gameRunning || gamePaused) return;
            
            snake.move();
            
            // 检查碰撞
            if (snake.checkCollision()) {
                gameOver();
                return;
            }
            
            // 检查是否吃到食物
            if (snake.eat(food)) {
                score++;
                scoreElement.textContent = `得分: ${score}`;
                generateFood();
                
                // 每得5分增加游戏速度
                if (score % 5 === 0) {
                    gameSpeed = Math.max(50, gameSpeed - SPEED_INCREMENT);
                }
            }
            
            render();
            
            // 继续游戏循环
            setTimeout(gameLoop, gameSpeed);
        }
        
        // 游戏初始化
        function initGame() {
            snake = new Snake();
            score = 0;
            gameSpeed = GAME_SPEED;
            scoreElement.textContent = `得分: ${score}`;
            generateFood();
            render();
        }
        
        // 开始游戏
        function startGame() {
            if (gameRunning) return;
            
            gameRunning = true;
            gamePaused = false;
            startBtn.disabled = true;
            pauseBtn.disabled = false;
            restartBtn.disabled = false;
            gameOverElement.style.display = 'none';
            
            gameLoop();
        }
        
        // 暂停/继续游戏
        function togglePause() {
            if (!gameRunning) return;
            
            gamePaused = !gamePaused;
            pauseBtn.textContent = gamePaused ? '继续' : '暂停';
            
            if (!gamePaused) {
                gameLoop();
            }
        }
        
        // 重新开始游戏
        function restartGame() {
            gameRunning = false;
            gamePaused = false;
            startBtn.disabled = false;
            pauseBtn.disabled = true;
            pauseBtn.textContent = '暂停';
            restartBtn.disabled = true;
            gameOverElement.style.display = 'none';
            
            initGame();
        }
        
        // 游戏结束
        function gameOver() {
            gameRunning = false;
            finalScoreElement.textContent = score;
            gameOverElement.style.display = 'block';
            startBtn.disabled = false;
            pauseBtn.disabled = true;
            restartBtn.disabled = true;
        }
        
        // 键盘事件处理
        document.addEventListener('keydown', (e) => {
            if (!gameRunning || gamePaused) return;
            
            switch(e.key) {
                case 'ArrowUp':
                    snake.setDirection({x: 0, y: -1});
                    break;
                case 'ArrowDown':
                    snake.setDirection({x: 0, y: 1});
                    break;
                case 'ArrowLeft':
                    snake.setDirection({x: -1, y: 0});
                    break;
                case 'ArrowRight':
                    snake.setDirection({x: 1, y: 0});
                    break;
            }
        });
        
        // 按钮事件监听
        startBtn.addEventListener('click', startGame);
        pauseBtn.addEventListener('click', togglePause);
        restartBtn.addEventListener('click', restartGame);
        restartGameOverBtn.addEventListener('click', restartGame);
        
        // 初始化游戏
        initGame();
    </script>
</body>
</html>
