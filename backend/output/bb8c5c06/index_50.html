<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>贪吃蛇游戏</title>
    <style>
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            background-color: #f0f0f0;
            font-family: Arial, sans-serif;
        }
        
        #game-container {
            position: relative;
            width: 400px;
            height: 400px;
            background-color: #fff;
            border: 2px solid #333;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }
        
        #game-canvas {
            display: block;
        }
        
        #game-over {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.7);
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: white;
        }
        
        #game-over h2 {
            margin-top: 0;
            font-size: 2.5em;
        }
        
        #game-over p {
            font-size: 1.5em;
            margin: 10px 0;
        }
        
        #restart-btn {
            margin-top: 20px;
            padding: 10px 20px;
            font-size: 1.2em;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.3s;
        }
        
        #restart-btn:hover {
            background-color: #45a049;
        }
        
        #score {
            margin-bottom: 10px;
            font-size: 1.5em;
        }
        
        #instructions {
            margin-top: 20px;
            text-align: center;
            color: #666;
        }
    </style>
</head>
<body>
    <div id="score">得分: 0</div>
    <div id="game-container">
        <canvas id="game-canvas" width="400" height="400"></canvas>
        <div id="game-over">
            <h2>游戏结束!</h2>
            <p id="final-score">最终得分: 0</p>
            <button id="restart-btn">重新开始</button>
        </div>
    </div>
    <div id="instructions">
        使用方向键控制蛇的移动
    </div>

    <script>
        // 游戏常量
        const GRID_SIZE = 20;
        const CELL_SIZE = 20;
        const GAME_SPEED = 100;
        const INITIAL_SPEED = 100;
        const SPEED_INCREMENT = 2;
        
        // 游戏状态
        let gameRunning = true;
        let score = 0;
        let gameSpeed = INITIAL_SPEED;
        
        // 获取DOM元素
        const canvas = document.getElementById('game-canvas');
        const ctx = canvas.getContext('2d');
        const scoreElement = document.getElementById('score');
        const gameOverElement = document.getElementById('game-over');
        const finalScoreElement = document.getElementById('final-score');
        const restartButton = document.getElementById('restart-btn');
        
        // 蛇类定义
        class Snake {
            constructor() {
                this.body = [{x: 10, y: 10}];
                this.direction = {x: 1, y: 0};
                this.growing = false;
            }
            
            move() {
                const head = {
                    x: this.body[0].x + this.direction.x,
                    y: this.body[0].y + this.direction.y
                };
                
                this.body.unshift(head);
                
                if (!this.growing) {
                    this.body.pop();
                } else {
                    this.growing = false;
                }
            }
            
            grow() {
                this.growing = true;
            }
            
            checkCollision() {
                const head = this.body[0];
                
                // 检查是否撞墙
                if (head.x < 0 || head.x >= GRID_SIZE || head.y < 0 || head.y >= GRID_SIZE) {
                    return true;
                }
                
                // 检查是否撞到自己
                for (let i = 1; i < this.body.length; i++) {
                    if (head.x === this.body[i].x && head.y === this.body[i].y) {
                        return true;
                    }
                }
                
                return false;
            }
            
            changeDirection(newDirection) {
                // 防止蛇直接掉头
                if (this.direction.x === -newDirection.x && this.direction.y === -newDirection.y) {
                    return;
                }
                this.direction = newDirection;
            }
            
            getHead() {
                return this.body[0];
            }
        }
        
        // 食物类定义
        class Food {
            constructor() {
                this.position = this.generatePosition();
            }
            
            generatePosition() {
                return {
                    x: Math.floor(Math.random() * GRID_SIZE),
                    y: Math.floor(Math.random() * GRID_SIZE)
                };
            }
            
            respawn(snakeBody) {
                let newPosition;
                do {
                    newPosition = this.generatePosition();
                } while (snakeBody.some(segment => segment.x === newPosition.x && segment.y === newPosition.y));
                
                this.position = newPosition;
            }
        }
        
        // 游戏初始化
        let snake = new Snake();
        let food = new Food();
        
        // 渲染函数
        function render() {
            // 清空画布
            ctx.fillStyle = '#f0f0f0';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            // 绘制网格线
            ctx.strokeStyle = '#ddd';
            ctx.lineWidth = 0.5;
            for (let i = 0; i <= GRID_SIZE; i++) {
                ctx.beginPath();
                ctx.moveTo(i * CELL_SIZE, 0);
                ctx.lineTo(i * CELL_SIZE, canvas.height);
                ctx.stroke();
                
                ctx.beginPath();
                ctx.moveTo(0, i * CELL_SIZE);
                ctx.lineTo(canvas.width, i * CELL_SIZE);
                ctx.stroke();
            }
            
            // 绘制蛇
            snake.body.forEach((segment, index) => {
                if (index === 0) {
                    // 蛇头
                    ctx.fillStyle = '#2ecc71';
                } else {
                    // 蛇身
                    ctx.fillStyle = '#27ae60';
                }
                ctx.fillRect(
                    segment.x * CELL_SIZE + 1,
                    segment.y * CELL_SIZE + 1,
                    CELL_SIZE - 2,
                    CELL_SIZE - 2
                );
            });
            
            // 绘制食物
            ctx.fillStyle = '#e74c3c';
            ctx.beginPath();
            ctx.arc(
                food.position.x * CELL_SIZE + CELL_SIZE / 2,
                food.position.y * CELL_SIZE + CELL_SIZE / 2,
                CELL_SIZE / 2 - 2,
                0,
                Math.PI * 2
            );
            ctx.fill();
        }
        
        // 游戏主循环
        function gameLoop() {
            if (!gameRunning) return;
            
            snake.move();
            
            if (snake.checkCollision()) {
                gameOver();
                return;
            }
            
            // 检查是否吃到食物
            if (snake.getHead().x === food.position.x && snake.getHead().y === food.position.y) {
                snake.grow();
                score++;
                scoreElement.textContent = `得分: ${score}`;
                
                // 增加游戏难度
                if (score % 5 === 0 && gameSpeed > 50) {
                    gameSpeed -= SPEED_INCREMENT;
                }
                
                food.respawn(snake.body);
            }
            
            render();
            setTimeout(gameLoop, gameSpeed);
        }
        
        // 游戏结束函数
        function gameOver() {
            gameRunning = false;
            finalScoreElement.textContent = `最终得分: ${score}`;
            gameOverElement.style.display = 'flex';
        }
        
        // 重新开始游戏
        function restartGame() {
            gameRunning = true;
            score = 0;
            gameSpeed = INITIAL_SPEED;
            scoreElement.textContent = `得分: ${score}`;
            gameOverElement.style.display = 'none';
            
            snake = new Snake();
            food = new Food();
            
            gameLoop();
        }
        
        // 键盘事件处理
        document.addEventListener('keydown', (e) => {
            if (!gameRunning) return;
            
            switch(e.key) {
                case 'ArrowUp':
                    snake.changeDirection({x: 0, y: -1});
                    break;
                case 'ArrowDown':
                    snake.changeDirection({x: 0, y: 1});
                    break;
                case 'ArrowLeft':
                    snake.changeDirection({x: -1, y: 0});
                    break;
                case 'ArrowRight':
                    snake.changeDirection({x: 1, y: 0});
                    break;
            }
        });
        
        // 重新开始按钮事件
        restartButton.addEventListener('click', restartGame);
        
        // 初始化游戏
        render();
        gameLoop();
    </script>
</body>
</html>
