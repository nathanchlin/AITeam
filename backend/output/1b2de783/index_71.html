<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>太空射击游戏</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Arial', sans-serif;
            background-color: #000;
            color: #fff;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        
        #gameContainer {
            position: relative;
            width: 800px;
            height: 600px;
            background-color: #111;
            border: 2px solid #0ff;
            box-shadow: 0 0 20px rgba(0, 255, 255, 0.5);
        }
        
        #gameCanvas {
            display: block;
            background-color: #000;
        }
        
        #gameUI {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }
        
        .ui-element {
            position: absolute;
            font-size: 18px;
            font-weight: bold;
            text-shadow: 0 0 5px rgba(0, 255, 255, 0.8);
        }
        
        #score {
            top: 10px;
            left: 10px;
        }
        
        #lives {
            top: 10px;
            right: 10px;
        }
        
        #level {
            top: 40px;
            left: 10px;
        }
        
        #gameOverlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.7);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            pointer-events: all;
        }
        
        #gameOverlay h2 {
            font-size: 36px;
            margin-bottom: 20px;
            color: #0ff;
        }
        
        #gameOverlay p {
            font-size: 20px;
            margin-bottom: 30px;
        }
        
        .button {
            padding: 10px 20px;
            font-size: 18px;
            background-color: #0ff;
            color: #000;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .button:hover {
            background-color: #fff;
            box-shadow: 0 0 10px rgba(0, 255, 255, 0.8);
        }
        
        #controls {
            position: absolute;
            bottom: 10px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 14px;
            text-align: center;
            opacity: 0.7;
        }
    </style>
</head>
<body>
    <div id="gameContainer">
        <canvas id="gameCanvas" width="800" height="600"></canvas>
        <div id="gameUI">
            <div id="score" class="ui-element">分数: 0</div>
            <div id="lives" class="ui-element">生命: 3</div>
            <div id="level" class="ui-element">等级: 1</div>
        </div>
        <div id="gameOverlay">
            <h2>太空射击游戏</h2>
            <p>使用方向键移动，空格键射击</p>
            <button id="startButton" class="button">开始游戏</button>
        </div>
        <div id="controls">← → 移动 | 空格 射击 | P 暂停</div>
    </div>

    <script>
        // 游戏代码将在这里实现
    </script>
</body>
</html>
