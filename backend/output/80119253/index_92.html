<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>五子棋游戏</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            background-color: #f5f5f5;
            margin: 0;
            padding: 20px;
        }
        
        h1 {
            color: #333;
            margin-bottom: 20px;
        }
        
        .game-container {
            background-color: white;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            padding: 20px;
            margin-bottom: 20px;
        }
        
        .game-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            width: 450px;
        }
        
        .player-info {
            display: flex;
            align-items: center;
            font-size: 18px;
            font-weight: bold;
        }
        
        .player-indicator {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            margin-right: 10px;
            border: 1px solid #ccc;
        }
        
        .player1-indicator {
            background-color: black;
        }
        
        .player2-indicator {
            background-color: white;
        }
        
        .board {
            display: grid;
            grid-template-columns: repeat(15, 30px);
            grid-template-rows: repeat(15, 30px);
            gap: 0;
            background-color: #dcb35c;
            border: 2px solid #8b6914;
            position: relative;
        }
        
        .cell {
            width: 30px;
            height: 30px;
            box-sizing: border-box;
            border: 1px solid #8b6914;
            position: relative;
            cursor: pointer;
            z-index: 1;
        }
        
        .cell:hover {
            background-color: rgba(255, 255, 255, 0.3);
        }
        
        .piece {
            position: absolute;
            width: 26px;
            height: 26px;
            border-radius: 50%;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 2;
        }
        
        .black-piece {
            background: radial-gradient(circle at 30% 30%, #5a5a5a, #000);
            box-shadow: 1px 1px 3px rgba(0, 0, 0, 0.5);
        }
        
        .white-piece {
            background: radial-gradient(circle at 30% 30%, #fff, #e0e0e0);
            box-shadow: 1px 1px 3px rgba(0, 0, 0, 0.3);
        }
        
        .controls {
            display: flex;
            gap: 10px;
        }
        
        button {
            padding: 10px 20px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            transition: background-color 0.3s;
        }
        
        button:hover {
            background-color: #45a049;
        }
        
        button:disabled {
            background-color: #cccccc;
            cursor: not-allowed;
        }
        
        .message {
            margin-top: 20px;
            padding: 10px 20px;
            border-radius: 5px;
            font-weight: bold;
            text-align: center;
            min-height: 20px;
        }
        
        .win-message {
            background-color: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        
        .error-message {
            background-color: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
    </style>
</head>
<body>
    <h1>五子棋游戏</h1>
    
    <div class="game-container">
        <div class="game-info">
            <div class="player-info">
                <div class="player-indicator player1-indicator"></div>
                <span>黑棋</span>
            </div>
            <div class="player-info">
                <div class="player-indicator player2-indicator"></div>
                <span>白棋</span>
            </div>
        </div>
        
        <div class="board" id="board"></div>
        
        <div class="controls">
            <button id="undo-btn">悔棋</button>
            <button id="restart-btn">重新开始</button>
        </div>
        
        <div class="message" id="message"></div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // 游戏状态
            const BOARD_SIZE = 15;
            const EMPTY = 0;
            const BLACK = 1;
            const WHITE = 2;
            
            let board = [];
            let currentPlayer = BLACK;
            let gameOver = false;
            let moveHistory = [];
            
            // DOM 元素
            const boardElement = document.getElementById('board');
            const messageElement = document.getElementById('message');
            const undoButton = document.getElementById('undo-btn');
            const restartButton = document.getElementById('restart-btn');
            
            // 初始化游戏
            function initGame() {
                board = Array(BOARD_SIZE).fill(null).map(() => Array(BOARD_SIZE).fill(EMPTY));
                currentPlayer = BLACK;
                gameOver = false;
                moveHistory = [];
                renderBoard();
                updateMessage('');
                updatePlayerIndicators();
                undoButton.disabled = false;
            }
            
            // 渲染棋盘
            function renderBoard() {
                boardElement.innerHTML = '';
                
                for (let row = 0; row < BOARD_SIZE; row++) {
                    for (let col = 0; col < BOARD_SIZE; col++) {
                        const cell = document.createElement('div');
                        cell.className = 'cell';
                        cell.dataset.row = row;
                        cell.dataset.col = col;
                        
                        if (board[row][col] !== EMPTY) {
                            const piece = document.createElement('div');
                            piece.className = `piece ${board[row][col] === BLACK ? 'black-piece' : 'white-piece'}`;
                            cell.appendChild(piece);
                        }
                        
                        cell.addEventListener('click', handleCellClick);
                        boardElement.appendChild(cell);
                    }
                }
            }
            
            // 处理单元格点击
            function handleCellClick(event) {
                if (gameOver) return;
                
                const row = parseInt(event.currentTarget.dataset.row);
                const col = parseInt(event.currentTarget.dataset.col);
                
                if (board[row][col] !== EMPTY) {
                    updateMessage('该位置已有棋子，请选择其他位置', 'error');
                    return;
                }
                
                // 落子
                makeMove(row, col);
            }
            
            // 执行落子
            function makeMove(row, col) {
                board[row][col] = currentPlayer;
                moveHistory.push({ row, col, player: currentPlayer });
                
                renderBoard();
                
                // 检查胜负
                if (checkWin(row, col)) {
                    gameOver = true;
                    updateMessage(`${currentPlayer === BLACK ? '黑棋' : '白棋'}获胜！`, 'win');
                    undoButton.disabled = true;
                    return;
                }
                
                // 检查平局
                if (checkDraw()) {
                    gameOver = true;
                    updateMessage('游戏平局！', 'win');
                    undoButton.disabled = true;
                    return;
                }
                
                // 切换玩家
                currentPlayer = currentPlayer === BLACK ? WHITE : BLACK;
                updatePlayerIndicators();
                updateMessage('');
            }
            
            // 检查是否获胜
            function checkWin(row, col) {
                const player = board[row][col];
                
                // 检查四个方向：水平、垂直、对角线、反对角线
                const directions = [
                    [{r: 0, c: 1}, {r: 0, c: -1}],  // 水平
                    [{r: 1, c: 0}, {r: -1, c: 0}],  // 垂直
                    [{r: 1, c: 1}, {r: -1, c: -1}], // 对角线
                    [{r: 1, c: -1}, {r: -1, c: 1}]  // 反对角线
                ];
                
                for (const [dir1, dir2] of directions) {
                    let count = 1;  // 当前位置已经有一个棋子
                    
                    // 检查第一个方向
                    count += countConsecutive(row, col, dir1[0], dir1[1], player);
                    
                    // 检查相反方向
                    count += countConsecutive(row, col, dir2[0], dir2[1], player);
                    
                    if (count >= 5) {
                        return true;
                    }
                }
                
                return false;
            }
            
            // 计算连续同色棋子数量
            function countConsecutive(row, col, rowDir, colDir, player) {
                let count = 0;
                let r = row + rowDir;
                let c = col + colDir;
                
                while (r >= 0 && r < BOARD_SIZE && c >= 0 && c < BOARD_SIZE && board[r][c] === player) {
                    count++;
                    r += rowDir;
                    c += colDir;
                }
                
                return count;
            }
            
            // 检查是否平局
            function checkDraw() {
                for (let row = 0; row < BOARD_SIZE; row++) {
                    for (let col = 0; col < BOARD_SIZE; col++) {
                        if (board[row][col] === EMPTY) {
                            return false;
                        }
                    }
                }
                return true;
            }
            
            // 悔棋
            function undoMove() {
                if (moveHistory.length === 0 || gameOver) {
                    updateMessage('没有可以悔棋的步骤', 'error');
                    return;
                }
                
                const lastMove = moveHistory.pop();
                board[lastMove.row][lastMove.col] = EMPTY;
                currentPlayer = lastMove.player;
                
                renderBoard();
                updatePlayerIndicators();
                updateMessage('');
            }
            
            // 更新玩家指示器
            function updatePlayerIndicators() {
                const player1Indicator = document.querySelector('.player1-indicator');
                const player2Indicator = document.querySelector('.player2-indicator');
                
                if (currentPlayer === BLACK) {
                    player1Indicator.style.boxShadow = '0 0 8px 2px rgba(0, 0, 0, 0.5)';
                    player2Indicator.style.boxShadow = 'none';
                } else {
                    player1Indicator.style.boxShadow = 'none';
                    player2Indicator.style.boxShadow = '0 0 8px 2px rgba(0, 0, 0, 0.5)';
                }
            }
            
            // 更新消息
            function updateMessage(text, type = '') {
                messageElement.textContent = text;
                messageElement.className = 'message';
                if (type) {
                    messageElement.classList.add(`${type}-message`);
                }
            }
            
            // 事件监听
            undoButton.addEventListener('click', undoMove);
            restartButton.addEventListener('click', initGame);
            
            // 初始化游戏
            initGame();
        });
    </script>
</body>
</html>
